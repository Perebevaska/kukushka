<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-project-flow">
  <title id="t-project-flow">Путь проекта: от трёх файлов до блокнота в портфолио</title>
  <defs><marker id="ah-project-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="20" width="130" height="38" rx="6"/>
  <text class="ink sm b" x="79" y="37" text-anchor="middle">orders_3m.csv</text>
  <text class="ink2 sm" x="79" y="52" text-anchor="middle">2 089 заказов</text>
  <path class="ln" d="M146,39 L186,84" marker-end="url(#ah-project-flow)"/>
  <rect class="box" x="14" y="64" width="130" height="38" rx="6"/>
  <text class="ink sm b" x="79" y="81" text-anchor="middle">shops.csv</text>
  <text class="ink2 sm" x="79" y="96" text-anchor="middle">кофейни</text>
  <path class="ln" d="M146,83 L186,84" marker-end="url(#ah-project-flow)"/>
  <rect class="box" x="14" y="108" width="130" height="38" rx="6"/>
  <text class="ink sm b" x="79" y="125" text-anchor="middle">menu.csv</text>
  <text class="ink2 sm" x="79" y="140" text-anchor="middle">меню, 11 позиций</text>
  <path class="ln" d="M146,127 L186,84" marker-end="url(#ah-project-flow)"/>
  <rect class="box-acc" x="190" y="56" width="120" height="56" rx="8"/>
  <text class="acc sm b" x="250" y="78" text-anchor="middle">шаг 1</text>
  <text class="ink2 sm" x="250" y="96" text-anchor="middle">merge + validate</text>
  <path class="ln" d="M312,84 L340,84" marker-end="url(#ah-project-flow)"/>
  <rect class="box" x="344" y="62" width="74" height="44" rx="8"/>
  <text class="ink b" x="381" y="82" text-anchor="middle">full</text>
  <text class="ink2 sm" x="381" y="98" text-anchor="middle">2 089 строк</text>
  <path class="ln" d="M420,84 L446,84" marker-end="url(#ah-project-flow)"/>
  <rect class="box" x="450" y="14" width="236" height="140" rx="8"/>
  <text class="ink sm b" x="568" y="34" text-anchor="middle">шаги 2–7: по гипотезе</text>
  <text class="acc sm b" x="466" y="56" text-anchor="start">H1</text>
  <text class="ink2 sm" x="494" y="56" text-anchor="start">выручка по месяцам</text>
  <text class="acc sm b" x="466" y="72" text-anchor="start">H2</text>
  <text class="ink2 sm" x="494" y="72" text-anchor="start">кофейни и места</text>
  <text class="acc sm b" x="466" y="88" text-anchor="start">H3</text>
  <text class="ink2 sm" x="494" y="88" text-anchor="start">сезонный напиток</text>
  <text class="acc sm b" x="466" y="104" text-anchor="start">H4</text>
  <text class="ink2 sm" x="494" y="104" text-anchor="start">с картой и без</text>
  <text class="acc sm b" x="466" y="120" text-anchor="start">H5</text>
  <text class="ink2 sm" x="494" y="120" text-anchor="start">часы пик</text>
  <text class="acc sm b" x="466" y="136" text-anchor="start">H6</text>
  <text class="ink2 sm" x="494" y="136" text-anchor="start">маржа категорий</text>
  <path class="ln" d="M568,156 L568,176" marker-end="url(#ah-project-flow)"/>
  <rect class="box-ok" x="450" y="180" width="236" height="36" rx="8"/>
  <text class="ink sm b" x="568" y="203" text-anchor="middle">шаг 8 вердикты · шаг 9 сводка</text>
  <path class="ln" d="M448,198 L404,198" marker-end="url(#ah-project-flow)"/>
  <rect class="box-warn" x="190" y="180" width="210" height="36" rx="8"/>
  <text class="ink sm b" x="295" y="203" text-anchor="middle">блокнот по шаблону</text>
  <path class="ln" d="M188,198 L148,198" marker-end="url(#ah-project-flow)"/>
  <rect class="box" x="14" y="180" width="130" height="36" rx="8"/>
  <text class="ink sm b" x="79" y="196" text-anchor="middle">Restart &amp; Run All</text>
  <text class="ink2 sm" x="79" y="210" text-anchor="middle">check_notebook.py</text>
  <text class="mut sm" x="350" y="246" text-anchor="middle">с шага 2 курс сам собирает full перед задачей — ошибка на одном шаге не ломает следующие</text>
</svg>
