<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-transpose-eye">
  <title id="t-transpose-eye">Транспонирование A.T и умножение на единичную матрицу np.eye(2)</title>
  <defs><marker id="ah-transpose-eye" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="170" y="24" text-anchor="middle">A.T: строки становятся столбцами</text>
  <rect class="box-acc" x="78" y="64" width="37" height="27" rx="3"/>
  <text class="acc b" x="96.5" y="82.0" text-anchor="middle">1</text>
  <rect class="box-acc" x="118" y="64" width="37" height="27" rx="3"/>
  <text class="acc b" x="136.5" y="82.0" text-anchor="middle">2</text>
  <rect class="box-ok" x="78" y="94" width="37" height="27" rx="3"/>
  <text class="ok b" x="96.5" y="112.0" text-anchor="middle">3</text>
  <rect class="box-ok" x="118" y="94" width="37" height="27" rx="3"/>
  <text class="ok b" x="136.5" y="112.0" text-anchor="middle">4</text>
  <rect class="box-warn" x="78" y="124" width="37" height="27" rx="3"/>
  <text class="warn b" x="96.5" y="142.0" text-anchor="middle">5</text>
  <rect class="box-warn" x="118" y="124" width="37" height="27" rx="3"/>
  <text class="warn b" x="136.5" y="142.0" text-anchor="middle">6</text>
  <text class="ink b" x="116.5" y="52" text-anchor="middle">A</text>
  <text class="ink2 sm b" x="116.5" y="171" text-anchor="middle">3 × 2</text>
  <text class="mut sm" x="70" y="82.0" text-anchor="end">строка 0</text>
  <text class="mut sm" x="70" y="112.0" text-anchor="end">строка 1</text>
  <text class="mut sm" x="70" y="142.0" text-anchor="end">строка 2</text>
  <path class="ln" d="M165,109.0 L207,109.0" marker-end="url(#ah-transpose-eye)"/>
  <text class="ink sm b" x="186" y="101.0" text-anchor="middle">.T</text>
  <rect class="box-acc" x="219" y="79.0" width="43" height="27" rx="3"/>
  <text class="acc b" x="240.5" y="97.0" text-anchor="middle">1</text>
  <rect class="box-ok" x="265" y="79.0" width="43" height="27" rx="3"/>
  <text class="ok b" x="286.5" y="97.0" text-anchor="middle">3</text>
  <rect class="box-warn" x="311" y="79.0" width="43" height="27" rx="3"/>
  <text class="warn b" x="332.5" y="97.0" text-anchor="middle">5</text>
  <rect class="box-acc" x="219" y="109.0" width="43" height="27" rx="3"/>
  <text class="acc b" x="240.5" y="127.0" text-anchor="middle">2</text>
  <rect class="box-ok" x="265" y="109.0" width="43" height="27" rx="3"/>
  <text class="ok b" x="286.5" y="127.0" text-anchor="middle">4</text>
  <rect class="box-warn" x="311" y="109.0" width="43" height="27" rx="3"/>
  <text class="warn b" x="332.5" y="127.0" text-anchor="middle">6</text>
  <text class="ink b" x="286.5" y="67.0" text-anchor="middle">A.T</text>
  <text class="ink2 sm b" x="286.5" y="156.0" text-anchor="middle">2 × 3</text>
  <text class="mut sm" x="240.5" y="172.0" text-anchor="middle">0</text>
  <text class="mut sm" x="286.5" y="172.0" text-anchor="middle">1</text>
  <text class="mut sm" x="332.5" y="172.0" text-anchor="middle">2</text>
  <text class="mut sm" x="211" y="172.0" text-anchor="end">столбец</text>
  <text class="ink2 sm" x="170" y="236" text-anchor="middle">строка i матрицы A = столбец i матрицы A.T;</text>
  <text class="mut sm" x="170" y="254" text-anchor="middle">элемент A[2, 0] = 5 стоит в A.T[0, 2] = 5</text>
  <path class="ln-mut" d="M352,14 L352,290"/>
  <text class="ink b" x="526" y="24" text-anchor="middle">A @ np.eye(2) = A</text>
  <rect class="box" x="382" y="64" width="31" height="27" rx="3"/>
  <text class="ink" x="397.5" y="82.0" text-anchor="middle">1</text>
  <rect class="box" x="416" y="64" width="31" height="27" rx="3"/>
  <text class="ink" x="431.5" y="82.0" text-anchor="middle">2</text>
  <rect class="box-acc" x="382" y="94" width="31" height="27" rx="3"/>
  <text class="acc b" x="397.5" y="112.0" text-anchor="middle">3</text>
  <rect class="box-acc" x="416" y="94" width="31" height="27" rx="3"/>
  <text class="acc b" x="431.5" y="112.0" text-anchor="middle">4</text>
  <rect class="box" x="382" y="124" width="31" height="27" rx="3"/>
  <text class="ink" x="397.5" y="142.0" text-anchor="middle">5</text>
  <rect class="box" x="416" y="124" width="31" height="27" rx="3"/>
  <text class="ink" x="431.5" y="142.0" text-anchor="middle">6</text>
  <text class="ink b" x="414.5" y="52" text-anchor="middle">A</text>
  <text class="ink2 sm b" x="414.5" y="171" text-anchor="middle">3 × 2</text>
  <text class="ink b" x="461" y="113.0" text-anchor="middle">@</text>
  <rect class="box-ok" x="477" y="79.0" width="31" height="27" rx="3"/>
  <text class="ok b" x="492.5" y="97.0" text-anchor="middle">1</text>
  <rect class="box" x="511" y="79.0" width="31" height="27" rx="3"/>
  <text class="mut" x="526.5" y="97.0" text-anchor="middle">0</text>
  <rect class="box-ok" x="477" y="109.0" width="31" height="27" rx="3"/>
  <text class="ok b" x="492.5" y="127.0" text-anchor="middle">0</text>
  <rect class="box" x="511" y="109.0" width="31" height="27" rx="3"/>
  <text class="ink" x="526.5" y="127.0" text-anchor="middle">1</text>
  <text class="ink b" x="509.5" y="67.0" text-anchor="middle">np.eye(2)</text>
  <text class="ink2 sm b" x="509.5" y="156.0" text-anchor="middle">2 × 2</text>
  <text class="ink b" x="556" y="113.0" text-anchor="middle">=</text>
  <rect class="box" x="572" y="64" width="31" height="27" rx="3"/>
  <text class="ink" x="587.5" y="82.0" text-anchor="middle">1</text>
  <rect class="box" x="606" y="64" width="31" height="27" rx="3"/>
  <text class="ink" x="621.5" y="82.0" text-anchor="middle">2</text>
  <rect class="box-ok" x="572" y="94" width="31" height="27" rx="3"/>
  <text class="ok b" x="587.5" y="112.0" text-anchor="middle">3</text>
  <rect class="box" x="606" y="94" width="31" height="27" rx="3"/>
  <text class="ink" x="621.5" y="112.0" text-anchor="middle">4</text>
  <rect class="box" x="572" y="124" width="31" height="27" rx="3"/>
  <text class="ink" x="587.5" y="142.0" text-anchor="middle">5</text>
  <rect class="box" x="606" y="124" width="31" height="27" rx="3"/>
  <text class="ink" x="621.5" y="142.0" text-anchor="middle">6</text>
  <text class="ink b" x="604.5" y="52" text-anchor="middle">A</text>
  <text class="ink2 sm b" x="604.5" y="171" text-anchor="middle">3 × 2</text>
  <text class="ink2 sm" x="526" y="200" text-anchor="middle">клетка [1, 0]: строка (3, 4) · столбец (1, 0)</text>
  <text class="ok sm b" x="526" y="218" text-anchor="middle">= 3·1 + 4·0 = 3</text>
  <text class="ink2 sm" x="526" y="246" text-anchor="middle">единица на диагонали «выбирает» нужный элемент,</text>
  <text class="mut sm" x="526" y="263" text-anchor="middle">нули гасят остальные — A не меняется</text>
  <text class="ink2 sm b" x="526" y="286" text-anchor="middle">(3 × 2) @ (2 × 2) → (3 × 2)</text>
</svg>
