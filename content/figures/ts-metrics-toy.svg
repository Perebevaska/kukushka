<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ts-metrics-toy">
  <title id="t-ts-metrics-toy">MAE, RMSE, MAPE и WAPE на трёх часах: одни и те же ошибки, разные способы свести их в число</title>
  <defs><marker id="ah-ts-metrics-toy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="40" y="20" width="50" height="28" rx="3"/>
  <text class="ink2 sm b" x="65.0" y="39" text-anchor="middle">час</text>
  <rect class="box" x="96" y="20" width="70" height="28" rx="3"/>
  <text class="ink2 sm b" x="131.0" y="39" text-anchor="middle">факт</text>
  <rect class="box" x="172" y="20" width="80" height="28" rx="3"/>
  <text class="ink2 sm b" x="212.0" y="39" text-anchor="middle">прогноз</text>
  <rect class="box" x="258" y="20" width="80" height="28" rx="3"/>
  <text class="ink2 sm b" x="298.0" y="39" text-anchor="middle">ошибка</text>
  <rect class="box" x="344" y="20" width="90" height="28" rx="3"/>
  <text class="ink2 sm b" x="389.0" y="39" text-anchor="middle">|ошибка|</text>
  <rect class="box" x="440" y="20" width="90" height="28" rx="3"/>
  <text class="ink2 sm b" x="485.0" y="39" text-anchor="middle">ошибка²</text>
  <rect class="box" x="536" y="20" width="150" height="28" rx="3"/>
  <text class="ink2 sm b" x="611.0" y="39" text-anchor="middle">|ошибка| / факт</text>
  <rect class="box" x="40" y="54" width="50" height="30" rx="3"/>
  <text class="ink" x="65.0" y="74" text-anchor="middle">1</text>
  <rect class="box" x="96" y="54" width="70" height="30" rx="3"/>
  <text class="ink" x="131.0" y="74" text-anchor="middle">10</text>
  <rect class="box" x="172" y="54" width="80" height="30" rx="3"/>
  <text class="ink" x="212.0" y="74" text-anchor="middle">12</text>
  <rect class="box" x="258" y="54" width="80" height="30" rx="3"/>
  <text class="ink" x="298.0" y="74" text-anchor="middle">−2</text>
  <rect class="box" x="344" y="54" width="90" height="30" rx="3"/>
  <text class="ink" x="389.0" y="74" text-anchor="middle">2</text>
  <rect class="box" x="440" y="54" width="90" height="30" rx="3"/>
  <text class="ink" x="485.0" y="74" text-anchor="middle">4</text>
  <rect class="box" x="536" y="54" width="150" height="30" rx="3"/>
  <text class="ink" x="611.0" y="74" text-anchor="middle">0.2</text>
  <rect class="box" x="40" y="90" width="50" height="30" rx="3"/>
  <text class="ink" x="65.0" y="110" text-anchor="middle">2</text>
  <rect class="box" x="96" y="90" width="70" height="30" rx="3"/>
  <text class="ink" x="131.0" y="110" text-anchor="middle">0</text>
  <rect class="box" x="172" y="90" width="80" height="30" rx="3"/>
  <text class="ink" x="212.0" y="110" text-anchor="middle">1</text>
  <rect class="box" x="258" y="90" width="80" height="30" rx="3"/>
  <text class="ink" x="298.0" y="110" text-anchor="middle">−1</text>
  <rect class="box" x="344" y="90" width="90" height="30" rx="3"/>
  <text class="ink" x="389.0" y="110" text-anchor="middle">1</text>
  <rect class="box" x="440" y="90" width="90" height="30" rx="3"/>
  <text class="ink" x="485.0" y="110" text-anchor="middle">1</text>
  <rect class="box-err" x="536" y="90" width="150" height="30" rx="3"/>
  <text class="err sm b" x="611.0" y="110" text-anchor="middle">÷ 0 — нельзя</text>
  <rect class="box" x="40" y="126" width="50" height="30" rx="3"/>
  <text class="ink" x="65.0" y="146" text-anchor="middle">3</text>
  <rect class="box" x="96" y="126" width="70" height="30" rx="3"/>
  <text class="ink" x="131.0" y="146" text-anchor="middle">20</text>
  <rect class="box" x="172" y="126" width="80" height="30" rx="3"/>
  <text class="ink" x="212.0" y="146" text-anchor="middle">18</text>
  <rect class="box" x="258" y="126" width="80" height="30" rx="3"/>
  <text class="ink" x="298.0" y="146" text-anchor="middle">+2</text>
  <rect class="box" x="344" y="126" width="90" height="30" rx="3"/>
  <text class="ink" x="389.0" y="146" text-anchor="middle">2</text>
  <rect class="box" x="440" y="126" width="90" height="30" rx="3"/>
  <text class="ink" x="485.0" y="146" text-anchor="middle">4</text>
  <rect class="box" x="536" y="126" width="150" height="30" rx="3"/>
  <text class="ink" x="611.0" y="146" text-anchor="middle">0.1</text>
  <text class="ink2 b" x="65" y="182" text-anchor="middle">Σ</text>
  <rect class="box-acc" x="96" y="162" width="70" height="30" rx="3"/>
  <text class="ink b" x="131.0" y="182" text-anchor="middle">30</text>
  <rect class="box-acc" x="344" y="162" width="90" height="30" rx="3"/>
  <text class="ink b" x="389.0" y="182" text-anchor="middle">5</text>
  <rect class="box-acc" x="440" y="162" width="90" height="30" rx="3"/>
  <text class="ink b" x="485.0" y="182" text-anchor="middle">9</text>
  <rect class="box-ok" x="40" y="214" width="150" height="52" rx="5"/>
  <text class="ink sm b" x="115" y="235" text-anchor="middle">MAE</text>
  <text class="ink sm" x="115" y="255" text-anchor="middle">5 / 3 ≈ 1.67</text>
  <rect class="box-ok" x="200" y="214" width="150" height="52" rx="5"/>
  <text class="ink sm b" x="275" y="235" text-anchor="middle">RMSE</text>
  <text class="ink sm" x="275" y="255" text-anchor="middle">√(9 / 3) ≈ 1.73</text>
  <rect class="box-err" x="360" y="214" width="150" height="52" rx="5"/>
  <text class="ink sm b" x="435" y="235" text-anchor="middle">MAPE</text>
  <text class="ink sm" x="435" y="255" text-anchor="middle">не считается</text>
  <rect class="box-ok" x="520" y="214" width="150" height="52" rx="5"/>
  <text class="ink sm b" x="595" y="235" text-anchor="middle">WAPE</text>
  <text class="ink sm" x="595" y="255" text-anchor="middle">5 / 30 ≈ 0.17</text>
  <text class="mut sm" x="350" y="288" text-anchor="middle">MAE и RMSE — в заказах, WAPE — доля: сумма |ошибок| делится на сумму факта</text>
</svg>
