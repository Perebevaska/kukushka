<svg viewBox="0 0 700 346" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-project-report-main">
  <title id="t-project-report-main">Блокнот-отчёт проекта: главное сразу после цели, журнал очистки ниже, самопроверка перед сдачей</title>
  <defs><marker id="ah-project-report-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20" y="14" width="470" height="38" rx="5"/>
  <text class="ink b" x="36" y="38" text-anchor="start">1. Цель</text>
  <text class="ink2 sm" x="474" y="30" text-anchor="end">вопрос руководителя + метрика: доля</text>
  <text class="ink2 sm" x="474" y="45" text-anchor="end">доставок позже обещанного</text>
  <rect class="box-ok" x="36" y="58" width="454" height="38" rx="5"/>
  <text class="ink b" x="50" y="82" text-anchor="start">Главное</text>
  <text class="ink2 sm" x="474" y="74" text-anchor="end">2–3 фразы: масштаб (24.0 % опозданий)</text>
  <text class="ink2 sm" x="474" y="89" text-anchor="end">и главная причина — читают все</text>
  <rect class="box" x="20" y="104" width="470" height="38" rx="5"/>
  <text class="ink b" x="36" y="128" text-anchor="start">2. Данные</text>
  <text class="ink2 sm" x="474" y="120" text-anchor="end">загрузка deliveries.csv по</text>
  <text class="ink2 sm" x="474" y="135" text-anchor="end">относительному пути</text>
  <rect class="box" x="20" y="150" width="470" height="38" rx="5"/>
  <text class="ink b" x="36" y="174" text-anchor="start">3. Предобработка</text>
  <text class="ink2 sm" x="474" y="166" text-anchor="end">журнал очистки таблицей: 1 877 → 1 841</text>
  <text class="ink2 sm" x="474" y="181" text-anchor="end">ответ на «а вы ничего не выбросили?»</text>
  <rect class="box-acc" x="20" y="196" width="470" height="38" rx="5"/>
  <text class="ink b" x="36" y="220" text-anchor="start">4. Анализ</text>
  <text class="ink2 sm" x="474" y="212" text-anchor="end">шаги 2–8: код → график с</text>
  <text class="ink2 sm" x="474" y="227" text-anchor="end">заголовком-выводом → markdown-вывод</text>
  <rect class="box" x="20" y="242" width="470" height="38" rx="5"/>
  <text class="ink b" x="36" y="266" text-anchor="start">5. Выводы</text>
  <text class="ink2 sm" x="474" y="258" text-anchor="end">все находки по важности; варианты</text>
  <text class="ink2 sm" x="474" y="273" text-anchor="end">действий с цифрами; ограничения</text>
  <rect class="box-warn" x="520" y="14" width="160" height="266" rx="8"/>
  <text class="ink b" x="600" y="40" text-anchor="middle">самопроверка</text>
  <text class="acc sm b" x="600" y="76" text-anchor="middle">Restart Kernel</text>
  <text class="acc sm b" x="600" y="98" text-anchor="middle">and Run All Cells</text>
  <text class="acc sm b" x="600" y="146" text-anchor="middle">check_notebook.py</text>
  <text class="ink2 sm" x="600" y="172" text-anchor="middle">до пустого списка:</text>
  <text class="ink2 sm" x="600" y="194" text-anchor="middle">ошибки, пути,</text>
  <text class="ink2 sm" x="600" y="216" text-anchor="middle">разделы без вывода</text>
  <path class="ln" d="M500,147 L516,147" marker-end="url(#ah-project-report-main)"/>
  <text class="ink2 sm" x="255" y="308" text-anchor="middle">Проверка перед сдачей: прочитайте только markdown-ячейки —</text>
  <text class="ink2 sm" x="255" y="328" text-anchor="middle">понятен ли отчёт без кода и видно ли главное в самом начале?</text>
</svg>
