<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-batch-vs-online">
  <title id="t-batch-vs-online">Одна модель, две обвязки: пакетный расчёт по расписанию и онлайн-сервис на каждый запрос</title>
  <defs><marker id="ah-batch-vs-online" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="14" y="34" text-anchor="start">пакетный</text>
  <text class="ink2 sm" x="14" y="52" text-anchor="start">каждый понедельник</text>
  <rect class="box" x="170" y="24" width="140" height="50" rx="6"/>
  <text class="ink sm b" x="240.0" y="44.5" text-anchor="middle">выгрузка</text>
  <text class="ink2 sm" x="240.0" y="62.5" text-anchor="middle">все гости</text>
  <path class="ln" d="M312,49 L338,49" marker-end="url(#ah-batch-vs-online)"/>
  <rect class="box-acc" x="340" y="24" width="140" height="50" rx="6"/>
  <text class="ink sm b" x="410.0" y="44.5" text-anchor="middle">модель</text>
  <text class="ink2 sm" x="410.0" y="62.5" text-anchor="middle">predict_proba</text>
  <path class="ln" d="M482,49 L508,49" marker-end="url(#ah-batch-vs-online)"/>
  <rect class="box" x="510" y="24" width="140" height="50" rx="6"/>
  <text class="ink sm b" x="580.0" y="44.5" text-anchor="middle">список</text>
  <text class="ink2 sm" x="580.0" y="62.5" text-anchor="middle">в CRM</text>
  <text class="ink b" x="14" y="134" text-anchor="start">онлайн</text>
  <text class="ink2 sm" x="14" y="152" text-anchor="start">на каждый запрос</text>
  <rect class="box" x="170" y="124" width="116" height="50" rx="6"/>
  <text class="ink sm b" x="228.0" y="144.5" text-anchor="middle">приложение</text>
  <text class="ink2 sm" x="228.0" y="162.5" text-anchor="middle">один гость, JSON</text>
  <path class="ln" d="M288,149 L298,149" marker-end="url(#ah-batch-vs-online)"/>
  <rect class="box-warn" x="300" y="124" width="116" height="50" rx="6"/>
  <text class="ink sm b" x="358.0" y="144.5" text-anchor="middle">проверка</text>
  <text class="ink2 sm" x="358.0" y="162.5" text-anchor="middle">→ 422 при ошибке</text>
  <path class="ln" d="M418,149 L428,149" marker-end="url(#ah-batch-vs-online)"/>
  <rect class="box-acc" x="430" y="124" width="116" height="50" rx="6"/>
  <text class="ink sm b" x="488.0" y="144.5" text-anchor="middle">модель</text>
  <text class="ink2 sm" x="488.0" y="162.5" text-anchor="middle">тот же конвейер</text>
  <path class="ln" d="M548,149 L558,149" marker-end="url(#ah-batch-vs-online)"/>
  <rect class="box" x="560" y="124" width="116" height="50" rx="6"/>
  <text class="ink sm b" x="618.0" y="144.5" text-anchor="middle">ответ</text>
  <text class="ink2 sm" x="618.0" y="162.5" text-anchor="middle">JSON за мс</text>
  <text class="ink2 sm" x="350" y="208" text-anchor="middle">пакетный: важно, чтобы отработал до утра и не задвоил; онлайн: чтобы ответил быстро и не упал</text>
  <text class="mut sm" x="350" y="228" text-anchor="middle">если решение не нужно «здесь и сейчас» — считайте пакетом: на гостя в разы дешевле</text>
</svg>
