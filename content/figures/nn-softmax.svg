<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-softmax">
  <title id="t-nn-softmax">Softmax: логиты → экспоненты → доли от суммы; кросс-энтропия берёт вероятность правильного класса</title>
  <defs><marker id="ah-nn-softmax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="120" y="30" text-anchor="middle">логиты z</text>
  <rect class="box" x="70" y="44" width="100" height="32" rx="6"/>
  <text class="ink sm" x="120" y="65" text-anchor="middle">2</text>
  <rect class="box" x="70" y="84" width="100" height="32" rx="6"/>
  <text class="ink sm" x="120" y="105" text-anchor="middle">1</text>
  <rect class="box" x="70" y="124" width="100" height="32" rx="6"/>
  <text class="ink sm" x="120" y="145" text-anchor="middle">0.1</text>
  <text class="ink sm b" x="290" y="30" text-anchor="middle">eᶻ</text>
  <rect class="box-warn" x="240" y="44" width="100" height="32" rx="6"/>
  <text class="ink sm" x="290" y="65" text-anchor="middle">7.389</text>
  <rect class="box-warn" x="240" y="84" width="100" height="32" rx="6"/>
  <text class="ink sm" x="290" y="105" text-anchor="middle">2.718</text>
  <rect class="box-warn" x="240" y="124" width="100" height="32" rx="6"/>
  <text class="ink sm" x="290" y="145" text-anchor="middle">1.105</text>
  <text class="ink sm b" x="480" y="30" text-anchor="middle">p = eᶻ / сумма</text>
  <rect class="box-ok" x="430" y="44" width="100" height="32" rx="6"/>
  <text class="ink sm b" x="480" y="65" text-anchor="middle">0.659</text>
  <rect class="box-acc" x="430" y="84" width="100" height="32" rx="6"/>
  <text class="ink sm" x="480" y="105" text-anchor="middle">0.242</text>
  <rect class="box-acc" x="430" y="124" width="100" height="32" rx="6"/>
  <text class="ink sm" x="480" y="145" text-anchor="middle">0.099</text>
  <text class="mut sm" x="10" y="65" text-anchor="start">класс 0</text>
  <path class="ln" d="M172,60 L238,60" marker-end="url(#ah-nn-softmax)"/>
  <path class="ln" d="M342,60 L428,60" marker-end="url(#ah-nn-softmax)"/>
  <text class="mut sm" x="10" y="105" text-anchor="start">класс 1</text>
  <path class="ln" d="M172,100 L238,100" marker-end="url(#ah-nn-softmax)"/>
  <path class="ln" d="M342,100 L428,100" marker-end="url(#ah-nn-softmax)"/>
  <text class="mut sm" x="10" y="145" text-anchor="start">класс 2</text>
  <path class="ln" d="M172,140 L238,140" marker-end="url(#ah-nn-softmax)"/>
  <path class="ln" d="M342,140 L428,140" marker-end="url(#ah-nn-softmax)"/>
  <text class="mut sm" x="205" y="50" text-anchor="middle">exp</text>
  <text class="ink2 sm b" x="290" y="186" text-anchor="middle">сумма = 11.21</text>
  <text class="mut sm" x="385" y="50" text-anchor="middle">÷ сумма</text>
  <text class="ink2 sm" x="480" y="186" text-anchor="middle">сумма p = 1</text>
  <path class="ln" d="M532,60 L566,60" marker-end="url(#ah-nn-softmax)"/>
  <rect class="box-err" x="568" y="40" width="122" height="40" rx="8"/>
  <text class="ink sm" x="629" y="58" text-anchor="middle">правильный 0:</text>
  <text class="ink sm b" x="629" y="74" text-anchor="middle">−log 0.659 = 0.42</text>
  <text class="mut sm" x="350" y="222" text-anchor="middle">вычитание максимума из логитов не меняет p: множитель e⁻ᵐᵃˣ сокращается в дроби</text>
  <text class="mut sm" x="350" y="242" text-anchor="middle">порядок сохраняется: больший логит → большая вероятность</text>
</svg>
