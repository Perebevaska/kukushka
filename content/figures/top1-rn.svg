<svg viewBox="0 0 700 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-top1-rn">
  <title id="t-top1-rn">ROW_NUMBER нумерует строки внутри каждой кофейни, фильтр rn = 1 оставляет лидера</title>
