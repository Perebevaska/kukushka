<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-dict-get">
  <title id="t-dict-get">Словарь: значение по ключу, KeyError и get</title>
  <defs><marker id="ah-dict-get" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="110" y="30" text-anchor="middle">prices</text>
  <rect class="box" x="30" y="40" width="160" height="24" rx="3"/>
  <text class="ink2 sm b" x="75.0" y="56.5" text-anchor="middle">ключ</text>
  <text class="ink2 sm b" x="155.0" y="56.5" text-anchor="middle">значение</text>
  <rect class="box-acc" x="30" y="66" width="160" height="24" rx="3"/>
  <text class="ink sm" x="75.0" y="82.5" text-anchor="middle">Латте</text>
  <text class="ink sm" x="155.0" y="82.5" text-anchor="middle">210</text>
  <rect class="box" x="30" y="92" width="160" height="24" rx="3"/>
  <text class="ink sm" x="75.0" y="108.5" text-anchor="middle">Капучино</text>
  <text class="ink sm" x="155.0" y="108.5" text-anchor="middle">190</text>
  <text class="ink sm b" x="206" y="50" text-anchor="start">prices["Латте"]</text>
  <path class="ln-mut" d="M358,45 L384,45" marker-end="url(#ah-dict-get)"/>
  <rect class="box-ok" x="388" y="30" width="86" height="30" rx="4"/>
  <text class="ink sm b" x="431" y="50" text-anchor="middle">210</text>
  <text class="ink2 sm" x="484" y="50" text-anchor="start">ключ есть — значение</text>
  <text class="ink sm b" x="206" y="90" text-anchor="start">prices["Раф"]</text>
  <path class="ln-mut" d="M358,85 L384,85" marker-end="url(#ah-dict-get)"/>
  <rect class="box-err" x="388" y="70" width="86" height="30" rx="4"/>
  <text class="err sm b" x="431" y="90" text-anchor="middle">KeyError</text>
  <text class="ink2 sm" x="484" y="90" text-anchor="start">нет ключа — программа падает</text>
  <text class="ink sm b" x="206" y="130" text-anchor="start">prices.get("Раф", 0)</text>
  <path class="ln-mut" d="M358,125 L384,125" marker-end="url(#ah-dict-get)"/>
  <rect class="box-ok" x="388" y="110" width="86" height="30" rx="4"/>
  <text class="ink sm b" x="431" y="130" text-anchor="middle">0</text>
  <text class="ink2 sm" x="484" y="130" text-anchor="start">нет ключа — запасное значение</text>
  <text class="ink sm b" x="206" y="170" text-anchor="start">prices.get("Раф")</text>
  <path class="ln-mut" d="M358,165 L384,165" marker-end="url(#ah-dict-get)"/>
  <rect class="box-warn" x="388" y="150" width="86" height="30" rx="4"/>
  <text class="ink sm b" x="431" y="170" text-anchor="middle">None</text>
  <text class="ink2 sm" x="484" y="170" text-anchor="start">нет второго аргумента — None</text>
  <text class="ink sm b" x="206" y="210" text-anchor="start">"Раф" in prices</text>
  <path class="ln-mut" d="M358,205 L384,205" marker-end="url(#ah-dict-get)"/>
  <rect class="box" x="388" y="190" width="86" height="30" rx="4"/>
  <text class="ink sm b" x="431" y="210" text-anchor="middle">False</text>
  <text class="ink2 sm" x="484" y="210" text-anchor="start">проверка ключа: True / False</text>
  <text class="mut sm" x="30" y="136" text-anchor="start">ищется ключ,</text>
  <text class="mut sm" x="30" y="152" text-anchor="start">а не значение</text>
</svg>
