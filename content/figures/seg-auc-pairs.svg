<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-seg-auc-pairs">
  <title id="t-seg-auc-pairs">Все пары «договор — не договор»: внутри каналов и между ними</title>
  <defs><marker id="ah-seg-auc-pairs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="244.0" y="26" text-anchor="middle">не договор →</text>
  <text class="ink2 sm b" x="120" y="52" text-anchor="end">договор ↓</text>
  <text class="ink sm b" x="168.0" y="52" text-anchor="middle">0.50 Р</text>
  <text class="ink sm b" x="244.0" y="52" text-anchor="middle">0.20 С</text>
  <text class="ink sm b" x="320.0" y="52" text-anchor="middle">0.05 С</text>
  <text class="ink sm b" x="120" y="90.0" text-anchor="end">0.60 Р</text>
  <rect class="box-acc" x="132" y="66" width="72" height="40" rx="4"/>
  <text class="ok b" x="168.0" y="91.0" text-anchor="middle">✓</text>
  <rect class="box" x="208" y="66" width="72" height="40" rx="4"/>
  <text class="ok b" x="244.0" y="91.0" text-anchor="middle">✓</text>
  <rect class="box" x="284" y="66" width="72" height="40" rx="4"/>
  <text class="ok b" x="320.0" y="91.0" text-anchor="middle">✓</text>
  <text class="ink sm b" x="120" y="134.0" text-anchor="end">0.40 Р</text>
  <rect class="box-acc" x="132" y="110" width="72" height="40" rx="4"/>
  <text class="err b" x="168.0" y="135.0" text-anchor="middle">✗</text>
  <rect class="box" x="208" y="110" width="72" height="40" rx="4"/>
  <text class="ok b" x="244.0" y="135.0" text-anchor="middle">✓</text>
  <rect class="box" x="284" y="110" width="72" height="40" rx="4"/>
  <text class="ok b" x="320.0" y="135.0" text-anchor="middle">✓</text>
  <text class="ink sm b" x="120" y="178.0" text-anchor="end">0.10 С</text>
  <rect class="box" x="132" y="154" width="72" height="40" rx="4"/>
  <text class="err b" x="168.0" y="179.0" text-anchor="middle">✗</text>
  <rect class="box-acc" x="208" y="154" width="72" height="40" rx="4"/>
  <text class="err b" x="244.0" y="179.0" text-anchor="middle">✗</text>
  <rect class="box-acc" x="284" y="154" width="72" height="40" rx="4"/>
  <text class="ok b" x="320.0" y="179.0" text-anchor="middle">✓</text>
  <text class="mut sm" x="244.0" y="218" text-anchor="middle">Р — рекомендация, С — соцсети</text>
  <rect class="box-acc" x="130" y="230" width="14" height="14" rx="2"/>
  <text class="ink2 sm" x="150" y="242" text-anchor="start">пара внутри одного канала</text>
  <text class="ink sm" x="400" y="70" text-anchor="start">внутри рекомендаций: 1 из 2 верно → AUC 0.5</text>
  <text class="ink sm" x="400" y="94" text-anchor="start">внутри соцсетей: 1 из 2 верно → AUC 0.5</text>
  <text class="ink sm" x="400" y="118" text-anchor="start">между каналами: 4 из 5 верно</text>
  <text class="ink b" x="400" y="150" text-anchor="start">все вместе: 6 из 9 → AUC 0.67</text>
  <text class="ink2 sm" x="400" y="186" text-anchor="start">общий AUC выше любого сегментного:</text>
  <text class="ink2 sm" x="400" y="206" text-anchor="start">модель «зарабатывает» его, отличая</text>
  <text class="ink2 sm" x="400" y="226" text-anchor="start">каналы, а не заявки внутри канала</text>
</svg>
