<svg viewBox="0 0 700 306" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cohort-reconcile">
  <title id="t-cohort-reconcile">Сверка: матрица когорт двумя независимыми способами</title>
  <defs><marker id="ah-cohort-reconcile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="acc b" x="120" y="26" text-anchor="middle">pandas</text>
  <rect class="box" x="20" y="38" width="200" height="28" rx="4"/>
  <text class="ink sm" x="120" y="56" text-anchor="middle">transform("min") по гостю</text>
  <rect class="box" x="20" y="76" width="200" height="28" rx="4"/>
  <text class="ink sm" x="120" y="94" text-anchor="middle">dt.to_period("M") → когорта</text>
  <path class="ln" d="M120,66 L120,75" marker-end="url(#ah-cohort-reconcile)"/>
  <rect class="box" x="20" y="114" width="200" height="28" rx="4"/>
  <text class="ink sm" x="120" y="132" text-anchor="middle">год × 12 + месяц → age</text>
  <path class="ln" d="M120,104 L120,113" marker-end="url(#ah-cohort-reconcile)"/>
  <rect class="box" x="20" y="152" width="200" height="28" rx="4"/>
  <text class="ink sm" x="120" y="170" text-anchor="middle">pivot_table(nunique)</text>
  <path class="ln" d="M120,142 L120,151" marker-end="url(#ah-cohort-reconcile)"/>
  <text class="acc b" x="350" y="26" text-anchor="middle">DuckDB (SQL)</text>
  <rect class="box" x="250" y="38" width="200" height="28" rx="4"/>
  <text class="ink sm" x="350" y="56" text-anchor="middle">CTE: MIN(date) GROUP BY guest</text>
  <rect class="box" x="250" y="76" width="200" height="28" rx="4"/>
  <text class="ink sm" x="350" y="94" text-anchor="middle">date_trunc('month', first)</text>
  <path class="ln" d="M350,66 L350,75" marker-end="url(#ah-cohort-reconcile)"/>
  <rect class="box" x="250" y="114" width="200" height="28" rx="4"/>
  <text class="ink sm" x="350" y="132" text-anchor="middle">date_diff('month', …)</text>
  <path class="ln" d="M350,104 L350,113" marker-end="url(#ah-cohort-reconcile)"/>
  <rect class="box" x="250" y="152" width="200" height="28" rx="4"/>
  <text class="ink sm" x="350" y="170" text-anchor="middle">COUNT(DISTINCT guest_id)</text>
  <path class="ln" d="M350,142 L350,151" marker-end="url(#ah-cohort-reconcile)"/>
  <path class="ln" d="M120,180 L120,189" marker-end="url(#ah-cohort-reconcile)"/>
  <rect class="box-warn" x="20" y="190" width="200" height="28" rx="4"/>
  <text class="ink sm" x="120" y="208" text-anchor="middle">Period → astype(str)</text>
  <path class="ln" d="M120,218 V232 H588"/>
  <path class="ln" d="M350,180 L350,189" marker-end="url(#ah-cohort-reconcile)"/>
  <rect class="box-warn" x="250" y="190" width="200" height="28" rx="4"/>
  <text class="ink sm" x="350" y="208" text-anchor="middle">дата → strftime("%Y-%m")</text>
  <path class="ln" d="M350,218 V232 H588"/>
  <path class="ln" d="M588,232 L588,220" marker-end="url(#ah-cohort-reconcile)"/>
  <text class="mut sm" x="350" y="246" text-anchor="middle">оба индекса → "2026-01", пустые клетки → 0</text>
  <rect class="box-ok" x="490" y="40" width="196" height="176" rx="6"/>
  <text class="acc sm b" x="588" y="62" text-anchor="middle">a.sub(b, fill_value=0)</text>
  <text class="ink sm" x="506" y="94" text-anchor="start">✓ форма: 6×6 и 6×6</text>
  <text class="ink sm" x="506" y="122" text-anchor="start">✓ ячеек с разницей: 0</text>
  <text class="ink sm" x="506" y="150" text-anchor="start">✓ месяц 0: 2 210 и 2 210</text>
  <text class="ink sm" x="506" y="178" text-anchor="start">✓ всего гостей: 2 210</text>
  <text class="ok sm b" x="588" y="204" text-anchor="middle">матрице можно верить</text>
  <text class="ink2 sm" x="350" y="274" text-anchor="middle">fill_value=0 в обоих pivot_table и в sub: лишний месяц жизни даст разницу, а не спрячется в NaN</text>
  <text class="mut sm" x="350" y="296" text-anchor="middle">Сумма столбца 0 — контрольная: каждый гость попадает в месяц 0 своей когорты ровно один раз</text>
</svg>
