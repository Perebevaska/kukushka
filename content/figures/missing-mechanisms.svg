<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-missing-mechanisms">
  <title id="t-missing-mechanisms">MCAR, MAR и MNAR: от чего зависит пропуск и как он сдвигает среднее</title>
  <defs><marker id="ah-missing-mechanisms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="214" y="22" text-anchor="middle">что решает, пропадёт ли чек</text>
  <text class="mut sm b" x="560" y="22" text-anchor="middle">средний чек по известным, ₽</text>
  <rect class="box" x="10" y="44" width="132" height="56" rx="6"/>
  <text class="ink b" x="76.0" y="67.5" text-anchor="middle">MCAR</text>
  <text class="mut sm" x="76.0" y="85.5" text-anchor="middle">совсем случайно</text>
  <rect class="box" x="152" y="50" width="150" height="44" rx="6"/>
  <text class="ink sm" x="227.0" y="68.5" text-anchor="middle">случай: сбой кассы</text>
  <text class="mut sm" x="227.0" y="84.5" text-anchor="middle">ни от чего</text>
  <path class="ln" d="M304,72 L322,72" marker-end="url(#ah-missing-mechanisms)"/>
  <rect class="box" x="324" y="54" width="92" height="36" rx="6"/>
  <text class="ink sm" x="370.0" y="76.5" text-anchor="middle">пропало 30 %</text>
  <path class="ln-mut" d="M440,72 L680,72"/>
  <circle class="box-ok" cx="640.3076923076922" cy="72" r="6"/>
  <text class="ok sm b" x="628.3076923076922" y="77" text-anchor="end">359.7</text>
  <rect class="box" x="10" y="118" width="132" height="56" rx="6"/>
  <text class="ink b" x="76.0" y="141.5" text-anchor="middle">MAR</text>
  <text class="mut sm" x="76.0" y="159.5" text-anchor="middle">зависит от известного</text>
  <rect class="box-acc" x="152" y="124" width="150" height="44" rx="6"/>
  <text class="ink sm" x="227.0" y="142.5" text-anchor="middle">город (он у нас есть)</text>
  <text class="mut sm" x="227.0" y="158.5" text-anchor="middle">можно учесть</text>
  <path class="ln" d="M304,146 L322,146" marker-end="url(#ah-missing-mechanisms)"/>
  <rect class="box" x="324" y="128" width="92" height="36" rx="6"/>
  <text class="ink sm" x="370.0" y="150.5" text-anchor="middle">пропало 31 %</text>
  <path class="ln-mut" d="M440,146 L680,146"/>
  <circle class="box-err" cx="489.84615384615364" cy="146" r="6"/>
  <text class="err sm b" x="489.84615384615364" y="168" text-anchor="middle">343.4</text>
  <path class="ln-acc" d="M497.84615384615364,146 L633.153846153846,146" marker-end="url(#ah-missing-mechanisms)"/>
  <circle class="box-acc" cx="642.153846153846" cy="146" r="6"/>
  <text class="acc sm b" x="630.153846153846" y="132" text-anchor="end">359.9</text>
  <rect class="box" x="10" y="192" width="132" height="56" rx="6"/>
  <text class="ink b" x="76.0" y="215.5" text-anchor="middle">MNAR</text>
  <text class="mut sm" x="76.0" y="233.5" text-anchor="middle">не случайно</text>
  <rect class="box-err" x="152" y="198" width="150" height="44" rx="6"/>
  <text class="ink sm" x="227.0" y="216.5" text-anchor="middle">сам чек (его не видно)</text>
  <text class="mut sm" x="227.0" y="232.5" text-anchor="middle">не видно в данных</text>
  <path class="ln" d="M304,220 L322,220" marker-end="url(#ah-missing-mechanisms)"/>
  <rect class="box" x="324" y="202" width="92" height="36" rx="6"/>
  <text class="ink sm" x="370.0" y="224.5" text-anchor="middle">пропало 33 %</text>
  <path class="ln-mut" d="M440,220 L680,220"/>
  <circle class="box-err" cx="518.4615384615385" cy="220" r="6"/>
  <text class="err sm b" x="518.4615384615385" y="242" text-anchor="middle">346.5</text>
  <path class="ln-acc" d="M526.4615384615385,220 L554.6923076923075,220" marker-end="url(#ah-missing-mechanisms)"/>
  <circle class="box-acc" cx="563.6923076923075" cy="220" r="6"/>
  <text class="acc sm b" x="563.6923076923075" y="206" text-anchor="middle">351.4</text>
  <path class="ln-acc dash" d="M649.5384615384614,36 V250"/>
  <text class="acc sm b" x="669.5384615384614" y="268" text-anchor="end">настоящее среднее 360.7</text>
  <text class="mut sm" x="10" y="288" text-anchor="start">красная точка — сдвиг; синяя стрелка — после заполнения средним своего города</text>
</svg>
