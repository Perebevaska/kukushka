<svg viewBox="0 0 700 272" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-while-steps">
  <title id="t-while-steps">while повторяет, пока условие истинно</title>
  <defs><marker id="ah-while-steps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="20" y="24" text-anchor="start">while stock &gt;= 5:  stock -= 3.5;  days += 1</text>
  <rect class="box-acc" x="40" y="68.0" width="62" height="156.0" rx="3"/>
  <text class="ink sm b" x="71.0" y="62.0" text-anchor="middle">26</text>
  <text class="mut sm" x="71.0" y="240" text-anchor="middle">старт</text>
  <rect class="box-acc" x="120" y="89.0" width="62" height="135.0" rx="3"/>
  <text class="ink sm b" x="151.0" y="83.0" text-anchor="middle">22.5</text>
  <text class="mut sm" x="151.0" y="240" text-anchor="middle">день 1</text>
  <rect class="box-acc" x="200" y="110.0" width="62" height="114.0" rx="3"/>
  <text class="ink sm b" x="231.0" y="104.0" text-anchor="middle">19</text>
  <text class="mut sm" x="231.0" y="240" text-anchor="middle">день 2</text>
  <rect class="box-acc" x="280" y="131.0" width="62" height="93.0" rx="3"/>
  <text class="ink sm b" x="311.0" y="125.0" text-anchor="middle">15.5</text>
  <text class="mut sm" x="311.0" y="240" text-anchor="middle">день 3</text>
  <rect class="box-acc" x="360" y="152.0" width="62" height="72.0" rx="3"/>
  <text class="ink sm b" x="391.0" y="146.0" text-anchor="middle">12</text>
  <text class="mut sm" x="391.0" y="240" text-anchor="middle">день 4</text>
  <rect class="box-acc" x="440" y="173.0" width="62" height="51.0" rx="3"/>
  <text class="ink sm b" x="471.0" y="167.0" text-anchor="middle">8.5</text>
  <text class="mut sm" x="471.0" y="240" text-anchor="middle">день 5</text>
  <rect class="box-warn" x="520" y="194.0" width="62" height="30.0" rx="3"/>
  <text class="ink sm b" x="551.0" y="188.0" text-anchor="middle">5</text>
  <text class="mut sm" x="551.0" y="240" text-anchor="middle">день 6</text>
  <rect class="box-err" x="600" y="215.0" width="62" height="9.0" rx="3"/>
  <text class="ink sm b" x="631.0" y="209.0" text-anchor="middle">1.5</text>
  <text class="mut sm" x="631.0" y="240" text-anchor="middle">день 7</text>
  <path class="ln-err dash" d="M30,194 L680,194"/>
  <text class="err sm b" x="684" y="188" text-anchor="end">порог 5</text>
  <text class="ink2 sm" x="350" y="264" text-anchor="middle">5 &gt;= 5 — ещё истинно, шаг выполняется; 1.5 &lt; 5 — выход. Итог: days = 7, остаток 1.5.</text>
</svg>
