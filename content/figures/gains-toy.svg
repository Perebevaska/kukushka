<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-gains-toy">
  <title id="t-gains-toy">Кривая охвата на шести гостях</title>
  <defs><marker id="ah-gains-toy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="80" y="40" width="210" height="210" rx="0"/>
  <path class="ln-mut" d="M185.0,250 L185.0,40"/>
  <path class="ln-mut" d="M80,145.0 L290,145.0"/>
  <path class="ln-mut" d="M290,250 L290,40"/>
  <path class="ln-mut" d="M80,40 L290,40"/>
  <text class="mut sm" x="80" y="266" text-anchor="middle">0</text>
  <text class="mut sm" x="72" y="254" text-anchor="end">0</text>
  <text class="mut sm" x="185.0" y="266" text-anchor="middle">0.5</text>
  <text class="mut sm" x="72" y="149.0" text-anchor="end">0.5</text>
  <text class="mut sm" x="290" y="266" text-anchor="middle">1</text>
  <text class="mut sm" x="72" y="44" text-anchor="end">1</text>
  <text class="mut sm" x="185.0" y="286" text-anchor="middle">доля гостей с бонусом</text>
  <text class="mut sm" x="44" y="145.0" text-anchor="middle" transform="rotate(-90 44 145.0)">доля пойманных уходящих</text>
  <path class="ln dash" d="M80,250 L290,40"/>
  <path class="ln" d="M80,250 L185.0,40 L290,40"/>
  <path class="ln-acc" d="M80,250 L115.0,180.0 L150.0,110.0 L185.0,110.0 L220.0,40.0 L255.0,40.0 L290.0,40.0"/>
  <circle class="box-warn" cx="115.0" cy="180.0" r="4.5"/>
  <text class="acc sm b" x="107.0" y="172.0" text-anchor="middle">A</text>
  <circle class="box-warn" cx="150.0" cy="110.0" r="4.5"/>
  <text class="acc sm b" x="142.0" y="102.0" text-anchor="middle">B</text>
  <circle class="box" cx="185.0" cy="110.0" r="4.5"/>
  <text class="acc sm b" x="177.0" y="102.0" text-anchor="middle">C</text>
  <circle class="box-warn" cx="220.0" cy="40.0" r="4.5"/>
  <text class="acc sm b" x="212.0" y="32.0" text-anchor="middle">D</text>
  <circle class="box" cx="255.0" cy="40.0" r="4.5"/>
  <text class="acc sm b" x="247.0" y="32.0" text-anchor="middle">E</text>
  <circle class="box" cx="290.0" cy="40.0" r="4.5"/>
  <text class="acc sm b" x="282.0" y="32.0" text-anchor="middle">F</text>
  <text class="ink2 sm b" x="340" y="40" text-anchor="start">идём по списку от большего риска:</text>
  <text class="ink sm" x="340" y="64" text-anchor="start">A ушёл  → поймали 1 из 3 = 0.33</text>
  <text class="ink sm" x="340" y="86" text-anchor="start">B ушёл  → 2 из 3 = 0.67</text>
  <text class="ink sm" x="340" y="108" text-anchor="start">C остался → по-прежнему 0.67</text>
  <text class="ink sm" x="340" y="130" text-anchor="start">D ушёл  → 3 из 3 = 1.00</text>
  <text class="ink sm" x="340" y="152" text-anchor="start">E, F остались → 1.00</text>
  <text class="mut sm" x="340" y="170" text-anchor="start">(это np.cumsum: 1, 2, 2, 3, 3, 3 → делим на 3)</text>
  <path class="ln-acc" d="M340,196 L370,196"/>
  <text class="ink sm" x="380" y="200" text-anchor="start">модель</text>
  <path class="ln" d="M340,220 L370,220"/>
  <text class="ink sm" x="380" y="224" text-anchor="start">идеал: все уходящие первыми</text>
  <path class="ln dash" d="M340,244 L370,244"/>
  <text class="ink sm" x="380" y="248" text-anchor="start">случайно: x % бонусов → x % уходящих</text>
</svg>
