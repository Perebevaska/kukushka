<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-llm-label-flow">
  <title id="t-llm-label-flow">Разметка LLM: инструкция с закрытым списком меток, разбор JSON, проверка, отдельная кучка «не удалось» и сверка с человеком</title>
  <defs><marker id="ah-llm-label-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="30" width="150" height="70" rx="6"/>
  <text class="ink sm b" x="89.0" y="51.5" text-anchor="middle">инструкция</text>
  <text class="ink2 sm" x="89.0" y="69.5" text-anchor="middle">закрытый список</text>
  <text class="ink2 sm" x="89.0" y="87.5" text-anchor="middle">меток + формат JSON</text>
  <path class="ln" d="M166,65 L184,65" marker-end="url(#ah-llm-label-flow)"/>
  <rect class="box-acc" x="186" y="30" width="150" height="70" rx="6"/>
  <text class="ink sm b" x="261.0" y="51.5" text-anchor="middle">LLM</text>
  <text class="ink2 sm" x="261.0" y="69.5" text-anchor="middle">temperature = 0</text>
  <text class="ink2 sm" x="261.0" y="87.5" text-anchor="middle">ответ — строка</text>
  <path class="ln" d="M338,65 L356,65" marker-end="url(#ah-llm-label-flow)"/>
  <rect class="box" x="358" y="30" width="150" height="70" rx="6"/>
  <text class="ink sm b" x="433.0" y="51.5" text-anchor="middle">разбор</text>
  <text class="ink2 sm" x="433.0" y="69.5" text-anchor="middle">json.loads</text>
  <text class="ink2 sm" x="433.0" y="87.5" text-anchor="middle">от { до }</text>
  <path class="ln" d="M510,65 L528,65" marker-end="url(#ah-llm-label-flow)"/>
  <rect class="box" x="530" y="30" width="150" height="70" rx="6"/>
  <text class="ink sm b" x="605.0" y="51.5" text-anchor="middle">проверка</text>
  <text class="ink2 sm" x="605.0" y="69.5" text-anchor="middle">тема из 6?</text>
  <text class="ink2 sm" x="605.0" y="87.5" text-anchor="middle">тональность из 2?</text>
  <path class="ln" d="M600,102 L560,140" marker-end="url(#ah-llm-label-flow)"/>
  <path class="ln" d="M640,102 L650,140" marker-end="url(#ah-llm-label-flow)"/>
  <rect class="box-ok" x="450" y="144" width="150" height="50" rx="6"/>
  <text class="ok sm b" x="525.0" y="164.5" text-anchor="middle">✓ разметка</text>
  <text class="ink2 sm" x="525.0" y="182.5" text-anchor="middle">в таблицу</text>
  <rect class="box-err" x="610" y="144" width="80" height="50" rx="6"/>
  <text class="err sm b" x="650.0" y="164.5" text-anchor="middle">✗ не</text>
  <text class="err sm b" x="650.0" y="182.5" text-anchor="middle">удалось</text>
  <rect class="box-warn" x="14" y="144" width="400" height="50" rx="6"/>
  <text class="ink sm b" x="214.0" y="164.5" text-anchor="middle">до разметки всего: 100–200 текстов с известными метками →</text>
  <text class="ink2 sm" x="214.0" y="182.5" text-anchor="middle">точность, матрица ошибок, доля «не удалось»</text>
  <text class="ink2 sm" x="350" y="230" text-anchor="middle">кучку «не удалось» считают и показывают, а не выбрасывают молча:</text>
  <text class="ink2 sm" x="350" y="248" text-anchor="middle">иначе в отчёте пропадут самые трудные отзывы</text>
</svg>
