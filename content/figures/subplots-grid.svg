<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-subplots-grid">
  <title id="t-subplots-grid">plt.subplots: одна область, ряд из двух и сетка 2 × 3</title>
  <defs><marker id="ah-subplots-grid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="acc sm b" x="95.0" y="24" text-anchor="middle">plt.subplots()</text>
  <text class="mut sm" x="95.0" y="42" text-anchor="middle">возвращает fig, ax</text>
  <rect class="box" x="20" y="54" width="150" height="150" rx="6"/>
  <rect class="box-acc" x="28.0" y="62.0" width="134.0" height="134.0" rx="4"/>
  <text class="ink sm b" x="95.0" y="133.0" text-anchor="middle">ax</text>
  <text class="acc sm b" x="310.0" y="24" text-anchor="middle">plt.subplots(1, 2)</text>
  <text class="mut sm" x="310.0" y="42" text-anchor="middle">fig, axes — массив из 2</text>
  <rect class="box" x="195" y="54" width="230" height="150" rx="6"/>
  <rect class="box-acc" x="203.0" y="62.0" width="103.0" height="134.0" rx="4"/>
  <text class="ink sm b" x="254.5" y="133.0" text-anchor="middle">axes[0]</text>
  <rect class="box-acc" x="314.0" y="62.0" width="103.0" height="134.0" rx="4"/>
  <text class="ink sm b" x="365.5" y="133.0" text-anchor="middle">axes[1]</text>
  <text class="acc sm b" x="565.0" y="24" text-anchor="middle">plt.subplots(2, 3)</text>
  <text class="mut sm" x="565.0" y="42" text-anchor="middle">fig, axes — сетка 2 × 3</text>
  <rect class="box" x="450" y="54" width="230" height="150" rx="6"/>
  <rect class="box-acc" x="458.0" y="62.0" width="66.0" height="63.0" rx="4"/>
  <text class="ink sm b" x="491.0" y="97.5" text-anchor="middle">[0, 0]</text>
  <text class="mut sm" x="491.0" y="113.5" text-anchor="middle">1-я</text>
  <rect class="box-acc" x="532.0" y="62.0" width="66.0" height="63.0" rx="4"/>
  <text class="ink sm b" x="565.0" y="97.5" text-anchor="middle">[0, 1]</text>
  <text class="mut sm" x="565.0" y="113.5" text-anchor="middle">2-я</text>
  <rect class="box-acc" x="606.0" y="62.0" width="66.0" height="63.0" rx="4"/>
  <text class="ink sm b" x="639.0" y="97.5" text-anchor="middle">[0, 2]</text>
  <text class="mut sm" x="639.0" y="113.5" text-anchor="middle">3-я</text>
  <rect class="box-acc" x="458.0" y="133.0" width="66.0" height="63.0" rx="4"/>
  <text class="ink sm b" x="491.0" y="168.5" text-anchor="middle">[1, 0]</text>
  <text class="mut sm" x="491.0" y="184.5" text-anchor="middle">4-я</text>
  <rect class="box-acc" x="532.0" y="133.0" width="66.0" height="63.0" rx="4"/>
  <text class="ink sm b" x="565.0" y="168.5" text-anchor="middle">[1, 1]</text>
  <text class="mut sm" x="565.0" y="184.5" text-anchor="middle">5-я</text>
  <rect class="box-acc" x="606.0" y="133.0" width="66.0" height="63.0" rx="4"/>
  <text class="ink sm b" x="639.0" y="168.5" text-anchor="middle">[1, 2]</text>
  <text class="mut sm" x="639.0" y="184.5" text-anchor="middle">6-я</text>
  <text class="ink2 sm" x="350" y="226" text-anchor="middle">1 строка, 2 столбца → axes[0], axes[1];  сетка → axes[строка, столбец]</text>
  <text class="mut sm" x="350" y="244" text-anchor="middle">axes.flat перебирает сетку по строкам: 1-я, 2-я, … 6-я (урок «Понятный график»)</text>
</svg>
