<svg viewBox="0 0 700 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-boot-pairs">
  <title id="t-boot-pairs">Один набор номеров для решения и факта сохраняет пары</title>
  <defs><marker id="ah-boot-pairs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="117.0" y="30" text-anchor="middle">исходные пары</text>
  <rect class="box" x="14" y="40" width="206" height="24" rx="3"/>
  <text class="ink2 sm b" x="39.0" y="56" text-anchor="middle">№</text>
  <text class="ink2 sm b" x="91.0" y="56" text-anchor="middle">бонус</text>
  <text class="ink2 sm b" x="141.0" y="56" text-anchor="middle">ушёл</text>
  <text class="ink2 sm b" x="192.0" y="56" text-anchor="middle">исход</text>
  <rect class="box" x="14" y="66" width="206" height="24" rx="3"/>
  <text class="ink sm" x="39.0" y="82" text-anchor="middle">0</text>
  <text class="ink sm" x="91.0" y="82" text-anchor="middle">да</text>
  <text class="ink sm" x="141.0" y="82" text-anchor="middle">да</text>
  <text class="ok sm b" x="192.0" y="82" text-anchor="middle">TP</text>
  <rect class="box" x="14" y="92" width="206" height="24" rx="3"/>
  <text class="ink sm" x="39.0" y="108" text-anchor="middle">1</text>
  <text class="ink sm" x="91.0" y="108" text-anchor="middle">да</text>
  <text class="ink sm" x="141.0" y="108" text-anchor="middle">нет</text>
  <text class="err sm b" x="192.0" y="108" text-anchor="middle">FP</text>
  <rect class="box" x="14" y="118" width="206" height="24" rx="3"/>
  <text class="ink sm" x="39.0" y="134" text-anchor="middle">2</text>
  <text class="ink sm" x="91.0" y="134" text-anchor="middle">нет</text>
  <text class="ink sm" x="141.0" y="134" text-anchor="middle">нет</text>
  <text class="mut sm" x="192.0" y="134" text-anchor="middle">—</text>
  <rect class="box" x="14" y="144" width="206" height="24" rx="3"/>
  <text class="ink sm" x="39.0" y="160" text-anchor="middle">3</text>
  <text class="ink sm" x="91.0" y="160" text-anchor="middle">да</text>
  <text class="ink sm" x="141.0" y="160" text-anchor="middle">да</text>
  <text class="ok sm b" x="192.0" y="160" text-anchor="middle">TP</text>
  <text class="ok sm b" x="355.0" y="30" text-anchor="middle">верно: send[i], y[i]</text>
  <rect class="box" x="252" y="40" width="206" height="24" rx="3"/>
  <text class="ink2 sm b" x="277.0" y="56" text-anchor="middle">№</text>
  <text class="ink2 sm b" x="329.0" y="56" text-anchor="middle">бонус</text>
  <text class="ink2 sm b" x="379.0" y="56" text-anchor="middle">ушёл</text>
  <text class="ink2 sm b" x="430.0" y="56" text-anchor="middle">исход</text>
  <rect class="box" x="252" y="66" width="206" height="24" rx="3"/>
  <text class="ink sm" x="277.0" y="82" text-anchor="middle">0</text>
  <text class="ink sm" x="329.0" y="82" text-anchor="middle">да</text>
  <text class="ink sm" x="379.0" y="82" text-anchor="middle">да</text>
  <text class="ok sm b" x="430.0" y="82" text-anchor="middle">TP</text>
  <rect class="box" x="252" y="92" width="206" height="24" rx="3"/>
  <text class="ink sm" x="277.0" y="108" text-anchor="middle">0</text>
  <text class="ink sm" x="329.0" y="108" text-anchor="middle">да</text>
  <text class="ink sm" x="379.0" y="108" text-anchor="middle">да</text>
  <text class="ok sm b" x="430.0" y="108" text-anchor="middle">TP</text>
  <rect class="box" x="252" y="118" width="206" height="24" rx="3"/>
  <text class="ink sm" x="277.0" y="134" text-anchor="middle">3</text>
  <text class="ink sm" x="329.0" y="134" text-anchor="middle">да</text>
  <text class="ink sm" x="379.0" y="134" text-anchor="middle">да</text>
  <text class="ok sm b" x="430.0" y="134" text-anchor="middle">TP</text>
  <rect class="box" x="252" y="144" width="206" height="24" rx="3"/>
  <text class="ink sm" x="277.0" y="160" text-anchor="middle">1</text>
  <text class="ink sm" x="329.0" y="160" text-anchor="middle">да</text>
  <text class="ink sm" x="379.0" y="160" text-anchor="middle">нет</text>
  <text class="err sm b" x="430.0" y="160" text-anchor="middle">FP</text>
  <text class="err sm b" x="593.0" y="30" text-anchor="middle">ошибка: send[i], y[j]</text>
  <rect class="box" x="490" y="40" width="206" height="24" rx="3"/>
  <text class="ink2 sm b" x="515.0" y="56" text-anchor="middle">№</text>
  <text class="ink2 sm b" x="567.0" y="56" text-anchor="middle">бонус</text>
  <text class="ink2 sm b" x="617.0" y="56" text-anchor="middle">ушёл</text>
  <text class="ink2 sm b" x="668.0" y="56" text-anchor="middle">исход</text>
  <rect class="box" x="490" y="66" width="206" height="24" rx="3"/>
  <text class="ink sm" x="515.0" y="82" text-anchor="middle">0 | 2</text>
  <text class="ink sm" x="567.0" y="82" text-anchor="middle">да</text>
  <text class="ink sm" x="617.0" y="82" text-anchor="middle">нет</text>
  <text class="err sm b" x="668.0" y="82" text-anchor="middle">FP</text>
  <rect class="box" x="490" y="92" width="206" height="24" rx="3"/>
  <text class="ink sm" x="515.0" y="108" text-anchor="middle">0 | 3</text>
  <text class="ink sm" x="567.0" y="108" text-anchor="middle">да</text>
  <text class="ink sm" x="617.0" y="108" text-anchor="middle">да</text>
  <text class="ok sm b" x="668.0" y="108" text-anchor="middle">TP</text>
  <rect class="box" x="490" y="118" width="206" height="24" rx="3"/>
  <text class="ink sm" x="515.0" y="134" text-anchor="middle">3 | 0</text>
  <text class="ink sm" x="567.0" y="134" text-anchor="middle">да</text>
  <text class="ink sm" x="617.0" y="134" text-anchor="middle">да</text>
  <text class="ok sm b" x="668.0" y="134" text-anchor="middle">TP</text>
  <rect class="box" x="490" y="144" width="206" height="24" rx="3"/>
  <text class="ink sm" x="515.0" y="160" text-anchor="middle">1 | 2</text>
  <text class="ink sm" x="567.0" y="160" text-anchor="middle">да</text>
  <text class="ink sm" x="617.0" y="160" text-anchor="middle">нет</text>
  <text class="err sm b" x="668.0" y="160" text-anchor="middle">FP</text>
  <path class="ln" d="M226,120 L246,120" marker-end="url(#ah-boot-pairs)"/>
  <path class="ln" d="M464,120 L484,120" marker-end="url(#ah-boot-pairs)"/>
  <text class="ink sm b" x="355" y="196" text-anchor="middle">i = [0, 0, 3, 1]</text>
  <text class="ok sm" x="355" y="216" text-anchor="middle">TP = 3: у каждого гостя свой исход</text>
  <text class="ink sm b" x="593" y="196" text-anchor="middle">i = [0, 0, 3, 1], j = [2, 3, 0, 2]</text>
  <text class="err sm" x="593" y="216" text-anchor="middle">TP = 2: бонус «чужому» исходу</text>
  <text class="ink2 sm" x="119" y="196" text-anchor="middle">строка = гость:</text>
  <text class="ink2 sm" x="119" y="216" text-anchor="middle">решение + его факт</text>
  <text class="mut sm" x="350" y="250" text-anchor="middle">с разными номерами модель превращается в случайную раздачу (задача «Разорванные пары»)</text>
</svg>
