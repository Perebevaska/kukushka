<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-hide-flow">
  <title id="t-hide-flow">Кто что видит: «Зерно» прячет анкеты ключом P, подрядчик учит модель на смесях</title>
  <defs><marker id="ah-hide-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="30" width="300" height="230" rx="8"/>
  <text class="ink b" x="164" y="52" text-anchor="middle">«Зерно»</text>
  <rect class="box" x="386" y="30" width="300" height="230" rx="8"/>
  <text class="ink b" x="536" y="52" text-anchor="middle">подрядчик</text>
  <rect class="box-acc" x="34" y="64" width="260" height="44" rx="6"/>
  <text class="ink sm" x="164.0" y="82.0" text-anchor="middle">анкеты X: пол, возраст,</text>
  <text class="ink sm" x="164.0" y="99.0" text-anchor="middle">доход, семья</text>
  <rect class="box-warn" x="34" y="120" width="260" height="44" rx="6"/>
  <text class="ink sm b" x="164.0" y="138.0" text-anchor="middle">секретный ключ P (4 × 4)</text>
  <text class="mut sm" x="164.0" y="155.0" text-anchor="middle">ранг 4, обусловленность ≈ 27</text>
  <rect class="box-acc" x="34" y="176" width="260" height="34" rx="6"/>
  <text class="ink sm b" x="164.0" y="197.5" text-anchor="middle">hidden = X @ P</text>
  <path class="ln" d="M164,110 L164,118" marker-end="url(#ah-hide-flow)"/>
  <path class="ln" d="M164,166 L164,174" marker-end="url(#ah-hide-flow)"/>
  <path class="ln-acc" d="M296,193 L404,86" marker-end="url(#ah-hide-flow)"/>
  <text class="acc sm b" x="350" y="226" text-anchor="middle">hidden</text>
  <text class="acc sm b" x="350" y="242" text-anchor="middle">+ spend_k</text>
  <rect class="box-ok" x="406" y="64" width="260" height="44" rx="6"/>
  <text class="ink sm" x="536.0" y="82.0" text-anchor="middle">смеси признаков + ответ</text>
  <text class="mut sm" x="536.0" y="99.0" text-anchor="middle">анкету не прочитать</text>
  <path class="ln" d="M536,110 L536,118" marker-end="url(#ah-hide-flow)"/>
  <rect class="box" x="406" y="120" width="260" height="44" rx="6"/>
  <text class="ink sm b" x="536.0" y="138.0" text-anchor="middle">LinearRegression().fit(...)</text>
  <text class="mut sm" x="536.0" y="155.0" text-anchor="middle">веса w′ = P⁻¹ · w — тоже без смысла</text>
  <path class="ln" d="M536,166 L536,174" marker-end="url(#ah-hide-flow)"/>
  <rect class="box-ok" x="406" y="176" width="260" height="34" rx="6"/>
  <text class="ink sm b" x="536.0" y="197.5" text-anchor="middle">R² на тесте 0.3713 — как у нас (0.3713)</text>
  <rect class="box" x="34" y="220" width="260" height="30" rx="6"/>
  <text class="ink2 sm" x="164.0" y="239.5" text-anchor="middle">новые анкеты — тем же P</text>
  <rect class="box" x="406" y="220" width="260" height="30" rx="6"/>
  <text class="ink2 sm" x="536.0" y="239.5" text-anchor="middle">member_id не передаём</text>
  <text class="err sm b" x="350" y="286" text-anchor="middle">слабое место: у подрядчика окажутся 4 известные пары «анкета — смесь» → P из системы уравнений</text>
  <text class="mut sm" x="350" y="306" text-anchor="middle">это защита от случайного взгляда, а не шифрование</text>
</svg>
