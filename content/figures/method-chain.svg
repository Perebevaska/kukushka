<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-method-chain">
  <title id="t-method-chain">Цепочка методов возвращает новые строки, исходная не меняется</title>
  <defs><marker id="ah-method-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20" y="40" width="190" height="40" rx="6"/>
  <text class="ink b" x="115.0" y="64.5" text-anchor="middle">[···нижний·ТАГИЛ··]</text>
  <text class="mut sm" x="115" y="30" text-anchor="middle">raw</text>
  <path class="ln" d="M212,60 L256,60" marker-end="url(#ah-method-chain)"/>
  <text class="acc sm b" x="234" y="50" text-anchor="middle">.strip()</text>
  <rect class="box-acc" x="260" y="40" width="170" height="40" rx="6"/>
  <text class="ink b" x="345.0" y="64.5" text-anchor="middle">[нижний·ТАГИЛ]</text>
  <text class="mut sm" x="345" y="30" text-anchor="middle">новая строка</text>
  <path class="ln" d="M432,60 L476,60" marker-end="url(#ah-method-chain)"/>
  <text class="acc sm b" x="454" y="50" text-anchor="middle">.title()</text>
  <rect class="box-ok" x="480" y="40" width="200" height="40" rx="6"/>
  <text class="ink b" x="580.0" y="64.5" text-anchor="middle">[Нижний·Тагил]</text>
  <text class="mut sm" x="580" y="30" text-anchor="middle">clean = …</text>
  <text class="ink2 sm" x="115" y="104" text-anchor="middle">после всех вызовов raw</text>
  <text class="ink2 sm" x="115" y="120" text-anchor="middle">всё ещё такая же</text>
  <text class="ink2 sm" x="345" y="104" text-anchor="middle">убраны пробелы по краям;</text>
  <text class="ink2 sm" x="345" y="120" text-anchor="middle">пробел внутри остался</text>
  <text class="ink2 sm" x="580" y="104" text-anchor="middle">каждое слово —</text>
  <text class="ink2 sm" x="580" y="120" text-anchor="middle">с большой буквы</text>
  <rect class="box-warn" x="20" y="140" width="660" height="44" rx="6"/>
  <text class="ink sm" x="350" y="159" text-anchor="middle">city.strip() отдельной строкой — результат посчитан и выброшен.</text>
  <text class="ink sm" x="350" y="176" text-anchor="middle">Чтобы сохранить: city = city.strip().   («·» на схеме — пробел)</text>
</svg>
