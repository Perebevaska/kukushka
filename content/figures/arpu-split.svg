<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-arpu-split">
  <title id="t-arpu-split">Выручка на гостя = конверсия × выручка на покупателя</title>
  <defs><marker id="ah-arpu-split" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="30" y="60" text-anchor="middle">A</text>
  <rect class="box-acc" x="60" y="34" width="170" height="44" rx="6"/>
  <text class="ink2 sm" x="145.0" y="52.0" text-anchor="middle">конверсия</text>
  <text class="ink b" x="145.0" y="69.0" text-anchor="middle">9.01 %</text>
  <text class="ink b" x="250" y="61" text-anchor="middle">×</text>
  <rect class="box" x="270" y="34" width="190" height="44" rx="6"/>
  <text class="ink2 sm" x="365.0" y="52.0" text-anchor="middle">выручка на покупателя</text>
  <text class="ink b" x="365.0" y="69.0" text-anchor="middle">409 ₽</text>
  <text class="ink b" x="480" y="61" text-anchor="middle">=</text>
  <rect class="box-ok" x="500" y="34" width="180" height="44" rx="6"/>
  <text class="ink2 sm" x="590.0" y="52.0" text-anchor="middle">выручка на гостя</text>
  <text class="ink b" x="590.0" y="69.0" text-anchor="middle">36.8 ₽</text>
  <text class="ink b" x="30" y="130" text-anchor="middle">B</text>
  <rect class="box-acc" x="60" y="104" width="170" height="44" rx="6"/>
  <text class="ink2 sm" x="145.0" y="122.0" text-anchor="middle">конверсия</text>
  <text class="ink b" x="145.0" y="139.0" text-anchor="middle">11.04 %</text>
  <text class="ink b" x="250" y="131" text-anchor="middle">×</text>
  <rect class="box" x="270" y="104" width="190" height="44" rx="6"/>
  <text class="ink2 sm" x="365.0" y="122.0" text-anchor="middle">выручка на покупателя</text>
  <text class="ink b" x="365.0" y="139.0" text-anchor="middle">412 ₽</text>
  <text class="ink b" x="480" y="131" text-anchor="middle">=</text>
  <rect class="box-ok" x="500" y="104" width="180" height="44" rx="6"/>
  <text class="ink2 sm" x="590.0" y="122.0" text-anchor="middle">выручка на гостя</text>
  <text class="ink b" x="590.0" y="139.0" text-anchor="middle">45.5 ₽</text>
  <text class="mut sm" x="350" y="20" text-anchor="middle">пуш-тест: откуда вырос средний доход с гостя</text>
  <text class="ink2 sm" x="350" y="186" text-anchor="middle">чек покупателя почти не изменился (409 → 412 ₽) — рост выручки пришёл от конверсии</text>
</svg>
