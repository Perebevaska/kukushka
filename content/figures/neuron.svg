<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-neuron">
  <title id="t-neuron">Один нейрон: взвешенная сумма и активация</title>
  <defs><marker id="ah-neuron" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="20" y="42" width="120" height="32" rx="16"/>
  <text class="ink sm" x="80" y="63" text-anchor="middle">x₁ = км</text>
  <rect class="box-acc" x="20" y="97" width="120" height="32" rx="16"/>
  <text class="ink sm" x="80" y="118" text-anchor="middle">x₂ = позиций</text>
  <rect class="box-acc" x="20" y="152" width="120" height="32" rx="16"/>
  <text class="ink sm" x="80" y="173" text-anchor="middle">x₃ = пеший</text>
  <path class="ln" d="M142,60 L300,115" marker-end="url(#ah-neuron)"/>
  <text class="acc sm b" x="220" y="81.5" text-anchor="middle">w₁</text>
  <path class="ln" d="M142,115 L300,115" marker-end="url(#ah-neuron)"/>
  <text class="acc sm b" x="220" y="109.0" text-anchor="middle">w₂</text>
  <path class="ln" d="M142,170 L300,115" marker-end="url(#ah-neuron)"/>
  <text class="acc sm b" x="220" y="136.5" text-anchor="middle">w₃</text>
  <circle class="box-ok" cx="330" cy="115" r="34"/>
  <text class="ink b" x="330" y="112" text-anchor="middle">Σ + b</text>
  <text class="ink2 sm" x="330" y="130" text-anchor="middle">z</text>
  <path class="ln" d="M366,115 L416,115" marker-end="url(#ah-neuron)"/>
  <rect class="box-warn" x="420" y="90" width="110" height="50" rx="8"/>
  <text class="ink sm b" x="475" y="112" text-anchor="middle">активация</text>
  <text class="ink2 sm" x="475" y="130" text-anchor="middle">ReLU или σ</text>
  <path class="ln" d="M532,115 L586,115" marker-end="url(#ah-neuron)"/>
  <rect class="box" x="590" y="96" width="90" height="38" rx="19"/>
  <text class="ink sm b" x="635" y="120" text-anchor="middle">выход</text>
  <text class="ink2 sm" x="350" y="200" text-anchor="middle">z = w₁x₁ + w₂x₂ + w₃x₃ + b — та же формула, что у линейной и логистической регрессии</text>
  <text class="mut sm" x="350" y="220" text-anchor="middle">с сигмоидой на выходе один нейрон — это и есть логистическая регрессия</text>
</svg>
