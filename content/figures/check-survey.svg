<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-check-survey">
  <title id="t-check-survey">Анкета на случайном чеке чаще попадает к частым гостям</title>
  <defs><marker id="ah-check-survey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="110" y="22" text-anchor="middle">гости и их визиты за месяц</text>
  <rect class="box" x="20" y="34" width="180" height="32" rx="6"/>
  <text class="ink sm" x="110.0" y="54.5" text-anchor="middle">гость А: 1 визит</text>
  <rect class="box-ok" x="20" y="74" width="180" height="32" rx="6"/>
  <text class="ink sm" x="110.0" y="94.5" text-anchor="middle">гость Б: 1 визит</text>
  <rect class="box-warn" x="20" y="114" width="180" height="32" rx="6"/>
  <text class="ink sm" x="110.0" y="134.5" text-anchor="middle">гость В: 2 визита</text>
  <rect class="box-acc" x="20" y="154" width="180" height="32" rx="6"/>
  <text class="ink sm" x="110.0" y="174.5" text-anchor="middle">гость Г: 8 визитов</text>
  <text class="ink sm b" x="110" y="214" text-anchor="middle">среднее по гостям: 12 / 4 = 3</text>
  <path class="ln" d="M210,110 L246,110" marker-end="url(#ah-check-survey)"/>
  <text class="mut sm" x="440" y="22" text-anchor="middle">все 12 чеков месяца: анкета — на одном случайном</text>
  <rect class="box" x="262" y="40" width="50" height="50" rx="4"/>
  <text class="ink b" x="287" y="70" text-anchor="middle">А</text>
  <rect class="box-ok" x="320" y="40" width="50" height="50" rx="4"/>
  <text class="ink b" x="345" y="70" text-anchor="middle">Б</text>
  <rect class="box-warn" x="378" y="40" width="50" height="50" rx="4"/>
  <text class="ink b" x="403" y="70" text-anchor="middle">В</text>
  <rect class="box-warn" x="436" y="40" width="50" height="50" rx="4"/>
  <text class="ink b" x="461" y="70" text-anchor="middle">В</text>
  <rect class="box-acc" x="494" y="40" width="50" height="50" rx="4"/>
  <text class="ink b" x="519" y="70" text-anchor="middle">Г</text>
  <rect class="box-acc" x="552" y="40" width="50" height="50" rx="4"/>
  <text class="ink b" x="577" y="70" text-anchor="middle">Г</text>
  <rect class="box-acc" x="262" y="98" width="50" height="50" rx="4"/>
  <text class="ink b" x="287" y="128" text-anchor="middle">Г</text>
  <rect class="box-acc" x="320" y="98" width="50" height="50" rx="4"/>
  <text class="ink b" x="345" y="128" text-anchor="middle">Г</text>
  <rect class="box-acc" x="378" y="98" width="50" height="50" rx="4"/>
  <text class="ink b" x="403" y="128" text-anchor="middle">Г</text>
  <rect class="box-acc" x="436" y="98" width="50" height="50" rx="4"/>
  <text class="ink b" x="461" y="128" text-anchor="middle">Г</text>
  <rect class="box-acc" x="494" y="98" width="50" height="50" rx="4"/>
  <text class="ink b" x="519" y="128" text-anchor="middle">Г</text>
  <rect class="box-acc" x="552" y="98" width="50" height="50" rx="4"/>
  <text class="ink b" x="577" y="128" text-anchor="middle">Г</text>
  <text class="ink2 sm" x="440" y="176" text-anchor="middle">гость Г держит 8 чеков из 12 — анкета у него в 2 случаях из 3</text>
  <text class="err sm b" x="440" y="214" text-anchor="middle">ожидаемый ответ: (1·1 + 1·1 + 2·2 + 8·8) / 12 = 5.83</text>
  <text class="ink2 sm" x="350" y="242" text-anchor="middle">смещение — свойство способа отбора, а не невезение: больше анкет его не исправят</text>
</svg>
