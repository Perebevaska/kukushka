<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-gini-toy">
  <title id="t-gini-toy">Два вопроса на десяти доставках: какой снижает неоднородность</title>
  <defs><marker id="ah-gini-toy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="350" y="22" text-anchor="middle">до вопроса: 10 доставок, 4 опоздали — Gini = 0.48</text>
  <circle class="err" cx="251.0" cy="44.0" r="7"/>
  <circle class="err" cx="273.0" cy="44.0" r="7"/>
  <circle class="err" cx="295.0" cy="44.0" r="7"/>
  <circle class="err" cx="317.0" cy="44.0" r="7"/>
  <circle class="ok" cx="339.0" cy="44.0" r="7"/>
  <circle class="ok" cx="361.0" cy="44.0" r="7"/>
  <circle class="ok" cx="383.0" cy="44.0" r="7"/>
  <circle class="ok" cx="405.0" cy="44.0" r="7"/>
  <circle class="ok" cx="427.0" cy="44.0" r="7"/>
  <circle class="ok" cx="449.0" cy="44.0" r="7"/>
  <text class="ink b" x="180" y="90" text-anchor="middle">вопрос A</text>
  <rect class="box" x="20" y="102" width="158" height="92" rx="6"/>
  <circle class="err" cx="44.0" cy="124.0" r="7"/>
  <circle class="ok" cx="66.0" cy="124.0" r="7"/>
  <circle class="ok" cx="88.0" cy="124.0" r="7"/>
  <circle class="ok" cx="110.0" cy="124.0" r="7"/>
  <circle class="ok" cx="132.0" cy="124.0" r="7"/>
  <circle class="ok" cx="154.0" cy="124.0" r="7"/>
  <text class="ink2 sm" x="99" y="154" text-anchor="middle">1 из 6: p = 0.17</text>
  <text class="ink sm b" x="99" y="176" text-anchor="middle">Gini = 0.278</text>
  <rect class="box" x="190" y="102" width="158" height="92" rx="6"/>
  <circle class="err" cx="236.0" cy="124.0" r="7"/>
  <circle class="err" cx="258.0" cy="124.0" r="7"/>
  <circle class="err" cx="280.0" cy="124.0" r="7"/>
  <circle class="ok" cx="302.0" cy="124.0" r="7"/>
  <text class="ink2 sm" x="269" y="154" text-anchor="middle">3 из 4: p = 0.75</text>
  <text class="ink sm b" x="269" y="176" text-anchor="middle">Gini = 0.375</text>
  <text class="ink2 sm" x="180" y="218" text-anchor="middle">0.6·0.278 + 0.4·0.375</text>
  <text class="ok b" x="180" y="240" text-anchor="middle">= 0.317</text>
  <text class="ink b" x="525" y="90" text-anchor="middle">вопрос B</text>
  <rect class="box" x="365" y="102" width="158" height="92" rx="6"/>
  <circle class="err" cx="400.0" cy="124.0" r="7"/>
  <circle class="err" cx="422.0" cy="124.0" r="7"/>
  <circle class="ok" cx="444.0" cy="124.0" r="7"/>
  <circle class="ok" cx="466.0" cy="124.0" r="7"/>
  <circle class="ok" cx="488.0" cy="124.0" r="7"/>
  <text class="ink2 sm" x="444" y="154" text-anchor="middle">2 из 5: p = 0.40</text>
  <text class="ink sm b" x="444" y="176" text-anchor="middle">Gini = 0.480</text>
  <rect class="box" x="535" y="102" width="158" height="92" rx="6"/>
  <circle class="err" cx="570.0" cy="124.0" r="7"/>
  <circle class="err" cx="592.0" cy="124.0" r="7"/>
  <circle class="ok" cx="614.0" cy="124.0" r="7"/>
  <circle class="ok" cx="636.0" cy="124.0" r="7"/>
  <circle class="ok" cx="658.0" cy="124.0" r="7"/>
  <text class="ink2 sm" x="614" y="154" text-anchor="middle">2 из 5: p = 0.40</text>
  <text class="ink sm b" x="614" y="176" text-anchor="middle">Gini = 0.480</text>
  <text class="ink2 sm" x="525" y="218" text-anchor="middle">0.5·0.480 + 0.5·0.480</text>
  <text class="err b" x="525" y="240" text-anchor="middle">= 0.480</text>
  <text class="ink2 sm" x="350" y="272" text-anchor="middle">A разделил опоздания и доставки вовремя (0.48 → 0.317); B просто разрезал группу — доли те же</text>
  <text class="mut sm" x="350" y="292" text-anchor="middle">красные — опоздали, зелёные — вовремя; вес части — её доля объектов</text>
</svg>
