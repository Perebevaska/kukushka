<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-layer-matmul">
  <title id="t-nn-layer-matmul">Слой из четырёх нейронов: Z = X @ W + b</title>
  <defs><marker id="ah-nn-layer-matmul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="84" y="60" text-anchor="middle">X: 2 гостя × 3 признака</text>
  <text class="mut sm" x="44.0" y="82" text-anchor="middle">дней</text>
  <text class="mut sm" x="84.0" y="82" text-anchor="middle">жалоб</text>
  <text class="mut sm" x="124.0" y="82" text-anchor="middle">прил.</text>
  <rect class="box-acc" x="24" y="92" width="40" height="30" rx="2"/>
  <text class="ink sm" x="44.0" y="112" text-anchor="middle">45</text>
  <rect class="box-acc" x="64" y="92" width="40" height="30" rx="2"/>
