  <rect class="box-acc" x="104" y="92" width="40" height="30" rx="2"/>
  <text class="ink sm" x="124.0" y="112" text-anchor="middle">0</text>
  <rect class="box" x="24" y="122" width="40" height="30" rx="2"/>
  <text class="ink sm" x="44.0" y="142" text-anchor="middle">3</text>
  <rect class="box" x="64" y="122" width="40" height="30" rx="2"/>
  <text class="ink sm" x="84.0" y="142" text-anchor="middle">0</text>
  <rect class="box" x="104" y="122" width="40" height="30" rx="2"/>
  <text class="ink sm" x="124.0" y="142" text-anchor="middle">1</text>
  <text class="mut sm" x="14" y="112" text-anchor="middle">1</text>
  <text class="mut sm" x="14" y="142" text-anchor="middle">2</text>
  <text class="ink b" x="158" y="128" text-anchor="middle">@</text>
  <text class="ink sm b" x="256" y="60" text-anchor="middle">W: 3 признака × 4 нейрона</text>
  <text class="mut sm" x="196.0" y="183" text-anchor="middle">н1</text>
  <rect class="box" x="176" y="77" width="40" height="30" rx="2"/>
  <text class="ink2 sm" x="196.0" y="97" text-anchor="middle">w₁₁</text>
  <rect class="box" x="176" y="107" width="40" height="30" rx="2"/>
  <text class="ink2 sm" x="196.0" y="127" text-anchor="middle">w₂₁</text>
  <rect class="box" x="176" y="137" width="40" height="30" rx="2"/>
  <text class="ink2 sm" x="196.0" y="157" text-anchor="middle">w₃₁</text>
  <text class="mut sm" x="236.0" y="183" text-anchor="middle">н2</text>
  <rect class="box" x="216" y="77" width="40" height="30" rx="2"/>
  <text class="ink2 sm" x="236.0" y="97" text-anchor="middle">w₁₂</text>
  <rect class="box" x="216" y="107" width="40" height="30" rx="2"/>
  <text class="ink2 sm" x="236.0" y="127" text-anchor="middle">w₂₂</text>
  <rect class="box" x="216" y="137" width="40" height="30" rx="2"/>
  <text class="ink2 sm" x="236.0" y="157" text-anchor="middle">w₃₂</text>
  <text class="mut sm" x="276.0" y="183" text-anchor="middle">н3</text>
  <rect class="box-acc" x="256" y="77" width="40" height="30" rx="2"/>
  <text class="ink2 sm" x="276.0" y="97" text-anchor="middle">w₁₃</text>
  <rect class="box-acc" x="256" y="107" width="40" height="30" rx="2"/>
  <text class="ink2 sm" x="276.0" y="127" text-anchor="middle">w₂₃</text>
  <rect class="box-acc" x="256" y="137" width="40" height="30" rx="2"/>
  <text class="ink2 sm" x="276.0" y="157" text-anchor="middle">w₃₃</text>
  <text class="mut sm" x="316.0" y="183" text-anchor="middle">н4</text>
  <rect class="box" x="296" y="77" width="40" height="30" rx="2"/>
  <text class="ink2 sm" x="316.0" y="97" text-anchor="middle">w₁₄</text>
  <rect class="box" x="296" y="107" width="40" height="30" rx="2"/>
  <text class="ink2 sm" x="316.0" y="127" text-anchor="middle">w₂₄</text>
  <rect class="box" x="296" y="137" width="40" height="30" rx="2"/>
  <text class="ink2 sm" x="316.0" y="157" text-anchor="middle">w₃₄</text>
  <text class="ink b" x="360" y="128" text-anchor="middle">+ b</text>
  <text class="ink b" x="392" y="128" text-anchor="middle">=</text>
  <text class="ink sm b" x="490" y="60" text-anchor="middle">Z: 2 × 4</text>
  <text class="mut sm" x="430.0" y="82" text-anchor="middle">н1</text>
  <rect class="box" x="410" y="92" width="40" height="30" rx="2"/>
  <rect class="box" x="410" y="122" width="40" height="30" rx="2"/>
  <text class="mut sm" x="470.0" y="82" text-anchor="middle">н2</text>
  <rect class="box" x="450" y="92" width="40" height="30" rx="2"/>
  <rect class="box" x="450" y="122" width="40" height="30" rx="2"/>
  <text class="mut sm" x="510.0" y="82" text-anchor="middle">н3</text>
  <rect class="box-warn" x="490" y="92" width="40" height="30" rx="2"/>
  <text class="ink sm b" x="510.0" y="112" text-anchor="middle">z</text>
  <rect class="box" x="490" y="122" width="40" height="30" rx="2"/>
  <text class="mut sm" x="550.0" y="82" text-anchor="middle">н4</text>
  <rect class="box" x="530" y="92" width="40" height="30" rx="2"/>
  <rect class="box" x="530" y="122" width="40" height="30" rx="2"/>
  <path class="ln" d="M574,122 L604,122" marker-end="url(#ah-nn-layer-matmul)"/>
  <rect class="box-ok" x="606" y="90" width="80" height="64" rx="8"/>
  <text class="ink sm b" x="646" y="114" text-anchor="middle">ReLU</text>
  <text class="ink2 sm" x="646" y="134" text-anchor="middle">A: 2 × 4</text>
  <text class="ink2 sm" x="350" y="212" text-anchor="middle">выделенная клетка: z = 45·w₁₃ + 1·w₂₃ + 0·w₃₃ + b₃ — строка гостя 1 на столбец нейрона 3</text>
  <text class="ink2 sm" x="350" y="234" text-anchor="middle">формы: (2 × 3) @ (3 × 4) → (2 × 4) — внутренние размеры 3 и 3 совпали и «схлопнулись»</text>
  <text class="mut sm" x="350" y="256" text-anchor="middle">b — по одному сдвигу на нейрон, прибавляется к каждой строке</text>
</svg>
