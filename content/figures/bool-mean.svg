<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-bool-mean">
  <title id="t-bool-mean">Среднее от True/False — доля</title>
  <defs><marker id="ah-bool-mean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="140" y="36" width="80" height="30" rx="4"/>
  <text class="ink sm" x="180" y="56" text-anchor="middle">450</text>
  <rect class="box-ok" x="140" y="86" width="80" height="30" rx="4"/>
  <text class="ok sm b" x="180" y="106" text-anchor="middle">True</text>
  <rect class="box-ok" x="140" y="136" width="80" height="30" rx="4"/>
  <text class="ink b" x="180" y="156" text-anchor="middle">1</text>
  <rect class="box" x="230" y="36" width="80" height="30" rx="4"/>
  <text class="ink sm" x="270" y="56" text-anchor="middle">320</text>
  <rect class="box" x="230" y="86" width="80" height="30" rx="4"/>
  <text class="mut sm" x="270" y="106" text-anchor="middle">False</text>
  <rect class="box" x="230" y="136" width="80" height="30" rx="4"/>
  <text class="ink b" x="270" y="156" text-anchor="middle">0</text>
  <rect class="box" x="320" y="36" width="80" height="30" rx="4"/>
  <text class="ink sm" x="360" y="56" text-anchor="middle">610</text>
  <rect class="box-ok" x="320" y="86" width="80" height="30" rx="4"/>
  <text class="ok sm b" x="360" y="106" text-anchor="middle">True</text>
  <rect class="box-ok" x="320" y="136" width="80" height="30" rx="4"/>
  <text class="ink b" x="360" y="156" text-anchor="middle">1</text>
  <rect class="box" x="410" y="36" width="80" height="30" rx="4"/>
  <text class="ink sm" x="450" y="56" text-anchor="middle">480</text>
  <rect class="box-ok" x="410" y="86" width="80" height="30" rx="4"/>
  <text class="ok sm b" x="450" y="106" text-anchor="middle">True</text>
  <rect class="box-ok" x="410" y="136" width="80" height="30" rx="4"/>
  <text class="ink b" x="450" y="156" text-anchor="middle">1</text>
  <rect class="box" x="500" y="36" width="80" height="30" rx="4"/>
  <text class="ink sm" x="540" y="56" text-anchor="middle">290</text>
  <rect class="box" x="500" y="86" width="80" height="30" rx="4"/>
  <text class="mut sm" x="540" y="106" text-anchor="middle">False</text>
  <rect class="box" x="500" y="136" width="80" height="30" rx="4"/>
  <text class="ink b" x="540" y="156" text-anchor="middle">0</text>
  <text class="mut sm b" x="124" y="56" text-anchor="end">s</text>
  <text class="mut sm b" x="124" y="106" text-anchor="end">s &gt; 400</text>
  <text class="mut sm b" x="124" y="156" text-anchor="end">как числа</text>
  <text class="ink sm b" x="600" y="106" text-anchor="start">sum() = 3</text>
  <text class="acc b" x="600" y="156" text-anchor="start">mean() = 0.6</text>
  <text class="ink2 sm" x="350" y="196" text-anchor="middle">3 из 5 заказов дороже 400 ₽: сумма маски — сколько, среднее — какая доля (60%).</text>
  <text class="mut sm" x="350" y="216" text-anchor="middle">True считается как 1, False — как 0.</text>
</svg>
