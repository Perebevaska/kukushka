<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-clip-norm">
  <title id="t-nn-clip-norm">Обрезка по норме сохраняет направление, обрезка каждого числа — нет</title>
  <defs><marker id="ah-nn-clip-norm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <path class="ln-mut" d="M50,240 L278.0,240" marker-end="url(#ah-nn-clip-norm)"/>
  <path class="ln-mut" d="M50,240 L50,16.799999999999983" marker-end="url(#ah-nn-clip-norm)"/>
  <text class="mut sm" x="170" y="256" text-anchor="middle">5</text>
  <text class="mut sm" x="40" y="124" text-anchor="middle">5</text>
  <path class="ln dash" d="M170.0,240 A120.0,120.0 0 0 0 50,120.0"/>
  <text class="mut sm" x="178.0" y="230" text-anchor="start">норма = 5</text>
  <path class="ln" d="M50,240 L194.0,48.0" marker-end="url(#ah-nn-clip-norm)"/>
  <text class="ink2 sm" x="202.0" y="52.0" text-anchor="start">g = (6, 8), норма 10</text>
  <path class="ln-ok" d="M50,240 L122.0,144.0" marker-end="url(#ah-nn-clip-norm)"/>
  <text class="ok sm b" x="108.0" y="148.0" text-anchor="end">(3, 4)</text>
  <path class="ln-err dash" d="M50,240 L170.0,120.0" marker-end="url(#ah-nn-clip-norm)"/>
  <text class="err sm b" x="178.0" y="134.0" text-anchor="start">(5, 5)</text>
  <text class="ok sm b" x="370" y="50" text-anchor="start">по норме: g × min(1, 5 / 10) = g × 0.5</text>
  <text class="ink2 sm" x="370" y="70" text-anchor="start">→ (3, 4): длина 5, угол тот же 53°</text>
  <text class="err sm b" x="370" y="110" text-anchor="start">каждое число отдельно: np.clip(g, −5, 5)</text>
  <text class="ink2 sm" x="370" y="130" text-anchor="start">→ (5, 5): угол 45° вместо 53°,</text>
  <text class="ink2 sm" x="370" y="148" text-anchor="start">шаг пошёл в другую сторону</text>
  <text class="mut sm" x="370" y="190" text-anchor="start">в PyTorch: clip_grad_norm_ — первое,</text>
  <text class="mut sm" x="370" y="208" text-anchor="start">clip_grad_value_ — второе</text>
</svg>
