<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-tree-split">
  <title id="t-tree-split">Первый вопрос дерева и неоднородность Джини</title>
  <defs><marker id="ah-tree-split" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="240" y="16" width="220" height="70" rx="8"/>
  <text class="ink sm b" x="350" y="38" text-anchor="middle">все 1380 доставок обучения</text>
  <text class="ink2 sm" x="350" y="58" text-anchor="middle">опоздания 24.2 %</text>
  <text class="mut sm" x="350" y="76" text-anchor="middle">Джини 0.367</text>
  <rect class="box-acc" x="270" y="100" width="160" height="30" rx="15"/>
  <text class="ink sm b" x="350" y="120" text-anchor="middle">promised_min ≤ 37.5 ?</text>
  <path class="ln" d="M310,130 L190,160" marker-end="url(#ah-tree-split)"/>
  <path class="ln" d="M390,130 L510,160" marker-end="url(#ah-tree-split)"/>
  <text class="acc sm" x="232" y="150" text-anchor="middle">да (30 мин)</text>
  <text class="acc sm" x="470" y="150" text-anchor="middle">нет (45 и 60 мин)</text>
  <rect class="box-err" x="80" y="164" width="220" height="70" rx="8"/>
  <text class="ink sm b" x="190" y="186" text-anchor="middle">493 доставки</text>
  <text class="ink2 sm" x="190" y="206" text-anchor="middle">опоздания 45.6 %</text>
  <text class="mut sm" x="190" y="224" text-anchor="middle">Джини 0.496</text>
  <rect class="box-ok" x="400" y="164" width="220" height="70" rx="8"/>
  <text class="ink sm b" x="510" y="186" text-anchor="middle">887 доставок</text>
  <text class="ink2 sm" x="510" y="206" text-anchor="middle">опоздания 12.3 %</text>
  <text class="mut sm" x="510" y="224" text-anchor="middle">Джини 0.216</text>
  <text class="ink2 sm" x="350" y="254" text-anchor="middle">средняя неоднородность после вопроса: (493·0.496 + 887·0.216) / 1380 ≈ 0.316 &lt; 0.367</text>
</svg>
