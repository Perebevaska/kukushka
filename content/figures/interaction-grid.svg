<svg viewBox="0 0 700 218" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-interaction-grid">
  <title id="t-interaction-grid">Доля ушедших: жалобы × доля доставки</title>
  <defs><marker id="ah-interaction-grid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="250" y="28" text-anchor="middle">доставка до 20 %</text>
  <text class="ink2 sm b" x="400" y="28" text-anchor="middle">20–50 %</text>
  <text class="ink2 sm b" x="550" y="28" text-anchor="middle">больше 50 %</text>
  <text class="ink sm b" x="160" y="62" text-anchor="end">жалоб: 0</text>
  <rect class="box" x="180" y="38" width="140" height="46" rx="4"/>
  <text class="ink b" x="250" y="60" text-anchor="middle">27 %</text>
  <text class="mut sm" x="250" y="76" text-anchor="middle">889 гостей</text>
  <rect class="box" x="330" y="38" width="140" height="46" rx="4"/>
  <text class="ink b" x="400" y="60" text-anchor="middle">11 %</text>
  <text class="mut sm" x="400" y="76" text-anchor="middle">979 гостей</text>
  <rect class="box" x="480" y="38" width="140" height="46" rx="4"/>
  <text class="ink b" x="550" y="60" text-anchor="middle">13 %</text>
  <text class="mut sm" x="550" y="76" text-anchor="middle">313 гостей</text>
  <text class="ink sm b" x="160" y="116" text-anchor="end">жалоб: 1</text>
  <rect class="box-warn" x="180" y="92" width="140" height="46" rx="4"/>
  <text class="ink b" x="250" y="114" text-anchor="middle">41 %</text>
  <text class="mut sm" x="250" y="130" text-anchor="middle">75 гостей</text>
  <rect class="box-err" x="330" y="92" width="140" height="46" rx="4"/>
  <text class="ink b" x="400" y="114" text-anchor="middle">73 %</text>
  <text class="mut sm" x="400" y="130" text-anchor="middle">110 гостей</text>
  <rect class="box-err" x="480" y="92" width="140" height="46" rx="4"/>
  <text class="ink b" x="550" y="114" text-anchor="middle">97 %</text>
  <text class="mut sm" x="550" y="130" text-anchor="middle">32 гостей</text>
  <text class="ink2 sm" x="350" y="168" text-anchor="middle">без жалоб доставка почти не влияет; с жалобой — чем больше доставки, тем выше уход</text>
  <text class="mut sm" x="350" y="188" text-anchor="middle">эффект жалобы зависит от доли доставки — это взаимодействие признаков</text>
  <text class="mut sm" x="350" y="206" text-anchor="middle">гостей с двумя жалобами всего двое — их строку не показываем</text>
</svg>
