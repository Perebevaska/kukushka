<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-frame-norm">
  <title id="t-frame-norm">Нормировка кадра по его среднему и разбросу: тусклый кадр становится таким же, как обычный</title>
  <defs><marker id="ah-frame-norm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="100" y="30" text-anchor="middle">кадр днём</text>
  <path class="ln-mut" d="M16,150 L180,150"/>
  <rect class="box-acc" x="26" y="62.0" width="28" height="88.0" rx="2"/>
  <text class="ink sm" x="40" y="57.0" text-anchor="middle">0.8</text>
  <rect class="box-acc" x="66" y="62.0" width="28" height="88.0" rx="2"/>
  <text class="ink sm" x="80" y="57.0" text-anchor="middle">0.8</text>
  <rect class="box-acc" x="106" y="117.0" width="28" height="33.0" rx="2"/>
  <text class="ink sm" x="120" y="112.0" text-anchor="middle">0.3</text>
  <rect class="box-acc" x="146" y="117.0" width="28" height="33.0" rx="2"/>
  <text class="ink sm" x="160" y="112.0" text-anchor="middle">0.3</text>
  <text class="ink2 sm b" x="280" y="30" text-anchor="middle">вечером: × 0.7</text>
  <path class="ln-mut" d="M196,150 L360,150"/>
  <rect class="box-warn" x="206" y="88.4" width="28" height="61.599999999999994" rx="2"/>
  <text class="ink sm" x="220" y="83.4" text-anchor="middle">0.56</text>
  <rect class="box-warn" x="246" y="88.4" width="28" height="61.599999999999994" rx="2"/>
  <text class="ink sm" x="260" y="83.4" text-anchor="middle">0.56</text>
  <rect class="box-warn" x="286" y="126.9" width="28" height="23.099999999999998" rx="2"/>
  <text class="ink sm" x="300" y="121.9" text-anchor="middle">0.21</text>
  <rect class="box-warn" x="326" y="126.9" width="28" height="23.099999999999998" rx="2"/>
  <text class="ink sm" x="340" y="121.9" text-anchor="middle">0.21</text>
  <text class="ink2 sm b" x="520" y="30" text-anchor="middle">(z − среднее) / разброс</text>
  <path class="ln-mut" d="M436,110 L600,110"/>
  <rect class="box-ok" x="446" y="70.0" width="28" height="40.0" rx="2"/>
  <text class="ink sm" x="460" y="65.0" text-anchor="middle">1</text>
  <rect class="box-ok" x="486" y="70.0" width="28" height="40.0" rx="2"/>
  <text class="ink sm" x="500" y="65.0" text-anchor="middle">1</text>
  <rect class="box-ok" x="526" y="110" width="28" height="40.00000000000001" rx="2"/>
  <text class="ink sm" x="540" y="164.0" text-anchor="middle">−1</text>
  <rect class="box-ok" x="566" y="110" width="28" height="40.00000000000001" rx="2"/>
  <text class="ink sm" x="580" y="164.0" text-anchor="middle">−1</text>
  <path class="ln" d="M375,110 L425,110" marker-end="url(#ah-frame-norm)"/>
  <text class="ink2 sm" x="120" y="190" text-anchor="middle">среднее 0.55, разброс 0.25</text>
  <text class="ink2 sm" x="280" y="190" text-anchor="middle">0.385, 0.175</text>
  <text class="ok sm b" x="520" y="190" text-anchor="middle">у обоих кадров одинаково:</text>
  <text class="ok sm b" x="520" y="206" text-anchor="middle">[1, 1, −1, −1]</text>
  <text class="mut sm" x="350" y="244" text-anchor="middle">лес на сырых пикселях: 0.91 на тесте, 0.47 на тусклом — порог «тёмного» сдвинулся вместе со светом</text>
</svg>
