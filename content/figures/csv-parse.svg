<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-csv-parse">
  <title id="t-csv-parse">Один и тот же текст CSV с разными параметрами read_csv</title>
  <defs><marker id="ah-csv-parse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="20" y="26" text-anchor="start">файл (текст)</text>
  <rect class="box" x="20" y="34" width="150" height="24" rx="3"/>
  <text class="ink sm" x="30" y="51" text-anchor="start">товар;цена</text>
  <rect class="box" x="20" y="62" width="150" height="24" rx="3"/>
  <text class="ink sm" x="30" y="79" text-anchor="start">Молоко;92,40</text>
  <rect class="box" x="20" y="90" width="150" height="24" rx="3"/>
  <text class="ink sm" x="30" y="107" text-anchor="start">Сливки;118,75</text>
  <text class="ink2 sm b" x="270" y="26" text-anchor="middle">read_csv(f)</text>
  <rect class="box" x="190" y="34" width="76" height="24" rx="3"/>
  <text class="mut sm" x="228" y="51" text-anchor="middle">(индекс)</text>
  <rect class="box" x="268" y="34" width="84" height="24" rx="3"/>
  <text class="ink2 sm b" x="310" y="51" text-anchor="middle">товар;цена</text>
  <rect class="box-err" x="190" y="62" width="76" height="24" rx="3"/>
  <text class="ink sm" x="228" y="79" text-anchor="middle">Молоко;92</text>
  <rect class="box-err" x="268" y="62" width="84" height="24" rx="3"/>
  <text class="ink sm" x="310" y="79" text-anchor="middle">40</text>
  <rect class="box-err" x="190" y="90" width="76" height="24" rx="3"/>
  <text class="ink sm" x="228" y="107" text-anchor="middle">Сливки;118</text>
  <rect class="box-err" x="268" y="90" width="84" height="24" rx="3"/>
  <text class="ink sm" x="310" y="107" text-anchor="middle">75</text>
  <text class="err sm b" x="270" y="150" text-anchor="middle">shape (2, 1): резал по</text>
  <text class="err sm b" x="270" y="166" text-anchor="middle">запятой — каша</text>
  <text class="ink2 sm b" x="440" y="26" text-anchor="middle">sep=";"</text>
  <rect class="box" x="360.0" y="34" width="78.0" height="24" rx="3"/>
  <text class="ink2 sm b" x="400.0" y="51" text-anchor="middle">товар</text>
  <rect class="box" x="440.0" y="34" width="78.0" height="24" rx="3"/>
  <text class="ink2 sm b" x="480.0" y="51" text-anchor="middle">цена</text>
  <rect class="box" x="360.0" y="62" width="78.0" height="24" rx="3"/>
  <text class="ink sm" x="400.0" y="79" text-anchor="middle">Молоко</text>
  <rect class="box-warn" x="440.0" y="62" width="78.0" height="24" rx="3"/>
  <text class="ink sm" x="480.0" y="79" text-anchor="middle">'92,40'</text>
  <rect class="box" x="360.0" y="90" width="78.0" height="24" rx="3"/>
  <text class="ink sm" x="400.0" y="107" text-anchor="middle">Сливки</text>
  <rect class="box-warn" x="440.0" y="90" width="78.0" height="24" rx="3"/>
  <text class="ink sm" x="480.0" y="107" text-anchor="middle">'118,75'</text>
  <text class="warn sm b" x="440" y="150" text-anchor="middle">два столбца, но цена —</text>
  <text class="warn sm b" x="440" y="166" text-anchor="middle">текст (str)</text>
  <text class="ink2 sm b" x="610" y="26" text-anchor="middle">sep=";", decimal=","</text>
  <rect class="box" x="530.0" y="34" width="78.0" height="24" rx="3"/>
  <text class="ink2 sm b" x="570.0" y="51" text-anchor="middle">товар</text>
  <rect class="box" x="610.0" y="34" width="78.0" height="24" rx="3"/>
  <text class="ink2 sm b" x="650.0" y="51" text-anchor="middle">цена</text>
  <rect class="box" x="530.0" y="62" width="78.0" height="24" rx="3"/>
  <text class="ink sm" x="570.0" y="79" text-anchor="middle">Молоко</text>
  <rect class="box-ok" x="610.0" y="62" width="78.0" height="24" rx="3"/>
  <text class="ink sm" x="650.0" y="79" text-anchor="middle">92.4</text>
  <rect class="box" x="530.0" y="90" width="78.0" height="24" rx="3"/>
  <text class="ink sm" x="570.0" y="107" text-anchor="middle">Сливки</text>
  <rect class="box-ok" x="610.0" y="90" width="78.0" height="24" rx="3"/>
  <text class="ink sm" x="650.0" y="107" text-anchor="middle">118.75</text>
  <text class="ok sm b" x="610" y="150" text-anchor="middle">цена — число</text>
  <text class="ok sm b" x="610" y="166" text-anchor="middle">(float64), сумма 211.15</text>
  <rect class="box" x="20" y="200" width="660" height="84" rx="6"/>
  <text class="ink sm b" x="36" y="222" text-anchor="start">Три вопроса к файлу перед загрузкой:</text>
  <text class="ink sm" x="36" y="242" text-anchor="start">чем разделены столбцы → sep;   как записаны дроби и тысячи → decimal, thousands;</text>
  <text class="ink sm" x="36" y="262" text-anchor="start">в какой кодировке текст → encoding.   Проверка после загрузки — df.shape и df.dtypes.</text>
</svg>
