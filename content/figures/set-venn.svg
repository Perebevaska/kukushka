<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-set-venn">
  <title id="t-set-venn">Гости сентября и октября: пересечение, разность, объединение</title>
  <defs><marker id="ah-set-venn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <ellipse class="ln-acc" cx="270" cy="130" rx="150" ry="95"/>
  <ellipse class="ln" cx="430" cy="130" rx="150" ry="95"/>
  <text class="acc sm b" x="190" y="30" text-anchor="middle">S — сентябрь (4 гостя)</text>
  <text class="ink2 sm b" x="510" y="30" text-anchor="middle">O — октябрь (4 гостя)</text>
  <text class="ink" x="195" y="104" text-anchor="middle">Анна</text>
  <text class="ink" x="195" y="126" text-anchor="middle">Вера</text>
  <text class="ink b" x="350" y="104" text-anchor="middle">Борис</text>
  <text class="ink b" x="350" y="126" text-anchor="middle">Глеб</text>
  <text class="ink" x="505" y="104" text-anchor="middle">Дина</text>
  <text class="ink" x="505" y="126" text-anchor="middle">Ева</text>
  <text class="acc sm b" x="195" y="164" text-anchor="middle">S - O</text>
  <text class="mut sm" x="195" y="180" text-anchor="middle">ушли</text>
  <text class="acc sm b" x="350" y="164" text-anchor="middle">S &amp; O</text>
  <text class="mut sm" x="350" y="180" text-anchor="middle">вернулись</text>
  <text class="ink2 sm b" x="505" y="164" text-anchor="middle">O - S</text>
  <text class="mut sm" x="505" y="180" text-anchor="middle">новые</text>
  <text class="ink2" x="350" y="250" text-anchor="middle">S | O — все гости двух месяцев: 6.  Удержание: 2 из 4 = 50%.</text>
  <text class="mut sm" x="350" y="272" text-anchor="middle">Повторы (Анна в сентябре дважды) множество убрало ещё при set(...).</text>
</svg>
