<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-return-print">
  <title id="t-return-print">print показывает значение, return отдаёт его в программу</title>
  <defs><marker id="ah-return-print" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="170" y="28" text-anchor="middle">avg_print(84530, 260)</text>
  <text class="ink b" x="530" y="28" text-anchor="middle">avg_return(84530, 260)</text>
  <rect class="box" x="70" y="44" width="200" height="40" rx="6"/>
  <text class="ink sm" x="170.0" y="68.5" text-anchor="middle">print(325.12)</text>
  <rect class="box-acc" x="430" y="44" width="200" height="40" rx="6"/>
  <text class="ink sm b" x="530.0" y="68.5" text-anchor="middle">return 325.12</text>
  <rect class="box" x="20" y="124" width="130" height="40" rx="6"/>
  <text class="mut sm" x="85.0" y="141.0" text-anchor="middle">экран:</text>
  <text class="ink sm b" x="85.0" y="156.0" text-anchor="middle">325.12</text>
  <rect class="box-err" x="180" y="124" width="140" height="40" rx="6"/>
  <text class="err b" x="250.0" y="148.5" text-anchor="middle">a = None</text>
  <path class="ln" d="M140,86 L100,120" marker-end="url(#ah-return-print)"/>
  <path class="ln-mut" d="M210,86 L240,120" marker-end="url(#ah-return-print)"/>
  <text class="mut sm" x="250" y="104" text-anchor="start">ничего не вернула</text>
  <rect class="box-ok" x="450" y="124" width="160" height="40" rx="6"/>
  <text class="ink b" x="530.0" y="148.5" text-anchor="middle">b = 325.12</text>
  <path class="ln-acc" d="M530,86 L530,120" marker-end="url(#ah-return-print)"/>
  <text class="err sm" x="170" y="192" text-anchor="middle">число видно, но в a его нет: a + 1 → TypeError</text>
  <text class="ok sm" x="530" y="192" text-anchor="middle">b можно складывать, сравнивать, передавать</text>
  <path class="ln-mut" d="M350,20 L350,200"/>
</svg>
