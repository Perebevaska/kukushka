<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-overfit-toy">
  <title id="t-overfit-toy">Простое правило и «зубрила» на шести доставках</title>
  <defs><marker id="ah-overfit-toy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="20" y="30" text-anchor="start">правило «больше 2 км»</text>
  <rect class="box-ok" x="60.0" y="44" width="198.0" height="56" rx="2"/>
  <text class="ok sm b" x="159.0" y="60" text-anchor="middle">«нет»</text>
  <rect class="box-err" x="258.0" y="44" width="297.0" height="56" rx="2"/>
  <text class="err sm b" x="406.5" y="60" text-anchor="middle">«да»</text>
  <circle class="ok" cx="93.0" cy="76.0" r="6"/>
  <circle class="err" cx="142.5" cy="76.0" r="6"/>
  <circle class="err" cx="423.0" cy="76.0" r="6"/>
  <circle class="err" cx="505.5" cy="76.0" r="6"/>
  <rect class="box-ok" x="120.0" y="86" width="12" height="12" rx="1"/>
  <text class="ok b" x="126.0" y="118" text-anchor="middle">✓</text>
  <rect class="box-err" x="450.0" y="86" width="12" height="12" rx="1"/>
  <text class="ok b" x="456.0" y="118" text-anchor="middle">✓</text>
  <text class="ink2 sm" x="615" y="70" text-anchor="middle">обучение 3 из 4</text>
  <text class="ink sm b" x="615" y="88" text-anchor="middle">тест 2 из 2</text>
  <text class="ink b" x="20" y="160" text-anchor="start">зубрила (дерево без ограничений)</text>
  <rect class="box-ok" x="60.0" y="174" width="57.7" height="56" rx="2"/>
  <text class="ok sm b" x="88.9" y="190" text-anchor="middle">«нет»</text>
  <rect class="box-err" x="117.7" y="174" width="165.0" height="56" rx="2"/>
  <text class="err sm b" x="200.2" y="190" text-anchor="middle">«да»</text>
  <rect class="box-err" x="282.8" y="174" width="272.2" height="56" rx="2"/>
  <text class="err sm b" x="418.9" y="190" text-anchor="middle">«да»</text>
  <circle class="ok" cx="93.0" cy="206.0" r="6"/>
  <circle class="err" cx="142.5" cy="206.0" r="6"/>
  <circle class="err" cx="423.0" cy="206.0" r="6"/>
  <circle class="err" cx="505.5" cy="206.0" r="6"/>
  <rect class="box-ok" x="120.0" y="216" width="12" height="12" rx="1"/>
  <text class="err b" x="126.0" y="248" text-anchor="middle">✗</text>
  <rect class="box-err" x="450.0" y="216" width="12" height="12" rx="1"/>
  <text class="ok b" x="456.0" y="248" text-anchor="middle">✓</text>
  <text class="ink2 sm" x="615" y="200" text-anchor="middle">обучение 4 из 4</text>
  <text class="ink sm b" x="615" y="218" text-anchor="middle">тест 1 из 2</text>
  <text class="mut sm" x="93.0" y="278" text-anchor="middle">1</text>
  <text class="mut sm" x="175.5" y="278" text-anchor="middle">1.5</text>
  <text class="mut sm" x="258.0" y="278" text-anchor="middle">2</text>
  <text class="mut sm" x="340.5" y="278" text-anchor="middle">2.5</text>
  <text class="mut sm" x="423.00000000000006" y="278" text-anchor="middle">3</text>
  <text class="mut sm" x="505.50000000000006" y="278" text-anchor="middle">3.5</text>
  <text class="mut sm" x="142.5" y="140" text-anchor="middle">курьер заблудился</text>
  <text class="mut sm" x="300" y="296" text-anchor="middle">км; кружки — обучение, квадратики — тест (зелёный — вовремя, красный — опоздала)</text>
