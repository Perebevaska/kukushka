<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ev-areas">
  <title id="t-ev-areas">Математическое ожидание как площадь: значение × вероятность</title>
  <defs><marker id="ah-ev-areas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="70.0" y="208.0" width="448.4" height="2.0" rx="2"/>
  <rect class="box-warn" x="518.4" y="160.0" width="82.6" height="50.0" rx="2"/>
  <rect class="box-err" x="601.0" y="60.0" width="59.0" height="150.0" rx="2"/>
  <text class="ink2 sm" x="294.2" y="229" text-anchor="middle">вовремя: 0 ₽ × 0.76 = 0</text>
  <text class="ink sm" x="559.7" y="136.0" text-anchor="middle">100 × 0.14</text>
  <text class="ink sm b" x="559.7" y="152.0" text-anchor="middle">= 14</text>
  <text class="ink sm" x="630.5" y="36.0" text-anchor="middle">300 × 0.10</text>
  <text class="ink sm b" x="630.5" y="52.0" text-anchor="middle">= 30</text>
  <path class="ln-acc dash" d="M70,188.0 L660,188.0"/>
  <text class="acc sm b" x="76" y="178.0" text-anchor="start">E[X] = 0 + 14 + 30 = 44 ₽: та же площадь, разложенная ровно по всей ширине</text>
  <path class="ln" d="M70,210 L660,210"/>
  <path class="ln" d="M70.0,210 L70.0,215"/>
  <text class="mut sm" x="70.0" y="229" text-anchor="middle">0</text>
  <path class="ln" d="M518.4,210 L518.4,215"/>
  <text class="mut sm" x="518.4" y="229" text-anchor="middle">0.76</text>
  <path class="ln" d="M601.0,210 L601.0,215"/>
  <text class="mut sm" x="601.0" y="229" text-anchor="middle">0.9</text>
  <path class="ln" d="M660.0,210 L660.0,215"/>
  <text class="mut sm" x="660.0" y="229" text-anchor="middle">1</text>
  <text class="ink2 sm" x="365.0" y="250" text-anchor="middle">ширина — вероятность исхода, высота — сумма купона, площадь — вклад в ожидание</text>
  <path class="ln-mut" d="M70,210 L70,60.0"/>
  <text class="mut sm" x="64" y="164.0" text-anchor="end">100 ₽</text>
  <text class="mut sm" x="64" y="64.0" text-anchor="end">300 ₽</text>
</svg>
