<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-accum-steps">
  <title id="t-accum-steps">Накопитель total шаг за шагом</title>
  <defs><marker id="ah-accum-steps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="30" y="60" width="90" height="40" rx="6"/>
  <text class="ink sm b" x="75.0" y="84.5" text-anchor="middle">total = 0</text>
  <text class="mut sm" x="75" y="120" text-anchor="middle">до цикла</text>
  <text class="mut sm" x="75" y="136" text-anchor="middle">один раз</text>
  <path class="ln" d="M122,80 L191,80" marker-end="url(#ah-accum-steps)"/>
  <text class="acc sm b" x="158.5" y="70" text-anchor="middle">+ 210</text>
  <rect class="box" x="195" y="60" width="90" height="40" rx="6"/>
  <text class="ink sm b" x="240.0" y="84.5" text-anchor="middle">total = 210</text>
  <text class="mut sm" x="240" y="120" text-anchor="middle">проход 1</text>
  <text class="mut sm" x="240" y="136" text-anchor="middle">p = 210</text>
  <path class="ln" d="M287,80 L356,80" marker-end="url(#ah-accum-steps)"/>
  <text class="acc sm b" x="323.5" y="70" text-anchor="middle">+ 190</text>
  <rect class="box" x="360" y="60" width="90" height="40" rx="6"/>
  <text class="ink sm b" x="405.0" y="84.5" text-anchor="middle">total = 400</text>
  <text class="mut sm" x="405" y="120" text-anchor="middle">проход 2</text>
  <text class="mut sm" x="405" y="136" text-anchor="middle">p = 190</text>
  <path class="ln" d="M452,80 L521,80" marker-end="url(#ah-accum-steps)"/>
  <text class="acc sm b" x="488.5" y="70" text-anchor="middle">+ 260</text>
  <rect class="box-ok" x="525" y="60" width="90" height="40" rx="6"/>
  <text class="ink sm b" x="570.0" y="84.5" text-anchor="middle">total = 660</text>
  <text class="mut sm" x="570" y="120" text-anchor="middle">проход 3</text>
  <text class="mut sm" x="570" y="136" text-anchor="middle">p = 260</text>
  <text class="ok sm b" x="570" y="44" text-anchor="middle">print → 660</text>
  <text class="ink2 sm" x="30" y="30" text-anchor="start">prices = [210, 190, 260]</text>
  <rect class="box-err" x="30" y="162" width="650" height="72" rx="6"/>
  <text class="err sm b" x="46" y="186" text-anchor="start">Если total = 0 стоит внутри цикла:</text>
  <text class="ink sm" x="46" y="206" text-anchor="start">проход 1: 0 + 210 = 210  |  проход 2: 0 + 190 = 190  |  проход 3: 0 + 260 = 260</text>
  <text class="ink sm" x="46" y="224" text-anchor="start">накопитель обнуляется на каждом шаге — в конце только последняя цена, 260</text>
</svg>
