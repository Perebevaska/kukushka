  <path class="ln-mut dash" d="M120.0,40 L120.0,250"/>
  <text class="mut sm" x="160.0" y="30" text-anchor="middle">2.11</text>
  <path class="ln-mut dash" d="M200.0,40 L200.0,250"/>
  <text class="mut sm" x="240.0" y="30" text-anchor="middle">3.11</text>
