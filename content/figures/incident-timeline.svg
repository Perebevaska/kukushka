<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-incident-timeline">
  <title id="t-incident-timeline">Разбор инцидента: три независимые проблемы на одной шкале времени, 2–8 ноября 2026</title>
