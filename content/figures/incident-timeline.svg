  <text class="mut sm" x="480.0" y="30" text-anchor="middle">6.11</text>
  <path class="ln-mut dash" d="M520.0,40 L520.0,250"/>
  <text class="mut sm" x="560.0" y="30" text-anchor="middle">7.11</text>
