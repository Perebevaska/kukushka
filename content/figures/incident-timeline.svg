  <text class="ink sm b" x="14" y="74" text-anchor="start">время ответа</text>
  <text class="mut sm" x="14" y="90" text-anchor="start">жалоба 1</text>
  <path class="ln-mut" d="M120,80 L680,80"/>
  <text class="ink sm b" x="14" y="144" text-anchor="start">вход приложения 3.2</text>
  <text class="mut sm" x="14" y="160" text-anchor="start">жалоба 3</text>
  <path class="ln-mut" d="M120,150 L680,150"/>
  <text class="ink sm b" x="14" y="214" text-anchor="start">ошибки сайта</text>
  <text class="mut sm" x="14" y="230" text-anchor="start">жалоба 2</text>
  <path class="ln-mut" d="M120,220 L680,220"/>
  <rect class="box-warn" x="393.33333333333337" y="60" width="286.66666666666663" height="26" rx="3"/>
  <text class="ink sm b" x="536.6666666666667" y="78" text-anchor="middle">p95 ≈ 135 мс при норме 100</text>
  <text class="ink2 sm" x="385.33333333333337" y="78" text-anchor="end">выкатили 1.1 (лес) →</text>
  <rect class="box-err" x="466.66666666666663" y="130" width="213.33333333333337" height="26" rx="3"/>
  <text class="ink sm b" x="573.3333333333333" y="148" text-anchor="middle">чек × 100, а ответ — 200</text>
  <text class="ink2 sm" x="458.66666666666663" y="148" text-anchor="end">вышло приложение 3.2 →</text>
  <rect class="box-err" x="580.0" y="200" width="100.0" height="26" rx="3"/>
  <text class="ink sm b" x="630.0" y="218" text-anchor="middle">500</text>
  <text class="ink2 sm" x="572.0" y="218" text-anchor="end">сайт перестал слать delivery_share →</text>
  <text class="ink2 sm" x="350" y="270" text-anchor="middle">откат на 1.0 починил бы скорость, но логистическая регрессия на копейках отправила бы в акцию всех гостей 3.2</text>
  <text class="mut sm" x="350" y="290" text-anchor="middle">время событий — из итога разбора; полосы — когда проблема действовала</text>
