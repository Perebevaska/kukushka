<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ordinal-tiers">
  <title id="t-ordinal-tiers">Алфавитный и смысловой порядок уровней карты</title>
  <defs><marker id="ah-ordinal-tiers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="err b" x="20" y="24" text-anchor="start">OrdinalEncoder() — по алфавиту</text>
  <rect class="box" x="20" y="36" width="136" height="44" rx="6"/>
  <text class="ink sm b" x="88.0" y="54.0" text-anchor="middle">0 = базовая</text>
  <text class="ink2 sm" x="88.0" y="71.0" text-anchor="middle">ушли 36.4 %</text>
  <rect class="box" x="170" y="36" width="136" height="44" rx="6"/>
  <text class="ink sm b" x="238.0" y="54.0" text-anchor="middle">1 = золотая</text>
  <text class="ink2 sm" x="238.0" y="71.0" text-anchor="middle">ушли 13.0 %</text>
  <rect class="box" x="320" y="36" width="136" height="44" rx="6"/>
  <text class="ink sm b" x="388.0" y="54.0" text-anchor="middle">2 = серебряная</text>
  <text class="ink2 sm" x="388.0" y="71.0" text-anchor="middle">ушли 17.4 %</text>
  <path class="ln-err" d="M500.0,43.0 L580.0,75.8 L660.0,69.6"/>
  <circle class="err" cx="500.0" cy="43.0" r="5"/>
  <text class="mut sm" x="500" y="108" text-anchor="middle">0</text>
  <circle class="err" cx="580.0" cy="75.8" r="5"/>
  <text class="mut sm" x="580" y="108" text-anchor="middle">1</text>
  <circle class="err" cx="660.0" cy="69.6" r="5"/>
  <text class="mut sm" x="660" y="108" text-anchor="middle">2</text>
  <text class="ink2 sm" x="20" y="102" text-anchor="start">доля ушедших скачет: 36 → 13 → 17 %</text>
  <text class="ok b" x="20" y="128" text-anchor="start">categories=[TIERS] — по смыслу</text>
  <rect class="box" x="20" y="140" width="136" height="44" rx="6"/>
  <text class="ink sm b" x="88.0" y="158.0" text-anchor="middle">0 = базовая</text>
  <text class="ink2 sm" x="88.0" y="175.0" text-anchor="middle">ушли 36.4 %</text>
  <rect class="box" x="170" y="140" width="136" height="44" rx="6"/>
  <text class="ink sm b" x="238.0" y="158.0" text-anchor="middle">1 = серебряная</text>
  <text class="ink2 sm" x="238.0" y="175.0" text-anchor="middle">ушли 17.4 %</text>
  <rect class="box" x="320" y="140" width="136" height="44" rx="6"/>
  <text class="ink sm b" x="388.0" y="158.0" text-anchor="middle">2 = золотая</text>
  <text class="ink2 sm" x="388.0" y="175.0" text-anchor="middle">ушли 13.0 %</text>
  <path class="ln-acc" d="M500.0,147.0 L580.0,173.6 L660.0,179.8"/>
  <circle class="acc" cx="500.0" cy="147.0" r="5"/>
  <text class="mut sm" x="500" y="212" text-anchor="middle">0</text>
  <circle class="acc" cx="580.0" cy="173.6" r="5"/>
  <text class="mut sm" x="580" y="212" text-anchor="middle">1</text>
  <circle class="acc" cx="660.0" cy="179.8" r="5"/>
  <text class="mut sm" x="660" y="212" text-anchor="middle">2</text>
  <text class="ink2 sm" x="20" y="206" text-anchor="start">доля ушедших падает: 36 → 17 → 13 %</text>
  <text class="mut sm" x="580" y="230" text-anchor="middle">код 0, 1, 2 →</text>
</svg>
