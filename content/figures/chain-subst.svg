<svg viewBox="0 0 700 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-chain-subst">
  <title id="t-chain-subst">Цепные подстановки: меняем множители по одному</title>
  <defs><marker id="ah-chain-subst" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <path class="ln" d="M30,262.0 L670,262.0"/>
  <rect class="box" x="38.0" y="145.0" width="84" height="117.0" rx="2"/>
  <text class="ink sm b" x="80" y="137.0" text-anchor="middle">245 000</text>
  <rect class="box-ok" x="173.0" y="81.29999999999998" width="84" height="63.70000000000002" rx="2"/>
  <text class="ok sm b" x="215" y="73.29999999999998" text-anchor="middle">+24 500</text>
  <rect class="box-err" x="308.0" y="81.29999999999998" width="84" height="70.07000000000002" rx="2"/>
  <text class="err sm b" x="350" y="167.37" text-anchor="middle">−26 950</text>
  <rect class="box-err" x="443.0" y="151.37" width="84" height="27.026999999999987" rx="2"/>
  <text class="err sm b" x="485" y="194.397" text-anchor="middle">−10 395</text>
  <rect class="box" x="578.0" y="178.397" width="84" height="83.60300000000001" rx="2"/>
  <text class="ink sm b" x="620" y="170.397" text-anchor="middle">232 155</text>
  <path class="ln-mut dash" d="M122.0,145.0 L173.0,145.0"/>
  <path class="ln-mut dash" d="M257.0,81.29999999999998 L308.0,81.29999999999998"/>
  <path class="ln-mut dash" d="M392.0,151.37 L443.0,151.37"/>
  <path class="ln-mut dash" d="M527.0,178.397 L578.0,178.397"/>
  <text class="ink sm b" x="80" y="284" text-anchor="middle">август</text>
  <text class="ink sm" x="80" y="302" text-anchor="middle">1000 × 0.70 × 350</text>
  <text class="mut sm" x="80" y="320" text-anchor="middle">= 245 000</text>
  <text class="ink sm b" x="215" y="284" text-anchor="middle">шаг 1: гости</text>
  <text class="ink sm" x="215" y="302" text-anchor="middle"><tspan class="acc b">1100</tspan> × 0.70 × 350</text>
  <text class="mut sm" x="215" y="320" text-anchor="middle">= 269 500</text>
  <text class="ink sm b" x="350" y="284" text-anchor="middle">шаг 2: конверсия</text>
  <text class="ink sm" x="350" y="302" text-anchor="middle">1100 × <tspan class="acc b">0.63</tspan> × 350</text>
  <text class="mut sm" x="350" y="320" text-anchor="middle">= 242 550</text>
  <text class="ink sm b" x="485" y="284" text-anchor="middle">шаг 3: чек</text>
  <text class="ink sm" x="485" y="302" text-anchor="middle">1100 × 0.63 × <tspan class="acc b">335</tspan></text>
  <text class="mut sm" x="485" y="320" text-anchor="middle">= 232 155</text>
  <text class="ink sm b" x="620" y="284" text-anchor="middle">сентябрь</text>
  <text class="ink sm" x="620" y="302" text-anchor="middle">1100 × 0.63 × 335</text>
  <text class="mut sm" x="620" y="320" text-anchor="middle">= 232 155</text>
  <text class="mut sm" x="350" y="344" text-anchor="middle">шкала начинается с 200 000 ₽ · сумма трёх шагов: +24 500 − 26 950 − 10 395 = −12 845 ₽ — всё изменение выручки</text>
