<svg viewBox="0 0 700 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-at-least-one">
  <title id="t-at-least-one">Хотя бы одно опоздание из трёх — через противоположное событие</title>
  <defs><marker id="ah-at-least-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-ok" x="20" y="24" width="96" height="54" rx="6"/>
  <text class="ink sm b" x="68.0" y="47.0" text-anchor="middle">доставка 1</text>
  <text class="ink2 sm" x="68.0" y="64.0" text-anchor="middle">вовремя 0.76</text>
  <text class="ink b" x="124" y="56" text-anchor="middle">×</text>
  <rect class="box-ok" x="132" y="24" width="96" height="54" rx="6"/>
  <text class="ink sm b" x="180.0" y="47.0" text-anchor="middle">доставка 2</text>
  <text class="ink2 sm" x="180.0" y="64.0" text-anchor="middle">вовремя 0.76</text>
  <text class="ink b" x="236" y="56" text-anchor="middle">×</text>
  <rect class="box-ok" x="244" y="24" width="96" height="54" rx="6"/>
  <text class="ink sm b" x="292.0" y="47.0" text-anchor="middle">доставка 3</text>
  <text class="ink2 sm" x="292.0" y="64.0" text-anchor="middle">вовремя 0.76</text>
  <path class="ln" d="M356,51 L396,51" marker-end="url(#ah-at-least-one)"/>
  <rect class="box-ok" x="400" y="24" width="280" height="54" rx="6"/>
  <text class="ink sm b" x="540.0" y="47.0" text-anchor="middle">все три вовремя</text>
  <text class="ink b" x="540.0" y="64.0" text-anchor="middle">0.76³ = 0.439</text>
  <rect class="box-ok" x="20" y="112" width="289.72416000000004" height="34" rx="3"/>
  <rect class="box-err" x="309.72416000000004" y="112" width="370.27583999999996" height="34" rx="3"/>
  <text class="ink sm b" x="164.86208000000002" y="134" text-anchor="middle">все вовремя: 0.439</text>
  <text class="ink sm b" x="494.86208" y="134" text-anchor="middle">хотя бы одна опоздала: 1 − 0.439 = 0.561</text>
  <path class="ln-mut dash" d="M309.72416000000004,100 L309.72416000000004,156"/>
  <text class="mut sm" x="20" y="172" text-anchor="middle">0</text>
  <text class="mut sm" x="350.0" y="172" text-anchor="middle">0.5</text>
  <text class="mut sm" x="680" y="172" text-anchor="middle">1</text>
  <text class="ink2 sm" x="350" y="198" text-anchor="middle">противоположное событие считать проще; формула верна, только если опоздания независимы</text>
</svg>
