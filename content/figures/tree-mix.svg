<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-tree-mix">
  <title id="t-tree-mix">Дерево глубины 2 на исходных признаках и на смесях X @ P</title>
  <defs><marker id="ah-tree-mix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="150" y="22" text-anchor="middle">исходные X: вопросы осмысленны</text>
  <rect class="box-acc" x="80" y="32" width="140" height="30" rx="6"/>
  <text class="ink sm b" x="150.0" y="51.5" text-anchor="middle">km ≤ 3.15</text>
  <path class="ln" d="M120,64 L70,94" marker-end="url(#ah-tree-mix)"/>
  <text class="mut sm" x="88.0" y="76" text-anchor="end">да</text>
  <rect class="box" x="8" y="96" width="124" height="30" rx="6"/>
  <text class="ink sm b" x="70.0" y="115.5" text-anchor="middle">walk ≤ 0.50</text>
  <path class="ln" d="M50,128 L34,156" marker-end="url(#ah-tree-mix)"/>
  <rect class="box-ok" x="0" y="158" width="68" height="30" rx="6"/>
  <text class="ink sm b" x="34.0" y="177.5" text-anchor="middle">28.6 мин</text>
  <path class="ln" d="M90,128 L106,156" marker-end="url(#ah-tree-mix)"/>
  <rect class="box-ok" x="72" y="158" width="68" height="30" rx="6"/>
  <text class="ink sm b" x="106.0" y="177.5" text-anchor="middle">37.0 мин</text>
  <path class="ln" d="M180,64 L230,94" marker-end="url(#ah-tree-mix)"/>
  <text class="mut sm" x="212.0" y="76" text-anchor="start">нет</text>
  <rect class="box" x="168" y="96" width="124" height="30" rx="6"/>
  <text class="ink sm b" x="230.0" y="115.5" text-anchor="middle">walk ≤ 0.50</text>
  <path class="ln" d="M210,128 L194,156" marker-end="url(#ah-tree-mix)"/>
  <rect class="box-ok" x="160" y="158" width="68" height="30" rx="6"/>
  <text class="ink sm b" x="194.0" y="177.5" text-anchor="middle">38.9 мин</text>
  <path class="ln" d="M250,128 L266,156" marker-end="url(#ah-tree-mix)"/>
  <rect class="box-err" x="232" y="158" width="68" height="30" rx="6"/>
  <text class="ink sm b" x="266.0" y="177.5" text-anchor="middle">68.7 мин</text>
  <text class="ink b" x="150" y="214" text-anchor="middle">R² = 0.385</text>
  <path class="ln-mut" d="M350,20 L350,230"/>
  <text class="ink sm b" x="500" y="22" text-anchor="middle">смеси X @ P: пеший «размазан»</text>
  <rect class="box-acc" x="430" y="32" width="140" height="30" rx="6"/>
  <text class="ink sm b" x="500.0" y="51.5" text-anchor="middle">b ≤ 5.43</text>
  <path class="ln" d="M470,64 L420,94" marker-end="url(#ah-tree-mix)"/>
  <text class="mut sm" x="438.0" y="76" text-anchor="end">да</text>
  <rect class="box" x="358" y="96" width="124" height="30" rx="6"/>
  <text class="ink sm b" x="420.0" y="115.5" text-anchor="middle">c ≤ 1.53</text>
  <path class="ln" d="M400,128 L384,156" marker-end="url(#ah-tree-mix)"/>
  <rect class="box-ok" x="350" y="158" width="68" height="30" rx="6"/>
  <text class="ink sm b" x="384.0" y="177.5" text-anchor="middle">27.2 мин</text>
  <path class="ln" d="M440,128 L456,156" marker-end="url(#ah-tree-mix)"/>
  <rect class="box-ok" x="422" y="158" width="68" height="30" rx="6"/>
  <text class="ink sm b" x="456.0" y="177.5" text-anchor="middle">33.7 мин</text>
  <path class="ln" d="M530,64 L580,94" marker-end="url(#ah-tree-mix)"/>
  <text class="mut sm" x="562.0" y="76" text-anchor="start">нет</text>
  <rect class="box" x="518" y="96" width="124" height="30" rx="6"/>
  <text class="ink sm b" x="580.0" y="115.5" text-anchor="middle">b ≤ 7.57</text>
  <path class="ln" d="M560,128 L544,156" marker-end="url(#ah-tree-mix)"/>
  <rect class="box-ok" x="510" y="158" width="68" height="30" rx="6"/>
  <text class="ink sm b" x="544.0" y="177.5" text-anchor="middle">39.0 мин</text>
  <path class="ln" d="M600,128 L616,156" marker-end="url(#ah-tree-mix)"/>
  <rect class="box-ok" x="582" y="158" width="68" height="30" rx="6"/>
  <text class="ink sm b" x="616.0" y="177.5" text-anchor="middle">48.8 мин</text>
  <text class="ink b" x="500" y="214" text-anchor="middle">R² = 0.296</text>
  <text class="err sm b" x="150" y="240" text-anchor="middle">пеший на дальнем заказе — отдельный лист</text>
  <text class="err sm b" x="500" y="240" text-anchor="middle">группы «68.7 минуты» больше нет</text>
  <text class="ink2 sm" x="350" y="272" text-anchor="middle">дерево режет по одному признаку за раз: если смысл растворён в смесях, порог его не ловит;</text>
  <text class="mut sm" x="350" y="290" text-anchor="middle">линейной регрессии всё равно — её R² 0.505 и там и там</text>
</svg>
