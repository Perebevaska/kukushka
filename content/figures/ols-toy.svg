<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ols-toy">
  <title id="t-ols-toy">Прямая наименьших квадратов на четырёх заказах и её ошибки</title>
  <defs><marker id="ah-ols-toy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <path class="ln" d="M70,260 L392.0,260"/>
  <path class="ln" d="M70,260 L70,29.0"/>
  <text class="mut sm" x="70" y="276" text-anchor="middle">0</text>
  <text class="mut sm" x="140" y="276" text-anchor="middle">1</text>
  <text class="mut sm" x="210" y="276" text-anchor="middle">2</text>
  <text class="mut sm" x="280" y="276" text-anchor="middle">3</text>
  <text class="mut sm" x="350" y="276" text-anchor="middle">4</text>
  <text class="mut sm" x="62" y="264" text-anchor="end">0</text>
  <text class="mut sm" x="62" y="154" text-anchor="end">5</text>
  <text class="mut sm" x="62" y="44" text-anchor="end">10</text>
  <text class="mut sm" x="231.0" y="294" text-anchor="middle">км</text>
  <text class="mut sm" x="76" y="25.0" text-anchor="start">минут</text>
  <path class="ln-acc" d="M105.0,224.8 L378.0,36.0"/>
  <path class="ln-err dash" d="M140.0,194.0 L140.0,200.6"/>
  <circle class="box-warn" cx="140.0" cy="194.0" r="5"/>
  <text class="err sm b" x="148.0" y="201.3" text-anchor="start">0.3</text>
  <path class="ln-err dash" d="M210.0,172.0 L210.0,152.2"/>
  <circle class="box-warn" cx="210.0" cy="172.0" r="5"/>
  <text class="err sm b" x="218.0" y="166.10000000000002" text-anchor="start">−0.9</text>
  <path class="ln-err dash" d="M280.0,84.0 L280.0,103.8"/>
  <circle class="box-warn" cx="280.0" cy="84.0" r="5"/>
  <text class="err sm b" x="288.0" y="97.9" text-anchor="start">0.9</text>
  <path class="ln-err dash" d="M350.0,62.0 L350.0,55.4"/>
  <circle class="box-warn" cx="350.0" cy="62.0" r="5"/>
  <text class="err sm b" x="358.0" y="62.69999999999999" text-anchor="start">−0.3</text>
  <text class="acc sm b" x="374.0" y="26.039999999999964" text-anchor="end">ŷ = 0.5 + 2.2·x</text>
  <text class="ink sm b" x="420" y="40" text-anchor="start">ошибки y − ŷ:</text>
  <text class="err sm" x="420" y="60" text-anchor="start">0.3, −0.9, 0.9, −0.3</text>
  <text class="ink sm b" x="420" y="92" text-anchor="start">сумма квадратов ошибок:</text>
  <text class="ink sm" x="420" y="112" text-anchor="start">0.3² + 0.9² + 0.9² + 0.3² = 1.8</text>
  <text class="mut sm" x="420" y="132" text-anchor="start">у любой другой прямой — больше</text>
  <text class="ink sm b" x="420" y="172" text-anchor="start">ошибки «перпендикулярны» столбцам X1:</text>
  <text class="ok sm" x="420" y="192" text-anchor="start">сумма ошибок = 0</text>
  <text class="ok sm" x="420" y="212" text-anchor="start">сумма x · ошибка = 0</text>
  <text class="mut sm" x="420" y="236" text-anchor="start">то есть X1ᵀ(y − X1·w) = 0 —</text>
  <text class="mut sm" x="420" y="254" text-anchor="start">сдвинуть веса и уменьшить ошибку</text>
  <text class="mut sm" x="420" y="272" text-anchor="start">больше нельзя</text>
</svg>
