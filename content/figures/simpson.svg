<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-simpson">
  <title id="t-simpson">Парадокс Симпсона: внутри групп A лучше, в сумме — хуже</title>
  <defs><marker id="ah-simpson" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="170" y="24" text-anchor="middle">внутри каждой группы маршрутов</text>
  <text class="ink sm b" x="20" y="58" text-anchor="start">короткие</text>
  <text class="ink sm b" x="30" y="79" text-anchor="start">A</text>
  <rect class="box-ok" x="50" y="64" width="31.428571428571427" height="20" rx="2"/>
  <text class="ink sm" x="87.42857142857143" y="79" text-anchor="start">10 %  (2 из 20)</text>
  <text class="ink sm b" x="30" y="103" text-anchor="start">B</text>
  <rect class="box" x="50" y="88" width="62.857142857142854" height="20" rx="2"/>
  <text class="ink sm" x="118.85714285714286" y="103" text-anchor="start">20 %  (16 из 80)</text>
  <text class="ink sm b" x="20" y="132" text-anchor="start">длинные</text>
  <text class="ink sm b" x="30" y="153" text-anchor="start">A</text>
  <rect class="box-ok" x="50" y="138" width="157.14285714285714" height="20" rx="2"/>
  <text class="ink sm" x="213.14285714285714" y="153" text-anchor="start">50 %  (40 из 80)</text>
  <text class="ink sm b" x="30" y="177" text-anchor="start">B</text>
  <rect class="box" x="50" y="162" width="188.57142857142856" height="20" rx="2"/>
  <text class="ink sm" x="244.57142857142856" y="177" text-anchor="start">60 %  (12 из 20)</text>
  <text class="ok b" x="170" y="214" text-anchor="middle">A лучше и там, и там</text>
  <text class="ink2 sm b" x="530" y="24" text-anchor="middle">состав: какие маршруты возит кофейня</text>
  <text class="ink b" x="380" y="70" text-anchor="start">A</text>
  <rect class="box" x="400" y="50" width="52.0" height="30" rx="2"/>
  <text class="ink sm" x="426.0" y="70" text-anchor="middle">20 кор.</text>
  <rect class="box-warn" x="452.0" y="50" width="208.0" height="30" rx="2"/>
  <text class="ink sm" x="556.0" y="70" text-anchor="middle">80 длин.</text>
  <text class="ink b" x="380" y="126" text-anchor="start">B</text>
  <rect class="box" x="400" y="106" width="208.0" height="30" rx="2"/>
  <text class="ink sm" x="504.0" y="126" text-anchor="middle">80 кор.</text>
  <rect class="box-warn" x="608.0" y="106" width="52.0" height="30" rx="2"/>
  <text class="ink sm" x="634.0" y="126" text-anchor="middle">20 длин.</text>
  <text class="ink2 sm b" x="530" y="176" text-anchor="middle">в сумме:</text>
  <text class="err b" x="530" y="200" text-anchor="middle">A 42 %   против   B 28 %</text>
  <text class="ink2 sm" x="530" y="220" text-anchor="middle">A возит в основном длинные маршруты</text>
  <text class="ink2 sm" x="350" y="254" text-anchor="middle">Общая доля — взвешенная смесь групп: веса (состав) у A и B разные</text>
  <text class="mut sm" x="350" y="276" text-anchor="middle">Условные 200 доставок. Защита — сравнивать внутри одинаковых условий (срез по двум признакам)</text>
</svg>
