<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-predict-moment">
  <title id="t-predict-moment">Момент прогноза делит столбцы на признаки и то, что станет известно позже</title>
  <defs><marker id="ah-predict-moment" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <path class="ln" d="M30,120 L670,120" marker-end="url(#ah-predict-moment)"/>
  <circle class="ink2" cx="49.2" cy="120.0" r="4"/>
  <text class="ink2 sm" x="49.2" y="144" text-anchor="middle">заказ создан</text>
  <circle class="acc" cx="298.8" cy="120.0" r="6"/>
  <text class="acc sm b" x="298.8" y="144" text-anchor="middle">передан курьеру</text>
  <circle class="ink2" cx="490.8" cy="120.0" r="4"/>
  <text class="ink2 sm" x="490.79999999999995" y="144" text-anchor="middle">доставлен</text>
  <circle class="ink2" cx="625.2" cy="120.0" r="4"/>
  <text class="ink2 sm" x="625.2" y="144" text-anchor="middle">оценка гостя</text>
  <text class="acc sm b" x="298.8" y="164" text-anchor="middle">★ момент прогноза</text>
  <path class="ln-acc dash" d="M298.8,34 L298.8,112"/>
  <rect class="box-ok" x="30" y="30" width="260.8" height="76" rx="6"/>
  <text class="ink sm b" x="164.4" y="50" text-anchor="middle">известно заранее → признаки X</text>
  <text class="ink2 sm" x="164.4" y="70" text-anchor="middle">distance_km, items, amount, promised_min,</text>
  <text class="ink2 sm" x="164.4" y="88" text-anchor="middle">courier, weather, shop_id, hour (из created)</text>
  <rect class="box-warn" x="306.8" y="30" width="247.99999999999994" height="76" rx="6"/>
  <text class="ink sm b" x="430.79999999999995" y="50" text-anchor="middle">появится после доставки</text>
  <text class="ink2 sm" x="430.79999999999995" y="70" text-anchor="middle">actual_min → цель y:</text>
  <text class="ink2 sm" x="430.79999999999995" y="88" text-anchor="middle">опоздала ли доставка</text>
  <rect class="box-err" x="562.8" y="30" width="107.20000000000005" height="76" rx="6"/>
  <text class="ink sm b" x="616.4" y="50" text-anchor="middle">ещё позже</text>
  <text class="ink2 sm" x="616.4" y="70" text-anchor="middle">rating</text>
  <text class="err sm b" x="616.4" y="88" text-anchor="middle">в X — утечка</text>
  <text class="ink2 sm" x="350" y="200" text-anchor="middle">в X берём только то, что известно в момент прогноза; actual_min и rating в признаках —</text>
  <text class="ink2 sm" x="350" y="218" text-anchor="middle">это подсказка из будущего: на истории модель «угадает» всё, а в работе этих столбцов ещё нет</text>
  <text class="mut sm" x="350" y="242" text-anchor="middle">delivery_id — просто номер, в признаки тоже не идёт</text>
</svg>
