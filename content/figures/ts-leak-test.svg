<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ts-leak-test">
  <title id="t-ts-leak-test">Тест на утечку: портим ответ часа t и смотрим, какие признаки строки t изменились</title>
  <defs><marker id="ah-ts-leak-test" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-warn" x="14" y="70" width="190" height="90" rx="6"/>
  <text class="ink sm b" x="109.0" y="102.5" text-anchor="middle">ряд в час t</text>
  <text class="ink2 sm" x="109.0" y="119.5" text-anchor="middle">(15 июля 12:00)</text>
  <text class="warn b" x="109.0" y="136.5" text-anchor="middle">+1000</text>
  <text class="mut sm" x="109" y="56" text-anchor="middle">портим одно значение</text>
  <path class="ln" d="M206,115 L262,44" marker-end="url(#ah-ts-leak-test)"/>
  <rect class="box" x="266" y="24" width="210" height="40" rx="4"/>
  <text class="ink sm b" x="280" y="41" text-anchor="start">lag_1</text>
  <text class="ink2 sm" x="280" y="57" text-anchor="start">s.shift(1)</text>
  <rect class="box-ok" x="486" y="24" width="200" height="40" rx="4"/>
  <text class="ok sm b" x="586" y="49" text-anchor="middle">✓ не изменился</text>
  <path class="ln" d="M206,115 L262,94" marker-end="url(#ah-ts-leak-test)"/>
  <rect class="box" x="266" y="74" width="210" height="40" rx="4"/>
  <text class="ink sm b" x="280" y="91" text-anchor="start">roll_24_honest</text>
  <text class="ink2 sm" x="280" y="107" text-anchor="start">s.shift(1).rolling(24)</text>
  <rect class="box-ok" x="486" y="74" width="200" height="40" rx="4"/>
  <text class="ok sm b" x="586" y="99" text-anchor="middle">✓ не изменился</text>
  <path class="ln" d="M206,115 L262,144" marker-end="url(#ah-ts-leak-test)"/>
  <rect class="box" x="266" y="124" width="210" height="40" rx="4"/>
  <text class="ink sm b" x="280" y="141" text-anchor="start">roll_24_leak</text>
  <text class="ink2 sm" x="280" y="157" text-anchor="start">s.rolling(24)</text>
  <rect class="box-err" x="486" y="124" width="200" height="40" rx="4"/>
  <text class="err sm b" x="586" y="149" text-anchor="middle">✗ изменился → утечка</text>
  <path class="ln" d="M206,115 L262,194" marker-end="url(#ah-ts-leak-test)"/>
  <rect class="box" x="266" y="174" width="210" height="40" rx="4"/>
  <text class="ink sm b" x="280" y="191" text-anchor="start">diff_next</text>
  <text class="ink2 sm" x="280" y="207" text-anchor="start">s.shift(-1) − s</text>
  <rect class="box-err" x="486" y="174" width="200" height="40" rx="4"/>
  <text class="err sm b" x="586" y="199" text-anchor="middle">✗ изменился → утечка</text>
  <text class="ink2 sm" x="350" y="240" text-anchor="middle">честный признак строки t не зависит от ответа часа t</text>
</svg>
