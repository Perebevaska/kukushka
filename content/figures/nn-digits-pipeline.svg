  <text class="ink sm b" x="60" y="136" text-anchor="middle">картинка 8 × 8</text>
  <text class="mut sm" x="60" y="152" text-anchor="middle">яркость 0…16</text>
  <rect class="box" x="120" y="50" width="128" height="66" rx="8"/>
  <text class="ink sm b" x="184" y="72" text-anchor="middle">64 признака</text>
  <text class="ink2 sm" x="184" y="90" text-anchor="middle">строка яркостей / 16</text>
  <text class="mut sm" x="184" y="107" text-anchor="middle">→ числа 0…1</text>
  <path class="ln" d="M104,83 L120,83" marker-end="url(#ah-nn-digits-pipeline)"/>
  <rect class="box" x="265" y="50" width="128" height="66" rx="8"/>
  <text class="ink sm b" x="329" y="72" text-anchor="middle">обучение и тест</text>
  <text class="ink2 sm" x="329" y="90" text-anchor="middle">1347 и 450 цифр</text>
  <text class="mut sm" x="329" y="107" text-anchor="middle">stratify по цифре</text>
  <path class="ln" d="M248,83 L265,83" marker-end="url(#ah-nn-digits-pipeline)"/>
  <rect class="box-acc" x="410" y="50" width="128" height="66" rx="8"/>
  <text class="ink sm b" x="474" y="72" text-anchor="middle">сеть 64 → 32 → 10</text>
  <text class="ink2 sm" x="474" y="90" text-anchor="middle">2410 параметров</text>
  <text class="mut sm" x="474" y="107" text-anchor="middle">скрытый слой: ReLU</text>
  <path class="ln" d="M393,83 L410,83" marker-end="url(#ah-nn-digits-pipeline)"/>
  <rect class="box" x="555" y="50" width="128" height="66" rx="8"/>
  <text class="ink sm b" x="619" y="72" text-anchor="middle">softmax</text>
  <text class="ink2 sm" x="619" y="90" text-anchor="middle">10 вероятностей</text>
  <text class="mut sm" x="619" y="107" text-anchor="middle">сумма = 1</text>
  <path class="ln" d="M538,83 L555,83" marker-end="url(#ah-nn-digits-pipeline)"/>
  <text class="mut sm" x="350" y="24" text-anchor="middle">всего 1797 картинок; у этой тройки сдвиг на пиксель меняет 38 из 64 признаков — слабое место (шаг 7)</text>
  <path class="ln" d="M602,116 L602,170" marker-end="url(#ah-nn-digits-pipeline)"/>
  <rect class="box-warn" x="482" y="172" width="218" height="44" rx="8"/>
  <text class="ink sm b" x="591" y="190" text-anchor="middle">максимум вероятности ≥ 0.9?</text>
  <text class="mut sm" x="591" y="207" text-anchor="middle">правило шага 6</text>
  <path class="ln-acc" d="M482,194 L420,194 L420,236" marker-end="url(#ah-nn-digits-pipeline)"/>
  <text class="acc sm b" x="470" y="186" text-anchor="end">да</text>
  <rect class="box-ok" x="330" y="238" width="180" height="44" rx="8"/>
  <text class="ink sm b" x="420" y="256" text-anchor="middle">в базу автоматически</text>
  <text class="mut sm" x="420" y="273" text-anchor="middle">класс = argmax</text>
