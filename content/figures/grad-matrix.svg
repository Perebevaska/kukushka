<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-grad-matrix">
  <title id="t-grad-matrix">Градиент одной формулой: X1ᵀ складывает «ошибка × признак» по каждому столбцу</title>
  <defs><marker id="ah-grad-matrix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="193.0" y="32" text-anchor="middle">веса w = (b, w_км) = (0, 5)</text>
  <rect class="box" x="20" y="40" width="346" height="28" rx="3"/>
  <text class="ink2 sm b" x="55.0" y="58.5" text-anchor="middle"></text>
  <text class="ink2 sm b" x="115.0" y="58.5" text-anchor="middle">1</text>
  <text class="ink2 sm b" x="165.0" y="58.5" text-anchor="middle">км</text>
  <text class="ink2 sm b" x="215.0" y="58.5" text-anchor="middle">y</text>
  <text class="ink2 sm b" x="270.0" y="58.5" text-anchor="middle">X1·w</text>
  <text class="ink2 sm b" x="333.0" y="58.5" text-anchor="middle">ошибка</text>
  <rect class="box" x="20" y="70" width="346" height="28" rx="3"/>
  <text class="ink sm" x="55.0" y="88.5" text-anchor="middle">дост. 1</text>
  <text class="acc sm b" x="115.0" y="88.5" text-anchor="middle">1</text>
  <text class="warn sm b" x="165.0" y="88.5" text-anchor="middle">1</text>
  <text class="ink sm" x="215.0" y="88.5" text-anchor="middle">18</text>
  <text class="ink sm" x="270.0" y="88.5" text-anchor="middle">5</text>
  <text class="err sm b" x="333.0" y="88.5" text-anchor="middle">−13</text>
  <rect class="box" x="20" y="100" width="346" height="28" rx="3"/>
  <text class="ink sm" x="55.0" y="118.5" text-anchor="middle">дост. 2</text>
  <text class="acc sm b" x="115.0" y="118.5" text-anchor="middle">1</text>
  <text class="warn sm b" x="165.0" y="118.5" text-anchor="middle">2</text>
  <text class="ink sm" x="215.0" y="118.5" text-anchor="middle">25</text>
  <text class="ink sm" x="270.0" y="118.5" text-anchor="middle">10</text>
  <text class="err sm b" x="333.0" y="118.5" text-anchor="middle">−15</text>
  <rect class="box" x="20" y="130" width="346" height="28" rx="3"/>
  <text class="ink sm" x="55.0" y="148.5" text-anchor="middle">дост. 3</text>
  <text class="acc sm b" x="115.0" y="148.5" text-anchor="middle">1</text>
  <text class="warn sm b" x="165.0" y="148.5" text-anchor="middle">4</text>
  <text class="ink sm" x="215.0" y="148.5" text-anchor="middle">40</text>
  <text class="ink sm" x="270.0" y="148.5" text-anchor="middle">20</text>
  <text class="err sm b" x="333.0" y="148.5" text-anchor="middle">−20</text>
  <text class="mut sm" x="20" y="176" text-anchor="start">ошибка = X1·w − y</text>
  <text class="ink sm b" x="400" y="46" text-anchor="start">X1ᵀ · ошибки — по сумме на столбец:</text>
  <text class="acc sm" x="400" y="74" text-anchor="start">столбец 1:  (−13) + (−15) + (−20) = −48</text>
  <text class="warn sm" x="400" y="96" text-anchor="start">столбец км: 1·(−13) + 2·(−15) + 4·(−20)</text>
  <text class="warn sm" x="482" y="114" text-anchor="start">= −123</text>
  <text class="ink sm b" x="400" y="146" text-anchor="start">× 2 / n = × 2/3:</text>
  <rect class="box-ok" x="400" y="156" width="230" height="40" rx="6"/>
  <text class="ink b" x="515.0" y="180.5" text-anchor="middle">g = (−32, −82)</text>
  <text class="ok sm b" x="400" y="218" text-anchor="start">обе производные &lt; 0 → оба веса растут</text>
  <text class="ink2 sm" x="350" y="262" text-anchor="middle">g = 2/n · X1ᵀ(X1·w − y): одна строка numpy считает производную по каждому весу сразу,</text>
  <text class="mut sm" x="350" y="282" text-anchor="middle">сколько бы ни было признаков — каждая координата g «своя» для своего столбца</text>
</svg>
