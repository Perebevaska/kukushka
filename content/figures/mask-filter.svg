<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-mask-filter">
  <title id="t-mask-filter">Фильтр через маску: df[df["amount"] > 500]</title>
  <defs><marker id="ah-mask-filter" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="150" y="26" text-anchor="middle">df</text>
  <rect class="box" x="20" y="36" width="230" height="24" rx="3"/>
  <text class="ink2 sm b" x="45.0" y="52.5" text-anchor="middle"></text>
  <text class="ink2 sm b" x="120.0" y="52.5" text-anchor="middle">channel</text>
  <text class="ink2 sm b" x="210.0" y="52.5" text-anchor="middle">amount</text>
  <rect class="box" x="20" y="62" width="230" height="24" rx="3"/>
  <text class="mut sm b" x="45.0" y="78.5" text-anchor="middle">0</text>
  <text class="ink sm" x="120.0" y="78.5" text-anchor="middle">зал</text>
  <text class="ink sm" x="210.0" y="78.5" text-anchor="middle">320</text>
  <rect class="box-ok" x="20" y="88" width="230" height="24" rx="3"/>
  <text class="mut sm b" x="45.0" y="104.5" text-anchor="middle">1</text>
  <text class="ink sm" x="120.0" y="104.5" text-anchor="middle">доставка</text>
  <text class="ink sm" x="210.0" y="104.5" text-anchor="middle">610</text>
  <rect class="box" x="20" y="114" width="230" height="24" rx="3"/>
  <text class="mut sm b" x="45.0" y="130.5" text-anchor="middle">2</text>
  <text class="ink sm" x="120.0" y="130.5" text-anchor="middle">доставка</text>
  <text class="ink sm" x="210.0" y="130.5" text-anchor="middle">450</text>
  <rect class="box-ok" x="20" y="140" width="230" height="24" rx="3"/>
  <text class="mut sm b" x="45.0" y="156.5" text-anchor="middle">3</text>
  <text class="ink sm" x="120.0" y="156.5" text-anchor="middle">с собой</text>
  <text class="ink sm" x="210.0" y="156.5" text-anchor="middle">720</text>
  <rect class="box" x="20" y="166" width="230" height="24" rx="3"/>
  <text class="mut sm b" x="45.0" y="182.5" text-anchor="middle">4</text>
  <text class="ink sm" x="120.0" y="182.5" text-anchor="middle">зал</text>
  <text class="ink sm" x="210.0" y="182.5" text-anchor="middle">290</text>
  <text class="mut sm b" x="300" y="26" text-anchor="middle">маска</text>
  <rect class="box" x="262" y="62" width="76" height="24" rx="3"/>
  <text class="mut sm" x="300" y="78.5" text-anchor="middle">False</text>
  <path class="ln-mut" d="M252,74 L258,74" marker-end="url(#ah-mask-filter)"/>
  <rect class="box-ok" x="262" y="88" width="76" height="24" rx="3"/>
  <text class="ok sm b" x="300" y="104.5" text-anchor="middle">True</text>
  <path class="ln-mut" d="M252,100 L258,100" marker-end="url(#ah-mask-filter)"/>
  <rect class="box" x="262" y="114" width="76" height="24" rx="3"/>
  <text class="mut sm" x="300" y="130.5" text-anchor="middle">False</text>
  <path class="ln-mut" d="M252,126 L258,126" marker-end="url(#ah-mask-filter)"/>
  <rect class="box-ok" x="262" y="140" width="76" height="24" rx="3"/>
  <text class="ok sm b" x="300" y="156.5" text-anchor="middle">True</text>
  <path class="ln-mut" d="M252,152 L258,152" marker-end="url(#ah-mask-filter)"/>
  <rect class="box" x="262" y="166" width="76" height="24" rx="3"/>
  <text class="mut sm" x="300" y="182.5" text-anchor="middle">False</text>
  <path class="ln-mut" d="M252,178 L258,178" marker-end="url(#ah-mask-filter)"/>
  <text class="acc sm b" x="300" y="210" text-anchor="middle">amount &gt; 500</text>
  <text class="mut sm b" x="530" y="26" text-anchor="middle">df[маска] — только строки с True</text>
  <rect class="box-ok" x="420" y="62" width="230" height="24" rx="3"/>
  <text class="mut sm b" x="445.0" y="78.5" text-anchor="middle">1</text>
  <text class="ink sm" x="520.0" y="78.5" text-anchor="middle">доставка</text>
  <text class="ink sm" x="610.0" y="78.5" text-anchor="middle">610</text>
  <rect class="box-ok" x="420" y="88" width="230" height="24" rx="3"/>
  <text class="mut sm b" x="445.0" y="104.5" text-anchor="middle">3</text>
  <text class="ink sm" x="520.0" y="104.5" text-anchor="middle">с собой</text>
  <text class="ink sm" x="610.0" y="104.5" text-anchor="middle">720</text>
  <rect class="box" x="420" y="36" width="230" height="24" rx="3"/>
  <text class="ink2 sm b" x="445.0" y="52.5" text-anchor="middle"></text>
  <text class="ink2 sm b" x="520.0" y="52.5" text-anchor="middle">channel</text>
  <text class="ink2 sm b" x="610.0" y="52.5" text-anchor="middle">amount</text>
  <path class="ln-acc" d="M340,100 C380,100 380,74 416,74" marker-end="url(#ah-mask-filter)"/>
  <path class="ln-acc" d="M340,152 C380,152 380,100 416,100" marker-end="url(#ah-mask-filter)"/>
  <text class="ink2 sm" x="530" y="170" text-anchor="middle">индекс сохранился: [1, 3]</text>
  <text class="ink2 sm" x="530" y="188" text-anchor="middle">mask.sum() = 2 строки, mask.mean() = 0.4</text>
  <text class="mut sm" x="350" y="240" text-anchor="middle">Маска — обычный столбец True/False: его можно распечатать, сложить и усреднить до фильтра.</text>
</svg>
