<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-range-check">
  <title id="t-range-check">Условие 300 <= amount < 600 на числовой оси</title>
  <defs><marker id="ah-range-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="20" y="30" text-anchor="start">и (and):  300 &lt;= amount &lt; 600</text>
  <path class="ln" d="M40,66 L660,66" marker-end="url(#ah-range-check)"/>
  <path class="ln" d="M40.0,61 L40.0,71"/>
  <text class="mut sm" x="40.0" y="86" text-anchor="middle">0</text>
  <path class="ln" d="M246.66666666666666,61 L246.66666666666666,71"/>
  <text class="mut sm" x="246.66666666666666" y="86" text-anchor="middle">300</text>
  <path class="ln" d="M453.3333333333333,61 L453.3333333333333,71"/>
  <text class="mut sm" x="453.3333333333333" y="86" text-anchor="middle">600</text>
  <path class="ln" d="M660.0,61 L660.0,71"/>
  <text class="mut sm" x="660.0" y="86" text-anchor="middle">900</text>
  <rect class="box-ok" x="246.66666666666666" y="59" width="206.66666666666666" height="14" rx="3"/>
  <circle class="box-ok" cx="246.66666666666666" cy="66" r="6"/>
  <circle class="ok" cx="246.66666666666666" cy="66" r="4"/>
  <circle class="box" cx="453.3333333333333" cy="66" r="6"/>
  <text class="ok sm b" x="246.66666666666666" y="46" text-anchor="middle">300 входит</text>
  <text class="err sm b" x="453.3333333333333" y="46" text-anchor="middle">600 — уже нет</text>
  <text class="ink2 sm" x="20" y="112" text-anchor="start">проверка границ: 299 → False,  300 → True,  450 → True,  600 → False</text>
  <text class="err b" x="20" y="146" text-anchor="start">ошибка — или (or):  amount &gt;= 300 or amount &lt; 600</text>
  <path class="ln" d="M40,182 L660,182" marker-end="url(#ah-range-check)"/>
  <path class="ln" d="M40.0,177 L40.0,187"/>
  <text class="mut sm" x="40.0" y="202" text-anchor="middle">0</text>
  <path class="ln" d="M246.66666666666666,177 L246.66666666666666,187"/>
  <text class="mut sm" x="246.66666666666666" y="202" text-anchor="middle">300</text>
  <path class="ln" d="M453.3333333333333,177 L453.3333333333333,187"/>
  <text class="mut sm" x="453.3333333333333" y="202" text-anchor="middle">600</text>
  <path class="ln" d="M660.0,177 L660.0,187"/>
  <text class="mut sm" x="660.0" y="202" text-anchor="middle">900</text>
  <rect class="box-err" x="40" y="175" width="612" height="14" rx="3"/>
  <text class="err sm" x="350" y="166" text-anchor="middle">истинно для любого числа: каждое либо ≥ 300, либо &lt; 600</text>
</svg>
