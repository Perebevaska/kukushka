<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-task-types">
  <title id="t-task-types">Как определить тип задачи по запросу</title>
  <defs><marker id="ah-task-types" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="200" y="8" width="300" height="40" rx="6"/>
  <text class="ink sm b" x="350.0" y="24.0" text-anchor="middle">Есть ли в прошлых данных</text>
  <text class="ink sm b" x="350.0" y="41.0" text-anchor="middle">правильный ответ?</text>
  <rect class="box-warn" x="20" y="86" width="190" height="40" rx="6"/>
  <text class="ink sm b" x="115.0" y="102.0" text-anchor="middle">кластеризация</text>
  <text class="ink2 sm" x="115.0" y="119.0" text-anchor="middle">(обучение без учителя)</text>
  <path class="ln" d="M260,48 L140,86" marker-end="url(#ah-task-types)"/>
  <text class="ink2 sm" x="186" y="66" text-anchor="middle">нет</text>
  <rect class="box" x="330" y="86" width="200" height="34" rx="6"/>
  <text class="ink sm b" x="430.0" y="107.5" text-anchor="middle">Что на выходе?</text>
  <path class="ln" d="M420,48 L430,86" marker-end="url(#ah-task-types)"/>
  <text class="ink2 sm" x="440" y="70" text-anchor="start">да — с учителем</text>
  <rect class="box-acc" x="230" y="160" width="140" height="40" rx="6"/>
  <text class="ink2 sm" x="300.0" y="176.0" text-anchor="middle">категория из двух</text>
  <text class="ink sm b" x="300.0" y="193.0" text-anchor="middle">→ бинарная</text>
  <rect class="box-acc" x="380" y="160" width="150" height="40" rx="6"/>
  <text class="ink2 sm" x="455.0" y="176.0" text-anchor="middle">из нескольких</text>
  <text class="ink sm b" x="455.0" y="193.0" text-anchor="middle">→ многоклассовая</text>
  <rect class="box" x="540" y="160" width="140" height="40" rx="6"/>
  <text class="ink2 sm" x="610.0" y="176.0" text-anchor="middle">число</text>
  <text class="ink sm b" x="610.0" y="193.0" text-anchor="middle">на будущие даты?</text>
  <path class="ln" d="M400,120 L300,160" marker-end="url(#ah-task-types)"/>
  <path class="ln" d="M430,120 L455,160" marker-end="url(#ah-task-types)"/>
  <path class="ln" d="M470,120 L600,160" marker-end="url(#ah-task-types)"/>
  <rect class="box-acc" x="460" y="236" width="110" height="40" rx="6"/>
  <text class="ink2 sm" x="515.0" y="252.0" text-anchor="middle">нет</text>
  <text class="ink sm b" x="515.0" y="269.0" text-anchor="middle">→ регрессия</text>
  <rect class="box-acc" x="580" y="236" width="110" height="40" rx="6"/>
  <text class="ink2 sm" x="635.0" y="252.0" text-anchor="middle">да</text>
  <text class="ink sm b" x="635.0" y="269.0" text-anchor="middle">→ прогноз ряда</text>
  <path class="ln" d="M590,200 L520,236" marker-end="url(#ah-task-types)"/>
  <path class="ln" d="M625,200 L632,236" marker-end="url(#ah-task-types)"/>
  <text class="mut sm b" x="20" y="160" text-anchor="start">примеры «Зерна»:</text>
  <text class="ink2 sm" x="20" y="180" text-anchor="start">бинарная — опоздает ли доставка</text>
  <text class="ink2 sm" x="20" y="198" text-anchor="start">многоклассовая — тема отзыва</text>
  <text class="ink2 sm" x="20" y="216" text-anchor="start">регрессия — минуты доставки</text>
  <text class="ink2 sm" x="20" y="234" text-anchor="start">ряд — заказы по часам на неделю</text>
  <text class="ink2 sm" x="20" y="252" text-anchor="start">кластеризация — типы гостей</text>
</svg>
