<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-for-loop">
  <title id="t-for-loop">Как выполняется цикл for</title>
  <defs><marker id="ah-for-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="222" y="41" text-anchor="end">cities</text>
  <rect class="box-acc" x="230" y="22" width="66" height="28" rx="4"/>
  <text class="ink sm" x="263" y="41" text-anchor="middle">Пермь</text>
  <rect class="box-acc" x="302" y="22" width="66" height="28" rx="4"/>
  <text class="ink sm" x="335" y="41" text-anchor="middle">Казань</text>
  <rect class="box-acc" x="374" y="22" width="66" height="28" rx="4"/>
  <text class="ink sm" x="407" y="41" text-anchor="middle">Тюмень</text>
  <path class="ln-acc" d="M335,52 L335,80" marker-end="url(#ah-for-loop)"/>
  <text class="acc sm" x="345" y="70" text-anchor="start">по одному, слева направо</text>
  <rect class="box-acc" x="230" y="84" width="210" height="40" rx="6"/>
  <text class="ink sm b" x="335.0" y="108.5" text-anchor="middle">city = следующий элемент</text>
  <path class="ln" d="M335,124 L335,156" marker-end="url(#ah-for-loop)"/>
  <text class="ink2 sm" x="345" y="145" text-anchor="start">элемент есть</text>
  <rect class="box" x="230" y="160" width="210" height="56" rx="6"/>
  <text class="ink sm b" x="335.0" y="184.0" text-anchor="middle">тело цикла — строки с отступом</text>
  <text class="ink2 sm" x="335.0" y="201.0" text-anchor="middle">print("Открываем:", city)</text>
  <path class="ln" d="M440,188 H476 V104 H444" marker-end="url(#ah-for-loop)"/>
  <text class="ink2 sm" x="484" y="140" text-anchor="start">следующий проход</text>
  <text class="mut sm" x="484" y="156" text-anchor="start">(всего 3 — по разу на элемент)</text>
  <path class="ln-acc" d="M230,104 H196 V254 H226" marker-end="url(#ah-for-loop)"/>
  <text class="acc sm b" x="188" y="176" text-anchor="end">элементы</text>
  <text class="acc sm b" x="188" y="192" text-anchor="end">кончились</text>
  <rect class="box-ok" x="230" y="236" width="450" height="36" rx="6"/>
  <text class="ink sm" x="455.0" y="258.5" text-anchor="middle">после цикла (без отступа), один раз:  print("Все кофейни открыты")</text>
</svg>
