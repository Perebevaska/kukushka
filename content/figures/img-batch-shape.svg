<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-img-batch-shape">
  <title id="t-img-batch-shape">Набор картинок — трёхмерный массив (n, высота, ширина): срезы по осям и вытягивание в таблицу</title>
  <defs><marker id="ah-img-batch-shape" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="70" y="80" width="110" height="110" rx="3"/>
  <rect class="box" x="62" y="72" width="110" height="110" rx="3"/>
  <rect class="box" x="54" y="64" width="110" height="110" rx="3"/>
  <rect class="box" x="46" y="56" width="110" height="110" rx="3"/>
  <rect class="box" x="38" y="48" width="110" height="110" rx="3"/>
  <rect class="box-acc" x="30" y="40" width="110" height="110" rx="3"/>
  <text class="ink sm b" x="110" y="30" text-anchor="middle">X: (2000, 32, 32)</text>
  <text class="ink2 sm" x="95" y="200" text-anchor="middle">ось 0 — номер кадра</text>
  <text class="ink2 sm" x="95" y="218" text-anchor="middle">оси 1, 2 — строки, столбцы</text>
  <path class="ln" d="M200,50 L240,50" marker-end="url(#ah-img-batch-shape)"/>
  <rect class="box" x="244" y="30" width="190" height="40" rx="4"/>
  <text class="ink sm b" x="339" y="55" text-anchor="middle">X[5]</text>
  <rect class="box-acc" x="444" y="30" width="120" height="40" rx="4"/>
  <text class="ink sm" x="504" y="55" text-anchor="middle">(32, 32)</text>
  <text class="ink2 sm" x="574" y="55" text-anchor="start">одна картинка</text>
  <path class="ln" d="M200,102 L240,102" marker-end="url(#ah-img-batch-shape)"/>
  <rect class="box" x="244" y="82" width="190" height="40" rx="4"/>
  <text class="ink sm b" x="339" y="107" text-anchor="middle">X[:, 8:24, 8:24]</text>
  <rect class="box-acc" x="444" y="82" width="120" height="40" rx="4"/>
  <text class="ink sm" x="504" y="107" text-anchor="middle">(2000, 16, 16)</text>
  <text class="ink2 sm" x="574" y="107" text-anchor="start">центр у всех сразу</text>
  <path class="ln" d="M200,154 L240,154" marker-end="url(#ah-img-batch-shape)"/>
  <rect class="box" x="244" y="134" width="190" height="40" rx="4"/>
  <text class="ink sm b" x="339" y="159" text-anchor="middle">X[:, :, ::-1]</text>
  <rect class="box-acc" x="444" y="134" width="120" height="40" rx="4"/>
  <text class="ink sm" x="504" y="159" text-anchor="middle">(2000, 32, 32)</text>
  <text class="ink2 sm" x="574" y="159" text-anchor="start">все отражены</text>
  <path class="ln" d="M200,206 L240,206" marker-end="url(#ah-img-batch-shape)"/>
  <rect class="box" x="244" y="186" width="190" height="40" rx="4"/>
  <text class="ink sm b" x="339" y="211" text-anchor="middle">X.reshape(2000, -1)</text>
  <rect class="box-acc" x="444" y="186" width="120" height="40" rx="4"/>
  <text class="ink sm" x="504" y="211" text-anchor="middle">(2000, 1024)</text>
  <text class="ink2 sm" x="574" y="211" text-anchor="start">таблица для sklearn</text>
  <text class="mut sm" x="350" y="248" text-anchor="middle">строка таблицы = 32 строки картинки подряд; столбец 33 — пиксель (1, 1)</text>
</svg>
