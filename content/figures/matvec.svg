<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-matvec">
  <title id="t-matvec">Умножение матрицы на вектор: прогноз для каждой строки</title>
  <defs><marker id="ah-matvec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="110" y="22" text-anchor="middle">X (строка = доставка)</text>
  <text class="ink2 sm" x="48" y="44" text-anchor="middle">км</text>
  <text class="ink2 sm" x="110" y="44" text-anchor="middle">позиций</text>
  <text class="ink2 sm" x="172" y="44" text-anchor="middle">пеший</text>
  <rect class="box-acc" x="20" y="52" width="180" height="28" rx="4"/>
  <text class="ink sm" x="48" y="71" text-anchor="middle">1.0</text>
  <text class="ink sm" x="110" y="71" text-anchor="middle">2</text>
  <text class="ink sm" x="172" y="71" text-anchor="middle">1</text>
  <rect class="box" x="20" y="86" width="180" height="28" rx="4"/>
  <text class="ink sm" x="48" y="105" text-anchor="middle">4.0</text>
  <text class="ink sm" x="110" y="105" text-anchor="middle">1</text>
  <text class="ink sm" x="172" y="105" text-anchor="middle">0</text>
  <rect class="box" x="20" y="120" width="180" height="28" rx="4"/>
  <text class="ink sm" x="48" y="139" text-anchor="middle">6.0</text>
  <text class="ink sm" x="110" y="139" text-anchor="middle">4</text>
  <text class="ink sm" x="172" y="139" text-anchor="middle">0</text>
  <text class="ink b" x="222" y="108" text-anchor="middle">@</text>
  <text class="mut sm b" x="272" y="22" text-anchor="middle">w</text>
  <rect class="box-warn" x="244" y="52" width="56" height="28" rx="4"/>
  <text class="ink sm" x="272" y="71" text-anchor="middle">3.9</text>
  <rect class="box-warn" x="244" y="86" width="56" height="28" rx="4"/>
  <text class="ink sm" x="272" y="105" text-anchor="middle">1.7</text>
  <rect class="box-warn" x="244" y="120" width="56" height="28" rx="4"/>
  <text class="ink sm" x="272" y="139" text-anchor="middle">18.5</text>
  <text class="ink b" x="322" y="108" text-anchor="middle">+ 8</text>
  <text class="ink b" x="358" y="108" text-anchor="middle">=</text>
  <rect class="box-ok" x="380" y="52" width="64" height="28" rx="4"/>
  <text class="ink sm b" x="412" y="71" text-anchor="middle">33.8</text>
  <rect class="box-ok" x="380" y="86" width="64" height="28" rx="4"/>
  <text class="ink sm b" x="412" y="105" text-anchor="middle">25.3</text>
  <rect class="box-ok" x="380" y="120" width="64" height="28" rx="4"/>
  <text class="ink sm b" x="412" y="139" text-anchor="middle">38.2</text>
  <text class="mut sm b" x="412" y="22" text-anchor="middle">прогноз</text>
  <text class="acc sm b" x="570" y="56" text-anchor="middle">первая строка:</text>
  <text class="ink sm" x="570" y="76" text-anchor="middle">1·3.9 + 2·1.7 + 1·18.5 + 8</text>
  <text class="ink sm" x="570" y="96" text-anchor="middle">= 33.8 минуты</text>
  <text class="ink2 sm" x="350" y="182" text-anchor="middle">каждая строка X скалярно умножается на w — одна и та же взвешенная сумма для всех доставок</text>
  <text class="mut sm" x="350" y="202" text-anchor="middle">форма: (3 × 3) @ (3,) → (3,) — сколько строк, столько прогнозов</text>
</svg>
