<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-try-flow">
  <title id="t-try-flow">try / except: два пути выполнения</title>
  <defs><marker id="ah-try-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="20" y="40" width="230" height="80" rx="6"/>
  <text class="acc sm b" x="135.0" y="67.5" text-anchor="middle">try:</text>
  <text class="ink sm" x="135.0" y="84.5" text-anchor="middle">total += int(x)</text>
  <text class="mut sm" x="135.0" y="101.5" text-anchor="middle">строки ниже в try</text>
  <rect class="box-warn" x="20" y="170" width="230" height="56" rx="6"/>
  <text class="warn sm b" x="135.0" y="194.0" text-anchor="middle">except ValueError:</text>
  <text class="ink sm" x="135.0" y="211.0" text-anchor="middle">bad += 1</text>
  <rect class="box-ok" x="470" y="40" width="210" height="56" rx="6"/>
  <text class="ok sm b" x="575.0" y="64.0" text-anchor="middle">код после try / except</text>
  <text class="ink sm" x="575.0" y="81.0" text-anchor="middle">программа продолжает</text>
  <path class="ln-acc" d="M252,68 H466" marker-end="url(#ah-try-flow)"/>
  <text class="acc sm b" x="360" y="58" text-anchor="middle">нет ошибки: except пропущен</text>
  <path class="ln-err" d="M70,122 V166" marker-end="url(#ah-try-flow)"/>
  <text class="err sm b" x="80" y="140" text-anchor="start">ValueError → сюда,</text>
  <text class="err sm" x="80" y="156" text-anchor="start">остаток try пропущен</text>
  <path class="ln" d="M252,198 H575 V100" marker-end="url(#ah-try-flow)"/>
  <text class="ink2 sm" x="420" y="190" text-anchor="middle">после except — дальше</text>
  <path class="ln-err dash" d="M236,122 V262 H466" marker-end="url(#ah-try-flow)"/>
  <text class="err sm b" x="244" y="140" text-anchor="start">другой тип ошибки</text>
  <text class="err sm" x="244" y="156" text-anchor="start">проходит мимо except</text>
  <rect class="box-err" x="470" y="236" width="210" height="52" rx="6"/>
  <text class="err sm b" x="575.0" y="258.0" text-anchor="middle">NameError не пойман</text>
  <text class="ink sm" x="575.0" y="275.0" text-anchor="middle">программа падает</text>
</svg>
