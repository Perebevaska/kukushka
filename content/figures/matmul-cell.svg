<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-matmul-cell">
  <title id="t-matmul-cell">Произведение матриц: элемент результата — строка первой на столбец второй</title>
