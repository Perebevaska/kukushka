<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cutoff-leak">
  <title id="t-cutoff-leak">Признак на дату среза: оплату, случившуюся после среза, считаем неизвестной</title>
  <defs><marker id="ah-cutoff-leak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <path class="ln" d="M60,120 L660,120"/>
  <path class="ln" d="M203.3,104 L203.3,136"/>
  <text class="ink2 sm b" x="203.28358208955223" y="154" text-anchor="middle">срок оплаты 10.06</text>
  <path class="ln-err" d="M382.4,104 L382.4,136"/>
  <text class="err sm b" x="382.3880597014925" y="154" text-anchor="middle">срез 30.06</text>
  <path class="ln" d="M561.5,104 L561.5,136"/>
  <text class="warn sm b" x="561.4925373134329" y="154" text-anchor="middle">оплата 20.07</text>
  <rect class="box-ok" x="203.28358208955223" y="70" width="179.1044776119403" height="26" rx="3"/>
  <text class="ink sm b" x="292.8358208955224" y="88" text-anchor="middle">20 дней — честно</text>
  <rect class="box-err" x="203.28358208955223" y="34" width="358.20895522388065" height="26" rx="3"/>
  <text class="ink sm b" x="382.3880597014926" y="52" text-anchor="middle">40 дней — утечка: знает о 20.07</text>
  <rect class="box-err dash" x="382.3880597014925" y="112" width="277.6119402985075" height="16" rx="2"/>
  <text class="err sm" x="561.1940298507462" y="182" text-anchor="middle">после среза — будущее</text>
  <text class="ink2 sm" x="350" y="206" text-anchor="middle">правило: paid_date &gt; среза → «не оплачен», просрочка — до даты среза</text>
</svg>
