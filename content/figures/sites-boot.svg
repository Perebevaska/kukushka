<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sites-boot">
  <title id="t-sites-boot">Бутстрэп для выбора мест: один повтор — одно «обследование»</title>
  <defs><marker id="ah-sites-boot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="12" y="30" width="160" height="56" rx="8"/>
  <text class="ink b" x="92.0" y="54" text-anchor="middle">тест города</text>
  <text class="ink2 sm" x="92.0" y="74" text-anchor="middle">375 мест: прогноз и факт</text>
  <rect class="box-acc" x="182" y="30" width="160" height="56" rx="8"/>
  <text class="ink b" x="262.0" y="54" text-anchor="middle">обследование: 300</text>
  <text class="ink2 sm" x="262.0" y="74" text-anchor="middle">мест с возвращением</text>
  <rect class="box-acc" x="352" y="30" width="160" height="56" rx="8"/>
  <text class="ink b" x="432.0" y="54" text-anchor="middle">40 лучших</text>
  <text class="ink2 sm" x="432.0" y="74" text-anchor="middle">по прогнозу</text>
  <rect class="box-acc" x="522" y="30" width="160" height="56" rx="8"/>
  <text class="ink b" x="602.0" y="54" text-anchor="middle">прибыль</text>
  <text class="ink2 sm" x="602.0" y="74" text-anchor="middle">Σ факт − 40 × 140</text>
  <path class="ln" d="M174,58 L180,58" marker-end="url(#ah-sites-boot)"/>
  <path class="ln" d="M344,58 L350,58" marker-end="url(#ah-sites-boot)"/>
  <path class="ln" d="M514,58 L520,58" marker-end="url(#ah-sites-boot)"/>
  <path class="ln" d="M602.0,88 L602.0,118 L262.0,118 L262.0,90" marker-end="url(#ah-sites-boot)"/>
  <text class="ink2 sm" x="432" y="134" text-anchor="middle">повторить 1000 раз (rng = default_rng(0) — один на город)</text>
  <path class="ln" d="M662,88 L662,156" marker-end="url(#ah-sites-boot)"/>
  <rect class="box-warn" x="182" y="158" width="500" height="64" rx="8"/>
  <text class="ink b" x="432" y="182" text-anchor="middle">1000 прибылей города</text>
  <text class="ink2 sm" x="432" y="204" text-anchor="middle">среднее · 2.5-й и 97.5-й процентили · доля повторов &lt; 0 (риск убытка)</text>
  <text class="mut sm" x="350" y="246" text-anchor="middle">выбор по прогнозу, а прибыль по факту — иначе бутстрэп измерит обещание модели, а не реальность</text>
</svg>
