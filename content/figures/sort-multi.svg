<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sort-multi">
  <title id="t-sort-multi">Сортировка по двум столбцам: shop_id по возрастанию, внутри — amount по убыванию</title>
  <defs><marker id="ah-sort-multi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="135.0" y="42" text-anchor="middle">до</text>
  <rect class="box" x="40" y="50" width="190" height="24" rx="3"/>
  <text class="ink2 sm b" x="90.0" y="66.5" text-anchor="middle">shop_id</text>
  <text class="ink2 sm b" x="185.0" y="66.5" text-anchor="middle">amount</text>
  <rect class="box-acc" x="40" y="76" width="190" height="24" rx="3"/>
  <text class="ink sm" x="90.0" y="92.5" text-anchor="middle">PRM-1</text>
