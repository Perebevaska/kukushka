  <text class="ink2 sm b" x="510.0" y="66.5" text-anchor="middle">shop_id</text>
  <text class="ink2 sm b" x="605.0" y="66.5" text-anchor="middle">amount</text>
  <rect class="box-ok" x="460" y="76" width="190" height="24" rx="3"/>
  <text class="ink sm" x="510.0" y="92.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="605.0" y="92.5" text-anchor="middle">350</text>
  <rect class="box-ok" x="460" y="102" width="190" height="24" rx="3"/>
  <text class="ink sm" x="510.0" y="118.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="605.0" y="118.5" text-anchor="middle">250</text>
  <rect class="box-acc" x="460" y="128" width="190" height="24" rx="3"/>
  <text class="ink sm" x="510.0" y="144.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="605.0" y="144.5" text-anchor="middle">400</text>
  <rect class="box-acc" x="460" y="154" width="190" height="24" rx="3"/>
  <text class="ink sm" x="510.0" y="170.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="605.0" y="170.5" text-anchor="middle">300</text>
  <rect class="box-acc" x="460" y="180" width="190" height="24" rx="3"/>
  <text class="ink sm" x="510.0" y="196.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="605.0" y="196.5" text-anchor="middle">200</text>
  <rect class="box-warn" x="460" y="206" width="190" height="24" rx="3"/>
  <text class="ink sm" x="510.0" y="222.5" text-anchor="middle">UFA-1</text>
  <text class="ink sm" x="605.0" y="222.5" text-anchor="middle">500</text>
  <text class="ink sm b" x="335" y="90" text-anchor="middle">sort_values(</text>
  <text class="ink sm" x="335" y="108" text-anchor="middle">["shop_id", "amount"],</text>
  <text class="ink sm" x="335" y="126" text-anchor="middle">ascending=[True, False])</text>
  <path class="ln" d="M250,150 L420,150" marker-end="url(#ah-sort-multi)"/>
  <text class="ink2 sm" x="335" y="176" text-anchor="middle">1) группы по алфавиту:</text>
  <text class="ink2 sm" x="335" y="192" text-anchor="middle">KZN → PRM → UFA</text>
  <text class="ink2 sm" x="335" y="212" text-anchor="middle">2) внутри группы —</text>
  <text class="ink2 sm" x="335" y="228" text-anchor="middle">от большей суммы к меньшей</text>
</svg>
