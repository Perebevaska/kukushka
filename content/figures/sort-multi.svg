  <rect class="box-ok" x="40" y="102" width="190" height="24" rx="3"/>
  <text class="ink sm" x="90.0" y="118.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="185.0" y="118.5" text-anchor="middle">250</text>
  <rect class="box-acc" x="40" y="128" width="190" height="24" rx="3"/>
  <text class="ink sm" x="90.0" y="144.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="185.0" y="144.5" text-anchor="middle">400</text>
  <rect class="box-ok" x="40" y="154" width="190" height="24" rx="3"/>
  <text class="ink sm" x="90.0" y="170.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="185.0" y="170.5" text-anchor="middle">350</text>
  <rect class="box-acc" x="40" y="180" width="190" height="24" rx="3"/>
  <text class="ink sm" x="90.0" y="196.5" text-anchor="middle">PRM-1</text>
