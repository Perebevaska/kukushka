<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ticket-loop">
  <title id="t-ticket-loop">Путь тикета: от найденной проблемы до проверки исправления</title>
  <defs><marker id="ah-ticket-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="8" y="40" width="154" height="70" rx="6"/>
  <text class="ink sm b" x="85.0" y="61.5" text-anchor="middle">1. нашли</text>
  <text class="ink2 sm" x="85.0" y="79.5" text-anchor="middle">bonus &lt; 0: 2 из 307</text>
  <text class="ink2 sm" x="85.0" y="97.5" text-anchor="middle">C1188, C1033</text>
  <path class="ln" d="M164,75 L180,75" marker-end="url(#ah-ticket-loop)"/>
  <rect class="box" x="182" y="40" width="154" height="70" rx="6"/>
  <text class="ink sm b" x="259.0" y="61.5" text-anchor="middle">2. тикет владельцу</text>
  <text class="ink2 sm" x="259.0" y="79.5" text-anchor="middle">где, правило, масштаб,</text>
  <text class="ink2 sm" x="259.0" y="97.5" text-anchor="middle">примеры, как найти</text>
  <path class="ln" d="M338,75 L354,75" marker-end="url(#ah-ticket-loop)"/>
  <rect class="box" x="356" y="40" width="154" height="70" rx="6"/>
  <text class="ink sm b" x="433.0" y="61.5" text-anchor="middle">3. исправляют</text>
  <text class="ink2 sm" x="433.0" y="79.5" text-anchor="middle">в самой CRM</text>
  <text class="ink2 sm" x="433.0" y="97.5" text-anchor="middle">(не у нас)</text>
  <path class="ln" d="M512,75 L528,75" marker-end="url(#ah-ticket-loop)"/>
  <rect class="box-ok" x="530" y="40" width="154" height="70" rx="6"/>
  <text class="ink sm b" x="607.0" y="61.5" text-anchor="middle">4. перепроверка</text>
  <text class="ink2 sm" x="607.0" y="79.5" text-anchor="middle">тот же запрос на новой</text>
  <text class="ink2 sm" x="607.0" y="97.5" text-anchor="middle">выгрузке → 0 строк</text>
  <path class="ln dash" d="M607.0,38 V22 H85.0 V36" marker-end="url(#ah-ticket-loop)"/>
  <text class="mut sm" x="346.0" y="16" text-anchor="middle">не 0 строк — тикет переоткрывают с новыми цифрами</text>
  <path class="ln" d="M85.0,112 V146" marker-end="url(#ah-ticket-loop)"/>
  <rect class="box-warn" x="8" y="148" width="328" height="50" rx="6"/>
  <text class="ink sm b" x="172.0" y="168.5" text-anchor="middle">пока не исправили — обход у себя</text>
  <text class="ink2 sm" x="172.0" y="186.5" text-anchor="middle">в очистке: mask → NaN, пометка в отчёте</text>
  <text class="ink2 sm" x="360" y="166" text-anchor="start">запрос из поля «как найти» — это</text>
  <text class="ink2 sm" x="360" y="184" text-anchor="start">и способ найти проблему, и проверка,</text>
  <text class="ink2 sm" x="360" y="202" text-anchor="start">что её действительно починили</text>
  <text class="mut sm" x="350" y="238" text-anchor="middle">в тикете — номера карт, а не имена и телефоны: его читают многие</text>
</svg>
