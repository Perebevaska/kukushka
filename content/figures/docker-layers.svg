<svg viewBox="0 0 700 292" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-docker-layers">
  <title id="t-docker-layers">Dockerfile: каждый шаг — слой с кешем; если поменялся только код, пакеты не переустанавливаются</title>
  <defs><marker id="ah-docker-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-ok" x="120" y="222" width="300" height="30" rx="3"/>
  <text class="ink sm b" x="132" y="242" text-anchor="start">FROM python:3.12-slim</text>
  <text class="ink2 sm" x="430" y="242" text-anchor="start">Linux + Python</text>
  <text class="ok sm" x="110" y="242" text-anchor="end">из кеша</text>
  <rect class="box-ok" x="120" y="186" width="300" height="30" rx="3"/>
  <text class="ink sm b" x="132" y="206" text-anchor="start">COPY pyproject.toml uv.lock</text>
  <text class="ink2 sm" x="430" y="206" text-anchor="start">список пакетов</text>
  <text class="ok sm" x="110" y="206" text-anchor="end">из кеша</text>
  <rect class="box-ok" x="120" y="150" width="300" height="30" rx="3"/>
  <text class="ink sm b" x="132" y="170" text-anchor="start">RUN uv sync --frozen</text>
  <text class="ink2 sm" x="430" y="170" text-anchor="start">установка пакетов, долго</text>
  <text class="ok sm" x="110" y="170" text-anchor="end">из кеша</text>
  <rect class="box-warn" x="120" y="114" width="300" height="30" rx="3"/>
  <text class="ink sm b" x="132" y="134" text-anchor="start">COPY service.py</text>
  <text class="ink2 sm" x="430" y="134" text-anchor="start">код сервиса</text>
  <text class="warn sm" x="110" y="134" text-anchor="end">пересобрать</text>
  <rect class="box-warn" x="120" y="78" width="300" height="30" rx="3"/>
  <text class="ink sm b" x="132" y="98" text-anchor="start">COPY models/</text>
  <text class="ink2 sm" x="430" y="98" text-anchor="start">артефакт модели</text>
  <text class="warn sm" x="110" y="98" text-anchor="end">пересобрать</text>
  <rect class="box-warn" x="120" y="42" width="300" height="30" rx="3"/>
  <text class="ink sm b" x="132" y="62" text-anchor="start">CMD uvicorn …</text>
  <text class="ink2 sm" x="430" y="62" text-anchor="start">что запустить</text>
  <text class="warn sm" x="110" y="62" text-anchor="end">пересобрать</text>
  <text class="ink2 sm b" x="270" y="24" text-anchor="middle">поменяли только service.py:</text>
  <text class="mut sm" x="350" y="278" text-anchor="middle">порядок шагов: внизу — что меняется редко, вверху — что часто</text>
</svg>
