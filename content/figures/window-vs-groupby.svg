<svg viewBox="0 0 700 306" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-window-vs-groupby">
  <title id="t-window-vs-groupby">GROUP BY сворачивает строки, окно оставляет их</title>
  <defs><marker id="ah-window-vs-groupby" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="90.0" y="90" text-anchor="middle">toy: 4 строки</text>
  <rect class="box" x="20" y="98" width="140" height="24" rx="3"/>
  <text class="ink2 sm b" x="55.0" y="114.5" text-anchor="middle">shop</text>
  <text class="ink2 sm b" x="125.0" y="114.5" text-anchor="middle">amount</text>
  <rect class="box-acc" x="20" y="124" width="140" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="140.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="125.0" y="140.5" text-anchor="middle">300</text>
  <rect class="box-acc" x="20" y="150" width="140" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="166.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="125.0" y="166.5" text-anchor="middle">200</text>
  <rect class="box-ok" x="20" y="176" width="140" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="192.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="125.0" y="192.5" text-anchor="middle">400</text>
  <rect class="box-ok" x="20" y="202" width="140" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="218.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="125.0" y="218.5" text-anchor="middle">100</text>
  <text class="ink b" x="300" y="26" text-anchor="middle">GROUP BY shop</text>
  <rect class="box" x="250" y="50" width="170" height="24" rx="3"/>
  <text class="ink2 sm b" x="285.0" y="66.5" text-anchor="middle">shop</text>
  <text class="ink2 sm b" x="370.0" y="66.5" text-anchor="middle">SUM(amount)</text>
  <rect class="box-acc" x="250" y="76" width="170" height="24" rx="3"/>
  <text class="ink sm" x="285.0" y="92.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="370.0" y="92.5" text-anchor="middle">500</text>
  <rect class="box-ok" x="250" y="102" width="170" height="24" rx="3"/>
  <text class="ink sm" x="285.0" y="118.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="370.0" y="118.5" text-anchor="middle">500</text>
  <text class="err sm" x="450" y="72" text-anchor="start">2 строки: заказы</text>
  <text class="err sm" x="450" y="88" text-anchor="start">свернулись в итоги</text>
  <path class="ln" d="M162,110 C200,110 205,76 246,76" marker-end="url(#ah-window-vs-groupby)"/>
  <text class="ink b" x="422" y="160" text-anchor="middle">SUM(amount) OVER (PARTITION BY shop)</text>
  <rect class="box" x="250" y="172" width="344" height="20" rx="3"/>
  <text class="ink2 sm b" x="282.0" y="186.5" text-anchor="middle">shop</text>
  <text class="ink2 sm b" x="344.0" y="186.5" text-anchor="middle">amount</text>
  <text class="ink2 sm b" x="414.0" y="186.5" text-anchor="middle">shop_total</text>
  <text class="ink2 sm b" x="487.0" y="186.5" text-anchor="middle">total</text>
  <text class="ink2 sm b" x="557.0" y="186.5" text-anchor="middle">pct_shop</text>
  <rect class="box-acc" x="250" y="194" width="344" height="20" rx="3"/>
  <text class="ink sm" x="282.0" y="208.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="344.0" y="208.5" text-anchor="middle">300</text>
  <text class="acc sm b" x="414.0" y="208.5" text-anchor="middle">500</text>
  <text class="acc sm b" x="487.0" y="208.5" text-anchor="middle">1 000</text>
  <text class="acc sm b" x="557.0" y="208.5" text-anchor="middle">60 %</text>
  <rect class="box-acc" x="250" y="216" width="344" height="20" rx="3"/>
  <text class="ink sm" x="282.0" y="230.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="344.0" y="230.5" text-anchor="middle">200</text>
  <text class="acc sm b" x="414.0" y="230.5" text-anchor="middle">500</text>
  <text class="acc sm b" x="487.0" y="230.5" text-anchor="middle">1 000</text>
  <text class="acc sm b" x="557.0" y="230.5" text-anchor="middle">40 %</text>
  <rect class="box-ok" x="250" y="238" width="344" height="20" rx="3"/>
  <text class="ink sm" x="282.0" y="252.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="344.0" y="252.5" text-anchor="middle">400</text>
  <text class="acc sm b" x="414.0" y="252.5" text-anchor="middle">500</text>
  <text class="acc sm b" x="487.0" y="252.5" text-anchor="middle">1 000</text>
  <text class="acc sm b" x="557.0" y="252.5" text-anchor="middle">80 %</text>
  <rect class="box-ok" x="250" y="260" width="344" height="20" rx="3"/>
  <text class="ink sm" x="282.0" y="274.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="344.0" y="274.5" text-anchor="middle">100</text>
  <text class="acc sm b" x="414.0" y="274.5" text-anchor="middle">500</text>
  <text class="acc sm b" x="487.0" y="274.5" text-anchor="middle">1 000</text>
  <text class="acc sm b" x="557.0" y="274.5" text-anchor="middle">20 %</text>
  <path class="ln" d="M162,160 C200,160 205,196 246,196" marker-end="url(#ah-window-vs-groupby)"/>
  <text class="ok sm b" x="20" y="262" text-anchor="start">окно: те же 4 строки,</text>
  <text class="ok sm b" x="20" y="278" text-anchor="start">итог встал рядом</text>
  <text class="ok sm b" x="20" y="294" text-anchor="start">с каждой</text>
  <text class="mut sm" x="422" y="300" text-anchor="middle">total = SUM(amount) OVER () — итог всей таблицы</text>
</svg>
