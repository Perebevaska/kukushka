  <text class="ink2 sm" x="600" y="90" text-anchor="middle">в каждой строке</text>
  <text class="ink2 sm" x="600" y="106" text-anchor="middle">0·(−1) + 0·0 + 9·1 = 9</text>
  <text class="ink sm b" x="600" y="124" text-anchor="middle">три строки: 27</text>
  <text class="ink2 sm" x="350" y="206" text-anchor="middle">фильтр «справа светлее, чем слева?» откликается там, где тёмное граничит со светлым</text>
  <text class="mut sm" x="350" y="226" text-anchor="middle">размер выхода: 5 − 3 + 1 = 3 по каждой стороне</text>
