<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-try-loop">
  <title id="t-try-loop">try внутри цикла: плохие строки пропускаются и считаются</title>
  <defs><marker id="ah-try-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="20" y="28" text-anchor="start">raw</text>
  <rect class="box-ok" x="60" y="36" width="100" height="30" rx="4"/>
  <text class="ink sm b" x="110" y="56" text-anchor="middle">"450"</text>
  <text class="ok sm" x="110" y="84" text-anchor="middle">int → 450</text>
  <path class="ln-mut" d="M110,92 C110,130 180,120 180,150" marker-end="url(#ah-try-loop)"/>
  <rect class="box-err" x="184" y="36" width="100" height="30" rx="4"/>
  <text class="ink sm b" x="234" y="56" text-anchor="middle">""</text>
  <text class="err sm b" x="234" y="84" text-anchor="middle">ValueError</text>
  <path class="ln-err" d="M234,92 C234,130 520,120 520,150" marker-end="url(#ah-try-loop)"/>
  <rect class="box-ok" x="308" y="36" width="100" height="30" rx="4"/>
  <text class="ink sm b" x="358" y="56" text-anchor="middle">"1180"</text>
  <text class="ok sm" x="358" y="84" text-anchor="middle">int → 1180</text>
  <path class="ln-mut" d="M358,92 C358,130 180,120 180,150" marker-end="url(#ah-try-loop)"/>
  <rect class="box-err" x="432" y="36" width="100" height="30" rx="4"/>
  <text class="ink sm b" x="482" y="56" text-anchor="middle">"—"</text>
  <text class="err sm b" x="482" y="84" text-anchor="middle">ValueError</text>
  <path class="ln-err" d="M482,92 C482,130 520,120 520,150" marker-end="url(#ah-try-loop)"/>
  <rect class="box-ok" x="556" y="36" width="100" height="30" rx="4"/>
  <text class="ink sm b" x="606" y="56" text-anchor="middle">"275"</text>
  <text class="ok sm" x="606" y="84" text-anchor="middle">int → 275</text>
  <path class="ln-mut" d="M606,92 C606,130 180,120 180,150" marker-end="url(#ah-try-loop)"/>
  <rect class="box-ok" x="60" y="154" width="240" height="50" rx="6"/>
  <text class="ink sm b" x="180.0" y="183.5" text-anchor="middle">total = 450 + 1180 + 275 = 1 905</text>
  <rect class="box-err" x="400" y="154" width="240" height="50" rx="6"/>
  <text class="ink sm b" x="520.0" y="183.5" text-anchor="middle">bad = 2  (пустая строка и «—»)</text>
  <text class="ink2 sm" x="350" y="234" text-anchor="middle">Цикл не упал: итог 1 905 по хорошим строкам и честный счётчик выброшенных — 2.</text>
</svg>
