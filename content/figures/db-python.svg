<svg viewBox="0 0 700 318" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-db-python">
  <title id="t-db-python">Python как клиент базы: подключение, запрос, DataFrame, закрытие</title>
  <defs><marker id="ah-db-python" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="10" y="20" width="128" height="50" rx="6"/>
  <text class="ink sm b" x="74.0" y="41.0" text-anchor="middle">1. подключение</text>
  <text class="ink2 sm" x="74.0" y="58.0" text-anchor="middle">con</text>
  <path class="ln" d="M140,45 L147,45" marker-end="url(#ah-db-python)"/>
  <rect class="box" x="149" y="20" width="128" height="50" rx="6"/>
  <text class="ink sm b" x="213.0" y="41.0" text-anchor="middle">2. текст запроса</text>
  <text class="ink2 sm" x="213.0" y="58.0" text-anchor="middle">SQL + ? / :имя</text>
  <path class="ln" d="M279,45 L286,45" marker-end="url(#ah-db-python)"/>
  <rect class="box" x="288" y="20" width="128" height="50" rx="6"/>
  <text class="ink sm b" x="352.0" y="41.0" text-anchor="middle">3. pd.read_sql_query</text>
  <text class="ink2 sm" x="352.0" y="58.0" text-anchor="middle">(sql, con, params=…)</text>
  <path class="ln" d="M418,45 L425,45" marker-end="url(#ah-db-python)"/>
  <rect class="box-ok" x="427" y="20" width="128" height="50" rx="6"/>
  <text class="ink sm b" x="491.0" y="41.0" text-anchor="middle">4. DataFrame</text>
  <text class="ink2 sm" x="491.0" y="58.0" text-anchor="middle">дальше — pandas</text>
  <path class="ln" d="M557,45 L564,45" marker-end="url(#ah-db-python)"/>
  <rect class="box" x="566" y="20" width="128" height="50" rx="6"/>
  <text class="ink sm b" x="630.0" y="41.0" text-anchor="middle">5. закрыть</text>
  <text class="ink2 sm" x="630.0" y="58.0" text-anchor="middle">con.close()</text>
  <text class="ink2 sm" x="350" y="92" text-anchor="middle">шаги 2–5 одинаковые для любой базы; меняется только, как получить con</text>
  <path class="ln-acc" d="M72,72 V116"/>
  <path class="ln-acc" d="M72,116 H40 V136" marker-end="url(#ah-db-python)"/>
  <path class="ln-acc" d="M72,116 H302 V136" marker-end="url(#ah-db-python)"/>
  <text class="mut sm b" x="20" y="154" text-anchor="start">учебная база — файл</text>
  <rect class="box-acc" x="10" y="164" width="220" height="44" rx="6"/>
  <text class="ink sm b" x="120.0" y="182.0" text-anchor="middle">sqlite3.connect("zerno.db")</text>
  <text class="ink2 sm" x="120.0" y="199.0" text-anchor="middle">встроено в Python, сервера нет</text>
  <text class="warn sm" x="120" y="230" text-anchor="middle">опечатка в имени файла —</text>
  <text class="warn sm" x="120" y="246" text-anchor="middle">новая пустая база, а не ошибка</text>
  <text class="mut sm b" x="260" y="154" text-anchor="start">рабочая база — сервер (PostgreSQL, MS SQL)</text>
  <rect class="box-warn" x="250" y="164" width="104" height="44" rx="6"/>
  <text class="ink sm b" x="302.0" y="182.0" text-anchor="middle">.env</text>
  <text class="ink2 sm" x="302.0" y="199.0" text-anchor="middle">логин, пароль</text>
  <path class="ln" d="M355,186 L361,186" marker-end="url(#ah-db-python)"/>
  <rect class="box" x="362" y="164" width="104" height="44" rx="6"/>
  <text class="ink sm b" x="414.0" y="182.0" text-anchor="middle">load_dotenv()</text>
  <text class="ink2 sm" x="414.0" y="199.0" text-anchor="middle">→ os.environ</text>
  <path class="ln" d="M467,186 L473,186" marker-end="url(#ah-db-python)"/>
  <rect class="box" x="474" y="164" width="104" height="44" rx="6"/>
  <text class="ink sm b" x="526.0" y="182.0" text-anchor="middle">URL.create()</text>
  <text class="ink2 sm" x="526.0" y="199.0" text-anchor="middle">адрес базы</text>
  <path class="ln" d="M579,186 L585,186" marker-end="url(#ah-db-python)"/>
  <rect class="box-acc" x="586" y="164" width="104" height="44" rx="6"/>
  <text class="ink sm b" x="638.0" y="182.0" text-anchor="middle">create_engine()</text>
  <text class="ink2 sm" x="638.0" y="199.0" text-anchor="middle">engine.connect()</text>
  <path class="ln-mut dash" d="M302.0,210 V236" marker-end="url(#ah-db-python)"/>
  <rect class="box-warn" x="248" y="238" width="150" height="44" rx="6"/>
  <text class="ink sm b" x="323.0" y="256.0" text-anchor="middle">.gitignore: .env</text>
  <text class="ink2 sm" x="323.0" y="273.0" text-anchor="middle">секреты не уходят в git</text>
  <rect class="box-ok" x="420" y="238" width="270" height="44" rx="6"/>
  <text class="ink sm b" x="555.0" y="256.0" text-anchor="middle">блокнот: os.environ["DB_PASSWORD"]</text>
  <text class="ink2 sm" x="555.0" y="273.0" text-anchor="middle">в коде ни одного пароля</text>
  <text class="mut sm" x="350" y="308" text-anchor="middle">в браузере курса работает только SQLite; рабочая база — из вашего Jupyter</text>
</svg>
