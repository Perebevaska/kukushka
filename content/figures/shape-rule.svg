<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-shape-rule">
  <title id="t-shape-rule">Правило формы при умножении матриц</title>
  <defs><marker id="ah-shape-rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="90" y="26" text-anchor="middle">выражение</text>
  <text class="mut sm b" x="330" y="26" text-anchor="middle">формы: (m × n) @ (n × k)</text>
  <text class="mut sm b" x="590" y="26" text-anchor="middle">результат (m × k)</text>
  <rect class="box" x="20" y="40" width="660" height="32" rx="5"/>
  <text class="ink sm b" x="90" y="61" text-anchor="middle">recipes @ prices</text>
  <text class="ink sm" x="250" y="61" text-anchor="middle">(<tspan class="ink">3</tspan><tspan class="ink"> × </tspan><tspan class="ok b">3</tspan>)</text>
  <text class="ink sm b" x="330" y="61" text-anchor="middle">@</text>
  <text class="ink sm" x="410" y="61" text-anchor="middle">(<tspan class="ok b">3</tspan><tspan class="ink"> × </tspan><tspan class="ink">2</tspan>)</text>
  <text class="ok sm b" x="590" y="61" text-anchor="middle">✓ (3 × 2)</text>
  <rect class="box-err" x="20" y="80" width="660" height="32" rx="5"/>
  <text class="ink sm b" x="90" y="101" text-anchor="middle">prices @ recipes</text>
  <text class="ink sm" x="250" y="101" text-anchor="middle">(<tspan class="ink">3</tspan><tspan class="ink"> × </tspan><tspan class="err b">2</tspan>)</text>
  <text class="ink sm b" x="330" y="101" text-anchor="middle">@</text>
  <text class="ink sm" x="410" y="101" text-anchor="middle">(<tspan class="err b">3</tspan><tspan class="ink"> × </tspan><tspan class="ink">3</tspan>)</text>
  <text class="err sm b" x="590" y="101" text-anchor="middle">ошибка: 2 ≠ 3</text>
  <rect class="box" x="20" y="120" width="660" height="32" rx="5"/>
  <text class="ink sm b" x="90" y="141" text-anchor="middle">X @ w</text>
  <text class="ink sm" x="250" y="141" text-anchor="middle">(<tspan class="ink">1841</tspan><tspan class="ink"> × </tspan><tspan class="ok b">3</tspan>)</text>
  <text class="ink sm b" x="330" y="141" text-anchor="middle">@</text>
  <text class="ink sm" x="410" y="141" text-anchor="middle">(<tspan class="ok b">3</tspan><tspan class="ink">,</tspan>)</text>
  <text class="ok sm b" x="590" y="141" text-anchor="middle">✓ (1841,)</text>
  <rect class="box-err" x="20" y="160" width="660" height="32" rx="5"/>
  <text class="ink sm b" x="90" y="181" text-anchor="middle">w @ X</text>
  <text class="ink sm" x="250" y="181" text-anchor="middle">(<tspan class="err b">3</tspan><tspan class="ink">,</tspan>)</text>
  <text class="ink sm b" x="330" y="181" text-anchor="middle">@</text>
  <text class="ink sm" x="410" y="181" text-anchor="middle">(<tspan class="err b">1841</tspan><tspan class="ink"> × </tspan><tspan class="ink">3</tspan>)</text>
  <text class="err sm b" x="590" y="181" text-anchor="middle">ошибка: 3 ≠ 1841</text>
  <rect class="box" x="20" y="200" width="660" height="32" rx="5"/>
  <text class="ink sm b" x="90" y="221" text-anchor="middle">X.T @ X</text>
  <text class="ink sm" x="250" y="221" text-anchor="middle">(<tspan class="ink">3</tspan><tspan class="ink"> × </tspan><tspan class="ok b">1841</tspan>)</text>
  <text class="ink sm b" x="330" y="221" text-anchor="middle">@</text>
  <text class="ink sm" x="410" y="221" text-anchor="middle">(<tspan class="ok b">1841</tspan><tspan class="ink"> × </tspan><tspan class="ink">3</tspan>)</text>
  <text class="ok sm b" x="590" y="221" text-anchor="middle">✓ (3 × 3)</text>
  <text class="ink2 sm" x="350" y="256" text-anchor="middle">внутренние размеры (выделены) обязаны совпасть — по ним идёт сумма;</text>
  <text class="mut sm" x="350" y="276" text-anchor="middle">внешние остаются в ответе. Транспонирование .T меняет форму 3 × 1841 ↔ 1841 × 3</text>
</svg>
