<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-artifact-parts">
  <title id="t-artifact-parts">Артефакт модели: папка версии с файлом модели, паспортом и контрольным набором — и от чего защищает каждая часть</title>
  <defs><marker id="ah-artifact-parts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="20" width="250" height="250" rx="8"/>
  <text class="ink sm b" x="26" y="44" text-anchor="start">models/churn/1.0/</text>
  <rect class="box-acc" x="30" y="60" width="218" height="50" rx="4"/>
  <text class="ink sm b" x="42" y="80" text-anchor="start">model.joblib</text>
  <text class="ink2 sm" x="42" y="98" text-anchor="start">конвейер: подготовка + модель</text>
  <rect class="box-warn" x="30" y="120" width="218" height="68" rx="4"/>
  <text class="ink sm b" x="42" y="140" text-anchor="start">card.json — паспорт</text>
  <text class="ink2 sm" x="42" y="158" text-anchor="start">версия, признаки, порог, метрики,</text>
  <text class="ink2 sm" x="42" y="176" text-anchor="start">md5 данных, версия sklearn</text>
  <rect class="box-ok" x="30" y="198" width="218" height="50" rx="4"/>
  <text class="ink sm b" x="42" y="218" text-anchor="start">golden.csv</text>
  <text class="ink2 sm" x="42" y="236" text-anchor="start">20 строк + ожидаемые ответы</text>
  <path class="ln" d="M250,85 L300,85" marker-end="url(#ah-artifact-parts)"/>
  <text class="ink sm" x="306" y="89" text-anchor="start">не нужно обучать заново</text>
  <path class="ln" d="M250,138 L300,138" marker-end="url(#ah-artifact-parts)"/>
  <text class="ink sm" x="306" y="142" text-anchor="start">1. «какая это модель, на чём обучена»</text>
  <path class="ln" d="M250,164 L300,164" marker-end="url(#ah-artifact-parts)"/>
  <text class="ink sm" x="306" y="168" text-anchor="start">4. «какой порог?» — порог в паспорте</text>
  <path class="ln" d="M250,186 L300,186" marker-end="url(#ah-artifact-parts)"/>
  <text class="ink sm" x="306" y="190" text-anchor="start">3. «пришли не те данные» — контракт</text>
  <path class="ln" d="M250,223 L300,223" marker-end="url(#ah-artifact-parts)"/>
  <text class="ink sm" x="306" y="227" text-anchor="start">2. «загрузилась, но отвечает иначе»</text>
  <text class="ink2 sm b" x="306" y="30" text-anchor="start">от какой беды защищает</text>
  <text class="mut sm" x="350" y="282" text-anchor="middle">номера бед — из списка в начале урока</text>
</svg>
