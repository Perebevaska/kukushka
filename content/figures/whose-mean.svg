<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-whose-mean">
  <title id="t-whose-mean">Среднее на заказ и среднее на гостя — разные веса</title>
  <defs><marker id="ah-whose-mean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="170" y="24" text-anchor="middle">на заказ: каждый заказ — голос</text>
  <rect class="box-acc" x="20" y="40" width="56" height="50" rx="6"/>
  <text class="ink sm" x="48" y="60" text-anchor="middle">Аня</text>
  <text class="ink b" x="48" y="80" text-anchor="middle">200</text>
  <rect class="box-acc" x="84" y="40" width="56" height="50" rx="6"/>
  <text class="ink sm" x="112" y="60" text-anchor="middle">Аня</text>
  <text class="ink b" x="112" y="80" text-anchor="middle">200</text>
  <rect class="box-acc" x="148" y="40" width="56" height="50" rx="6"/>
  <text class="ink sm" x="176" y="60" text-anchor="middle">Аня</text>
  <text class="ink b" x="176" y="80" text-anchor="middle">200</text>
  <rect class="box-acc" x="212" y="40" width="56" height="50" rx="6"/>
  <text class="ink sm" x="240" y="60" text-anchor="middle">Аня</text>
  <text class="ink b" x="240" y="80" text-anchor="middle">200</text>
  <rect class="box-warn" x="276" y="40" width="56" height="50" rx="6"/>
  <text class="ink sm" x="304" y="60" text-anchor="middle">Борис</text>
  <text class="ink b" x="304" y="80" text-anchor="middle">600</text>
  <text class="acc b" x="170" y="120" text-anchor="middle">(4 × 200 + 600) / 5 = 280 ₽</text>
  <text class="mut sm" x="170" y="140" text-anchor="middle">Аня — 4 голоса из 5</text>
  <path class="ln" d="M340,65 L392,65" marker-end="url(#ah-whose-mean)"/>
  <text class="acc sm b" x="366" y="52" text-anchor="middle">groupby</text>
  <text class="ink2 sm b" x="530" y="24" text-anchor="middle">на гостя: каждый гость — голос</text>
  <rect class="box-acc" x="420" y="40" width="100" height="50" rx="6"/>
  <text class="ink sm" x="470" y="60" text-anchor="middle">Аня: средний</text>
  <text class="ink b" x="470" y="80" text-anchor="middle">200</text>
  <rect class="box-warn" x="540" y="40" width="100" height="50" rx="6"/>
  <text class="ink sm" x="590" y="60" text-anchor="middle">Борис: средний</text>
  <text class="ink b" x="590" y="80" text-anchor="middle">600</text>
  <text class="acc b" x="530" y="120" text-anchor="middle">(200 + 600) / 2 = 400 ₽</text>
  <text class="mut sm" x="530" y="140" text-anchor="middle">groupby(...).mean().mean()</text>
  <rect class="box" x="20" y="164" width="660" height="72" rx="6"/>
  <text class="ink2 sm" x="350" y="188" text-anchor="middle">на заказ — «сколько даст ещё 1 000 заказов»; на гостя — «какой чек у типичного гостя»</text>
  <text class="ink2 sm" x="350" y="210" text-anchor="middle">по кофейням — третье число: каждая кофейня один голос</text>
  <text class="ink sm b" x="350" y="228" text-anchor="middle">Все три посчитаны верно; в отчёте пишут, чьё это среднее</text>
</svg>
