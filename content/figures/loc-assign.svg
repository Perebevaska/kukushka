<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-loc-assign">
  <title id="t-loc-assign">Цепочка df[маска]["столбец"] = … меняет копию, loc — саму таблицу</title>
  <defs><marker id="ah-loc-assign" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="err sm b" x="20" y="24" text-anchor="start">df[df["channel"] == "доставка"]["amount_net"] = …</text>
  <text class="mut sm b" x="105" y="48" text-anchor="middle">df — исходная</text>
  <rect class="box" x="20" y="56" width="170" height="24" rx="3"/>
  <text class="ink2 sm b" x="63.0" y="72.5" text-anchor="middle">channel</text>
  <text class="ink2 sm b" x="148.0" y="72.5" text-anchor="middle">amount_net</text>
  <rect class="box" x="20" y="82" width="170" height="24" rx="3"/>
  <text class="ink sm" x="63.0" y="98.5" text-anchor="middle">зал</text>
  <text class="ink sm" x="148.0" y="98.5" text-anchor="middle">380</text>
  <rect class="box" x="20" y="108" width="170" height="24" rx="3"/>
  <text class="ink sm" x="63.0" y="124.5" text-anchor="middle">с собой</text>
  <text class="ink sm" x="148.0" y="124.5" text-anchor="middle">240</text>
  <rect class="box-warn" x="20" y="134" width="170" height="24" rx="3"/>
  <text class="ink sm" x="63.0" y="150.5" text-anchor="middle">доставка</text>
  <text class="ink sm" x="148.0" y="150.5" text-anchor="middle">500</text>
  <path class="ln" d="M192,146 C230,146 230,94 262,94" marker-end="url(#ah-loc-assign)"/>
  <text class="ink2 sm" x="270" y="160" text-anchor="start">df[маска] создаёт копию</text>
  <text class="mut sm b" x="351" y="48" text-anchor="middle">новая таблица-копия</text>
  <rect class="box" x="266" y="56" width="170" height="24" rx="3"/>
  <text class="ink2 sm b" x="309.0" y="72.5" text-anchor="middle">channel</text>
  <text class="ink2 sm b" x="394.0" y="72.5" text-anchor="middle">amount_net</text>
  <rect class="box" x="266" y="82" width="170" height="24" rx="3"/>
  <text class="ink sm" x="309.0" y="98.5" text-anchor="middle">доставка</text>
  <text class="ink sm" x="394.0" y="98.5" text-anchor="middle">500</text>
  <path class="ln" d="M438,94 H468" marker-end="url(#ah-loc-assign)"/>
  <text class="mut sm b" x="559" y="48" text-anchor="middle">изменили копию…</text>
  <rect class="box" x="474" y="56" width="170" height="24" rx="3"/>
  <text class="ink2 sm b" x="517.0" y="72.5" text-anchor="middle">channel</text>
  <text class="ink2 sm b" x="602.0" y="72.5" text-anchor="middle">amount_net</text>
  <rect class="box-ok" x="474" y="82" width="170" height="24" rx="3"/>
  <text class="ink sm" x="517.0" y="98.5" text-anchor="middle">доставка</text>
  <text class="ink sm" x="602.0" y="98.5" text-anchor="middle">450</text>
  <text class="err sm b" x="644" y="136" text-anchor="end">…и выбросили</text>
  <text class="err sm b" x="105" y="182" text-anchor="middle">в самой df по-прежнему 500</text>
  <path class="ln-mut" d="M20,196 L680,196"/>
  <text class="ok sm b" x="20" y="220" text-anchor="start">df.loc[df["channel"] == "доставка", "amount_net"] = …</text>
  <rect class="box" x="20" y="234" width="170" height="24" rx="3"/>
  <text class="ink2 sm b" x="63.0" y="250.5" text-anchor="middle">channel</text>
  <text class="ink2 sm b" x="148.0" y="250.5" text-anchor="middle">amount_net</text>
  <rect class="box" x="20" y="260" width="170" height="24" rx="3"/>
  <text class="ink sm" x="63.0" y="276.5" text-anchor="middle">зал</text>
  <text class="ink sm" x="148.0" y="276.5" text-anchor="middle">380</text>
  <rect class="box" x="20" y="286" width="170" height="24" rx="3"/>
  <text class="ink sm" x="63.0" y="302.5" text-anchor="middle">с собой</text>
  <text class="ink sm" x="148.0" y="302.5" text-anchor="middle">240</text>
  <rect class="box-ok" x="20" y="312" width="170" height="24" rx="3"/>
  <text class="ink sm" x="63.0" y="328.5" text-anchor="middle">доставка</text>
  <text class="ink sm" x="148.0" y="328.5" text-anchor="middle">450</text>
  <text class="ok sm b" x="214" y="296" text-anchor="start">одним шагом меняется нужная ячейка самой df: 500 → 450</text>
  <text class="mut sm" x="214" y="316" text-anchor="start">loc[строки, столбец] = значение — как UPDATE … SET … WHERE</text>
</svg>
