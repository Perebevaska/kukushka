<svg viewBox="0 0 700 276" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cutoff-guest">
  <title id="t-cutoff-guest">Точка среза на одном госте: признаки слева, ответ справа</title>
  <defs><marker id="ah-cutoff-guest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="40" y="40" width="390.0" height="96" rx="6"/>
  <rect class="box-warn" x="430.0" y="40" width="230.0" height="96" rx="6"/>
  <text class="acc sm b" x="235.0" y="30" text-anchor="middle">признаки: только то, что знали 1 июля</text>
  <text class="warn sm b" x="545.0" y="30" text-anchor="middle">после среза: ответ</text>
  <path class="ln-err" d="M430.0,20 L430.0,150"/>
  <rect class="ink2" x="40.69672131147541" y="86" width="5" height="22" rx="1"/>
  <rect class="ink2" x="47.09016393442623" y="86" width="5" height="22" rx="1"/>
  <rect class="ink2" x="417.90983606557376" y="86" width="5" height="22" rx="1"/>
  <rect class="box-err" x="598.1451612903226" y="86" width="5" height="22" rx="1"/>
  <rect class="box-err" x="605.5645161290322" y="86" width="5" height="22" rx="1"/>
  <rect class="box-err" x="635.241935483871" y="86" width="5" height="22" rx="1"/>
  <text class="ink2 sm" x="47.19672131147541" y="74" text-anchor="start">2 и 4 марта: 180 ₽, 260 ₽</text>
  <text class="ink2 sm" x="423.40983606557376" y="74" text-anchor="end">28 июня: 120 ₽</text>
  <text class="err sm" x="599.1935483870968" y="74" text-anchor="middle">24, 25, 29 июля: абонемент, 0 ₽</text>
  <circle class="box-ok" cx="519.0322580645161" cy="97" r="7"/>
  <text class="ok sm b" x="519.0322580645161" y="126" text-anchor="middle">купил 13 июля</text>
  <text class="mut sm" x="48" y="126" text-anchor="start">заказы гостя F00430</text>
  <path class="ln" d="M40,150 L660,150"/>
  <path class="ln" d="M40.0,150 L40.0,155"/>
  <text class="mut sm" x="40.0" y="168" text-anchor="middle">мар</text>
  <path class="ln" d="M139.0983606557377,150 L139.0983606557377,155"/>
  <text class="mut sm" x="139.0983606557377" y="168" text-anchor="middle">апр</text>
  <path class="ln" d="M235.0,150 L235.0,155"/>
  <text class="mut sm" x="235.0" y="168" text-anchor="middle">май</text>
  <path class="ln" d="M334.0983606557377,150 L334.0983606557377,155"/>
  <text class="mut sm" x="334.0983606557377" y="168" text-anchor="middle">июн</text>
  <path class="ln" d="M430.0,150 L430.0,155"/>
  <text class="err sm b" x="430.0" y="168" text-anchor="middle">1 июля — срез</text>
  <path class="ln" d="M660.0,150 L660.0,155"/>
  <text class="mut sm" x="660.0" y="168" text-anchor="middle">авг</text>
  <text class="mut sm" x="660" y="186" text-anchor="end">июль на шкале растянут</text>
  <rect class="box" x="120" y="200" width="460" height="22" rx="3"/>
  <text class="ink2 sm b" x="230.0" y="215.0" text-anchor="middle">признак гостя</text>
  <text class="ink2 sm b" x="400.0" y="215.0" text-anchor="middle">вся таблица</text>
  <text class="ink2 sm b" x="520.0" y="215.0" text-anchor="middle">до 1 июля</text>
  <rect class="box" x="120" y="224" width="460" height="22" rx="3"/>
  <text class="ink sm" x="230.0" y="239.0" text-anchor="middle">число заказов</text>
  <text class="err sm" x="400.0" y="239.0" text-anchor="middle">6</text>
  <text class="ok sm" x="520.0" y="239.0" text-anchor="middle">3</text>
  <rect class="box" x="120" y="248" width="460" height="22" rx="3"/>
  <text class="ink sm" x="230.0" y="263.0" text-anchor="middle">доля заказов по абонементу</text>
  <text class="err sm b" x="400.0" y="263.0" text-anchor="middle">3 / 6 = 0.5</text>
  <text class="ok sm b" x="520.0" y="263.0" text-anchor="middle">0 / 3 = 0</text>
</svg>
