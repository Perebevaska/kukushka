<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-git-areas">
  <title id="t-git-areas">Где живут изменения: рабочая папка, индекс, история, GitHub</title>
  <defs><marker id="ah-git-areas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="50" width="144" height="80" rx="8"/>
  <text class="ink b" x="86" y="74" text-anchor="middle">рабочая папка</text>
  <text class="ink2 sm" x="86" y="94" text-anchor="middle">файлы на диске</text>
  <text class="mut sm" x="86" y="116" text-anchor="middle">«??» или « M»</text>
  <rect class="box-acc" x="190" y="50" width="144" height="80" rx="8"/>
  <text class="ink b" x="262" y="74" text-anchor="middle">индекс</text>
  <text class="ink2 sm" x="262" y="94" text-anchor="middle">что уйдёт в коммит</text>
  <text class="mut sm" x="262" y="116" text-anchor="middle">«A » или «M »</text>
  <rect class="box-ok" x="366" y="50" width="144" height="80" rx="8"/>
  <text class="ink b" x="438" y="74" text-anchor="middle">история</text>
  <text class="ink2 sm" x="438" y="94" text-anchor="middle">коммиты в .git</text>
  <text class="mut sm" x="438" y="116" text-anchor="middle">git log</text>
  <rect class="box-warn" x="542" y="50" width="144" height="80" rx="8"/>
  <text class="ink b" x="614" y="74" text-anchor="middle">GitHub</text>
  <text class="ink2 sm" x="614" y="94" text-anchor="middle">origin, копия</text>
  <text class="mut sm" x="614" y="116" text-anchor="middle">на сайте</text>
  <path class="ln" d="M160,80 L186,80" marker-end="url(#ah-git-areas)"/>
  <text class="acc sm b" x="173.0" y="38" text-anchor="middle">git add</text>
  <path class="ln" d="M336,80 L362,80" marker-end="url(#ah-git-areas)"/>
  <text class="acc sm b" x="349.0" y="38" text-anchor="middle">git commit</text>
  <path class="ln" d="M512,80 L538,80" marker-end="url(#ah-git-areas)"/>
  <text class="acc sm b" x="525.0" y="38" text-anchor="middle">git push</text>
  <path class="ln dash" d="M262,132 L262,156 L110,156 L110,134" marker-end="url(#ah-git-areas)"/>
  <text class="ink2 sm" x="186" y="172" text-anchor="middle">git restore --staged</text>
  <path class="ln dash" d="M438,132 L438,196 L60,196 L60,134" marker-end="url(#ah-git-areas)"/>
  <text class="ink2 sm" x="250" y="212" text-anchor="middle">git restore файл — вернуть, как в последнем коммите</text>
  <path class="ln dash" d="M614,132 L614,156 L470,156 L470,134" marker-end="url(#ah-git-areas)"/>
  <text class="ink2 sm" x="480" y="172" text-anchor="start">git pull — забрать новые коммиты</text>
  <text class="mut sm" x="350" y="16" text-anchor="middle">вперёд — сплошные стрелки, назад — пунктир</text>
  <text class="ink2 sm" x="350" y="252" text-anchor="middle">git status --short: первая буква — индекс, вторая — рабочая папка (пробел — «ничего»)</text>
  <text class="mut sm" x="350" y="272" text-anchor="middle">коммит забирает только индекс: изменённый, но не добавленный файл в него не попадёт</text>
</svg>
