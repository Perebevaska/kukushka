<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-own-pattern">
  <title id="t-own-pattern">Шаг 8: когда своя закономерность засчитывается</title>
  <defs><marker id="ah-own-pattern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="40" width="124" height="74" rx="8"/>
  <text class="ink sm b" x="76" y="66" text-anchor="middle">группа условием</text>
  <text class="ink2 sm" x="76" y="86" text-anchor="middle">query по новому</text>
  <text class="ink2 sm" x="76" y="102" text-anchor="middle">признаку</text>
  <rect class="box-acc" x="152" y="40" width="124" height="74" rx="8"/>
  <text class="ink sm b" x="214" y="66" text-anchor="middle">n ≥ 50</text>
  <text class="ink2 sm" x="214" y="86" text-anchor="middle">в группе</text>
  <text class="ink2 sm" x="214" y="102" text-anchor="middle">и вне её</text>
  <path class="ln" d="M140,77 L150,77" marker-end="url(#ah-own-pattern)"/>
  <rect class="box-acc" x="290" y="40" width="124" height="74" rx="8"/>
  <text class="ink sm b" x="352" y="66" text-anchor="middle">разница ≥ 5 п.п.</text>
  <text class="ink2 sm" x="352" y="86" text-anchor="middle">доля в группе</text>
  <text class="ink2 sm" x="352" y="102" text-anchor="middle">против доли вне</text>
  <path class="ln" d="M278,77 L288,77" marker-end="url(#ah-own-pattern)"/>
  <rect class="box-warn" x="428" y="40" width="124" height="74" rx="8"/>
  <text class="ink sm b" x="490" y="66" text-anchor="middle">нет смешения?</text>
  <text class="ink2 sm" x="490" y="86" text-anchor="middle">держится внутри</text>
  <text class="ink2 sm" x="490" y="102" text-anchor="middle">типа курьера</text>
  <path class="ln" d="M416,77 L426,77" marker-end="url(#ah-own-pattern)"/>
  <rect class="box-ok" x="566" y="40" width="124" height="74" rx="8"/>
  <text class="ink sm b" x="628" y="66" text-anchor="middle">вывод: 4 части</text>
  <text class="ink2 sm" x="628" y="86" text-anchor="middle">наблюдение, цифра,</text>
  <text class="ink2 sm" x="628" y="102" text-anchor="middle">n, ограничение</text>
  <path class="ln" d="M554,77 L564,77" marker-end="url(#ah-own-pattern)"/>
  <text class="ink2 sm b" x="350" y="24" text-anchor="middle">Путь каждой находки — пять шагов; у двух находок — разные признаки</text>
  <text class="ok sm b" x="20" y="150" text-anchor="start">можно брать:</text>
  <text class="ink sm" x="120" y="150" text-anchor="start">distance_km, items, amount, hour, день недели из created</text>
  <text class="warn sm b" x="20" y="174" text-anchor="start">только в паре с новым:</text>
  <text class="ink sm" x="186" y="174" text-anchor="start">курьер, погода, кофейня, обещание — уже разобраны в шагах 3–6</text>
  <text class="err sm b" x="20" y="198" text-anchor="start">нельзя:</text>
  <text class="ink sm" x="80" y="198" text-anchor="start">actual_min, delay, late — из них считается метрика; rating — следствие опоздания</text>
  <text class="mut sm" x="350" y="236" text-anchor="middle">Не прошла проверку смешения — не беда: честно запишите это в ограничение</text>
</svg>
