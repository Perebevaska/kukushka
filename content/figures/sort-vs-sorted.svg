<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sort-vs-sorted">
  <title id="t-sort-vs-sorted">sorted возвращает новый список, .sort() переставляет сам список</title>
  <defs><marker id="ah-sort-vs-sorted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="20" y="30" text-anchor="start">top = sorted(revenue, reverse=True)</text>
  <text class="mut sm" x="20" y="62" text-anchor="start">revenue</text>
  <rect class="box" x="90" y="44" width="70" height="30" rx="3"/>
  <text class="ink sm" x="125.0" y="64.0" text-anchor="middle">41 200</text>
  <rect class="box" x="164" y="44" width="70" height="30" rx="3"/>
  <text class="ink sm" x="199.0" y="64.0" text-anchor="middle">38 900</text>
  <rect class="box" x="238" y="44" width="70" height="30" rx="3"/>
  <text class="ink sm" x="273.0" y="64.0" text-anchor="middle">45 100</text>
  <text class="ok sm b" x="330" y="62" text-anchor="start">не изменился</text>
  <text class="mut sm" x="20" y="104" text-anchor="start">top</text>
  <rect class="box-ok" x="90" y="86" width="70" height="30" rx="3"/>
  <text class="ink sm" x="125.0" y="106.0" text-anchor="middle">45 100</text>
  <rect class="box-ok" x="164" y="86" width="70" height="30" rx="3"/>
  <text class="ink sm" x="199.0" y="106.0" text-anchor="middle">41 200</text>
  <rect class="box-ok" x="238" y="86" width="70" height="30" rx="3"/>
  <text class="ink sm" x="273.0" y="106.0" text-anchor="middle">38 900</text>
  <text class="ok sm b" x="330" y="104" text-anchor="start">новый отсортированный список</text>
  <path class="ln-mut" d="M20,128 L680,128"/>
  <text class="ink b" x="20" y="156" text-anchor="start">result = revenue.sort()</text>
  <text class="mut sm" x="20" y="188" text-anchor="start">revenue</text>
  <rect class="box-warn" x="90" y="170" width="70" height="30" rx="3"/>
  <text class="ink sm" x="125.0" y="190.0" text-anchor="middle">38 900</text>
  <rect class="box-warn" x="164" y="170" width="70" height="30" rx="3"/>
  <text class="ink sm" x="199.0" y="190.0" text-anchor="middle">41 200</text>
  <rect class="box-warn" x="238" y="170" width="70" height="30" rx="3"/>
  <text class="ink sm" x="273.0" y="190.0" text-anchor="middle">45 100</text>
  <text class="warn sm b" x="330" y="188" text-anchor="start">переставлен на месте — порядок дней потерян</text>
  <text class="mut sm" x="20" y="230" text-anchor="start">result</text>
  <rect class="box-err" x="90" y="212" width="70" height="30" rx="4"/>
  <text class="err sm b" x="125" y="232" text-anchor="middle">None</text>
  <text class="err sm b" x="330" y="232" text-anchor="start">.sort() ничего не возвращает</text>
</svg>
