<svg viewBox="0 0 700 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-fp-honest-threshold">
  <title id="t-fp-honest-threshold">Честный порядок: модель и порог — на обучении, тест — один раз</title>
  <defs><marker id="ah-fp-honest-threshold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="14" y="22" width="504.0" height="34" rx="4"/>
  <text class="ink sm b" x="266.0" y="44" text-anchor="middle">обучение: 1 350 гостей, 149 покупателей</text>
  <rect class="box-warn" x="518.0" y="22" width="168.0" height="34" rx="4"/>
  <text class="ink sm b" x="602.0" y="44" text-anchor="middle">тест: 450, 49 покупателей</text>
  <rect class="box" x="14" y="82" width="150" height="52" rx="6"/>
  <text class="ink sm b" x="89.0" y="104" text-anchor="middle">1. cross_val_predict</text>
  <text class="ink2 sm" x="89.0" y="122" text-anchor="middle">прогноз вне выборки</text>
  <path class="ln" d="M89.0,58 L89.0,80" marker-end="url(#ah-fp-honest-threshold)"/>
  <rect class="box" x="180" y="82" width="150" height="52" rx="6"/>
  <text class="ink sm b" x="255.0" y="104" text-anchor="middle">2. кривая</text>
  <text class="ink2 sm" x="255.0" y="122" text-anchor="middle">порог → прибыль</text>
  <path class="ln" d="M255.0,58 L255.0,80" marker-end="url(#ah-fp-honest-threshold)"/>
  <rect class="box" x="346" y="82" width="150" height="52" rx="6"/>
  <text class="ink sm b" x="421.0" y="104" text-anchor="middle">3. лучший порог 0.08</text>
  <text class="ink2 sm" x="421.0" y="122" text-anchor="middle">теория: C / V = 0.094</text>
  <path class="ln" d="M421.0,58 L421.0,80" marker-end="url(#ah-fp-honest-threshold)"/>
  <path class="ln" d="M166,108 L178,108" marker-end="url(#ah-fp-honest-threshold)"/>
  <path class="ln" d="M332,108 L344,108" marker-end="url(#ah-fp-honest-threshold)"/>
  <rect class="box" x="14" y="166" width="482" height="40" rx="6"/>
  <text class="ink sm b" x="255" y="191" text-anchor="middle">4. модель — fit на всех 1 350 гостях обучения</text>
  <path class="ln" d="M421,136 L421,164" marker-end="url(#ah-fp-honest-threshold)"/>
  <rect class="box-ok" x="530" y="82" width="156" height="124" rx="6"/>
  <text class="ink sm b" x="608" y="104" text-anchor="middle">5. тест — один раз</text>
  <text class="ink2 sm" x="608" y="126" text-anchor="middle">порог 0.08:</text>
  <text class="ink2 sm" x="608" y="144" text-anchor="middle">174 предложения</text>
  <text class="ink2 sm" x="608" y="162" text-anchor="middle">42 из 49 покупателей</text>
  <text class="ok sm b" x="608" y="180" text-anchor="middle">прибыль 41 100 ₽</text>
  <path class="ln" d="M498,186 L528,186" marker-end="url(#ah-fp-honest-threshold)"/>
  <path class="ln" d="M608,80 L608,58" marker-end="url(#ah-fp-honest-threshold)"/>
  <text class="ink2 sm" x="350" y="232" text-anchor="middle">тест не участвует ни в выборе модели, ни в выборе порога — поэтому 41 100 ₽ честная оценка</text>
  <text class="mut sm" x="350" y="252" text-anchor="middle">порог, подобранный на тесте (0.10 → 43 850 ₽), выглядел бы лучше только на этом тесте</text>
</svg>
