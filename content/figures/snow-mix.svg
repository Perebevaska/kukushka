<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-snow-mix">
  <title id="t-snow-mix">Снег: доля опозданий смешивает «снег замедляет» и «в снег едут машины»</title>
  <defs><marker id="ah-snow-mix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="170" y="24" text-anchor="middle">кто везёт: состав курьеров</text>
  <text class="ink b" x="20" y="64" text-anchor="start">ясно</text>
  <text class="mut sm" x="20" y="80" text-anchor="start">n = 649</text>
  <rect class="box-ok" x="74" y="48" width="66.64098613251156" height="34" rx="2"/>
  <text class="ink sm b" x="107.32049306625578" y="70" text-anchor="middle">27 %</text>
  <rect class="box-acc" x="140.64098613251156" y="48" width="127.50385208012327" height="34" rx="2"/>
  <text class="ink sm b" x="204.39291217257318" y="70" text-anchor="middle">51 %</text>
  <rect class="box-warn" x="268.1448382126348" y="48" width="55.855161787365184" height="34" rx="2"/>
  <text class="ink sm b" x="296.0724191063174" y="70" text-anchor="middle">22 %</text>
  <text class="ink b" x="20" y="122" text-anchor="start">снег</text>
  <text class="mut sm" x="20" y="138" text-anchor="start">n = 166</text>
  <rect class="box-ok" x="74" y="106" width="112.95180722891567" height="34" rx="2"/>
  <text class="ink sm b" x="130.47590361445782" y="128" text-anchor="middle">45 %</text>
  <rect class="box-acc" x="186.95180722891567" y="106" width="84.33734939759036" height="34" rx="2"/>
  <text class="ink sm b" x="229.12048192771084" y="128" text-anchor="middle">34 %</text>
  <rect class="box-warn" x="271.28915662650604" y="106" width="52.71084337349398" height="34" rx="2"/>
  <text class="ink sm b" x="297.644578313253" y="128" text-anchor="middle">21 %</text>
  <rect class="box-ok" x="70" y="160" width="12" height="12" rx="2"/>
  <text class="ink sm" x="86" y="170" text-anchor="start">авто</text>
  <rect class="box-acc" x="160" y="160" width="12" height="12" rx="2"/>
  <text class="ink sm" x="176" y="170" text-anchor="start">вело</text>
  <rect class="box-warn" x="250" y="160" width="12" height="12" rx="2"/>
  <text class="ink sm" x="266" y="170" text-anchor="start">пеший</text>
  <text class="ink2 sm b" x="530" y="24" text-anchor="middle">как часто опаздывает: ясно → снег</text>
  <rect class="box-ok" x="380" y="50" width="60" height="26" rx="3"/>
  <text class="ink sm b" x="410" y="67" text-anchor="middle">авто</text>
  <text class="ink sm" x="500" y="68" text-anchor="middle">7.5 %</text>
  <path class="ln" d="M536,63 L586,63" marker-end="url(#ah-snow-mix)"/>
  <text class="ink sm b" x="626" y="68" text-anchor="middle">6.7 %</text>
  <rect class="box-acc" x="380" y="90" width="60" height="26" rx="3"/>
  <text class="ink sm b" x="410" y="107" text-anchor="middle">вело</text>
  <text class="ink sm" x="500" y="108" text-anchor="middle">13.6 %</text>
  <path class="ln" d="M536,103 L586,103" marker-end="url(#ah-snow-mix)"/>
  <text class="err sm b" x="626" y="108" text-anchor="middle">33.9 %</text>
  <rect class="box-warn" x="380" y="130" width="60" height="26" rx="3"/>
  <text class="ink sm b" x="410" y="147" text-anchor="middle">пеший</text>
  <text class="ink sm" x="500" y="148" text-anchor="middle">69.0 %</text>
  <path class="ln" d="M536,143 L586,143" marker-end="url(#ah-snow-mix)"/>
  <text class="err sm b" x="626" y="148" text-anchor="middle">94.3 %</text>
  <rect class="box" x="20" y="196" width="660" height="92" rx="6"/>
  <text class="ink2 sm b" x="40" y="220" text-anchor="start">общая доля опозданий:</text>
  <text class="ink" x="40" y="244" text-anchor="start">ясно 24 %</text>
  <text class="err b" x="160" y="244" text-anchor="start">снег 34 %</text>
  <text class="mut sm" x="40" y="270" text-anchor="start">видимый эффект снега</text>
  <text class="err sm b" x="186" y="270" text-anchor="start">+10 п.п.</text>
  <path class="ln" d="M300,242 L340,242" marker-end="url(#ah-snow-mix)"/>
  <text class="ink2 sm b" x="360" y="220" text-anchor="start">снег, но состав курьеров как в ясную погоду:</text>
  <text class="ink sm" x="360" y="244" text-anchor="start">0.27 × 6.7 % + 0.51 × 33.9 % + 0.22 × 94.3 %</text>
  <text class="err b" x="360" y="270" text-anchor="start">≈ 40 % — эффект снега +16 п.п.</text>
</svg>
