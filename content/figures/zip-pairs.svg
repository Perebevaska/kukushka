<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-zip-pairs">
  <title id="t-zip-pairs">zip склеивает списки попарно и останавливается на коротком</title>
  <defs><marker id="ah-zip-pairs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="20" y="28" text-anchor="start">zip(cities, cups)</text>
  <rect class="box-acc" x="84" y="44" width="92" height="28" rx="4"/>
  <text class="ink sm" x="130" y="63" text-anchor="middle">Пермь</text>
  <rect class="box-ok" x="84" y="96" width="92" height="28" rx="4"/>
  <text class="ink sm" x="130" y="115" text-anchor="middle">412</text>
  <rect class="ln-acc dash" x="78" y="38" width="104" height="92" rx="8"/>
  <text class="ink2 sm" x="130" y="150" text-anchor="middle">("Пермь", 412)</text>
  <rect class="box-acc" x="194" y="44" width="92" height="28" rx="4"/>
  <text class="ink sm" x="240" y="63" text-anchor="middle">Казань</text>
  <rect class="box-ok" x="194" y="96" width="92" height="28" rx="4"/>
  <text class="ink sm" x="240" y="115" text-anchor="middle">538</text>
  <rect class="ln-acc dash" x="188" y="38" width="104" height="92" rx="8"/>
  <text class="ink2 sm" x="240" y="150" text-anchor="middle">("Казань", 538)</text>
  <rect class="box-acc" x="304" y="44" width="92" height="28" rx="4"/>
  <text class="ink sm" x="350" y="63" text-anchor="middle">Тюмень</text>
  <rect class="box-ok" x="304" y="96" width="92" height="28" rx="4"/>
  <text class="ink sm" x="350" y="115" text-anchor="middle">297</text>
  <rect class="ln-acc dash" x="298" y="38" width="104" height="92" rx="8"/>
  <text class="ink2 sm" x="350" y="150" text-anchor="middle">("Тюмень", 297)</text>
  <text class="mut sm" x="20" y="63" text-anchor="start">cities</text>
  <text class="mut sm" x="20" y="115" text-anchor="start">cups</text>
  <text class="acc sm b" x="244" y="180" text-anchor="middle">пара на каждую позицию</text>
  <path class="ln-mut" d="M420,30 L420,220"/>
  <text class="err b" x="440" y="28" text-anchor="start">если cups короче</text>
  <rect class="box-acc" x="440" y="44" width="72" height="28" rx="4"/>
  <text class="ink sm" x="476" y="63" text-anchor="middle">Пермь</text>
  <rect class="box-ok" x="440" y="96" width="72" height="28" rx="4"/>
  <text class="ink sm" x="476" y="115" text-anchor="middle">412</text>
  <rect class="box-acc" x="520" y="44" width="72" height="28" rx="4"/>
  <text class="ink sm" x="556" y="63" text-anchor="middle">Казань</text>
  <rect class="box-ok" x="520" y="96" width="72" height="28" rx="4"/>
  <text class="ink sm" x="556" y="115" text-anchor="middle">538</text>
  <rect class="box-err" x="600" y="44" width="72" height="28" rx="4"/>
  <text class="ink sm" x="636" y="63" text-anchor="middle">Тюмень</text>
  <text class="err sm b" x="600" y="150" text-anchor="middle">пар — 2: «Тюмень» молча</text>
  <text class="err sm b" x="600" y="168" text-anchor="middle">отброшена, ошибки нет</text>
  <text class="mut sm" x="560" y="200" text-anchor="middle">сверяйте len() до zip</text>
</svg>
