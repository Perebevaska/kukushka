<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-loop-vs-vector">
  <title id="t-loop-vs-vector">Цикл по строкам и векторизованное X @ w (условная схема)</title>
  <defs><marker id="ah-loop-vs-vector" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="205" y="24" text-anchor="middle">цикл for row in X</text>
  <text class="ink b" x="530" y="24" text-anchor="middle">X @ w + b</text>
  <text class="mut sm" x="16" y="62" text-anchor="start">стр. 1</text>
  <rect class="box-warn" x="62" y="40" width="70" height="34" rx="4"/>
  <text class="ink sm" x="97" y="55" text-anchor="middle">достать</text>
  <text class="ink sm" x="97" y="68" text-anchor="middle">числа</text>
  <rect class="box-warn" x="134" y="40" width="70" height="34" rx="4"/>
  <text class="ink sm" x="169" y="55" text-anchor="middle">проверить</text>
  <text class="ink sm" x="169" y="68" text-anchor="middle">типы</text>
  <rect class="box-acc" x="206" y="40" width="70" height="34" rx="4"/>
  <text class="ink sm" x="241" y="55" text-anchor="middle">умножить,</text>
  <text class="ink sm" x="241" y="68" text-anchor="middle">сложить</text>
  <rect class="box-warn" x="278" y="40" width="70" height="34" rx="4"/>
  <text class="ink sm" x="313" y="55" text-anchor="middle">создать</text>
  <text class="ink sm" x="313" y="68" text-anchor="middle">объект</text>
  <text class="mut sm" x="16" y="114" text-anchor="start">стр. 2</text>
  <rect class="box-warn" x="62" y="92" width="70" height="34" rx="4"/>
  <text class="ink sm" x="97" y="107" text-anchor="middle">достать</text>
  <text class="ink sm" x="97" y="120" text-anchor="middle">числа</text>
  <rect class="box-warn" x="134" y="92" width="70" height="34" rx="4"/>
  <text class="ink sm" x="169" y="107" text-anchor="middle">проверить</text>
  <text class="ink sm" x="169" y="120" text-anchor="middle">типы</text>
  <rect class="box-acc" x="206" y="92" width="70" height="34" rx="4"/>
  <text class="ink sm" x="241" y="107" text-anchor="middle">умножить,</text>
  <text class="ink sm" x="241" y="120" text-anchor="middle">сложить</text>
  <rect class="box-warn" x="278" y="92" width="70" height="34" rx="4"/>
  <text class="ink sm" x="313" y="107" text-anchor="middle">создать</text>
  <text class="ink sm" x="313" y="120" text-anchor="middle">объект</text>
  <text class="mut sm" x="16" y="166" text-anchor="start">…</text>
  <rect class="box-warn" x="62" y="144" width="70" height="34" rx="4"/>
  <text class="ink sm" x="97" y="159" text-anchor="middle">достать</text>
  <text class="ink sm" x="97" y="172" text-anchor="middle">числа</text>
  <rect class="box-warn" x="134" y="144" width="70" height="34" rx="4"/>
  <text class="ink sm" x="169" y="159" text-anchor="middle">проверить</text>
  <text class="ink sm" x="169" y="172" text-anchor="middle">типы</text>
  <rect class="box-acc" x="206" y="144" width="70" height="34" rx="4"/>
  <text class="ink sm" x="241" y="159" text-anchor="middle">умножить,</text>
  <text class="ink sm" x="241" y="172" text-anchor="middle">сложить</text>
  <rect class="box-warn" x="278" y="144" width="70" height="34" rx="4"/>
  <text class="ink sm" x="313" y="159" text-anchor="middle">создать</text>
  <text class="ink sm" x="313" y="172" text-anchor="middle">объект</text>
  <text class="err sm b" x="205" y="214" text-anchor="middle">и так 100 000 раз: подготовка</text>
  <text class="err sm b" x="205" y="232" text-anchor="middle">повторяется на каждой строке</text>
  <path class="ln-mut" d="M370,34 L370,250"/>
  <rect class="box-warn" x="400" y="44" width="260" height="40" rx="6"/>
  <text class="ink sm" x="530.0" y="68.5" text-anchor="middle">проверить форму и тип — один раз</text>
  <path class="ln" d="M530,86 L530,104" marker-end="url(#ah-loop-vs-vector)"/>
  <rect class="box-acc" x="400" y="106" width="260" height="70" rx="6"/>
  <text class="ink sm" x="530.0" y="128.5" text-anchor="middle">готовый цикл на C</text>
  <text class="ink sm" x="530.0" y="145.5" text-anchor="middle">по сплошному блоку памяти:</text>
  <text class="ink sm" x="530.0" y="162.5" text-anchor="middle">только умножить и сложить</text>
  <path class="ln" d="M530,178 L530,196" marker-end="url(#ah-loop-vs-vector)"/>
  <rect class="box-ok" x="400" y="198" width="260" height="34" rx="6"/>
  <text class="ink sm b" x="530.0" y="219.5" text-anchor="middle">100 000 прогнозов</text>
  <text class="ink2 sm" x="350" y="270" text-anchor="middle">%timeit из урока: цикл 250 мс, X @ w — 0.9 мс, разница около 280 раз</text>
  <text class="mut sm" x="350" y="290" text-anchor="middle">ответы одинаковые (np.allclose) — отличается только, сколько лишней работы вокруг арифметики</text>
</svg>
