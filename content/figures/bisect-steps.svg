<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-bisect-steps">
  <title id="t-bisect-steps">Деление пополам: каждый шаг вдвое сужает отрезок, где производная меняет знак</title>
  <defs><marker id="ah-bisect-steps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="30" y="49" text-anchor="start">шаг 1</text>
  <path class="ln-mut" d="M90,44 L610,44"/>
  <rect class="box-acc" x="90.0" y="37" width="520.0" height="14" rx="3"/>
  <path class="ln-err" d="M350.0,32 L350.0,56"/>
  <text class="err sm b" x="350.0" y="28" text-anchor="middle">10: L′ = 1.8</text>
  <text class="ink sm" x="622" y="49" text-anchor="start">→ [0, 10]</text>
  <text class="mut sm" x="30" y="99" text-anchor="start">шаг 2</text>
  <path class="ln-mut" d="M90,94 L610,94"/>
  <rect class="box-acc" x="90.0" y="87" width="260.0" height="14" rx="3"/>
  <path class="ln-ok" d="M220.0,82 L220.0,106"/>
  <text class="ok sm b" x="220.0" y="78" text-anchor="middle">5: L′ = −138.7</text>
  <text class="ink sm" x="622" y="99" text-anchor="start">→ [5, 10]</text>
  <text class="mut sm" x="30" y="149" text-anchor="start">шаг 3</text>
  <path class="ln-mut" d="M90,144 L610,144"/>
  <rect class="box-acc" x="220.0" y="137" width="130.0" height="14" rx="3"/>
  <path class="ln-ok" d="M285.0,132 L285.0,156"/>
  <text class="ok sm b" x="285.0" y="128" text-anchor="middle">7.5: L′ = −68.45</text>
  <text class="ink sm" x="622" y="149" text-anchor="start">→ [7.5, 10]</text>
  <text class="mut sm" x="30" y="199" text-anchor="start">шаг 4</text>
  <path class="ln-mut" d="M90,194 L610,194"/>
  <rect class="box-acc" x="285.0" y="187" width="65.0" height="14" rx="3"/>
  <path class="ln-ok" d="M317.5,182 L317.5,206"/>
  <text class="ok sm b" x="317.5" y="178" text-anchor="middle">8.75: L′ = −33.33</text>
  <text class="ink sm" x="622" y="199" text-anchor="start">→ [8.75, 10]</text>
  <text class="mut sm" x="90.0" y="228" text-anchor="middle">0</text>
  <text class="mut sm" x="220.0" y="228" text-anchor="middle">5</text>
  <text class="mut sm" x="350.0" y="228" text-anchor="middle">10</text>
  <text class="mut sm" x="480.0" y="228" text-anchor="middle">15</text>
  <text class="mut sm" x="610.0" y="228" text-anchor="middle">20</text>
  <circle class="box-ok" cx="348.33451957295375" cy="214" r="4"/>
  <text class="ok sm" x="348.33451957295375" y="204" text-anchor="middle"></text>
  <text class="ok sm b" x="356.33451957295375" y="218" text-anchor="start">ответ ≈ 9.936</text>
  <text class="ink2 sm" x="350" y="256" text-anchor="middle">L′ &gt; 0 (красный) — ноль левее, L′ &lt; 0 (зелёный) — правее. Длина: 20 → 10 → 5 → 2.5 → 1.25</text>
  <text class="mut sm" x="350" y="276" text-anchor="middle">до точности 0.001 нужно 15 шагов: 2¹⁵ = 32 768 ≥ 20 / 0.001 = 20 000</text>
</svg>
