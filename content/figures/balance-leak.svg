<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-balance-leak">
  <title id="t-balance-leak">Балансировка до разбиения и после</title>
  <defs><marker id="ah-balance-leak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="err b" x="180" y="22" text-anchor="middle">неправильно: размножили, потом разбили</text>
  <rect class="box" x="60" y="36" width="240" height="40" rx="6"/>
  <text class="ink sm b" x="180.0" y="52.0" text-anchor="middle">вся таблица: ушедший гость А</text>
  <text class="ink2 sm" x="180.0" y="69.0" text-anchor="middle">+ его копии А′, А″</text>
  <path class="ln" d="M180,76 L180,96" marker-end="url(#ah-balance-leak)"/>
  <text class="acc sm" x="188" y="90" text-anchor="start">train_test_split</text>
  <rect class="box-acc" x="30" y="100" width="170" height="50" rx="6"/>
  <text class="ink sm b" x="115.0" y="121.0" text-anchor="middle">train: А, А″</text>
  <text class="ink2 sm" x="115.0" y="138.0" text-anchor="middle">модель видела А</text>
  <rect class="box-err" x="210" y="100" width="130" height="50" rx="6"/>
  <text class="ink sm b" x="275.0" y="121.0" text-anchor="middle">test: А′</text>
  <text class="ink2 sm" x="275.0" y="138.0" text-anchor="middle">копия А</text>
  <rect class="box-err" x="30" y="172" width="310" height="64" rx="6"/>
  <text class="ink sm b" x="185.0" y="191.5" text-anchor="middle">модель «узнаёт» гостя в тесте:</text>
  <text class="ink2 sm" x="185.0" y="208.5" text-anchor="middle">F1 около 0.94, AUC около 0.99,</text>
  <text class="ink2 sm" x="185.0" y="225.5" text-anchor="middle">у ~90 % уходящих теста копия есть в train</text>
  <text class="ok b" x="525" y="22" text-anchor="middle">правильно: разбили, потом размножили</text>
  <rect class="box" x="405" y="36" width="240" height="40" rx="6"/>
  <text class="ink sm b" x="525.0" y="52.0" text-anchor="middle">вся таблица: каждый гость</text>
  <text class="ink2 sm" x="525.0" y="69.0" text-anchor="middle">один раз</text>
  <path class="ln" d="M525,76 L525,96" marker-end="url(#ah-balance-leak)"/>
  <text class="acc sm" x="533" y="90" text-anchor="start">train_test_split</text>
  <rect class="box-acc" x="375" y="100" width="170" height="50" rx="6"/>
  <text class="ink sm b" x="460.0" y="121.0" text-anchor="middle">train → upsampling</text>
  <text class="ink2 sm" x="460.0" y="138.0" text-anchor="middle">копии только здесь</text>
  <rect class="box-ok" x="555" y="100" width="130" height="50" rx="6"/>
  <text class="ink sm b" x="620.0" y="121.0" text-anchor="middle">test</text>
  <text class="ink2 sm" x="620.0" y="138.0" text-anchor="middle">не трогаем</text>
  <rect class="box-ok" x="375" y="172" width="310" height="64" rx="6"/>
  <text class="ink sm b" x="530.0" y="191.5" text-anchor="middle">в тесте только новые гости:</text>
  <text class="ink2 sm" x="530.0" y="208.5" text-anchor="middle">оценка честная —</text>
  <text class="ink2 sm" x="530.0" y="225.5" text-anchor="middle">как на реальном потоке</text>
  <text class="ink2 sm" x="350" y="266" text-anchor="middle">то же правило для любой подготовки, которая смотрит на данные целиком:</text>
  <text class="mut sm" x="350" y="284" text-anchor="middle">заполнение средним, масштабирование, доли по группам — сначала разбиение, потом только по train</text>
</svg>
