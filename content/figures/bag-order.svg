  <text class="ink sm" x="489.80000000000007" y="51" text-anchor="middle">холодный</text>
  <rect class="box-warn" x="14" y="100" width="230" height="34" rx="4"/>
  <text class="ink sm" x="129" y="122" text-anchor="middle">«Холодный, но вкусный кофе»</text>
  <path class="ln" d="M248,117 L290,117" marker-end="url(#ah-bag-order)"/>
  <text class="mut sm" x="269" y="108" text-anchor="middle">Counter</text>
  <rect class="box" x="296" y="104" width="75.2" height="26" rx="13"/>
  <text class="ink sm" x="333.6" y="121" text-anchor="middle">холодный</text>
  <rect class="box" x="375.2" y="104" width="30.8" height="26" rx="13"/>
  <text class="ink sm" x="390.59999999999997" y="121" text-anchor="middle">но</text>
  <rect class="box" x="410.0" y="104" width="67.80000000000001" height="26" rx="13"/>
  <text class="ink sm" x="443.9" y="121" text-anchor="middle">вкусный</text>
  <rect class="box" x="481.8" y="104" width="45.6" height="26" rx="13"/>
  <text class="ink sm" x="504.6" y="121" text-anchor="middle">кофе</text>
