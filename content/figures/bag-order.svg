<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-bag-order">
  <title id="t-bag-order">Мешок слов: два отзыва с разным порядком слов дают одну и ту же строку чисел</title>
  <defs><marker id="ah-bag-order" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-warn" x="14" y="30" width="230" height="34" rx="4"/>
  <text class="ink sm" x="129" y="52" text-anchor="middle">«Кофе вкусный, но холодный»</text>
  <path class="ln" d="M248,47 L290,47" marker-end="url(#ah-bag-order)"/>
  <text class="mut sm" x="269" y="38" text-anchor="middle">Counter</text>
  <rect class="box" x="296" y="34" width="45.6" height="26" rx="13"/>
  <text class="ink sm" x="318.8" y="51" text-anchor="middle">кофе</text>
