  <text class="ink2 sm b" x="578.0" y="188" text-anchor="middle">холодный</text>
  <rect class="box-acc" x="540" y="200" width="76" height="26" rx="3"/>
  <text class="ink b" x="578.0" y="218" text-anchor="middle">1</text>
  <text class="ink2 sm b" x="290" y="218" text-anchor="end">оба отзыва</text>
  <path class="ln" d="M470,136 L470,166" marker-end="url(#ah-bag-order)"/>
  <text class="mut sm" x="129" y="186" text-anchor="middle">порядок слов в мешке</text>
