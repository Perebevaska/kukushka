  <text class="ink2 sm b" x="338.0" y="188" text-anchor="middle">вкусный</text>
  <rect class="box-acc" x="300" y="200" width="76" height="26" rx="3"/>
  <text class="ink b" x="338.0" y="218" text-anchor="middle">1</text>
  <rect class="box" x="380" y="170" width="76" height="26" rx="3"/>
  <text class="ink2 sm b" x="418.0" y="188" text-anchor="middle">кофе</text>
  <rect class="box-acc" x="380" y="200" width="76" height="26" rx="3"/>
  <text class="ink b" x="418.0" y="218" text-anchor="middle">1</text>
  <rect class="box" x="460" y="170" width="76" height="26" rx="3"/>
  <text class="ink2 sm b" x="498.0" y="188" text-anchor="middle">но</text>
  <rect class="box-acc" x="460" y="200" width="76" height="26" rx="3"/>
  <text class="ink b" x="498.0" y="218" text-anchor="middle">1</text>
