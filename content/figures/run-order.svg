<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-run-order">
  <title id="t-run-order">Одни и те же ячейки в двух порядках выполнения</title>
  <defs><marker id="ah-run-order" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="err sm b" x="177" y="24" text-anchor="middle">черновик: как запускали</text>
  <rect class="box" x="14" y="36" width="326" height="32" rx="5"/>
  <text class="mut sm b" x="24" y="57" text-anchor="start">[1]</text>
  <text class="ink2 sm" x="56" y="57" text-anchor="start">яч. 1:</text>
  <text class="ink sm" x="100" y="57" text-anchor="start">import pandas as pd</text>
  <path class="ln-mut" d="M40,68 L40,76"/>
  <rect class="box" x="14" y="76" width="326" height="32" rx="5"/>
  <text class="mut sm b" x="24" y="97" text-anchor="start">[2]</text>
  <text class="ink2 sm" x="56" y="97" text-anchor="start">яч. 2:</text>
  <text class="ink sm" x="100" y="97" text-anchor="start">df = pd.read_csv(…)</text>
  <text class="ink2 sm" x="332" y="97" text-anchor="end">df: 2 089 строк</text>
  <path class="ln-mut" d="M40,108 L40,116"/>
  <rect class="box-acc" x="14" y="116" width="326" height="32" rx="5"/>
  <text class="mut sm b" x="24" y="137" text-anchor="start">[3]</text>
  <text class="ink2 sm" x="56" y="137" text-anchor="start">яч. 4:</text>
  <text class="ink sm" x="100" y="137" text-anchor="start">df["amount"].sum()</text>
  <text class="err sm b" x="332" y="137" text-anchor="end">710 195 ₽</text>
  <path class="ln-mut" d="M40,148 L40,156"/>
  <rect class="box-acc" x="14" y="156" width="326" height="32" rx="5"/>
  <text class="mut sm b" x="24" y="177" text-anchor="start">[6]</text>
  <text class="ink2 sm" x="56" y="177" text-anchor="start">яч. 3:</text>
  <text class="ink sm" x="100" y="177" text-anchor="start">df = df[доставка]</text>
  <text class="ink2 sm" x="332" y="177" text-anchor="end">df: 380 строк</text>
  <path class="ln-mut" d="M40,188 L40,196"/>
  <rect class="box" x="14" y="196" width="326" height="32" rx="5"/>
  <text class="mut sm b" x="24" y="217" text-anchor="start">[7]</text>
  <text class="ink2 sm" x="56" y="217" text-anchor="start">яч. 5:</text>
  <text class="ink sm" x="100" y="217" text-anchor="start">groupby("shop")</text>
  <text class="err sm b" x="332" y="217" text-anchor="end">KeyError</text>
  <text class="ok sm b" x="523" y="24" text-anchor="middle">Restart &amp; Run All: сверху вниз</text>
  <rect class="box" x="360" y="36" width="326" height="32" rx="5"/>
  <text class="mut sm b" x="370" y="57" text-anchor="start">[1]</text>
  <text class="ink2 sm" x="402" y="57" text-anchor="start">яч. 1:</text>
  <text class="ink sm" x="446" y="57" text-anchor="start">import pandas as pd</text>
  <path class="ln-mut" d="M386,68 L386,76"/>
  <rect class="box" x="360" y="76" width="326" height="32" rx="5"/>
  <text class="mut sm b" x="370" y="97" text-anchor="start">[2]</text>
  <text class="ink2 sm" x="402" y="97" text-anchor="start">яч. 2:</text>
  <text class="ink sm" x="446" y="97" text-anchor="start">df = pd.read_csv(…)</text>
  <text class="ink2 sm" x="678" y="97" text-anchor="end">df: 2 089 строк</text>
  <path class="ln-mut" d="M386,108 L386,116"/>
  <rect class="box" x="360" y="116" width="326" height="32" rx="5"/>
  <text class="mut sm b" x="370" y="137" text-anchor="start">[3]</text>
  <text class="ink2 sm" x="402" y="137" text-anchor="start">яч. 3:</text>
  <text class="ink sm" x="446" y="137" text-anchor="start">df = df[доставка]</text>
  <text class="ink2 sm" x="678" y="137" text-anchor="end">df: 380 строк</text>
  <path class="ln-mut" d="M386,148 L386,156"/>
  <rect class="box" x="360" y="156" width="326" height="32" rx="5"/>
  <text class="mut sm b" x="370" y="177" text-anchor="start">[4]</text>
  <text class="ink2 sm" x="402" y="177" text-anchor="start">яч. 4:</text>
  <text class="ink sm" x="446" y="177" text-anchor="start">df["amount"].sum()</text>
  <text class="ok sm b" x="678" y="177" text-anchor="end">128 198 ₽</text>
  <path class="ln-mut" d="M386,188 L386,196"/>
  <rect class="box" x="360" y="196" width="326" height="32" rx="5"/>
  <text class="mut sm b" x="370" y="217" text-anchor="start">[5]</text>
  <text class="ink2 sm" x="402" y="217" text-anchor="start">яч. 5:</text>
  <text class="ink sm" x="446" y="217" text-anchor="start">groupby("shop")</text>
  <text class="err sm b" x="678" y="217" text-anchor="end">KeyError</text>
  <text class="err sm" x="177" y="250" text-anchor="middle">сумма посчитана до фильтра: вся сеть</text>
  <text class="ok sm" x="523" y="250" text-anchor="middle">фильтр раньше суммы: только доставка</text>
  <text class="ink2 sm" x="350" y="278" text-anchor="middle">код в ячейках одинаковый — другой только порядок; в отчёт ушло число в 5.5 раза больше</text>
  <text class="mut sm" x="350" y="296" text-anchor="middle">(df: число строк в ядре после ячейки; KeyError — столбца shop нет, есть shop_id)</text>
</svg>
