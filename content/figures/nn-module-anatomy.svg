<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-module-anatomy">
  <title id="t-nn-module-anatomy">Класс ChurnNet: __init__ регистрирует слои, forward задаёт порядок вычислений</title>
  <defs><marker id="ah-nn-module-anatomy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20" y="20" width="270" height="170" rx="8"/>
  <text class="ink sm b" x="32" y="42" text-anchor="start">class ChurnNet(nn.Module):</text>
  <text class="acc sm b" x="44" y="66" text-anchor="start">__init__ — что есть у сети</text>
  <text class="ink2 sm" x="56" y="88" text-anchor="start">super().__init__()</text>
  <text class="ink2 sm" x="56" y="108" text-anchor="start">self.layer1 = nn.Linear(8, 16)</text>
  <text class="ink2 sm" x="56" y="128" text-anchor="start">self.drop = nn.Dropout(0.2)</text>
  <text class="ink2 sm" x="56" y="148" text-anchor="start">self.out = nn.Linear(16, 1)</text>
  <text class="acc sm b" x="44" y="178" text-anchor="start">forward — как из входа получить ответ</text>
  <path class="ln-acc" d="M292,110 L384,110" marker-end="url(#ah-nn-module-anatomy)"/>
  <text class="acc sm" x="338" y="100" text-anchor="middle">регистрация</text>
  <rect class="box-acc" x="386" y="20" width="294" height="170" rx="8"/>
  <text class="ink sm b" x="533" y="42" text-anchor="middle">model.parameters()</text>
  <text class="ink2 sm" x="400" y="68" text-anchor="start">layer1.weight</text>
  <text class="mut sm" x="560" y="68" text-anchor="start">(16, 8)</text>
  <text class="ink sm" x="668" y="68" text-anchor="end">128</text>
  <text class="ink2 sm" x="400" y="92" text-anchor="start">layer1.bias</text>
  <text class="mut sm" x="560" y="92" text-anchor="start">(16,)</text>
  <text class="ink sm" x="668" y="92" text-anchor="end">16</text>
  <text class="ink2 sm" x="400" y="116" text-anchor="start">out.weight</text>
  <text class="mut sm" x="560" y="116" text-anchor="start">(1, 16)</text>
  <text class="ink sm" x="668" y="116" text-anchor="end">16</text>
  <text class="ink2 sm" x="400" y="140" text-anchor="start">out.bias</text>
  <text class="mut sm" x="560" y="140" text-anchor="start">(1,)</text>
  <text class="ink sm" x="668" y="140" text-anchor="end">1</text>
  <path class="ln-mut" d="M400,160 L668,160"/>
  <text class="ink sm b" x="400" y="178" text-anchor="start">итого → оптимизатор</text>
  <text class="acc b" x="668" y="178" text-anchor="end">161</text>
  <text class="ink sm b" x="20" y="222" text-anchor="start">model(x) вызывает forward:</text>
  <rect class="box" x="20" y="234" width="96" height="44" rx="6"/>
  <text class="ink sm b" x="68" y="252" text-anchor="middle">x</text>
  <text class="mut sm" x="68" y="269" text-anchor="middle">(n, 8)</text>
  <path class="ln" d="M116,256 L133,256" marker-end="url(#ah-nn-module-anatomy)"/>
  <rect class="box" x="133" y="234" width="96" height="44" rx="6"/>
  <text class="ink sm b" x="181" y="252" text-anchor="middle">layer1</text>
  <text class="mut sm" x="181" y="269" text-anchor="middle">(n, 16)</text>
  <path class="ln" d="M229,256 L246,256" marker-end="url(#ah-nn-module-anatomy)"/>
  <rect class="box" x="246" y="234" width="96" height="44" rx="6"/>
  <text class="ink sm b" x="294" y="252" text-anchor="middle">relu</text>
  <text class="mut sm" x="294" y="269" text-anchor="middle">(n, 16)</text>
  <path class="ln" d="M342,256 L359,256" marker-end="url(#ah-nn-module-anatomy)"/>
  <rect class="box" x="359" y="234" width="96" height="44" rx="6"/>
  <text class="ink sm b" x="407" y="252" text-anchor="middle">drop</text>
  <text class="mut sm" x="407" y="269" text-anchor="middle">(n, 16)</text>
  <path class="ln" d="M455,256 L472,256" marker-end="url(#ah-nn-module-anatomy)"/>
  <rect class="box" x="472" y="234" width="96" height="44" rx="6"/>
  <text class="ink sm b" x="520" y="252" text-anchor="middle">out</text>
  <text class="mut sm" x="520" y="269" text-anchor="middle">(n, 1)</text>
  <path class="ln" d="M568,256 L585,256" marker-end="url(#ah-nn-module-anatomy)"/>
  <rect class="box-ok" x="585" y="234" width="96" height="44" rx="6"/>
  <text class="ink sm b" x="633" y="252" text-anchor="middle">squeeze(1)</text>
  <text class="mut sm" x="633" y="269" text-anchor="middle">логиты (n,)</text>
  <rect class="box-warn" x="20" y="296" width="660" height="44" rx="8"/>
  <text class="ink sm" x="350" y="314" text-anchor="middle">веса nn.Linear хранятся как выходы × входы: layer1.weight — (16, 8), слой считает x @ W.T + b</text>
  <text class="ink sm" x="350" y="332" text-anchor="middle">слои в обычном списке Python не регистрируются: parameters() их не увидит — нужен nn.ModuleList</text>
</svg>
