<svg viewBox="0 0 700 242" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-top30-toy">
  <title id="t-top30-toy">Метрика директора: доля договоров в верхних 30 % списка</title>
  <defs><marker id="ah-top30-toy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="20" y="22" text-anchor="start">десять заявок, отсортированы по оценке модели; красная рамка — договор</text>
  <rect class="box-acc" x="16" y="32" width="194" height="56" rx="6"/>
  <rect class="box-err" x="20" y="40" width="58" height="40" rx="4"/>
  <text class="ink sm b" x="49" y="65" text-anchor="middle">0.81</text>
  <rect class="box" x="84" y="40" width="58" height="40" rx="4"/>
  <text class="ink sm b" x="113" y="65" text-anchor="middle">0.64</text>
  <rect class="box-err" x="148" y="40" width="58" height="40" rx="4"/>
  <text class="ink sm b" x="177" y="65" text-anchor="middle">0.55</text>
  <rect class="box" x="212" y="40" width="58" height="40" rx="4"/>
  <text class="ink sm b" x="241" y="65" text-anchor="middle">0.40</text>
  <rect class="box-err" x="276" y="40" width="58" height="40" rx="4"/>
  <text class="ink sm b" x="305" y="65" text-anchor="middle">0.33</text>
  <rect class="box" x="340" y="40" width="58" height="40" rx="4"/>
  <text class="ink sm b" x="369" y="65" text-anchor="middle">0.20</text>
  <rect class="box" x="404" y="40" width="58" height="40" rx="4"/>
  <text class="ink sm b" x="433" y="65" text-anchor="middle">0.12</text>
  <rect class="box" x="468" y="40" width="58" height="40" rx="4"/>
  <text class="ink sm b" x="497" y="65" text-anchor="middle">0.10</text>
  <rect class="box" x="532" y="40" width="58" height="40" rx="4"/>
  <text class="ink sm b" x="561" y="65" text-anchor="middle">0.08</text>
  <rect class="box" x="596" y="40" width="58" height="40" rx="4"/>
  <text class="ink sm b" x="625" y="65" text-anchor="middle">0.05</text>
  <text class="acc sm b" x="112.0" y="122" text-anchor="middle">берут в работу: 30 % = 3 заявки</text>
  <text class="mut sm" x="656" y="122" text-anchor="end">типовое письмо</text>
  <rect class="box-acc" x="20" y="140" width="210" height="46" rx="6"/>
  <text class="ink2 sm" x="125.0" y="159.0" text-anchor="middle">модель</text>
  <text class="ink sm b" x="125.0" y="176.0" text-anchor="middle">2 из 3 = 0.67</text>
  <rect class="box" x="245" y="140" width="210" height="46" rx="6"/>
  <text class="ink2 sm" x="350.0" y="159.0" text-anchor="middle">случайные 3 заявки</text>
  <text class="ink sm b" x="350.0" y="176.0" text-anchor="middle">в среднем 0.9 из 3 = 0.30</text>
  <rect class="box-ok" x="470" y="140" width="210" height="46" rx="6"/>
  <text class="ink2 sm" x="575.0" y="159.0" text-anchor="middle">идеальная модель</text>
  <text class="ink sm b" x="575.0" y="176.0" text-anchor="middle">3 из 3 = 1.00</text>
  <text class="ink2 sm" x="350" y="212" text-anchor="middle">порога 0.5 нет: заявка с 0.40 не в работе, потому что менеджеров хватает только на три</text>
  <text class="mut sm" x="350" y="230" text-anchor="middle">это полнота при пороге, заданном объёмом работы</text>
</svg>
