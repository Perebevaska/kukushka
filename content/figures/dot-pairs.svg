<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-dot-pairs">
  <title id="t-dot-pairs">Скалярное произведение: пары на одинаковых местах перемножаются и складываются</title>
  <defs><marker id="ah-dot-pairs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="150" y="26" text-anchor="middle">qty (чашек)</text>
  <text class="mut sm b" x="270" y="26" text-anchor="middle">price (₽)</text>
  <text class="mut sm b" x="420" y="26" text-anchor="middle">qty * price</text>
  <text class="ink2 sm" x="70" y="61" text-anchor="end">капучино</text>
  <rect class="box" x="110" y="40" width="80" height="32" rx="6"/>
  <text class="ink sm" x="150.0" y="60.5" text-anchor="middle">120</text>
  <text class="ink b" x="210" y="61" text-anchor="middle">×</text>
  <rect class="box-warn" x="230" y="40" width="80" height="32" rx="6"/>
  <text class="ink sm" x="270.0" y="60.5" text-anchor="middle">190</text>
  <text class="ink b" x="330" y="61" text-anchor="middle">=</text>
  <rect class="box-acc" x="360" y="40" width="120" height="32" rx="6"/>
  <text class="ink sm b" x="420.0" y="60.5" text-anchor="middle">22 800</text>
  <text class="ink2 sm" x="70" y="105" text-anchor="end">латте</text>
  <rect class="box" x="110" y="84" width="80" height="32" rx="6"/>
  <text class="ink sm" x="150.0" y="104.5" text-anchor="middle">80</text>
  <text class="ink b" x="210" y="105" text-anchor="middle">×</text>
  <rect class="box-warn" x="230" y="84" width="80" height="32" rx="6"/>
  <text class="ink sm" x="270.0" y="104.5" text-anchor="middle">210</text>
  <text class="ink b" x="330" y="105" text-anchor="middle">=</text>
  <rect class="box-acc" x="360" y="84" width="120" height="32" rx="6"/>
  <text class="ink sm b" x="420.0" y="104.5" text-anchor="middle">16 800</text>
  <text class="ink2 sm" x="70" y="149" text-anchor="end">раф</text>
  <rect class="box" x="110" y="128" width="80" height="32" rx="6"/>
  <text class="ink sm" x="150.0" y="148.5" text-anchor="middle">30</text>
  <text class="ink b" x="210" y="149" text-anchor="middle">×</text>
  <rect class="box-warn" x="230" y="128" width="80" height="32" rx="6"/>
  <text class="ink sm" x="270.0" y="148.5" text-anchor="middle">260</text>
  <text class="ink b" x="330" y="149" text-anchor="middle">=</text>
  <rect class="box-acc" x="360" y="128" width="120" height="32" rx="6"/>
  <text class="ink sm b" x="420.0" y="148.5" text-anchor="middle">7 800</text>
  <path class="ln-acc" d="M488,44 h14 v124 h-14"/>
  <path class="ln-acc" d="M502,106 L540,106" marker-end="url(#ah-dot-pairs)"/>
  <rect class="box-ok" x="545" y="84" width="140" height="44" rx="6"/>
  <text class="ink b" x="615.0" y="110.5" text-anchor="middle">сумма = 47 400 ₽</text>
  <text class="ok sm b" x="615" y="146" text-anchor="middle">это и есть qty @ price</text>
  <text class="ink2 sm" x="350" y="194" text-anchor="middle">шаг 1 — перемножить пары (как qty * price), шаг 2 — сложить всё в одно число</text>
  <text class="mut sm" x="350" y="214" text-anchor="middle">прогноз модели устроен так же: признаки @ веса + свободный член</text>
  <text class="mut sm" x="350" y="234" text-anchor="middle">поменяете местами только одну сторону — пары станут другими, и сумма тоже</text>
</svg>
