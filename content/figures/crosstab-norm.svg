<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-crosstab-norm">
  <title id="t-crosstab-norm">crosstab: счётчики и две нормировки — по строкам и по столбцам</title>
  <defs><marker id="ah-crosstab-norm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="acc sm b" x="110" y="24" text-anchor="middle">pd.crosstab(courier, weather)</text>
  <text class="mut sm" x="110" y="42" text-anchor="middle">сколько доставок</text>
  <rect class="box" x="10" y="56" width="200" height="24" rx="3"/>
  <text class="ink2 sm b" x="40.0" y="72.0" text-anchor="middle"></text>
  <text class="ink2 sm b" x="105.0" y="72.0" text-anchor="middle">ясно</text>
  <text class="ink2 sm b" x="175.0" y="72.0" text-anchor="middle">снег</text>
  <rect class="box" x="10" y="82" width="200" height="24" rx="3"/>
  <text class="ink sm" x="40.0" y="98.0" text-anchor="middle">авто</text>
  <text class="ink sm" x="105.0" y="98.0" text-anchor="middle">20</text>
  <text class="ink sm" x="175.0" y="98.0" text-anchor="middle">20</text>
  <rect class="box" x="10" y="108" width="200" height="24" rx="3"/>
  <text class="ink sm" x="40.0" y="124.0" text-anchor="middle">вело</text>
  <text class="ink sm" x="105.0" y="124.0" text-anchor="middle">30</text>
  <text class="ink sm" x="175.0" y="124.0" text-anchor="middle">10</text>
  <text class="acc sm b" x="350" y="24" text-anchor="middle">normalize="index"</text>
  <text class="mut sm" x="350" y="42" text-anchor="middle">доли внутри строки</text>
  <rect class="box" x="250" y="56" width="200" height="24" rx="3"/>
  <text class="ink2 sm b" x="280.0" y="72.0" text-anchor="middle"></text>
  <text class="ink2 sm b" x="345.0" y="72.0" text-anchor="middle">ясно</text>
  <text class="ink2 sm b" x="415.0" y="72.0" text-anchor="middle">снег</text>
  <rect class="box" x="250" y="82" width="200" height="24" rx="3"/>
  <text class="ink sm" x="280.0" y="98.0" text-anchor="middle">авто</text>
  <text class="ink sm" x="345.0" y="98.0" text-anchor="middle">0.50</text>
  <text class="ink sm" x="415.0" y="98.0" text-anchor="middle">0.50</text>
  <rect class="box" x="250" y="108" width="200" height="24" rx="3"/>
  <text class="ink sm" x="280.0" y="124.0" text-anchor="middle">вело</text>
  <text class="ink sm" x="345.0" y="124.0" text-anchor="middle">0.75</text>
  <text class="ink sm" x="415.0" y="124.0" text-anchor="middle">0.25</text>
  <text class="acc sm b" x="590" y="24" text-anchor="middle">normalize="columns"</text>
  <text class="mut sm" x="590" y="42" text-anchor="middle">доли внутри столбца</text>
  <rect class="box" x="490" y="56" width="200" height="24" rx="3"/>
  <text class="ink2 sm b" x="520.0" y="72.0" text-anchor="middle"></text>
  <text class="ink2 sm b" x="585.0" y="72.0" text-anchor="middle">ясно</text>
  <text class="ink2 sm b" x="655.0" y="72.0" text-anchor="middle">снег</text>
  <rect class="box" x="490" y="82" width="200" height="24" rx="3"/>
  <text class="ink sm" x="520.0" y="98.0" text-anchor="middle">авто</text>
  <text class="ink sm" x="585.0" y="98.0" text-anchor="middle">0.40</text>
  <text class="ink sm" x="655.0" y="98.0" text-anchor="middle">0.67</text>
  <rect class="box" x="490" y="108" width="200" height="24" rx="3"/>
  <text class="ink sm" x="520.0" y="124.0" text-anchor="middle">вело</text>
  <text class="ink sm" x="585.0" y="124.0" text-anchor="middle">0.60</text>
  <text class="ink sm" x="655.0" y="124.0" text-anchor="middle">0.33</text>
  <rect class="ln-acc" x="248" y="80" width="204" height="26" rx="3"/>
  <text class="acc sm b" x="350" y="158" text-anchor="middle">строка в сумме = 1</text>
  <rect class="ln-acc" x="618" y="54" width="74" height="80" rx="3"/>
  <text class="acc sm b" x="590" y="158" text-anchor="middle">столбец в сумме = 1</text>
  <text class="ink2 sm" x="350" y="196" text-anchor="middle">«index»: куда ездит вело? 75 % в ясно, 25 % в снег</text>
  <text class="ink2 sm" x="350" y="216" text-anchor="middle">«columns»: кто возит в снег? вело 33 %, авто 67 %</text>
  <text class="mut sm" x="350" y="248" text-anchor="middle">Условные 80 доставок. Одна таблица счётчиков — два разных вопроса</text>
</svg>
