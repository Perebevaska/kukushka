<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-up-down">
  <title id="t-up-down">Upsampling и downsampling обучающей части</title>
  <defs><marker id="ah-up-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="110" y="50" text-anchor="end">как есть</text>
  <rect class="box" x="120.0" y="30" width="233.0" height="30" rx="3"/>
  <text class="ink sm" x="237.5" y="50" text-anchor="middle">остались 1 399</text>
  <rect class="box-err" x="355.0" y="30" width="65.4" height="30" rx="3"/>
  <text class="ink sm" x="388.7" y="50" text-anchor="middle">ушли 401</text>
  <text class="mut sm" x="428.4" y="50" text-anchor="start">1 800 строк</text>
  <text class="ink sm b" x="110" y="106" text-anchor="end">upsampling</text>
  <rect class="box" x="120.0" y="86" width="233.0" height="30" rx="3"/>
  <text class="ink sm" x="237.5" y="106" text-anchor="middle">остались 1 399</text>
  <rect class="box-err" x="355.0" y="86" width="65.4" height="30" rx="3"/>
  <text class="ink sm" x="388.7" y="106" text-anchor="middle">401</text>
  <rect class="box-warn" x="422.4" y="86" width="165.6" height="30" rx="3"/>
  <text class="ink sm" x="506.2" y="106" text-anchor="middle">+ 998 копий ушедших</text>
  <text class="mut sm" x="596.0" y="106" text-anchor="start">2 798 строк</text>
  <text class="ink sm b" x="110" y="162" text-anchor="end">downsampling</text>
  <rect class="box" x="120.0" y="142" width="65.4" height="30" rx="3"/>
  <text class="ink sm" x="153.7" y="162" text-anchor="middle">401 из 1 399</text>
  <rect class="box-err" x="187.4" y="142" width="65.4" height="30" rx="3"/>
  <text class="ink sm" x="221.0" y="162" text-anchor="middle">ушли 401</text>
  <text class="mut sm" x="260.7" y="162" text-anchor="start">802 строк</text>
  <text class="mut sm" x="350" y="190" text-anchor="middle">upsampling повторяет ушедших (жёлтые — копии, взятые с возвращением),</text>
  <text class="mut sm" x="350" y="207" text-anchor="middle">downsampling случайно оставляет столько оставшихся, сколько ушедших</text>
  <text class="ink2 sm b" x="350" y="228" text-anchor="middle">тест не трогаем ни в одном из способов</text>
</svg>
