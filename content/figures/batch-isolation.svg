<svg viewBox="0 0 700 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-batch-isolation">
  <title id="t-batch-isolation">Пакет запросов: каждого гостя обрабатывают отдельно, одна плохая строка не роняет весь пакет</title>
  <defs><marker id="ah-batch-isolation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="20" width="180" height="40" rx="4"/>
  <text class="ink sm" x="104" y="45" text-anchor="middle">{"visits_90d": 0}</text>
  <path class="ln" d="M196,40 L296,40" marker-end="url(#ah-batch-isolation)"/>
  <text class="mut sm" x="246" y="33" text-anchor="middle">predict_one</text>
  <rect class="box-ok" x="300" y="20" width="60" height="40" rx="4"/>
  <text class="ok b" x="330" y="45" text-anchor="middle">200</text>
  <rect class="box" x="366" y="20" width="220" height="40" rx="4"/>
  <text class="ink2 sm" x="476" y="45" text-anchor="middle">proba 1.0</text>
  <rect class="box" x="14" y="72" width="180" height="40" rx="4"/>
  <text class="ink sm" x="104" y="97" text-anchor="middle">{"city": "Уфа"}</text>
  <path class="ln" d="M196,92 L296,92" marker-end="url(#ah-batch-isolation)"/>
  <text class="mut sm" x="246" y="85" text-anchor="middle">predict_one</text>
  <rect class="box-err" x="300" y="72" width="60" height="40" rx="4"/>
  <text class="err b" x="330" y="97" text-anchor="middle">422</text>
  <rect class="box" x="366" y="72" width="220" height="40" rx="4"/>
  <text class="ink2 sm" x="476" y="97" text-anchor="middle">visits_90d: обязательное поле</text>
  <rect class="box" x="14" y="124" width="180" height="40" rx="4"/>
  <text class="ink sm" x="104" y="149" text-anchor="middle">{"visits_90d": 3}</text>
  <path class="ln" d="M196,144 L296,144" marker-end="url(#ah-batch-isolation)"/>
  <text class="mut sm" x="246" y="137" text-anchor="middle">predict_one</text>
  <rect class="box-ok" x="300" y="124" width="60" height="40" rx="4"/>
  <text class="ok b" x="330" y="149" text-anchor="middle">200</text>
  <rect class="box" x="366" y="124" width="220" height="40" rx="4"/>
  <text class="ink2 sm" x="476" y="149" text-anchor="middle">proba 0.25</text>
  <text class="ink2 sm" x="640" y="70" text-anchor="middle">ответ на</text>
  <text class="ink2 sm" x="640" y="88" text-anchor="middle">каждого,</text>
  <text class="ink2 sm" x="640" y="106" text-anchor="middle">в том же</text>
  <text class="ink2 sm" x="640" y="124" text-anchor="middle">порядке</text>
  <text class="mut sm" x="350" y="196" text-anchor="middle">заглушка урока: proba = 1 / (1 + visits_90d); ошибки — внутри ответов, а не исключениями</text>
</svg>
