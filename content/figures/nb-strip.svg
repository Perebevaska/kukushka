<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nb-strip">
  <title id="t-nb-strip">Почему diff блокнота шумит и что оставляет nbstripout</title>
  <defs><marker id="ah-nb-strip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="14" y="24" text-anchor="start">diff черновика и перезапуска: 14 изменённых строк JSON</text>
  <rect class="box-acc" x="14" y="34" width="96.0" height="34" rx="0"/>
  <text class="ink sm b" x="62.0" y="56" text-anchor="middle">код: 2</text>
  <rect class="box-warn" x="110.0" y="34" width="384.0" height="34" rx="0"/>
  <text class="ink sm b" x="302.0" y="56" text-anchor="middle">номера запусков: 8</text>
  <rect class="box-err" x="494.0" y="34" width="192.0" height="34" rx="0"/>
  <text class="ink sm b" x="590.0" y="56" text-anchor="middle">выводы: 4</text>
  <text class="ink2 sm" x="14" y="90" text-anchor="start">по существу правка одна — путь к файлу (строка «было» и строка «стало»); остальные 12 — следы перезапуска</text>
  <rect class="box" x="14" y="116" width="200" height="110" rx="8"/>
  <text class="ink sm b" x="114" y="138" text-anchor="middle">report.ipynb на диске</text>
  <text class="ink2 sm" x="34" y="162" text-anchor="start">source — код</text>
  <text class="mut sm" x="34" y="184" text-anchor="start">execution_count</text>
  <text class="mut sm" x="34" y="206" text-anchor="start">outputs — выводы</text>
  <path class="ln" d="M216,170 L262,170" marker-end="url(#ah-nb-strip)"/>
  <rect class="box-acc" x="266" y="136" width="170" height="68" rx="8"/>
  <text class="ink sm b" x="351" y="160" text-anchor="middle">git add</text>
  <text class="acc sm b" x="351" y="180" text-anchor="middle">фильтр nbstripout</text>
  <path class="ln" d="M438,170 L484,170" marker-end="url(#ah-nb-strip)"/>
  <rect class="box-ok" x="488" y="116" width="198" height="110" rx="8"/>
  <text class="ink sm b" x="587" y="138" text-anchor="middle">что уходит в коммит</text>
  <text class="ink2 sm" x="508" y="162" text-anchor="start">source — код</text>
  <text class="mut sm" x="508" y="184" text-anchor="start">execution_count: null</text>
  <text class="mut sm" x="508" y="206" text-anchor="start">outputs: []</text>
  <text class="mut sm" x="350" y="252" text-anchor="middle">файл на диске не меняется — в нём по-прежнему все выводы и графики</text>
</svg>
