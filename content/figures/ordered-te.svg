<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ordered-te">
  <title id="t-ordered-te">CatBoost кодирует категорию средним ответом только по предыдущим строкам</title>
  <defs><marker id="ah-ordered-te" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="30" y="40" width="370" height="32" rx="3"/>
  <text class="ink2 sm b" x="60.0" y="60.5" text-anchor="middle">день</text>
  <text class="ink2 sm b" x="130.0" y="60.5" text-anchor="middle">кофейня</text>
  <text class="ink2 sm b" x="210.0" y="60.5" text-anchor="middle">выручка</text>
  <text class="ink2 sm b" x="325.0" y="60.5" text-anchor="middle">число для модели</text>
  <rect class="box-acc" x="30" y="74" width="370" height="32" rx="3"/>
  <text class="ink sm" x="60.0" y="94.5" text-anchor="middle">1</text>
  <text class="acc sm b" x="130.0" y="94.5" text-anchor="middle">A</text>
  <text class="ink sm" x="210.0" y="94.5" text-anchor="middle">60</text>
  <text class="ok sm b" x="325.0" y="94.5" text-anchor="middle">50 (заглушка)</text>
  <rect class="box-warn" x="30" y="108" width="370" height="32" rx="3"/>
  <text class="ink sm" x="60.0" y="128.5" text-anchor="middle">2</text>
  <text class="warn sm b" x="130.0" y="128.5" text-anchor="middle">B</text>
  <text class="ink sm" x="210.0" y="128.5" text-anchor="middle">40</text>
  <text class="ok sm b" x="325.0" y="128.5" text-anchor="middle">50 (заглушка)</text>
  <rect class="box-acc" x="30" y="142" width="370" height="32" rx="3"/>
  <text class="ink sm" x="60.0" y="162.5" text-anchor="middle">3</text>
  <text class="acc sm b" x="130.0" y="162.5" text-anchor="middle">A</text>
  <text class="ink sm" x="210.0" y="162.5" text-anchor="middle">70</text>
  <text class="ok sm b" x="325.0" y="162.5" text-anchor="middle">60</text>
  <rect class="box-acc" x="30" y="176" width="370" height="32" rx="3"/>
  <text class="ink sm" x="60.0" y="196.5" text-anchor="middle">4</text>
  <text class="acc sm b" x="130.0" y="196.5" text-anchor="middle">A</text>
  <text class="ink sm" x="210.0" y="196.5" text-anchor="middle">50</text>
  <text class="ok sm b" x="325.0" y="196.5" text-anchor="middle">65</text>
  <rect class="box-warn" x="30" y="210" width="370" height="32" rx="3"/>
  <text class="ink sm" x="60.0" y="230.5" text-anchor="middle">5</text>
  <text class="warn sm b" x="130.0" y="230.5" text-anchor="middle">B</text>
  <text class="ink sm" x="210.0" y="230.5" text-anchor="middle">44</text>
  <text class="ok sm b" x="325.0" y="230.5" text-anchor="middle">40</text>
  <path class="ln-acc" d="M408,90 C448,90 448,192 410,192" marker-end="url(#ah-ordered-te)"/>
  <path class="ln-acc" d="M408,158 C468,158 468,192 410,192" marker-end="url(#ah-ordered-te)"/>
  <text class="acc sm b" x="466" y="116" text-anchor="start">день 4 видит</text>
  <text class="acc sm b" x="466" y="132" text-anchor="start">только дни 1 и 3:</text>
  <text class="acc sm" x="466" y="148" text-anchor="start">(60 + 70) / 2 = 65</text>
  <text class="ink2 sm" x="466" y="196" text-anchor="start">своя выручка дня 4 (50) в расчёт</text>
  <text class="ink2 sm" x="466" y="212" text-anchor="start">не входит — нет подсказки ответа</text>
  <text class="ink2 sm" x="350" y="262" text-anchor="middle">если брать среднее по всем строкам кофейни, в «число для модели» попадёт и сам ответ строки —</text>
  <text class="mut sm" x="350" y="282" text-anchor="middle">на редкой категории это прямая утечка: с одной строкой «среднее» просто равно ответу</text>
</svg>
