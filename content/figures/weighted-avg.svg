<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-weighted-avg">
  <title id="t-weighted-avg">Средняя цена: среднее трёх цен и вся выручка на все чашки</title>
  <defs><marker id="ah-weighted-avg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="50" y="30" text-anchor="start">среднее трёх цен: каждая кофейня весит 1/3  →  (205 + 198 + 214) / 3 = 205.67 ₽</text>
  <rect class="box-acc" x="50" y="42" width="197.0" height="40" rx="3"/>
  <text class="ink sm b" x="150.0" y="60" text-anchor="middle">Пермь</text>
  <text class="ink sm" x="150.0" y="76" text-anchor="middle">205 ₽</text>
  <rect class="box-ok" x="250.0" y="42" width="197.0" height="40" rx="3"/>
  <text class="ink sm b" x="350.0" y="60" text-anchor="middle">Казань</text>
  <text class="ink sm" x="350.0" y="76" text-anchor="middle">198 ₽</text>
  <rect class="box-warn" x="450.0" y="42" width="197.0" height="40" rx="3"/>
  <text class="ink sm b" x="550.0" y="60" text-anchor="middle">Тюмень</text>
  <text class="ink sm" x="550.0" y="76" text-anchor="middle">214 ₽</text>
  <text class="ink sm b" x="50" y="122" text-anchor="start">выручка / чашки: вес = доля чашек  →  254 542 / 1 247 = 204.12 ₽</text>
  <rect class="box-acc" x="50" y="134" width="195.23576583801122" height="40" rx="3"/>
  <text class="ink sm b" x="149.1178829190056" y="152" text-anchor="middle">Пермь: 412 чашек</text>
  <text class="ink sm" x="149.1178829190056" y="168" text-anchor="middle">205 ₽ · 33%</text>
  <rect class="box-ok" x="248.23576583801122" y="134" width="255.86126704089816" height="40" rx="3"/>
  <text class="ink sm b" x="377.6663993584603" y="152" text-anchor="middle">Казань: 538 чашек</text>
  <text class="ink sm" x="377.6663993584603" y="168" text-anchor="middle">198 ₽ · 43%</text>
  <rect class="box-warn" x="507.0970328789094" y="134" width="139.90296712109063" height="40" rx="3"/>
  <text class="ink sm b" x="578.5485164394547" y="152" text-anchor="middle">Тюмень: 297 чашек</text>
  <text class="ink sm" x="578.5485164394547" y="168" text-anchor="middle">214 ₽ · 24%</text>
  <text class="ink2 sm" x="350" y="206" text-anchor="middle">Казань с самой низкой ценой продала больше всех — честная средняя ниже: 204.12 &lt; 205.67.</text>
  <text class="mut sm" x="350" y="226" text-anchor="middle">Ширина полосы — вес кофейни в среднем.</text>
</svg>
