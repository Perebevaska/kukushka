<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ab-steps">
  <title id="t-ab-steps">A/B-тест по шагам: дизайн до запуска, проверки и решение после</title>
  <defs><marker id="ah-ab-steps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="20" y="20" text-anchor="start">до запуска</text>
  <rect class="box-acc" x="20" y="30" width="156" height="74" rx="6"/>
  <text class="ink sm b" x="98.0" y="54.5" text-anchor="middle">1. Дизайн</text>
  <text class="ink2 sm" x="98.0" y="71.5" text-anchor="middle">гипотеза, метрика,</text>
  <text class="ink2 sm" x="98.0" y="88.5" text-anchor="middle">MDE 9 → 11 %, n ≈ 3 524</text>
  <path class="ln" d="M176,67 L188,67" marker-end="url(#ah-ab-steps)"/>
  <rect class="box" x="188" y="30" width="156" height="74" rx="6"/>
  <text class="ink sm b" x="266.0" y="54.5" text-anchor="middle">2. Деление</text>
  <text class="ink2 sm" x="266.0" y="71.5" text-anchor="middle">случайно, по гостю:</text>
  <text class="ink2 sm" x="266.0" y="88.5" text-anchor="middle">6 000 гостей пополам</text>
  <path class="ln" d="M344,67 L356,67" marker-end="url(#ah-ab-steps)"/>
  <rect class="box" x="356" y="30" width="156" height="74" rx="6"/>
  <text class="ink sm b" x="434.0" y="54.5" text-anchor="middle">3. Тест</text>
  <text class="ink2 sm" x="434.0" y="71.5" text-anchor="middle">фиксированный срок —</text>
  <text class="ink2 sm" x="434.0" y="88.5" text-anchor="middle">2 недели, без остановок</text>
  <path class="ln" d="M512,67 L524,67" marker-end="url(#ah-ab-steps)"/>
  <rect class="box" x="524" y="30" width="156" height="74" rx="6"/>
  <text class="ink sm b" x="602.0" y="54.5" text-anchor="middle">4. SRM</text>
  <text class="ink2 sm" x="602.0" y="71.5" text-anchor="middle">2 976 против 3 024</text>
  <text class="ink2 sm" x="602.0" y="88.5" text-anchor="middle">p = 0.54 — разбиение цело</text>
  <text class="mut sm b" x="20" y="140" text-anchor="start">после теста</text>
  <rect class="box" x="20" y="150" width="210" height="74" rx="6"/>
  <text class="ink sm b" x="125.0" y="174.5" text-anchor="middle">5. Главная метрика</text>
  <text class="ink2 sm" x="125.0" y="191.5" text-anchor="middle">конверсия +2.04 п.п.</text>
  <text class="ink2 sm" x="125.0" y="208.5" text-anchor="middle">p = 0.009, ДИ — размер</text>
  <path class="ln" d="M230,187 L246,187" marker-end="url(#ah-ab-steps)"/>
  <rect class="box" x="246" y="150" width="210" height="74" rx="6"/>
  <text class="ink sm b" x="351.0" y="174.5" text-anchor="middle">6. Защитные</text>
  <text class="ink2 sm" x="351.0" y="191.5" text-anchor="middle">выручка на гостя:</text>
  <text class="ink2 sm" x="351.0" y="208.5" text-anchor="middle">36.8 → 45.5 ₽</text>
  <path class="ln" d="M456,187 L472,187" marker-end="url(#ah-ab-steps)"/>
  <rect class="box-ok" x="472" y="150" width="210" height="74" rx="6"/>
  <text class="ink sm b" x="577.0" y="174.5" text-anchor="middle">7. Решение</text>
  <text class="ink2 sm" x="577.0" y="191.5" text-anchor="middle">значимо + ДИ стоит того</text>
  <text class="ink2 sm" x="577.0" y="208.5" text-anchor="middle">+ ничего не сломали</text>
  <path class="ln" d="M640,104 L640,124 L115,124 L115,148" marker-end="url(#ah-ab-steps)"/>
  <text class="mut sm" x="350" y="252" text-anchor="middle">числа — из пуш-теста урока; сломался SRM — дальше не идём, сначала ищем причину</text>
</svg>
