<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nb-toy">
  <title id="t-nb-toy">Наивный Байес: частоты слов в каждом классе, сглаживание +1, произведение по словам отзыва</title>
  <defs><marker id="ah-nb-toy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm" x="14" y="30" text-anchor="start">обучение: класс 0 — «вкусно спасибо», «вкусно уютно»; класс 1 — «грубо долго», «долго холодно»</text>
  <rect class="box" x="150" y="44" width="78" height="24" rx="3"/>
  <text class="ink2 sm b" x="189.0" y="61" text-anchor="middle">вкусно</text>
  <rect class="box" x="232" y="44" width="78" height="24" rx="3"/>
  <text class="ink2 sm b" x="271.0" y="61" text-anchor="middle">грубо</text>
  <rect class="box-warn" x="314" y="44" width="78" height="24" rx="3"/>
  <text class="ink2 sm b" x="353.0" y="61" text-anchor="middle">долго</text>
  <rect class="box" x="396" y="44" width="78" height="24" rx="3"/>
  <text class="ink2 sm b" x="435.0" y="61" text-anchor="middle">спасибо</text>
  <rect class="box" x="478" y="44" width="78" height="24" rx="3"/>
  <text class="ink2 sm b" x="517.0" y="61" text-anchor="middle">уютно</text>
  <rect class="box-warn" x="560" y="44" width="78" height="24" rx="3"/>
  <text class="ink2 sm b" x="599.0" y="61" text-anchor="middle">холодно</text>
  <text class="ink sm b" x="140" y="90" text-anchor="end">класс 0: счёт</text>
  <rect class="box" x="150" y="72" width="78" height="26" rx="3"/>
  <text class="ink sm" x="189.0" y="90" text-anchor="middle">2</text>
  <rect class="box" x="232" y="72" width="78" height="26" rx="3"/>
  <text class="ink sm" x="271.0" y="90" text-anchor="middle">0</text>
  <rect class="box" x="314" y="72" width="78" height="26" rx="3"/>
  <text class="ink sm" x="353.0" y="90" text-anchor="middle">0</text>
  <rect class="box" x="396" y="72" width="78" height="26" rx="3"/>
  <text class="ink sm" x="435.0" y="90" text-anchor="middle">1</text>
  <rect class="box" x="478" y="72" width="78" height="26" rx="3"/>
  <text class="ink sm" x="517.0" y="90" text-anchor="middle">1</text>
  <rect class="box" x="560" y="72" width="78" height="26" rx="3"/>
  <text class="ink sm" x="599.0" y="90" text-anchor="middle">0</text>
  <text class="ink sm b" x="140" y="120" text-anchor="end">P(слово | 0)</text>
  <rect class="box" x="150" y="102" width="78" height="26" rx="3"/>
  <text class="ink sm" x="189.0" y="120" text-anchor="middle">0.3</text>
  <rect class="box" x="232" y="102" width="78" height="26" rx="3"/>
  <text class="ink sm" x="271.0" y="120" text-anchor="middle">0.1</text>
  <rect class="box-acc" x="314" y="102" width="78" height="26" rx="3"/>
  <text class="ink sm b" x="353.0" y="120" text-anchor="middle">0.1</text>
  <rect class="box" x="396" y="102" width="78" height="26" rx="3"/>
  <text class="ink sm" x="435.0" y="120" text-anchor="middle">0.2</text>
  <rect class="box" x="478" y="102" width="78" height="26" rx="3"/>
  <text class="ink sm" x="517.0" y="120" text-anchor="middle">0.2</text>
  <rect class="box-acc" x="560" y="102" width="78" height="26" rx="3"/>
  <text class="ink sm b" x="599.0" y="120" text-anchor="middle">0.1</text>
  <text class="ink sm b" x="140" y="150" text-anchor="end">класс 1: счёт</text>
  <rect class="box" x="150" y="132" width="78" height="26" rx="3"/>
  <text class="ink sm" x="189.0" y="150" text-anchor="middle">0</text>
  <rect class="box" x="232" y="132" width="78" height="26" rx="3"/>
  <text class="ink sm" x="271.0" y="150" text-anchor="middle">1</text>
  <rect class="box" x="314" y="132" width="78" height="26" rx="3"/>
  <text class="ink sm" x="353.0" y="150" text-anchor="middle">2</text>
  <rect class="box" x="396" y="132" width="78" height="26" rx="3"/>
  <text class="ink sm" x="435.0" y="150" text-anchor="middle">0</text>
  <rect class="box" x="478" y="132" width="78" height="26" rx="3"/>
  <text class="ink sm" x="517.0" y="150" text-anchor="middle">0</text>
  <rect class="box" x="560" y="132" width="78" height="26" rx="3"/>
  <text class="ink sm" x="599.0" y="150" text-anchor="middle">1</text>
  <text class="ink sm b" x="140" y="180" text-anchor="end">P(слово | 1)</text>
  <rect class="box" x="150" y="162" width="78" height="26" rx="3"/>
  <text class="ink sm" x="189.0" y="180" text-anchor="middle">0.1</text>
  <rect class="box" x="232" y="162" width="78" height="26" rx="3"/>
  <text class="ink sm" x="271.0" y="180" text-anchor="middle">0.2</text>
  <rect class="box-acc" x="314" y="162" width="78" height="26" rx="3"/>
  <text class="ink sm b" x="353.0" y="180" text-anchor="middle">0.3</text>
  <rect class="box" x="396" y="162" width="78" height="26" rx="3"/>
  <text class="ink sm" x="435.0" y="180" text-anchor="middle">0.1</text>
  <rect class="box" x="478" y="162" width="78" height="26" rx="3"/>
  <text class="ink sm" x="517.0" y="180" text-anchor="middle">0.1</text>
  <rect class="box-acc" x="560" y="162" width="78" height="26" rx="3"/>
  <text class="ink sm b" x="599.0" y="180" text-anchor="middle">0.2</text>
  <text class="ink2 sm" x="14" y="210" text-anchor="start">P(слово | класс) = (счёт + 1) / (слов в классе + 6): у каждого класса 4 слова, словарь — 6</text>
  <text class="ink sm b" x="14" y="252" text-anchor="start">новый отзыв</text>
  <text class="ink sm" x="14" y="270" text-anchor="start">«долго и холодно»</text>
  <rect class="box" x="160" y="228" width="250" height="28" rx="4"/>
  <text class="ink sm" x="285" y="247" text-anchor="middle">класс 0: 0.5 · 0.1 · 0.1 = 0.005</text>
  <rect class="box-err" x="160" y="262" width="250" height="28" rx="4"/>
  <text class="ink sm b" x="285" y="281" text-anchor="middle">класс 1: 0.5 · 0.3 · 0.2 = 0.030</text>
  <path class="ln" d="M414,259 L446,259" marker-end="url(#ah-nb-toy)"/>
  <rect class="box-acc" x="450" y="234" width="236" height="50" rx="5"/>
  <text class="ink sm" x="568" y="254" text-anchor="middle">P(1) = 0.030 / (0.005 + 0.030)</text>
  <text class="ink b" x="568" y="274" text-anchor="middle">≈ 0.86 → класс 1</text>
  <text class="mut sm" x="350" y="318" text-anchor="middle">0.5 — доля класса в обучении; «и» векторайзер не видит (одна буква)</text>
</svg>
