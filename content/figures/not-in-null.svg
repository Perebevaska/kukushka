<svg viewBox="0 0 700 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-not-in-null">
  <title id="t-not-in-null">Почему NOT IN со значением NULL в списке не пропускает ни одной строки</title>
  <defs><marker id="ah-not-in-null" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="20" y="26" text-anchor="start">подзапрос как есть</text>
  <rect class="box" x="20" y="34" width="58" height="26" rx="4"/>
  <text class="ink sm" x="49.0" y="51" text-anchor="middle">C1002</text>
  <rect class="box" x="82" y="34" width="58" height="26" rx="4"/>
  <text class="ink sm" x="111.0" y="51" text-anchor="middle">C1003</text>
  <rect class="box" x="144" y="34" width="26" height="26" rx="4"/>
  <text class="ink sm" x="157.0" y="51" text-anchor="middle">…</text>
  <rect class="box-err" x="174" y="34" width="58" height="26" rx="4"/>
  <text class="err sm b" x="203.0" y="51" text-anchor="middle">NULL</text>
  <text class="ink2 sm" x="20" y="78" text-anchor="start">150 гостей с доставкой + NULL</text>
  <text class="mut sm b" x="20" y="170" text-anchor="start">подзапрос + IS NOT NULL</text>
  <rect class="box" x="20" y="178" width="58" height="26" rx="4"/>
  <text class="ink sm" x="49.0" y="195" text-anchor="middle">C1002</text>
  <rect class="box" x="82" y="178" width="58" height="26" rx="4"/>
  <text class="ink sm" x="111.0" y="195" text-anchor="middle">C1003</text>
  <rect class="box" x="144" y="178" width="26" height="26" rx="4"/>
  <text class="ink sm" x="157.0" y="195" text-anchor="middle">…</text>
  <text class="ink2 sm" x="20" y="222" text-anchor="start">150 гостей с доставкой</text>
  <text class="ink2 sm" x="300" y="26" text-anchor="start">гость C1000 без доставок: NOT IN = цепочка AND</text>
  <rect class="box" x="300" y="34" width="100" height="26" rx="4"/>
  <text class="ink sm" x="350" y="51" text-anchor="middle">C1000 &lt;&gt; C1002</text>
  <rect class="box-ok" x="300" y="68" width="100" height="24" rx="4"/>
  <text class="ok sm b" x="350" y="84" text-anchor="middle">истина</text>
  <rect class="box" x="436" y="34" width="100" height="26" rx="4"/>
  <text class="ink sm" x="486" y="51" text-anchor="middle">C1000 &lt;&gt; C1003</text>
  <rect class="box-ok" x="436" y="68" width="100" height="24" rx="4"/>
  <text class="ok sm b" x="486" y="84" text-anchor="middle">истина</text>
  <rect class="box" x="592" y="34" width="100" height="26" rx="4"/>
  <text class="ink sm" x="642" y="51" text-anchor="middle">C1000 &lt;&gt; NULL</text>
  <rect class="box-err" x="592" y="68" width="100" height="24" rx="4"/>
  <text class="err sm b" x="642" y="84" text-anchor="middle">неизвестно</text>
  <text class="mut sm b" x="418" y="51" text-anchor="middle">AND</text>
  <text class="mut sm b" x="564" y="51" text-anchor="middle">AND …</text>
  <path class="ln" d="M496,94 L496,106" marker-end="url(#ah-not-in-null)"/>
  <rect class="box-err" x="374" y="108" width="244" height="26" rx="4"/>
  <text class="err sm b" x="496" y="125" text-anchor="middle">итог: неизвестно → строка отброшена</text>
  <text class="err sm b" x="496" y="152" text-anchor="middle">так у каждого гостя → результат 0</text>
  <rect class="box" x="300" y="178" width="100" height="26" rx="4"/>
  <text class="ink sm" x="350" y="195" text-anchor="middle">C1000 &lt;&gt; C1002</text>
  <rect class="box-ok" x="300" y="212" width="100" height="24" rx="4"/>
  <text class="ok sm b" x="350" y="228" text-anchor="middle">истина</text>
  <rect class="box" x="436" y="178" width="100" height="26" rx="4"/>
  <text class="ink sm" x="486" y="195" text-anchor="middle">C1000 &lt;&gt; C1003</text>
  <rect class="box-ok" x="436" y="212" width="100" height="24" rx="4"/>
  <text class="ok sm b" x="486" y="228" text-anchor="middle">истина</text>
  <text class="mut sm b" x="418" y="195" text-anchor="middle">AND</text>
  <text class="mut sm b" x="564" y="195" text-anchor="middle">AND …</text>
  <rect class="box dash" x="592" y="178" width="100" height="26" rx="4"/>
  <text class="mut sm" x="642" y="195" text-anchor="middle">NULL нет</text>
  <path class="ln" d="M496,238 L496,250" marker-end="url(#ah-not-in-null)"/>
  <rect class="box-ok" x="374" y="252" width="244" height="26" rx="4"/>
  <text class="ok sm b" x="496" y="269" text-anchor="middle">итог: истина → гость в результате</text>
  <text class="ok sm b" x="20" y="268" text-anchor="start">110 гостей из 260 (= 260 − 150)</text>
  <text class="ink2 sm" x="350" y="304" text-anchor="middle">сравнение с NULL — не «ложь», а «неизвестно»; WHERE пропускает только «истину»</text>
</svg>
