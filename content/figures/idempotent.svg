<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-idempotent">
  <title id="t-idempotent">Повторный запуск за ту же дату: дозапись в общий файл задваивает гостей, файл на дату перезаписывается</title>
  <defs><marker id="ah-idempotent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="err sm b" x="175" y="24" text-anchor="middle">mode="a" в общий scores.csv</text>
  <text class="ok sm b" x="525" y="24" text-anchor="middle">scores_2026-12-07.csv</text>
  <rect class="box" x="30" y="40" width="120" height="22" rx="3"/>
  <text class="ink2 sm" x="90" y="56" text-anchor="middle">запуск 1</text>
  <rect class="box" x="30" y="66" width="120" height="22" rx="3"/>
  <text class="ink2 sm" x="90" y="82" text-anchor="middle">запуск 2</text>
  <path class="ln" d="M154,64 L186,64" marker-end="url(#ah-idempotent)"/>
  <rect class="box-acc" x="190" y="36" width="130" height="20" rx="3"/>
  <text class="ink sm" x="255" y="51" text-anchor="middle">гость 101</text>
  <rect class="box-acc" x="190" y="60" width="130" height="20" rx="3"/>
  <text class="ink sm" x="255" y="75" text-anchor="middle">гость 102</text>
  <rect class="box-err" x="190" y="84" width="130" height="20" rx="3"/>
  <text class="ink sm" x="255" y="99" text-anchor="middle">гость 101</text>
  <rect class="box-err" x="190" y="108" width="130" height="20" rx="3"/>
  <text class="ink sm" x="255" y="123" text-anchor="middle">гость 102</text>
  <text class="err sm" x="255" y="150" text-anchor="middle">каждый гость дважды —</text>
  <text class="err sm" x="255" y="166" text-anchor="middle">CRM отправит два бонуса</text>
  <rect class="box" x="380" y="40" width="120" height="22" rx="3"/>
  <text class="ink2 sm" x="440" y="56" text-anchor="middle">запуск 1</text>
  <rect class="box" x="380" y="66" width="120" height="22" rx="3"/>
  <text class="ink2 sm" x="440" y="82" text-anchor="middle">запуск 2</text>
  <path class="ln" d="M504,64 L536,64" marker-end="url(#ah-idempotent)"/>
  <rect class="box-acc" x="540" y="36" width="130" height="20" rx="3"/>
  <text class="ink sm" x="605" y="51" text-anchor="middle">гость 101</text>
  <rect class="box-acc" x="540" y="60" width="130" height="20" rx="3"/>
  <text class="ink sm" x="605" y="75" text-anchor="middle">гость 102</text>
  <text class="ok sm" x="605" y="110" text-anchor="middle">тот же результат</text>
  <text class="ok sm" x="605" y="126" text-anchor="middle">сколько ни запускай</text>
  <text class="mut sm" x="350" y="212" text-anchor="middle">в базе то же самое: DELETE … WHERE date = …; INSERT … — перезапись за дату</text>
</svg>
