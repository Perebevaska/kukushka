<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-query-at">
  <title id="t-query-at">query: имена без @ — столбцы, с @ — переменные Python</title>
  <defs><marker id="ah-query-at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm" x="158.8" y="32" text-anchor="middle">df.query("</text>
  <rect class="box-acc" x="197.8" y="14" width="55.599999999999994" height="26" rx="4"/>
  <text class="ink sm b" x="225.60000000000002" y="32" text-anchor="middle">amount</text>
  <text class="ink sm" x="265.8" y="32" text-anchor="middle">&gt;</text>
  <rect class="box-warn" x="278.2" y="14" width="93.6" height="26" rx="4"/>
  <text class="ink sm b" x="325.0" y="32" text-anchor="middle">@min_amount</text>
  <text class="ink sm" x="391.79999999999995" y="32" text-anchor="middle">and</text>
  <rect class="box-acc" x="411.79999999999995" y="14" width="63.199999999999996" height="26" rx="4"/>
  <text class="ink sm b" x="443.4" y="32" text-anchor="middle">shop_id</text>
  <text class="ink sm" x="491.19999999999993" y="32" text-anchor="middle">in</text>
  <rect class="box-warn" x="507.3999999999999" y="14" width="55.599999999999994" height="26" rx="4"/>
  <text class="ink sm b" x="535.1999999999999" y="32" text-anchor="middle">@kazan</text>
  <text class="ink sm" x="571.5999999999999" y="32" text-anchor="middle">")</text>
  <rect class="box-acc" x="20" y="70" width="200" height="70" rx="8"/>
  <text class="acc sm b" x="120" y="92" text-anchor="middle">столбцы таблицы</text>
  <text class="ink sm" x="120" y="112" text-anchor="middle">amount, shop_id</text>
  <text class="mut sm" x="120" y="130" text-anchor="middle">имя без @</text>
  <rect class="box-warn" x="480" y="70" width="200" height="70" rx="8"/>
  <text class="warn sm b" x="580" y="92" text-anchor="middle">переменные Python</text>
  <text class="ink sm" x="580" y="112" text-anchor="middle">min_amount = 400</text>
  <text class="ink sm" x="580" y="130" text-anchor="middle">kazan = ["KZN-1", "KZN-2"]</text>
  <text class="mut sm" x="350" y="60" text-anchor="middle">цвет токена = откуда pandas берёт значение</text>
  <text class="ink2 sm" x="350" y="92" text-anchor="middle">без @ pandas ищет</text>
  <text class="ink2 sm" x="350" y="108" text-anchor="middle">столбец min_amount —</text>
  <text class="err sm b" x="350" y="124" text-anchor="middle">UndefinedVariableError</text>
  <rect class="box-ok" x="120" y="166" width="460" height="34" rx="6"/>
  <text class="ink sm b" x="350" y="188" text-anchor="middle">результат: 2 строки — KZN-2 610, KZN-1 450</text>
  <text class="mut sm" x="350" y="226" text-anchor="middle">Поменять порог или список кофеен — правка двух строк с параметрами, условие не трогаем.</text>
</svg>
