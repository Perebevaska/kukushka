<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-csv-dictreader">
  <title id="t-csv-dictreader">csv.DictReader: заголовок даёт ключи, строка — значения</title>
  <defs><marker id="ah-csv-dictreader" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="20" y="26" text-anchor="start">orders.csv</text>
  <rect class="box-acc" x="20" y="34" width="330" height="26" rx="4"/>
  <text class="ink sm" x="30" y="52" text-anchor="start">order_id,date,city,drink,amount</text>
  <rect class="box" x="20" y="64" width="330" height="26" rx="4"/>
  <text class="ink sm" x="30" y="82" text-anchor="start">Z-1006,2026-09-03,Пермь,Раф,260</text>
  <text class="acc sm b" x="360" y="52" text-anchor="start">← заголовок: имена ключей</text>
  <text class="ink2 sm" x="360" y="82" text-anchor="start">← строка данных</text>
  <text class="mut sm" x="20" y="122" text-anchor="start">row = словарь</text>
  <rect class="box-acc" x="20" y="132" width="126" height="26" rx="4"/>
  <text class="ink sm b" x="83" y="150" text-anchor="middle">"order_id"</text>
  <rect class="box" x="20" y="162" width="126" height="26" rx="4"/>
  <text class="ink sm" x="83" y="180" text-anchor="middle">"Z-1006"</text>
  <rect class="box-acc" x="154" y="132" width="126" height="26" rx="4"/>
  <text class="ink sm b" x="217" y="150" text-anchor="middle">"date"</text>
  <rect class="box" x="154" y="162" width="126" height="26" rx="4"/>
  <text class="ink sm" x="217" y="180" text-anchor="middle">"2026-09-03"</text>
  <rect class="box-acc" x="288" y="132" width="126" height="26" rx="4"/>
  <text class="ink sm b" x="351" y="150" text-anchor="middle">"city"</text>
  <rect class="box" x="288" y="162" width="126" height="26" rx="4"/>
  <text class="ink sm" x="351" y="180" text-anchor="middle">"Пермь"</text>
  <rect class="box-acc" x="422" y="132" width="126" height="26" rx="4"/>
  <text class="ink sm b" x="485" y="150" text-anchor="middle">"drink"</text>
  <rect class="box" x="422" y="162" width="126" height="26" rx="4"/>
  <text class="ink sm" x="485" y="180" text-anchor="middle">"Раф"</text>
  <rect class="box-acc" x="556" y="132" width="126" height="26" rx="4"/>
  <text class="ink sm b" x="619" y="150" text-anchor="middle">"amount"</text>
  <rect class="box-warn" x="556" y="162" width="126" height="26" rx="4"/>
  <text class="ink sm" x="619" y="180" text-anchor="middle">"260"</text>
  <text class="warn sm b" x="619" y="206" text-anchor="middle">это строка, не число</text>
  <text class="ink2 sm" x="350" y="236" text-anchor="middle">int(row["amount"]) + 100 = 360;  без int: "260" + "100" = "260100"</text>
</svg>
