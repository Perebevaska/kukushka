<svg viewBox="0 0 700 284" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-func-copy">
  <title id="t-func-copy">Функция получает ту же таблицу, а не копию: без copy() она меняет исходные данные</title>
  <defs><marker id="ah-func-copy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="err b" x="170" y="20" text-anchor="middle">без copy()</text>
  <text class="ok b" x="530" y="20" text-anchor="middle">с t = t.copy() в начале</text>
  <path class="ln-mut dash" d="M350,10 V276"/>
  <rect class="box" x="20" y="40" width="300" height="40" rx="6"/>
  <text class="ink sm" x="170.0" y="56.5" text-anchor="middle">def add_flag(t):</text>
  <text class="ink sm" x="170.0" y="72.5" text-anchor="middle">t["flag"] = True</text>
  <rect class="box" x="380" y="34" width="300" height="52" rx="6"/>
  <text class="ink sm" x="530.0" y="48.5" text-anchor="middle">def add_flag(t):</text>
  <text class="ok sm b" x="530.0" y="64.5" text-anchor="middle">t = t.copy()</text>
  <text class="ink sm" x="530.0" y="80.5" text-anchor="middle">t["flag"] = True</text>
  <rect class="box-acc" x="40" y="120" width="60" height="30" rx="6"/>
  <text class="ink sm b" x="70.0" y="139.5" text-anchor="middle">raw</text>
  <rect class="box-acc" x="40" y="176" width="60" height="30" rx="6"/>
  <text class="ink sm b" x="70.0" y="195.5" text-anchor="middle">t</text>
  <path class="ln" d="M102,135 C140,135 150,160 186,160" marker-end="url(#ah-func-copy)"/>
  <path class="ln" d="M102,191 C140,191 150,170 186,170" marker-end="url(#ah-func-copy)"/>
  <text class="mut sm" x="245.0" y="112" text-anchor="middle">одна таблица</text>
  <rect class="box" x="190" y="120" width="110" height="24" rx="3"/>
  <text class="ink2 sm b" x="215.0" y="136.5" text-anchor="middle">a</text>
  <text class="ink2 sm b" x="270.0" y="136.5" text-anchor="middle">flag</text>
  <rect class="box-err" x="190" y="146" width="110" height="24" rx="3"/>
  <text class="ink sm" x="215.0" y="162.5" text-anchor="middle">1</text>
  <text class="err sm b" x="270.0" y="162.5" text-anchor="middle">True</text>
  <rect class="box-err" x="190" y="172" width="110" height="24" rx="3"/>
  <text class="ink sm" x="215.0" y="188.5" text-anchor="middle">2</text>
  <text class="err sm b" x="270.0" y="188.5" text-anchor="middle">True</text>
  <text class="err sm" x="175" y="240" text-anchor="middle">raw тоже получил столбец flag</text>
  <rect class="box-acc" x="400" y="134" width="60" height="30" rx="6"/>
  <text class="ink sm b" x="430.0" y="153.5" text-anchor="middle">raw</text>
  <rect class="box-acc" x="400" y="200" width="60" height="30" rx="6"/>
  <text class="ink sm b" x="430.0" y="219.5" text-anchor="middle">t</text>
  <path class="ln" d="M462,149 L506,149" marker-end="url(#ah-func-copy)"/>
  <text class="mut sm" x="535.0" y="108" text-anchor="middle">исходная</text>
  <rect class="box" x="510" y="116" width="50" height="24" rx="3"/>
  <text class="ink2 sm b" x="535.0" y="132.5" text-anchor="middle">a</text>
  <rect class="box" x="510" y="142" width="50" height="24" rx="3"/>
  <text class="ink sm" x="535.0" y="158.5" text-anchor="middle">1</text>
  <rect class="box" x="510" y="168" width="50" height="24" rx="3"/>
  <text class="ink sm" x="535.0" y="184.5" text-anchor="middle">2</text>
  <path class="ln" d="M462,215 L576,215" marker-end="url(#ah-func-copy)"/>
  <text class="mut sm" x="635.0" y="168" text-anchor="middle">копия</text>
  <rect class="box" x="580" y="176" width="110" height="24" rx="3"/>
  <text class="ink2 sm b" x="605.0" y="192.5" text-anchor="middle">a</text>
  <text class="ink2 sm b" x="660.0" y="192.5" text-anchor="middle">flag</text>
  <rect class="box-ok" x="580" y="202" width="110" height="24" rx="3"/>
  <text class="ink sm" x="605.0" y="218.5" text-anchor="middle">1</text>
  <text class="ink sm" x="660.0" y="218.5" text-anchor="middle">True</text>
  <rect class="box-ok" x="580" y="228" width="110" height="24" rx="3"/>
  <text class="ink sm" x="605.0" y="244.5" text-anchor="middle">2</text>
  <text class="ink sm" x="660.0" y="244.5" text-anchor="middle">True</text>
  <text class="ok sm" x="530" y="274" text-anchor="middle">raw не тронута; функцию можно перезапускать</text>
</svg>
