<svg viewBox="0 0 700 292" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-duckdb-flow">
  <title id="t-duckdb-flow">Как DuckDB читает датафрейм и файл и что возвращает</title>
  <defs><marker id="ah-duckdb-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="90" y="22" text-anchor="middle">откуда</text>
  <rect class="box" x="10" y="34" width="160" height="58" rx="6"/>
  <text class="ink sm b" x="90.0" y="51.5" text-anchor="middle">df — переменная Python</text>
  <text class="ink2 sm" x="90.0" y="67.5" text-anchor="middle">DataFrame</text>
  <text class="mut sm" x="90.0" y="83.5" text-anchor="middle">2 089 строк × 9 столбцов</text>
  <rect class="box" x="10" y="104" width="160" height="46" rx="6"/>
  <text class="ink sm b" x="90.0" y="123.5" text-anchor="middle">'orders_3m.csv'</text>
  <text class="ink2 sm" x="90.0" y="139.5" text-anchor="middle">файл: имя в кавычках</text>
  <text class="ink2 sm" x="90" y="172" text-anchor="middle">FROM df — по имени</text>
  <text class="ink2 sm" x="90" y="188" text-anchor="middle">переменной, без копии</text>
  <path class="ln" d="M172,63 C196,63 196,100 216,100" marker-end="url(#ah-duckdb-flow)"/>
  <path class="ln" d="M172,127 C196,127 196,104 216,104" marker-end="url(#ah-duckdb-flow)"/>
  <rect class="box-acc" x="218" y="70" width="160" height="64" rx="6"/>
  <text class="ink sm b" x="298.0" y="89.5" text-anchor="middle">duckdb.sql("""</text>
  <text class="ink sm" x="298.0" y="106.5" text-anchor="middle">SELECT … FROM df</text>
  <text class="ink sm b" x="298.0" y="123.5" text-anchor="middle">""")</text>
  <text class="ink2 sm" x="298" y="152" text-anchor="middle">результат запроса —</text>
  <text class="ink2 sm" x="298" y="168" text-anchor="middle">ещё не DataFrame</text>
  <text class="mut sm b" x="555" y="22" text-anchor="middle">что получить</text>
  <path class="ln-mut" d="M380,102 C400,102 400,62 418,62" marker-end="url(#ah-duckdb-flow)"/>
  <rect class="box-ok" x="420" y="32" width="270" height="60" rx="5"/>
  <text class="acc b" x="432" y="51" text-anchor="start">.df()</text>
  <text class="ink2 sm" x="432" y="68" text-anchor="start">DataFrame — таблица целиком</text>
  <text class="ink sm" x="432" y="84" text-anchor="start">GROUP BY shop_id → 6 строк × 3 столбца</text>
  <path class="ln-mut" d="M380,102 C400,102 400,130 418,130" marker-end="url(#ah-duckdb-flow)"/>
  <rect class="box" x="420" y="100" width="270" height="60" rx="5"/>
  <text class="acc b" x="432" y="119" text-anchor="start">.fetchall()</text>
  <text class="ink2 sm" x="432" y="136" text-anchor="start">список кортежей — все строки</text>
  <text class="ink sm" x="432" y="152" text-anchor="start">[(…), (…), …] — для цикла for</text>
  <path class="ln-mut" d="M380,102 C400,102 400,198 418,198" marker-end="url(#ah-duckdb-flow)"/>
  <rect class="box" x="420" y="168" width="270" height="60" rx="5"/>
  <text class="acc b" x="432" y="187" text-anchor="start">.fetchone()</text>
  <text class="ink2 sm" x="432" y="204" text-anchor="start">кортеж — только первая строка</text>
  <text class="ink sm" x="432" y="220" text-anchor="start">SELECT SUM(amount) → (710195,)</text>
  <path class="ln" d="M555,230 L555,246" marker-end="url(#ah-duckdb-flow)"/>
  <rect class="box-ok" x="420" y="248" width="270" height="32" rx="5"/>
  <text class="ink sm b" x="555" y="269" text-anchor="middle">.fetchone()[0] → 710195 — число</text>
  <text class="ink2 sm" x="406" y="258" text-anchor="end">одно число: кортеж,</text>
  <text class="ink2 sm" x="406" y="274" text-anchor="end">затем его элемент [0]</text>
</svg>
