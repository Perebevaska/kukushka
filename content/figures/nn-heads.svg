<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-heads">
  <title id="t-nn-heads">Одинаковое тело сети и разные «головы» под тип задачи</title>
  <defs><marker id="ah-nn-heads" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="118" width="70" height="44" rx="8"/>
  <text class="ink b" x="49" y="145" text-anchor="middle">X</text>
  <path class="ln" d="M86,140 L112,140" marker-end="url(#ah-nn-heads)"/>
  <rect class="box-acc" x="114" y="98" width="132" height="84" rx="10"/>
  <text class="ink sm b" x="180" y="128" text-anchor="middle">скрытые слои</text>
  <text class="ink2 sm" x="180" y="148" text-anchor="middle">Linear + ReLU</text>
  <text class="mut sm" x="180" y="166" text-anchor="middle">одинаковые везде</text>
  <text class="mut sm" x="347" y="22" text-anchor="middle">чисел на выходе</text>
  <text class="mut sm" x="482" y="22" text-anchor="middle">активация</text>
  <text class="mut sm" x="625" y="22" text-anchor="middle">потеря</text>
  <path class="ln" d="M248,140 C270,140 270,54 290,54" marker-end="url(#ah-nn-heads)"/>
  <rect class="box" x="292" y="34" width="110" height="40" rx="8"/>
  <text class="ink sm b" x="347" y="51" text-anchor="middle">регрессия</text>
  <text class="ink2 sm" x="347" y="67" text-anchor="middle">1 выход</text>
  <path class="ln" d="M404,54 L416,54" marker-end="url(#ah-nn-heads)"/>
  <rect class="box-warn" x="418" y="34" width="128" height="40" rx="8"/>
  <text class="ink sm" x="482" y="59" text-anchor="middle">без активации</text>
  <path class="ln" d="M548,54 L560,54" marker-end="url(#ah-nn-heads)"/>
  <rect class="box-ok" x="562" y="34" width="126" height="40" rx="8"/>
  <text class="ink sm b" x="625" y="51" text-anchor="middle">MSE</text>
  <text class="mut sm" x="625" y="67" text-anchor="middle">минуты доставки</text>
  <path class="ln" d="M248,140 C270,140 270,106 290,106" marker-end="url(#ah-nn-heads)"/>
  <rect class="box" x="292" y="86" width="110" height="40" rx="8"/>
  <text class="ink sm b" x="347" y="103" text-anchor="middle">бинарная</text>
  <text class="ink2 sm" x="347" y="119" text-anchor="middle">1 выход</text>
  <path class="ln" d="M404,106 L416,106" marker-end="url(#ah-nn-heads)"/>
  <rect class="box-warn" x="418" y="86" width="128" height="40" rx="8"/>
  <text class="ink sm" x="482" y="111" text-anchor="middle">сигмоида</text>
  <path class="ln" d="M548,106 L560,106" marker-end="url(#ah-nn-heads)"/>
  <rect class="box-ok" x="562" y="86" width="126" height="40" rx="8"/>
  <text class="ink sm b" x="625" y="103" text-anchor="middle">BCE</text>
  <text class="mut sm" x="625" y="119" text-anchor="middle">уйдёт ли гость</text>
  <path class="ln" d="M248,140 C270,140 270,158 290,158" marker-end="url(#ah-nn-heads)"/>
  <rect class="box" x="292" y="138" width="110" height="40" rx="8"/>
  <text class="ink sm b" x="347" y="155" text-anchor="middle">многоклассовая</text>
  <text class="ink2 sm" x="347" y="171" text-anchor="middle">K выходов</text>
  <path class="ln" d="M404,158 L416,158" marker-end="url(#ah-nn-heads)"/>
  <rect class="box-warn" x="418" y="138" width="128" height="40" rx="8"/>
  <text class="ink sm" x="482" y="163" text-anchor="middle">softmax: сумма = 1</text>
  <path class="ln" d="M548,158 L560,158" marker-end="url(#ah-nn-heads)"/>
  <rect class="box-ok" x="562" y="138" width="126" height="40" rx="8"/>
  <text class="ink sm b" x="625" y="155" text-anchor="middle">кросс-энтропия</text>
  <text class="mut sm" x="625" y="171" text-anchor="middle">цифра 0–9</text>
  <path class="ln" d="M248,140 C270,140 270,210 290,210" marker-end="url(#ah-nn-heads)"/>
  <rect class="box" x="292" y="190" width="110" height="40" rx="8"/>
  <text class="ink sm b" x="347" y="207" text-anchor="middle">многометочная</text>
  <text class="ink2 sm" x="347" y="223" text-anchor="middle">K выходов</text>
  <path class="ln" d="M404,210 L416,210" marker-end="url(#ah-nn-heads)"/>
  <rect class="box-warn" x="418" y="190" width="128" height="40" rx="8"/>
  <text class="ink sm" x="482" y="215" text-anchor="middle">сигмоида на каждом</text>
  <path class="ln" d="M548,210 L560,210" marker-end="url(#ah-nn-heads)"/>
  <rect class="box-ok" x="562" y="190" width="126" height="40" rx="8"/>
  <text class="ink sm b" x="625" y="207" text-anchor="middle">BCE по каждому</text>
  <text class="mut sm" x="625" y="223" text-anchor="middle">кофе, десерт…</text>
  <path class="ln" d="M248,140 C270,140 270,262 290,262" marker-end="url(#ah-nn-heads)"/>
  <rect class="box" x="292" y="242" width="110" height="40" rx="8"/>
  <text class="ink sm b" x="347" y="259" text-anchor="middle">счётчик</text>
  <text class="ink2 sm" x="347" y="275" text-anchor="middle">1 выход</text>
  <path class="ln" d="M404,262 L416,262" marker-end="url(#ah-nn-heads)"/>
  <rect class="box-warn" x="418" y="242" width="128" height="40" rx="8"/>
  <text class="ink sm" x="482" y="267" text-anchor="middle">экспонента: &gt; 0</text>
  <path class="ln" d="M548,262 L560,262" marker-end="url(#ah-nn-heads)"/>
  <rect class="box-ok" x="562" y="242" width="126" height="40" rx="8"/>
  <text class="ink sm b" x="625" y="259" text-anchor="middle">пуассоновская</text>
  <text class="mut sm" x="625" y="275" text-anchor="middle">заказов за час</text>
