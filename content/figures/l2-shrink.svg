  <text class="ink2 sm" x="218.02084502370832" y="189" text-anchor="start">1.20</text>
  <text class="ink sm b" x="116" y="238" text-anchor="end">позиции</text>
  <rect class="acc" x="170.0" y="204" width="107.8" height="13" rx="2" opacity="1.0"/>
  <text class="ink2 sm" x="282.7570283093754" y="215" text-anchor="start">2.99</text>
  <rect class="acc" x="170.0" y="220" width="74.1" height="13" rx="2" opacity="0.7"/>
  <text class="ink2 sm" x="249.10322229208" y="231" text-anchor="start">2.06</text>
  <rect class="acc" x="170.0" y="236" width="41.0" height="13" rx="2" opacity="0.45"/>
  <text class="ink2 sm" x="216.02184813428462" y="247" text-anchor="start">1.14</text>
  <rect class="acc" x="170.0" y="252" width="23.7" height="13" rx="2" opacity="0.25"/>
  <text class="ink2 sm" x="198.74994585699415" y="263" text-anchor="start">0.66</text>
  <text class="ink sm b" x="116" y="312" text-anchor="end">сумма</text>
  <rect class="acc" x="145.1" y="278" width="24.9" height="13" rx="2" opacity="1.0"/>
  <text class="err sm" x="175" y="289" text-anchor="start">−0.69</text>
  <rect class="acc" x="170.0" y="294" width="7.2" height="13" rx="2" opacity="0.7"/>
