  <text class="ink sm b" x="116" y="164" text-anchor="end">пеший</text>
  <rect class="acc" x="170.0" y="130" width="202.6" height="13" rx="2" opacity="1.0"/>
  <text class="ink2 sm" x="377.6317256625244" y="141" text-anchor="start">5.63</text>
