<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-l2-shrink">
  <title id="t-l2-shrink">L2-штраф прижимает веса к нулю: веса спуска на доставках при разных λ</title>
  <defs><marker id="ah-l2-shrink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="300" y="24" text-anchor="middle">Веса спуска со штрафом (стандартизированные признаки доставок)</text>
  <path class="ln" d="M170,48 L170,342"/>
  <text class="mut sm" x="170" y="358" text-anchor="middle">0</text>
  <path class="ln-mut dash" d="M242,48 L242,342"/>
