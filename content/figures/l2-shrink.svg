  <rect class="acc" x="170.0" y="310" width="27.4" height="13" rx="2" opacity="0.45"/>
  <text class="ink2 sm" x="202.3696978286084" y="321" text-anchor="start">0.76</text>
  <rect class="acc" x="170.0" y="326" width="19.7" height="13" rx="2" opacity="0.25"/>
  <text class="ink2 sm" x="194.70959326381987" y="337" text-anchor="start">0.55</text>
  <text class="mut sm" x="164" y="67" text-anchor="end">λ=0</text>
  <text class="mut sm" x="164" y="83" text-anchor="end">λ=0.05</text>
  <text class="mut sm" x="164" y="99" text-anchor="end">λ=0.5</text>
  <text class="mut sm" x="164" y="115" text-anchor="end">λ=2</text>
  <text class="mut sm" x="278" y="376" text-anchor="middle">вес признака</text>
  <path class="ln-mut" d="M474,40 L474,368"/>
  <text class="ink2 sm b" x="520" y="64" text-anchor="middle">λ</text>
  <text class="ink2 sm b" x="588" y="64" text-anchor="middle">множитель</text>
  <text class="ink2 sm b" x="656" y="64" text-anchor="middle">MSE</text>
  <rect class="acc" x="494" y="82" width="10" height="14" rx="2" opacity="1.0"/>
  <text class="ink sm b" x="530" y="94" text-anchor="middle">0</text>
  <text class="ink sm" x="588" y="94" text-anchor="middle">1.00</text>
  <text class="ink sm" x="656" y="94" text-anchor="middle">60.00</text>
  <rect class="acc" x="494" y="112" width="10" height="14" rx="2" opacity="0.7"/>
  <text class="ink sm b" x="530" y="124" text-anchor="middle">0.05</text>
  <text class="ink sm" x="588" y="124" text-anchor="middle">0.99</text>
  <text class="ink sm" x="656" y="124" text-anchor="middle">60.37</text>
  <rect class="acc" x="494" y="142" width="10" height="14" rx="2" opacity="0.45"/>
  <text class="ink sm b" x="530" y="154" text-anchor="middle">0.5</text>
  <text class="ink sm" x="588" y="154" text-anchor="middle">0.90</text>
  <text class="ink sm" x="656" y="154" text-anchor="middle">71.12</text>
  <rect class="acc" x="494" y="172" width="10" height="14" rx="2" opacity="0.25"/>
  <text class="ink sm b" x="530" y="184" text-anchor="middle">2</text>
  <text class="ink sm" x="588" y="184" text-anchor="middle">0.60</text>
  <text class="ink sm" x="656" y="184" text-anchor="middle">93.27</text>
  <text class="mut sm" x="585" y="218" text-anchor="middle">множитель 1 − 2ηλ (η = 0.1):</text>
  <text class="mut sm" x="585" y="235" text-anchor="middle">так «усыхает» вес на каждом шаге</text>
  <text class="ink2 sm" x="585" y="268" text-anchor="middle">λ растёт → веса меньше,</text>
  <text class="ink2 sm" x="585" y="285" text-anchor="middle">ошибка на обучении больше</text>
  <text class="mut sm" x="585" y="312" text-anchor="middle">сумма и позиции почти дублируют</text>
  <text class="mut sm" x="585" y="329" text-anchor="middle">друг друга (r = 0.95): штраф делит</text>
  <text class="mut sm" x="585" y="346" text-anchor="middle">вес между ними — у суммы</text>
  <text class="mut sm" x="585" y="363" text-anchor="middle">даже меняется знак</text>
</svg>
