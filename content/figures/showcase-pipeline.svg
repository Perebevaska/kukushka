<svg viewBox="0 0 700 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-showcase-pipeline">
  <title id="t-showcase-pipeline">Проект главы: кадр витрины → 12 ячеек → модель → правило «пусто два кадра подряд» → оповещение пекарю</title>
  <defs><marker id="ah-showcase-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="60" width="28" height="28" rx="2"/>
  <rect class="box" x="44" y="60" width="28" height="28" rx="2"/>
  <rect class="box-warn" x="74" y="60" width="28" height="28" rx="2"/>
  <rect class="box" x="104" y="60" width="28" height="28" rx="2"/>
  <rect class="box" x="14" y="90" width="28" height="28" rx="2"/>
  <rect class="box" x="44" y="90" width="28" height="28" rx="2"/>
  <rect class="box" x="74" y="90" width="28" height="28" rx="2"/>
  <rect class="box" x="104" y="90" width="28" height="28" rx="2"/>
  <rect class="box" x="14" y="120" width="28" height="28" rx="2"/>
  <rect class="box" x="44" y="120" width="28" height="28" rx="2"/>
  <rect class="box" x="74" y="120" width="28" height="28" rx="2"/>
  <rect class="box" x="104" y="120" width="28" height="28" rx="2"/>
  <text class="ink2 sm b" x="74" y="46" text-anchor="middle">кадр витрины</text>
  <text class="mut sm" x="74" y="168" text-anchor="middle">каждые 15 минут</text>
  <rect class="box" x="160" y="60" width="118" height="86" rx="6"/>
  <text class="ink sm b" x="219.0" y="98.5" text-anchor="middle">нарезка</text>
  <text class="ink2 sm" x="219.0" y="116.5" text-anchor="middle">12 вырезок 32 × 32</text>
  <path class="ln" d="M136,103 L158,103" marker-end="url(#ah-showcase-pipeline)"/>
  <rect class="box-acc" x="294" y="60" width="118" height="86" rx="6"/>
  <text class="ink sm b" x="353.0" y="89.5" text-anchor="middle">модель</text>
  <text class="ink2 sm" x="353.0" y="107.5" text-anchor="middle">пусто / круассан /</text>
  <text class="ink2 sm" x="353.0" y="125.5" text-anchor="middle">маффин / печенье</text>
  <path class="ln" d="M280,103 L292,103" marker-end="url(#ah-showcase-pipeline)"/>
  <rect class="box" x="428" y="60" width="118" height="86" rx="6"/>
  <text class="ink sm b" x="487.0" y="89.5" text-anchor="middle">правило</text>
  <text class="ink2 sm" x="487.0" y="107.5" text-anchor="middle">пусто 2 кадра</text>
  <text class="ink2 sm" x="487.0" y="125.5" text-anchor="middle">подряд?</text>
  <path class="ln" d="M414,103 L426,103" marker-end="url(#ah-showcase-pipeline)"/>
  <rect class="box-ok" x="562" y="60" width="118" height="86" rx="6"/>
  <text class="ink sm b" x="621.0" y="89.5" text-anchor="middle">оповещение</text>
  <text class="ink2 sm" x="621.0" y="107.5" text-anchor="middle">ячейка 2 пуста</text>
  <text class="ink2 sm" x="621.0" y="125.5" text-anchor="middle">2 кадра подряд</text>
  <path class="ln" d="M548,103 L560,103" marker-end="url(#ah-showcase-pipeline)"/>
  <text class="ink2 sm" x="350" y="196" text-anchor="middle">вечером в зале другой свет: модель на сырых пикселях слепнет — нужна нормировка кадра</text>
