<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-var-kinds">
  <title id="t-var-kinds">Четыре вида столбцов в заказах: категория, количество, идентификатор, дата</title>
  <defs><marker id="ah-var-kinds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="250" y="10" width="200" height="34" rx="6"/>
  <text class="ink b" x="350.0" y="31.5" text-anchor="middle">столбец orders_3m.csv</text>
  <path class="ln-mut" d="M350,44 C350,58 89.0,54 89.0,68"/>
  <rect class="box-acc" x="6" y="68" width="166" height="42" rx="6"/>
  <text class="ink b" x="89.0" y="85.0" text-anchor="middle">категория</text>
  <text class="ink2 sm" x="89.0" y="102.0" text-anchor="middle">называет группу</text>
  <rect class="box" x="6" y="118" width="166" height="112" rx="6"/>
  <text class="mut sm" x="16" y="138" text-anchor="start">номинальная:</text>
  <text class="ink sm" x="16" y="158" text-anchor="start">shop_id (6), drink (11),</text>
  <text class="ink sm" x="16" y="178" text-anchor="start">channel (3)</text>
  <text class="mut sm" x="16" y="198" text-anchor="start">порядковая:</text>
  <text class="ink sm" x="16" y="218" text-anchor="start">size (3): S &lt; M &lt; L</text>
  <text class="acc sm" x="89.0" y="252" text-anchor="middle">value_counts(),</text>
  <text class="acc sm" x="89.0" y="268" text-anchor="middle">groupby()</text>
  <path class="ln-mut" d="M350,44 C350,58 263.0,54 263.0,68"/>
  <rect class="box-ok" x="180" y="68" width="166" height="42" rx="6"/>
  <text class="ink b" x="263.0" y="85.0" text-anchor="middle">количество</text>
  <text class="ink2 sm" x="263.0" y="102.0" text-anchor="middle">измеряет, сколько</text>
  <rect class="box" x="180" y="118" width="166" height="112" rx="6"/>
  <text class="mut sm" x="190" y="138" text-anchor="start">дискретное:</text>
  <text class="ink sm" x="190" y="158" text-anchor="start">qty (3): 1, 2 или 3 чашки</text>
  <text class="mut sm" x="190" y="198" text-anchor="start">непрерывное:</text>
  <text class="ink sm" x="190" y="218" text-anchor="start">amount (65 значений)</text>
  <text class="acc sm" x="263.0" y="252" text-anchor="middle">sum(), mean(),</text>
  <text class="acc sm" x="263.0" y="268" text-anchor="middle">min(), max()</text>
  <path class="ln-mut" d="M350,44 C350,58 437.0,54 437.0,68"/>
  <rect class="box-warn" x="354" y="68" width="166" height="42" rx="6"/>
  <text class="ink b" x="437.0" y="85.0" text-anchor="middle">идентификатор</text>
  <text class="ink2 sm" x="437.0" y="102.0" text-anchor="middle">называет запись</text>
  <rect class="box" x="354" y="118" width="166" height="112" rx="6"/>
  <text class="mut sm" x="364" y="138" text-anchor="start">order_id:</text>
  <text class="ink sm" x="364" y="158" text-anchor="start">2 089 разных значений</text>
  <text class="ink sm" x="364" y="178" text-anchor="start">на 2 089 строк</text>
  <text class="mut sm" x="364" y="198" text-anchor="start">client_id:</text>
  <text class="ink sm" x="364" y="218" text-anchor="start">260 номеров карт</text>
  <text class="acc sm" x="437.0" y="252" text-anchor="middle">искать дубли, соединять;</text>
  <text class="acc sm" x="437.0" y="268" text-anchor="middle">не усреднять</text>
  <path class="ln-mut" d="M350,44 C350,58 611.0,54 611.0,68"/>
  <rect class="box" x="528" y="68" width="166" height="42" rx="6"/>
  <text class="ink b" x="611.0" y="85.0" text-anchor="middle">дата и время</text>
  <text class="ink2 sm" x="611.0" y="102.0" text-anchor="middle">когда</text>
  <rect class="box" x="528" y="118" width="166" height="112" rx="6"/>
  <text class="mut sm" x="538" y="138" text-anchor="start">datetime:</text>
  <text class="ink sm" x="538" y="158" text-anchor="start">→ день недели —</text>
  <text class="ink sm" x="538" y="178" text-anchor="start">это категория</text>
  <text class="ink sm" x="538" y="198" text-anchor="start">→ дней прошло —</text>
  <text class="ink sm" x="538" y="218" text-anchor="start">это количество</text>
  <text class="acc sm" x="611.0" y="252" text-anchor="middle">.dt.dayofweek,</text>
  <text class="acc sm" x="611.0" y="268" text-anchor="middle">разность дат</text>
  <text class="mut sm" x="350" y="292" text-anchor="middle">в скобках — сколько разных значений в столбце (nunique); снизу — что с ним можно делать</text>
</svg>
