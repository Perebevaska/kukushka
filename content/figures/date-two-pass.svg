<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-date-two-pass">
  <title id="t-date-two-pass">Два прохода to_datetime с errors="coerce" и объединение через fillna</title>
  <defs><marker id="ah-date-two-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="acc sm b" x="205" y="22" text-anchor="middle">format="%Y-%m-%d"</text>
  <text class="warn sm b" x="355" y="22" text-anchor="middle">format="%d.%m.%Y"</text>
  <rect class="box" x="10" y="32" width="560" height="26" rx="3"/>
  <text class="ink2 sm b" x="70.0" y="49.5" text-anchor="middle">birth_date</text>
  <text class="ink2 sm b" x="205.0" y="49.5" text-anchor="middle">iso</text>
  <text class="ink2 sm b" x="355.0" y="49.5" text-anchor="middle">ru</text>
  <text class="ink2 sm b" x="500.0" y="49.5" text-anchor="middle">iso.fillna(ru)</text>
  <rect class="box" x="10" y="60" width="560" height="26" rx="3"/>
  <text class="ink sm" x="70.0" y="77.5" text-anchor="middle">«2001-12-03»</text>
  <text class="acc sm b" x="205.0" y="77.5" text-anchor="middle">2001-12-03</text>
  <text class="mut sm" x="355.0" y="77.5" text-anchor="middle">NaT</text>
  <text class="acc sm b" x="500.0" y="77.5" text-anchor="middle">2001-12-03</text>
  <rect class="box" x="10" y="88" width="560" height="26" rx="3"/>
  <text class="ink sm" x="70.0" y="105.5" text-anchor="middle">«19.01.1975»</text>
  <text class="mut sm" x="205.0" y="105.5" text-anchor="middle">NaT</text>
  <text class="warn sm b" x="355.0" y="105.5" text-anchor="middle">1975-01-19</text>
  <text class="warn sm b" x="500.0" y="105.5" text-anchor="middle">1975-01-19</text>
  <rect class="box-warn" x="10" y="116" width="560" height="26" rx="3"/>
  <text class="ink sm" x="70.0" y="133.5" text-anchor="middle">«не указано»</text>
  <text class="mut sm" x="205.0" y="133.5" text-anchor="middle">NaT</text>
  <text class="mut sm" x="355.0" y="133.5" text-anchor="middle">NaT</text>
  <text class="mut sm" x="500.0" y="133.5" text-anchor="middle">NaT</text>
  <rect class="box" x="10" y="144" width="560" height="26" rx="3"/>
  <text class="ink sm" x="70.0" y="161.5" text-anchor="middle">None</text>
  <text class="mut sm" x="205.0" y="161.5" text-anchor="middle">NaT</text>
  <text class="mut sm" x="355.0" y="161.5" text-anchor="middle">NaT</text>
  <text class="mut sm" x="500.0" y="161.5" text-anchor="middle">NaT</text>
  <text class="ink2 sm" x="578" y="120" text-anchor="start">← не разобралось:</text>
  <text class="ink2 sm" x="592" y="136" text-anchor="start">так и надо</text>
  <text class="ink2 sm" x="350" y="194" text-anchor="middle">каждый проход понимает только свой формат, остальное — NaT (пропуск для дат)</text>
  <text class="ink2 sm" x="350" y="214" text-anchor="middle">fillna берёт из ru то, чего нет в iso; потом проверка: что было, но не стало датой</text>
  <text class="mut sm" x="350" y="238" text-anchor="middle">на анкетах: разобрано 267 из 288 непустых дат</text>
</svg>
