<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-golden-check">
  <title id="t-golden-check">Контрольный набор: ответы модели на 20 строк записывают при выпуске и сравнивают после каждой загрузки</title>
  <defs><marker id="ah-golden-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="170" y="24" text-anchor="middle">в момент выпуска</text>
  <rect class="box" x="14" y="40" width="120" height="50" rx="6"/>
  <text class="ink sm b" x="74.0" y="60.5" text-anchor="middle">X_test.head(20)</text>
  <text class="ink2 sm" x="74.0" y="78.5" text-anchor="middle">20 гостей</text>
  <path class="ln" d="M136,65 L166,65" marker-end="url(#ah-golden-check)"/>
  <rect class="box-acc" x="170" y="40" width="100" height="50" rx="6"/>
  <text class="ink sm b" x="220.0" y="60.5" text-anchor="middle">модель</text>
  <text class="ink2 sm" x="220.0" y="78.5" text-anchor="middle">обучена</text>
  <path class="ln" d="M272,65 L302,65" marker-end="url(#ah-golden-check)"/>
  <rect class="box-ok" x="306" y="40" width="130" height="50" rx="6"/>
  <text class="ink sm b" x="371.0" y="60.5" text-anchor="middle">golden.csv</text>
  <text class="ink2 sm" x="371.0" y="78.5" text-anchor="middle">+ столбец expected</text>
  <text class="ink2 sm b" x="170" y="132" text-anchor="middle">на сервере, у коллеги, через год</text>
  <rect class="box" x="14" y="146" width="120" height="50" rx="6"/>
  <text class="ink sm b" x="74.0" y="166.5" text-anchor="middle">те же 20 строк</text>
  <text class="ink2 sm" x="74.0" y="184.5" text-anchor="middle">без expected</text>
  <path class="ln" d="M136,171 L166,171" marker-end="url(#ah-golden-check)"/>
  <rect class="box-acc" x="170" y="146" width="100" height="50" rx="6"/>
  <text class="ink sm b" x="220.0" y="166.5" text-anchor="middle">joblib.load</text>
  <text class="ink2 sm" x="220.0" y="184.5" text-anchor="middle">модель</text>
  <path class="ln" d="M272,171 L302,171" marker-end="url(#ah-golden-check)"/>
  <rect class="box" x="306" y="146" width="130" height="50" rx="6"/>
  <text class="ink sm b" x="371.0" y="166.5" text-anchor="middle">got</text>
  <text class="ink2 sm" x="371.0" y="184.5" text-anchor="middle">новые ответы</text>
  <path class="ln" d="M440,65 C480,65 480,110 500,118" marker-end="url(#ah-golden-check)"/>
  <path class="ln" d="M440,171 C480,171 480,130 500,124" marker-end="url(#ah-golden-check)"/>
  <rect class="box-warn" x="504" y="96" width="182" height="50" rx="6"/>
  <text class="ink sm b" x="595.0" y="125.5" text-anchor="middle">max |got − expected|</text>
  <rect class="box-ok" x="504" y="160" width="86" height="46" rx="4"/>
  <text class="ok b" x="547" y="180" text-anchor="middle">≈ 0</text>
  <text class="ok sm" x="547" y="198" text-anchor="middle">всё верно</text>
  <rect class="box-err" x="600" y="160" width="86" height="46" rx="4"/>
  <text class="err b" x="643" y="180" text-anchor="middle">0.01+</text>
  <text class="err sm" x="643" y="198" text-anchor="middle">разбираться</text>
  <text class="mut sm" x="350" y="236" text-anchor="middle">порог «нормального» расхождения задают с запасом, например 1e-9</text>
</svg>
