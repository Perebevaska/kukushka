<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-split-three">
  <title id="t-split-three">Три части данных: два вызова train_test_split</title>
  <defs><marker id="ah-split-three" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20.0" y="30" width="660.0" height="30" rx="4"/>
  <text class="ink sm b" x="350" y="50" text-anchor="middle">все доставки — 1 841</text>
  <text class="acc sm b" x="20" y="82" text-anchor="start">шаг 1: test_size=0.2</text>
  <rect class="box" x="20.0" y="92" width="523.7131993481803" height="30" rx="4"/>
  <text class="ink sm" x="283.85659967409015" y="112" text-anchor="middle">остаток — 1 472 (80 %)</text>
  <rect class="box-warn" x="547.7131993481803" y="92" width="132.2868006518197" height="30" rx="4"/>
  <text class="ink sm b" x="613.8565996740901" y="112" text-anchor="middle">test — 369</text>
  <text class="acc sm b" x="20" y="144" text-anchor="start">шаг 2: остаток, test_size=0.25</text>
  <rect class="box-acc" x="20.0" y="154" width="391.7848995111353" height="30" rx="4"/>
  <text class="ink sm b" x="217.89244975556764" y="174" text-anchor="middle">train — 1 104 (60 %)</text>
  <rect class="box-ok" x="415.7848995111353" y="154" width="127.92829983704502" height="30" rx="4"/>
  <text class="ink sm b" x="481.7490494296578" y="174" text-anchor="middle">valid — 368 (20 %)</text>
  <text class="ink2 sm" x="217.89244975556764" y="204" text-anchor="middle">модель учится</text>
  <text class="ink2 sm" x="481.7490494296578" y="204" text-anchor="middle">выбираем настройки</text>
  <text class="ink2 sm" x="613.8565996740901" y="204" text-anchor="middle">один раз в конце</text>
  <text class="mut sm" x="350" y="224" text-anchor="middle">четверть от 80 % — это 20 % всех данных</text>
</svg>
