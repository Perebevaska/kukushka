<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-func-call">
  <title id="t-func-call">Вызов функции: аргументы → параметры → return</title>
  <defs><marker id="ah-func-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20" y="40" width="170" height="40" rx="6"/>
  <text class="ink b" x="105.0" y="64.5" text-anchor="middle">discounted(250, 10)</text>
  <text class="mut sm" x="105" y="30" text-anchor="middle">вызов</text>
  <rect class="box-acc" x="240" y="22" width="260" height="168" rx="10"/>
  <text class="acc sm b" x="370" y="42" text-anchor="middle">рабочая комната вызова</text>
  <rect class="box" x="256" y="54" width="228" height="26" rx="4"/>
  <text class="ink sm" x="370" y="72" text-anchor="middle">price = 250</text>
  <rect class="box" x="256" y="86" width="228" height="26" rx="4"/>
  <text class="ink sm" x="370" y="104" text-anchor="middle">pct = 10</text>
  <rect class="box" x="256" y="118" width="228" height="26" rx="4"/>
  <text class="ink sm" x="370" y="136" text-anchor="middle">new_price = 250 × 0.9 = 225.0</text>
  <rect class="box-ok" x="256" y="150" width="228" height="26" rx="4"/>
  <text class="ink sm b" x="370" y="168" text-anchor="middle">return round(225.0) → 225</text>
  <path class="ln-acc" d="M192,60 L252,67" marker-end="url(#ah-func-call)"/>
  <text class="acc sm b" x="222" y="54" text-anchor="middle">250</text>
  <path class="ln-acc" d="M192,70 L252,98" marker-end="url(#ah-func-call)"/>
  <text class="acc sm b" x="208" y="98" text-anchor="middle">10</text>
  <path class="ln-acc" d="M486,163 L560,163" marker-end="url(#ah-func-call)"/>
  <rect class="box-ok" x="564" y="143" width="116" height="40" rx="6"/>
  <text class="ink b" x="622.0" y="167.5" text-anchor="middle">a = 225</text>
  <text class="mut sm" x="622" y="134" text-anchor="middle">наружу — только return</text>
  <text class="ink2 sm" x="370" y="214" text-anchor="middle">После return комната исчезает: price, pct, new_price снаружи не существуют (NameError).</text>
  <text class="mut sm" x="370" y="236" text-anchor="middle">Второй вызов discounted(190, 5) — новая комната: new_price = 180.5, вернёт 180.</text>
</svg>
