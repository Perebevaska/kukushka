<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-funnel-steps">
  <title id="t-funnel-steps">Воронка: доля от начала и конверсия шага</title>
  <defs><marker id="ah-funnel-steps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="30" y="40.0" width="120" height="110.0" rx="3"/>
  <text class="ink b" x="90.0" y="32.0" text-anchor="middle">100</text>
  <text class="ink2 sm b" x="90.0" y="168" text-anchor="middle">открыл</text>
  <text class="ink sm" x="90.0" y="190" text-anchor="middle">100 % от начала</text>
  <rect class="box-acc" x="162" y="62.0" width="120" height="88.0" rx="3"/>
  <text class="ink b" x="222.0" y="54.0" text-anchor="middle">80</text>
  <text class="ink2 sm b" x="222.0" y="168" text-anchor="middle">меню</text>
  <text class="ink sm" x="222.0" y="190" text-anchor="middle">80 % от начала</text>
  <text class="acc sm b" x="156" y="216" text-anchor="middle">→ 80 %</text>
  <rect class="box-acc" x="294" y="110.4" width="120" height="39.6" rx="3"/>
  <text class="ink b" x="354.0" y="102.4" text-anchor="middle">36</text>
  <text class="ink2 sm b" x="354.0" y="168" text-anchor="middle">корзина</text>
  <text class="ink sm" x="354.0" y="190" text-anchor="middle">36 % от начала</text>
  <text class="err sm b" x="288" y="216" text-anchor="middle">→ 45 %</text>
  <rect class="box-acc" x="426" y="121.4" width="120" height="28.6" rx="3"/>
  <text class="ink b" x="486.0" y="113.4" text-anchor="middle">26</text>
  <text class="ink2 sm b" x="486.0" y="168" text-anchor="middle">оплата</text>
  <text class="ink sm" x="486.0" y="190" text-anchor="middle">26 % от начала</text>
  <text class="acc sm b" x="420" y="216" text-anchor="middle">→ 72 %</text>
  <rect class="box-acc" x="558" y="126.9" width="120" height="23.099999999999998" rx="3"/>
  <text class="ink b" x="618.0" y="118.9" text-anchor="middle">21</text>
  <text class="ink2 sm b" x="618.0" y="168" text-anchor="middle">заказ</text>
  <text class="ink sm" x="618.0" y="190" text-anchor="middle">21 % от начала</text>
  <text class="acc sm b" x="552" y="216" text-anchor="middle">→ 81 %</text>
  <text class="mut sm" x="20" y="216" text-anchor="start">шаг:</text>
  <text class="ink2 sm" x="20" y="248" text-anchor="start">доля от начала = шаг / первый шаг; конверсия шага (→) = шаг / предыдущий: n / n.shift()</text>
  <text class="err sm b" x="20" y="270" text-anchor="start">самый большой обрыв — меню → корзина: дошли 45 % (36 из 80)</text>
  <text class="mut sm" x="350" y="292" text-anchor="middle">Условные 100 сессий. В журнале считают разные сессии (nunique), а не строки-события</text>
</svg>
