<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-clean-journal">
  <title id="t-clean-journal">Журнал очистки: сколько строк убрали на каждом шаге и почему</title>
  <defs><marker id="ah-clean-journal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20" y="30" width="150" height="110" rx="8"/>
  <text class="ink2 sm b" x="95" y="60" text-anchor="middle">выгрузка</text>
  <text class="ink b" x="95" y="90" text-anchor="middle">1 877</text>
  <text class="mut sm" x="95" y="118" text-anchor="middle">строк</text>
  <rect class="box-warn" x="190" y="30" width="150" height="110" rx="8"/>
  <text class="ink2 sm b" x="265" y="60" text-anchor="middle">− 25</text>
  <text class="ink sm b" x="265" y="90" text-anchor="middle">actual_min пустой</text>
  <text class="mut sm" x="265" y="118" text-anchor="middle">курьер не закрыл заказ</text>
  <rect class="box-warn" x="360" y="30" width="150" height="110" rx="8"/>
  <text class="ink2 sm b" x="435" y="60" text-anchor="middle">− 11</text>
  <text class="ink sm b" x="435" y="90" text-anchor="middle">0 минут или &gt; 299</text>
  <text class="mut sm" x="435" y="118" text-anchor="middle">невозможное время</text>
  <rect class="box-ok" x="530" y="30" width="150" height="110" rx="8"/>
  <text class="ink2 sm b" x="605" y="60" text-anchor="middle">осталось</text>
  <text class="ink b" x="605" y="90" text-anchor="middle">1 841</text>
  <text class="mut sm" x="605" y="118" text-anchor="middle">98 % выгрузки</text>
  <path class="ln" d="M172,85 L188,85" marker-end="url(#ah-clean-journal)"/>
  <path class="ln" d="M342,85 L358,85" marker-end="url(#ah-clean-journal)"/>
  <path class="ln" d="M512,85 L528,85" marker-end="url(#ah-clean-journal)"/>
  <text class="ink2" x="20" y="172" text-anchor="start">осталось 1 841 из 1 877 — 98 % выгрузки; убрано 36 строк (~2 %)</text>
  <text class="mut sm" x="20" y="200" text-anchor="start">Если бы убрали 30 %, любой вывод «опаздываем в 24 %» был бы под вопросом —</text>
  <text class="mut sm" x="20" y="218" text-anchor="start">журнал отвечает на «а вы ничего не выбросили?» до того, как его зададут</text>
</svg>
