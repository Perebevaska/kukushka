<svg viewBox="0 0 700 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-value-ten-guests">
  <title id="t-value-ten-guests">Десять гостей на шкале риска: что добавляет порог 1/3</title>
  <defs><marker id="ah-value-ten-guests" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="250.0" y="46" width="100.0" height="96" rx="0"/>
  <path class="ln dash" d="M350.0,40 L350.0,150"/>
  <path class="ln-acc dash" d="M250.0,40 L250.0,150"/>
  <path class="ln" d="M350.0,84 L350.0,78 L650,78 L650,84"/>
  <text class="ink2 sm b" x="500.0" y="70" text-anchor="middle">порог 0.5 → бонус A, B, C</text>
  <path class="ln-acc" d="M250.0,38 L250.0,32 L650,32 L650,38"/>
  <text class="acc sm b" x="450.0" y="24" text-anchor="middle">порог 1/3 → бонус ещё D, E, F</text>
  <circle class="box-warn" cx="60" cy="20" r="8"/>
  <text class="ink2 sm" x="74" y="24" text-anchor="start">ушёл</text>
  <circle class="box" cx="122" cy="20" r="8"/>
  <text class="ink2 sm" x="136" y="24" text-anchor="start">остался</text>
  <path class="ln" d="M50,150 L650,150"/>
  <path class="ln" d="M50,150 L50,155"/>
  <text class="mut sm" x="50" y="170" text-anchor="middle">0</text>
  <path class="ln" d="M170.0,150 L170.0,155"/>
  <text class="mut sm" x="170.0" y="170" text-anchor="middle">0.2</text>
  <path class="ln" d="M290.0,150 L290.0,155"/>
  <text class="mut sm" x="290.0" y="170" text-anchor="middle">0.4</text>
  <path class="ln" d="M410.0,150 L410.0,155"/>
  <text class="mut sm" x="410.0" y="170" text-anchor="middle">0.6</text>
  <path class="ln" d="M530.0,150 L530.0,155"/>
  <text class="mut sm" x="530.0" y="170" text-anchor="middle">0.8</text>
  <path class="ln" d="M650,150 L650,155"/>
  <text class="mut sm" x="650" y="170" text-anchor="middle">1</text>
  <text class="acc sm b" x="250.0" y="170" text-anchor="middle">1/3</text>
  <text class="mut sm" x="654" y="140" text-anchor="start">p</text>
  <circle class="box-warn" cx="590.0" cy="118" r="11"/>
  <text class="ink sm b" x="590.0" y="122" text-anchor="middle">A</text>
  <circle class="box-warn" cx="530.0" cy="118" r="11"/>
  <text class="ink sm b" x="530.0" y="122" text-anchor="middle">B</text>
  <circle class="box" cx="410.0" cy="118" r="11"/>
  <text class="ink sm b" x="410.0" y="122" text-anchor="middle">C</text>
  <circle class="box-warn" cx="320.0" cy="118" r="11"/>
  <text class="ink sm b" x="320.0" y="122" text-anchor="middle">D</text>
  <circle class="box" cx="290.0" cy="118" r="11"/>
  <text class="ink sm b" x="290.0" y="122" text-anchor="middle">E</text>
  <circle class="box-warn" cx="260.0" cy="118" r="11"/>
  <text class="ink sm b" x="260.0" y="122" text-anchor="middle">F</text>
  <circle class="box" cx="230.0" cy="118" r="11"/>
  <text class="ink sm b" x="230.0" y="122" text-anchor="middle">G</text>
  <circle class="box" cx="170.0" cy="118" r="11"/>
  <text class="ink sm b" x="170.0" y="122" text-anchor="middle">H</text>
  <circle class="box" cx="110.0" cy="118" r="11"/>
  <text class="ink sm b" x="110.0" y="122" text-anchor="middle">I</text>
  <circle class="box" cx="80.0" cy="118" r="11"/>
  <text class="ink sm b" x="80.0" y="122" text-anchor="middle">J</text>
  <text class="ink sm" x="50" y="202" text-anchor="start"><tspan class="ink2 b">порог 0.5:  </tspan>TP 2 (A, B), FP 1 (C)  →  2 × 400 − 1 × 200 = <tspan class="b">600 ₽</tspan></text>
  <text class="ink sm" x="50" y="226" text-anchor="start"><tspan class="acc b">порог 1/3:  </tspan>TP 4, FP 2  →  4 × 400 − 2 × 200 = <tspan class="ok b">1 200 ₽</tspan><tspan class="ink2">   (D и F приносят 2 × 600, три бонуса стоят 600: +600 ₽)</tspan></text>
  <text class="mut sm" x="50" y="252" text-anchor="start">G (0.30) порог 1/3 не берёт: 0.30 × 600 − 200 = −20 ₽ в среднем — бонус ему невыгоден</text>
  <text class="mut sm" x="50" y="274" text-anchor="start">выделенная полоса — гости между 1/3 и 0.5: их бонус окупается, хотя модель «не уверена»</text>
</svg>
