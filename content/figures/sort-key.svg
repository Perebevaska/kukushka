  <rect class="box" x="20" y="118" width="150" height="30" rx="4"/>
  <text class="ink sm" x="95" y="138" text-anchor="middle">Латте</text>
  <rect class="box-acc" x="300" y="118" width="60" height="30" rx="4"/>
  <text class="ink b" x="330" y="138" text-anchor="middle">5</text>
