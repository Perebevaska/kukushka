  <text class="ink sm" x="590" y="178" text-anchor="middle">Американо  (9)</text>
  <text class="ink2 sm" x="350" y="212" text-anchor="middle">При равном признаке (9 и 9) сохраняется исходный порядок: «Флэт уайт» раньше «Американо».</text>
