<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sort-key">
  <title id="t-sort-key">sorted с key: сортировка по признаку, а не по самим значениям</title>
  <defs><marker id="ah-sort-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="20" y="26" text-anchor="start">drinks</text>
  <text class="acc sm b" x="330" y="26" text-anchor="middle">key=len</text>
  <text class="mut sm" x="570" y="26" text-anchor="middle">sorted(drinks, key=len)</text>
  <rect class="box" x="20" y="38" width="150" height="30" rx="4"/>
