<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-train-test">
  <title id="t-train-test">Разбиение данных на обучающую и тестовую части</title>
  <defs>
    <marker id="ah-train-test" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <text class="mut sm" x="20" y="22">Все доставки — 1841 строка</text>
  <rect class="box-acc" x="20" y="32" width="540" height="44" rx="6"/>
  <rect class="box-warn" x="560" y="32" width="180" height="44" rx="6"/>
  <text class="ink b" x="290" y="59" text-anchor="middle">Обучение (train) — 75 %, 1380 строк</text>
  <text class="ink b" x="650" y="59" text-anchor="middle">Тест — 25 %, 461</text>

  <path class="ln" d="M290,78 V118" marker-end="url(#ah-train-test)"/>
  <path class="ln" d="M650,78 V118" marker-end="url(#ah-train-test)"/>

  <rect class="box" x="150" y="122" width="280" height="54" rx="8"/>
  <text class="ink b" x="290" y="145" text-anchor="middle">model.fit(X_train, y_train)</text>
  <text class="ink2 sm" x="290" y="164" text-anchor="middle">модель видит и признаки, и ответы</text>

  <rect class="box" x="520" y="122" width="220" height="54" rx="8"/>
  <text class="ink b" x="630" y="145" text-anchor="middle">model.score(X_test, y_test)</text>
  <text class="ink2 sm" x="630" y="164" text-anchor="middle">ответы теста — только для оценки</text>

  <path class="ln" d="M432,149 H516" marker-end="url(#ah-train-test)"/>
  <text class="mut sm" x="474" y="140" text-anchor="middle">обученная</text>
  <text class="mut sm" x="474" y="168" text-anchor="middle">модель</text>

  <text class="ink2" x="290" y="212" text-anchor="middle">Качество на обучении — «как хорошо выучила»</text>
  <text class="ink2" x="630" y="212" text-anchor="middle">Качество на тесте — «как модель</text>
  <text class="ink2" x="630" y="232" text-anchor="middle">будет работать на новых заказах»</text>
</svg>
