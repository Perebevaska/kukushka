<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-dup-keep">
  <title id="t-dup-keep">duplicated() с разными keep: какие строки считаются лишними</title>
  <defs><marker id="ah-dup-keep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="70" y="46" width="616" height="28" rx="3"/>
  <text class="ink2 sm b" x="98.0" y="64.5" text-anchor="middle"></text>
  <text class="ink2 sm b" x="161.0" y="64.5" text-anchor="middle">id</text>
  <text class="ink2 sm b" x="231.0" y="64.5" text-anchor="middle">v</text>
  <text class="ink2 sm b" x="336.0" y="64.5" text-anchor="middle">keep="first"</text>
  <text class="ink2 sm b" x="476.0" y="64.5" text-anchor="middle">keep="last"</text>
  <text class="ink2 sm b" x="616.0" y="64.5" text-anchor="middle">keep=False</text>
  <rect class="box-acc" x="70" y="76" width="616" height="28" rx="3"/>
  <text class="ink sm" x="98.0" y="94.5" text-anchor="middle">0</text>
  <text class="ink sm" x="161.0" y="94.5" text-anchor="middle">A</text>
  <text class="ink sm" x="231.0" y="94.5" text-anchor="middle">1</text>
  <text class="mut sm" x="336.0" y="94.5" text-anchor="middle">False</text>
  <text class="err sm b" x="476.0" y="94.5" text-anchor="middle">True</text>
  <text class="err sm b" x="616.0" y="94.5" text-anchor="middle">True</text>
  <rect class="box" x="70" y="106" width="616" height="28" rx="3"/>
  <text class="ink sm" x="98.0" y="124.5" text-anchor="middle">1</text>
  <text class="ink sm" x="161.0" y="124.5" text-anchor="middle">B</text>
  <text class="ink sm" x="231.0" y="124.5" text-anchor="middle">2</text>
  <text class="mut sm" x="336.0" y="124.5" text-anchor="middle">False</text>
  <text class="mut sm" x="476.0" y="124.5" text-anchor="middle">False</text>
  <text class="mut sm" x="616.0" y="124.5" text-anchor="middle">False</text>
  <rect class="box-acc" x="70" y="136" width="616" height="28" rx="3"/>
  <text class="ink sm" x="98.0" y="154.5" text-anchor="middle">2</text>
  <text class="ink sm" x="161.0" y="154.5" text-anchor="middle">A</text>
  <text class="ink sm" x="231.0" y="154.5" text-anchor="middle">1</text>
  <text class="err sm b" x="336.0" y="154.5" text-anchor="middle">True</text>
  <text class="mut sm" x="476.0" y="154.5" text-anchor="middle">False</text>
  <text class="err sm b" x="616.0" y="154.5" text-anchor="middle">True</text>
  <rect class="box" x="70" y="166" width="616" height="28" rx="3"/>
  <text class="ink sm" x="98.0" y="184.5" text-anchor="middle">3</text>
  <text class="ink sm" x="161.0" y="184.5" text-anchor="middle">A</text>
  <text class="ink sm" x="231.0" y="184.5" text-anchor="middle">5</text>
  <text class="mut sm" x="336.0" y="184.5" text-anchor="middle">False</text>
  <text class="mut sm" x="476.0" y="184.5" text-anchor="middle">False</text>
  <text class="mut sm" x="616.0" y="184.5" text-anchor="middle">False</text>
  <text class="mut sm b" x="173" y="34" text-anchor="middle">таблица</text>
  <text class="acc sm b" x="488" y="20" text-anchor="middle">df.duplicated(keep=…)</text>
  <text class="mut sm" x="348" y="34" text-anchor="middle">по умолчанию</text>
  <text class="mut sm" x="488" y="34" text-anchor="middle">оригинал — последний</text>
  <text class="mut sm" x="628" y="34" text-anchor="middle">все копии</text>
  <text class="acc sm" x="12" y="95" text-anchor="start">копии →</text>
  <text class="acc sm" x="12" y="155" text-anchor="start">копии →</text>
  <text class="ink2 sm" x="350" y="218" text-anchor="middle">строки 0 и 2 совпадают целиком; строка 3 повторяет только id — это не полный дубль</text>
  <text class="ink2 sm" x="350" y="240" text-anchor="middle">True — «лишняя»: duplicated().sum() считает лишние, drop_duplicates(keep=…) их удаляет</text>
  <text class="mut sm" x="350" y="260" text-anchor="middle">keep=False ничего не оставляет «оригиналом» — удобно, чтобы посмотреть на все повторы</text>
</svg>
