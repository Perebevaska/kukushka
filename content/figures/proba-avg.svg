<svg viewBox="0 0 700 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-proba-avg">
  <title id="t-proba-avg">Голоса деревьев и среднее вероятностей могут дать разный ответ</title>
  <defs><marker id="ah-proba-avg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-err" x="20" y="30" width="96" height="48" rx="6"/>
  <text class="ink2 sm" x="68.0" y="50.0" text-anchor="middle">дерево 1</text>
  <text class="ink sm b" x="68.0" y="67.0" text-anchor="middle">p = 0.9</text>
  <rect class="box-ok" x="130" y="30" width="96" height="48" rx="6"/>
  <text class="ink2 sm" x="178.0" y="50.0" text-anchor="middle">дерево 2</text>
  <text class="ink sm b" x="178.0" y="67.0" text-anchor="middle">p = 0.4</text>
  <rect class="box-ok" x="240" y="30" width="96" height="48" rx="6"/>
  <text class="ink2 sm" x="288.0" y="50.0" text-anchor="middle">дерево 3</text>
  <text class="ink sm b" x="288.0" y="67.0" text-anchor="middle">p = 0.4</text>
  <path class="ln" d="M350,54 L390,34" marker-end="url(#ah-proba-avg)"/>
  <path class="ln" d="M350,54 L390,108" marker-end="url(#ah-proba-avg)"/>
  <rect class="box" x="394" y="14" width="286" height="44" rx="6"/>
  <text class="ink2 sm" x="537.0" y="32.0" text-anchor="middle">голоса: «опоздает» 1 из 3</text>
  <text class="ink sm b" x="537.0" y="49.0" text-anchor="middle">→ большинство «вовремя»</text>
  <rect class="box-acc" x="394" y="86" width="286" height="44" rx="6"/>
  <text class="ink2 sm" x="537.0" y="104.0" text-anchor="middle">среднее: 0.57 &gt; 0.5</text>
  <text class="ink sm b" x="537.0" y="121.0" text-anchor="middle">→ лес sklearn: «опоздает»</text>
  <text class="mut sm" x="350" y="158" text-anchor="middle">уверенность первого дерева перевесила сомнения двух других — predict_proba леса усредняет вероятности</text>
</svg>
