<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-churn-timeline">
  <title id="t-churn-timeline">Срез на 1 октября: признаки из прошлого, ответ из будущего</title>
  <defs><marker id="ah-churn-timeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <path class="ln" d="M30.0,120 L674.0,120" marker-end="url(#ah-churn-timeline)"/>
  <rect class="box-ok" x="40.0" y="46" width="368.0" height="60" rx="6"/>
  <text class="ink sm b" x="226.0" y="68" text-anchor="middle">последние 90 дней → признаки</text>
  <text class="ink2 sm" x="226.0" y="88" text-anchor="middle">визиты, давность, чек, жалобы…</text>
  <rect class="box-warn" x="416.0" y="46" width="244.0" height="60" rx="6"/>
  <text class="ink sm b" x="538.0" y="68" text-anchor="middle">60 дней → ответ</text>
  <text class="ink2 sm" x="538.0" y="88" text-anchor="middle">ушёл ли гость (churned)</text>
  <path class="ln-acc dash" d="M412.0,30 L412.0,130"/>
  <text class="acc sm b" x="412.0" y="24" text-anchor="middle">★ срез: решаем, кому бонус</text>
  <text class="ink2 sm" x="40.0" y="146" text-anchor="middle">3 июля</text>
  <text class="ink2 sm" x="412.0" y="146" text-anchor="middle">1 октября</text>
  <text class="ink2 sm" x="660.0" y="146" text-anchor="middle">30 ноября</text>
  <rect class="box-err" x="420" y="168" width="260" height="44" rx="6"/>
  <text class="ink sm b" x="550.0" y="186.0" text-anchor="middle">признак, который заполняют</text>
  <text class="ink2 sm" x="550.0" y="203.0" text-anchor="middle">после среза → утечка, не берём</text>
  <path class="ln-err" d="M550,168 L550,124" marker-end="url(#ah-churn-timeline)"/>
  <text class="ink2 sm" x="226.0" y="196" text-anchor="middle">в X — только то, что известно</text>
  <text class="ink2 sm" x="226.0" y="212" text-anchor="middle">к моменту среза</text>
</svg>
