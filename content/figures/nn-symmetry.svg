<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-symmetry">
  <title id="t-nn-symmetry">Одинаковые начальные веса дают одинаковые градиенты, и нейроны остаются копиями</title>
  <defs><marker id="ah-nn-symmetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="180" y="26" text-anchor="middle">одинаковые начальные веса</text>
  <text class="mut sm b" x="165" y="52" text-anchor="middle">нейрон 1</text>
  <text class="mut sm b" x="285" y="52" text-anchor="middle">нейрон 2</text>
  <text class="ink2 sm" x="102" y="101" text-anchor="end">до шага</text>
  <rect class="box" x="110" y="76" width="110" height="40" rx="6"/>
  <text class="ink sm" x="165" y="101" text-anchor="middle">(0.300, −0.100)</text>
  <rect class="box" x="230" y="76" width="110" height="40" rx="6"/>
  <text class="ink sm" x="285" y="101" text-anchor="middle">(0.300, −0.100)</text>
  <path class="ln-mut" d="M165,116 L165,136" marker-end="url(#ah-nn-symmetry)"/>
  <path class="ln-mut" d="M285,116 L285,136" marker-end="url(#ah-nn-symmetry)"/>
  <text class="ink2 sm" x="102" y="163" text-anchor="end">градиент</text>
  <rect class="box-err" x="110" y="138" width="110" height="40" rx="6"/>
  <text class="ink sm" x="165" y="163" text-anchor="middle">(−0.238, −0.475)</text>
  <rect class="box-err" x="230" y="138" width="110" height="40" rx="6"/>
  <text class="ink sm" x="285" y="163" text-anchor="middle">(−0.238, −0.475)</text>
  <path class="ln" d="M165,178 L165,198" marker-end="url(#ah-nn-symmetry)"/>
  <path class="ln" d="M285,178 L285,198" marker-end="url(#ah-nn-symmetry)"/>
  <text class="ink2 sm" x="102" y="225" text-anchor="end">после шага</text>
  <rect class="box" x="110" y="200" width="110" height="40" rx="6"/>
  <text class="ink sm" x="165" y="225" text-anchor="middle">(0.419, 0.138)</text>
  <rect class="box" x="230" y="200" width="110" height="40" rx="6"/>
  <text class="ink sm" x="285" y="225" text-anchor="middle">(0.419, 0.138)</text>
  <text class="err sm b" x="210" y="270" text-anchor="middle">копии на каждом шаге: слой работает</text>
  <text class="err sm" x="210" y="288" text-anchor="middle">как один нейрон (нули — частный случай)</text>
  <text class="ink b" x="525" y="26" text-anchor="middle">случайные начальные веса</text>
  <text class="mut sm b" x="510" y="52" text-anchor="middle">нейрон 1</text>
  <text class="mut sm b" x="630" y="52" text-anchor="middle">нейрон 2</text>
  <text class="ink2 sm" x="447" y="101" text-anchor="end">до шага</text>
  <rect class="box" x="455" y="76" width="110" height="40" rx="6"/>
  <text class="ink sm" x="510" y="101" text-anchor="middle">(0.300, −0.100)</text>
  <rect class="box" x="575" y="76" width="110" height="40" rx="6"/>
  <text class="ink sm" x="630" y="101" text-anchor="middle">(−0.200, 0.400)</text>
  <path class="ln-mut" d="M510,116 L510,136" marker-end="url(#ah-nn-symmetry)"/>
  <path class="ln-mut" d="M630,116 L630,136" marker-end="url(#ah-nn-symmetry)"/>
  <text class="ink2 sm" x="447" y="163" text-anchor="end">градиент</text>
  <rect class="box-ok" x="455" y="138" width="110" height="40" rx="6"/>
  <text class="ink sm" x="510" y="163" text-anchor="middle">(−0.266, −0.532)</text>
  <rect class="box-ok" x="575" y="138" width="110" height="40" rx="6"/>
  <text class="ink sm" x="630" y="163" text-anchor="middle">(0.160, 0.319)</text>
  <path class="ln" d="M510,178 L510,198" marker-end="url(#ah-nn-symmetry)"/>
  <path class="ln" d="M630,178 L630,198" marker-end="url(#ah-nn-symmetry)"/>
  <text class="ink2 sm" x="447" y="225" text-anchor="end">после шага</text>
  <rect class="box" x="455" y="200" width="110" height="40" rx="6"/>
  <text class="ink sm" x="510" y="225" text-anchor="middle">(0.433, 0.166)</text>
  <rect class="box" x="575" y="200" width="110" height="40" rx="6"/>
  <text class="ink sm" x="630" y="225" text-anchor="middle">(−0.280, 0.240)</text>
  <text class="ok sm b" x="555" y="270" text-anchor="middle">разные градиенты: каждый нейрон</text>
  <text class="ok sm" x="555" y="288" text-anchor="middle">учит свой признак</text>
  <path class="ln-mut" d="M350,40 L350,290"/>
</svg>
