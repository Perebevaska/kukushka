<svg viewBox="0 0 700 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-version-decisions">
  <title id="t-version-decisions">Перед выпуском 1.1: кто попадает в акцию при пороге 1/3 у версии 1.0 и у версии 1.1 (тест, 600 гостей)</title>
  <defs><marker id="ah-version-decisions" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="370" y="30" text-anchor="middle">версия 1.1 (лес)</text>
  <text class="ink2 sm" x="295.0" y="52" text-anchor="middle">в акции</text>
  <text class="ink2 sm" x="445.0" y="52" text-anchor="middle">не в акции</text>
  <text class="ink2 sm" x="208" y="93.0" text-anchor="end">в акции</text>
  <text class="ink2 sm" x="208" y="149.0" text-anchor="end">не в акции</text>
  <text class="ink2 sm b" x="60" y="121" text-anchor="middle">версия 1.0</text>
  <rect class="box-ok" x="220" y="60" width="146" height="52" rx="4"/>
  <text class="ink b" x="295.0" y="84" text-anchor="middle">119</text>
  <text class="ink2 sm" x="295.0" y="102" text-anchor="middle">оба: в акции</text>
  <rect class="box-err" x="370" y="60" width="146" height="52" rx="4"/>
  <text class="ink b" x="445.0" y="84" text-anchor="middle">5</text>
  <text class="ink2 sm" x="445.0" y="102" text-anchor="middle">выпадут</text>
  <rect class="box-err" x="220" y="116" width="146" height="52" rx="4"/>
  <text class="ink b" x="295.0" y="140" text-anchor="middle">49</text>
  <text class="ink2 sm" x="295.0" y="158" text-anchor="middle">добавятся</text>
  <rect class="box" x="370" y="116" width="146" height="52" rx="4"/>
  <text class="ink b" x="445.0" y="140" text-anchor="middle">427</text>
  <text class="ink2 sm" x="445.0" y="158" text-anchor="middle">оба: нет</text>
  <text class="ink sm" x="560" y="80" text-anchor="start">в акции: 1.0 — 124,</text>
  <text class="ink sm" x="560" y="98" text-anchor="start">1.1 — 168</text>
  <text class="err sm b" x="560" y="130" text-anchor="start">решение изменилось</text>
  <text class="err sm b" x="560" y="148" text-anchor="start">у 54 из 600 ≈ 9 %</text>
  <text class="ink2 sm" x="350" y="200" text-anchor="middle">AUC 1.1 выше (0.923 против 0.896), но при том же пороге лес зовёт в акцию заметно больше гостей:</text>
  <text class="ink2 sm" x="350" y="218" text-anchor="middle">порог пересчитывают, маркетинг предупреждают о бюджете</text>
</svg>
