<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-knn-abc">
  <title id="t-knn-abc">Кто сосед гостя A: в рублях и днях или в отклонениях</title>
  <defs><marker id="ah-knn-abc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="180" y="22" text-anchor="middle">сырые единицы: 1 ₽ = 1 день</text>
  <path class="ln" d="M50,250 L330,250"/>
  <path class="ln" d="M50,250 L50,40"/>
  <text class="mut sm" x="330" y="268" text-anchor="end">средний чек →</text>
  <text class="mut sm" x="56" y="50" text-anchor="start">дней без визита ↑</text>
  <path class="ln-mut dash" d="M83.0,228.0 L259.0,223.6"/>
  <path class="ln-acc" d="M83.0,228.0 L105.0,96.0"/>
  <circle class="acc" cx="83.0" cy="228.0" r="7"/>
  <text class="ink b" x="93.0" y="220.0" text-anchor="start">A</text>
  <circle class="mut" cx="259.0" cy="223.6" r="7"/>
  <text class="ink b" x="269.0" y="215.6" text-anchor="start">B</text>
  <circle class="ok" cx="105.0" cy="96.0" r="7"/>
  <text class="ink b" x="115.0" y="88.0" text-anchor="start">C</text>
  <text class="ink sm b" x="190" y="280" text-anchor="middle">A–B = 80.0,  A–C = 60.8</text>
  <text class="err sm b" x="190" y="300" text-anchor="middle">ближайший сосед A — C</text>
  <text class="ink b" x="525" y="22" text-anchor="middle">в отклонениях: чек / 120, дни / 35</text>
  <path class="ln" d="M395,250 L675,250"/>
  <path class="ln" d="M395,250 L395,40"/>
  <text class="mut sm" x="675" y="268" text-anchor="end">средний чек →</text>
  <text class="mut sm" x="401" y="50" text-anchor="start">дней без визита ↑</text>
  <path class="ln-acc" d="M406.2,224.3 L466.2,219.1"/>
  <path class="ln-mut dash" d="M406.2,224.3 L413.8,70.0"/>
  <circle class="acc" cx="406.2" cy="224.3" r="7"/>
  <text class="ink b" x="416.2" y="216.3" text-anchor="start">A</text>
  <circle class="ok" cx="466.2" cy="219.1" r="7"/>
  <text class="ink b" x="476.2" y="211.1" text-anchor="start">B</text>
  <circle class="mut" cx="413.8" cy="70.0" r="7"/>
  <text class="ink b" x="423.8" y="62.0" text-anchor="start">C</text>
  <text class="ink sm b" x="535" y="280" text-anchor="middle">A–B = 0.67,  A–C = 1.72</text>
  <text class="ok sm b" x="535" y="300" text-anchor="middle">ближайший сосед A — B</text>
  <text class="mut sm" x="350" y="324" text-anchor="middle">в сырых единицах 80 ₽ «дальше», чем 60 дней; после деления на разброс B снова рядом с A</text>
</svg>
