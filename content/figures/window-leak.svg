<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-window-leak">
  <title id="t-window-leak">Окно признака шире среза — утечка</title>
  <defs><marker id="ah-window-leak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <path class="ln" d="M40.0,196 L660.0,196" marker-end="url(#ah-window-leak)"/>
  <rect class="box-warn" x="408.0" y="30" width="240.0" height="160" rx="4"/>
  <text class="ink sm b" x="528.0" y="46" text-anchor="middle">окно ответа: ушёл ли</text>
  <rect class="box-ok" x="48.0" y="70" width="360.0" height="34" rx="4"/>
  <text class="ink sm b" x="228.0" y="92" text-anchor="middle">визиты за 90 дней на 1 октября — честно</text>
  <rect class="box-err" x="292.0" y="130" width="360.0" height="34" rx="4"/>
  <text class="ink sm b" x="472.0" y="152" text-anchor="middle">визиты за 90 дней на 1 декабря — утечка</text>
  <path class="ln-acc dash" d="M408.0,24 L408.0,200"/>
  <text class="ink2 sm" x="48.0" y="216" text-anchor="middle">3 июля</text>
  <text class="ink2 sm" x="408.0" y="216" text-anchor="middle">1 октября</text>
  <text class="ink2 sm" x="648.0" y="216" text-anchor="middle">30 ноября</text>
  <path class="ln-err dash" d="M652.0,168 L652.0,222"/>
  <text class="err sm" x="648.0" y="236" text-anchor="end">выгрузка 1 декабря</text>
  <text class="acc sm b" x="408.0" y="18" text-anchor="middle">★ срез</text>
  <text class="mut sm" x="350" y="260" text-anchor="middle">второе окно залезает в те 60 дней, по которым определяют уход: ноль визитов там — почти сам ответ</text>
</svg>
