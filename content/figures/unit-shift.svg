<svg viewBox="0 0 700 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-unit-shift">
  <title id="t-unit-shift">Одни и те же 2 часа в часах и в минутах — глазами модели</title>
  <defs><marker id="ah-unit-shift" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="350" y="22" text-anchor="middle">StandardScaler запомнил: среднее 4.6 ч, разброс 5.4 ч · вес признака −2.0 на одно стандартное отклонение</text>
  <rect class="box-ok" x="14" y="44" width="112" height="44" rx="6"/>
  <text class="ink b" x="70.0" y="71" text-anchor="middle">2 часа</text>
  <path class="ln" d="M128,66 L146,66" marker-end="url(#ah-unit-shift)"/>
  <rect class="box" x="148" y="44" width="188" height="44" rx="6"/>
  <text class="ink sm" x="242.0" y="71" text-anchor="middle">z = (2 − 4.6) / 5.4 ≈ −0.48</text>
  <path class="ln" d="M338,66 L356,66" marker-end="url(#ah-unit-shift)"/>
  <rect class="box" x="358" y="44" width="192" height="44" rx="6"/>
  <text class="ink sm b" x="454.0" y="71" text-anchor="middle">вклад = −2.0 × (−0.48) ≈ +1</text>
  <path class="ln" d="M552,66 L570,66" marker-end="url(#ah-unit-shift)"/>
  <rect class="box-ok" x="572" y="44" width="118" height="44" rx="6"/>
  <text class="ok sm b" x="631.0" y="71" text-anchor="middle">обычный прогноз</text>
  <rect class="box-err" x="14" y="114" width="112" height="44" rx="6"/>
  <text class="ink b" x="70.0" y="141" text-anchor="middle">120 (минуты!)</text>
  <path class="ln" d="M128,136 L146,136" marker-end="url(#ah-unit-shift)"/>
  <rect class="box" x="148" y="114" width="188" height="44" rx="6"/>
  <text class="ink sm" x="242.0" y="141" text-anchor="middle">z = (120 − 4.6) / 5.4 ≈ 21.3</text>
  <path class="ln" d="M338,136 L356,136" marker-end="url(#ah-unit-shift)"/>
  <rect class="box" x="358" y="114" width="192" height="44" rx="6"/>
  <text class="ink sm b" x="454.0" y="141" text-anchor="middle">вклад = −2.0 × 21.3 ≈ −43</text>
  <path class="ln" d="M552,136 L570,136" marker-end="url(#ah-unit-shift)"/>
  <rect class="box-err" x="572" y="114" width="118" height="44" rx="6"/>
  <text class="err sm b" x="631.0" y="141" text-anchor="middle">прогноз ≈ 0</text>
  <text class="err sm" x="242" y="172" text-anchor="middle">«на 21 стандартное отклонение медленнее»</text>
  <text class="ink2 sm" x="350" y="204" text-anchor="middle">разница в логите ≈ 44: заявка с прогнозом 0.9 получает вероятность порядка 10⁻¹⁸</text>
  <text class="mut sm" x="350" y="224" text-anchor="middle">модель не «ошиблась» — она применила свою формулу к числам, смысл которых поменялся</text>
</svg>
