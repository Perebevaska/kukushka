<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-vec-fit-transform">
  <title id="t-vec-fit-transform">Векторайзер: словарь и idf — по обучающим текстам, к тестовым только transform</title>
  <defs><marker id="ah-vec-fit-transform" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="14" y="40" width="200" height="90" rx="6"/>
  <text class="ink sm b" x="114.0" y="62.5" text-anchor="middle">обучающие тексты</text>
  <text class="ink2 sm" x="114.0" y="80.5" text-anchor="middle">«кофе вкусный»</text>
  <text class="ink2 sm" x="114.0" y="98.5" text-anchor="middle">«кофе горький»</text>
  <text class="ink2 sm" x="114.0" y="116.5" text-anchor="middle">«кофе вкусный вкусный»</text>
  <path class="ln" d="M216,85 L260,85" marker-end="url(#ah-vec-fit-transform)"/>
  <text class="acc sm b" x="238" y="76" text-anchor="middle">fit</text>
  <rect class="box-ok" x="264" y="30" width="210" height="110" rx="6"/>
  <text class="ink sm b" x="369" y="52" text-anchor="middle">выучено при fit</text>
  <text class="ink sm" x="290" y="76" text-anchor="start">вкусный</text>
  <text class="ink2 sm" x="450" y="76" text-anchor="end">idf 1.29</text>
  <text class="ink sm" x="290" y="96" text-anchor="start">горький</text>
  <text class="ink2 sm" x="450" y="96" text-anchor="end">idf 1.69</text>
  <text class="ink sm" x="290" y="116" text-anchor="start">кофе</text>
  <text class="ink2 sm" x="450" y="116" text-anchor="end">idf 1.00</text>
  <text class="sm" x="369" y="134" text-anchor="middle"></text>
  <rect class="box-warn" x="14" y="170" width="200" height="56" rx="6"/>
  <text class="ink sm b" x="114.0" y="193.5" text-anchor="middle">тестовый текст</text>
  <text class="ink2 sm" x="114.0" y="211.5" text-anchor="middle">«горький кофе остыл»</text>
  <path class="ln" d="M216,198 L300,198" marker-end="url(#ah-vec-fit-transform)"/>
  <text class="acc sm b" x="258" y="190" text-anchor="middle">transform</text>
  <path class="ln-acc dash" d="M369,142 L369,176" marker-end="url(#ah-vec-fit-transform)"/>
  <text class="acc sm" x="376" y="162" text-anchor="start">тот же словарь</text>
  <text class="mut sm" x="339" y="180" text-anchor="middle">вкусный</text>
  <rect class="box" x="304" y="184" width="70" height="28" rx="3"/>
  <text class="mut sm" x="339" y="203" text-anchor="middle">0</text>
  <text class="mut sm" x="413" y="180" text-anchor="middle">горький</text>
  <rect class="box-acc" x="378" y="184" width="70" height="28" rx="3"/>
  <text class="ink sm b" x="413" y="203" text-anchor="middle">0.86</text>
  <text class="mut sm" x="487" y="180" text-anchor="middle">кофе</text>
  <rect class="box-acc" x="452" y="184" width="70" height="28" rx="3"/>
  <text class="ink sm b" x="487" y="203" text-anchor="middle">0.51</text>
  <rect class="box-err dash" x="536" y="184" width="150" height="28" rx="3"/>
  <text class="err sm b" x="611" y="203" text-anchor="middle">«остыл» пропущено</text>
  <text class="err sm" x="611" y="230" text-anchor="middle">его нет в словаре</text>
  <text class="ink2 sm" x="350" y="258" text-anchor="middle">новое слово тест молча пропускает; fit на тесте сменил бы словарь и idf — это утечка</text>
</svg>
