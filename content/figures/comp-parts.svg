<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-comp-parts">
  <title id="t-comp-parts">Цикл и генератор списка: те же три части, другой порядок</title>
  <defs><marker id="ah-comp-parts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="20" y="24" text-anchor="start">цикл</text>
  <text class="ink sm" x="30" y="50" text-anchor="start">result = []</text>
  <rect class="box-ok" x="20" y="62" width="290" height="26" rx="4"/>
  <text class="ink sm" x="30" y="80" text-anchor="start">for p in prices:</text>
  <rect class="box-warn" x="48" y="92" width="262" height="26" rx="4"/>
  <text class="ink sm" x="58" y="110" text-anchor="start">if p &lt; 250:</text>
  <rect class="box-acc" x="76" y="122" width="234" height="26" rx="4"/>
  <text class="ink sm" x="86" y="140" text-anchor="start">result.append(round(p * 1.1))</text>
  <rect class="box-acc" x="380" y="46" width="22" height="20" rx="3"/>
  <text class="ink2 sm" x="412" y="61" text-anchor="start">1. что положить в список</text>
  <rect class="box-ok" x="380" y="76" width="22" height="20" rx="3"/>
  <text class="ink2 sm" x="412" y="91" text-anchor="start">2. откуда брать элементы</text>
  <rect class="box-warn" x="380" y="106" width="22" height="20" rx="3"/>
  <text class="ink2 sm" x="412" y="121" text-anchor="start">3. условие-фильтр</text>
  <text class="mut sm b" x="20" y="172" text-anchor="start">генератор списка</text>
  <text class="ink b" x="136.0" y="207" text-anchor="middle">[</text>
  <rect class="box-acc" x="149.0" y="187" width="140" height="30" rx="4"/>
  <text class="ink b" x="219.0" y="207" text-anchor="middle">round(p * 1.1)</text>
  <text class="mut sm" x="219.0" y="236" text-anchor="middle">1. первым</text>
  <rect class="box-ok" x="295.0" y="187" width="140" height="30" rx="4"/>
  <text class="ink b" x="365.0" y="207" text-anchor="middle">for p in prices</text>
  <text class="mut sm" x="365.0" y="236" text-anchor="middle">2. как в цикле</text>
  <rect class="box-warn" x="441.0" y="187" width="110" height="30" rx="4"/>
  <text class="ink b" x="496.0" y="207" text-anchor="middle">if p &lt; 250</text>
  <text class="mut sm" x="496.0" y="236" text-anchor="middle">3. последним</text>
  <text class="ink b" x="564.0" y="207" text-anchor="middle">]</text>
  <text class="ink2 sm b" x="20" y="260" text-anchor="start">prices = [210, 190, 260, 150]</text>
  <rect class="box-ok" x="20" y="268" width="154" height="28" rx="4"/>
  <text class="ink sm" x="97" y="287" text-anchor="middle">210 → 231</text>
  <rect class="box-ok" x="186" y="268" width="154" height="28" rx="4"/>
  <text class="ink sm" x="263" y="287" text-anchor="middle">190 → 209</text>
  <rect class="box" x="352" y="268" width="154" height="28" rx="4"/>
  <text class="mut sm" x="429" y="287" text-anchor="middle">260 — отброшено</text>
  <rect class="box-ok" x="518" y="268" width="154" height="28" rx="4"/>
  <text class="ink sm" x="595" y="287" text-anchor="middle">150 → 165</text>
  <text class="ink b" x="350" y="318" text-anchor="middle">Результат: [231, 209, 165]</text>
</svg>
