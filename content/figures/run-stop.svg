<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-run-stop">
  <title id="t-run-stop">Python выполняет строки сверху вниз и останавливается на первой ошибке</title>
  <defs><marker id="ah-run-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="190" y="26" text-anchor="middle">программа</text>
  <text class="mut sm" x="520" y="26" text-anchor="middle">что делает Python</text>
  <rect class="box" x="60" y="38" width="260" height="34" rx="5"/>
  <text class="mut sm b" x="76" y="60" text-anchor="middle">1</text>
  <text class="ink sm" x="96" y="60" text-anchor="start">print("Открываем смену")</text>
  <rect class="box-ok" x="360" y="38" width="320" height="34" rx="5"/>
  <text class="ink sm" x="520" y="60" text-anchor="middle">выполнена → на экране «Открываем смену»</text>
  <path class="ln" d="M322,55 L356,55" marker-end="url(#ah-run-stop)"/>
  <rect class="box" x="60" y="84" width="260" height="34" rx="5"/>
  <text class="mut sm b" x="76" y="106" text-anchor="middle">2</text>
  <text class="ink sm" x="96" y="106" text-anchor="start">print("Касса: 0 ₽")</text>
  <rect class="box-ok" x="360" y="84" width="320" height="34" rx="5"/>
  <text class="ink sm" x="520" y="106" text-anchor="middle">выполнена → на экране «Касса: 0 ₽»</text>
  <path class="ln" d="M322,101 L356,101" marker-end="url(#ah-run-stop)"/>
  <rect class="box-err" x="60" y="130" width="260" height="34" rx="5"/>
  <text class="mut sm b" x="76" y="152" text-anchor="middle">3</text>
  <text class="ink sm" x="96" y="152" text-anchor="start">pirnt("Первый гость")</text>
  <rect class="box-err" x="360" y="130" width="320" height="34" rx="5"/>
  <text class="err sm b" x="520" y="152" text-anchor="middle">NameError: имени pirnt нет — СТОП</text>
  <path class="ln" d="M322,147 L356,147" marker-end="url(#ah-run-stop)"/>
  <rect class="box" x="60" y="176" width="260" height="34" rx="5"/>
  <text class="mut sm b" x="76" y="198" text-anchor="middle">4</text>
  <text class="ink sm" x="96" y="198" text-anchor="start">print("Смена идёт")</text>
  <rect class="box" x="360" y="176" width="320" height="34" rx="5"/>
  <text class="mut sm" x="520" y="198" text-anchor="middle">не выполняется, хотя в ней всё верно</text>
  <path class="ln-mut" d="M322,193 L356,193" marker-end="url(#ah-run-stop)"/>
  <path class="ln-acc" d="M36,40 L36,210" marker-end="url(#ah-run-stop)"/>
  <text class="acc sm b" x="36" y="232" text-anchor="middle">сверху вниз</text>
  <text class="ink2 sm" x="370" y="232" text-anchor="middle">Всё, что успело напечататься, — выше места поломки.</text>
</svg>
