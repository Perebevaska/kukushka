<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cron-fields">
  <title id="t-cron-fields">Строка cron «30 6 * * 1»: пять полей — минута, час, день месяца, месяц, день недели</title>
  <defs><marker id="ah-cron-fields" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="60" y="30" width="100" height="50" rx="5"/>
  <text class="ink b" x="110" y="62" text-anchor="middle">30</text>
  <text class="ink sm b" x="110" y="102" text-anchor="middle">минута</text>
  <text class="ink2 sm" x="110" y="120" text-anchor="middle">0–59</text>
  <rect class="box-acc" x="184" y="30" width="100" height="50" rx="5"/>
  <text class="ink b" x="234" y="62" text-anchor="middle">6</text>
  <text class="ink sm b" x="234" y="102" text-anchor="middle">час</text>
  <text class="ink2 sm" x="234" y="120" text-anchor="middle">0–23</text>
  <rect class="box" x="308" y="30" width="100" height="50" rx="5"/>
  <text class="ink b" x="358" y="62" text-anchor="middle">*</text>
  <text class="ink sm b" x="358" y="102" text-anchor="middle">день месяца</text>
  <text class="ink2 sm" x="358" y="120" text-anchor="middle">любой</text>
  <rect class="box" x="432" y="30" width="100" height="50" rx="5"/>
  <text class="ink b" x="482" y="62" text-anchor="middle">*</text>
  <text class="ink sm b" x="482" y="102" text-anchor="middle">месяц</text>
  <text class="ink2 sm" x="482" y="120" text-anchor="middle">любой</text>
  <rect class="box-acc" x="556" y="30" width="100" height="50" rx="5"/>
  <text class="ink b" x="606" y="62" text-anchor="middle">1</text>
  <text class="ink sm b" x="606" y="102" text-anchor="middle">день недели</text>
  <text class="ink2 sm" x="606" y="120" text-anchor="middle">1 — понедельник</text>
  <text class="ok b" x="350" y="160" text-anchor="middle">→ по понедельникам в 6:30</text>
  <text class="mut sm" x="350" y="186" text-anchor="middle">* — любое значение, 1-5 — диапазон, */15 — каждое 15-е</text>
</svg>
