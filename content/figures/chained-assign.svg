<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-chained-assign">
  <title id="t-chained-assign">Присваивание через цепочку скобок меняет копию, через .loc — саму таблицу</title>
  <defs><marker id="ah-chained-assign" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="45.0" y="98" text-anchor="middle">df</text>
  <rect class="box" x="10" y="106" width="70" height="24" rx="3"/>
  <text class="ink2 sm b" x="45.0" y="122.5" text-anchor="middle">bonus</text>
  <rect class="box" x="10" y="132" width="70" height="24" rx="3"/>
  <text class="ink sm" x="45.0" y="148.5" text-anchor="middle">100</text>
  <rect class="box-warn" x="10" y="158" width="70" height="24" rx="3"/>
  <text class="ink sm" x="45.0" y="174.5" text-anchor="middle">-50</text>
  <rect class="box" x="10" y="184" width="70" height="24" rx="3"/>
  <text class="ink sm" x="45.0" y="200.5" text-anchor="middle">300</text>
  <text class="err sm b" x="160" y="22" text-anchor="start">цепочка: df[df["bonus"] &lt; 0]["bonus"] = 0</text>
  <path class="ln" d="M84,130 C110,130 110,72 136,72" marker-end="url(#ah-chained-assign)"/>
  <rect class="box" x="140" y="52" width="150" height="40" rx="6"/>
  <text class="ink sm b" x="215.0" y="68.5" text-anchor="middle">df[df["bonus"] &lt; 0]</text>
  <text class="mut sm" x="215.0" y="84.5" text-anchor="middle">шаг 1: отбор строк</text>
  <path class="ln" d="M292,72 L318,72" marker-end="url(#ah-chained-assign)"/>
  <text class="mut sm" x="357.0" y="38" text-anchor="middle">новая таблица</text>
  <rect class="box" x="322" y="46" width="70" height="24" rx="3"/>
  <text class="ink2 sm b" x="357.0" y="62.5" text-anchor="middle">bonus</text>
  <rect class="box-warn" x="322" y="72" width="70" height="24" rx="3"/>
  <text class="ink sm" x="357.0" y="88.5" text-anchor="middle">-50</text>
  <path class="ln" d="M394,72 L420,72" marker-end="url(#ah-chained-assign)"/>
  <rect class="box" x="424" y="52" width="110" height="40" rx="6"/>
  <text class="ink sm b" x="479.0" y="68.5" text-anchor="middle">["bonus"] = 0</text>
  <text class="mut sm" x="479.0" y="84.5" text-anchor="middle">шаг 2</text>
  <path class="ln" d="M536,72 L562,72" marker-end="url(#ah-chained-assign)"/>
  <text class="mut sm" x="601.0" y="38" text-anchor="middle">копия изменена</text>
  <rect class="box" x="566" y="46" width="70" height="24" rx="3"/>
  <text class="ink2 sm b" x="601.0" y="62.5" text-anchor="middle">bonus</text>
  <rect class="box-err" x="566" y="72" width="70" height="24" rx="3"/>
  <text class="err sm b" x="601.0" y="88.5" text-anchor="middle">0</text>
  <text class="err sm" x="601" y="116" text-anchor="middle">её никто не сохранил</text>
  <text class="err sm" x="470" y="140" text-anchor="middle">df по-прежнему: 100, −50, 300 + ChainedAssignmentError</text>
  <text class="ok sm b" x="160" y="186" text-anchor="start">.loc: одна операция «где, какой столбец, что»</text>
  <path class="ln" d="M84,170 C110,170 110,226 136,226" marker-end="url(#ah-chained-assign)"/>
  <rect class="box-acc" x="140" y="206" width="290" height="40" rx="6"/>
  <text class="ink sm b" x="285.0" y="222.5" text-anchor="middle">df.loc[df["bonus"] &lt; 0, "bonus"] = 0</text>
  <text class="mut sm" x="285.0" y="238.5" text-anchor="middle">строки и столбец — в одних скобках</text>
  <path class="ln" d="M432,226 L470,226" marker-end="url(#ah-chained-assign)"/>
  <text class="mut sm" x="509.0" y="182" text-anchor="middle">df изменена</text>
  <rect class="box" x="474" y="190" width="70" height="24" rx="3"/>
  <text class="ink2 sm b" x="509.0" y="206.5" text-anchor="middle">bonus</text>
  <rect class="box" x="474" y="216" width="70" height="24" rx="3"/>
  <text class="ink sm" x="509.0" y="232.5" text-anchor="middle">100</text>
  <rect class="box-ok" x="474" y="242" width="70" height="24" rx="3"/>
  <text class="ok sm b" x="509.0" y="258.5" text-anchor="middle">0</text>
  <rect class="box" x="474" y="268" width="70" height="24" rx="3"/>
  <text class="ink sm" x="509.0" y="284.5" text-anchor="middle">300</text>
  <text class="mut sm" x="350" y="320" text-anchor="middle">pandas 3 (Copy-on-Write): всё, что получено из df, ведёт себя как отдельная копия</text>
</svg>
