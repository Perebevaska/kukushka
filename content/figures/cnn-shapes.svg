<svg viewBox="0 0 700 186" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cnn-shapes">
  <title id="t-cnn-shapes">Проход картинки через свёрточную сеть урока: как меняется форма данных</title>
  <defs><marker id="ah-cnn-shapes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="8" y="50" width="92" height="60" rx="6"/>
  <text class="ink sm b" x="54.0" y="75.5" text-anchor="middle">картинка</text>
  <text class="ink2 sm" x="54.0" y="93.5" text-anchor="middle">(32, 32)</text>
  <path class="ln" d="M100,80 L106,80" marker-end="url(#ah-cnn-shapes)"/>
  <rect class="box-acc" x="106" y="50" width="92" height="60" rx="6"/>
  <text class="ink sm b" x="152.0" y="75.5" text-anchor="middle">8 фильтров</text>
  <text class="ink2 sm" x="152.0" y="93.5" text-anchor="middle">(8, 32, 32)</text>
  <path class="ln" d="M198,80 L204,80" marker-end="url(#ah-cnn-shapes)"/>
  <rect class="box" x="204" y="50" width="92" height="60" rx="6"/>
  <text class="ink sm b" x="250.0" y="75.5" text-anchor="middle">ReLU</text>
  <text class="ink2 sm" x="250.0" y="93.5" text-anchor="middle">(8, 32, 32)</text>
  <path class="ln" d="M296,80 L302,80" marker-end="url(#ah-cnn-shapes)"/>
  <rect class="box-acc" x="302" y="50" width="92" height="60" rx="6"/>
  <text class="ink sm b" x="348.0" y="75.5" text-anchor="middle">пулинг 2 × 2</text>
  <text class="ink2 sm" x="348.0" y="93.5" text-anchor="middle">(8, 16, 16)</text>
  <path class="ln" d="M394,80 L400,80" marker-end="url(#ah-cnn-shapes)"/>
  <rect class="box" x="400" y="50" width="92" height="60" rx="6"/>
  <text class="ink sm b" x="446.0" y="75.5" text-anchor="middle">ravel</text>
  <text class="ink2 sm" x="446.0" y="93.5" text-anchor="middle">(2048,)</text>
  <path class="ln" d="M492,80 L498,80" marker-end="url(#ah-cnn-shapes)"/>
  <rect class="box-acc" x="498" y="50" width="92" height="60" rx="6"/>
  <text class="ink sm b" x="544.0" y="75.5" text-anchor="middle">Linear</text>
  <text class="ink2 sm" x="544.0" y="93.5" text-anchor="middle">(4,)</text>
  <path class="ln" d="M590,80 L596,80" marker-end="url(#ah-cnn-shapes)"/>
  <rect class="box-ok" x="596" y="50" width="92" height="60" rx="6"/>
  <text class="ink sm b" x="642.0" y="75.5" text-anchor="middle">softmax</text>
  <text class="ink2 sm" x="642.0" y="93.5" text-anchor="middle">4 вероятн.</text>
  <text class="ink2 sm" x="350" y="140" text-anchor="middle">веса учатся только у свёртки (W1, b1) и у Linear (W2); ReLU и пулинг весов не имеют</text>
  <text class="mut sm" x="350" y="160" text-anchor="middle">отрицательные отклики → 0; пулинг делит высоту и ширину на 2</text>
</svg>
