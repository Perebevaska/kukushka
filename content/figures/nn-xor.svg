<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-xor">
  <title id="t-nn-xor">Скрытый слой переводит гостей в новые признаки, где классы разделяются прямой</title>
  <defs><marker id="ah-nn-xor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="135.0" y="48" text-anchor="middle">исходные признаки</text>
  <path class="ln-mut" d="M50,240 L240,240" marker-end="url(#ah-nn-xor)"/>
  <path class="ln-mut" d="M50,240 L50,60" marker-end="url(#ah-nn-xor)"/>
  <text class="mut sm" x="240" y="274" text-anchor="end">давно не был</text>
  <text class="mut sm" x="56" y="64" text-anchor="start">жаловался</text>
  <text class="mut sm" x="70" y="256" text-anchor="middle">0</text>
  <text class="mut sm" x="40" y="224" text-anchor="middle">0</text>
  <text class="mut sm" x="200" y="256" text-anchor="middle">1</text>
  <text class="mut sm" x="40" y="94" text-anchor="middle">1</text>
  <circle class="box-ok" cx="70" cy="220" r="9"/>
  <circle class="box-err" cx="70" cy="90" r="9"/>
  <circle class="box-err" cx="200" cy="220" r="9"/>
  <circle class="box-ok" cx="200" cy="90" r="9"/>
  <text class="ink2 sm" x="135.0" y="296" text-anchor="middle">ни одна прямая не отделит ✕ от ○</text>
  <text class="ink sm b" x="70" y="224" text-anchor="middle">○</text>
  <text class="ink sm b" x="70" y="94" text-anchor="middle">✕</text>
  <text class="ink sm b" x="200" y="224" text-anchor="middle">✕</text>
  <text class="ink sm b" x="200" y="94" text-anchor="middle">○</text>
  <path class="ln-acc" d="M262,140 L390,140" marker-end="url(#ah-nn-xor)"/>
  <text class="acc sm b" x="326" y="112" text-anchor="middle">скрытый слой</text>
  <text class="ink2 sm" x="326" y="160" text-anchor="middle">h₁ = «хотя бы одно»</text>
  <text class="ink2 sm" x="326" y="178" text-anchor="middle">h₂ = «оба сразу»</text>
  <text class="ink sm b" x="525.0" y="48" text-anchor="middle">новые признаки h₁, h₂</text>
  <path class="ln-mut" d="M440,240 L630,240" marker-end="url(#ah-nn-xor)"/>
  <path class="ln-mut" d="M440,240 L440,60" marker-end="url(#ah-nn-xor)"/>
  <text class="mut sm" x="630" y="274" text-anchor="end">h₁</text>
  <text class="mut sm" x="446" y="64" text-anchor="start">h₂</text>
  <text class="mut sm" x="460" y="256" text-anchor="middle">0</text>
  <text class="mut sm" x="430" y="224" text-anchor="middle">0</text>
  <text class="mut sm" x="590" y="256" text-anchor="middle">1</text>
  <text class="mut sm" x="430" y="94" text-anchor="middle">1</text>
  <path class="ln-acc dash" d="M525.0,220.0 L622.5,171.2"/>
  <circle class="box-ok" cx="460.0" cy="220.0" r="9"/>
  <text class="ink sm b" x="460.0" y="224.0" text-anchor="middle">○</text>
  <text class="mut sm" x="460.0" y="204.0" text-anchor="middle">(0,0)</text>
  <circle class="box-err" cx="590.0" cy="220.0" r="9"/>
  <text class="ink sm b" x="590.0" y="224.0" text-anchor="middle">✕</text>
  <text class="mut sm" x="604.0" y="224.0" text-anchor="start">(0,1), (1,0)</text>
  <circle class="box-ok" cx="590.0" cy="90.0" r="9"/>
  <text class="ink sm b" x="590.0" y="94.0" text-anchor="middle">○</text>
  <text class="mut sm" x="590.0" y="74.0" text-anchor="middle">(1,1)</text>
  <text class="ink2 sm" x="525.0" y="296" text-anchor="middle">выход: 20·h₁ − 40·h₂ − 10 &gt; 0 → ушёл</text>
  <text class="mut sm" x="350" y="322" text-anchor="middle">○ остался, ✕ ушёл; в скобках — исходные признаки гостя</text>
</svg>
