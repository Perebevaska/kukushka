<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nb-kernel">
  <title id="t-nb-kernel">Что хранится в файле .ipynb, а что — в ядре</title>
  <defs><marker id="ah-nb-kernel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="14" width="330" height="236" rx="10"/>
  <text class="ink sm b" x="179" y="36" text-anchor="middle">файл zerno_draft.ipynb (JSON, на диске)</text>
  <text class="ink2 sm" x="30" y="60" text-anchor="start">{"nbformat": 4, "cells": [ … ]}</text>
  <rect class="box" x="24" y="70" width="134" height="22" rx="4"/>
  <text class="ink2 sm" x="91" y="85" text-anchor="middle">ячейка 0 · markdown</text>
  <rect class="box" x="24" y="96" width="134" height="22" rx="4"/>
  <text class="ink2 sm" x="91" y="111" text-anchor="middle">ячейка 1 · code</text>
  <rect class="box" x="24" y="122" width="134" height="22" rx="4"/>
  <text class="ink2 sm" x="91" y="137" text-anchor="middle">…</text>
  <rect class="box-acc" x="164" y="70" width="170" height="168" rx="6"/>
  <text class="acc sm b" x="249" y="90" text-anchor="middle">ячейка 4 · code</text>
  <text class="mut sm" x="174" y="114" text-anchor="start">source:</text>
  <text class="ink sm" x="174" y="132" text-anchor="start">df["amount"].sum()</text>
  <text class="mut sm" x="174" y="158" text-anchor="start">execution_count:</text>
  <text class="ink sm b" x="322" y="158" text-anchor="end">3</text>
  <text class="mut sm" x="174" y="184" text-anchor="start">outputs:</text>
  <text class="ink sm b" x="174" y="202" text-anchor="start">710 195</text>
  <text class="warn sm" x="174" y="224" text-anchor="start">снимок прошлого запуска</text>
  <rect class="box-warn" x="440" y="50" width="246" height="150" rx="10"/>
  <text class="ink sm b" x="563" y="72" text-anchor="middle">ядро — процесс Python</text>
  <text class="mut sm" x="563" y="90" text-anchor="middle">(в памяти, пока запущено)</text>
  <rect class="box" x="456" y="104" width="40" height="22" rx="4"/>
  <text class="ink sm b" x="476" y="119" text-anchor="middle">pd</text>
  <text class="ink2 sm" x="506" y="119" text-anchor="start">модуль pandas</text>
  <rect class="box" x="456" y="132" width="40" height="22" rx="4"/>
  <text class="ink sm b" x="476" y="147" text-anchor="middle">df</text>
  <text class="ink2 sm" x="506" y="147" text-anchor="start">таблица, 380 строк</text>
  <rect class="box" x="456" y="160" width="40" height="22" rx="4"/>
  <text class="ink sm b" x="476" y="175" text-anchor="middle">…</text>
  <text class="ink2 sm" x="506" y="175" text-anchor="start">всё, что выполняли</text>
  <path class="ln-acc" d="M346,120 C380,110 400,110 436,110" marker-end="url(#ah-nb-kernel)"/>
  <text class="acc sm" x="390" y="100" text-anchor="middle">Shift+Enter: код</text>
  <path class="ln" d="M436,170 C400,180 380,190 336,196" marker-end="url(#ah-nb-kernel)"/>
  <text class="ink2 sm" x="392" y="206" text-anchor="middle">результат</text>
  <text class="ink2 sm" x="350" y="272" text-anchor="middle">Ctrl+S сохраняет только файл. Restart очищает только ядро — выводы в файле остаются прежними.</text>
  <text class="mut sm" x="350" y="292" text-anchor="middle">поэтому вывод в файле может не совпадать с тем, что даст код сейчас</text>
</svg>
