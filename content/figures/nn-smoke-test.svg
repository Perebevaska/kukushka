<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-smoke-test">
  <title id="t-nn-smoke-test">Четыре проверки перед долгим обучением</title>
  <defs><marker id="ah-nn-smoke-test" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="12" y="20" width="156" height="110" rx="8"/>
  <text class="ink sm b" x="90" y="42" text-anchor="middle">1. один батч вперёд</text>
  <text class="ink2 sm" x="90" y="64" text-anchor="middle">форма выхода</text>
  <text class="ink2 sm" x="90" y="81" text-anchor="middle">как у ответа, нет nan</text>
  <text class="acc sm" x="90" y="104" text-anchor="middle">полумесяцы: (32,),</text>
  <text class="acc sm" x="90" y="120" text-anchor="middle">nan нет</text>
  <path class="ln-acc" d="M168,75 L184,75" marker-end="url(#ah-nn-smoke-test)"/>
  <path class="ln-err" d="M90,130 L90,166" marker-end="url(#ah-nn-smoke-test)"/>
  <text class="err sm b" x="96" y="152" text-anchor="start">нет</text>
  <rect class="box-err" x="12" y="168" width="156" height="50" rx="8"/>
  <text class="ink sm" x="90" y="188" text-anchor="middle">ошибка в forward,</text>
  <text class="ink sm" x="90" y="206" text-anchor="middle">формах, данных</text>
  <rect class="box-acc" x="184" y="20" width="156" height="110" rx="8"/>
  <text class="ink sm b" x="262" y="42" text-anchor="middle">2. стартовая потеря</text>
  <text class="ink2 sm" x="262" y="64" text-anchor="middle">около ln 2 = 0.693</text>
  <text class="ink2 sm" x="262" y="81" text-anchor="middle">(K классов — ln K)</text>
  <text class="acc sm" x="262" y="104" text-anchor="middle">0.687 при ориентире</text>
  <text class="acc sm" x="262" y="120" text-anchor="middle">0.693</text>
  <path class="ln-acc" d="M340,75 L356,75" marker-end="url(#ah-nn-smoke-test)"/>
  <path class="ln-err" d="M262,130 L262,166" marker-end="url(#ah-nn-smoke-test)"/>
  <text class="err sm b" x="268" y="152" text-anchor="start">нет</text>
  <rect class="box-err" x="184" y="168" width="156" height="50" rx="8"/>
  <text class="ink sm" x="262" y="188" text-anchor="middle">масштаб весов</text>
  <text class="ink sm" x="262" y="206" text-anchor="middle">или признаков</text>
  <rect class="box-acc" x="356" y="20" width="156" height="110" rx="8"/>
  <text class="ink sm b" x="434" y="42" text-anchor="middle">3. зазубрить кусок</text>
  <text class="ink2 sm" x="434" y="64" text-anchor="middle">16–32 объекта,</text>
  <text class="ink2 sm" x="434" y="81" text-anchor="middle">потеря → почти 0</text>
  <text class="acc sm" x="434" y="104" text-anchor="middle">16 объектов, 300</text>
  <text class="acc sm" x="434" y="120" text-anchor="middle">шагов: 0.048</text>
  <path class="ln-acc" d="M512,75 L528,75" marker-end="url(#ah-nn-smoke-test)"/>
  <path class="ln-err" d="M434,130 L434,166" marker-end="url(#ah-nn-smoke-test)"/>
  <text class="err sm b" x="440" y="152" text-anchor="start">нет</text>
  <rect class="box-err" x="356" y="168" width="156" height="50" rx="8"/>
  <text class="ink sm" x="434" y="188" text-anchor="middle">ошибка в цикле,</text>
  <text class="ink sm" x="434" y="206" text-anchor="middle">градиентах, данных</text>
  <rect class="box-acc" x="528" y="20" width="156" height="110" rx="8"/>
  <text class="ink sm b" x="606" y="42" text-anchor="middle">4. эпоха на 1 %</text>
  <text class="ink2 sm" x="606" y="64" text-anchor="middle">засечь время,</text>
  <text class="ink2 sm" x="606" y="81" text-anchor="middle">умножить на 100</text>
  <text class="acc sm" x="606" y="104" text-anchor="middle">сколько ждать,</text>
  <text class="acc sm" x="606" y="120" text-anchor="middle">не упадёт ли запись</text>
  <path class="ln-err" d="M606,130 L606,166" marker-end="url(#ah-nn-smoke-test)"/>
  <text class="err sm b" x="612" y="152" text-anchor="start">нет</text>
  <rect class="box-err" x="528" y="168" width="156" height="50" rx="8"/>
  <text class="ink sm" x="606" y="188" text-anchor="middle">менять план</text>
  <text class="ink sm" x="606" y="206" text-anchor="middle">до запуска</text>
  <text class="mut sm" x="12" y="244" text-anchor="start">числа синим — проверки 1–3 на numpy-сети с полумесяцами из урока</text>
  <path class="ln-acc" d="M680,75 L690,75 L690,262 L520,262" marker-end="url(#ah-nn-smoke-test)"/>
  <rect class="box-ok" x="330" y="248" width="190" height="32" rx="8"/>
  <text class="ink sm b" x="425" y="269" text-anchor="middle">всё да → полное обучение</text>
</svg>
