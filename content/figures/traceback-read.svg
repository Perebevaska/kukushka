<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-traceback-read">
  <title id="t-traceback-read">Как читать traceback: снизу вверх, пропуская рамки pandas</title>
  <defs><marker id="ah-traceback-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="14" width="372" height="240" rx="8"/>
  <rect class="box-acc" x="24" y="46" width="352" height="46" rx="5"/>
  <rect class="box" x="24" y="102" width="352" height="74" rx="5"/>
  <rect class="box-err" x="24" y="196" width="352" height="32" rx="5"/>
  <text class="mut sm" x="36" y="30" text-anchor="start">KeyError   Traceback (most recent call last)</text>
  <text class="ink sm b" x="36" y="66" text-anchor="start">Cell In[2], line 1</text>
  <text class="ink sm" x="36" y="86" text-anchor="start">----&gt; 1 by_shop = (df.groupby("shop")</text>
  <text class="mut sm" x="36" y="118" text-anchor="start">File …/pandas/core/frame.py, in groupby</text>
  <text class="mut sm" x="36" y="148" text-anchor="start">File …/pandas/core/groupby/grouper.py</text>
  <text class="mut sm" x="36" y="166" text-anchor="start">--&gt; 901   raise KeyError(gpr)</text>
  <text class="err b" x="36" y="214" text-anchor="start">KeyError: 'shop'</text>
  <text class="mut sm" x="36" y="190" text-anchor="start">…</text>
  <circle class="box-err" cx="422" cy="212" r="13"/>
  <text class="ink sm b" x="422" y="217" text-anchor="middle">1</text>
  <text class="err sm b" x="444" y="210" text-anchor="start">что случилось</text>
  <text class="ink2 sm" x="444" y="228" text-anchor="start">тип и текст ошибки</text>
  <circle class="box-acc" cx="422" cy="72" r="13"/>
  <text class="ink sm b" x="422" y="77" text-anchor="middle">2</text>
  <text class="acc sm b" x="444" y="70" text-anchor="start">где в вашем коде</text>
  <text class="ink2 sm" x="444" y="88" text-anchor="start">номер запуска и строка</text>
  <circle class="box" cx="422" cy="140" r="13"/>
  <text class="ink sm b" x="422" y="145" text-anchor="middle">3</text>
  <text class="mut sm b" x="444" y="138" text-anchor="start">внутри pandas</text>
  <text class="ink2 sm" x="444" y="156" text-anchor="start">обычно пропускаем</text>
  <path class="ln-acc" d="M620,226 L620,60" marker-end="url(#ah-traceback-read)"/>
  <text class="acc sm" x="632" y="136" text-anchor="start">читаем</text>
  <text class="acc sm" x="632" y="152" text-anchor="start">снизу</text>
  <text class="acc sm" x="632" y="168" text-anchor="start">вверх</text>
</svg>
