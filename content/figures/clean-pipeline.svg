<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-clean-pipeline">
  <title id="t-clean-pipeline">Конвейер очистки анкет с журналом потерь</title>
  <defs><marker id="ah-clean-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="12" y="40" width="124" height="84" rx="8"/>
  <text class="ink sm b" x="74.0" y="64" text-anchor="middle">clients_raw.csv</text>
  <text class="ink2 sm" x="74.0" y="82" text-anchor="middle">сырая выгрузка</text>
  <rect class="box" x="40.0" y="134" width="68" height="26" rx="13"/>
  <text class="ink sm b" x="74.0" y="152" text-anchor="middle">307 стр.</text>
  <path class="ln" d="M137,78 L149,78" marker-end="url(#ah-clean-pipeline)"/>
  <rect class="box-acc" x="150" y="40" width="124" height="84" rx="8"/>
  <text class="ink sm b" x="212.0" y="64" text-anchor="middle">drop_duplicates()</text>
  <text class="ink2 sm" x="212.0" y="82" text-anchor="middle">полные копии</text>
  <rect class="box" x="178.0" y="134" width="68" height="26" rx="13"/>
  <text class="ink sm b" x="212.0" y="152" text-anchor="middle">299 стр.</text>
  <path class="ln" d="M275,78 L287,78" marker-end="url(#ah-clean-pipeline)"/>
  <rect class="box-acc" x="288" y="40" width="124" height="84" rx="8"/>
  <text class="ink sm b" x="350.0" y="64" text-anchor="middle">нормализация</text>
  <text class="ink2 sm" x="350.0" y="82" text-anchor="middle">номер карты, пол,</text>
  <text class="ink2 sm" x="350.0" y="98" text-anchor="middle">город, телефон,</text>
  <text class="ink2 sm" x="350.0" y="112" text-anchor="middle">бонусы, даты</text>
  <rect class="box" x="316.0" y="134" width="68" height="26" rx="13"/>
  <text class="ink sm b" x="350.0" y="152" text-anchor="middle">299 стр.</text>
  <path class="ln" d="M413,78 L425,78" marker-end="url(#ah-clean-pipeline)"/>
  <rect class="box-acc" x="426" y="40" width="124" height="84" rx="8"/>
  <text class="ink sm b" x="488.0" y="64" text-anchor="middle">свежая анкета</text>
  <text class="ink2 sm" x="488.0" y="82" text-anchor="middle">по одной на гостя</text>
  <rect class="box" x="454.0" y="134" width="68" height="26" rx="13"/>
  <text class="ink sm b" x="488.0" y="152" text-anchor="middle">293 стр.</text>
  <path class="ln" d="M551,78 L563,78" marker-end="url(#ah-clean-pipeline)"/>
  <rect class="box-ok" x="564" y="40" width="124" height="84" rx="8"/>
  <text class="ink sm b" x="626.0" y="64" text-anchor="middle">check_clients()</text>
  <text class="ink2 sm" x="626.0" y="82" text-anchor="middle">контракт</text>
  <rect class="box" x="592.0" y="134" width="68" height="26" rx="13"/>
  <text class="ink sm b" x="626.0" y="152" text-anchor="middle">293 стр.</text>
  <text class="ink2" x="350" y="186" text-anchor="middle">Журнал — число строк после каждого шага. Если шаг неожиданно</text>
  <text class="ink2" x="350" y="206" text-anchor="middle">«съел» много строк, это видно сразу, а не в итоговом отчёте.</text>
  <text class="mut sm" x="350" y="236" text-anchor="middle">clean_clients(raw) → clients → clients_clean.csv</text>
</svg>
