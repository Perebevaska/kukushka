<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-subquery-kinds">
  <title id="t-subquery-kinds">Подзапрос: одно значение, столбец или таблица</title>
  <defs><marker id="ah-subquery-kinds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="10" y="10" width="220" height="278" rx="8"/>
  <text class="ink b" x="120.0" y="32" text-anchor="middle">скаляр: 1 × 1</text>
  <text class="acc sm b" x="120.0" y="52" text-anchor="middle">WHERE amount &gt; ( … )</text>
  <rect class="box" x="240" y="10" width="220" height="278" rx="8"/>
  <text class="ink b" x="350.0" y="32" text-anchor="middle">столбец: n × 1</text>
  <text class="acc sm b" x="350.0" y="52" text-anchor="middle">WHERE shop_id IN ( … )</text>
  <rect class="box" x="470" y="10" width="220" height="278" rx="8"/>
  <text class="ink b" x="580.0" y="32" text-anchor="middle">таблица: n × m</text>
  <text class="acc sm b" x="580.0" y="52" text-anchor="middle">FROM ( … ) AS t</text>
  <text class="ink2 sm" x="120.0" y="80" text-anchor="middle">SELECT AVG(amount) FROM df</text>
  <rect class="box-acc" x="80" y="92" width="80" height="34" rx="4"/>
  <text class="ink b" x="120" y="114" text-anchor="middle">339.97</text>
  <text class="ink2 sm" x="120.0" y="146" text-anchor="middle">одна строка, один столбец —</text>
  <text class="ink2 sm" x="120.0" y="162" text-anchor="middle">встаёт туда, где стоит число</text>
  <rect class="box-err" x="22" y="182" width="196" height="92" rx="6"/>
  <text class="err sm b" x="120.0" y="202" text-anchor="middle">вернул 2 строки и больше —</text>
  <text class="err sm" x="120.0" y="218" text-anchor="middle">ошибка «More than one row</text>
  <text class="err sm" x="120.0" y="234" text-anchor="middle">returned by a subquery»</text>
  <text class="ink2 sm" x="120.0" y="256" text-anchor="middle">нужен агрегат или IN</text>
  <text class="ink2 sm" x="350.0" y="80" text-anchor="middle">SELECT shop_id … 'Казань'</text>
  <rect class="box" x="310" y="92" width="80" height="24" rx="3"/>
  <text class="ink2 sm b" x="350.0" y="108.5" text-anchor="middle">shop_id</text>
  <rect class="box-acc" x="310" y="118" width="80" height="24" rx="3"/>
  <text class="ink sm" x="350.0" y="134.5" text-anchor="middle">KZN-1</text>
  <rect class="box-acc" x="310" y="144" width="80" height="24" rx="3"/>
  <text class="ink sm" x="350.0" y="160.5" text-anchor="middle">KZN-2</text>
  <text class="ink2 sm" x="350.0" y="196" text-anchor="middle">список значений:</text>
  <text class="ink2 sm" x="350.0" y="212" text-anchor="middle">строка проходит, если её</text>
  <text class="ink2 sm" x="350.0" y="228" text-anchor="middle">shop_id есть в списке</text>
  <text class="warn sm b" x="350.0" y="256" text-anchor="middle">NOT IN + NULL в списке → 0 строк</text>
  <text class="ink2 sm" x="580.0" y="80" text-anchor="middle">SELECT shop_id, SUM(amount) …</text>
  <rect class="box" x="510" y="92" width="140" height="22" rx="3"/>
  <text class="ink2 sm b" x="545.0" y="107.5" text-anchor="middle">shop_id</text>
  <text class="ink2 sm b" x="615.0" y="107.5" text-anchor="middle">revenue</text>
  <rect class="box-acc" x="510" y="116" width="140" height="22" rx="3"/>
  <text class="ink sm" x="545.0" y="131.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="615.0" y="131.5" text-anchor="middle">186 163</text>
  <rect class="box-acc" x="510" y="140" width="140" height="22" rx="3"/>
  <text class="ink sm" x="545.0" y="155.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="615.0" y="155.5" text-anchor="middle">181 365</text>
  <rect class="box-acc" x="510" y="164" width="140" height="22" rx="3"/>
  <text class="ink sm" x="545.0" y="179.5" text-anchor="middle">KZN-2</text>
  <text class="ink sm" x="615.0" y="179.5" text-anchor="middle">98 340</text>
  <rect class="box-acc" x="510" y="188" width="140" height="22" rx="3"/>
  <text class="ink sm" x="545.0" y="203.5" text-anchor="middle">…</text>
  <text class="ink sm" x="615.0" y="203.5" text-anchor="middle">…</text>
  <text class="ink2 sm" x="580.0" y="226" text-anchor="middle">6 строк × 2 столбца — читается</text>
  <text class="ink2 sm" x="580.0" y="242" text-anchor="middle">как обычная таблица</text>
  <text class="ink2 sm b" x="580.0" y="266" text-anchor="middle">псевдоним AS t обязателен</text>
</svg>
