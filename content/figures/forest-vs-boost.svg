<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-forest-vs-boost">
  <title id="t-forest-vs-boost">Лес строит деревья независимо и усредняет, бустинг — по очереди на остатках</title>
  <defs><marker id="ah-forest-vs-boost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="170" y="24" text-anchor="middle">случайный лес</text>
  <text class="ink b" x="530" y="24" text-anchor="middle">градиентный бустинг</text>
  <rect class="box-acc" x="90" y="36" width="160" height="32" rx="6"/>
  <text class="ink sm b" x="170.0" y="56.5" text-anchor="middle">данные</text>
  <path class="ln" d="M170,70 L68,96" marker-end="url(#ah-forest-vs-boost)"/>
  <rect class="box" x="20" y="98" width="96" height="44" rx="6"/>
  <text class="ink sm b" x="68.0" y="116.0" text-anchor="middle">дерево 1</text>
  <text class="mut sm" x="68.0" y="133.0" text-anchor="middle">своя выборка</text>
  <path class="ln" d="M68,144 L170,176" marker-end="url(#ah-forest-vs-boost)"/>
  <path class="ln" d="M170,70 L172,96" marker-end="url(#ah-forest-vs-boost)"/>
  <rect class="box" x="124" y="98" width="96" height="44" rx="6"/>
  <text class="ink sm b" x="172.0" y="116.0" text-anchor="middle">дерево 2</text>
  <text class="mut sm" x="172.0" y="133.0" text-anchor="middle">своя выборка</text>
  <path class="ln" d="M172,144 L170,176" marker-end="url(#ah-forest-vs-boost)"/>
  <path class="ln" d="M170,70 L276,96" marker-end="url(#ah-forest-vs-boost)"/>
  <rect class="box" x="228" y="98" width="96" height="44" rx="6"/>
  <text class="ink sm b" x="276.0" y="116.0" text-anchor="middle">дерево 3</text>
  <text class="mut sm" x="276.0" y="133.0" text-anchor="middle">своя выборка</text>
  <path class="ln" d="M276,144 L170,176" marker-end="url(#ah-forest-vs-boost)"/>
  <text class="mut sm" x="170" y="132" text-anchor="middle"></text>
  <rect class="box-ok" x="90" y="178" width="160" height="34" rx="6"/>
  <text class="ink sm b" x="170.0" y="199.5" text-anchor="middle">среднее прогнозов</text>
  <text class="ink2 sm" x="170" y="236" text-anchor="middle">деревья глубокие, строятся параллельно,</text>
  <text class="ink2 sm" x="170" y="252" text-anchor="middle">ничего не знают друг о друге</text>
  <text class="ok sm b" x="170" y="276" text-anchor="middle">снижает разброс</text>
  <path class="ln-mut" d="M350,34 L350,290"/>
  <rect class="box-acc" x="566" y="36" width="120" height="32" rx="6"/>
  <text class="ink sm b" x="626.0" y="56.5" text-anchor="middle">F₀ = среднее y</text>
  <rect class="box-err" x="362" y="92" width="96" height="36" rx="6"/>
  <text class="ink sm" x="410.0" y="114.5" text-anchor="middle">остатки y − F₀</text>
  <path class="ln" d="M460,110 L474,110" marker-end="url(#ah-forest-vs-boost)"/>
  <rect class="box" x="476" y="92" width="76" height="36" rx="6"/>
  <text class="ink sm b" x="514.0" y="114.5" text-anchor="middle">дерево 1</text>
  <path class="ln" d="M554,110 L564,110" marker-end="url(#ah-forest-vs-boost)"/>
  <rect class="box-ok" x="566" y="92" width="120" height="36" rx="6"/>
  <text class="ink sm" x="626.0" y="114.5" text-anchor="middle">F₁ = F₀ + η·дерево</text>
  <rect class="box-err" x="362" y="142" width="96" height="36" rx="6"/>
  <text class="ink sm" x="410.0" y="164.5" text-anchor="middle">остатки y − F₁</text>
  <path class="ln" d="M460,160 L474,160" marker-end="url(#ah-forest-vs-boost)"/>
  <rect class="box" x="476" y="142" width="76" height="36" rx="6"/>
  <text class="ink sm b" x="514.0" y="164.5" text-anchor="middle">дерево 2</text>
  <path class="ln" d="M554,160 L564,160" marker-end="url(#ah-forest-vs-boost)"/>
  <rect class="box-ok" x="566" y="142" width="120" height="36" rx="6"/>
  <text class="ink sm" x="626.0" y="164.5" text-anchor="middle">F₂ = F₁ + η·дерево</text>
  <rect class="box-err" x="362" y="192" width="96" height="36" rx="6"/>
  <text class="ink sm" x="410.0" y="214.5" text-anchor="middle">остатки y − F₂</text>
  <path class="ln" d="M460,210 L474,210" marker-end="url(#ah-forest-vs-boost)"/>
  <rect class="box" x="476" y="192" width="76" height="36" rx="6"/>
  <text class="ink sm b" x="514.0" y="214.5" text-anchor="middle">дерево 3</text>
  <path class="ln" d="M554,210 L564,210" marker-end="url(#ah-forest-vs-boost)"/>
  <rect class="box-ok" x="566" y="192" width="120" height="36" rx="6"/>
  <text class="ink sm" x="626.0" y="214.5" text-anchor="middle">F₃ = F₂ + η·дерево</text>
  <path class="ln-mut" d="M626,70 V85 H410 V90" marker-end="url(#ah-forest-vs-boost)"/>
  <path class="ln-mut" d="M626,128 V135 H410 V140" marker-end="url(#ah-forest-vs-boost)"/>
  <path class="ln-mut" d="M626,178 V185 H410 V190" marker-end="url(#ah-forest-vs-boost)"/>
  <text class="ink2 sm" x="530" y="252" text-anchor="middle">неглубокие деревья по очереди: каждое</text>
  <text class="ink2 sm" x="530" y="268" text-anchor="middle">исправляет то, что не объяснили прежние</text>
  <text class="ok sm b" x="530" y="292" text-anchor="middle">снижает смещение</text>
</svg>
