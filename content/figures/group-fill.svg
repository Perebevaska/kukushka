  <rect class="box" x="200" y="92" width="150" height="24" rx="3"/>
  <text class="ink2 sm b" x="240.0" y="108.5" text-anchor="middle">city</text>
  <text class="ink2 sm b" x="315.0" y="108.5" text-anchor="middle">median</text>
  <rect class="box-ok" x="200" y="118" width="150" height="24" rx="3"/>
  <text class="ink sm" x="240.0" y="134.5" text-anchor="middle">Казань</text>
  <text class="ink sm" x="315.0" y="134.5" text-anchor="middle">500</text>
  <rect class="box-acc" x="200" y="144" width="150" height="24" rx="3"/>
  <text class="ink sm" x="240.0" y="160.5" text-anchor="middle">Пермь</text>
  <text class="ink sm" x="315.0" y="160.5" text-anchor="middle">200</text>
  <text class="mut sm" x="275" y="190" text-anchor="middle">2 строки — по одной</text>
  <text class="mut sm" x="275" y="206" text-anchor="middle">на группу</text>
  <path class="ln" d="M166,130 L194,130" marker-end="url(#ah-group-fill)"/>
  <path class="ln" d="M356,130 L404,130" marker-end="url(#ah-group-fill)"/>
  <text class="mut sm" x="380" y="118" text-anchor="middle">раздать</text>
