  <text class="ink sm" x="130.0" y="108.5" text-anchor="middle">400</text>
  <rect class="box-acc" x="12" y="118" width="150" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="134.5" text-anchor="middle">Пермь</text>
  <text class="err sm b" x="130.0" y="134.5" text-anchor="middle">NaN</text>
  <rect class="box-ok" x="12" y="144" width="150" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="160.5" text-anchor="middle">Казань</text>
  <text class="ink sm" x="130.0" y="160.5" text-anchor="middle">600</text>
  <rect class="box-acc" x="12" y="170" width="150" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="186.5" text-anchor="middle">Пермь</text>
  <text class="ink sm" x="130.0" y="186.5" text-anchor="middle">300</text>
  <rect class="box-ok" x="12" y="196" width="150" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="212.5" text-anchor="middle">Казань</text>
  <text class="err sm b" x="130.0" y="212.5" text-anchor="middle">NaN</text>
