<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-group-fill">
  <title id="t-group-fill">transform раздаёт медиану группы каждой строке, fillna заполняет пропуски</title>
  <defs><marker id="ah-group-fill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="87.0" y="32" text-anchor="middle">анкеты</text>
