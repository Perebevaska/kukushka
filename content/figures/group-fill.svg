  <text class="ink sm" x="465.0" y="82.5" text-anchor="middle">200</text>
  <rect class="box-ok" x="410" y="92" width="110" height="24" rx="3"/>
  <text class="ink sm" x="465.0" y="108.5" text-anchor="middle">500</text>
  <rect class="box-acc" x="410" y="118" width="110" height="24" rx="3"/>
  <text class="ink sm" x="465.0" y="134.5" text-anchor="middle">200</text>
  <rect class="box-ok" x="410" y="144" width="110" height="24" rx="3"/>
  <text class="ink sm" x="465.0" y="160.5" text-anchor="middle">500</text>
  <rect class="box-acc" x="410" y="170" width="110" height="24" rx="3"/>
  <text class="ink sm" x="465.0" y="186.5" text-anchor="middle">200</text>
  <rect class="box-ok" x="410" y="196" width="110" height="24" rx="3"/>
  <text class="ink sm" x="465.0" y="212.5" text-anchor="middle">500</text>
  <path class="ln" d="M524,130 L552,130" marker-end="url(#ah-group-fill)"/>
  <text class="mut sm" x="621.0" y="32" text-anchor="middle">bonus после заполнения</text>
  <rect class="box" x="556" y="40" width="130" height="24" rx="3"/>
  <text class="ink2 sm b" x="621.0" y="56.5" text-anchor="middle">fillna(transform)</text>
  <rect class="box-acc" x="556" y="66" width="130" height="24" rx="3"/>
  <text class="ink sm" x="621.0" y="82.5" text-anchor="middle">100</text>
  <rect class="box-ok" x="556" y="92" width="130" height="24" rx="3"/>
  <text class="ink sm" x="621.0" y="108.5" text-anchor="middle">400</text>
  <rect class="box-acc" x="556" y="118" width="130" height="24" rx="3"/>
  <text class="ok sm b" x="621.0" y="134.5" text-anchor="middle">200</text>
  <rect class="box-ok" x="556" y="144" width="130" height="24" rx="3"/>
  <text class="ink sm" x="621.0" y="160.5" text-anchor="middle">600</text>
  <rect class="box-acc" x="556" y="170" width="130" height="24" rx="3"/>
  <text class="ink sm" x="621.0" y="186.5" text-anchor="middle">300</text>
  <rect class="box-ok" x="556" y="196" width="130" height="24" rx="3"/>
  <text class="ok sm b" x="621.0" y="212.5" text-anchor="middle">500</text>
  <text class="ink2 sm" x="350" y="250" text-anchor="middle">пропуск у Перми получил 200 (медиана 100 и 300), у Казани — 500 (медиана 400 и 600)</text>
</svg>
