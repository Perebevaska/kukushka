<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-reg-metrics">
  <title id="t-reg-metrics">MAE, RMSE и R² на четырёх доставках</title>
  <defs><marker id="ah-reg-metrics" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="120" y="22" text-anchor="middle">ошибки факт − прогноз</text>
  <text class="ink2 sm" x="30" y="51" text-anchor="start">20 − 22</text>
  <rect class="box-warn" x="132.0" y="36" width="18.0" height="20" rx="2"/>
  <text class="ink sm b" x="156.0" y="51" text-anchor="start">-2</text>
  <text class="ink2 sm" x="30" y="81" text-anchor="start">30 − 27</text>
  <rect class="box-warn" x="150.0" y="66" width="27.0" height="20" rx="2"/>
  <text class="ink sm b" x="183.0" y="81" text-anchor="start">+3</text>
  <text class="ink2 sm" x="30" y="111" text-anchor="start">40 − 41</text>
  <rect class="box-warn" x="141.0" y="96" width="9.0" height="20" rx="2"/>
  <text class="ink sm b" x="156.0" y="111" text-anchor="start">-1</text>
  <text class="ink2 sm" x="30" y="141" text-anchor="start">50 − 40</text>
  <rect class="box-err" x="150.0" y="126" width="90.0" height="20" rx="2"/>
  <text class="ink sm b" x="246.0" y="141" text-anchor="start">+10</text>
  <path class="ln-mut" d="M150,30 L150,156"/>
  <text class="ink sm b" x="120" y="184" text-anchor="middle">MAE = (2 + 3 + 1 + 10) / 4 = 4.0</text>
  <text class="mut sm" x="420" y="22" text-anchor="middle">квадраты ошибок (площадь)</text>
  <rect class="box-warn" x="330" y="132.0" width="18.0" height="18.0" rx="1"/>
  <text class="ink2 sm" x="339.0" y="168" text-anchor="middle">4</text>
  <rect class="box-warn" x="360" y="123.0" width="27.0" height="27.0" rx="1"/>
  <text class="ink2 sm" x="373.5" y="168" text-anchor="middle">9</text>
  <rect class="box-warn" x="399" y="141.0" width="9.0" height="9.0" rx="1"/>
  <text class="ink2 sm" x="403.5" y="168" text-anchor="middle">1</text>
  <rect class="box-err" x="420" y="60.0" width="90.0" height="90.0" rx="1"/>
  <text class="ink2 sm" x="465.0" y="168" text-anchor="middle">100</text>
  <text class="ink sm b" x="450" y="184" text-anchor="middle">RMSE = √(114 / 4) ≈ 5.34: промах на 10 даёт 100 из 114</text>
  <text class="mut sm" x="350" y="222" text-anchor="middle">R²: сравнить с ответом «всегда среднее» (35)</text>
  <rect class="box" x="140" y="232" width="300.0" height="18" rx="2"/>
  <text class="ink2 sm" x="446.0" y="246" text-anchor="start">ответ «35»: сумма квадратов 500</text>
  <rect class="box-acc" x="140" y="256" width="68.4" height="18" rx="2"/>
  <text class="ink2 sm" x="214.4" y="270" text-anchor="start">модель: 114</text>
  <text class="ink sm b" x="350" y="294" text-anchor="middle">R² = 1 − 114 / 500 = 0.772: модель убрала 77 % разброса, оставшегося бы при ответе «среднее»</text>
</svg>
