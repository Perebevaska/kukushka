<svg viewBox="0 0 700 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-monitor-timeline">
  <title id="t-monitor-timeline">Что и когда видно при мониторинге модели</title>
  <defs><marker id="ah-monitor-timeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="190" y="28" width="200" height="30" rx="4"/>
  <text class="ink sm b" x="290.0" y="48" text-anchor="middle">обучение</text>
  <rect class="box" x="390" y="28" width="250" height="30" rx="4"/>
  <text class="ink sm" x="465.0" y="48" text-anchor="middle">модель работает</text>
  <rect class="box-err" x="540" y="28" width="100" height="30" rx="4"/>
  <text class="err sm b" x="590.0" y="48" text-anchor="middle">сбой</text>
  <text class="err sm b" x="534" y="18" text-anchor="end">с 1 августа: минуты вместо часов</text>
  <text class="mut sm" x="215.0" y="76" text-anchor="middle">янв</text>
  <text class="mut sm" x="265.0" y="76" text-anchor="middle">фев</text>
  <text class="mut sm" x="315.0" y="76" text-anchor="middle">мар</text>
  <text class="mut sm" x="365.0" y="76" text-anchor="middle">апр</text>
  <text class="mut sm" x="415.0" y="76" text-anchor="middle">май</text>
  <text class="mut sm" x="465.0" y="76" text-anchor="middle">июн</text>
  <text class="mut sm" x="515.0" y="76" text-anchor="middle">июл</text>
  <text class="mut sm" x="565.0" y="76" text-anchor="middle">авг</text>
  <text class="mut sm" x="615.0" y="76" text-anchor="middle">сен</text>
  <text class="mut sm" x="665.0" y="76" text-anchor="middle">окт</text>
  <path class="ln-err dash" d="M540,22 L540,238"/>
  <text class="ink b" x="14" y="112" text-anchor="start">входы</text>
  <text class="mut sm" x="14" y="130" text-anchor="start">медианы, пропуски, категории</text>
  <path class="ln-mut" d="M190,108 L690,108"/>
  <circle class="box-err" cx="540" cy="108" r="7"/>
  <text class="err sm b" x="528" y="100" text-anchor="end">медиана response_hours × 60</text>
  <text class="ink2 sm" x="552" y="126" text-anchor="start">день 1</text>
  <text class="ink b" x="14" y="162" text-anchor="start">выход</text>
  <text class="mut sm" x="14" y="180" text-anchor="start">средний прогноз, доля &gt; 0.3</text>
  <path class="ln-mut" d="M190,158 L690,158"/>
  <circle class="box-err" cx="540" cy="158" r="7"/>
  <text class="err sm b" x="528" y="150" text-anchor="end">средний прогноз 0.12 → 0.01</text>
  <text class="ink2 sm" x="552" y="176" text-anchor="start">день 1</text>
  <text class="ink b" x="14" y="212" text-anchor="start">качество</text>
  <text class="mut sm" x="14" y="230" text-anchor="start">AUC, прогноз против факта</text>
  <path class="ln-mut" d="M190,208 L690,208"/>
  <circle class="box-warn" cx="650.0" cy="208" r="7"/>
  <text class="warn sm b" x="532" y="200" text-anchor="end">AUC 0.65–0.71 — только через 1–2 месяца</text>
  <text class="ink2 sm" x="662.0" y="226" text-anchor="end"></text>
  <path class="ln dash" d="M544,208 L641.0,208" marker-end="url(#ah-monitor-timeline)"/>
  <text class="mut sm" x="350" y="258" text-anchor="middle">входы и выход видны в день сбоя, качество — с задержкой: поэтому мониторинг начинают с них</text>
</svg>
