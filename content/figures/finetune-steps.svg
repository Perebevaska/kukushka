<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-finetune-steps">
  <title id="t-finetune-steps">Дообучение по шагам: своя голова → обучить её при замороженном теле → разморозить верхний блок с шагом в 10 раз меньше</title>
  <defs><marker id="ah-finetune-steps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="14" y="86" text-anchor="start">шаг 2: голова</text>
  <rect class="box dash" x="150" y="60" width="84" height="44" rx="4"/>
  <text class="mut sm" x="192" y="80" text-anchor="middle">conv1</text>
  <text class="mut sm" x="192" y="96" text-anchor="middle">заморожен</text>
  <path class="ln-mut" d="M234,82 L240,82"/>
  <rect class="box dash" x="240" y="60" width="84" height="44" rx="4"/>
  <text class="mut sm" x="282" y="80" text-anchor="middle">layer1</text>
  <text class="mut sm" x="282" y="96" text-anchor="middle">заморожен</text>
  <path class="ln-mut" d="M324,82 L330,82"/>
  <rect class="box dash" x="330" y="60" width="84" height="44" rx="4"/>
  <text class="mut sm" x="372" y="80" text-anchor="middle">layer2</text>
  <text class="mut sm" x="372" y="96" text-anchor="middle">заморожен</text>
  <path class="ln-mut" d="M414,82 L420,82"/>
  <rect class="box dash" x="420" y="60" width="84" height="44" rx="4"/>
  <text class="mut sm" x="462" y="80" text-anchor="middle">layer3</text>
  <text class="mut sm" x="462" y="96" text-anchor="middle">заморожен</text>
  <path class="ln-mut" d="M504,82 L510,82"/>
  <rect class="box dash" x="510" y="60" width="84" height="44" rx="4"/>
  <text class="mut sm" x="552" y="80" text-anchor="middle">layer4</text>
  <text class="mut sm" x="552" y="96" text-anchor="middle">заморожен</text>
  <path class="ln-mut" d="M594,82 L600,82"/>
  <rect class="box-ok" x="600" y="60" width="84" height="44" rx="4"/>
  <text class="ink sm b" x="642" y="80" text-anchor="middle">fc: 512 → 4</text>
  <text class="ink2 sm" x="642" y="96" text-anchor="middle">lr 1e-3</text>
  <text class="ink sm b" x="14" y="176" text-anchor="start">шаг 3: + layer4</text>
  <rect class="box dash" x="150" y="150" width="84" height="44" rx="4"/>
  <text class="mut sm" x="192" y="170" text-anchor="middle">conv1</text>
  <text class="mut sm" x="192" y="186" text-anchor="middle">заморожен</text>
  <path class="ln-mut" d="M234,172 L240,172"/>
  <rect class="box dash" x="240" y="150" width="84" height="44" rx="4"/>
  <text class="mut sm" x="282" y="170" text-anchor="middle">layer1</text>
  <text class="mut sm" x="282" y="186" text-anchor="middle">заморожен</text>
  <path class="ln-mut" d="M324,172 L330,172"/>
  <rect class="box dash" x="330" y="150" width="84" height="44" rx="4"/>
  <text class="mut sm" x="372" y="170" text-anchor="middle">layer2</text>
  <text class="mut sm" x="372" y="186" text-anchor="middle">заморожен</text>
  <path class="ln-mut" d="M414,172 L420,172"/>
  <rect class="box dash" x="420" y="150" width="84" height="44" rx="4"/>
  <text class="mut sm" x="462" y="170" text-anchor="middle">layer3</text>
  <text class="mut sm" x="462" y="186" text-anchor="middle">заморожен</text>
  <path class="ln-mut" d="M504,172 L510,172"/>
  <rect class="box-acc" x="510" y="150" width="84" height="44" rx="4"/>
  <text class="ink sm b" x="552" y="170" text-anchor="middle">layer4</text>
  <text class="ink2 sm" x="552" y="186" text-anchor="middle">lr 1e-4</text>
  <path class="ln-mut" d="M594,172 L600,172"/>
  <rect class="box-ok" x="600" y="150" width="84" height="44" rx="4"/>
  <text class="ink sm b" x="642" y="170" text-anchor="middle">fc: 512 → 4</text>
  <text class="ink2 sm" x="642" y="186" text-anchor="middle">lr 1e-3</text>
  <text class="ink2 sm" x="360.0" y="40" text-anchor="middle">тело ResNet-18 (предобучено на ImageNet)</text>
  <text class="ok sm b" x="642" y="40" text-anchor="middle">новая голова</text>
  <text class="mut sm" x="350" y="236" text-anchor="middle">нижние слои (края, текстуры) универсальны — их часто не трогают совсем</text>
  <text class="mut sm" x="350" y="256" text-anchor="middle">requires_grad = False — веса не меняются; группы параметров Adam — свой шаг у каждой</text>
</svg>
