<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-share-adjust">
  <title id="t-share-adjust">Поправка доли на ошибки классификатора: наблюдаемая доля смешивает пойманных недовольных и ложные срабатывания</title>
  <defs><marker id="ah-share-adjust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm" x="350" y="20" text-anchor="middle">игрушечный пример: 1000 отзывов, по-настоящему недовольны 10 %, TPR = 0.9, FPR = 0.05</text>
  <rect class="box-err" x="30" y="36" width="64.0" height="40" rx="3"/>
  <text class="ink sm b" x="62.0" y="61" text-anchor="middle">100</text>
  <rect class="box-ok" x="94.0" y="36" width="576.0" height="40" rx="3"/>
  <text class="ink sm b" x="382.0" y="61" text-anchor="middle">900 довольны</text>
  <text class="err sm" x="30" y="92" text-anchor="start">недовольны</text>
  <text class="ink2 sm b" x="350" y="112" text-anchor="middle">что видит модель:</text>
  <rect class="box-err" x="30" y="122" width="57.6" height="40" rx="3"/>
  <text class="ink sm b" x="58.8" y="147" text-anchor="middle">90</text>
  <rect class="box-warn" x="87.6" y="122" width="28.800000000000004" height="40" rx="3"/>
  <text class="ink sm b" x="102.0" y="147" text-anchor="middle">45</text>
  <rect class="box" x="116.4" y="122" width="553.6" height="40" rx="3"/>
  <text class="ink2 sm" x="130.4" y="147" text-anchor="start">остальные: модель говорит «доволен»</text>
  <text class="err sm b" x="30" y="180" text-anchor="start">пойманы: 0.9 · 100 = 90</text>
  <text class="warn sm b" x="250" y="180" text-anchor="start">ложные: 0.05 · 900 = 45</text>
  <text class="ink sm b" x="480" y="180" text-anchor="start">наблюдаем p = 0.135</text>
  <rect class="box-acc" x="30" y="206" width="640" height="44" rx="6"/>
  <text class="ink sm b" x="350" y="226" text-anchor="middle">обратно: q = (p − FPR) / (TPR − FPR) = (0.135 − 0.05) / (0.9 − 0.05) = 0.10</text>
  <text class="ink2 sm" x="350" y="243" text-anchor="middle">без поправки доля завышена: ложные срабатывания добавились, часть недовольных потеряна</text>
</svg>
