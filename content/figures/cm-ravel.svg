<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cm-ravel">
  <title id="t-cm-ravel">Восемь гостей → матрица ошибок → ravel()</title>
  <defs><marker id="ah-cm-ravel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="20" y="22" text-anchor="start">восемь гостей: факт, прогноз</text>
  <rect class="box-acc" x="20" y="32" width="46" height="44" rx="4"/>
  <text class="ink sm" x="43" y="50" text-anchor="middle">1, 1</text>
  <text class="ink sm b" x="43" y="68" text-anchor="middle">TP</text>
  <rect class="box-warn" x="72" y="32" width="46" height="44" rx="4"/>
  <text class="ink sm" x="95" y="50" text-anchor="middle">0, 1</text>
  <text class="ink sm b" x="95" y="68" text-anchor="middle">FP</text>
  <rect class="box-err" x="124" y="32" width="46" height="44" rx="4"/>
  <text class="ink sm" x="147" y="50" text-anchor="middle">1, 0</text>
  <text class="ink sm b" x="147" y="68" text-anchor="middle">FN</text>
  <rect class="box-acc" x="176" y="32" width="46" height="44" rx="4"/>
  <text class="ink sm" x="199" y="50" text-anchor="middle">1, 1</text>
  <text class="ink sm b" x="199" y="68" text-anchor="middle">TP</text>
  <rect class="box" x="228" y="32" width="46" height="44" rx="4"/>
  <text class="ink sm" x="251" y="50" text-anchor="middle">0, 0</text>
  <text class="ink sm b" x="251" y="68" text-anchor="middle">TN</text>
  <rect class="box" x="280" y="32" width="46" height="44" rx="4"/>
  <text class="ink sm" x="303" y="50" text-anchor="middle">0, 0</text>
  <text class="ink sm b" x="303" y="68" text-anchor="middle">TN</text>
  <rect class="box-warn" x="332" y="32" width="46" height="44" rx="4"/>
  <text class="ink sm" x="355" y="50" text-anchor="middle">0, 1</text>
  <text class="ink sm b" x="355" y="68" text-anchor="middle">FP</text>
  <rect class="box" x="384" y="32" width="46" height="44" rx="4"/>
  <text class="ink sm" x="407" y="50" text-anchor="middle">0, 0</text>
  <text class="ink sm b" x="407" y="68" text-anchor="middle">TN</text>
  <text class="ink2 sm" x="470" y="50" text-anchor="start">TP — сказали «уйдёт», ушёл</text>
  <text class="ink2 sm" x="470" y="68" text-anchor="start">FP — «уйдёт», а остался</text>
  <text class="ink2 sm" x="470" y="86" text-anchor="start">FN — «останется», а ушёл</text>
  <text class="ink2 sm" x="470" y="104" text-anchor="start">TN — «останется», остался</text>
  <path class="ln" d="M200,84 L200,116" marker-end="url(#ah-cm-ravel)"/>
  <text class="mut sm" x="212" y="104" text-anchor="start">считаем исходы</text>
  <text class="mut sm" x="168.0" y="132" text-anchor="middle">прогноз 0</text>
  <text class="mut sm" x="264.0" y="132" text-anchor="middle">прогноз 1</text>
  <text class="mut sm" x="112" y="165.0" text-anchor="end">факт 0</text>
  <text class="mut sm" x="112" y="207.0" text-anchor="end">факт 1</text>
  <rect class="box" x="120" y="140" width="94" height="40" rx="3"/>
  <text class="ink sm b" x="167.0" y="166.0" text-anchor="middle">TN 3</text>
  <rect class="box-warn" x="216" y="140" width="94" height="40" rx="3"/>
  <text class="ink sm b" x="263.0" y="166.0" text-anchor="middle">FP 2</text>
  <rect class="box-err" x="120" y="182" width="94" height="40" rx="3"/>
  <text class="ink sm b" x="167.0" y="208.0" text-anchor="middle">FN 1</text>
  <rect class="box-acc" x="216" y="182" width="94" height="40" rx="3"/>
  <text class="ink sm b" x="263.0" y="208.0" text-anchor="middle">TP 2</text>
  <text class="mut sm" x="216" y="240" text-anchor="middle">строки — факт, столбцы — прогноз</text>
  <path class="ln" d="M330,182 L400,182" marker-end="url(#ah-cm-ravel)"/>
  <text class="acc sm b" x="365" y="172" text-anchor="middle">ravel()</text>
  <rect class="box" x="410" y="164" width="60" height="36" rx="3"/>
  <text class="ink b" x="440.0" y="187.0" text-anchor="middle">3</text>
  <rect class="box-warn" x="470" y="164" width="60" height="36" rx="3"/>
  <text class="ink b" x="500.0" y="187.0" text-anchor="middle">2</text>
  <rect class="box-err" x="530" y="164" width="60" height="36" rx="3"/>
  <text class="ink b" x="560.0" y="187.0" text-anchor="middle">1</text>
  <rect class="box-acc" x="590" y="164" width="60" height="36" rx="3"/>
  <text class="ink b" x="620.0" y="187.0" text-anchor="middle">2</text>
  <text class="ink2 sm b" x="440" y="218" text-anchor="middle">1. TN</text>
  <text class="ink2 sm b" x="500" y="218" text-anchor="middle">2. FP</text>
  <text class="ink2 sm b" x="560" y="218" text-anchor="middle">3. FN</text>
  <text class="ink2 sm b" x="620" y="218" text-anchor="middle">4. TP</text>
  <text class="mut sm" x="530" y="246" text-anchor="middle">по строкам: сначала факт 0, потом факт 1</text>
</svg>
