<svg viewBox="0 0 700 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-pilot-incremental">
  <title id="t-pilot-incremental">Пилот с контролем: доход дают только удержанные сверх контроля</title>
  <defs><marker id="ah-pilot-incremental" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="150" y="46" text-anchor="end">контроль</text>
  <text class="mut sm" x="150" y="62" text-anchor="end">1000 гостей, без бонуса</text>
  <rect class="box-ok" x="160" y="34" width="163.5" height="34" rx="0"/>
  <text class="ink sm" x="241.75" y="56" text-anchor="middle">остались 327</text>
  <rect class="box-err" x="323.5" y="34" width="336.5" height="34" rx="0"/>
  <text class="ink sm" x="491.75" y="56" text-anchor="middle">ушли 673 (67.3 %)</text>
  <text class="ink b" x="150" y="112" text-anchor="end">бонус</text>
  <text class="mut sm" x="150" y="128" text-anchor="end">1000 гостей</text>
  <rect class="box-ok" x="160" y="100" width="163.5" height="34" rx="0"/>
  <text class="ink sm" x="241.75" y="122" text-anchor="middle">остались бы и так 327</text>
  <rect class="box-acc" x="323.5" y="100" width="68.5" height="34" rx="0"/>
  <text class="acc sm b" x="357.75" y="122" text-anchor="middle">+137</text>
  <rect class="box-err" x="392.0" y="100" width="268.0" height="34" rx="0"/>
  <text class="ink sm" x="526.0" y="122" text-anchor="middle">ушли 536 (53.6 %)</text>
  <path class="ln-mut dash" d="M323.5,28 L323.5,140"/>
  <path class="ln-acc" d="M392.0,140 L392.0,152"/>
  <path class="ln-acc" d="M323.5,140 L323.5,152"/>
  <path class="ln-acc" d="M323.5,152 L392.0,152"/>
  <text class="acc sm b" x="357.75" y="168" text-anchor="middle">эффект бонуса: 67.3 % − 53.6 % = 13.7 п. п.</text>
  <text class="ink sm" x="350" y="200" text-anchor="middle"><tspan class="ink2">доход — только за этих 137:  </tspan><tspan class="b">137 × 2400 − 1000 × 200 = 128 800 ₽</tspan><tspan class="ok b">  →  129 ₽ на бонус</tspan></text>
  <text class="ink2 sm" x="350" y="224" text-anchor="middle">офлайн-расчёт обещал 230 ₽ на бонус: допущение «удержание 25  %» оказалось оптимистичным (вышло 20 %)</text>
  <text class="mut sm" x="350" y="250" text-anchor="middle">«остались 464 из 1000 с бонусом» — не эффект: 327 из них остались бы и без бонуса</text>
</svg>
