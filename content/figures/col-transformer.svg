<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-col-transformer">
  <title id="t-col-transformer">ColumnTransformer: своя обработка для каждой группы столбцов</title>
  <defs><marker id="ah-col-transformer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20" y="40" width="150" height="200" rx="6"/>
  <text class="ink sm b" x="95.0" y="93.5" text-anchor="middle">сырой X_train</text>
  <text class="" x="95.0" y="110.5" text-anchor="middle"></text>
  <text class="ink2 sm" x="95.0" y="127.5" text-anchor="middle">8 числовых</text>
  <text class="mut sm" x="95.0" y="144.5" text-anchor="middle">(с пропусками)</text>
  <text class="" x="95.0" y="161.5" text-anchor="middle"></text>
  <text class="ink2 sm" x="95.0" y="178.5" text-anchor="middle">2 текстовых:</text>
  <text class="ink2 sm" x="95.0" y="195.5" text-anchor="middle">city, fav_category</text>
  <rect class="box-acc" x="210" y="44" width="200" height="74" rx="6"/>
  <text class="ink sm b" x="310.0" y="68.5" text-anchor="middle">"num": 8 столбцов</text>
  <text class="ink2 sm" x="310.0" y="85.5" text-anchor="middle">SimpleImputer(0)</text>
  <text class="ink2 sm" x="310.0" y="102.5" text-anchor="middle">→ StandardScaler</text>
  <rect class="box-warn" x="210" y="140" width="200" height="74" rx="6"/>
  <text class="ink sm b" x="310.0" y="164.5" text-anchor="middle">"cat": 2 столбца</text>
  <text class="ink2 sm" x="310.0" y="181.5" text-anchor="middle">OneHotEncoder</text>
  <text class="ink2 sm" x="310.0" y="198.5" text-anchor="middle">(handle_unknown="ignore")</text>
  <path class="ln" d="M172,100 L208,82" marker-end="url(#ah-col-transformer)"/>
  <path class="ln" d="M172,180 L208,178" marker-end="url(#ah-col-transformer)"/>
  <rect class="box-acc" x="450" y="44" width="120" height="74" rx="6"/>
  <text class="ink sm b" x="510.0" y="77.0" text-anchor="middle">8 столбцов</text>
  <text class="ink2 sm" x="510.0" y="94.0" text-anchor="middle">num__…</text>
  <rect class="box-warn" x="450" y="140" width="120" height="74" rx="6"/>
  <text class="ink sm b" x="510.0" y="164.5" text-anchor="middle">4 города + 3</text>
  <text class="ink sm b" x="510.0" y="181.5" text-anchor="middle">категории = 7</text>
  <text class="ink2 sm" x="510.0" y="198.5" text-anchor="middle">cat__…</text>
  <path class="ln" d="M412,81 L448,81" marker-end="url(#ah-col-transformer)"/>
  <path class="ln" d="M412,177 L448,177" marker-end="url(#ah-col-transformer)"/>
  <rect class="box-ok" x="600" y="96" width="80" height="70" rx="6"/>
  <text class="ink2 sm" x="640.0" y="118.5" text-anchor="middle">итого</text>
  <text class="ink b" x="640.0" y="135.5" text-anchor="middle">15</text>
  <text class="ink2 sm" x="640.0" y="152.5" text-anchor="middle">столбцов</text>
  <path class="ln" d="M572,81 L598,118" marker-end="url(#ah-col-transformer)"/>
  <path class="ln" d="M572,177 L598,146" marker-end="url(#ah-col-transformer)"/>
  <rect class="box-err" x="210" y="236" width="200" height="40" rx="6"/>
  <text class="ink sm b" x="310.0" y="252.0" text-anchor="middle">не попал в списки</text>
  <text class="ink2 sm" x="310.0" y="269.0" text-anchor="middle">→ remainder="drop"</text>
  <text class="mut sm" x="430" y="252" text-anchor="start">забытый столбец пропадёт молча:</text>
  <text class="mut sm" x="430" y="270" text-anchor="start">сверяйте get_feature_names_out()</text>
</svg>
