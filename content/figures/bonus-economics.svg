<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-bonus-economics">
  <title id="t-bonus-economics">Экономика бонуса: сколько приносит и стоит каждое решение</title>
  <defs><marker id="ah-bonus-economics" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="250" y="14" width="200" height="46" rx="8"/>
  <text class="ink b" x="350" y="34" text-anchor="middle">дали бонус 200 ₽</text>
  <text class="ink2 sm" x="350" y="52" text-anchor="middle">гостю из списка модели</text>
  <path class="ln" d="M300,62 L180,94" marker-end="url(#ah-bonus-economics)"/>
  <path class="ln" d="M400,62 L520,94" marker-end="url(#ah-bonus-economics)"/>
  <rect class="box-ok" x="40" y="98" width="280" height="96" rx="8"/>
  <text class="ink sm b" x="180" y="120" text-anchor="middle">гость собирался уйти (TP)</text>
  <text class="ink2 sm" x="180" y="142" text-anchor="middle">удержим с вероятностью 25 %</text>
  <text class="ink sm" x="180" y="160" text-anchor="middle">0.25 × 2400 − 200</text>
  <text class="ok b" x="180" y="182" text-anchor="middle">= +400 ₽ в среднем</text>
  <rect class="box-err" x="380" y="98" width="280" height="96" rx="8"/>
  <text class="ink sm b" x="520" y="120" text-anchor="middle">гость и так остался бы (FP)</text>
  <text class="ink2 sm" x="520" y="142" text-anchor="middle">бонус ничего не изменил</text>
  <text class="ink sm" x="520" y="160" text-anchor="middle">0 − 200</text>
  <text class="err b" x="520" y="182" text-anchor="middle">= −200 ₽</text>
  <text class="ink2" x="350" y="220" text-anchor="middle">бонус окупается, если риск ухода p даёт p × 600 &gt; 200, то есть p &gt; 1/3</text>
  <text class="mut sm" x="350" y="240" text-anchor="middle">(2400 ₽ — маржа удержанного гостя за полгода; 25 % — доля удержанных бонусом)</text>
</svg>
