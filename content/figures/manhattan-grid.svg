<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-manhattan-grid">
  <title id="t-manhattan-grid">Евклидово и манхэттенское расстояние от кофейни до заказа</title>
  <defs><marker id="ah-manhattan-grid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <path class="ln-mut" d="M120,260 L120,50"/>
  <path class="ln-mut" d="M170,260 L170,50"/>
  <path class="ln-mut" d="M220,260 L220,50"/>
  <path class="ln-mut" d="M270,260 L270,50"/>
  <path class="ln-mut" d="M320,260 L320,50"/>
  <path class="ln-mut" d="M120,260 L320,260"/>
  <path class="ln-mut" d="M120,210 L320,210"/>
  <path class="ln-mut" d="M120,160 L320,160"/>
  <path class="ln-mut" d="M120,110 L320,110"/>
  <path class="ln-mut" d="M120,60 L320,60"/>
  <text class="mut sm" x="120" y="278" text-anchor="middle">0</text>
  <text class="mut sm" x="170" y="278" text-anchor="middle">1</text>
  <text class="mut sm" x="220" y="278" text-anchor="middle">2</text>
  <text class="mut sm" x="270" y="278" text-anchor="middle">3</text>
  <text class="mut sm" x="320" y="278" text-anchor="middle">4</text>
  <text class="mut sm" x="108" y="214" text-anchor="middle">1</text>
  <text class="mut sm" x="108" y="164" text-anchor="middle">2</text>
  <text class="mut sm" x="108" y="114" text-anchor="middle">3</text>
  <text class="mut sm" x="108" y="64" text-anchor="middle">4</text>
  <text class="mut sm" x="220" y="296" text-anchor="middle">км на восток</text>
  <path class="ln-err" d="M120,260 L270,260"/>
  <path class="ln-err" d="M270,260 L270,68" marker-end="url(#ah-manhattan-grid)"/>
  <path class="ln-acc" d="M120,260 L265,67" marker-end="url(#ah-manhattan-grid)"/>
  <circle class="box-ok" cx="120" cy="260" r="7"/>
  <circle class="box-warn" cx="270" cy="60" r="7"/>
  <text class="ok sm b" x="106" y="248" text-anchor="end">кофейня</text>
  <text class="warn sm b" x="282" y="56" text-anchor="start">заказ (3, 4)</text>
  <text class="acc b" x="180.0" y="140.0" text-anchor="end">5 км</text>
  <text class="err sm b" x="195.0" y="252" text-anchor="middle">3</text>
  <text class="err sm b" x="280" y="160" text-anchor="start">4</text>
  <text class="acc b" x="400" y="50" text-anchor="start">по прямой (евклидово, L2)</text>
  <text class="ink sm" x="400" y="72" text-anchor="start">√(3² + 4²) = √25 = 5 км</text>
  <text class="mut sm" x="400" y="90" text-anchor="start">np.linalg.norm(diff)</text>
  <text class="err b" x="400" y="130" text-anchor="start">по улицам (манхэттенское, L1)</text>
  <text class="ink sm" x="400" y="152" text-anchor="start">|3| + |4| = 7 км</text>
  <text class="mut sm" x="400" y="170" text-anchor="start">np.abs(diff).sum()</text>
  <text class="ink2 sm" x="400" y="212" text-anchor="start">любой путь «по ступенькам» вверх-вправо</text>
  <text class="ink2 sm" x="400" y="230" text-anchor="start">тоже 7 км: сумма ходов по каждой оси</text>
  <text class="ink2 sm" x="400" y="254" text-anchor="start">L1 ≥ L2 всегда; равны, только если</text>
  <text class="ink2 sm" x="400" y="272" text-anchor="start">точки отличаются по одной оси</text>
</svg>
