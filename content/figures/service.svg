<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-service">
  <title id="t-service">Модель как сервис: запрос, проверка, ответ</title>
  <defs><marker id="ah-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="80" width="120" height="70" rx="8"/>
  <text class="ink sm b" x="74" y="108" text-anchor="middle">приложение</text>
  <text class="ink2 sm" x="74" y="128" text-anchor="middle">или касса</text>
  <path class="ln" d="M136,100 L190,100" marker-end="url(#ah-service)"/>
  <text class="acc sm b" x="163" y="90" text-anchor="middle">JSON</text>
  <rect class="box-acc" x="194" y="20" width="330" height="190" rx="10"/>
  <text class="acc b" x="359" y="42" text-anchor="middle">сервис</text>
  <rect class="box" x="210" y="56" width="140" height="60" rx="6"/>
  <text class="ink sm b" x="280" y="80" text-anchor="middle">проверка входа</text>
  <text class="ink2 sm" x="280" y="98" text-anchor="middle">типы, границы</text>
  <path class="ln" d="M352,86 L374,86" marker-end="url(#ah-service)"/>
  <rect class="box-ok" x="378" y="56" width="130" height="60" rx="6"/>
  <text class="ink sm b" x="443" y="80" text-anchor="middle">модель</text>
  <text class="ink2 sm" x="443" y="98" text-anchor="middle">predict_proba</text>
  <rect class="box-err" x="210" y="136" width="140" height="58" rx="6"/>
  <text class="ink sm b" x="280" y="160" text-anchor="middle">422 — ошибка</text>
  <text class="ink2 sm" x="280" y="178" text-anchor="middle">клиента</text>
  <path class="ln" d="M280,118 L280,132" marker-end="url(#ah-service)"/>
  <rect class="box-err" x="378" y="136" width="130" height="58" rx="6"/>
  <text class="ink sm b" x="443" y="160" text-anchor="middle">500 — сломался</text>
  <text class="ink2 sm" x="443" y="178" text-anchor="middle">сам сервис</text>
  <path class="ln" d="M443,118 L443,132" marker-end="url(#ah-service)"/>
  <path class="ln" d="M526,86 L566,86" marker-end="url(#ah-service)"/>
  <rect class="box-ok" x="570" y="52" width="118" height="72" rx="8"/>
  <text class="ok b" x="629" y="76" text-anchor="middle">200</text>
  <text class="ink2 sm" x="629" y="96" text-anchor="middle">{"proba": 0.27,</text>
  <text class="ink2 sm" x="629" y="112" text-anchor="middle">"in_campaign": …}</text>
  <text class="ink2 sm" x="350" y="236" text-anchor="middle">рост 422 — проблема у тех, кто присылает данные; рост 500 — проблема у нас</text>
</svg>
