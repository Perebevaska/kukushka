<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-tabular-vs-raw">
  <title id="t-nn-tabular-vs-raw">Где признаки уже есть, а где их строит сеть</title>
  <defs><marker id="ah-nn-tabular-vs-raw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="20" y="26" text-anchor="start">табличные данные: признаки уже осмысленные</text>
  <text class="mut sm" x="680" y="26" text-anchor="end">строки и пиксели — пример</text>
  <text class="mut sm" x="70" y="52" text-anchor="middle">дней с визита</text>
  <rect class="box" x="28" y="60" width="84" height="26" rx="2"/>
  <text class="ink sm" x="70" y="78" text-anchor="middle">45</text>
  <rect class="box" x="28" y="86" width="84" height="26" rx="2"/>
  <text class="ink sm" x="70" y="104" text-anchor="middle">3</text>
  <text class="mut sm" x="160" y="52" text-anchor="middle">жалоб</text>
  <rect class="box" x="118" y="60" width="84" height="26" rx="2"/>
  <text class="ink sm" x="160" y="78" text-anchor="middle">1</text>
  <rect class="box" x="118" y="86" width="84" height="26" rx="2"/>
  <text class="ink sm" x="160" y="104" text-anchor="middle">0</text>
  <text class="mut sm" x="250" y="52" text-anchor="middle">визитов</text>
  <rect class="box" x="208" y="60" width="84" height="26" rx="2"/>
  <text class="ink sm" x="250" y="78" text-anchor="middle">2</text>
  <rect class="box" x="208" y="86" width="84" height="26" rx="2"/>
  <text class="ink sm" x="250" y="104" text-anchor="middle">9</text>
  <path class="ln-acc" d="M300,86 L350,86" marker-end="url(#ah-nn-tabular-vs-raw)"/>
  <rect class="box-ok" x="352" y="60" width="160" height="52" rx="8"/>
  <text class="ink sm b" x="432" y="82" text-anchor="middle">деревья, бустинг</text>
  <text class="ink2 sm" x="432" y="100" text-anchor="middle">«дней &gt; 30 и жалоба»</text>
  <text class="mut sm" x="600" y="76" text-anchor="middle">отток, AUC:</text>
  <text class="ok sm b" x="600" y="94" text-anchor="middle">бустинг ≈ 0.93</text>
  <text class="ink2 sm" x="600" y="110" text-anchor="middle">MLP ≈ 0.91</text>
  <path class="ln-mut" d="M20,140 L680,140"/>
  <text class="ink b" x="20" y="164" text-anchor="start">изображения, звук, текст: смысл — в сочетании тысяч «сырых» чисел</text>
  <rect class="box" x="30" y="180" width="20" height="20" rx="0"/>
  <rect class="box" x="50" y="180" width="20" height="20" rx="0"/>
  <rect class="box-acc" x="70" y="180" width="20" height="20" rx="0"/>
  <rect class="box" x="90" y="180" width="20" height="20" rx="0"/>
  <rect class="box" x="30" y="200" width="20" height="20" rx="0"/>
  <rect class="box-acc" x="50" y="200" width="20" height="20" rx="0"/>
  <rect class="box" x="70" y="200" width="20" height="20" rx="0"/>
  <rect class="box-acc" x="90" y="200" width="20" height="20" rx="0"/>
  <rect class="box" x="30" y="220" width="20" height="20" rx="0"/>
  <rect class="box" x="50" y="220" width="20" height="20" rx="0"/>
  <rect class="box-acc" x="70" y="220" width="20" height="20" rx="0"/>
  <rect class="box" x="90" y="220" width="20" height="20" rx="0"/>
  <rect class="box" x="30" y="240" width="20" height="20" rx="0"/>
  <rect class="box" x="50" y="240" width="20" height="20" rx="0"/>
  <rect class="box-acc" x="70" y="240" width="20" height="20" rx="0"/>
  <rect class="box" x="90" y="240" width="20" height="20" rx="0"/>
  <text class="mut sm" x="70" y="274" text-anchor="middle">пиксели 0…16</text>
  <text class="mut sm" x="170" y="214" text-anchor="middle">один пиксель</text>
  <text class="mut sm" x="170" y="230" text-anchor="middle">сам по себе</text>
  <text class="mut sm" x="170" y="246" text-anchor="middle">ничего не значит</text>
  <path class="ln-acc" d="M230,222 L280,222" marker-end="url(#ah-nn-tabular-vs-raw)"/>
  <rect class="box-acc" x="282" y="190" width="230" height="66" rx="8"/>
  <text class="ink sm b" x="397" y="212" text-anchor="middle">скрытые слои строят признаки</text>
  <text class="ink2 sm" x="397" y="230" text-anchor="middle">сами: штрихи → петли → цифра</text>
  <text class="mut sm" x="397" y="248" text-anchor="middle">(условно)</text>
  <path class="ln-acc" d="M512,222 L548,222" marker-end="url(#ah-nn-tabular-vs-raw)"/>
  <text class="ok sm b" x="615" y="216" text-anchor="middle">здесь сети</text>
  <text class="ok sm b" x="615" y="234" text-anchor="middle">вне конкуренции</text>
</svg>
