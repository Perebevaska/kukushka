<svg viewBox="0 0 700 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-replace-vs-str">
  <title id="t-replace-vs-str">replace меняет значение целиком, str.replace — кусок внутри строки</title>
  <defs><marker id="ah-replace-vs-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="30" y="30" width="640" height="28" rx="3"/>
  <text class="ink2 sm b" x="100.0" y="48.5" text-anchor="middle">s</text>
  <text class="ink2 sm b" x="295.0" y="48.5" text-anchor="middle">s.replace({"Екб": "Екатеринбург"})</text>
  <text class="ink2 sm b" x="545.0" y="48.5" text-anchor="middle">s.str.replace("Екб", "Екатеринбург")</text>
  <rect class="box" x="30" y="60" width="640" height="28" rx="3"/>
  <text class="ink sm" x="100.0" y="78.5" text-anchor="middle">«Екб»</text>
  <text class="ok sm b" x="295.0" y="78.5" text-anchor="middle">«Екатеринбург»</text>
  <text class="ok sm b" x="545.0" y="78.5" text-anchor="middle">«Екатеринбург»</text>
  <rect class="box" x="30" y="90" width="640" height="28" rx="3"/>
  <text class="ink sm" x="100.0" y="108.5" text-anchor="middle">«Екб-Сити»</text>
  <text class="mut sm" x="295.0" y="108.5" text-anchor="middle">«Екб-Сити»</text>
  <text class="ok sm b" x="545.0" y="108.5" text-anchor="middle">«Екатеринбург-Сити»</text>
  <rect class="box" x="30" y="140" width="640" height="28" rx="3"/>
  <text class="ink2 sm b" x="100.0" y="158.5" text-anchor="middle">s</text>
  <text class="ink2 sm b" x="295.0" y="158.5" text-anchor="middle">s.replace("г.", "")</text>
  <text class="ink2 sm b" x="545.0" y="158.5" text-anchor="middle">s.str.replace("г.", "", regex=False)</text>
  <rect class="box" x="30" y="170" width="640" height="28" rx="3"/>
  <text class="ink sm" x="100.0" y="188.5" text-anchor="middle">«г. Пермь»</text>
  <text class="mut sm" x="295.0" y="188.5" text-anchor="middle">«г. Пермь»</text>
  <text class="ok sm b" x="545.0" y="188.5" text-anchor="middle">« Пермь»</text>
  <rect class="box" x="30" y="200" width="640" height="28" rx="3"/>
  <text class="ink sm" x="100.0" y="218.5" text-anchor="middle">«г.»</text>
  <text class="ok sm b" x="295.0" y="218.5" text-anchor="middle">«»</text>
  <text class="ok sm b" x="545.0" y="218.5" text-anchor="middle">«»</text>
  <text class="ink2 sm" x="305" y="256" text-anchor="middle">целиком: меняет клетку, только если</text>
  <text class="ink2 sm" x="305" y="272" text-anchor="middle">она вся равна ключу — для синонимов</text>
  <text class="ink2 sm" x="555" y="256" text-anchor="middle">кусок: меняет вхождение в любой</text>
  <text class="ink2 sm" x="555" y="272" text-anchor="middle">строке — для приставок и символов</text>
</svg>
