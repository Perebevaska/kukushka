<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-contract-gate">
  <title id="t-contract-gate">Контракт: проверки результата перед сохранением</title>
  <defs><marker id="ah-contract-gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="8" y="74" width="100" height="50" rx="6"/>
  <text class="ink sm b" x="58.0" y="95.5" text-anchor="middle">clients_raw</text>
  <text class="ink sm b" x="58.0" y="111.5" text-anchor="middle">.csv</text>
  <path class="ln" d="M110,99 L128,99" marker-end="url(#ah-contract-gate)"/>
  <rect class="box-acc" x="130" y="74" width="120" height="50" rx="6"/>
  <text class="ink sm b" x="190.0" y="95.5" text-anchor="middle">clean_clients()</text>
  <text class="mut sm" x="190.0" y="111.5" text-anchor="middle">очистка + журнал</text>
  <path class="ln" d="M252,99 L270,99" marker-end="url(#ah-contract-gate)"/>
  <rect class="box-acc" x="272" y="20" width="220" height="160" rx="8"/>
  <text class="acc b" x="382" y="42" text-anchor="middle">check_clients(df)</text>
  <text class="ink sm" x="290" y="68" text-anchor="start">✓ client_id есть у всех</text>
  <text class="ink sm" x="290" y="90" text-anchor="start">✓ client_id уникален</text>
  <text class="ink sm" x="290" y="112" text-anchor="start">✓ пол — М, Ж или пропуск</text>
  <text class="ink sm" x="290" y="134" text-anchor="start">✓ город — из списка</text>
  <text class="ink sm" x="290" y="156" text-anchor="start">✓ бонусы от 0 до 10 000</text>
  <path class="ln" d="M494,70 H520 V57 H536" marker-end="url(#ah-contract-gate)"/>
  <text class="ok sm" x="616" y="24" text-anchor="middle">все проверки прошли</text>
  <rect class="box-ok" x="540" y="32" width="152" height="50" rx="6"/>
  <text class="ink sm b" x="616.0" y="53.5" text-anchor="middle">to_csv(…, index=False)</text>
  <text class="ink2 sm" x="616.0" y="69.5" text-anchor="middle">clients_clean.csv</text>
  <path class="ln" d="M494,130 H520 V150 H536" marker-end="url(#ah-contract-gate)"/>
  <text class="err sm" x="616" y="196" text-anchor="middle">хоть одно нарушено</text>
  <rect class="box-err" x="540" y="124" width="152" height="56" rx="6"/>
  <text class="err sm b" x="616.0" y="140.5" text-anchor="middle">AssertionError:</text>
  <text class="ink2 sm" x="616.0" y="156.5" text-anchor="middle">«номера карт</text>
  <text class="ink2 sm" x="616.0" y="172.5" text-anchor="middle">повторяются» — стоп</text>
  <text class="ink2 sm" x="350" y="224" text-anchor="middle">лучше упасть с понятной ошибкой сейчас, чем найти гостя, посчитанного дважды, в отчёте</text>
  <text class="mut sm" x="350" y="242" text-anchor="middle">контракт запускают на каждой новой выгрузке</text>
</svg>
