<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-report-funnel">
  <title id="t-report-funnel">Путь строк выгрузки от файла до отчёта</title>
  <defs><marker id="ah-report-funnel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm" x="20" y="53" text-anchor="start">в файле</text>
  <rect class="box" x="180" y="30" width="300.0" height="36" rx="4"/>
  <text class="ink b" x="470.0" y="53" text-anchor="end">41 строка</text>
  <text class="ink2 sm" x="20" y="107" text-anchor="start">после чистки сумм</text>
  <rect class="box" x="180" y="84" width="278.0487804878049" height="36" rx="4"/>
  <text class="ink b" x="448.0487804878049" y="107" text-anchor="end">38 строк</text>
  <text class="ink2 sm" x="20" y="161" text-anchor="start">после удаления дублей</text>
  <rect class="box-ok" x="180" y="138" width="270.7317073170732" height="36" rx="4"/>
  <text class="ink b" x="440.7317073170732" y="161" text-anchor="end">37 строк</text>
  <text class="err sm b" x="494" y="107" text-anchor="start">− 3 строки с битой суммой</text>
  <text class="err sm b" x="494" y="161" text-anchor="start">− 1 заказ выгружен дважды</text>
  <rect class="box-acc" x="180" y="196" width="300" height="44" rx="6"/>
  <text class="ink sm b" x="330.0" y="222.5" text-anchor="middle">37 заказов · 16 370 ₽ · чек 442.43 ₽</text>
  <path class="ln" d="M330,176 L330,193" marker-end="url(#ah-report-funnel)"/>
  <text class="acc sm b" x="20" y="223" text-anchor="start">в отчёт</text>
  <text class="mut sm" x="350" y="266" text-anchor="middle">Журнал «было → стало» попадает в отчёт: 3 битых суммы и 1 дубль — ответ на «есть ли проблемы в данных».</text>
</svg>
