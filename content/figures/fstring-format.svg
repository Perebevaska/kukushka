<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-fstring-format">
  <title id="t-fstring-format">Из чего состоит формат {revenue:,.2f} в f-строке</title>
  <defs><marker id="ah-fstring-format" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="70" y="40" width="126" height="38" rx="4"/>
  <text class="ink b" x="133.0" y="65" text-anchor="middle">f"Выручка: </text>
  <rect class="box-acc" x="200" y="40" width="96" height="38" rx="4"/>
  <text class="ink b" x="248.0" y="65" text-anchor="middle">{revenue</text>
  <rect class="box" x="300" y="40" width="36" height="38" rx="4"/>
  <text class="ink b" x="318.0" y="65" text-anchor="middle">:</text>
  <rect class="box-ok" x="340" y="40" width="36" height="38" rx="4"/>
  <text class="ink b" x="358.0" y="65" text-anchor="middle">,</text>
  <rect class="box-ok" x="380" y="40" width="46" height="38" rx="4"/>
  <text class="ink b" x="403.0" y="65" text-anchor="middle">.2</text>
  <rect class="box-ok" x="430" y="40" width="36" height="38" rx="4"/>
  <text class="ink b" x="448.0" y="65" text-anchor="middle">f</text>
  <rect class="box" x="470" y="40" width="66" height="38" rx="4"/>
  <text class="ink b" x="503.0" y="65" text-anchor="middle">} ₽"</text>
  <path class="ln-mut" d="M133.0,80 V90"/>
  <text class="ink2 sm" x="133.0" y="104" text-anchor="middle">f — это f-строка</text>
  <path class="ln-mut" d="M248.0,80 V90"/>
  <text class="ink2 sm" x="248.0" y="104" text-anchor="middle">выражение</text>
  <path class="ln-mut" d="M318.0,80 V124"/>
  <text class="ink2 sm" x="312.0" y="128" text-anchor="end">дальше формат</text>
  <path class="ln-mut" d="M358.0,80 V172"/>
  <text class="acc sm b" x="364.0" y="176" text-anchor="start">разделитель тысяч</text>
  <path class="ln-mut" d="M403.0,80 V148"/>
  <text class="acc sm b" x="409.0" y="152" text-anchor="start">2 знака после точки</text>
  <path class="ln-mut" d="M448.0,80 V124"/>
  <text class="acc sm b" x="454.0" y="128" text-anchor="start">дробное число</text>
  <text class="ink b" x="350" y="206" text-anchor="middle">Результат для revenue = 1314000.456:  «Выручка: 1,314,000.46 ₽»</text>
  <text class="mut sm" x="350" y="224" text-anchor="middle">русский вид: .replace(",", " ") → «1 314 000.46»</text>
</svg>
