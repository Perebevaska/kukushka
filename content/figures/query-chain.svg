<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-query-chain">
  <title id="t-query-chain">Цепочка query → query → assign → groupby на четырёх доставках</title>
  <defs><marker id="ah-query-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="acc sm b" x="85" y="30" text-anchor="middle">toy</text>
  <text class="acc sm b" x="85" y="46" text-anchor="middle">4 строки</text>
  <rect class="box" x="10" y="60" width="150" height="28" rx="4"/>
  <text class="ink sm" x="85" y="78" text-anchor="middle">вело · дождь · 35/30</text>
  <rect class="box" x="10" y="94" width="150" height="28" rx="4"/>
  <text class="ink sm" x="85" y="112" text-anchor="middle">вело · ясно · 25/30</text>
  <rect class="box" x="10" y="128" width="150" height="28" rx="4"/>
  <text class="ink sm" x="85" y="146" text-anchor="middle">пеший · снег · 50/30</text>
  <rect class="box" x="10" y="162" width="150" height="28" rx="4"/>
  <text class="ink sm" x="85" y="180" text-anchor="middle">авто · дождь · 0/45</text>
  <text class="acc sm b" x="261" y="30" text-anchor="middle">.query("actual_min &gt;= 1")</text>
  <rect class="box" x="186" y="60" width="150" height="28" rx="4"/>
  <text class="ink sm" x="261" y="78" text-anchor="middle">вело · дождь · 35/30</text>
  <rect class="box" x="186" y="94" width="150" height="28" rx="4"/>
  <text class="ink sm" x="261" y="112" text-anchor="middle">вело · ясно · 25/30</text>
  <rect class="box" x="186" y="128" width="150" height="28" rx="4"/>
  <text class="ink sm" x="261" y="146" text-anchor="middle">пеший · снег · 50/30</text>
  <rect class="box-err dash" x="186" y="162" width="150" height="28" rx="4"/>
  <text class="err sm" x="261" y="180" text-anchor="middle">убрана</text>
  <text class="acc sm b" x="437" y="30" text-anchor="middle">.query("weather in @bad")</text>
  <text class="acc sm b" x="437" y="46" text-anchor="middle">.assign(late=lambda x: …)</text>
  <rect class="box-ok" x="362" y="60" width="150" height="28" rx="4"/>
  <text class="ink sm" x="437" y="78" text-anchor="middle">вело · дождь · 35/30</text>
  <rect class="box-err dash" x="362" y="94" width="150" height="28" rx="4"/>
  <text class="err sm" x="437" y="112" text-anchor="middle">убрана</text>
  <rect class="box-ok" x="362" y="128" width="150" height="28" rx="4"/>
  <text class="ink sm" x="437" y="146" text-anchor="middle">пеший · снег · 50/30</text>
  <rect class="box-err dash" x="362" y="162" width="150" height="28" rx="4"/>
  <text class="err sm" x="437" y="180" text-anchor="middle">убрана</text>
  <path class="ln" d="M164,120 L182,120" marker-end="url(#ah-query-chain)"/>
  <path class="ln" d="M340,120 L358,120" marker-end="url(#ah-query-chain)"/>
  <path class="ln" d="M516,120 L534,120" marker-end="url(#ah-query-chain)"/>
  <text class="acc sm b" x="612" y="30" text-anchor="middle">.groupby("courier")</text>
  <text class="acc sm b" x="612" y="46" text-anchor="middle">["late"].mean()</text>
  <rect class="box" x="542" y="60" width="140" height="24" rx="3"/>
  <text class="ink2 sm b" x="582.0" y="76.0" text-anchor="middle">courier</text>
  <text class="ink2 sm b" x="652.0" y="76.0" text-anchor="middle">late</text>
  <rect class="box" x="542" y="86" width="140" height="24" rx="3"/>
  <text class="ink sm" x="582.0" y="102.0" text-anchor="middle">вело</text>
  <text class="ink sm" x="652.0" y="102.0" text-anchor="middle">1.0</text>
  <rect class="box" x="542" y="112" width="140" height="24" rx="3"/>
  <text class="ink sm" x="582.0" y="128.0" text-anchor="middle">пеший</text>
  <text class="ink sm" x="652.0" y="128.0" text-anchor="middle">1.0</text>
  <text class="ok sm" x="437" y="214" text-anchor="middle">late = факт &gt; обещано: 35 &gt; 30, 50 &gt; 30 → True</text>
  <text class="ink2 sm" x="350" y="244" text-anchor="middle">Каждый шаг получает таблицу предыдущего; lambda x — именно эта промежуточная таблица</text>
  <text class="mut sm" x="350" y="264" text-anchor="middle">bad = ["дождь", "снег"]; @bad подставляет переменную Python внутрь query</text>
  <text class="mut sm" x="350" y="288" text-anchor="middle">в строке: курьер · погода · факт/обещано, минут</text>
</svg>
