<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-augment-split">
  <title id="t-augment-split">Аугментация — только после разбиения и только для обучающей части; тест не трогают</title>
  <defs><marker id="ah-augment-split" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="90" width="130" height="60" rx="6"/>
  <text class="ink sm b" x="79.0" y="115.5" text-anchor="middle">2000 кадров</text>
  <text class="ink2 sm" x="79.0" y="133.5" text-anchor="middle">showcase.npz</text>
  <path class="ln" d="M146,120 L186,80" marker-end="url(#ah-augment-split)"/>
  <path class="ln" d="M146,120 L186,180" marker-end="url(#ah-augment-split)"/>
  <rect class="box-acc" x="190" y="50" width="140" height="56" rx="6"/>
  <text class="ink sm b" x="260.0" y="73.5" text-anchor="middle">обучение</text>
  <text class="ink2 sm" x="260.0" y="91.5" text-anchor="middle">1500 кадров</text>
  <rect class="box-warn" x="190" y="156" width="140" height="56" rx="6"/>
  <text class="ink sm b" x="260.0" y="179.5" text-anchor="middle">тест</text>
  <text class="ink2 sm" x="260.0" y="197.5" text-anchor="middle">500 кадров</text>
  <path class="ln" d="M332,78 L372,78" marker-end="url(#ah-augment-split)"/>
  <rect class="box-acc" x="376" y="50" width="98" height="56" rx="4"/>
  <text class="ink sm b" x="425" y="74" text-anchor="middle">исходные</text>
  <text class="ink2 sm" x="425" y="92" text-anchor="middle">1500</text>
  <rect class="box-ok" x="478" y="50" width="98" height="56" rx="4"/>
  <text class="ink sm b" x="527" y="74" text-anchor="middle">отражённые</text>
  <text class="ink2 sm" x="527" y="92" text-anchor="middle">1500</text>
  <rect class="box-ok" x="580" y="50" width="98" height="56" rx="4"/>
  <text class="ink sm b" x="629" y="74" text-anchor="middle">сдвинутые</text>
  <text class="ink2 sm" x="629" y="92" text-anchor="middle">1500</text>
  <text class="acc sm b" x="530" y="126" text-anchor="middle">обучение: 4500 кадров</text>
  <path class="ln" d="M332,184 L372,184" marker-end="url(#ah-augment-split)"/>
  <rect class="box-warn" x="376" y="160" width="300" height="50" rx="4"/>
  <text class="ink sm" x="526" y="182" text-anchor="middle">тест как есть: новые кадры,</text>
  <text class="ink2 sm" x="526" y="199" text-anchor="middle">которых модель не видела ни в каком виде</text>
  <text class="err sm b" x="350" y="238" text-anchor="middle">размножить до разбиения → копия тестового кадра попадёт в обучение — утечка</text>
</svg>
