  <text class="ink sm" x="350" y="276" text-anchor="middle"><tspan class="ink2">средний гость: σ(−1.75) ≈ </tspan><tspan class="b">0.15</tspan><tspan class="ink2">   ·   этот гость: σ(4.17) = 1 / (1 + e^(−4.17)) ≈ </tspan><tspan class="err b">0.985</tspan></text>
