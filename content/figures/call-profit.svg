<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-call-profit">
  <title id="t-call-profit">Ожидаемая прибыль звонка: польза растёт с вероятностью ухода, а скидку и час менеджера платим за каждый звонок</title>
  <defs><marker id="ah-call-profit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="350" y="22" text-anchor="middle">условный офис: выручка R = 30 000 ₽ в месяц</text>
  <rect class="box-ok" x="30" y="36" width="150" height="70" rx="6"/>
  <text class="ink b" x="105.0" y="57.5" text-anchor="middle">p · 0.5</text>
  <text class="ink2 sm" x="105.0" y="75.5" text-anchor="middle">вероятность ухода ×</text>
  <text class="ink2 sm" x="105.0" y="93.5" text-anchor="middle">доля удержанных</text>
  <rect class="box-ok" x="192" y="36" width="150" height="70" rx="6"/>
  <text class="ink b" x="267.0" y="57.5" text-anchor="middle">· 0.35 · 12 · R</text>
  <text class="ink2 sm" x="267.0" y="75.5" text-anchor="middle">маржа за год</text>
  <text class="ink2 sm" x="267.0" y="93.5" text-anchor="middle">= 126 000 ₽</text>
  <rect class="box-err" x="354" y="36" width="150" height="70" rx="6"/>
  <text class="ink b" x="429.0" y="57.5" text-anchor="middle">− 1 500</text>
  <text class="ink2 sm" x="429.0" y="75.5" text-anchor="middle">час менеджера</text>
  <text class="ink2 sm" x="429.0" y="93.5" text-anchor="middle">каждый звонок</text>
  <rect class="box-err" x="516" y="36" width="150" height="70" rx="6"/>
  <text class="ink b" x="591.0" y="57.5" text-anchor="middle">− 0.2 · R</text>
  <text class="ink2 sm" x="591.0" y="75.5" text-anchor="middle">скидка 10 % на 2 мес.</text>
  <text class="ink2 sm" x="591.0" y="93.5" text-anchor="middle">= 6 000 ₽</text>
  <path class="ln-mut" d="M80,200 L620,200"/>
  <text class="mut sm" x="72" y="204" text-anchor="end">0 ₽</text>
  <path class="ln-acc" d="M80.0,221.0 L620.0,132.8"/>
  <circle class="box-err" cx="188.0" cy="203.36" r="5"/>
  <text class="err sm b" x="178.0" y="239.36" text-anchor="end">p = 0.1: −1 200 ₽</text>
  <circle class="box-ok" cx="512.0" cy="150.44" r="5"/>
  <text class="ok sm b" x="502.0" y="142.44" text-anchor="end">p = 0.4: +17 700 ₽</text>
  <path class="ln-err" d="M208.6,192 L208.6,208"/>
  <text class="err sm b" x="218.57142857142858" y="230" text-anchor="start">ноль при p ≈ 0.12</text>
  <text class="mut sm" x="620" y="224" text-anchor="end">p →</text>
  <text class="mut sm" x="350" y="258" text-anchor="middle">звоним, если прибыль &gt; 0, по убыванию, не больше 150; у офиса с меньшей выручкой порог по p выше</text>
</svg>
