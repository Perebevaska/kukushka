<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-per-guest">
  <title id="t-per-guest">Метрики на гостя: сначала таблица «гость → заказы, выручка»</title>
  <defs><marker id="ah-per-guest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="95.0" y="36" text-anchor="middle">заказы (6 строк)</text>
  <rect class="box" x="20" y="44" width="150" height="24" rx="3"/>
  <text class="ink2 sm b" x="55.0" y="60.5" text-anchor="middle">гость</text>
  <text class="ink2 sm b" x="130.0" y="60.5" text-anchor="middle">amount</text>
  <rect class="box-acc" x="20" y="70" width="150" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="86.5" text-anchor="middle">A</text>
  <text class="ink sm" x="130.0" y="86.5" text-anchor="middle">300</text>
  <rect class="box-acc" x="20" y="96" width="150" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="112.5" text-anchor="middle">A</text>
  <text class="ink sm" x="130.0" y="112.5" text-anchor="middle">400</text>
  <rect class="box-ok" x="20" y="122" width="150" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="138.5" text-anchor="middle">B</text>
  <text class="ink sm" x="130.0" y="138.5" text-anchor="middle">250</text>
  <rect class="box-warn" x="20" y="148" width="150" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="164.5" text-anchor="middle">C</text>
  <text class="ink sm" x="130.0" y="164.5" text-anchor="middle">500</text>
  <rect class="box-warn" x="20" y="174" width="150" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="190.5" text-anchor="middle">C</text>
  <text class="ink sm" x="130.0" y="190.5" text-anchor="middle">200</text>
  <rect class="box-warn" x="20" y="200" width="150" height="24" rx="3"/>
  <text class="ink sm" x="55.0" y="216.5" text-anchor="middle">C</text>
  <text class="ink sm" x="130.0" y="216.5" text-anchor="middle">350</text>
  <path class="ln" d="M176,120 L226,120" marker-end="url(#ah-per-guest)"/>
  <text class="acc sm b" x="201" y="108" text-anchor="middle">groupby</text>
  <text class="mut sm" x="337.0" y="72" text-anchor="middle">per_guest (3 строки)</text>
  <rect class="box" x="232" y="80" width="210" height="24" rx="3"/>
  <text class="ink2 sm b" x="262.0" y="96.5" text-anchor="middle">гость</text>
  <text class="ink2 sm b" x="327.0" y="96.5" text-anchor="middle">orders</text>
  <text class="ink2 sm b" x="402.0" y="96.5" text-anchor="middle">revenue</text>
  <rect class="box-acc" x="232" y="106" width="210" height="24" rx="3"/>
  <text class="ink sm" x="262.0" y="122.5" text-anchor="middle">A</text>
  <text class="ink sm" x="327.0" y="122.5" text-anchor="middle">2</text>
  <text class="ink sm" x="402.0" y="122.5" text-anchor="middle">700</text>
  <rect class="box-ok" x="232" y="132" width="210" height="24" rx="3"/>
  <text class="ink sm" x="262.0" y="148.5" text-anchor="middle">B</text>
  <text class="ink sm" x="327.0" y="148.5" text-anchor="middle">1</text>
  <text class="ink sm" x="402.0" y="148.5" text-anchor="middle">250</text>
  <rect class="box-warn" x="232" y="158" width="210" height="24" rx="3"/>
  <text class="ink sm" x="262.0" y="174.5" text-anchor="middle">C</text>
  <text class="ink sm" x="327.0" y="174.5" text-anchor="middle">3</text>
  <text class="ink sm" x="402.0" y="174.5" text-anchor="middle">1050</text>
  <rect class="box" x="470" y="44" width="210" height="44" rx="5"/>
  <text class="ink2 sm b" x="575" y="62" text-anchor="middle">средний чек — на заказ</text>
  <text class="ink sm" x="575" y="80" text-anchor="middle">2000 / 6 = 333.33</text>
  <rect class="box-acc" x="470" y="96" width="210" height="44" rx="5"/>
  <text class="ink2 sm b" x="575" y="114" text-anchor="middle">выручка на гостя</text>
  <text class="ink sm" x="575" y="132" text-anchor="middle">2000 / 3 = 666.67</text>
  <rect class="box-acc" x="470" y="148" width="210" height="44" rx="5"/>
  <text class="ink2 sm b" x="575" y="166" text-anchor="middle">заказов на гостя</text>
  <text class="ink sm" x="575" y="184" text-anchor="middle">6 / 3 = 2</text>
  <rect class="box-acc" x="470" y="200" width="210" height="44" rx="5"/>
  <text class="ink2 sm b" x="575" y="218" text-anchor="middle">доля повторных (≥ 2 заказов)</text>
  <text class="ink sm" x="575" y="236" text-anchor="middle">2 из 3 = 66.7%</text>
  <path class="ln-mut" d="M176,90 C320,30 420,40 466,66" marker-end="url(#ah-per-guest)"/>
  <path class="ln" d="M454,150 H466" marker-end="url(#ah-per-guest)"/>
  <text class="ink2 sm" x="350" y="284" text-anchor="middle">Средний чек считают по заказам, остальные три — по таблице per_guest. Знаменатель — в подписи метрики.</text>
</svg>
