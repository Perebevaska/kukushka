<svg viewBox="0 0 700 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-recency-shape">
  <title id="t-recency-shape">Давность визита: линейная шкала, логарифм и интервалы</title>
  <defs><marker id="ah-recency-shape" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="60.0" y="40" width="40.2" height="46" rx="3"/>
  <text class="ink sm b" x="81.1" y="60" text-anchor="middle">11 %</text>
  <text class="ink2 sm" x="81.1" y="76" text-anchor="middle"></text>
  <rect class="box-warn" x="102.2" y="40" width="46.2" height="46" rx="3"/>
  <text class="ink sm b" x="126.3" y="60" text-anchor="middle">26 %</text>
  <text class="ink2 sm" x="126.3" y="76" text-anchor="middle"></text>
  <rect class="box-warn" x="150.5" y="40" width="88.5" height="46" rx="3"/>
  <text class="ink sm b" x="195.7" y="60" text-anchor="middle">47 %</text>
  <text class="ink2 sm" x="195.7" y="76" text-anchor="middle"></text>
  <rect class="box-err" x="240.9" y="40" width="417.1" height="46" rx="3"/>
  <text class="ink sm b" x="450.5" y="60" text-anchor="middle">84 %</text>
  <text class="ink2 sm" x="450.5" y="76" text-anchor="middle">больше 2 месяцев</text>
  <text class="mut sm" x="60" y="26" text-anchor="start">доля ушедших по интервалам pd.cut: до 14 дней, 15–30, 31–60, больше 60 (линейная шкала дней)</text>
  <path class="ln" d="M60.0,100 L660.0,100"/>
  <path class="ln" d="M60.0,100 L60.0,105"/>
  <text class="mut sm" x="60.0" y="118" text-anchor="middle">0</text>
  <path class="ln" d="M102.2,100 L102.2,105"/>
  <text class="mut sm" x="102.2" y="118" text-anchor="middle">14</text>
  <path class="ln" d="M150.5,100 L150.5,105"/>
  <text class="mut sm" x="150.5" y="118" text-anchor="middle">30</text>
  <path class="ln" d="M240.9,100 L240.9,105"/>
  <text class="mut sm" x="240.9" y="118" text-anchor="middle">60</text>
  <path class="ln" d="M361.5,100 L361.5,105"/>
  <text class="mut sm" x="361.5" y="118" text-anchor="middle">100</text>
  <path class="ln" d="M512.3,100 L512.3,105"/>
  <text class="mut sm" x="512.3" y="118" text-anchor="middle">150</text>
  <path class="ln" d="M660.0,100 L660.0,105"/>
  <text class="mut sm" x="660.0" y="118" text-anchor="middle">199</text>
  <text class="mut sm" x="60" y="230" text-anchor="start">те же дни после np.log1p: первые недели растянуты, хвост сжат</text>
  <path class="ln" d="M60.0,190 L660.0,190"/>
  <path class="ln-mut" d="M60.0,105 L60.0,186"/>
  <path class="ln" d="M60.0,186 L60.0,194"/>
  <text class="ink2 sm" x="60.0" y="210" text-anchor="middle">0.0</text>
  <path class="ln-mut" d="M102.2,105 L366.7,186"/>
  <path class="ln" d="M366.7,186 L366.7,194"/>
  <text class="ink2 sm" x="366.7" y="210" text-anchor="middle">2.7</text>
  <path class="ln-mut" d="M150.5,105 L448.9,186"/>
  <path class="ln" d="M448.9,186 L448.9,194"/>
  <text class="ink2 sm" x="448.9" y="210" text-anchor="middle">3.4</text>
  <path class="ln-mut" d="M240.9,105 L525.5,186"/>
  <path class="ln" d="M525.5,186 L525.5,194"/>
  <text class="ink2 sm" x="525.5" y="210" text-anchor="middle">4.1</text>
  <path class="ln-mut" d="M361.5,105 L582.6,186"/>
  <path class="ln" d="M582.6,186 L582.6,194"/>
  <text class="ink2 sm" x="582.6" y="210" text-anchor="middle">4.6</text>
  <path class="ln-mut" d="M512.3,105 L628.2,186"/>
  <path class="ln" d="M628.2,186 L628.2,194"/>
  <text class="ink2 sm" x="628.2" y="210" text-anchor="middle">5.0</text>
  <path class="ln-mut" d="M660.0,105 L660.0,186"/>
  <path class="ln" d="M660.0,186 L660.0,194"/>
  <text class="ink2 sm" x="660.0" y="210" text-anchor="middle">5.3</text>
  <text class="ink2 sm" x="350" y="254" text-anchor="middle">log1p(x) = ln(1 + x): от 0 до 14 дней — 2.7 единицы, от 60 до 199 — всего 1.2</text>
  <text class="mut sm" x="350" y="276" text-anchor="middle">интервалы дают каждой группе свой вес, логарифм — одну плавную кривую; оба ловят «первые недели важнее»</text>
</svg>
