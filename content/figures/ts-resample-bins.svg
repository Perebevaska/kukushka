<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ts-resample-bins">
  <title id="t-ts-resample-bins">resample: ряд режется на корзины по часам, корзины отсчитываются от полуночи</title>
  <defs><marker id="ah-ts-resample-bins" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box dash" x="14" y="122" width="64" height="32" rx="3"/>
  <text class="mut sm" x="46.0" y="143" text-anchor="middle">нет</text>
  <text class="mut sm" x="46.0" y="170" text-anchor="middle">06:00</text>
  <rect class="box dash" x="82" y="122" width="64" height="32" rx="3"/>
  <text class="mut sm" x="114.0" y="143" text-anchor="middle">нет</text>
  <text class="mut sm" x="114.0" y="170" text-anchor="middle">07:00</text>
  <rect class="box" x="150" y="122" width="64" height="32" rx="3"/>
  <text class="ink b" x="182.0" y="143" text-anchor="middle">5</text>
  <text class="mut sm" x="182.0" y="170" text-anchor="middle">08:00</text>
  <rect class="box" x="218" y="122" width="64" height="32" rx="3"/>
  <text class="ink b" x="250.0" y="143" text-anchor="middle">7</text>
  <text class="mut sm" x="250.0" y="170" text-anchor="middle">09:00</text>
  <rect class="box" x="286" y="122" width="64" height="32" rx="3"/>
  <text class="ink b" x="318.0" y="143" text-anchor="middle">12</text>
  <text class="mut sm" x="318.0" y="170" text-anchor="middle">10:00</text>
  <rect class="box" x="354" y="122" width="64" height="32" rx="3"/>
  <text class="ink b" x="386.0" y="143" text-anchor="middle">10</text>
  <text class="mut sm" x="386.0" y="170" text-anchor="middle">11:00</text>
  <rect class="box" x="422" y="122" width="64" height="32" rx="3"/>
  <text class="ink b" x="454.0" y="143" text-anchor="middle">3</text>
  <text class="mut sm" x="454.0" y="170" text-anchor="middle">12:00</text>
  <rect class="box" x="490" y="122" width="64" height="32" rx="3"/>
  <text class="ink b" x="522.0" y="143" text-anchor="middle">9</text>
  <text class="mut sm" x="522.0" y="170" text-anchor="middle">13:00</text>
  <text class="ink2 sm b" x="620" y="40" text-anchor="middle">resample("2h")</text>
  <text class="ink2 sm" x="620" y="58" text-anchor="middle">.sum()</text>
  <path class="ln" d="M152,110 L152,104 L280,104 L280,110"/>
  <rect class="box-acc" x="170.0" y="30" width="92" height="50" rx="5"/>
  <text class="ink b" x="216.0" y="52" text-anchor="middle">12</text>
  <text class="ink2 sm" x="216.0" y="70" text-anchor="middle">5 + 7</text>
  <path class="ln" d="M216.0,100 L216.0,84" marker-end="url(#ah-ts-resample-bins)"/>
  <path class="ln" d="M288,110 L288,104 L416,104 L416,110"/>
  <rect class="box-acc" x="306.0" y="30" width="92" height="50" rx="5"/>
  <text class="ink b" x="352.0" y="52" text-anchor="middle">22</text>
  <text class="ink2 sm" x="352.0" y="70" text-anchor="middle">12 + 10</text>
  <path class="ln" d="M352.0,100 L352.0,84" marker-end="url(#ah-ts-resample-bins)"/>
  <path class="ln" d="M424,110 L424,104 L552,104 L552,110"/>
  <rect class="box-acc" x="442.0" y="30" width="92" height="50" rx="5"/>
  <text class="ink b" x="488.0" y="52" text-anchor="middle">12</text>
  <text class="ink2 sm" x="488.0" y="70" text-anchor="middle">3 + 9</text>
  <path class="ln" d="M488.0,100 L488.0,84" marker-end="url(#ah-ts-resample-bins)"/>
  <text class="ink2 sm b" x="620" y="222" text-anchor="middle">resample("3h")</text>
  <text class="ink2 sm" x="620" y="240" text-anchor="middle">.mean()</text>
  <path class="ln" d="M16,180 L16,186 L212,186 L212,180"/>
  <path class="ln" d="M114.0,188 L114.0,204" marker-end="url(#ah-ts-resample-bins)"/>
  <rect class="box-warn" x="48.0" y="208" width="132" height="50" rx="5"/>
  <text class="ink b" x="114.0" y="229" text-anchor="middle">5</text>
  <text class="ink2 sm" x="114.0" y="247" text-anchor="middle">только 08:00</text>
  <path class="ln" d="M220,180 L220,186 L416,186 L416,180"/>
  <path class="ln" d="M318.0,188 L318.0,204" marker-end="url(#ah-ts-resample-bins)"/>
  <rect class="box-acc" x="252.0" y="208" width="132" height="50" rx="5"/>
  <text class="ink b" x="318.0" y="229" text-anchor="middle">9.67</text>
  <text class="ink2 sm" x="318.0" y="247" text-anchor="middle">(7 + 12 + 10) / 3</text>
  <path class="ln" d="M424,180 L424,186 L552,186 L552,180"/>
  <path class="ln" d="M488.0,188 L488.0,204" marker-end="url(#ah-ts-resample-bins)"/>
  <rect class="box-acc" x="422.0" y="208" width="132" height="50" rx="5"/>
  <text class="ink b" x="488.0" y="229" text-anchor="middle">6</text>
  <text class="ink2 sm" x="488.0" y="247" text-anchor="middle">(3 + 9) / 2</text>
  <text class="mut sm" x="350" y="282" text-anchor="middle">метка корзины — её начало: 08:00, 10:00, 12:00 и 06:00, 09:00, 12:00</text>
