<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-tfidf-steps">
  <title id="t-tfidf-steps">TF-IDF по шагам: счётчики × idf, затем каждая строка нормируется к длине 1</title>
  <defs><marker id="ah-tfidf-steps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm" x="14" y="89" text-anchor="start">1</text>
  <text class="ink2 sm" x="14" y="119" text-anchor="start">2</text>
  <text class="ink2 sm" x="14" y="149" text-anchor="start">3</text>
  <text class="ink2 sm b" x="98.0" y="44" text-anchor="middle">TF: счётчики</text>
  <text class="mut sm" x="49.0" y="62" text-anchor="middle">вкус.</text>
  <text class="mut sm" x="97.0" y="62" text-anchor="middle">горь.</text>
  <text class="mut sm" x="145.0" y="62" text-anchor="middle">кофе.</text>
  <rect class="box-acc" x="26" y="70" width="46" height="28" rx="2"/>
  <text class="ink sm" x="49.0" y="89" text-anchor="middle">1</text>
  <rect class="box" x="74" y="70" width="46" height="28" rx="2"/>
  <text class="mut sm" x="97.0" y="89" text-anchor="middle">0</text>
  <rect class="box-acc" x="122" y="70" width="46" height="28" rx="2"/>
  <text class="ink sm" x="145.0" y="89" text-anchor="middle">1</text>
  <rect class="box" x="26" y="100" width="46" height="28" rx="2"/>
  <text class="mut sm" x="49.0" y="119" text-anchor="middle">0</text>
  <rect class="box-acc" x="74" y="100" width="46" height="28" rx="2"/>
  <text class="ink sm" x="97.0" y="119" text-anchor="middle">1</text>
  <rect class="box-acc" x="122" y="100" width="46" height="28" rx="2"/>
  <text class="ink sm" x="145.0" y="119" text-anchor="middle">1</text>
  <rect class="box-acc" x="26" y="130" width="46" height="28" rx="2"/>
  <text class="ink sm" x="49.0" y="149" text-anchor="middle">2</text>
  <rect class="box" x="74" y="130" width="46" height="28" rx="2"/>
  <text class="mut sm" x="97.0" y="149" text-anchor="middle">0</text>
  <rect class="box-acc" x="122" y="130" width="46" height="28" rx="2"/>
  <text class="ink sm" x="145.0" y="149" text-anchor="middle">1</text>
  <text class="ink b" x="184" y="119" text-anchor="middle">×</text>
  <text class="ink2 sm b" x="272" y="44" text-anchor="middle">idf</text>
  <text class="mut sm" x="223.0" y="62" text-anchor="middle">вкус.</text>
  <rect class="box-warn" x="200" y="100" width="46" height="28" rx="2"/>
  <text class="ink sm b" x="223.0" y="119" text-anchor="middle">1.29</text>
  <text class="mut sm" x="271.0" y="62" text-anchor="middle">горь.</text>
  <rect class="box-warn" x="248" y="100" width="46" height="28" rx="2"/>
  <text class="ink sm b" x="271.0" y="119" text-anchor="middle">1.69</text>
  <text class="mut sm" x="319.0" y="62" text-anchor="middle">кофе.</text>
  <rect class="box-warn" x="296" y="100" width="46" height="28" rx="2"/>
  <text class="ink sm b" x="319.0" y="119" text-anchor="middle">1.00</text>
  <text class="ink b" x="358" y="119" text-anchor="middle">=</text>
  <text class="ink2 sm b" x="444.0" y="44" text-anchor="middle">TF × idf</text>
  <text class="mut sm" x="395.0" y="62" text-anchor="middle">вкус.</text>
  <text class="mut sm" x="443.0" y="62" text-anchor="middle">горь.</text>
  <text class="mut sm" x="491.0" y="62" text-anchor="middle">кофе.</text>
  <rect class="box-acc" x="372" y="70" width="46" height="28" rx="2"/>
  <text class="ink sm" x="395.0" y="89" text-anchor="middle">1.29</text>
  <rect class="box" x="420" y="70" width="46" height="28" rx="2"/>
  <text class="mut sm" x="443.0" y="89" text-anchor="middle">0.00</text>
  <rect class="box-acc" x="468" y="70" width="46" height="28" rx="2"/>
  <text class="ink sm" x="491.0" y="89" text-anchor="middle">1.00</text>
  <rect class="box" x="372" y="100" width="46" height="28" rx="2"/>
  <text class="mut sm" x="395.0" y="119" text-anchor="middle">0.00</text>
  <rect class="box-acc" x="420" y="100" width="46" height="28" rx="2"/>
  <text class="ink sm" x="443.0" y="119" text-anchor="middle">1.69</text>
  <rect class="box-acc" x="468" y="100" width="46" height="28" rx="2"/>
  <text class="ink sm" x="491.0" y="119" text-anchor="middle">1.00</text>
  <rect class="box-acc" x="372" y="130" width="46" height="28" rx="2"/>
  <text class="ink sm" x="395.0" y="149" text-anchor="middle">2.58</text>
  <rect class="box" x="420" y="130" width="46" height="28" rx="2"/>
  <text class="mut sm" x="443.0" y="149" text-anchor="middle">0.00</text>
  <rect class="box-acc" x="468" y="130" width="46" height="28" rx="2"/>
  <text class="ink sm" x="491.0" y="149" text-anchor="middle">1.00</text>
  <text class="ink b" x="530" y="119" text-anchor="middle">→</text>
  <text class="ink2 sm b" x="618.0" y="44" text-anchor="middle">делим на длину строки</text>
  <text class="mut sm" x="569.0" y="62" text-anchor="middle">вкус.</text>
  <text class="mut sm" x="617.0" y="62" text-anchor="middle">горь.</text>
  <text class="mut sm" x="665.0" y="62" text-anchor="middle">кофе.</text>
  <rect class="box-ok" x="546" y="70" width="46" height="28" rx="2"/>
  <text class="ink sm" x="569.0" y="89" text-anchor="middle">0.79</text>
  <rect class="box" x="594" y="70" width="46" height="28" rx="2"/>
  <text class="mut sm" x="617.0" y="89" text-anchor="middle">0.00</text>
  <rect class="box-ok" x="642" y="70" width="46" height="28" rx="2"/>
  <text class="ink sm" x="665.0" y="89" text-anchor="middle">0.61</text>
  <rect class="box" x="546" y="100" width="46" height="28" rx="2"/>
  <text class="mut sm" x="569.0" y="119" text-anchor="middle">0.00</text>
  <rect class="box-ok" x="594" y="100" width="46" height="28" rx="2"/>
  <text class="ink sm" x="617.0" y="119" text-anchor="middle">0.86</text>
  <rect class="box-ok" x="642" y="100" width="46" height="28" rx="2"/>
  <text class="ink sm" x="665.0" y="119" text-anchor="middle">0.51</text>
  <rect class="box-ok" x="546" y="130" width="46" height="28" rx="2"/>
  <text class="ink sm" x="569.0" y="149" text-anchor="middle">0.93</text>
  <rect class="box" x="594" y="130" width="46" height="28" rx="2"/>
  <text class="mut sm" x="617.0" y="149" text-anchor="middle">0.00</text>
  <rect class="box-ok" x="642" y="130" width="46" height="28" rx="2"/>
  <text class="ink sm" x="665.0" y="149" text-anchor="middle">0.36</text>
  <rect class="box" x="26" y="190" width="660" height="76" rx="6"/>
  <text class="ink sm" x="40" y="212" text-anchor="start">строка 3 «кофе вкусный вкусный»: вкусный 2 × 1.29 = 2.58, кофе 1 × 1.00 = 1.00</text>
  <text class="ink sm" x="40" y="232" text-anchor="start">длина √(2.58² + 1.00²) ≈ 2.77 → вкусный 0.93, кофе 0.36</text>
  <text class="ink2 sm" x="40" y="252" text-anchor="start">idf «кофе» = 1.00 — слово есть во всех текстах; «горький» — в одном, его idf самый большой</text>
  <text class="mut sm" x="350" y="288" text-anchor="middle">idf = ln((1 + N) / (1 + df)) + 1, N = 3 текста, df — в скольких текстах есть слово</text>
</svg>
