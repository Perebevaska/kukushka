<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-class-objects">
  <title id="t-class-objects">Класс — чертёж, объекты — отдельные модели со своими атрибутами</title>
  <defs><marker id="ah-class-objects" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="220" y="20" width="260" height="74" rx="6"/>
  <text class="ink sm b" x="350.0" y="44.5" text-anchor="middle">class MyLinearRegression</text>
  <text class="ink sm" x="350.0" y="61.5" text-anchor="middle">fit(self, X, y) — учит и запоминает</text>
  <text class="ink sm" x="350.0" y="78.5" text-anchor="middle">predict(self, X) — читает выученное</text>
  <path class="ln" d="M300,96 L170,128" marker-end="url(#ah-class-objects)"/>
  <path class="ln" d="M400,96 L530,128" marker-end="url(#ah-class-objects)"/>
  <text class="mut sm" x="170" y="120" text-anchor="end">a = MyLinearRegression()</text>
  <text class="mut sm" x="530" y="120" text-anchor="start">b = MyLinearRegression()</text>
  <rect class="box-ok" x="40" y="132" width="260" height="80" rx="6"/>
  <text class="ink sm b" x="170.0" y="159.5" text-anchor="middle">объект a</text>
  <text class="ink sm" x="170.0" y="176.5" text-anchor="middle">a.fit(X, y) → записал в self:</text>
  <text class="ok sm b" x="170.0" y="193.5" text-anchor="middle">intercept_ = 0.5, coef_ = [2.2]</text>
  <rect class="box-warn" x="400" y="132" width="260" height="80" rx="6"/>
  <text class="ink sm b" x="530.0" y="159.5" text-anchor="middle">объект b</text>
  <text class="ink sm" x="530.0" y="176.5" text-anchor="middle">fit не вызывали:</text>
  <text class="warn sm b" x="530.0" y="193.5" text-anchor="middle">атрибутов coef_ и intercept_ нет</text>
  <text class="ok sm b" x="170" y="236" text-anchor="middle">a.predict([[5]]) → 0.5 + 2.2 · 5 = 11.5</text>
  <text class="err sm b" x="530" y="236" text-anchor="middle">b.predict(X) → AttributeError</text>
  <text class="ink2 sm" x="350" y="270" text-anchor="middle">self — тот объект, у которого вызвали метод: a.fit(...) пишет в a, а b остаётся пустым</text>
  <text class="mut sm" x="350" y="290" text-anchor="middle">атрибут живёт, пока жив объект; обычная переменная внутри fit исчезает с концом метода</text>
</svg>
