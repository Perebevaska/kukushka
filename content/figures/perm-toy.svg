<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-perm-toy">
  <title id="t-perm-toy">Перестановочный тест на шести доставках</title>
  <defs><marker id="ah-perm-toy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="20" y="22" text-anchor="start">наблюдали</text>
  <text class="ink b" x="20" y="52" text-anchor="start">A</text>
  <rect class="box-err" x="40" y="34" width="30" height="28" rx="3"/>
  <text class="ink sm b" x="55.0" y="53.0" text-anchor="middle">О</text>
  <rect class="box-err" x="70" y="34" width="30" height="28" rx="3"/>
  <text class="ink sm b" x="85.0" y="53.0" text-anchor="middle">О</text>
  <rect class="box-ok" x="100" y="34" width="30" height="28" rx="3"/>
  <text class="ink sm b" x="115.0" y="53.0" text-anchor="middle">В</text>
  <text class="ink b" x="20" y="88" text-anchor="start">B</text>
  <rect class="box-ok" x="40" y="70" width="30" height="28" rx="3"/>
  <text class="ink sm b" x="55.0" y="89.0" text-anchor="middle">В</text>
  <rect class="box-ok" x="70" y="70" width="30" height="28" rx="3"/>
  <text class="ink sm b" x="85.0" y="89.0" text-anchor="middle">В</text>
  <rect class="box-ok" x="100" y="70" width="30" height="28" rx="3"/>
  <text class="ink sm b" x="115.0" y="89.0" text-anchor="middle">В</text>
  <text class="ink2 sm" x="150" y="54" text-anchor="start">опозданий 2/3</text>
  <text class="ink2 sm" x="150" y="90" text-anchor="start">опозданий 0/3</text>
  <text class="ink b" x="20" y="124" text-anchor="start">разница 2/3 − 0 = +0.67</text>
  <text class="ink2 sm" x="20" y="150" text-anchor="start">если кофейня ни при чём,</text>
  <text class="ink2 sm" x="20" y="166" text-anchor="start">ярлык «A» можно отдать любым</text>
  <text class="ink2 sm" x="20" y="182" text-anchor="start">трём доставкам из шести:</text>
  <text class="ink2 sm b" x="20" y="198" text-anchor="start">способов 20</text>
  <path class="ln" d="M250,120 L290,120" marker-end="url(#ah-perm-toy)"/>
  <rect class="box-err" x="328" y="208" width="24" height="22" rx="3"/>
  <rect class="box-err" x="356" y="208" width="24" height="22" rx="3"/>
  <rect class="box-err" x="384" y="208" width="24" height="22" rx="3"/>
  <rect class="box-err" x="328" y="182" width="24" height="22" rx="3"/>
  <text class="ink sm b" x="370" y="170" text-anchor="middle">4 способа</text>
  <text class="ink2 sm" x="370" y="248" text-anchor="middle">-0.67</text>
  <rect class="box" x="458" y="208" width="24" height="22" rx="3"/>
  <rect class="box" x="486" y="208" width="24" height="22" rx="3"/>
  <rect class="box" x="514" y="208" width="24" height="22" rx="3"/>
  <rect class="box" x="458" y="182" width="24" height="22" rx="3"/>
  <rect class="box" x="486" y="182" width="24" height="22" rx="3"/>
  <rect class="box" x="514" y="182" width="24" height="22" rx="3"/>
  <rect class="box" x="458" y="156" width="24" height="22" rx="3"/>
  <rect class="box" x="486" y="156" width="24" height="22" rx="3"/>
  <rect class="box" x="514" y="156" width="24" height="22" rx="3"/>
  <rect class="box" x="458" y="130" width="24" height="22" rx="3"/>
  <rect class="box" x="486" y="130" width="24" height="22" rx="3"/>
  <rect class="box" x="514" y="130" width="24" height="22" rx="3"/>
  <text class="ink sm b" x="500" y="118" text-anchor="middle">12 способов</text>
  <text class="ink2 sm" x="500" y="248" text-anchor="middle">0</text>
  <rect class="box-err" x="588" y="208" width="24" height="22" rx="3"/>
  <rect class="box-err" x="616" y="208" width="24" height="22" rx="3"/>
  <rect class="box-err" x="644" y="208" width="24" height="22" rx="3"/>
  <rect class="box-err" x="588" y="182" width="24" height="22" rx="3"/>
  <text class="ink sm b" x="630" y="170" text-anchor="middle">4 способа</text>
  <text class="ink2 sm" x="630" y="248" text-anchor="middle">+0.67</text>
  <path class="ln" d="M300,232 L690,232"/>
  <text class="mut sm" x="500" y="36" text-anchor="middle">разница долей при всех 20 раскладах ярлыков</text>
  <text class="err sm" x="500" y="270" text-anchor="middle">красные — не меньше наблюдаемой по модулю (0.67)</text>
  <text class="ink b" x="500" y="290" text-anchor="middle">p-value = (4 + 4) / 20 = 0.4</text>
  <text class="ink2 sm" x="500" y="310" text-anchor="middle">такая разница бывает и у одинаковых кофеен</text>
</svg>
