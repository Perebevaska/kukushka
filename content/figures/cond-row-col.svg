  <rect class="box-acc" x="100" y="84" width="76" height="28" rx="3"/>
  <text class="ink b" x="138.0" y="102.5" text-anchor="middle">298</text>
  <rect class="box-acc" x="178" y="84" width="76" height="28" rx="3"/>
  <text class="mut sm" x="216.0" y="102.5" text-anchor="middle">105</text>
  <rect class="box-acc" x="256" y="84" width="68" height="28" rx="3"/>
  <text class="ink b" x="290.0" y="102.5" text-anchor="middle">403</text>
  <rect class="box" x="14" y="114" width="84" height="28" rx="3"/>
  <text class="ink2 sm b" x="56.0" y="132.5" text-anchor="middle">не пеший</text>
  <rect class="box" x="100" y="114" width="76" height="28" rx="3"/>
  <text class="mut sm" x="138.0" y="132.5" text-anchor="middle">143</text>
  <rect class="box" x="178" y="114" width="76" height="28" rx="3"/>
  <text class="mut sm" x="216.0" y="132.5" text-anchor="middle">1295</text>
  <rect class="box" x="256" y="114" width="68" height="28" rx="3"/>
  <text class="mut sm" x="290.0" y="132.5" text-anchor="middle">1438</text>
  <rect class="box" x="14" y="144" width="84" height="28" rx="3"/>
  <text class="ink2 sm b" x="56.0" y="162.5" text-anchor="middle">всего</text>
  <rect class="box" x="100" y="144" width="76" height="28" rx="3"/>
  <text class="mut sm" x="138.0" y="162.5" text-anchor="middle">441</text>
  <rect class="box" x="178" y="144" width="76" height="28" rx="3"/>
  <text class="mut sm" x="216.0" y="162.5" text-anchor="middle">1400</text>
  <rect class="box" x="256" y="144" width="68" height="28" rx="3"/>
  <text class="mut sm" x="290.0" y="162.5" text-anchor="middle">1841</text>
  <text class="ink b" x="170" y="196" text-anchor="middle">298 / 403 ≈ 0.74</text>
  <text class="ink2 sm" x="170" y="216" text-anchor="middle">«пешие опаздывают в 3 случаях из 4»</text>
  <text class="warn b" x="522" y="22" text-anchor="middle">P(пеший | опоздание)</text>
  <text class="ink2 sm" x="522" y="40" text-anchor="middle">смотрим в столбец «опоздала»</text>
  <rect class="box" x="366" y="54" width="84" height="28" rx="3"/>
  <rect class="box" x="452" y="54" width="76" height="28" rx="3"/>
