  <rect class="box" x="530" y="54" width="76" height="28" rx="3"/>
  <text class="ink2 sm b" x="568.0" y="72.5" text-anchor="middle">вовремя</text>
  <rect class="box" x="608" y="54" width="68" height="28" rx="3"/>
  <text class="ink2 sm b" x="642.0" y="72.5" text-anchor="middle">всего</text>
