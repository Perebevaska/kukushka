  <text class="ink2 sm b" x="408.0" y="102.5" text-anchor="middle">пеший</text>
  <rect class="box-warn" x="452" y="84" width="76" height="28" rx="3"/>
  <text class="ink b" x="490.0" y="102.5" text-anchor="middle">298</text>
  <rect class="box" x="530" y="84" width="76" height="28" rx="3"/>
  <text class="mut sm" x="568.0" y="102.5" text-anchor="middle">105</text>
  <rect class="box" x="608" y="84" width="68" height="28" rx="3"/>
  <text class="mut sm" x="642.0" y="102.5" text-anchor="middle">403</text>
  <rect class="box" x="366" y="114" width="84" height="28" rx="3"/>
  <text class="ink2 sm b" x="408.0" y="132.5" text-anchor="middle">не пеший</text>
  <rect class="box-warn" x="452" y="114" width="76" height="28" rx="3"/>
  <text class="mut sm" x="490.0" y="132.5" text-anchor="middle">143</text>
  <rect class="box" x="530" y="114" width="76" height="28" rx="3"/>
  <text class="mut sm" x="568.0" y="132.5" text-anchor="middle">1295</text>
  <rect class="box" x="608" y="114" width="68" height="28" rx="3"/>
  <text class="mut sm" x="642.0" y="132.5" text-anchor="middle">1438</text>
  <rect class="box" x="366" y="144" width="84" height="28" rx="3"/>
  <text class="ink2 sm b" x="408.0" y="162.5" text-anchor="middle">всего</text>
  <rect class="box-warn" x="452" y="144" width="76" height="28" rx="3"/>
  <text class="ink b" x="490.0" y="162.5" text-anchor="middle">441</text>
  <rect class="box" x="530" y="144" width="76" height="28" rx="3"/>
  <text class="mut sm" x="568.0" y="162.5" text-anchor="middle">1400</text>
  <rect class="box" x="608" y="144" width="68" height="28" rx="3"/>
  <text class="mut sm" x="642.0" y="162.5" text-anchor="middle">1841</text>
  <text class="ink b" x="522" y="196" text-anchor="middle">298 / 441 ≈ 0.68</text>
  <text class="ink2 sm" x="522" y="216" text-anchor="middle">«две трети опозданий — у пеших»</text>
  <text class="mut sm" x="350" y="258" text-anchor="middle">числитель один (298), знаменатели разные: сначала спросите, среди кого считаете долю</text>
