<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cond-row-col">
  <title id="t-cond-row-col">Условная вероятность: строка или столбец таблицы</title>
  <defs><marker id="ah-cond-row-col" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="acc b" x="170" y="22" text-anchor="middle">P(опоздание | пеший)</text>
  <text class="ink2 sm" x="170" y="40" text-anchor="middle">смотрим в строку «пеший»</text>
  <rect class="box" x="14" y="54" width="84" height="28" rx="3"/>
  <rect class="box" x="100" y="54" width="76" height="28" rx="3"/>
  <text class="ink2 sm b" x="138.0" y="72.5" text-anchor="middle">опоздала</text>
  <rect class="box" x="178" y="54" width="76" height="28" rx="3"/>
  <text class="ink2 sm b" x="216.0" y="72.5" text-anchor="middle">вовремя</text>
  <rect class="box" x="256" y="54" width="68" height="28" rx="3"/>
  <text class="ink2 sm b" x="290.0" y="72.5" text-anchor="middle">всего</text>
