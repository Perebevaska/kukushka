<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-batch-job">
  <title id="t-batch-job">Пакетный скрипт: читает выгрузку, откладывает плохие строки с причиной, считает остальные и пишет файлы с датой</title>
  <defs><marker id="ah-batch-job" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="90" width="140" height="56" rx="6"/>
  <text class="ink sm b" x="84.0" y="113.5" text-anchor="middle">export_2026-12-07.csv</text>
  <text class="ink2 sm" x="84.0" y="131.5" text-anchor="middle">300 гостей</text>
  <path class="ln" d="M156,118 L186,118" marker-end="url(#ah-batch-job)"/>
  <rect class="box-warn" x="190" y="90" width="120" height="56" rx="6"/>
  <text class="ink sm b" x="250.0" y="113.5" text-anchor="middle">bad_reason</text>
  <text class="ink2 sm" x="250.0" y="131.5" text-anchor="middle">для каждой строки</text>
  <path class="ln" d="M312,108 L352,70" marker-end="url(#ah-batch-job)"/>
  <path class="ln" d="M312,128 L352,176" marker-end="url(#ah-batch-job)"/>
  <rect class="box-acc" x="356" y="44" width="130" height="50" rx="6"/>
  <text class="ink sm b" x="421.0" y="64.5" text-anchor="middle">292 годных</text>
  <text class="ink2 sm" x="421.0" y="82.5" text-anchor="middle">→ модель, порог 1/3</text>
  <rect class="box-err" x="356" y="152" width="130" height="50" rx="6"/>
  <text class="ink sm b" x="421.0" y="172.5" text-anchor="middle">8 отложенных</text>
  <text class="ink2 sm" x="421.0" y="190.5" text-anchor="middle">+ столбец reason</text>
  <path class="ln" d="M488,69 L518,69" marker-end="url(#ah-batch-job)"/>
  <path class="ln" d="M488,177 L518,177" marker-end="url(#ah-batch-job)"/>
  <rect class="box-ok" x="522" y="44" width="164" height="50" rx="6"/>
  <text class="ink sm b" x="604.0" y="64.5" text-anchor="middle">scores_2026-12-07.csv</text>
  <text class="ink2 sm" x="604.0" y="82.5" text-anchor="middle">для CRM</text>
  <rect class="box" x="522" y="152" width="164" height="50" rx="6"/>
  <text class="ink sm b" x="604.0" y="172.5" text-anchor="middle">rejected_2026-12-07.csv</text>
  <text class="ink2 sm" x="604.0" y="190.5" text-anchor="middle">кому разбираться</text>
  <text class="acc sm b" x="604" y="124" text-anchor="middle">сводка → журнал</text>
  <text class="mut sm" x="350" y="236" text-anchor="middle">5 строк с visits_90d = −1 и 3 с delivery_share = 35 — испорчены в примере нарочно</text>
</svg>
