<svg viewBox="0 0 700 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-fp-assembly">
  <title id="t-fp-assembly">Сборка таблицы «один гость — одна строка» из базы</title>
  <defs><marker id="ah-fp-assembly" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="16" width="128" height="44" rx="6"/>
  <text class="ink sm b" x="78.0" y="36" text-anchor="middle">orders</text>
  <text class="mut sm" x="78.0" y="52" text-anchor="middle">заказы</text>
  <path class="ln" d="M78.0,62 L78.0,84" marker-end="url(#ah-fp-assembly)"/>
  <rect class="box" x="148" y="16" width="128" height="44" rx="6"/>
  <text class="ink sm b" x="212.0" y="36" text-anchor="middle">order_items + menu</text>
  <text class="mut sm" x="212.0" y="52" text-anchor="middle">доля кофе</text>
  <path class="ln" d="M212.0,62 L212.0,84" marker-end="url(#ah-fp-assembly)"/>
  <rect class="box" x="282" y="16" width="128" height="44" rx="6"/>
  <text class="ink sm b" x="346.0" y="36" text-anchor="middle">app_sessions</text>
  <text class="mut sm" x="346.0" y="52" text-anchor="middle">сессии</text>
  <path class="ln" d="M346.0,62 L346.0,84" marker-end="url(#ah-fp-assembly)"/>
  <rect class="box" x="416" y="16" width="128" height="44" rx="6"/>
  <text class="ink sm b" x="480.0" y="36" text-anchor="middle">complaints</text>
  <text class="mut sm" x="480.0" y="52" text-anchor="middle">жалобы</text>
  <path class="ln" d="M480.0,62 L480.0,84" marker-end="url(#ah-fp-assembly)"/>
  <rect class="box-acc" x="14" y="88" width="530" height="50" rx="8"/>
  <text class="ink b" x="279.0" y="109" text-anchor="middle">SQL: WHERE … &lt; :cutoff  →  GROUP BY guest_id</text>
  <text class="ink2 sm" x="279.0" y="128" text-anchor="middle">по одной строке-агрегату на гостя; события после 1 июля не попадают</text>
  <rect class="box" x="550" y="16" width="136" height="44" rx="6"/>
  <text class="ink sm b" x="618.0" y="36" text-anchor="middle">guests + shops</text>
  <text class="mut sm" x="618.0" y="52" text-anchor="middle">основа: 4 800</text>
  <path class="ln" d="M618.0,62 L618.0,170" marker-end="url(#ah-fp-assembly)"/>
  <path class="ln" d="M320,140 L320,170" marker-end="url(#ah-fp-assembly)"/>
  <rect class="box" x="120" y="174" width="566" height="50" rx="8"/>
  <text class="ink b" x="403" y="195" text-anchor="middle">гости × признаки: 4 800 строк</text>
  <text class="ink2 sm" x="403" y="214" text-anchor="middle">LEFT JOIN по очереди · validate="one_to_one" · len() до и после · нет сессий и жалоб → 0</text>
  <text class="mut sm" x="110" y="195" text-anchor="end">заказы до среза</text>
  <text class="mut sm" x="110" y="211" text-anchor="end">у 4 387 гостей</text>
  <path class="ln" d="M403,226 L403,248" marker-end="url(#ah-fp-assembly)"/>
  <rect class="box-warn" x="120" y="252" width="270" height="50" rx="8"/>
  <text class="ink sm b" x="255" y="273" text-anchor="middle">+ pilot по guest_id → 2 400</text>
  <text class="ink2 sm" x="255" y="292" text-anchor="middle">1 800 «предложение» + 600 контроль</text>
  <path class="ln" d="M392,277 L422,277" marker-end="url(#ah-fp-assembly)"/>
  <rect class="box-ok" x="426" y="252" width="260" height="50" rx="8"/>
  <text class="ink sm b" x="556" y="273" text-anchor="middle">для модели: 1 800 «предложение»</text>
  <text class="ink2 sm" x="556" y="292" text-anchor="middle">контроль — для поправки в шаге 7</text>
</svg>
