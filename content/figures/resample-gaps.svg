<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-resample-gaps">
  <title id="t-resample-gaps">groupby по дате пропускает пустые дни, resample — нет</title>
  <defs><marker id="ah-resample-gaps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="180" y="26" text-anchor="middle">groupby(dt.date): 4 строки</text>
  <path class="ln-mut" d="M40,190 L300,190"/>
  <text class="mut sm" x="40.0" y="208" text-anchor="middle">01.10</text>
  <text class="mut sm" x="105.0" y="208" text-anchor="middle">02.10</text>
  <text class="mut sm" x="170.0" y="208" text-anchor="middle">03.10</text>
  <text class="mut sm" x="235.0" y="208" text-anchor="middle">04.10</text>
  <text class="mut sm" x="300.0" y="208" text-anchor="middle">05.10</text>
  <path class="ln" d="M40.0,87.9 L105.0,115.7 L235.0,87.9 L300.0,97.1"/>
  <circle class="box-acc" cx="40.0" cy="87.85714285714286" r="4"/>
  <text class="ink sm" x="40.0" y="77.85714285714286" text-anchor="middle">550</text>
  <circle class="box-acc" cx="105.0" cy="115.71428571428571" r="4"/>
  <text class="ink sm" x="105.0" y="105.71428571428571" text-anchor="middle">400</text>
  <circle class="box-acc" cx="235.0" cy="87.85714285714286" r="4"/>
  <text class="ink sm" x="235.0" y="77.85714285714286" text-anchor="middle">550</text>
  <circle class="box-acc" cx="300.0" cy="97.14285714285714" r="4"/>
  <text class="ink sm" x="300.0" y="87.14285714285714" text-anchor="middle">500</text>
  <text class="ink sm b" x="530" y="26" text-anchor="middle">resample("D"): 5 строк</text>
  <path class="ln-mut" d="M390,190 L650,190"/>
  <text class="mut sm" x="390.0" y="208" text-anchor="middle">01.10</text>
  <text class="mut sm" x="455.0" y="208" text-anchor="middle">02.10</text>
  <text class="mut sm" x="520.0" y="208" text-anchor="middle">03.10</text>
  <text class="mut sm" x="585.0" y="208" text-anchor="middle">04.10</text>
  <text class="mut sm" x="650.0" y="208" text-anchor="middle">05.10</text>
  <path class="ln-acc" d="M390.0,87.9 L455.0,115.7 L520.0,190.0 L585.0,87.9 L650.0,97.1"/>
  <circle class="box-acc" cx="390.0" cy="87.85714285714286" r="4"/>
  <text class="ink sm" x="390.0" y="77.85714285714286" text-anchor="middle">550</text>
  <circle class="box-acc" cx="455.0" cy="115.71428571428571" r="4"/>
  <text class="ink sm" x="455.0" y="105.71428571428571" text-anchor="middle">400</text>
  <circle class="box-acc" cx="520.0" cy="190.0" r="4"/>
  <text class="ink sm" x="520.0" y="180.0" text-anchor="middle">0</text>
  <circle class="box-acc" cx="585.0" cy="87.85714285714286" r="4"/>
  <text class="ink sm" x="585.0" y="77.85714285714286" text-anchor="middle">550</text>
  <circle class="box-acc" cx="650.0" cy="97.14285714285714" r="4"/>
  <text class="ink sm" x="650.0" y="87.14285714285714" text-anchor="middle">500</text>
  <text class="err sm b" x="144" y="150" text-anchor="middle">03.10 нет —</text>
  <text class="err sm" x="144" y="166" text-anchor="middle">линия «перепрыгнула»</text>
  <text class="mut sm" x="350" y="244" text-anchor="middle">Условные заказы за 5 дней; 3 октября заказов не было. Для графиков и рядов — resample: пустой день = 0.</text>
</svg>
