<svg viewBox="0 0 700 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-frame-default">
  <title id="t-frame-default">Рамка по умолчанию: соседи по значению и LAST_VALUE</title>
  <defs><marker id="ah-frame-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="170" y="22" text-anchor="middle">SUM(amount) OVER (ORDER BY day)</text>
  <text class="mut sm" x="170" y="38" text-anchor="middle">клетка закрашена — строка в рамке</text>
  <text class="ink2 sm b" x="119.0" y="66" text-anchor="middle">a · д1</text>
  <text class="ink2 sm b" x="165.0" y="66" text-anchor="middle">b · д1</text>
  <text class="ink2 sm b" x="211.0" y="66" text-anchor="middle">c · д2</text>
  <text class="ink2 sm b" x="272" y="66" text-anchor="middle">running</text>
  <text class="ink sm" x="86" y="94" text-anchor="end">a: д1, 100</text>
  <rect class="box-acc" x="98" y="74" width="42" height="30" rx="3"/>
  <text class="ink sm" x="119.0" y="94" text-anchor="middle">100</text>
  <rect class="box-acc" x="144" y="74" width="42" height="30" rx="3"/>
  <text class="ink sm" x="165.0" y="94" text-anchor="middle">50</text>
  <rect class="box" x="190" y="74" width="42" height="30" rx="3"/>
  <text class="acc b" x="272" y="94" text-anchor="middle">150</text>
  <text class="ink sm" x="86" y="128" text-anchor="end">b: д1, 50</text>
  <rect class="box-acc" x="98" y="108" width="42" height="30" rx="3"/>
  <text class="ink sm" x="119.0" y="128" text-anchor="middle">100</text>
  <rect class="box-acc" x="144" y="108" width="42" height="30" rx="3"/>
  <text class="ink sm" x="165.0" y="128" text-anchor="middle">50</text>
  <rect class="box" x="190" y="108" width="42" height="30" rx="3"/>
  <text class="acc b" x="272" y="128" text-anchor="middle">150</text>
  <text class="ink sm" x="86" y="162" text-anchor="end">c: д2, 70</text>
  <rect class="box-acc" x="98" y="142" width="42" height="30" rx="3"/>
  <text class="ink sm" x="119.0" y="162" text-anchor="middle">100</text>
  <rect class="box-acc" x="144" y="142" width="42" height="30" rx="3"/>
  <text class="ink sm" x="165.0" y="162" text-anchor="middle">50</text>
  <rect class="box-acc" x="190" y="142" width="42" height="30" rx="3"/>
  <text class="ink sm" x="211.0" y="162" text-anchor="middle">70</text>
  <text class="acc b" x="272" y="162" text-anchor="middle">220</text>
  <text class="ink2 sm" x="170" y="198" text-anchor="middle">у a и b одно значение day: обе</text>
  <text class="ink2 sm" x="170" y="214" text-anchor="middle">строки — соседи и видят друг друга</text>
  <path class="ln-mut dash" d="M352,20 V280"/>
  <text class="ink sm b" x="530" y="22" text-anchor="middle">LAST_VALUE(drink) OVER (ORDER BY day …)</text>
  <text class="ink2 sm b" x="454" y="66" text-anchor="middle">д1</text>
  <text class="ink2 sm b" x="490" y="66" text-anchor="middle">д2</text>
  <text class="ink2 sm b" x="526" y="66" text-anchor="middle">д3</text>
  <text class="ink2 sm b" x="578" y="52" text-anchor="middle">без</text>
  <text class="ink2 sm b" x="578" y="66" text-anchor="middle">рамки</text>
  <text class="ink2 sm b" x="648" y="52" text-anchor="middle">полная</text>
  <text class="ink2 sm b" x="648" y="66" text-anchor="middle">рамка</text>
  <text class="ink sm" x="428" y="94" text-anchor="end">д1: латте</text>
  <rect class="box-acc" x="438" y="74" width="32" height="30" rx="3"/>
  <rect class="box-warn" x="474" y="74" width="32" height="30" rx="3"/>
  <rect class="box-warn" x="510" y="74" width="32" height="30" rx="3"/>
  <text class="ink sm" x="578" y="94" text-anchor="middle">латте</text>
  <text class="ok sm b" x="648" y="94" text-anchor="middle">чай</text>
  <text class="ink sm" x="428" y="128" text-anchor="end">д2: раф</text>
  <rect class="box-acc" x="438" y="108" width="32" height="30" rx="3"/>
  <rect class="box-acc" x="474" y="108" width="32" height="30" rx="3"/>
  <rect class="box-warn" x="510" y="108" width="32" height="30" rx="3"/>
  <text class="err sm b" x="578" y="128" text-anchor="middle">раф</text>
  <text class="ok sm b" x="648" y="128" text-anchor="middle">чай</text>
  <text class="ink sm" x="428" y="162" text-anchor="end">д3: чай</text>
  <rect class="box-acc" x="438" y="142" width="32" height="30" rx="3"/>
  <rect class="box-acc" x="474" y="142" width="32" height="30" rx="3"/>
  <rect class="box-acc" x="510" y="142" width="32" height="30" rx="3"/>
  <text class="ink sm" x="578" y="162" text-anchor="middle">чай</text>
  <text class="ok sm b" x="648" y="162" text-anchor="middle">чай</text>
  <rect class="box-acc" x="372" y="186" width="14" height="14" rx="2"/>
  <text class="ink2 sm" x="392" y="198" text-anchor="start">рамка по умолчанию</text>
  <rect class="box-warn" x="372" y="206" width="14" height="14" rx="2"/>
  <text class="ink2 sm" x="392" y="218" text-anchor="start">добавляет ROWS … UNBOUNDED FOLLOWING</text>
  <text class="ink2 sm" x="530" y="244" text-anchor="middle">LAST_VALUE — последняя клетка рамки;</text>
  <text class="ink2 sm" x="530" y="260" text-anchor="middle">без рамки это сама текущая строка</text>
  <text class="mut sm" x="350" y="304" text-anchor="middle">с ORDER BY и без рамки окно идёт от начала до текущего значения включительно</text>
</svg>
