<svg viewBox="0 0 700 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ts-rolling-vs-resample">
  <title id="t-ts-rolling-vs-resample">rolling: окно сдвигается на шаг и ряд остаётся той же частоты; resample: корзины встык</title>
  <defs><marker id="ah-ts-rolling-vs-resample" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="14" y="30" text-anchor="start">rolling(3).mean()</text>
  <text class="mut sm" x="14" y="48" text-anchor="start">окна перекрываются, шаг — 1 час</text>
  <rect class="box" x="120" y="70" width="70" height="30" rx="3"/>
  <text class="ink b" x="155.0" y="90" text-anchor="middle">5</text>
  <text class="mut sm" x="155.0" y="64" text-anchor="middle">08:00</text>
  <rect class="box" x="196" y="70" width="70" height="30" rx="3"/>
  <text class="ink b" x="231.0" y="90" text-anchor="middle">7</text>
  <text class="mut sm" x="231.0" y="64" text-anchor="middle">09:00</text>
  <rect class="box" x="272" y="70" width="70" height="30" rx="3"/>
  <text class="ink b" x="307.0" y="90" text-anchor="middle">12</text>
  <text class="mut sm" x="307.0" y="64" text-anchor="middle">10:00</text>
  <rect class="box" x="348" y="70" width="70" height="30" rx="3"/>
  <text class="ink b" x="383.0" y="90" text-anchor="middle">10</text>
  <text class="mut sm" x="383.0" y="64" text-anchor="middle">11:00</text>
  <rect class="box" x="424" y="70" width="70" height="30" rx="3"/>
  <text class="ink b" x="459.0" y="90" text-anchor="middle">3</text>
  <text class="mut sm" x="459.0" y="64" text-anchor="middle">12:00</text>
  <rect class="box" x="500" y="70" width="70" height="30" rx="3"/>
  <text class="ink b" x="535.0" y="90" text-anchor="middle">9</text>
  <text class="mut sm" x="535.0" y="64" text-anchor="middle">13:00</text>
  <path class="ln-acc" d="M123,104 L123,108 L339,108 L339,104"/>
  <path class="ln-acc" d="M201,113 L201,117 L417,117 L417,113"/>
  <path class="ln-acc" d="M279,122 L279,126 L495,126 L495,122"/>
  <text class="mut sm" x="110" y="170" text-anchor="end">выход</text>
  <rect class="box" x="120" y="150" width="70" height="30" rx="3"/>
  <text class="mut sm" x="155.0" y="170" text-anchor="middle">NaN</text>
  <rect class="box" x="196" y="150" width="70" height="30" rx="3"/>
  <text class="mut sm" x="231.0" y="170" text-anchor="middle">NaN</text>
  <rect class="box-acc" x="272" y="150" width="70" height="30" rx="3"/>
  <text class="ink b" x="307.0" y="170" text-anchor="middle">8</text>
  <rect class="box-acc" x="348" y="150" width="70" height="30" rx="3"/>
  <text class="ink b" x="383.0" y="170" text-anchor="middle">9.67</text>
  <rect class="box-acc" x="424" y="150" width="70" height="30" rx="3"/>
  <text class="ink b" x="459.0" y="170" text-anchor="middle">8.33</text>
  <rect class="box-acc" x="500" y="150" width="70" height="30" rx="3"/>
  <text class="ink b" x="535.0" y="170" text-anchor="middle">7.33</text>
  <text class="ink2 sm" x="307.0" y="198" text-anchor="middle">(5 + 7 + 12) / 3</text>
  <text class="ink2 sm" x="423.0" y="198" text-anchor="middle"></text>
  <text class="acc sm b" x="538.0" y="198" text-anchor="middle">6 значений → 6 значений</text>
  <text class="ink b" x="14" y="234" text-anchor="start">resample("2h").sum()</text>
  <text class="mut sm" x="210" y="234" text-anchor="start">корзины встык, без перекрытия</text>
  <rect class="box-ok" x="120" y="252" width="146" height="30" rx="3"/>
  <text class="ink sm b" x="193.0" y="272" text-anchor="middle">5 + 7 = 12</text>
  <rect class="box-ok" x="272" y="252" width="146" height="30" rx="3"/>
  <text class="ink sm b" x="345.0" y="272" text-anchor="middle">12 + 10 = 22</text>
  <rect class="box-ok" x="424" y="252" width="146" height="30" rx="3"/>
  <text class="ink sm b" x="497.0" y="272" text-anchor="middle">3 + 9 = 12</text>
  <text class="ok sm b" x="348" y="304" text-anchor="middle">6 значений → 3 значения: частота стала крупнее</text>
</svg>
