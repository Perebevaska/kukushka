<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-extrapolation">
  <title id="t-extrapolation">Чек в копейках (× 100): линейная модель продолжает тренд далеко за пределы обучения, лес упирается в край</title>
  <defs><marker id="ah-extrapolation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm" x="350" y="22" text-anchor="middle">гость GOOD из урока «Модель как сервис» (Пермь, 4 визита); в обучении чек 120–661 ₽</text>
  <rect class="box" x="250" y="40" width="180" height="28" rx="3"/>
  <text class="ink2 sm b" x="340.0" y="59" text-anchor="middle">чек 446 ₽</text>
  <rect class="box" x="450" y="40" width="230" height="28" rx="3"/>
  <text class="ink2 sm b" x="565.0" y="59" text-anchor="middle">чек «44 600» (копейки)</text>
  <rect class="box" x="40" y="76" width="190" height="42" rx="3"/>
  <text class="ink sm b" x="50" y="102" text-anchor="start">1.0 — логистическая регрессия</text>
  <rect class="box-ok" x="250" y="76" width="180" height="42" rx="3"/>
  <text class="ink sm b" x="340.0" y="96" text-anchor="middle">P(уйдёт) = 0.094</text>
  <text class="ok sm" x="340.0" y="112" text-anchor="middle">не в акцию</text>
  <rect class="box-err" x="450" y="76" width="230" height="42" rx="3"/>
  <text class="ink sm b" x="565.0" y="96" text-anchor="middle">P(уйдёт) = 1.000</text>
  <text class="err sm" x="565.0" y="112" text-anchor="middle">в акцию</text>
  <rect class="box" x="40" y="126" width="190" height="42" rx="3"/>
  <text class="ink sm b" x="50" y="152" text-anchor="start">1.1 — лес</text>
  <rect class="box-ok" x="250" y="126" width="180" height="42" rx="3"/>
  <text class="ink sm b" x="340.0" y="146" text-anchor="middle">P(уйдёт) = 0.062</text>
  <text class="ok sm" x="340.0" y="162" text-anchor="middle">не в акцию</text>
  <rect class="box-ok" x="450" y="126" width="230" height="42" rx="3"/>
  <text class="ink sm b" x="565.0" y="146" text-anchor="middle">P(уйдёт) = 0.065</text>
  <text class="ok sm" x="565.0" y="162" text-anchor="middle">не в акцию</text>
  <text class="ink2 sm" x="350" y="206" text-anchor="middle">в масштабе обучения 44 600 ₽ — это 511 стандартных отклонений: даже малый вес чека даёт огромный вклад</text>
  <text class="ink2 sm" x="350" y="226" text-anchor="middle">дерево делит по порогам из обучающих данных: всё, что выше максимума, попадает в тот же лист</text>
  <text class="err sm b" x="350" y="252" text-anchor="middle">устойчивость леса тут — везение, а не защита: ловит такое только проверка входа</text>
</svg>
