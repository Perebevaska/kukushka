<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-items-grain">
  <title id="t-items-grain">Соединение заказов с позициями размножает строки</title>
  <defs><marker id="ah-items-grain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="85.0" y="36" text-anchor="middle">orders: 2 строки</text>
  <rect class="box" x="20" y="44" width="130" height="24" rx="3"/>
  <text class="ink2 sm b" x="50.0" y="60.5" text-anchor="middle">order_id</text>
  <text class="ink2 sm b" x="115.0" y="60.5" text-anchor="middle">channel</text>
  <rect class="box-acc" x="20" y="70" width="130" height="24" rx="3"/>
  <text class="ink sm" x="50.0" y="86.5" text-anchor="middle">Z1</text>
  <text class="ink sm" x="115.0" y="86.5" text-anchor="middle">зал</text>
  <rect class="box-ok" x="20" y="96" width="130" height="24" rx="3"/>
  <text class="ink sm" x="50.0" y="112.5" text-anchor="middle">Z2</text>
  <text class="ink sm" x="115.0" y="112.5" text-anchor="middle">с собой</text>
  <text class="ink2 sm b" x="150" y="140" text-anchor="middle">JOIN items</text>
  <text class="ink2 sm" x="150" y="156" text-anchor="middle">USING (order_id)</text>
  <path class="ln" d="M152,80 L196,80" marker-end="url(#ah-items-grain)"/>
  <text class="mut sm" x="340.0" y="36" text-anchor="middle">результат: 3 строки — по позициям</text>
  <rect class="box" x="200" y="44" width="280" height="24" rx="3"/>
  <text class="ink2 sm b" x="230.0" y="60.5" text-anchor="middle">order_id</text>
  <text class="ink2 sm b" x="293.0" y="60.5" text-anchor="middle">channel</text>
  <text class="ink2 sm b" x="368.0" y="60.5" text-anchor="middle">позиция</text>
  <text class="ink2 sm b" x="445.0" y="60.5" text-anchor="middle">qty×price</text>
  <rect class="box-acc" x="200" y="70" width="280" height="24" rx="3"/>
  <text class="ink sm" x="230.0" y="86.5" text-anchor="middle">Z1</text>
  <text class="ink sm" x="293.0" y="86.5" text-anchor="middle">зал</text>
  <text class="ink sm" x="368.0" y="86.5" text-anchor="middle">Капучино</text>
  <text class="ink sm" x="445.0" y="86.5" text-anchor="middle">380</text>
  <rect class="box-acc" x="200" y="96" width="280" height="24" rx="3"/>
  <text class="ink sm" x="230.0" y="112.5" text-anchor="middle">Z1</text>
  <text class="ink sm" x="293.0" y="112.5" text-anchor="middle">зал</text>
  <text class="ink sm" x="368.0" y="112.5" text-anchor="middle">Круассан</text>
  <text class="ink sm" x="445.0" y="112.5" text-anchor="middle">140</text>
  <rect class="box-ok" x="200" y="122" width="280" height="24" rx="3"/>
  <text class="ink sm" x="230.0" y="138.5" text-anchor="middle">Z2</text>
  <text class="ink sm" x="293.0" y="138.5" text-anchor="middle">с собой</text>
  <text class="ink sm" x="368.0" y="138.5" text-anchor="middle">Латте</text>
  <text class="ink sm" x="445.0" y="138.5" text-anchor="middle">210</text>
  <text class="err sm b" x="510" y="52" text-anchor="start">COUNT(*) = 3</text>
  <text class="ok sm b" x="510" y="72" text-anchor="start">COUNT(DISTINCT order_id) = 2</text>
  <text class="ink2 sm" x="510" y="98" text-anchor="start">позиции считаются</text>
  <text class="ink2 sm" x="510" y="114" text-anchor="start">как заказы — ошибка</text>
  <path class="ln-mut dash" d="M20,170 H690"/>
  <text class="ink b" x="20" y="194" text-anchor="start">средний чек</text>
  <rect class="box-err" x="20" y="206" width="300" height="58" rx="6"/>
  <text class="ink sm" x="170.0" y="222.5" text-anchor="middle">AVG(qty × price) по строкам позиций</text>
  <text class="ink sm b" x="170.0" y="239.5" text-anchor="middle">(380 + 140 + 210) / 3 = 243.3</text>
  <text class="err sm b" x="170.0" y="256.5" text-anchor="middle">это средняя позиция, а не чек</text>
  <rect class="box-ok" x="340" y="206" width="350" height="58" rx="6"/>
  <text class="ink sm" x="515.0" y="222.5" text-anchor="middle">шаг 1 (CTE): сумма заказа — Z1 = 520, Z2 = 210</text>
  <text class="ink sm b" x="515.0" y="239.5" text-anchor="middle">шаг 2: среднее — (520 + 210) / 2 = 365.0</text>
  <text class="ok sm b" x="515.0" y="256.5" text-anchor="middle">это средний чек</text>
  <text class="ink2 sm" x="350" y="292" text-anchor="middle">в базе «Зерна»: 14 510 заказов → 22 813 строк после JOIN;</text>
  <text class="ink2 sm" x="350" y="310" text-anchor="middle">«чек» по позициям 212.5 ₽ против настоящего 334.1 ₽</text>
</svg>
