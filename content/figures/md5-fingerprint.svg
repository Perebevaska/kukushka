<svg viewBox="0 0 700 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-md5-fingerprint">
  <title id="t-md5-fingerprint">Отпечаток: одинаковые байты дают одинаковый хеш, одна изменённая буква — совсем другой</title>
  <defs><marker id="ah-md5-fingerprint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="24" width="110" height="34" rx="4"/>
  <text class="ink b" x="69" y="46" text-anchor="middle">«Зерно»</text>
  <path class="ln" d="M126,41 L176,41" marker-end="url(#ah-md5-fingerprint)"/>
  <text class="mut sm" x="151" y="33" text-anchor="middle">md5</text>
  <rect class="box-ok" x="180" y="24" width="330" height="34" rx="4"/>
  <text class="ink sm" x="345" y="46" text-anchor="middle">f78107696cccb83ab53d0edd4750f3ed</text>
  <rect class="box" x="14" y="68" width="110" height="34" rx="4"/>
  <text class="ink b" x="69" y="90" text-anchor="middle">«Зерно»</text>
  <path class="ln" d="M126,85 L176,85" marker-end="url(#ah-md5-fingerprint)"/>
  <text class="mut sm" x="151" y="77" text-anchor="middle">md5</text>
  <rect class="box-ok" x="180" y="68" width="330" height="34" rx="4"/>
  <text class="ink sm" x="345" y="90" text-anchor="middle">f78107696cccb83ab53d0edd4750f3ed</text>
  <rect class="box-warn" x="14" y="112" width="110" height="34" rx="4"/>
  <text class="ink b" x="69" y="134" text-anchor="middle">«Зерна»</text>
  <path class="ln" d="M126,129 L176,129" marker-end="url(#ah-md5-fingerprint)"/>
  <text class="mut sm" x="151" y="121" text-anchor="middle">md5</text>
  <rect class="box-err" x="180" y="112" width="330" height="34" rx="4"/>
  <text class="ink sm" x="345" y="134" text-anchor="middle">e6bcbe4492866eca8544ffc574af62f5</text>
  <text class="ok sm b" x="600" y="46" text-anchor="middle">совпали</text>
  <path class="ln-ok" d="M520,41 C540,41 540,85 520,85"/>
  <text class="err sm b" x="600" y="128" text-anchor="middle">одна буква —</text>
  <text class="err sm b" x="600" y="146" text-anchor="middle">всё другое</text>
  <text class="mut sm" x="350" y="176" text-anchor="middle">для файла — то же: hashlib.md5(open(путь, "rb").read()).hexdigest() пишут в паспорт</text>
</svg>
