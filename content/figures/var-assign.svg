<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-var-assign">
  <title id="t-var-assign">Присваивание: сначала правая часть, потом имя слева</title>
  <defs><marker id="ah-var-assign" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="170" y="24" text-anchor="middle">revenue = cups * price</text>
  <rect class="box" x="20" y="44" width="120" height="34" rx="6"/>
  <text class="ink sm" x="80.0" y="65.5" text-anchor="middle">cups → 120</text>
  <rect class="box" x="20" y="90" width="120" height="34" rx="6"/>
  <text class="ink sm" x="80.0" y="111.5" text-anchor="middle">price → 180</text>
  <rect class="box-acc" x="180" y="62" width="140" height="44" rx="6"/>
  <text class="ink sm b" x="250.0" y="88.5" text-anchor="middle">120 × 180 = 21 600</text>
  <path class="ln" d="M142,61 L176,78" marker-end="url(#ah-var-assign)"/>
  <path class="ln" d="M142,107 L176,92" marker-end="url(#ah-var-assign)"/>
  <text class="acc sm b" x="250" y="128" text-anchor="middle">1. считается правая часть</text>
  <rect class="box-ok" x="180" y="170" width="140" height="34" rx="6"/>
  <text class="ink sm b" x="250.0" y="191.5" text-anchor="middle">revenue → 21 600</text>
  <path class="ln" d="M250,136 L250,166" marker-end="url(#ah-var-assign)"/>
  <text class="acc sm b" x="250" y="224" text-anchor="middle">2. результат кладётся</text>
  <text class="acc sm b" x="250" y="240" text-anchor="middle">в имя слева</text>
  <path class="ln-mut" d="M350,30 L350,250"/>
  <text class="ink b" x="525" y="24" text-anchor="middle">потом: cups = 200</text>
  <rect class="box-acc" x="380" y="44" width="150" height="34" rx="6"/>
  <text class="ink sm b" x="455.0" y="65.5" text-anchor="middle">cups → 200</text>
  <text class="acc sm" x="610" y="66" text-anchor="middle">ярлык перевесили</text>
  <rect class="box" x="380" y="90" width="150" height="34" rx="6"/>
  <text class="ink sm" x="455.0" y="111.5" text-anchor="middle">price → 180</text>
  <rect class="box-warn" x="380" y="170" width="150" height="34" rx="6"/>
  <text class="ink sm b" x="455.0" y="191.5" text-anchor="middle">revenue → 21 600</text>
  <text class="ink2 sm" x="525" y="228" text-anchor="middle">revenue не пересчиталась: в ней лежит число,</text>
  <text class="ink2 sm" x="525" y="244" text-anchor="middle">а не формула. Нужна строка revenue = … ещё раз.</text>
</svg>
