<svg viewBox="0 0 700 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sql-project-map">
  <title id="t-sql-project-map">От вопросов руководства к шагам проекта и приёмам SQL</title>
  <defs><marker id="ah-sql-project-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="95" y="22" text-anchor="middle">вопрос руководства</text>
  <text class="mut sm b" x="340" y="22" text-anchor="middle">шаги</text>
  <text class="mut sm b" x="570" y="22" text-anchor="middle">приём</text>
  <rect class="box" x="10" y="34" width="170" height="44" rx="6"/>
  <text class="ink sm b" x="95.0" y="52.5" text-anchor="middle">Как росла выручка</text>
  <text class="ink sm" x="95.0" y="68.5" text-anchor="middle">по городам?</text>
  <path class="ln" d="M182,56 L222,56" marker-end="url(#ah-sql-project-map)"/>
  <rect class="box-acc" x="226" y="42" width="34" height="28" rx="14"/>
  <text class="ink b" x="243" y="61" text-anchor="middle">2</text>
  <path class="ln-mut" d="M270,56 L452,56" marker-end="url(#ah-sql-project-map)"/>
  <text class="ink2 sm" x="460" y="60" text-anchor="start">JOIN трёх таблиц, COUNT(DISTINCT)</text>
  <rect class="box" x="10" y="88" width="170" height="44" rx="6"/>
  <text class="ink sm b" x="95.0" y="106.5" text-anchor="middle">Что в меню</text>
  <text class="ink sm" x="95.0" y="122.5" text-anchor="middle">не продаётся?</text>
  <path class="ln" d="M182,110 L222,110" marker-end="url(#ah-sql-project-map)"/>
  <rect class="box-acc" x="226" y="96" width="34" height="28" rx="14"/>
  <text class="ink b" x="243" y="115" text-anchor="middle">3</text>
  <path class="ln-mut" d="M270,110 L452,110" marker-end="url(#ah-sql-project-map)"/>
  <text class="ink2 sm" x="460" y="114" text-anchor="start">LEFT JOIN … IS NULL</text>
  <rect class="box" x="10" y="142" width="170" height="44" rx="6"/>
  <text class="ink sm b" x="95.0" y="160.5" text-anchor="middle">Карта: чаще</text>
  <text class="ink sm" x="95.0" y="176.5" text-anchor="middle">и больше тратят?</text>
  <path class="ln" d="M182,164 L222,164" marker-end="url(#ah-sql-project-map)"/>
  <rect class="box-acc" x="226" y="150" width="34" height="28" rx="14"/>
  <text class="ink b" x="243" y="169" text-anchor="middle">4</text>
  <rect class="box-acc" x="266" y="150" width="34" height="28" rx="14"/>
  <text class="ink b" x="283" y="169" text-anchor="middle">5</text>
  <path class="ln-mut" d="M310,164 L452,164" marker-end="url(#ah-sql-project-map)"/>
  <text class="ink2 sm" x="460" y="168" text-anchor="start">CTE «сумма заказа», CASE</text>
  <rect class="box" x="10" y="196" width="170" height="44" rx="6"/>
  <text class="ink sm b" x="95.0" y="214.5" text-anchor="middle">Сработали ли акции,</text>
  <text class="ink sm" x="95.0" y="230.5" text-anchor="middle">что стоили по марже?</text>
  <path class="ln" d="M182,218 L222,218" marker-end="url(#ah-sql-project-map)"/>
  <rect class="box-acc" x="226" y="204" width="34" height="28" rx="14"/>
  <text class="ink b" x="243" y="223" text-anchor="middle">6</text>
  <rect class="box-acc" x="266" y="204" width="34" height="28" rx="14"/>
  <text class="ink b" x="283" y="223" text-anchor="middle">7</text>
  <path class="ln-mut" d="M310,218 L452,218" marker-end="url(#ah-sql-project-map)"/>
  <text class="ink2 sm" x="460" y="222" text-anchor="start">себестоимость, LAG по месяцам</text>
  <rect class="box" x="10" y="250" width="170" height="44" rx="6"/>
  <text class="ink sm b" x="95.0" y="268.5" text-anchor="middle">Кто удерживается:</text>
  <text class="ink sm" x="95.0" y="284.5" text-anchor="middle">приложение или касса?</text>
  <path class="ln" d="M182,272 L222,272" marker-end="url(#ah-sql-project-map)"/>
  <rect class="box-acc" x="226" y="258" width="34" height="28" rx="14"/>
  <text class="ink b" x="243" y="277" text-anchor="middle">8</text>
  <rect class="box-acc" x="266" y="258" width="34" height="28" rx="14"/>
  <text class="ink b" x="283" y="277" text-anchor="middle">9</text>
  <rect class="box-acc" x="306" y="258" width="34" height="28" rx="14"/>
  <text class="ink b" x="323" y="277" text-anchor="middle">10</text>
  <path class="ln-mut" d="M350,272 L452,272" marker-end="url(#ah-sql-project-map)"/>
  <text class="ink2 sm" x="460" y="276" text-anchor="start">ROW_NUMBER, LEAD, когорты</text>
  <rect class="box-warn" x="10" y="308" width="680" height="34" rx="6"/>
  <text class="ink sm b" x="350" y="330" text-anchor="middle">шаг 1 — до всех вопросов: все ли таблицы на месте, совпадают ли строки после соединений</text>
  <text class="ink2 sm" x="350" y="366" text-anchor="middle">часть А — шаги 1–10 с проверкой в браузере; часть Б — блокнот: запросы + графики + выводы</text>
</svg>
