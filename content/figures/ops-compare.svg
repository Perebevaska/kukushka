<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ops-compare">
  <title id="t-ops-compare">Сколько умножений нужно формуле и 500 шагам спуска (логарифмическая шкала)</title>
  <defs><marker id="ah-ops-compare" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <path class="ln-mut" d="M170.0,34 L170.0,232"/>
  <text class="mut sm" x="170.0" y="250" text-anchor="middle">10⁴</text>
  <path class="ln-mut" d="M212.72727272727272,34 L212.72727272727272,232"/>
  <path class="ln-mut" d="M255.45454545454544,34 L255.45454545454544,232"/>
  <text class="mut sm" x="255.45454545454544" y="250" text-anchor="middle">10⁶</text>
  <path class="ln-mut" d="M298.18181818181813,34 L298.18181818181813,232"/>
  <path class="ln-mut" d="M340.9090909090909,34 L340.9090909090909,232"/>
  <text class="mut sm" x="340.9090909090909" y="250" text-anchor="middle">10⁸</text>
  <path class="ln-mut" d="M383.6363636363636,34 L383.6363636363636,232"/>
  <path class="ln-mut" d="M426.3636363636363,34 L426.3636363636363,232"/>
  <text class="mut sm" x="426.3636363636363" y="250" text-anchor="middle">10¹⁰</text>
  <path class="ln-mut" d="M469.09090909090907,34 L469.09090909090907,232"/>
  <path class="ln-mut" d="M511.8181818181818,34 L511.8181818181818,232"/>
  <text class="mut sm" x="511.8181818181818" y="250" text-anchor="middle">10¹²</text>
  <path class="ln-mut" d="M554.5454545454545,34 L554.5454545454545,232"/>
  <path class="ln-mut" d="M597.2727272727273,34 L597.2727272727273,232"/>
  <text class="mut sm" x="597.2727272727273" y="250" text-anchor="middle">10¹⁴</text>
  <path class="ln-mut" d="M640.0,34 L640.0,232"/>
  <text class="mut sm" x="405.0" y="270" text-anchor="middle">умножений (каждая клетка шкалы — в 10 раз больше)</text>
  <text class="ink sm b" x="160" y="62" text-anchor="end">доставки</text>
  <text class="mut sm" x="160" y="78" text-anchor="end">n = 1 841, d = 4</text>
  <rect class="box-ok" x="170" y="44" width="20.08678963463379" height="22" rx="3"/>
  <rect class="box-err" x="170" y="70" width="122.50395241100267" height="22" rx="3"/>
  <text class="ink sm" x="196.0867896346338" y="60" text-anchor="start">формула 2.95e+04</text>
  <text class="ink sm" x="298.5039524110027" y="86" text-anchor="start">спуск 7.36e+06</text>
  <text class="ink sm b" x="160" y="128" text-anchor="end">чеки за год</text>
  <text class="mut sm" x="160" y="144" text-anchor="end">n = 1 000 000, d = 20</text>
  <rect class="box-ok" x="170" y="110" width="196.63384347740453" height="22" rx="3"/>
  <rect class="box-err" x="170" y="136" width="269.22582708746097" height="22" rx="3"/>
  <text class="ink sm" x="372.6338434774045" y="126" text-anchor="start">формула 4.00e+08</text>
  <text class="ink sm" x="445.22582708746097" y="152" text-anchor="start">спуск 2.00e+10</text>
  <text class="ink sm b" x="160" y="194" text-anchor="end">тексты отзывов</text>
  <text class="mut sm" x="160" y="210" text-anchor="end">n = 100 000, d = 50 000</text>
  <rect class="box-err" x="170" y="176" width="451.7995178029116" height="22" rx="3"/>
  <rect class="box-ok" x="170" y="202" width="371.6832638216299" height="22" rx="3"/>
  <text class="ink sm" x="615.7995178029116" y="192" text-anchor="end">формула 3.75e+14</text>
  <text class="ink sm" x="547.6832638216299" y="218" text-anchor="start">спуск 5.00e+12</text>
  <text class="ink2 sm" x="350" y="292" text-anchor="middle">зелёным — что дешевле: формула выигрывает на узких таблицах, спуск — на широких (d в квадрате и кубе)</text>
</svg>
