<svg viewBox="0 0 700 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-inspect-checklist">
  <title id="t-inspect-checklist">Пять шагов осмотра анкет и что нашёл каждый</title>
  <defs><marker id="ah-inspect-checklist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="10" y="14" width="128" height="48" rx="6"/>
  <text class="mut sm" x="74.0" y="33.5" text-anchor="middle">шаг 1</text>
  <text class="ink sm b" x="74.0" y="51.5" text-anchor="middle">shape, info()</text>
  <path class="ln" d="M139,38 L147,38" marker-end="url(#ah-inspect-checklist)"/>
  <path class="ln" d="M74.0,64 L74.0,82" marker-end="url(#ah-inspect-checklist)"/>
  <rect class="box-warn" x="10" y="84" width="128" height="70" rx="6"/>
  <text class="ink sm" x="74.0" y="106.5" text-anchor="middle">307 × 9, все str:</text>
  <text class="ink sm" x="74.0" y="123.5" text-anchor="middle">bonus — текст,</text>
  <text class="ink sm" x="74.0" y="140.5" text-anchor="middle">а не число</text>
  <path class="ln" d="M74.0,156 L74.0,174" marker-end="url(#ah-inspect-checklist)"/>
  <rect class="box-ok" x="10" y="176" width="128" height="30" rx="6"/>
  <text class="ink sm" x="74.0" y="195.5" text-anchor="middle">урок 3: типы</text>
  <rect class="box-acc" x="148" y="14" width="128" height="48" rx="6"/>
  <text class="mut sm" x="212.0" y="33.5" text-anchor="middle">шаг 2</text>
  <text class="ink sm b" x="212.0" y="51.5" text-anchor="middle">isna().sum()</text>
  <path class="ln" d="M277,38 L285,38" marker-end="url(#ah-inspect-checklist)"/>
  <path class="ln" d="M212.0,64 L212.0,82" marker-end="url(#ah-inspect-checklist)"/>
  <rect class="box-warn" x="148" y="84" width="128" height="70" rx="6"/>
  <text class="ink sm" x="212.0" y="106.5" text-anchor="middle">пропуски в 6 из 9</text>
  <text class="ink sm" x="212.0" y="123.5" text-anchor="middle">столбцов, больше</text>
  <text class="ink sm" x="212.0" y="140.5" text-anchor="middle">всего в source: 27</text>
  <path class="ln" d="M212.0,156 L212.0,174" marker-end="url(#ah-inspect-checklist)"/>
  <rect class="box-ok" x="148" y="176" width="128" height="30" rx="6"/>
  <text class="ink sm" x="212.0" y="195.5" text-anchor="middle">урок 2: пропуски</text>
  <rect class="box-acc" x="286" y="14" width="128" height="48" rx="6"/>
  <text class="mut sm" x="350.0" y="33.5" text-anchor="middle">шаг 3</text>
  <text class="ink sm b" x="350.0" y="51.5" text-anchor="middle">value_counts()</text>
  <path class="ln" d="M415,38 L423,38" marker-end="url(#ah-inspect-checklist)"/>
  <path class="ln" d="M350.0,64 L350.0,82" marker-end="url(#ah-inspect-checklist)"/>
  <rect class="box-warn" x="286" y="84" width="128" height="70" rx="6"/>
  <text class="ink sm" x="350.0" y="106.5" text-anchor="middle">город записан</text>
  <text class="ink sm" x="350.0" y="123.5" text-anchor="middle">29 способами:</text>
  <text class="ink sm" x="350.0" y="140.5" text-anchor="middle">«пермь», «г. Пермь»…</text>
  <path class="ln" d="M350.0,156 L350.0,174" marker-end="url(#ah-inspect-checklist)"/>
  <rect class="box-ok" x="286" y="176" width="128" height="30" rx="6"/>
  <text class="ink sm" x="350.0" y="195.5" text-anchor="middle">урок 5: строки</text>
  <rect class="box-acc" x="424" y="14" width="128" height="48" rx="6"/>
  <text class="mut sm" x="488.0" y="33.5" text-anchor="middle">шаг 4</text>
  <text class="ink sm b" x="488.0" y="51.5" text-anchor="middle">duplicated()</text>
  <path class="ln" d="M553,38 L561,38" marker-end="url(#ah-inspect-checklist)"/>
  <path class="ln" d="M488.0,64 L488.0,82" marker-end="url(#ah-inspect-checklist)"/>
  <rect class="box-warn" x="424" y="84" width="128" height="70" rx="6"/>
  <text class="ink sm" x="488.0" y="106.5" text-anchor="middle">8 полных копий</text>
  <text class="ink sm" x="488.0" y="123.5" text-anchor="middle">строк; ключ</text>
  <text class="ink sm" x="488.0" y="140.5" text-anchor="middle">client_id не уникален</text>
  <path class="ln" d="M488.0,156 L488.0,174" marker-end="url(#ah-inspect-checklist)"/>
  <rect class="box-ok" x="424" y="176" width="128" height="30" rx="6"/>
  <text class="ink sm" x="488.0" y="195.5" text-anchor="middle">урок 4: дубли</text>
  <rect class="box-acc" x="562" y="14" width="128" height="48" rx="6"/>
  <text class="mut sm" x="626.0" y="33.5" text-anchor="middle">шаг 5</text>
  <text class="ink sm b" x="626.0" y="51.5" text-anchor="middle">sample()</text>
  <path class="ln" d="M626.0,64 L626.0,82" marker-end="url(#ah-inspect-checklist)"/>
  <rect class="box-warn" x="562" y="84" width="128" height="70" rx="6"/>
  <text class="ink sm" x="626.0" y="106.5" text-anchor="middle">bonus: 41 значение</text>
  <text class="ink sm" x="626.0" y="123.5" text-anchor="middle">не из цифр: «1 250»,</text>
  <text class="ink sm" x="626.0" y="140.5" text-anchor="middle">«—», минус</text>
  <path class="ln" d="M626.0,156 L626.0,174" marker-end="url(#ah-inspect-checklist)"/>
  <rect class="box-ok" x="562" y="176" width="128" height="30" rx="6"/>
  <text class="ink sm" x="626.0" y="195.5" text-anchor="middle">уроки 3 и 7</text>
  <text class="ink2" x="350" y="232" text-anchor="middle">Осмотр ничего не чинит: он составляет список работ.</text>
  <text class="mut sm" x="350" y="252" text-anchor="middle">Каждая находка — задача для одного из следующих уроков главы.</text>
</svg>
