<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-custom-fit">
  <title id="t-custom-fit">Свой трансформер: fit учит средние по городам, transform делит на них</title>
  <defs><marker id="ah-custom-fit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="105.0" y="36" text-anchor="middle">обучающие гости</text>
  <rect class="box" x="20" y="44" width="170" height="24" rx="3"/>
  <text class="ink2 sm b" x="65.0" y="60.5" text-anchor="middle">city</text>
  <text class="ink2 sm b" x="150.0" y="60.5" text-anchor="middle">avg_check</text>
  <rect class="box" x="20" y="70" width="170" height="24" rx="3"/>
  <text class="ink sm" x="65.0" y="86.5" text-anchor="middle">Казань</text>
  <text class="ink sm" x="150.0" y="86.5" text-anchor="middle">420</text>
  <rect class="box" x="20" y="96" width="170" height="24" rx="3"/>
  <text class="ink sm" x="65.0" y="112.5" text-anchor="middle">Казань</text>
  <text class="ink sm" x="150.0" y="112.5" text-anchor="middle">300</text>
  <rect class="box" x="20" y="122" width="170" height="24" rx="3"/>
  <text class="ink sm" x="65.0" y="138.5" text-anchor="middle">Пермь</text>
  <text class="ink sm" x="150.0" y="138.5" text-anchor="middle">330</text>
  <rect class="box" x="20" y="148" width="170" height="24" rx="3"/>
  <text class="ink sm" x="65.0" y="164.5" text-anchor="middle">Пермь</text>
  <text class="ink sm" x="150.0" y="164.5" text-anchor="middle">270</text>
  <rect class="box" x="20" y="174" width="170" height="24" rx="3"/>
  <text class="ink sm" x="65.0" y="190.5" text-anchor="middle">Пермь</text>
  <text class="ink sm" x="150.0" y="190.5" text-anchor="middle">300</text>
  <path class="ln" d="M194,110 L236,110" marker-end="url(#ah-custom-fit)"/>
  <text class="acc sm b" x="215" y="100" text-anchor="middle">fit</text>
  <rect class="box-acc" x="236" y="52" width="164" height="116" rx="6"/>
  <text class="ink2 sm" x="318.0" y="80.5" text-anchor="middle">запомнил:</text>
  <text class="ink sm b" x="318.0" y="97.5" text-anchor="middle">means_ Казань = 360</text>
  <text class="ink sm b" x="318.0" y="114.5" text-anchor="middle">means_ Пермь = 300</text>
  <text class="ink sm b" x="318.0" y="131.5" text-anchor="middle">overall_ = 324</text>
  <text class="mut sm" x="318.0" y="148.5" text-anchor="middle">(для новых городов)</text>
  <path class="ln" d="M402,110 L462,110" marker-end="url(#ah-custom-fit)"/>
  <text class="ok sm b" x="432" y="100" text-anchor="middle">transform</text>
  <text class="mut sm" x="580.0" y="64" text-anchor="middle">новые гости</text>
  <rect class="box" x="466" y="72" width="228" height="26" rx="3"/>
  <text class="ink2 sm b" x="498.0" y="89.5" text-anchor="middle">city</text>
  <text class="ink2 sm b" x="552.0" y="89.5" text-anchor="middle">чек</text>
  <text class="ink2 sm b" x="634.0" y="89.5" text-anchor="middle">чек / база</text>
  <rect class="box" x="466" y="100" width="228" height="26" rx="3"/>
  <text class="ink sm" x="498.0" y="117.5" text-anchor="middle">Казань</text>
  <text class="ink sm" x="552.0" y="117.5" text-anchor="middle">450</text>
  <text class="ink sm b" x="634.0" y="117.5" text-anchor="middle">450 / 360 = 1.25</text>
  <rect class="box" x="466" y="128" width="228" height="26" rx="3"/>
  <text class="ink sm" x="498.0" y="145.5" text-anchor="middle">Уфа</text>
  <text class="ink sm" x="552.0" y="145.5" text-anchor="middle">243</text>
  <text class="ink sm b" x="634.0" y="145.5" text-anchor="middle">243 / 324 = 0.75</text>
  <text class="mut sm" x="580" y="176" text-anchor="middle">Уфы нет в means_ → общее среднее</text>
  <text class="ink2 sm" x="350" y="226" text-anchor="middle">__init__ только хранит настройки; всё выученное — в атрибутах с «_» на конце; transform ничего не учит</text>
</svg>
