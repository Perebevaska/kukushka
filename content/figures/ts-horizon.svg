<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ts-horizon">
  <title id="t-ts-horizon">Горизонт «на завтра»: решение в 20:00, для поздних часов завтра лаг 24 указывает в неизвестное</title>
  <defs><marker id="ah-ts-horizon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-ok" x="30.0" y="150" width="391.11111111111114" height="28" rx="3"/>
  <rect class="box dash" x="421.11111111111114" y="150" width="35.55555555555554" height="28" rx="0"/>
  <rect class="box-acc" x="456.6666666666667" y="150" width="213.33333333333331" height="28" rx="3"/>
  <text class="ink sm b" x="225.55555555555557" y="169" text-anchor="middle">данные есть: до 19:59 сегодня</text>
  <path class="ln" d="M30.0,178 L30.0,188"/>
  <path class="ln" d="M243.33333333333334,178 L243.33333333333334,188"/>
  <path class="ln" d="M456.6666666666667,178 L456.6666666666667,188"/>
  <path class="ln" d="M670.0,178 L670.0,188"/>
  <text class="ink2 sm b" x="136.66666666666669" y="196" text-anchor="middle">вчера</text>
  <text class="ink2 sm b" x="350.0" y="196" text-anchor="middle">сегодня</text>
  <text class="ink2 sm b" x="563.3333333333334" y="196" text-anchor="middle">завтра</text>
  <path class="ln" d="M421.11111111111114,124 L421.11111111111114,180"/>
  <text class="ink sm b" x="415.11111111111114" y="136" text-anchor="end">решение 20:00</text>
  <path class="ln-err" d="M661.1111111111111,148 C661.1111111111111,84 447.77777777777777,84 447.77777777777777,148" marker-end="url(#ah-ts-horizon)"/>
  <text class="err sm b" x="554.4444444444445" y="96" text-anchor="middle">лаг 24 → 23:00 сегодня: ещё нет</text>
  <path class="ln-ok" d="M661.1111111111111,148 C661.1111111111111,18 234.44444444444446,18 234.44444444444446,148" marker-end="url(#ah-ts-horizon)"/>
  <text class="ok sm b" x="447.77777777777777" y="46" text-anchor="middle">лаг 48 → 23:00 вчера: есть</text>
  <circle class="box-warn" cx="661.1111111111111" cy="164" r="4"/>
  <text class="ink sm b" x="653.1111111111111" y="169" text-anchor="end">прогноз на 23:00</text>
  <path class="ln-acc" d="M421.11111111111114,207 L421.11111111111114,212 L670.0,212 L670.0,207"/>
  <text class="acc sm b" x="545.5555555555555" y="230" text-anchor="middle">горизонт: от 4 до 28 часов</text>
  <text class="ink2 sm" x="350" y="262" text-anchor="middle">последний известный час — 19:00 сегодня, до 23:00 завтра от него 28 часов → для всех часов законны лаги ≥ 28</text>
  <text class="mut sm" x="350" y="282" text-anchor="middle">для утренних часов лаг 24 ещё законен: 07:00 завтра → 07:00 сегодня</text>
</svg>
