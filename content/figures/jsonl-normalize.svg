  <text class="mut sm" x="32" y="56" text-anchor="start">1</text>
  <text class="ink sm" x="48" y="56" text-anchor="start">{"ts": "2026-11-02T07:10:57", …, "status": 200, "latency_ms": 42.6, …, <tspan class="warn b">"payload": {"city": "Уфа", …}}</tspan></text>
