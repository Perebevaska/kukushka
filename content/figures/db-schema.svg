<svg viewBox="0 0 700 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-db-schema">
  <title id="t-db-schema">Схема базы «Зерна»: факты и справочники</title>
  <defs><marker id="ah-db-schema" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20" y="100" width="150" height="62" rx="6"/>
  <text class="ink b" x="95.0" y="118.5" text-anchor="middle">menu</text>
  <text class="ink2 sm" x="95.0" y="135.5" text-anchor="middle">позиция меню</text>
  <text class="mut sm" x="95.0" y="152.5" text-anchor="middle">15 строк</text>
  <rect class="box-acc" x="240" y="100" width="160" height="62" rx="6"/>
  <text class="ink b" x="320.0" y="118.5" text-anchor="middle">items</text>
  <text class="ink2 sm" x="320.0" y="135.5" text-anchor="middle">позиция заказа</text>
  <text class="mut sm" x="320.0" y="152.5" text-anchor="middle">22 813 строк</text>
  <rect class="box-ok" x="240" y="236" width="160" height="62" rx="6"/>
  <text class="ink b" x="320.0" y="254.5" text-anchor="middle">orders</text>
  <text class="ink2 sm" x="320.0" y="271.5" text-anchor="middle">заказ («шапка»)</text>
  <text class="mut sm" x="320.0" y="288.5" text-anchor="middle">14 510 строк</text>
  <rect class="box" x="500" y="20" width="180" height="62" rx="6"/>
  <text class="ink b" x="590.0" y="38.5" text-anchor="middle">promos</text>
  <text class="ink2 sm" x="590.0" y="55.5" text-anchor="middle">акция</text>
  <text class="mut sm" x="590.0" y="72.5" text-anchor="middle">3 строки</text>
  <rect class="box" x="500" y="128" width="180" height="62" rx="6"/>
  <text class="ink b" x="590.0" y="146.5" text-anchor="middle">shops</text>
  <text class="ink2 sm" x="590.0" y="163.5" text-anchor="middle">кофейня</text>
  <text class="mut sm" x="590.0" y="180.5" text-anchor="middle">6 строк</text>
  <rect class="box" x="500" y="236" width="180" height="62" rx="6"/>
  <text class="ink b" x="590.0" y="254.5" text-anchor="middle">guests</text>
  <text class="ink2 sm" x="590.0" y="271.5" text-anchor="middle">гость с картой</text>
  <text class="mut sm" x="590.0" y="288.5" text-anchor="middle">1 510 строк</text>
  <text class="acc sm b" x="320" y="88" text-anchor="middle">факты: выручка = qty × price</text>
  <path class="ln" d="M238,131 L172,131" marker-end="url(#ah-db-schema)"/>
  <text class="ink2 sm" x="205" y="123" text-anchor="middle">item_id</text>
  <path class="ln" d="M320,164 L320,234" marker-end="url(#ah-db-schema)"/>
  <text class="ink2 sm" x="326" y="204" text-anchor="start">order_id</text>
  <path class="ln dash" d="M402,244 C452,244 446,51 498,51" marker-end="url(#ah-db-schema)"/>
  <text class="ink2 sm" x="472" y="100" text-anchor="start">promo_id</text>
  <text class="mut sm" x="472" y="114" text-anchor="start">чаще пусто</text>
  <path class="ln" d="M402,256 C452,256 446,159 498,159" marker-end="url(#ah-db-schema)"/>
  <text class="ink2 sm" x="462" y="216" text-anchor="start">shop_id</text>
  <path class="ln" d="M402,280 L498,280" marker-end="url(#ah-db-schema)"/>
  <text class="ink2 sm" x="450" y="272" text-anchor="middle">guest_id</text>
  <text class="mut sm" x="450" y="296" text-anchor="middle">пусто — без карты</text>
  <text class="ink2 sm" x="20" y="326" text-anchor="start">стрелка «много → один»: по ключу строка факта находит одну строку справочника</text>
  <text class="ink2 sm" x="20" y="344" text-anchor="start">22 813 позиций на 14 510 заказов: в среднем 1.6 позиции на заказ</text>
</svg>
