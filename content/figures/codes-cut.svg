<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-codes-cut">
  <title id="t-codes-cut">Один вопрос дерева по кодам 0/1/2 и по флагу</title>
  <defs><marker id="ah-codes-cut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="20" y="22" text-anchor="start">коды вело = 0, пеший = 1, авто = 2 — одна шкала</text>
  <rect class="box" x="50" y="34" width="140" height="42" rx="6"/>
  <text class="ink sm b" x="120.0" y="51.0" text-anchor="middle">0: вело</text>
  <text class="ink2 sm" x="120.0" y="68.0" text-anchor="middle">опозданий 0.13</text>
  <rect class="box-err" x="280" y="34" width="140" height="42" rx="6"/>
  <text class="ink sm b" x="350.0" y="51.0" text-anchor="middle">1: пеший</text>
  <text class="ink2 sm" x="350.0" y="68.0" text-anchor="middle">опозданий 0.74</text>
  <rect class="box" x="510" y="34" width="140" height="42" rx="6"/>
  <text class="ink sm b" x="580.0" y="51.0" text-anchor="middle">2: авто</text>
  <text class="ink2 sm" x="580.0" y="68.0" text-anchor="middle">опозданий 0.05</text>
  <path class="ln-acc dash" d="M235.0,30 L235.0,82"/>
  <text class="acc sm" x="235.0" y="92" text-anchor="middle">порог 0.5</text>
  <text class="acc sm b" x="20" y="112" text-anchor="start">код ≤ 0.5:</text>
  <text class="ink2 sm" x="120" y="112" text-anchor="start">вело — 0.13</text>
  <text class="ink2 sm" x="360" y="112" text-anchor="start">пеший + авто — 0.34</text>
  <path class="ln-acc dash" d="M465.0,30 L465.0,82"/>
  <text class="acc sm" x="465.0" y="92" text-anchor="middle">порог 1.5</text>
  <text class="acc sm b" x="20" y="156" text-anchor="start">код ≤ 1.5:</text>
  <text class="ink2 sm" x="120" y="156" text-anchor="start">вело + пеший — 0.32</text>
  <text class="ink2 sm" x="360" y="156" text-anchor="start">авто — 0.05</text>
  <text class="ink2 sm" x="20" y="196" text-anchor="start">пешие «зажаты» посередине и всегда смешиваются с соседями: 0.74 растворяется до 0.32–0.34</text>
  <text class="ok sm b" x="20" y="226" text-anchor="start">флаг courier_пеший ≤ 0.5:</text>
  <rect class="box-err" x="200" y="210" width="200" height="30" rx="6"/>
  <text class="ink sm b" x="300.0" y="229.5" text-anchor="middle">пешие — 0.74</text>
  <rect class="box-ok" x="420" y="210" width="260" height="30" rx="6"/>
  <text class="ink sm b" x="550.0" y="229.5" text-anchor="middle">все остальные — 0.10</text>
  <text class="mut sm" x="350" y="272" text-anchor="middle">флаги дают дереву вырезать любую категорию одним вопросом; коды — только кусок шкалы слева или справа</text>
</svg>
