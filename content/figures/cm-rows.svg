<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cm-rows">
  <title id="t-cm-rows">normalize="true": каждая строка делится на свою сумму</title>
  <defs><marker id="ah-cm-rows" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="140" y="22" text-anchor="middle">лес: числа</text>
  <text class="mut sm" x="100.0" y="40" text-anchor="middle">прогноз 0</text>
  <text class="mut sm" x="180.0" y="40" text-anchor="middle">прогноз 1</text>
  <text class="mut sm" x="52" y="72.0" text-anchor="end">факт 0</text>
  <text class="mut sm" x="52" y="112.0" text-anchor="end">факт 1</text>
  <rect class="box" x="60" y="48" width="78" height="38" rx="3"/>
  <text class="ink sm b" x="99.0" y="73.0" text-anchor="middle">TN 443</text>
  <rect class="box-warn" x="140" y="48" width="78" height="38" rx="3"/>
  <text class="ink sm b" x="179.0" y="73.0" text-anchor="middle">FP 23</text>
  <rect class="box-err" x="60" y="88" width="78" height="38" rx="3"/>
  <text class="ink sm b" x="99.0" y="113.0" text-anchor="middle">FN 44</text>
  <rect class="box-acc" x="140" y="88" width="78" height="38" rx="3"/>
  <text class="ink sm b" x="179.0" y="113.0" text-anchor="middle">TP 90</text>
  <text class="ink2 sm" x="232" y="72" text-anchor="start">= 466</text>
  <text class="ink2 sm" x="232" y="112" text-anchor="start">= 134</text>
  <text class="mut sm" x="250" y="140" text-anchor="middle">суммы строк</text>
  <path class="ln" d="M300,90 L405,90" marker-end="url(#ah-cm-rows)"/>
  <text class="acc sm b" x="352" y="80" text-anchor="middle">делим</text>
  <text class="ink b" x="544" y="22" text-anchor="middle">normalize="true": доли в строке</text>
  <rect class="box" x="420" y="48" width="124" height="38" rx="3"/>
  <text class="ink sm b" x="482" y="72" text-anchor="middle">443/466 = 0.951</text>
  <rect class="box-warn" x="546" y="48" width="124" height="38" rx="3"/>
  <text class="ink sm b" x="608" y="72" text-anchor="middle">23/466 = 0.049</text>
  <rect class="box-err" x="420" y="88" width="124" height="38" rx="3"/>
  <text class="ink sm b" x="482" y="112" text-anchor="middle">44/134 = 0.328</text>
  <rect class="box-acc" x="546" y="88" width="124" height="38" rx="3"/>
  <text class="ink sm b" x="608" y="112" text-anchor="middle">90/134 = 0.672</text>
  <text class="mut sm" x="544" y="140" text-anchor="middle">каждая строка в сумме даёт 1</text>
  <rect class="box-err" x="60" y="168" width="280" height="50" rx="6"/>
  <text class="ink sm b" x="200.0" y="189.0" text-anchor="middle">FN / все гости = 44/600 ≈ 7 %</text>
  <text class="ink2 sm" x="200.0" y="206.0" text-anchor="middle">«пропускаем мало» — неверный вывод</text>
  <rect class="box-ok" x="380" y="168" width="300" height="50" rx="6"/>
  <text class="ink sm b" x="530.0" y="189.0" text-anchor="middle">FN / ушедшие = 44/134 ≈ 33 %</text>
  <text class="ink2 sm" x="530.0" y="206.0" text-anchor="middle">пропускаем треть уходящих</text>
  <text class="mut sm" x="350" y="240" text-anchor="middle">доли ошибок считают внутри своей строки: пропуски — среди ушедших, лишние бонусы — среди оставшихся</text>
</svg>
