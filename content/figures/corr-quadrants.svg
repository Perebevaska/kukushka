<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-corr-quadrants">
  <title id="t-corr-quadrants">Корреляция: произведения отклонений в четвертях относительно средних</title>
  <defs><marker id="ah-corr-quadrants" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-ok" x="210.0" y="30" width="150.0" height="110.0" rx="0"/>
  <rect class="box-ok" x="60" y="140.0" width="150.0" height="110.0" rx="0"/>
  <rect class="box-err" x="60" y="30" width="150.0" height="110.0" rx="0"/>
  <rect class="box-err" x="210.0" y="140.0" width="150.0" height="110.0" rx="0"/>
  <path class="ln" d="M60,250 L360,250"/>
  <path class="ln" d="M60,250 L60,30"/>
  <path class="ln-acc dash" d="M210.0,30 L210.0,250"/>
  <path class="ln-acc dash" d="M60,140.0 L360,140.0"/>
  <text class="acc sm b" x="210.0" y="266" text-anchor="middle">среднее 3 км</text>
  <text class="acc sm b" x="356" y="134.0" text-anchor="end">среднее 30 мин</text>
  <text class="ok sm b" x="352" y="48" text-anchor="end">(+) × (+) = +</text>
  <text class="ok sm b" x="68" y="240" text-anchor="start">(−) × (−) = +</text>
  <text class="err sm b" x="68" y="48" text-anchor="start">(−) × (+) = −</text>
  <text class="err sm b" x="352" y="240" text-anchor="end">(+) × (−) = −</text>
  <circle class="box-acc" cx="110.0" cy="213.33333333333334" r="5"/>
  <text class="ink sm b" x="119.0" y="217.33333333333334" text-anchor="start">+20</text>
  <circle class="box-acc" cx="160.0" cy="169.33333333333331" r="5"/>
  <text class="ink sm b" x="169.0" y="173.33333333333331" text-anchor="start">+4</text>
  <circle class="box-acc" cx="210.0" cy="147.33333333333331" r="5"/>
  <text class="ink sm b" x="219.0" y="151.33333333333331" text-anchor="start">0</text>
  <circle class="box-acc" cx="260.0" cy="103.33333333333334" r="5"/>
  <text class="ink sm b" x="269.0" y="107.33333333333334" text-anchor="start">+5</text>
  <circle class="box-acc" cx="310.0" cy="66.66666666666666" r="5"/>
  <text class="ink sm b" x="319.0" y="70.66666666666666" text-anchor="start">+20</text>
  <text class="mut sm" x="54" y="34" text-anchor="end">мин</text>
  <text class="mut sm" x="360" y="266" text-anchor="end">км</text>
  <text class="ink2 sm" x="400" y="52" text-anchor="start">все точки в «плюсовых» четвертях:</text>
  <text class="ink sm" x="400" y="74" text-anchor="start">сумма произведений = 20 + 4 + 0 + 5 + 20 = 49</text>
  <text class="ink sm" x="400" y="106" text-anchor="start">квадраты отклонений: км 10, мин 242</text>
  <text class="acc b" x="400" y="138" text-anchor="start">r = 49 / √(10 × 242) ≈ 0.996</text>
  <text class="ink2 sm" x="400" y="182" text-anchor="start">если бы точки были и в красных</text>
  <text class="ink2 sm" x="400" y="200" text-anchor="start">четвертях, плюсы и минусы</text>
  <text class="ink2 sm" x="400" y="218" text-anchor="start">погасили бы друг друга → r ≈ 0</text>
  <text class="mut sm" x="400" y="250" text-anchor="start">знаменатель приводит r к шкале −1…1</text>
</svg>
