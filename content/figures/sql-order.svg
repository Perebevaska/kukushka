<svg viewBox="0 0 700 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sql-order">
  <title id="t-sql-order">Порядок записи и порядок выполнения запроса</title>
  <defs><marker id="ah-sql-order" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="90" y="26" text-anchor="middle">как пишем</text>
  <text class="mut sm b" x="355" y="26" text-anchor="middle">как выполняет база</text>
  <rect class="box-acc" x="20" y="40" width="140" height="30" rx="5"/>
  <text class="ink sm b" x="90" y="60" text-anchor="middle">SELECT DISTINCT</text>
  <rect class="box" x="20" y="80" width="140" height="30" rx="5"/>
  <text class="ink sm b" x="90" y="100" text-anchor="middle">FROM … JOIN</text>
  <rect class="box" x="20" y="120" width="140" height="30" rx="5"/>
  <text class="ink sm b" x="90" y="140" text-anchor="middle">WHERE</text>
  <rect class="box" x="20" y="160" width="140" height="30" rx="5"/>
  <text class="ink sm b" x="90" y="180" text-anchor="middle">GROUP BY</text>
  <rect class="box" x="20" y="200" width="140" height="30" rx="5"/>
  <text class="ink sm b" x="90" y="220" text-anchor="middle">HAVING</text>
  <rect class="box" x="20" y="240" width="140" height="30" rx="5"/>
  <text class="ink sm b" x="90" y="260" text-anchor="middle">ORDER BY</text>
  <rect class="box" x="20" y="280" width="140" height="30" rx="5"/>
  <text class="ink sm b" x="90" y="300" text-anchor="middle">LIMIT</text>
  <rect class="box" x="270" y="40" width="170" height="30" rx="5"/>
  <text class="mut sm b" x="286" y="60" text-anchor="start">1</text>
  <text class="ink sm b" x="362" y="60" text-anchor="middle">FROM … JOIN</text>
  <text class="ink2 sm" x="452" y="60" text-anchor="start">берёт и соединяет таблицы</text>
  <rect class="box-warn" x="270" y="80" width="170" height="30" rx="5"/>
  <text class="mut sm b" x="286" y="100" text-anchor="start">2</text>
  <text class="ink sm b" x="362" y="100" text-anchor="middle">WHERE</text>
  <text class="warn sm" x="452" y="100" text-anchor="start">отбирает строки: сумм и окон нет</text>
  <rect class="box" x="270" y="120" width="170" height="30" rx="5"/>
  <text class="mut sm b" x="286" y="140" text-anchor="start">3</text>
  <text class="ink sm b" x="362" y="140" text-anchor="middle">GROUP BY</text>
  <text class="ink2 sm" x="452" y="140" text-anchor="start">сворачивает строки в группы</text>
  <rect class="box" x="270" y="160" width="170" height="30" rx="5"/>
  <text class="mut sm b" x="286" y="180" text-anchor="start">4</text>
  <text class="ink sm b" x="362" y="180" text-anchor="middle">HAVING</text>
  <text class="ink2 sm" x="452" y="180" text-anchor="start">отбирает группы по агрегатам</text>
  <rect class="box-acc" x="270" y="200" width="170" height="30" rx="5"/>
  <text class="mut sm b" x="286" y="220" text-anchor="start">5</text>
  <text class="ink sm b" x="362" y="220" text-anchor="middle">SELECT + окна</text>
  <text class="acc sm" x="452" y="220" text-anchor="start">выражения, псевдонимы, окна (rn)</text>
  <rect class="box-acc" x="270" y="240" width="170" height="30" rx="5"/>
  <text class="mut sm b" x="286" y="260" text-anchor="start">6</text>
  <text class="ink sm b" x="362" y="260" text-anchor="middle">DISTINCT</text>
  <text class="ink2 sm" x="452" y="260" text-anchor="start">убирает повторы</text>
  <rect class="box" x="270" y="280" width="170" height="30" rx="5"/>
  <text class="mut sm b" x="286" y="300" text-anchor="start">7</text>
  <text class="ink sm b" x="362" y="300" text-anchor="middle">ORDER BY</text>
  <text class="ink2 sm" x="452" y="300" text-anchor="start">уже видит псевдонимы из SELECT</text>
  <rect class="box" x="270" y="320" width="170" height="30" rx="5"/>
  <text class="mut sm b" x="286" y="340" text-anchor="start">8</text>
  <text class="ink sm b" x="362" y="340" text-anchor="middle">LIMIT</text>
  <text class="ink2 sm" x="452" y="340" text-anchor="start">оставляет первые N строк</text>
  <path class="ln-mut" d="M160,95.0 C215,95.0 215,55.0 266,55.0" marker-end="url(#ah-sql-order)"/>
  <path class="ln-mut" d="M160,135.0 C215,135.0 215,95.0 266,95.0" marker-end="url(#ah-sql-order)"/>
  <path class="ln-mut" d="M160,175.0 C215,175.0 215,135.0 266,135.0" marker-end="url(#ah-sql-order)"/>
  <path class="ln-mut" d="M160,215.0 C215,215.0 215,175.0 266,175.0" marker-end="url(#ah-sql-order)"/>
  <path class="ln-mut" d="M160,255.0 C215,255.0 215,295.0 266,295.0" marker-end="url(#ah-sql-order)"/>
  <path class="ln-mut" d="M160,295.0 C215,295.0 215,335.0 266,335.0" marker-end="url(#ah-sql-order)"/>
  <path class="ln-acc" d="M160,55.0 C235,55.0 205,215.0 266,215.0" marker-end="url(#ah-sql-order)"/>
  <path class="ln-acc" d="M160,55.0 C235,55.0 205,255.0 266,255.0" marker-end="url(#ah-sql-order)"/>
  <text class="ink2 sm" x="350" y="366" text-anchor="middle">SELECT пишут первым, а выполняется он пятым: WHERE не видит ни rn, ни SUM</text>
</svg>
