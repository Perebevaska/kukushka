<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-mlp-arch">
  <title id="t-nn-mlp-arch">MLPClassifier(hidden_layer_sizes=(64, 32)): какие слои задаёте вы, а какие sklearn</title>
  <defs><marker id="ah-nn-mlp-arch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="86" width="132" height="56" rx="10"/>
  <text class="ink sm b" x="80" y="110" text-anchor="middle">вход: 15</text>
  <text class="ink2 sm" x="80" y="129" text-anchor="middle">признаков</text>
  <rect class="box-acc" x="184" y="86" width="132" height="56" rx="10"/>
  <text class="ink sm b" x="250" y="110" text-anchor="middle">64 нейрона</text>
  <text class="ink2 sm" x="250" y="129" text-anchor="middle">ReLU</text>
  <path class="ln" d="M148,114 L182,114" marker-end="url(#ah-nn-mlp-arch)"/>
  <rect class="box-acc" x="354" y="86" width="132" height="56" rx="10"/>
  <text class="ink sm b" x="420" y="110" text-anchor="middle">32 нейрона</text>
  <text class="ink2 sm" x="420" y="129" text-anchor="middle">ReLU</text>
  <path class="ln" d="M318,114 L352,114" marker-end="url(#ah-nn-mlp-arch)"/>
  <rect class="box-ok" x="534" y="86" width="132" height="56" rx="10"/>
  <text class="ink sm b" x="600" y="110" text-anchor="middle">выход: 1</text>
  <text class="ink2 sm" x="600" y="129" text-anchor="middle">сигмоида → p</text>
  <path class="ln" d="M488,114 L532,114" marker-end="url(#ah-nn-mlp-arch)"/>
  <path class="ln-acc" d="M184,72 L184,62 L486,62 L486,72"/>
  <text class="acc sm b" x="335" y="50" text-anchor="middle">задаёте вы: hidden_layer_sizes=(64, 32)</text>
  <path class="ln" d="M14,156 L14,166 L146,166 L146,156"/>
  <text class="ink2 sm" x="80" y="184" text-anchor="middle">sklearn: по числу</text>
  <text class="ink2 sm" x="80" y="200" text-anchor="middle">столбцов X</text>
  <path class="ln" d="M534,156 L534,166 L666,166 L666,156"/>
  <text class="ink2 sm" x="600" y="184" text-anchor="middle">sklearn: по y</text>
  <text class="ink2 sm" x="600" y="200" text-anchor="middle">2 класса → 1 выход</text>
  <text class="ink2 sm" x="600" y="216" text-anchor="middle">10 классов → 10, softmax</text>
  <text class="mut sm" x="335" y="244" text-anchor="middle">параметров: 15·64 + 64 + 64·32 + 32 + 32·1 + 1 = 3 137</text>
</svg>
