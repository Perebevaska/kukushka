<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-promise-denoms">
  <title id="t-promise-denoms">Какой знаменатель у каждой метрики проекта</title>
  <defs><marker id="ah-promise-denoms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="120" y="22" text-anchor="middle">сессии</text>
  <rect class="box" x="20" y="32" width="200" height="34" rx="6"/>
  <text class="ink sm b" x="120.0" y="53.5" text-anchor="middle">A: 3 924</text>
  <rect class="box" x="20" y="74" width="200" height="34" rx="6"/>
  <text class="ink sm b" x="120.0" y="95.5" text-anchor="middle">B: 3 971</text>
  <path class="ln" d="M222,70 L248,70" marker-end="url(#ah-promise-denoms)"/>
  <text class="ink2 sm b" x="350" y="22" text-anchor="middle">заказы (ordered = 1)</text>
  <rect class="box-acc" x="250" y="32" width="200" height="34" rx="6"/>
  <text class="ink sm b" x="350.0" y="53.5" text-anchor="middle">A: 1 365</text>
  <rect class="box-acc" x="250" y="74" width="200" height="34" rx="6"/>
  <text class="ink sm b" x="350.0" y="95.5" text-anchor="middle">B: 1 301</text>
  <path class="ln" d="M452,70 L478,70" marker-end="url(#ah-promise-denoms)"/>
  <text class="ink2 sm b" x="580" y="22" text-anchor="middle">опоздали (late = 1)</text>
  <rect class="box-err" x="480" y="32" width="200" height="34" rx="6"/>
  <text class="ink sm b" x="580.0" y="53.5" text-anchor="middle">A: 362</text>
  <rect class="box-err" x="480" y="74" width="200" height="34" rx="6"/>
  <text class="ink sm b" x="580.0" y="95.5" text-anchor="middle">B: 175</text>
  <text class="mut sm b" x="300" y="140" text-anchor="middle">метрика</text>
  <text class="mut sm b" x="560" y="140" text-anchor="middle">A</text>
  <text class="mut sm b" x="630" y="140" text-anchor="middle">B</text>
  <rect class="box" x="20" y="150" width="660" height="28" rx="3"/>
  <text class="ink sm" x="30" y="169" text-anchor="start">защитная: конверсия = заказы / сессии</text>
  <text class="ink sm b" x="560" y="169" text-anchor="middle">34.8 %</text>
  <text class="ink sm b" x="630" y="169" text-anchor="middle">32.8 %</text>
  <rect class="box-acc" x="20" y="184" width="660" height="28" rx="3"/>
  <text class="ink sm" x="30" y="203" text-anchor="start">главная: доля опозданий = опоздали / заказы</text>
  <text class="ink sm b" x="560" y="203" text-anchor="middle">26.5 %</text>
  <text class="ink sm b" x="630" y="203" text-anchor="middle">13.5 %</text>
  <rect class="box" x="20" y="218" width="660" height="28" rx="3"/>
  <text class="ink sm" x="30" y="237" text-anchor="start">защитная: выручка на сессию = сумма amount / сессии</text>
  <text class="ink sm b" x="560" y="237" text-anchor="middle">206 ₽</text>
  <text class="ink sm b" x="630" y="237" text-anchor="middle">193 ₽</text>
  <text class="ink2 sm" x="350" y="268" text-anchor="middle">опоздание бывает только у заказа: делить опоздания на сессии — частая ошибка проекта</text>
</svg>
