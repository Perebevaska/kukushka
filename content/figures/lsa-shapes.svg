<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-lsa-shapes">
  <title id="t-lsa-shapes">LSA: TruncatedSVD сжимает разреженную TF-IDF до 50 плотных столбцов — векторы отзывов и векторы слов</title>
  <defs><marker id="ah-lsa-shapes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20" y="40" width="150" height="160" rx="4"/>
  <rect class="box-acc" x="28" y="48" width="14" height="10" rx="1"/>
  <rect class="box-acc" x="128" y="63" width="14" height="10" rx="1"/>
  <rect class="box-acc" x="108" y="93" width="14" height="10" rx="1"/>
  <rect class="box-acc" x="88" y="123" width="14" height="10" rx="1"/>
  <rect class="box-acc" x="68" y="153" width="14" height="10" rx="1"/>
  <rect class="box-acc" x="48" y="183" width="14" height="10" rx="1"/>
  <text class="ink sm b" x="95" y="30" text-anchor="middle">X: 2400 × 485</text>
  <text class="mut sm" x="95" y="218" text-anchor="middle">TF-IDF, почти все нули</text>
  <path class="ln" d="M176,120 L236,120" marker-end="url(#ah-lsa-shapes)"/>
  <text class="acc sm b" x="206" y="110" text-anchor="middle">SVD</text>
  <rect class="box-acc" x="242" y="40" width="70" height="160" rx="4"/>
  <text class="ink sm b" x="277" y="30" text-anchor="middle">Z: 2400 × 50</text>
  <text class="ink sm" x="277" y="124" text-anchor="middle">плотная</text>
  <text class="ok sm b" x="277" y="218" text-anchor="middle">вектор отзыва</text>
  <text class="ink b" x="330" y="124" text-anchor="middle">×</text>
  <rect class="box-warn" x="350" y="92" width="200" height="60" rx="4"/>
  <text class="ink sm b" x="450" y="82" text-anchor="middle">components_: 50 × 485</text>
  <text class="ink sm" x="450" y="127" text-anchor="middle">50 «тем» — веса по словам</text>
  <text class="ok sm b" x="450" y="170" text-anchor="middle">.T → у каждого слова 50 чисел</text>
  <text class="ok sm b" x="450" y="188" text-anchor="middle">= вектор слова</text>
  <text class="ink b" x="620" y="110" text-anchor="middle">≈ X</text>
  <text class="mut sm" x="620" y="132" text-anchor="middle">сохранено</text>
  <text class="mut sm" x="620" y="150" text-anchor="middle">≈ 71 % дисперсии</text>
</svg>
