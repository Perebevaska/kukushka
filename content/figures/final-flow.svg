<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-final-flow">
  <title id="t-final-flow">Финал: перебор на train, тест один раз, сохранение</title>
  <defs><marker id="ah-final-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="40" width="124" height="50" rx="6"/>
  <text class="ink sm b" x="76.0" y="61.0" text-anchor="middle">X_train</text>
  <text class="ink2 sm" x="76.0" y="78.0" text-anchor="middle">y_train</text>
  <path class="ln" d="M139,65 L151,65" marker-end="url(#ah-final-flow)"/>
  <rect class="box-acc" x="152" y="40" width="124" height="50" rx="6"/>
  <text class="ink sm b" x="214.0" y="61.0" text-anchor="middle">GridSearchCV</text>
  <text class="ink2 sm" x="214.0" y="78.0" text-anchor="middle">CV по фолдам</text>
  <path class="ln" d="M277,65 L289,65" marker-end="url(#ah-final-flow)"/>
  <rect class="box-acc" x="290" y="40" width="124" height="50" rx="6"/>
  <text class="ink sm b" x="352.0" y="61.0" text-anchor="middle">best_estimator_</text>
  <text class="ink2 sm" x="352.0" y="78.0" text-anchor="middle">refit на всём train</text>
  <path class="ln" d="M415,65 L427,65" marker-end="url(#ah-final-flow)"/>
  <rect class="box-warn" x="428" y="40" width="124" height="50" rx="6"/>
  <text class="ink sm b" x="490.0" y="61.0" text-anchor="middle">тест — один раз</text>
  <text class="ink2 sm" x="490.0" y="78.0" text-anchor="middle">F1, AUC в отчёт</text>
  <path class="ln" d="M553,65 L565,65" marker-end="url(#ah-final-flow)"/>
  <rect class="box-ok" x="566" y="40" width="124" height="50" rx="6"/>
  <text class="ink sm b" x="628.0" y="61.0" text-anchor="middle">joblib.dump</text>
  <text class="ink2 sm" x="628.0" y="78.0" text-anchor="middle">файл модели</text>
  <path class="ln-err dash" d="M490,92 C490,150 214,150 214,94" marker-end="url(#ah-final-flow)"/>
  <text class="err sm b" x="352" y="160" text-anchor="middle">✗ посмотрели тест и вернулись «подправить сетку» —</text>
  <text class="err sm" x="352" y="178" text-anchor="middle">тест стал валидацией, его оценка больше не честная</text>
  <text class="mut sm" x="350" y="214" text-anchor="middle">best_score_ — лучший из многих вариантов на тех же фолдах, оценка оптимистичная; в отчёт идёт тест</text>
</svg>
