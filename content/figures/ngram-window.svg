<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ngram-window">
  <title id="t-ngram-window">ngram_range=(1, 2): окно из одного и из двух соседних слов</title>
  <defs><marker id="ah-ngram-window" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="14" y="46" text-anchor="start">отзыв</text>
  <rect class="box-warn" x="180" y="26" width="100" height="30" rx="4"/>
  <text class="ink b" x="230.0" y="46" text-anchor="middle">больше</text>
  <rect class="box-warn" x="300" y="26" width="100" height="30" rx="4"/>
  <text class="ink b" x="350.0" y="46" text-anchor="middle">не</text>
  <rect class="box-warn" x="420" y="26" width="100" height="30" rx="4"/>
  <text class="ink b" x="470.0" y="46" text-anchor="middle">приду</text>
  <text class="ink sm b" x="14" y="96" text-anchor="start">униграммы</text>
  <text class="ink2 sm" x="14" y="112" text-anchor="start">по одному слову</text>
  <rect class="box" x="180" y="82" width="100" height="28" rx="4"/>
  <text class="ink sm" x="230.0" y="101" text-anchor="middle">больше</text>
  <rect class="box" x="300" y="82" width="100" height="28" rx="4"/>
  <text class="ink sm" x="350.0" y="101" text-anchor="middle">не</text>
  <rect class="box" x="420" y="82" width="100" height="28" rx="4"/>
  <text class="ink sm" x="470.0" y="101" text-anchor="middle">приду</text>
  <text class="ink sm b" x="14" y="156" text-anchor="start">биграммы</text>
  <text class="ink2 sm" x="14" y="172" text-anchor="start">пары соседей</text>
  <rect class="box-acc" x="186" y="140" width="208" height="28" rx="4"/>
  <text class="ink sm b" x="290.0" y="159" text-anchor="middle">больше не</text>
  <rect class="box-ok" x="306" y="176" width="208" height="28" rx="4"/>
  <text class="ink sm b" x="410.0" y="195" text-anchor="middle">не приду</text>
  <text class="ink sm b" x="560" y="100" text-anchor="start">признаков: 5</text>
  <text class="ink2 sm" x="560" y="120" text-anchor="start">3 слова + 2 пары</text>
  <text class="ok sm b" x="560" y="194" text-anchor="start">«не приду» — свой</text>
  <text class="ok sm" x="560" y="210" text-anchor="start">признак с отрицанием</text>
</svg>
