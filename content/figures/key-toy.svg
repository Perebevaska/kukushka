<svg viewBox="0 0 700 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-key-toy">
  <title id="t-key-toy">Игрушка проекта: другие признаки и веса, те же прогнозы</title>
  <defs><marker id="ah-key-toy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="64.0" y="38" text-anchor="middle">открытые X</text>
  <rect class="box" x="20" y="46" width="88" height="26" rx="3"/>
  <text class="ink2 sm b" x="42.0" y="63.5" text-anchor="middle">x₁</text>
  <text class="ink2 sm b" x="86.0" y="63.5" text-anchor="middle">x₂</text>
  <rect class="box-acc" x="20" y="74" width="88" height="26" rx="3"/>
  <text class="ink sm" x="42.0" y="91.5" text-anchor="middle">1</text>
  <text class="ink sm" x="86.0" y="91.5" text-anchor="middle">2</text>
  <rect class="box-acc" x="20" y="102" width="88" height="26" rx="3"/>
  <text class="ink sm" x="42.0" y="119.5" text-anchor="middle">2</text>
  <text class="ink sm" x="86.0" y="119.5" text-anchor="middle">1</text>
  <rect class="box-acc" x="20" y="130" width="88" height="26" rx="3"/>
  <text class="ink sm" x="42.0" y="147.5" text-anchor="middle">3</text>
  <text class="ink sm" x="86.0" y="147.5" text-anchor="middle">4</text>
  <rect class="box-acc" x="20" y="158" width="88" height="26" rx="3"/>
  <text class="ink sm" x="42.0" y="175.5" text-anchor="middle">4</text>
  <text class="ink sm" x="86.0" y="175.5" text-anchor="middle">3</text>
  <path class="ln-acc" d="M116,120 L176,120" marker-end="url(#ah-key-toy)"/>
  <text class="acc sm b" x="146" y="110" text-anchor="middle">@ P</text>
  <text class="ink sm b" x="224.0" y="38" text-anchor="middle">спрятанные X @ P</text>
  <rect class="box" x="180" y="46" width="88" height="26" rx="3"/>
  <text class="ink2 sm b" x="202.0" y="63.5" text-anchor="middle">f₁</text>
  <text class="ink2 sm b" x="246.0" y="63.5" text-anchor="middle">f₂</text>
  <rect class="box-warn" x="180" y="74" width="88" height="26" rx="3"/>
  <text class="ink sm" x="202.0" y="91.5" text-anchor="middle">1</text>
  <text class="ink sm" x="246.0" y="91.5" text-anchor="middle">3</text>
  <rect class="box-warn" x="180" y="102" width="88" height="26" rx="3"/>
  <text class="ink sm" x="202.0" y="119.5" text-anchor="middle">2</text>
  <text class="ink sm" x="246.0" y="119.5" text-anchor="middle">3</text>
  <rect class="box-warn" x="180" y="130" width="88" height="26" rx="3"/>
  <text class="ink sm" x="202.0" y="147.5" text-anchor="middle">3</text>
  <text class="ink sm" x="246.0" y="147.5" text-anchor="middle">7</text>
  <rect class="box-warn" x="180" y="158" width="88" height="26" rx="3"/>
  <text class="ink sm" x="202.0" y="175.5" text-anchor="middle">4</text>
  <text class="ink sm" x="246.0" y="175.5" text-anchor="middle">7</text>
  <text class="mut sm" x="146" y="196" text-anchor="middle">P = [[1, 1], [0, 1]]</text>
  <text class="mut sm" x="146" y="214" text-anchor="middle">f₁ = x₁, f₂ = x₁ + x₂</text>
  <text class="ink sm b" x="300" y="46" text-anchor="start">веса на X:  w = [1, 2]</text>
  <text class="ink sm b" x="300" y="68" text-anchor="start">веса на X @ P:  w′ = P⁻¹ · w = [−1, 2]</text>
  <text class="ink2 sm" x="300" y="98" text-anchor="start">прогноз первой строки:</text>
  <text class="ink sm" x="300" y="118" text-anchor="start">1 · 1 + 2 · 2 = 5</text>
  <text class="ink sm" x="300" y="138" text-anchor="start">1 · (−1) + 3 · 2 = 5</text>
  <text class="ink2 sm" x="300" y="168" text-anchor="start">все четыре прогноза:</text>
  <text class="ok sm b" x="300" y="188" text-anchor="start">[5, 4, 11, 10] и [5, 4, 11, 10] — совпадают</text>
  <text class="mut sm" x="300" y="222" text-anchor="start">у первого признака даже знак веса сменился:</text>
  <text class="mut sm" x="300" y="240" text-anchor="start">по весам подрядчик тоже ничего не узнает</text>
</svg>
