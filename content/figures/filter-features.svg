<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-filter-features">
  <title id="t-filter-features">Признаки из фильтров: 4 фильтра → модуль отклика → пулинг 4 × 4 → 256 чисел на кадр → логистическая регрессия</title>
  <defs><marker id="ah-filter-features" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="40" width="120" height="60" rx="6"/>
  <text class="ink sm b" x="74.0" y="65.5" text-anchor="middle">кадр</text>
  <text class="ink2 sm" x="74.0" y="83.5" text-anchor="middle">32 × 32</text>
  <path class="ln" d="M136,70 L148,70" marker-end="url(#ah-filter-features)"/>
  <rect class="box-acc" x="150" y="40" width="120" height="60" rx="6"/>
  <text class="ink sm b" x="210.0" y="65.5" text-anchor="middle">4 фильтра</text>
  <text class="ink2 sm" x="210.0" y="83.5" text-anchor="middle">4 карты 32 × 32</text>
  <path class="ln" d="M272,70 L284,70" marker-end="url(#ah-filter-features)"/>
  <rect class="box" x="286" y="40" width="120" height="60" rx="6"/>
  <text class="ink sm b" x="346.0" y="65.5" text-anchor="middle">|отклик|</text>
  <text class="ink2 sm" x="346.0" y="83.5" text-anchor="middle">знак края не важен</text>
  <path class="ln" d="M408,70 L420,70" marker-end="url(#ah-filter-features)"/>
  <rect class="box-acc" x="422" y="40" width="120" height="60" rx="6"/>
  <text class="ink sm b" x="482.0" y="65.5" text-anchor="middle">пулинг 4 × 4</text>
  <text class="ink2 sm" x="482.0" y="83.5" text-anchor="middle">4 × 8 × 8</text>
  <path class="ln" d="M544,70 L556,70" marker-end="url(#ah-filter-features)"/>
  <rect class="box" x="558" y="40" width="120" height="60" rx="6"/>
  <text class="ink sm b" x="618.0" y="65.5" text-anchor="middle">в строку</text>
  <text class="ink2 sm" x="618.0" y="83.5" text-anchor="middle">256 признаков</text>
  <text class="ink2 sm b" x="350" y="130" text-anchor="middle">та же логистическая регрессия:</text>
  <rect class="box-err" x="150" y="144" width="180" height="46" rx="5"/>
  <text class="ink sm" x="240" y="164" text-anchor="middle">на 1024 пикселях</text>
  <text class="ink b" x="240" y="182" text-anchor="middle">доля верных ≈ 0.68</text>
  <rect class="box-ok" x="370" y="144" width="180" height="46" rx="5"/>
  <text class="ink sm" x="460" y="164" text-anchor="middle">на 256 признаках</text>
  <text class="ink b" x="460" y="182" text-anchor="middle">доля верных ≈ 0.88</text>
  <text class="mut sm" x="350" y="222" text-anchor="middle">Собель x, Собель y, лапласиан, «минус размытие»: «тёмное пятно с краями в этой четверти кадра»</text>
</svg>
