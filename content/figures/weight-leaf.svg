<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-weight-leaf">
  <title id="t-weight-leaf">Один лист, девять гостей: без весов и с весами balanced</title>
  <defs><marker id="ah-weight-leaf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="180" y="22" text-anchor="middle">без весов: каждый гость = 1</text>
  <circle class="mut" cx="60.0" cy="48.0" r="9"/>
  <circle class="mut" cx="90.0" cy="48.0" r="9"/>
  <circle class="mut" cx="120.0" cy="48.0" r="9"/>
  <circle class="mut" cx="150.0" cy="48.0" r="9"/>
  <circle class="mut" cx="180.0" cy="48.0" r="9"/>
  <circle class="mut" cx="210.0" cy="48.0" r="9"/>
  <circle class="err" cx="240.0" cy="48.0" r="9"/>
  <circle class="err" cx="270.0" cy="48.0" r="9"/>
  <circle class="err" cx="300.0" cy="48.0" r="9"/>
  <rect class="box" x="30" y="76" width="200.0" height="30" rx="3"/>
  <rect class="box-err" x="230.0" y="76" width="100.0" height="30" rx="3"/>
  <text class="ink sm b" x="130.0" y="96" text-anchor="middle">6 оставшихся</text>
  <text class="ink sm b" x="280.0" y="96" text-anchor="middle">3 ушедших</text>
  <text class="ink2 sm" x="180" y="134" text-anchor="middle">доля ухода в листе: 3 / 9 = 0.33</text>
  <rect class="box" x="80" y="148" width="200" height="34" rx="6"/>
  <text class="ink sm b" x="180.0" y="169.5" text-anchor="middle">ответ листа: «останется»</text>
  <text class="ink b" x="525" y="22" text-anchor="middle">balanced: остался = 0.64, ушёл = 2.24</text>
  <circle class="mut" cx="405.0" cy="48.0" r="9"/>
  <circle class="mut" cx="435.0" cy="48.0" r="9"/>
  <circle class="mut" cx="465.0" cy="48.0" r="9"/>
  <circle class="mut" cx="495.0" cy="48.0" r="9"/>
  <circle class="mut" cx="525.0" cy="48.0" r="9"/>
  <circle class="mut" cx="555.0" cy="48.0" r="9"/>
  <circle class="err" cx="585.0" cy="48.0" r="9"/>
  <circle class="err" cx="615.0" cy="48.0" r="9"/>
  <circle class="err" cx="645.0" cy="48.0" r="9"/>
  <rect class="box" x="375" y="76" width="109.1" height="30" rx="3"/>
  <rect class="box-err" x="484.1" y="76" width="190.9" height="30" rx="3"/>
  <text class="ink sm b" x="429.5" y="96" text-anchor="middle">6 × 0.64 = 3.84</text>
  <text class="ink sm b" x="579.5" y="96" text-anchor="middle">3 × 2.24 = 6.72</text>
  <text class="ink2 sm" x="525" y="134" text-anchor="middle">доля ухода в листе: 6.72 / 10.56 = 0.64</text>
  <rect class="box-err" x="425" y="148" width="200" height="34" rx="6"/>
  <text class="ink sm b" x="525.0" y="169.5" text-anchor="middle">ответ листа: «уйдёт»</text>
  <text class="mut sm" x="350" y="214" text-anchor="middle">серые — остались, красные — ушли; гости в листе те же, меняется только их вес</text>
</svg>
