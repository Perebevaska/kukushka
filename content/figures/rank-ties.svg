<svg viewBox="0 0 700 318" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-rank-ties">
  <title id="t-rank-ties">ROW_NUMBER, RANK и DENSE_RANK на ничьей</title>
  <defs><marker id="ah-rank-ties" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="186" y="116" text-anchor="end">заказов</text>
  <rect class="box-acc" x="210" y="30" width="90" height="90" rx="4"/>
  <text class="ink b" x="255.0" y="48" text-anchor="middle">5</text>
  <text class="ink sm b" x="255.0" y="138" text-anchor="middle">латте</text>
  <rect class="box-warn" x="320" y="48" width="90" height="72" rx="4"/>
  <text class="ink b" x="365.0" y="66" text-anchor="middle">4</text>
  <text class="ink sm b" x="365.0" y="138" text-anchor="middle">капучино</text>
  <rect class="box-warn" x="430" y="48" width="90" height="72" rx="4"/>
  <text class="ink b" x="475.0" y="66" text-anchor="middle">4</text>
  <text class="ink sm b" x="475.0" y="138" text-anchor="middle">раф</text>
  <rect class="box-acc" x="540" y="84" width="90" height="36" rx="4"/>
  <text class="ink b" x="585.0" y="102" text-anchor="middle">2</text>
  <text class="ink sm b" x="585.0" y="138" text-anchor="middle">чай</text>
  <path class="ln-mut" d="M200,120 H640"/>
  <text class="ink b" x="186" y="162" text-anchor="end">ROW_NUMBER</text>
  <text class="mut sm" x="186" y="178" text-anchor="end">rank(method="first")</text>
  <rect class="box" x="230" y="146" width="50" height="28" rx="4"/>
  <text class="ink b" x="255.0" y="165" text-anchor="middle">1</text>
  <rect class="box-err" x="340" y="146" width="50" height="28" rx="4"/>
  <text class="ink b" x="365.0" y="165" text-anchor="middle">2</text>
  <rect class="box-err" x="450" y="146" width="50" height="28" rx="4"/>
  <text class="ink b" x="475.0" y="165" text-anchor="middle">3</text>
  <rect class="box" x="560" y="146" width="50" height="28" rx="4"/>
  <text class="ink b" x="585.0" y="165" text-anchor="middle">4</text>
  <text class="ink b" x="186" y="206" text-anchor="end">RANK</text>
  <text class="mut sm" x="186" y="222" text-anchor="end">rank(method="min")</text>
  <rect class="box" x="230" y="190" width="50" height="28" rx="4"/>
  <text class="ink b" x="255.0" y="209" text-anchor="middle">1</text>
  <rect class="box-warn" x="340" y="190" width="50" height="28" rx="4"/>
  <text class="ink b" x="365.0" y="209" text-anchor="middle">2</text>
  <rect class="box-warn" x="450" y="190" width="50" height="28" rx="4"/>
  <text class="ink b" x="475.0" y="209" text-anchor="middle">2</text>
  <rect class="box" x="560" y="190" width="50" height="28" rx="4"/>
  <text class="acc b" x="585.0" y="209" text-anchor="middle">4</text>
  <text class="ink b" x="186" y="250" text-anchor="end">DENSE_RANK</text>
  <text class="mut sm" x="186" y="266" text-anchor="end">rank(method="dense")</text>
  <rect class="box" x="230" y="234" width="50" height="28" rx="4"/>
  <text class="ink b" x="255.0" y="253" text-anchor="middle">1</text>
  <rect class="box-warn" x="340" y="234" width="50" height="28" rx="4"/>
  <text class="ink b" x="365.0" y="253" text-anchor="middle">2</text>
  <rect class="box-warn" x="450" y="234" width="50" height="28" rx="4"/>
  <text class="ink b" x="475.0" y="253" text-anchor="middle">2</text>
  <rect class="box" x="560" y="234" width="50" height="28" rx="4"/>
  <text class="acc b" x="585.0" y="253" text-anchor="middle">3</text>
  <rect class="box-err" x="20" y="280" width="14" height="14" rx="2"/>
  <text class="ink2 sm" x="40" y="292" text-anchor="start">разные номера равным: кто 2-й, решает второй ключ или случай</text>
  <rect class="box-warn" x="20" y="300" width="14" height="14" rx="2"/>
  <text class="ink2 sm" x="40" y="312" text-anchor="start">равным одно место; у чая RANK = 4 (место 3 пропущено), DENSE_RANK = 3</text>
</svg>
