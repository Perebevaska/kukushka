<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-key-roundtrip">
  <title id="t-key-roundtrip">Обратимый ключ: туда и обратно без потерь; необратимый теряет информацию</title>
  <defs><marker id="ah-key-roundtrip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="14" y="40" width="130" height="50" rx="6"/>
  <text class="ink b" x="79.0" y="61.0" text-anchor="middle">X</text>
  <text class="mut sm" x="79.0" y="78.0" text-anchor="middle">исходные признаки</text>
  <path class="ln-acc" d="M142,65 L228,65" marker-end="url(#ah-key-roundtrip)"/>
  <text class="acc sm b" x="185" y="56" text-anchor="middle">@ P</text>
  <rect class="box-warn" x="232" y="40" width="140" height="50" rx="6"/>
  <text class="ink b" x="302.0" y="61.0" text-anchor="middle">X @ P</text>
  <text class="mut sm" x="302.0" y="78.0" text-anchor="middle">смеси: не читаются</text>
  <path class="ln-acc" d="M374,65 L460,65" marker-end="url(#ah-key-roundtrip)"/>
  <text class="acc sm b" x="417" y="56" text-anchor="middle">@ P⁻¹</text>
  <rect class="box-ok" x="464" y="40" width="120" height="50" rx="6"/>
  <text class="ink b" x="524.0" y="61.0" text-anchor="middle">X</text>
  <text class="ok sm" x="524.0" y="78.0" text-anchor="middle">восстановлен</text>
  <text class="mut sm" x="640" y="60" text-anchor="middle">(XP)P⁻¹</text>
  <text class="mut sm" x="640" y="78" text-anchor="middle">= X·I = X</text>
  <text class="ink sm b" x="350" y="128" text-anchor="middle">линейная регрессия: тот же прогноз, другие веса</text>
  <rect class="box" x="60" y="142" width="250" height="40" rx="6"/>
  <text class="ink sm b" x="185.0" y="166.5" text-anchor="middle">X · w</text>
  <text class="ink b" x="350" y="167" text-anchor="middle">=</text>
  <rect class="box" x="390" y="142" width="250" height="40" rx="6"/>
  <text class="ink sm b" x="515.0" y="166.5" text-anchor="middle">(X @ P) · w′,   где w′ = P⁻¹ · w</text>
  <path class="ln-mut" d="M20,204 L680,204"/>
  <rect class="box-acc" x="20" y="218" width="120" height="44" rx="6"/>
  <text class="ink sm b" x="80.0" y="244.5" text-anchor="middle">X (n × 3)</text>
  <path class="ln-err" d="M142,240 L228,240" marker-end="url(#ah-key-roundtrip)"/>
  <text class="err sm b" x="185" y="232" text-anchor="middle">@ P (3 × 2)</text>
  <rect class="box-err" x="232" y="218" width="140" height="44" rx="6"/>
  <text class="ink sm b" x="302.0" y="244.5" text-anchor="middle">n × 2</text>
  <path class="ln-mut" d="M374,240 L460,240" marker-end="url(#ah-key-roundtrip)"/>
  <text class="err sm b" x="417" y="232" text-anchor="middle">P⁻¹ нет</text>
  <rect class="box-err" x="464" y="218" width="120" height="44" rx="6"/>
  <text class="ink sm" x="524.0" y="236.0" text-anchor="middle">3-й признак</text>
  <text class="err sm b" x="524.0" y="253.0" text-anchor="middle">потерян</text>
  <text class="mut sm" x="350" y="288" text-anchor="middle">необратимая P (выкинутый столбец, повторяющиеся смеси) стирает часть информации — и качество может упасть</text>
</svg>
