<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-adam-first">
  <title id="t-adam-first">Первый шаг: обычный спуск двигает веса пропорционально градиенту, Adam — на η</title>
  <defs><marker id="ah-adam-first" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="350" y="26" text-anchor="middle">градиент g = (−32, −82), шаг η = 0.1</text>
  <text class="ink sm b" x="180" y="80" text-anchor="end">свободный член</text>
  <text class="mut sm" x="180" y="96" text-anchor="end">g = −32</text>
  <rect class="box-err" x="190" y="60" width="128.5" height="22" rx="3"/>
  <text class="err sm b" x="326.0" y="76" text-anchor="start">обычный: η·|g| = 3.2</text>
  <rect class="box-ok" x="190" y="88" width="3.99999999875" height="22" rx="3"/>
  <text class="ok sm b" x="202" y="104" text-anchor="start">Adam: η · m̂/√ŝ = 0.1 · (−32) / 32, сдвиг 0.1</text>
  <text class="ink sm b" x="180" y="170" text-anchor="end">вес км</text>
  <text class="mut sm" x="180" y="186" text-anchor="end">g = −82</text>
  <rect class="box-err" x="190" y="150" width="328.50000000000006" height="22" rx="3"/>
  <text class="err sm b" x="526.0" y="166" text-anchor="start">обычный: η·|g| = 8.2</text>
  <rect class="box-ok" x="190" y="178" width="3.999999999512196" height="22" rx="3"/>
  <text class="ok sm b" x="202" y="194" text-anchor="start">Adam: η · m̂/√ŝ = 0.1 · (−82) / 82, сдвиг 0.1</text>
  <text class="ink2 sm" x="350" y="236" text-anchor="middle">Adam делит градиент на его же типичный размер: от градиента остаётся только знак-направление,</text>
  <text class="mut sm" x="350" y="256" text-anchor="middle">поэтому огромный градиент «рублёвого» признака не разносит его вес</text>
</svg>
