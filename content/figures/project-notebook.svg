<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-project-notebook">
  <title id="t-project-notebook">Блокнот-отчёт проекта: разделы сверху вниз и самопроверка</title>
  <defs><marker id="ah-project-notebook" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20" y="14" width="470" height="38" rx="5"/>
  <text class="ink b" x="36" y="38" text-anchor="start">Цель</text>
  <text class="ink2 sm" x="474" y="30" text-anchor="end">вопрос руководителя + метрика: доля</text>
  <text class="ink2 sm" x="474" y="45" text-anchor="end">доставок позже обещанного</text>
  <rect class="box" x="20" y="60" width="470" height="38" rx="5"/>
  <text class="ink b" x="36" y="84" text-anchor="start">Данные</text>
  <text class="ink2 sm" x="474" y="76" text-anchor="end">загрузка deliveries.csv по</text>
  <text class="ink2 sm" x="474" y="91" text-anchor="end">относительному пути</text>
  <rect class="box" x="20" y="106" width="470" height="38" rx="5"/>
  <text class="ink b" x="36" y="130" text-anchor="start">Предобработка</text>
  <text class="ink2 sm" x="474" y="130" text-anchor="end">журнал очистки таблицей: 1 877 → 1 841</text>
  <rect class="box-acc" x="20" y="152" width="470" height="38" rx="5"/>
  <text class="ink b" x="36" y="176" text-anchor="start">Анализ</text>
  <text class="ink2 sm" x="474" y="168" text-anchor="end">шаги 2–8: код → график с</text>
  <text class="ink2 sm" x="474" y="183" text-anchor="end">заголовком-выводом → markdown-вывод</text>
  <rect class="box-ok" x="20" y="198" width="470" height="38" rx="5"/>
  <text class="ink b" x="36" y="222" text-anchor="start">Выводы и рекомендации</text>
  <text class="ink2 sm" x="474" y="214" text-anchor="end">главное сначала; варианты действий с</text>
  <text class="ink2 sm" x="474" y="229" text-anchor="end">цифрами; ограничения</text>
  <rect class="box-warn" x="520" y="14" width="160" height="222" rx="8"/>
  <text class="ink b" x="600" y="40" text-anchor="middle">самопроверка</text>
  <text class="acc sm b" x="600" y="68" text-anchor="middle">Restart Kernel</text>
  <text class="acc sm b" x="600" y="90" text-anchor="middle">and Run All Cells</text>
  <text class="ink2 sm" x="600" y="112" text-anchor="middle"></text>
  <text class="acc sm b" x="600" y="134" text-anchor="middle">check_notebook.py</text>
  <text class="ink2 sm" x="600" y="156" text-anchor="middle">до пустого списка:</text>
  <text class="ink2 sm" x="600" y="178" text-anchor="middle">ошибки, пути,</text>
  <text class="ink2 sm" x="600" y="200" text-anchor="middle">разделы без вывода</text>
  <path class="ln" d="M500,125 L516,125" marker-end="url(#ah-project-notebook)"/>
  <text class="ink2 sm" x="255" y="262" text-anchor="middle">Проверка перед сдачей: прочитайте только markdown-ячейки —</text>
  <text class="ink2 sm" x="255" y="282" text-anchor="middle">понятен ли отчёт без кода и видны ли вывод и цифра масштаба?</text>
</svg>
