<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-group-kfold">
  <title id="t-group-kfold">Один клиент в трёх срезах — три похожие строки. KFold разносит их по фолдам, GroupKFold держит вместе</title>
  <defs><marker id="ah-group-kfold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="100" y="24" text-anchor="middle">строки обучения</text>
  <rect class="box-acc" x="30" y="34" width="140" height="26" rx="3"/>
  <text class="ink sm" x="100" y="52" text-anchor="middle">офис 17, 30.09.25</text>
  <rect class="box-acc" x="30" y="64" width="140" height="26" rx="3"/>
  <text class="ink sm" x="100" y="82" text-anchor="middle">офис 17, 31.12.25</text>
  <rect class="box-acc" x="30" y="94" width="140" height="26" rx="3"/>
  <text class="ink sm" x="100" y="112" text-anchor="middle">офис 17, 31.03.26</text>
  <rect class="box-ok" x="30" y="124" width="140" height="26" rx="3"/>
  <text class="ink sm" x="100" y="142" text-anchor="middle">офис 42, 31.12.25</text>
  <rect class="box-ok" x="30" y="154" width="140" height="26" rx="3"/>
  <text class="ink sm" x="100" y="172" text-anchor="middle">офис 42, 31.03.26</text>
  <text class="ink sm b" x="300" y="24" text-anchor="middle">KFold с перемешиванием</text>
  <rect class="box" x="210" y="34" width="86" height="150" rx="4"/>
  <text class="ink2 sm b" x="253" y="52" text-anchor="middle">фолд 1</text>
  <rect class="box" x="302" y="34" width="86" height="150" rx="4"/>
  <text class="ink2 sm b" x="345" y="52" text-anchor="middle">фолд 2</text>
  <rect class="box-acc" x="216" y="62" width="74" height="20" rx="3"/>
  <text class="ink sm" x="253" y="76" text-anchor="middle">17, 30.09</text>
  <rect class="box-acc" x="308" y="62" width="74" height="20" rx="3"/>
  <text class="ink sm" x="345" y="76" text-anchor="middle">17, 31.12</text>
  <rect class="box-acc" x="216" y="86" width="74" height="20" rx="3"/>
  <text class="ink sm" x="253" y="100" text-anchor="middle">17, 31.03</text>
  <rect class="box-ok" x="308" y="86" width="74" height="20" rx="3"/>
  <text class="ink sm" x="345" y="100" text-anchor="middle">42, 31.12</text>
  <rect class="box-ok" x="216" y="110" width="74" height="20" rx="3"/>
  <text class="ink sm" x="253" y="124" text-anchor="middle">42, 31.03</text>
  <text class="err sm b" x="300" y="206" text-anchor="middle">офис 17 и в обучении, и в проверке</text>
  <text class="ink sm b" x="530" y="24" text-anchor="middle">GroupKFold(groups=client_id)</text>
  <rect class="box" x="440" y="34" width="86" height="150" rx="4"/>
  <text class="ink2 sm b" x="483" y="52" text-anchor="middle">фолд 1</text>
  <rect class="box" x="532" y="34" width="86" height="150" rx="4"/>
  <text class="ink2 sm b" x="575" y="52" text-anchor="middle">фолд 2</text>
  <rect class="box-acc" x="446" y="62" width="74" height="20" rx="3"/>
  <text class="ink sm" x="483" y="76" text-anchor="middle">17, 30.09</text>
  <rect class="box-acc" x="446" y="86" width="74" height="20" rx="3"/>
  <text class="ink sm" x="483" y="100" text-anchor="middle">17, 31.12</text>
  <rect class="box-acc" x="446" y="110" width="74" height="20" rx="3"/>
  <text class="ink sm" x="483" y="124" text-anchor="middle">17, 31.03</text>
  <rect class="box-ok" x="538" y="62" width="74" height="20" rx="3"/>
  <text class="ink sm" x="575" y="76" text-anchor="middle">42, 31.12</text>
  <rect class="box-ok" x="538" y="86" width="74" height="20" rx="3"/>
  <text class="ink sm" x="575" y="100" text-anchor="middle">42, 31.03</text>
  <text class="ok sm b" x="530" y="206" text-anchor="middle">клиент целиком в одном фолде</text>
  <text class="mut sm" x="350" y="236" text-anchor="middle">в проекте kNN «узнаёт» клиента: ROC-AUC 0.733 при перемешанном KFold против честных 0.714</text>
