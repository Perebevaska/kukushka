<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-tensor-memory">
  <title id="t-nn-tensor-memory">torch.from_numpy делит память с массивом, torch.tensor делает копию</title>
  <defs><marker id="ah-nn-tensor-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="186" y="24" text-anchor="start">до правки</text>
  <text class="mut sm b" x="486" y="24" text-anchor="start">после a[0] = 100.0</text>
  <text class="ink sm b" x="20" y="62" text-anchor="start">a (numpy)</text>
  <text class="ink sm b" x="20" y="104" text-anchor="start">t_shared</text>
  <text class="mut sm" x="20" y="120" text-anchor="start">torch.from_numpy(a)</text>
  <path class="ln" d="M140,58 L178,66" marker-end="url(#ah-nn-tensor-memory)"/>
  <path class="ln" d="M140,100 L178,84" marker-end="url(#ah-nn-tensor-memory)"/>
  <rect class="box-acc" x="180" y="36" width="200" height="92" rx="8"/>
  <rect class="box" x="211" y="54" width="46" height="26" rx="2"/>
  <text class="ink sm" x="234.0" y="72" text-anchor="middle">1.5</text>
  <rect class="box" x="257" y="54" width="46" height="26" rx="2"/>
  <text class="ink sm" x="280.0" y="72" text-anchor="middle">2.0</text>
  <rect class="box" x="303" y="54" width="46" height="26" rx="2"/>
  <text class="ink sm" x="326.0" y="72" text-anchor="middle">3.0</text>
  <text class="acc sm" x="280" y="112" text-anchor="middle">одна память: float64, 24 байта</text>
  <text class="ink sm b" x="20" y="182" text-anchor="start">t_copy</text>
  <text class="mut sm" x="20" y="198" text-anchor="start">torch.tensor(a,</text>
  <text class="mut sm" x="20" y="213" text-anchor="start">  dtype=torch.float32)</text>
  <rect class="box" x="180" y="162" width="200" height="64" rx="8"/>
  <rect class="box" x="211" y="170" width="46" height="26" rx="2"/>
  <text class="ink sm" x="234.0" y="188" text-anchor="middle">1.5</text>
  <rect class="box" x="257" y="170" width="46" height="26" rx="2"/>
  <text class="ink sm" x="280.0" y="188" text-anchor="middle">2.0</text>
  <rect class="box" x="303" y="170" width="46" height="26" rx="2"/>
  <text class="ink sm" x="326.0" y="188" text-anchor="middle">3.0</text>
  <text class="ink2 sm" x="280" y="216" text-anchor="middle">своя память: float32, 12 байт</text>
  <path class="ln dash" d="M280,128 L280,160" marker-end="url(#ah-nn-tensor-memory)"/>
  <text class="mut sm" x="288" y="150" text-anchor="start">копия при создании</text>
  <path class="ln-acc" d="M384,82 L476,82" marker-end="url(#ah-nn-tensor-memory)"/>
  <text class="acc sm b" x="430" y="72" text-anchor="middle">a[0] = 100.0</text>
  <rect class="box-acc" x="480" y="36" width="200" height="92" rx="8"/>
  <rect class="box" x="511" y="54" width="46" height="26" rx="2"/>
  <text class="ink sm" x="534.0" y="72" text-anchor="middle">100.0</text>
  <rect class="box" x="557" y="54" width="46" height="26" rx="2"/>
  <text class="ink sm" x="580.0" y="72" text-anchor="middle">2.0</text>
  <rect class="box" x="603" y="54" width="46" height="26" rx="2"/>
  <text class="ink sm" x="626.0" y="72" text-anchor="middle">3.0</text>
  <rect class="box-warn" x="511" y="54" width="46" height="26" rx="2"/>
  <text class="ink sm b" x="534" y="72" text-anchor="middle">100.0</text>
  <text class="acc sm" x="580" y="112" text-anchor="middle">a[0] и t_shared[0] → 100.0</text>
  <rect class="box" x="480" y="162" width="200" height="64" rx="8"/>
  <rect class="box" x="511" y="170" width="46" height="26" rx="2"/>
  <text class="ink sm" x="534.0" y="188" text-anchor="middle">1.5</text>
  <rect class="box" x="557" y="170" width="46" height="26" rx="2"/>
  <text class="ink sm" x="580.0" y="188" text-anchor="middle">2.0</text>
  <rect class="box" x="603" y="170" width="46" height="26" rx="2"/>
  <text class="ink sm" x="626.0" y="188" text-anchor="middle">3.0</text>
  <text class="ink2 sm" x="580" y="216" text-anchor="middle">t_copy[0] → 1.5</text>
  <path class="ln-mut" d="M20,242 L680,242"/>
  <text class="ink sm b" x="20" y="274" text-anchor="start">обратно в numpy</text>
  <rect class="box" x="172" y="252" width="112" height="44" rx="6"/>
  <text class="ink sm b" x="228" y="270" text-anchor="middle">тензор на GPU</text>
  <text class="mut sm" x="228" y="287" text-anchor="middle">с requires_grad</text>
  <path class="ln" d="M284,274 L300,274" marker-end="url(#ah-nn-tensor-memory)"/>
  <rect class="box" x="300" y="252" width="112" height="44" rx="6"/>
  <text class="ink sm b" x="356" y="270" text-anchor="middle">.detach()</text>
  <text class="mut sm" x="356" y="287" text-anchor="middle">без графа</text>
  <path class="ln" d="M412,274 L428,274" marker-end="url(#ah-nn-tensor-memory)"/>
  <rect class="box" x="428" y="252" width="112" height="44" rx="6"/>
  <text class="ink sm b" x="484" y="270" text-anchor="middle">.cpu()</text>
  <text class="mut sm" x="484" y="287" text-anchor="middle">в память CPU</text>
  <path class="ln" d="M540,274 L556,274" marker-end="url(#ah-nn-tensor-memory)"/>
  <rect class="box-ok" x="556" y="252" width="112" height="44" rx="6"/>
  <text class="ink sm b" x="612" y="270" text-anchor="middle">.numpy()</text>
  <text class="mut sm" x="612" y="287" text-anchor="middle">массив numpy</text>
  <text class="mut sm" x="350" y="318" text-anchor="middle">одно число из тензора — t.item(); на процессоре и без градиентов хватает t.numpy()</text>
</svg>
