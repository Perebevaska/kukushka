<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-confusion">
  <title id="t-confusion">Матрица ошибок в порядке confusion_matrix: сначала 0, потом 1</title>
  <defs><marker id="ah-confusion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="255" y="20" text-anchor="middle">прогноз модели</text>
  <text class="ink2 sm" x="185" y="42" text-anchor="middle">останется (0)</text>
  <text class="ink2 sm" x="325" y="42" text-anchor="middle">уйдёт (1)</text>
  <text class="mut sm b" x="30" y="105" text-anchor="middle">на самом</text>
  <text class="mut sm b" x="30" y="121" text-anchor="middle">деле</text>
  <text class="ink2 sm" x="86" y="95" text-anchor="middle">остался</text>
  <text class="ink2 sm" x="86" y="111" text-anchor="middle">(0)</text>
  <text class="ink2 sm" x="86" y="185" text-anchor="middle">ушёл</text>
  <text class="ink2 sm" x="86" y="201" text-anchor="middle">(1)</text>
  <rect class="box" x="120" y="52" width="136" height="86" rx="6"/>
  <text class="ink b" x="188" y="80" text-anchor="middle">TN</text>
  <text class="ink2 sm" x="188" y="102" text-anchor="middle">верно: останется</text>
  <text class="mut sm" x="188" y="120" text-anchor="middle">бонус не нужен</text>
  <rect class="box-warn" x="260" y="52" width="136" height="86" rx="6"/>
  <text class="ink b" x="328" y="80" text-anchor="middle">FP</text>
  <text class="ink2 sm" x="328" y="102" text-anchor="middle">ложная тревога</text>
  <text class="mut sm" x="328" y="120" text-anchor="middle">бонус зря</text>
  <rect class="box-err" x="120" y="142" width="136" height="86" rx="6"/>
  <text class="ink b" x="188" y="170" text-anchor="middle">FN</text>
  <text class="ink2 sm" x="188" y="192" text-anchor="middle">пропустили</text>
  <text class="mut sm" x="188" y="210" text-anchor="middle">ушёл без бонуса</text>
  <rect class="box-ok" x="260" y="142" width="136" height="86" rx="6"/>
  <text class="ink b" x="328" y="170" text-anchor="middle">TP</text>
  <text class="ink2 sm" x="328" y="192" text-anchor="middle">нашли уходящего</text>
  <text class="mut sm" x="328" y="210" text-anchor="middle">бонус по делу</text>
  <text class="acc b" x="555" y="80" text-anchor="middle">confusion_matrix(y, pred)</text>
  <text class="ink" x="555" y="104" text-anchor="middle">[[TN, FP],</text>
  <text class="ink" x="555" y="124" text-anchor="middle"> [FN, TP]]</text>
  <text class="ink2 sm" x="555" y="164" text-anchor="middle">строки — как было на самом деле,</text>
  <text class="ink2 sm" x="555" y="182" text-anchor="middle">столбцы — что сказала модель;</text>
  <text class="ink2 sm" x="555" y="200" text-anchor="middle">сначала 0, потом 1</text>
  <text class="ink2 sm" x="350" y="260" text-anchor="middle">accuracy = (TP + TN) / все — при редком уходе высока даже у модели «никто не уйдёт»</text>
</svg>
