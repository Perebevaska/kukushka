<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sigma-steps">
  <title id="t-sigma-steps">Стандартное отклонение по шагам: отклонения, квадраты, деление на n − 1, корень</title>
  <defs><marker id="ah-sigma-steps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="18" y="62" text-anchor="start">бариста А</text>
  <path class="ln" d="M40,92 L216,92"/>
  <text class="mut sm" x="40" y="108" text-anchor="middle">1</text>
  <text class="mut sm" x="62" y="108" text-anchor="middle">2</text>
  <text class="mut sm" x="84" y="108" text-anchor="middle">3</text>
  <text class="mut sm" x="106" y="108" text-anchor="middle">4</text>
  <text class="mut sm" x="128" y="108" text-anchor="middle">5</text>
  <text class="mut sm" x="150" y="108" text-anchor="middle">6</text>
  <text class="mut sm" x="172" y="108" text-anchor="middle">7</text>
  <text class="mut sm" x="194" y="108" text-anchor="middle">8</text>
  <text class="mut sm" x="216" y="108" text-anchor="middle">9</text>
  <path class="ln-acc dash" d="M128.0,42 L128.0,94"/>
  <text class="acc sm b" x="128.0" y="38" text-anchor="middle">среднее 5</text>
  <path class="ln" d="M128.0,82 L111,82" marker-end="url(#ah-sigma-steps)"/>
  <circle class="box-warn" cx="106" cy="82" r="5"/>
  <circle class="box-warn" cx="128" cy="82" r="5"/>
  <circle class="box-warn" cx="128" cy="68" r="5"/>
  <path class="ln" d="M128.0,82 L145,82" marker-end="url(#ah-sigma-steps)"/>
  <circle class="box-warn" cx="150" cy="82" r="5"/>
  <rect class="box" x="240" y="46" width="82" height="50" rx="5"/>
  <text class="ink2 sm b" x="281.0" y="64" text-anchor="middle">отклонения</text>
  <text class="ink sm" x="281.0" y="84" text-anchor="middle">−1, 0, 0, +1</text>
  <rect class="box" x="328" y="46" width="122" height="50" rx="5"/>
  <text class="ink2 sm b" x="389.0" y="64" text-anchor="middle">квадраты</text>
  <text class="ink sm" x="389.0" y="84" text-anchor="middle">1 + 0 + 0 + 1 = 2</text>
  <path class="ln" d="M322,71 L327,71" marker-end="url(#ah-sigma-steps)"/>
  <rect class="box" x="456" y="46" width="110" height="50" rx="5"/>
  <text class="ink2 sm b" x="511.0" y="64" text-anchor="middle">дисперсия</text>
  <text class="ink sm" x="511.0" y="84" text-anchor="middle">2 / 3 = 0.67</text>
  <path class="ln" d="M450,71 L455,71" marker-end="url(#ah-sigma-steps)"/>
  <rect class="box-ok" x="572" y="46" width="110" height="50" rx="5"/>
  <text class="ink2 sm b" x="627.0" y="64" text-anchor="middle">σ</text>
  <text class="ok sm b" x="627.0" y="84" text-anchor="middle">√0.67 = 0.82 мин</text>
  <path class="ln" d="M566,71 L571,71" marker-end="url(#ah-sigma-steps)"/>
  <text class="ink b" x="18" y="182" text-anchor="start">бариста Б</text>
  <path class="ln" d="M40,212 L216,212"/>
  <text class="mut sm" x="40" y="228" text-anchor="middle">1</text>
  <text class="mut sm" x="62" y="228" text-anchor="middle">2</text>
  <text class="mut sm" x="84" y="228" text-anchor="middle">3</text>
  <text class="mut sm" x="106" y="228" text-anchor="middle">4</text>
  <text class="mut sm" x="128" y="228" text-anchor="middle">5</text>
  <text class="mut sm" x="150" y="228" text-anchor="middle">6</text>
  <text class="mut sm" x="172" y="228" text-anchor="middle">7</text>
  <text class="mut sm" x="194" y="228" text-anchor="middle">8</text>
  <text class="mut sm" x="216" y="228" text-anchor="middle">9</text>
  <path class="ln-acc dash" d="M128.0,162 L128.0,214"/>
  <text class="acc sm b" x="128.0" y="158" text-anchor="middle">среднее 5</text>
  <path class="ln" d="M128.0,202 L67,202" marker-end="url(#ah-sigma-steps)"/>
  <circle class="box-warn" cx="62" cy="202" r="5"/>
  <path class="ln" d="M128.0,202 L111,202" marker-end="url(#ah-sigma-steps)"/>
  <circle class="box-warn" cx="106" cy="202" r="5"/>
  <path class="ln" d="M128.0,202 L145,202" marker-end="url(#ah-sigma-steps)"/>
  <circle class="box-warn" cx="150" cy="202" r="5"/>
  <path class="ln" d="M128.0,202 L189,202" marker-end="url(#ah-sigma-steps)"/>
  <circle class="box-warn" cx="194" cy="202" r="5"/>
  <rect class="box" x="240" y="166" width="82" height="50" rx="5"/>
  <text class="ink2 sm b" x="281.0" y="184" text-anchor="middle">отклонения</text>
  <text class="ink sm" x="281.0" y="204" text-anchor="middle">−3, −1, +1, +3</text>
  <rect class="box" x="328" y="166" width="122" height="50" rx="5"/>
  <text class="ink2 sm b" x="389.0" y="184" text-anchor="middle">квадраты</text>
  <text class="ink sm" x="389.0" y="204" text-anchor="middle">9 + 1 + 1 + 9 = 20</text>
  <path class="ln" d="M322,191 L327,191" marker-end="url(#ah-sigma-steps)"/>
  <rect class="box" x="456" y="166" width="110" height="50" rx="5"/>
  <text class="ink2 sm b" x="511.0" y="184" text-anchor="middle">дисперсия</text>
  <text class="ink sm" x="511.0" y="204" text-anchor="middle">20 / 3 = 6.67</text>
  <path class="ln" d="M450,191 L455,191" marker-end="url(#ah-sigma-steps)"/>
  <rect class="box-ok" x="572" y="166" width="110" height="50" rx="5"/>
  <text class="ink2 sm b" x="627.0" y="184" text-anchor="middle">σ</text>
  <text class="ok sm b" x="627.0" y="204" text-anchor="middle">√6.67 = 2.58 мин</text>
  <path class="ln" d="M566,191 L571,191" marker-end="url(#ah-sigma-steps)"/>
  <text class="ink2" x="350" y="24" text-anchor="middle">Одинаковое среднее 5 минут — разный разброс</text>
  <text class="mut sm" x="350" y="268" text-anchor="middle">Сумма отклонений всегда 0, поэтому их возводят в квадрат; корень возвращает минуты</text>
</svg>
