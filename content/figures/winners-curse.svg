<svg viewBox="0 0 700 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-winners-curse">
  <title id="t-winners-curse">Проклятие победителя: места выбирают по прогнозу, а платят по факту</title>
  <defs><marker id="ah-winners-curse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="60" y="37.5" width="94" height="212.5" rx="6"/>
  <text class="acc sm b" x="106.0" y="31.5" text-anchor="middle">выбраны по прогнозу</text>
  <path class="ln" d="M50,250 L374,250"/>
  <text class="mut sm" x="44" y="254.0" text-anchor="end">0</text>
  <text class="mut sm" x="44" y="169.0" text-anchor="end">100</text>
  <text class="mut sm" x="44" y="84.0" text-anchor="end">200</text>
  <path class="ln-err dash" d="M50,131.0 L374,131.0"/>
  <text class="err sm" x="374" y="125.0" text-anchor="end">автомат: 140</text>
  <text class="mut sm" x="16" y="143.75" text-anchor="middle" transform="rotate(-90 16 143.75)">тыс. ₽ в год</text>
  <path class="ln-mut" d="M84,71.5 L84,88.5"/>
  <circle class="box-acc" cx="84" cy="71.5" r="6"/>
  <circle class="box-err" cx="84" cy="88.5" r="6"/>
  <text class="ink sm b" x="84" y="268" text-anchor="middle">A</text>
  <path class="ln-mut" d="M134,97.0 L134,169.25"/>
  <circle class="box-acc" cx="134" cy="97.0" r="6"/>
  <circle class="box-err" cx="134" cy="169.25" r="6"/>
  <text class="ink sm b" x="134" y="268" text-anchor="middle">B</text>
  <path class="ln-mut" d="M184,122.5 L184,54.5"/>
  <circle class="box-acc" cx="184" cy="122.5" r="6"/>
  <circle class="box-ok" cx="184" cy="54.5" r="6"/>
  <text class="ink sm b" x="184" y="268" text-anchor="middle">C</text>
  <path class="ln-mut" d="M234,173.5 L234,199.0"/>
  <circle class="box-acc" cx="234" cy="173.5" r="6"/>
  <circle class="box-err" cx="234" cy="199.0" r="6"/>
  <text class="ink sm b" x="234" y="268" text-anchor="middle">D</text>
  <path class="ln-mut" d="M284,190.5 L284,177.75"/>
  <circle class="box-acc" cx="284" cy="190.5" r="6"/>
  <circle class="box-ok" cx="284" cy="177.75" r="6"/>
  <text class="ink sm b" x="284" y="268" text-anchor="middle">E</text>
  <path class="ln-mut" d="M334,216.0 L334,233.0"/>
  <circle class="box-acc" cx="334" cy="216.0" r="6"/>
  <circle class="box-err" cx="334" cy="233.0" r="6"/>
  <text class="ink sm b" x="334" y="268" text-anchor="middle">F</text>
  <circle class="box-acc" cx="410" cy="26" r="6"/>
  <text class="ink2 sm" x="422" y="30" text-anchor="start">прогноз</text>
  <circle class="box-err" cx="500" cy="26" r="6"/>
  <text class="ink2 sm" x="512" y="30" text-anchor="start">факт ниже</text>
  <circle class="box-ok" cx="596" cy="26" r="6"/>
  <text class="ink2 sm" x="608" y="30" text-anchor="start">выше</text>
  <text class="ink sm b" x="410" y="70" text-anchor="start">выбор по прогнозу: A, B</text>
  <text class="acc sm" x="410" y="96" text-anchor="start">обещание: 210 + 180 − 280 = 110</text>
  <text class="err sm b" x="410" y="120" text-anchor="start">факт: 190 + 95 − 280 = 5</text>
  <text class="ok sm" x="410" y="144" text-anchor="start">лучший выбор (A, C): 140</text>
  <text class="ink2 sm" x="410" y="184" text-anchor="start">B попал в топ благодаря ошибке</text>
  <text class="ink2 sm" x="410" y="202" text-anchor="start">в плюс, C выпал из-за ошибки в минус:</text>
  <text class="ink2 sm" x="410" y="220" text-anchor="start">обещание выбранного топа</text>
  <text class="ink2 sm" x="410" y="238" text-anchor="start">систематически выше факта</text>
  <text class="mut sm" x="350" y="290" text-anchor="middle">прибыль в тыс. ₽ до вычета автомата; 2 места из 6 — игрушечный пример урока</text>
</svg>
