<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cosine-shares">
  <title id="t-cosine-shares">Косинус сравнивает состав продаж, а не объём</title>
  <defs><marker id="ah-cosine-shares" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="300.0" y="24" text-anchor="middle">доли напитков в продажах</text>
  <text class="ink sm b" x="140" y="56" text-anchor="end">маленькая</text>
  <text class="mut sm" x="140" y="72" text-anchor="end">[30, 20, 10]</text>
  <rect class="box-acc" x="150" y="40" width="150.0" height="34" rx="3"/>
  <text class="ink sm" x="225.0" y="62" text-anchor="middle">50%</text>
  <rect class="box-warn" x="300.0" y="40" width="100.0" height="34" rx="3"/>
  <text class="ink sm" x="350.0" y="62" text-anchor="middle">33%</text>
  <rect class="box-ok" x="400.0" y="40" width="50.0" height="34" rx="3"/>
  <text class="ink sm" x="425.0" y="62" text-anchor="middle">17%</text>
  <text class="ink sm b" x="140" y="106" text-anchor="end">большая</text>
  <text class="mut sm" x="140" y="122" text-anchor="end">[300, 200, 100]</text>
  <rect class="box-acc" x="150" y="90" width="150.0" height="34" rx="3"/>
  <text class="ink sm" x="225.0" y="112" text-anchor="middle">50%</text>
  <rect class="box-warn" x="300.0" y="90" width="100.0" height="34" rx="3"/>
  <text class="ink sm" x="350.0" y="112" text-anchor="middle">33%</text>
  <rect class="box-ok" x="400.0" y="90" width="50.0" height="34" rx="3"/>
  <text class="ink sm" x="425.0" y="112" text-anchor="middle">17%</text>
  <text class="ink sm b" x="140" y="156" text-anchor="end">с упором на раф</text>
  <text class="mut sm" x="140" y="172" text-anchor="end">[10, 10, 50]</text>
  <rect class="box-acc" x="150" y="140" width="42.857142857142854" height="34" rx="3"/>
  <text class="ink sm" x="171.42857142857142" y="162" text-anchor="middle">14%</text>
  <rect class="box-warn" x="192.85714285714286" y="140" width="42.857142857142854" height="34" rx="3"/>
  <text class="ink sm" x="214.28571428571428" y="162" text-anchor="middle">14%</text>
  <rect class="box-ok" x="235.71428571428572" y="140" width="214.28571428571428" height="34" rx="3"/>
  <text class="ink sm" x="342.8571428571429" y="162" text-anchor="middle">71%</text>
  <rect class="box-acc" x="150" y="196" width="14" height="14" rx="2"/>
  <text class="ink2 sm" x="170" y="208" text-anchor="start">капучино</text>
  <rect class="box-warn" x="250" y="196" width="14" height="14" rx="2"/>
  <text class="ink2 sm" x="270" y="208" text-anchor="start">латте</text>
  <rect class="box-ok" x="350" y="196" width="14" height="14" rx="2"/>
  <text class="ink2 sm" x="370" y="208" text-anchor="start">раф</text>
  <text class="ink sm b" x="480" y="40" text-anchor="start">маленькая и большая:</text>
  <text class="err sm" x="480" y="60" text-anchor="start">расстояние ≈ 336.7</text>
  <text class="ok sm b" x="480" y="78" text-anchor="start">косинус = 1.000</text>
  <text class="ink sm b" x="480" y="112" text-anchor="start">маленькая и «раф»:</text>
  <text class="ok sm" x="480" y="132" text-anchor="start">расстояние ≈ 45.8</text>
  <text class="err sm b" x="480" y="150" text-anchor="start">косинус ≈ 0.514</text>
  <text class="ink2 sm" x="350" y="240" text-anchor="middle">полоски у маленькой и большой одинаковые — направление векторов совпадает, косинус 1;</text>
  <text class="mut sm" x="350" y="258" text-anchor="middle">расстояние же видит в первую очередь размер: ближе к маленькой оказалась кофейня с другим составом</text>
</svg>
