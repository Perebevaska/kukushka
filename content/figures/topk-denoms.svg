<svg viewBox="0 0 700 254" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-topk-denoms">
  <title id="t-topk-denoms">Точность и охват в топ-k: одинаковый числитель, разные знаменатели</title>
  <defs><marker id="ah-topk-denoms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <circle class="box-warn" cx="40" cy="18" r="8"/>
  <text class="ink2 sm" x="54" y="22" text-anchor="start">ушёл</text>
  <circle class="box" cx="102" cy="18" r="8"/>
  <text class="ink2 sm" x="116" y="22" text-anchor="start">остался</text>
  <text class="mut sm" x="190" y="22" text-anchor="start">гости отсортированы по риску, слева — самые рискованные</text>
  <rect class="box-acc" x="34" y="50" width="100" height="66" rx="8"/>
  <text class="acc sm b" x="40" y="64" text-anchor="start">топ-2</text>
  <circle class="box-warn" cx="60" cy="84" r="13"/>
  <text class="ink sm b" x="60" y="88" text-anchor="middle">A</text>
  <text class="mut sm" x="60" y="110" text-anchor="middle">0.9</text>
  <circle class="box-warn" cx="108" cy="84" r="13"/>
  <text class="ink sm b" x="108" y="88" text-anchor="middle">B</text>
  <text class="mut sm" x="108" y="110" text-anchor="middle">0.8</text>
  <circle class="box" cx="156" cy="84" r="13"/>
  <text class="ink sm b" x="156" y="88" text-anchor="middle">C</text>
  <text class="mut sm" x="156" y="110" text-anchor="middle">0.6</text>
  <circle class="box-warn" cx="204" cy="84" r="13"/>
  <text class="ink sm b" x="204" y="88" text-anchor="middle">D</text>
  <text class="mut sm" x="204" y="110" text-anchor="middle">0.4</text>
  <circle class="box" cx="252" cy="84" r="13"/>
  <text class="ink sm b" x="252" y="88" text-anchor="middle">E</text>
  <text class="mut sm" x="252" y="110" text-anchor="middle">0.3</text>
  <circle class="box" cx="300" cy="84" r="13"/>
  <text class="ink sm b" x="300" y="88" text-anchor="middle">F</text>
  <text class="mut sm" x="300" y="110" text-anchor="middle">0.1</text>
  <text class="ink sm" x="350" y="74" text-anchor="start"><tspan class="ink2">точность = </tspan><tspan class="b">2 / 2</tspan> = 1.00<tspan class="mut">   делим на k — всех выбранных</tspan></text>
  <text class="ink sm" x="350" y="100" text-anchor="start"><tspan class="ink2">охват = </tspan><tspan class="b">2 / 3</tspan> = 0.67<tspan class="mut">   делим на всех уходящих</tspan></text>
  <rect class="box-acc" x="34" y="146" width="196" height="66" rx="8"/>
  <text class="acc sm b" x="40" y="160" text-anchor="start">топ-4</text>
  <circle class="box-warn" cx="60" cy="180" r="13"/>
  <text class="ink sm b" x="60" y="184" text-anchor="middle">A</text>
  <text class="mut sm" x="60" y="206" text-anchor="middle">0.9</text>
  <circle class="box-warn" cx="108" cy="180" r="13"/>
  <text class="ink sm b" x="108" y="184" text-anchor="middle">B</text>
  <text class="mut sm" x="108" y="206" text-anchor="middle">0.8</text>
  <circle class="box" cx="156" cy="180" r="13"/>
  <text class="ink sm b" x="156" y="184" text-anchor="middle">C</text>
  <text class="mut sm" x="156" y="206" text-anchor="middle">0.6</text>
  <circle class="box-warn" cx="204" cy="180" r="13"/>
  <text class="ink sm b" x="204" y="184" text-anchor="middle">D</text>
  <text class="mut sm" x="204" y="206" text-anchor="middle">0.4</text>
  <circle class="box" cx="252" cy="180" r="13"/>
  <text class="ink sm b" x="252" y="184" text-anchor="middle">E</text>
  <text class="mut sm" x="252" y="206" text-anchor="middle">0.3</text>
  <circle class="box" cx="300" cy="180" r="13"/>
  <text class="ink sm b" x="300" y="184" text-anchor="middle">F</text>
  <text class="mut sm" x="300" y="206" text-anchor="middle">0.1</text>
  <text class="ink sm" x="350" y="170" text-anchor="start"><tspan class="ink2">точность = </tspan><tspan class="b">3 / 4</tspan> = 0.75<tspan class="mut">   делим на k — всех выбранных</tspan></text>
  <text class="ink sm" x="350" y="196" text-anchor="start"><tspan class="ink2">охват = </tspan><tspan class="b">3 / 3</tspan> = 1.00<tspan class="mut">   делим на всех уходящих</tspan></text>
  <text class="mut sm" x="350" y="244" text-anchor="middle">уходящих всего 3 (A, B, D) — знаменатель охвата от k не зависит; больше k → выше охват, ниже точность</text>
</svg>
