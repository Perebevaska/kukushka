<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-test-choice">
  <title id="t-test-choice">Как выбрать статистический тест</title>
  <defs><marker id="ah-test-choice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="230" y="8" width="240" height="34" rx="6"/>
  <text class="ink b" x="350.0" y="29.5" text-anchor="middle">Что сравниваем?</text>
  <rect class="box-acc" x="20" y="76" width="380" height="36" rx="6"/>
  <text class="ink sm b" x="210.0" y="98.5" text-anchor="middle">числа: минуты, рубли, чек</text>
  <rect class="box-acc" x="420" y="76" width="125" height="36" rx="6"/>
  <text class="ink sm b" x="482.5" y="98.5" text-anchor="middle">доли (0 / 1)</text>
  <rect class="box-acc" x="555" y="76" width="125" height="36" rx="6"/>
  <text class="ink sm b" x="617.5" y="98.5" text-anchor="middle">категории</text>
  <path class="ln" d="M350,42 L210,76" marker-end="url(#ah-test-choice)"/>
  <path class="ln" d="M350,42 L482,76" marker-end="url(#ah-test-choice)"/>
  <path class="ln" d="M350,42 L617,76" marker-end="url(#ah-test-choice)"/>
  <rect class="box-ok" x="420" y="146" width="125" height="34" rx="6"/>
  <text class="ink sm b" x="482.5" y="167.5" text-anchor="middle">proportions_ztest</text>
  <rect class="box-ok" x="555" y="146" width="125" height="34" rx="6"/>
  <text class="ink sm b" x="617.5" y="167.5" text-anchor="middle">chi2_contingency</text>
  <path class="ln" d="M482,112 L482,146" marker-end="url(#ah-test-choice)"/>
  <path class="ln" d="M617,112 L617,146" marker-end="url(#ah-test-choice)"/>
  <rect class="box" x="20" y="146" width="150" height="40" rx="6"/>
  <text class="ink2 sm" x="95.0" y="162.0" text-anchor="middle">одна группа</text>
  <text class="ink2 sm" x="95.0" y="179.0" text-anchor="middle">против числа</text>
  <rect class="box" x="190" y="146" width="210" height="40" rx="6"/>
  <text class="ink2 sm" x="295.0" y="170.5" text-anchor="middle">две группы</text>
  <path class="ln" d="M110,112 L95,146" marker-end="url(#ah-test-choice)"/>
  <path class="ln" d="M300,112 L295,146" marker-end="url(#ah-test-choice)"/>
  <rect class="box-ok" x="20" y="220" width="150" height="34" rx="6"/>
  <text class="ink sm b" x="95.0" y="241.5" text-anchor="middle">ttest_1samp</text>
  <path class="ln" d="M95,186 L95,220" marker-end="url(#ah-test-choice)"/>
  <rect class="box-warn" x="190" y="220" width="210" height="40" rx="6"/>
  <text class="ink2 sm" x="295.0" y="236.0" text-anchor="middle">одни и те же объекты</text>
  <text class="ink2 sm" x="295.0" y="253.0" text-anchor="middle">до и после?</text>
  <path class="ln" d="M295,186 L295,220" marker-end="url(#ah-test-choice)"/>
  <rect class="box-ok" x="190" y="290" width="120" height="34" rx="6"/>
  <text class="ink sm b" x="250.0" y="311.5" text-anchor="middle">ttest_rel</text>
  <path class="ln" d="M250,260 L250,290" marker-end="url(#ah-test-choice)"/>
  <text class="ink2 sm" x="258" y="280" text-anchor="start">да</text>
  <rect class="box-warn" x="440" y="220" width="240" height="40" rx="6"/>
  <text class="ink2 sm" x="560.0" y="236.0" text-anchor="middle">сильный перекос, выбросы</text>
  <text class="ink2 sm" x="560.0" y="253.0" text-anchor="middle">или оценки 1–5?</text>
  <path class="ln" d="M400,240 L440,240" marker-end="url(#ah-test-choice)"/>
  <text class="ink2 sm" x="420" y="232" text-anchor="middle">нет</text>
  <rect class="box-ok" x="420" y="290" width="120" height="34" rx="6"/>
  <text class="ink sm b" x="480.0" y="311.5" text-anchor="middle">mannwhitneyu</text>
  <rect class="box-ok" x="550" y="290" width="130" height="40" rx="6"/>
  <text class="ink sm b" x="615.0" y="306.0" text-anchor="middle">ttest_ind(...,</text>
  <text class="ink sm b" x="615.0" y="323.0" text-anchor="middle">equal_var=False)</text>
  <path class="ln" d="M500,260 L480,290" marker-end="url(#ah-test-choice)"/>
  <text class="ink2 sm" x="476" y="280" text-anchor="end">да</text>
  <path class="ln" d="M620,260 L615,290" marker-end="url(#ah-test-choice)"/>
  <text class="ink2 sm" x="626" y="280" text-anchor="start">нет</text>
  <text class="mut sm" x="350" y="352" text-anchor="middle">у всех тестов H₀ — «различий нет», на выходе статистика и p-value</text>
</svg>
