<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-profit-ev">
  <title id="t-profit-ev">Когда бонус окупается: p × 1000 > 200</title>
  <defs><marker id="ah-profit-ev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <path class="ln" d="M70,140.0 L630,140.0"/>
  <path class="ln" d="M70,168.0 L70,27.999999999999986"/>
  <path class="ln-acc" d="M70.0,168.0 L630.0,28.0"/>
  <rect class="box-err" x="70.0" y="26" width="112.0" height="142.0" rx="2"/>
  <rect class="box-ok" x="182.0" y="26" width="448.0" height="142.0" rx="2"/>
  <path class="ln-acc" d="M70.0,168.0 L630.0,28.0"/>
  <path class="ln" d="M70,140.0 L630,140.0"/>
  <circle class="acc" cx="182.0" cy="140.0" r="6"/>
  <text class="acc sm b" x="192.0" y="158.0" text-anchor="start">p = 200/1000 = 0.2</text>
  <text class="err sm b" x="126.0" y="44" text-anchor="middle">не окупается</text>
  <text class="ok sm b" x="406.0" y="44" text-anchor="middle">бонус выгоден</text>
  <text class="mut sm" x="64.0" y="172.0" text-anchor="end">−200</text>
  <text class="mut sm" x="64.0" y="144.0" text-anchor="end">0</text>
  <text class="mut sm" x="64.0" y="32.0" text-anchor="end">+800</text>
  <text class="mut sm" x="70.0" y="184.0" text-anchor="middle">0</text>
  <text class="mut sm" x="182.0" y="184.0" text-anchor="middle">0.2</text>
  <text class="mut sm" x="350.0" y="184.0" text-anchor="middle">0.5</text>
  <text class="mut sm" x="630.0" y="184.0" text-anchor="middle">1</text>
  <text class="ink sm b" x="350" y="206.0" text-anchor="middle">ожидаемый результат одного бонуса = p × 1000 − 200 ₽</text>
  <text class="mut sm" x="350" y="252" text-anchor="middle">p — вероятность ухода гостя; по оси Y — ₽ на один бонус. Это работает, только если p честная (откалиброванная)</text>
</svg>
