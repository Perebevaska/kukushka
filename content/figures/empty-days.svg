<svg viewBox="0 0 700 292" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-empty-days">
  <title id="t-empty-days">groupby видит только дни с событиями; reindex добавляет пустые дни нулями</title>
  <defs><marker id="ah-empty-days" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="acc sm b" x="130" y="22" text-anchor="middle">groupby(день).size()</text>
  <rect class="box" x="70" y="34" width="130" height="24" rx="3"/>
  <text class="ink2 sm b" x="100.0" y="50.0" text-anchor="middle">день</text>
  <text class="ink2 sm b" x="165.0" y="50.0" text-anchor="middle">доставок</text>
  <rect class="box" x="70" y="60" width="130" height="24" rx="3"/>
  <text class="ink sm" x="100.0" y="76.0" text-anchor="middle">пн</text>
  <text class="ink sm" x="165.0" y="76.0" text-anchor="middle">2</text>
  <rect class="box" x="70" y="86" width="130" height="24" rx="3"/>
  <text class="ink sm" x="100.0" y="102.0" text-anchor="middle">ср</text>
  <text class="ink sm" x="165.0" y="102.0" text-anchor="middle">1</text>
  <rect class="box" x="70" y="112" width="130" height="24" rx="3"/>
  <text class="ink sm" x="100.0" y="128.0" text-anchor="middle">пт</text>
  <text class="ink sm" x="165.0" y="128.0" text-anchor="middle">3</text>
  <rect class="box" x="70" y="138" width="130" height="24" rx="3"/>
  <text class="ink sm" x="100.0" y="154.0" text-anchor="middle">вс</text>
  <text class="ink sm" x="165.0" y="154.0" text-anchor="middle">1</text>
  <text class="err b" x="105" y="184" text-anchor="middle">среднее = 7 / 4 = 1.75</text>
  <text class="err sm" x="105" y="202" text-anchor="middle">пустых дней будто не было</text>
  <path class="ln" d="M222,110 L300,110" marker-end="url(#ah-empty-days)"/>
  <text class="acc sm b" x="261" y="98" text-anchor="middle">reindex(days,</text>
  <text class="acc sm b" x="261" y="128" text-anchor="middle">fill_value=0)</text>
  <rect class="box" x="320" y="34" width="130" height="22" rx="3"/>
  <text class="ink2 sm b" x="350.0" y="49.0" text-anchor="middle">день</text>
  <text class="ink2 sm b" x="415.0" y="49.0" text-anchor="middle">доставок</text>
  <rect class="box" x="320" y="58" width="130" height="22" rx="3"/>
  <text class="ink sm" x="350.0" y="73.0" text-anchor="middle">пн</text>
  <text class="ink sm" x="415.0" y="73.0" text-anchor="middle">2</text>
  <rect class="box-warn" x="320" y="82" width="130" height="22" rx="3"/>
  <text class="ink sm" x="350.0" y="97.0" text-anchor="middle">вт</text>
  <text class="ink sm" x="415.0" y="97.0" text-anchor="middle">0</text>
  <rect class="box" x="320" y="106" width="130" height="22" rx="3"/>
  <text class="ink sm" x="350.0" y="121.0" text-anchor="middle">ср</text>
  <text class="ink sm" x="415.0" y="121.0" text-anchor="middle">1</text>
  <rect class="box-warn" x="320" y="130" width="130" height="22" rx="3"/>
  <text class="ink sm" x="350.0" y="145.0" text-anchor="middle">чт</text>
  <text class="ink sm" x="415.0" y="145.0" text-anchor="middle">0</text>
  <rect class="box" x="320" y="154" width="130" height="22" rx="3"/>
  <text class="ink sm" x="350.0" y="169.0" text-anchor="middle">пт</text>
  <text class="ink sm" x="415.0" y="169.0" text-anchor="middle">3</text>
  <rect class="box-warn" x="320" y="178" width="130" height="22" rx="3"/>
  <text class="ink sm" x="350.0" y="193.0" text-anchor="middle">сб</text>
  <text class="ink sm" x="415.0" y="193.0" text-anchor="middle">0</text>
  <rect class="box" x="320" y="202" width="130" height="22" rx="3"/>
  <text class="ink sm" x="350.0" y="217.0" text-anchor="middle">вс</text>
  <text class="ink sm" x="415.0" y="217.0" text-anchor="middle">1</text>
  <text class="ok b" x="385" y="246" text-anchor="middle">среднее = 7 / 7 = 1.00</text>
  <text class="warn sm" x="458" y="97" text-anchor="start">← добавлен</text>
  <text class="warn sm" x="458" y="145" text-anchor="start">← добавлен</text>
  <text class="warn sm" x="458" y="193" text-anchor="start">← добавлен</text>
  <text class="ink2 sm" x="600" y="86" text-anchor="middle">Доля дней без</text>
  <text class="ink2 sm" x="600" y="102" text-anchor="middle">доставок:</text>
  <text class="ok b" x="600" y="124" text-anchor="middle">43 %</text>
  <text class="err sm" x="600" y="146" text-anchor="middle">а у groupby — 0 %</text>
  <text class="mut sm" x="350" y="284" text-anchor="middle">Условная неделя одной кофейни. Для счётчиков по дням — полный календарь, иначе среднее завышено</text>
</svg>
