<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-backprop">
  <title id="t-backprop">Прямой и обратный проход сети с одним скрытым слоем</title>
  <defs><marker id="ah-backprop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="12.0" y="70" width="56" height="40" rx="8"/>
  <text class="ink sm b" x="40" y="95" text-anchor="middle">X</text>
  <rect class="box-acc" x="89.0" y="70" width="122" height="40" rx="8"/>
  <text class="ink sm b" x="150" y="95" text-anchor="middle">Z₁ = X·W₁ + b₁</text>
  <rect class="box-acc" x="237.0" y="70" width="106" height="40" rx="8"/>
  <text class="ink sm b" x="290" y="95" text-anchor="middle">H = ReLU(Z₁)</text>
  <rect class="box-acc" x="373.0" y="70" width="114" height="40" rx="8"/>
  <text class="ink sm b" x="430" y="95" text-anchor="middle">z = H·w₂ + b₂</text>
  <rect class="box-acc" x="523.0" y="70" width="74" height="40" rx="8"/>
  <text class="ink sm b" x="560" y="95" text-anchor="middle">p = σ(z)</text>
  <rect class="box-err" x="626.0" y="70" width="58" height="40" rx="8"/>
  <text class="ink sm b" x="655" y="95" text-anchor="middle">потеря</text>
  <path class="ln-acc" d="M70.0,82 L87.0,82" marker-end="url(#ah-backprop)"/>
  <path class="ln-err" d="M87.0,100 L70.0,100" marker-end="url(#ah-backprop)"/>
  <path class="ln-acc" d="M213.0,82 L235.0,82" marker-end="url(#ah-backprop)"/>
  <path class="ln-err" d="M235.0,100 L213.0,100" marker-end="url(#ah-backprop)"/>
  <path class="ln-acc" d="M345.0,82 L371.0,82" marker-end="url(#ah-backprop)"/>
  <path class="ln-err" d="M371.0,100 L345.0,100" marker-end="url(#ah-backprop)"/>
  <path class="ln-acc" d="M489.0,82 L521.0,82" marker-end="url(#ah-backprop)"/>
  <path class="ln-err" d="M521.0,100 L489.0,100" marker-end="url(#ah-backprop)"/>
  <path class="ln-acc" d="M599.0,82 L624.0,82" marker-end="url(#ah-backprop)"/>
  <path class="ln-err" d="M624.0,100 L599.0,100" marker-end="url(#ah-backprop)"/>
  <text class="acc b" x="350" y="46" text-anchor="middle">прямой проход: считаем прогноз</text>
  <text class="err b" x="350" y="140" text-anchor="middle">обратный проход: от потери назад по цепочке производных</text>
  <text class="ink2 sm" x="350" y="166" text-anchor="middle">d₂ = (p − y) / n  →  градиенты w₂, b₂  →  dH = d₂·w₂ × (Z₁ &gt; 0)  →  градиенты W₁, b₁</text>
  <text class="ink2 sm" x="350" y="200" text-anchor="middle">затем шаг спуска для всех весов сразу: w ← w − lr × градиент</text>
  <text class="mut sm" x="350" y="222" text-anchor="middle">ReLU пропускает градиент только там, где Z₁ &gt; 0</text>
</svg>
