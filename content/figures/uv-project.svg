<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-uv-project">
  <title id="t-uv-project">Что появляется в папке проекта после команд uv</title>
  <defs><marker id="ah-uv-project" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="20" y="22" text-anchor="start">команда</text>
  <text class="mut sm b" x="206" y="22" text-anchor="start">папка zerno-analytics/</text>
  <text class="mut sm b" x="530" y="22" text-anchor="start">уходит коллеге?</text>
  <rect class="box" x="14" y="34" width="150" height="30" rx="5"/>
  <text class="ink sm b" x="89" y="54" text-anchor="middle">uv init</text>
  <path class="ln" d="M166,49 L196,49" marker-end="url(#ah-uv-project)"/>
  <rect class="box" x="200" y="34" width="312" height="30" rx="5"/>
  <text class="ink sm b" x="210" y="54" text-anchor="start">pyproject.toml</text>
  <text class="ink2 sm" x="504" y="54" text-anchor="end">список библиотек, версия Python</text>
  <rect class="box-ok" x="524" y="34" width="162" height="30" rx="5"/>
  <text class="ink sm" x="605" y="54" text-anchor="middle">да</text>
  <rect class="box" x="14" y="72" width="150" height="30" rx="5"/>
  <text class="ink sm b" x="89" y="92" text-anchor="middle">uv init</text>
  <path class="ln" d="M166,87 L196,87" marker-end="url(#ah-uv-project)"/>
  <rect class="box" x="200" y="72" width="312" height="30" rx="5"/>
  <text class="ink sm b" x="210" y="92" text-anchor="start">.python-version</text>
  <text class="ink2 sm" x="504" y="92" text-anchor="end">какой Python нужен</text>
  <rect class="box-ok" x="524" y="72" width="162" height="30" rx="5"/>
  <text class="ink sm" x="605" y="92" text-anchor="middle">да</text>
  <rect class="box" x="14" y="110" width="150" height="30" rx="5"/>
  <text class="ink sm b" x="89" y="130" text-anchor="middle">uv add pandas …</text>
  <path class="ln" d="M166,125 L196,125" marker-end="url(#ah-uv-project)"/>
  <rect class="box" x="200" y="110" width="312" height="30" rx="5"/>
  <text class="ink sm b" x="210" y="130" text-anchor="start">uv.lock</text>
  <text class="ink2 sm" x="504" y="130" text-anchor="end">точные версии всех библиотек</text>
  <rect class="box-ok" x="524" y="110" width="162" height="30" rx="5"/>
  <text class="ink sm" x="605" y="130" text-anchor="middle">да</text>
  <rect class="box" x="14" y="148" width="150" height="30" rx="5"/>
  <text class="ink sm b" x="89" y="168" text-anchor="middle">uv add pandas …</text>
  <path class="ln" d="M166,163 L196,163" marker-end="url(#ah-uv-project)"/>
  <rect class="box" x="200" y="148" width="312" height="30" rx="5"/>
  <text class="ink sm b" x="210" y="168" text-anchor="start">.venv/</text>
  <text class="ink2 sm" x="504" y="168" text-anchor="end">сами библиотеки, сотни МБ</text>
  <rect class="box-err" x="524" y="148" width="162" height="30" rx="5"/>
  <text class="ink sm" x="605" y="168" text-anchor="middle">нет</text>
  <rect class="box-acc" x="14" y="186" width="150" height="30" rx="5"/>
  <text class="ink sm b" x="89" y="206" text-anchor="middle">вы сами</text>
  <path class="ln" d="M166,201 L196,201" marker-end="url(#ah-uv-project)"/>
  <rect class="box" x="200" y="186" width="312" height="30" rx="5"/>
  <text class="ink sm b" x="210" y="206" text-anchor="start">data/, report.ipynb</text>
  <text class="ink2 sm" x="504" y="206" text-anchor="end">данные и блокнот</text>
  <rect class="box-acc" x="524" y="186" width="162" height="30" rx="5"/>
  <text class="ink sm" x="605" y="206" text-anchor="middle">блокнот — да</text>
  <text class="ink2 sm" x="350" y="236" text-anchor="middle">у коллеги: pyproject.toml + uv.lock → uv sync → такая же .venv на его компьютере</text>
  <text class="mut sm" x="350" y="256" text-anchor="middle">.venv не пересылают и не кладут в git — её всегда можно собрать заново</text>
</svg>
