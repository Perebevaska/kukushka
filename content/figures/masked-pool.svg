<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-masked-pool">
  <title id="t-masked-pool">Пулинг с маской: среднее только по настоящим токенам; среднее «в лоб» тащит в вектор заполнители</title>
  <defs><marker id="ah-masked-pool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="30" y="40" width="90" height="50" rx="5"/>
  <text class="ink2 sm" x="75" y="60" text-anchor="middle">токен</text>
  <text class="ink sm b" x="75" y="80" text-anchor="middle">(1, 3)</text>
  <text class="ok sm b" x="75" y="110" text-anchor="middle">маска 1</text>
  <rect class="box-acc" x="130" y="40" width="90" height="50" rx="5"/>
  <text class="ink2 sm" x="175" y="60" text-anchor="middle">токен</text>
  <text class="ink sm b" x="175" y="80" text-anchor="middle">(3, 1)</text>
  <text class="ok sm b" x="175" y="110" text-anchor="middle">маска 1</text>
  <rect class="box dash" x="230" y="40" width="90" height="50" rx="5"/>
  <text class="ink2 sm" x="275" y="60" text-anchor="middle">[PAD]</text>
  <text class="ink sm b" x="275" y="80" text-anchor="middle">(0.5, −2)</text>
  <text class="err sm" x="275" y="110" text-anchor="middle">маска 0</text>
  <rect class="box dash" x="330" y="40" width="90" height="50" rx="5"/>
  <text class="ink2 sm" x="375" y="60" text-anchor="middle">[PAD]</text>
  <text class="ink sm b" x="375" y="80" text-anchor="middle">(0.5, −2)</text>
  <text class="err sm" x="375" y="110" text-anchor="middle">маска 0</text>
  <rect class="box-ok" x="450" y="30" width="236" height="56" rx="6"/>
  <text class="ink sm" x="568" y="52" text-anchor="middle">с маской: (1 + 3) / 2, (3 + 1) / 2</text>
  <text class="ink b" x="568" y="74" text-anchor="middle">= (2, 2)</text>
  <rect class="box-err" x="450" y="100" width="236" height="56" rx="6"/>
  <text class="ink sm" x="568" y="122" text-anchor="middle">в лоб: среднее по 4 позициям</text>
  <text class="ink b" x="568" y="144" text-anchor="middle">= (1.25, 0)</text>
  <path class="ln-ok" d="M230,40 C300,10 380,20 446,50" marker-end="url(#ah-masked-pool)"/>
  <path class="ln-err" d="M420,90 C430,110 440,120 446,126" marker-end="url(#ah-masked-pool)"/>
  <text class="ink2 sm" x="220" y="150" text-anchor="middle">число [PAD] зависит от самого длинного текста в пакете —</text>
  <text class="ink2 sm" x="220" y="168" text-anchor="middle">без маски вектор отзыва меняется вместе с соседями по пакету</text>
  <text class="acc sm b" x="350" y="210" text-anchor="middle">(H * mask[:, :, None]).sum(1) / mask.sum(1, keepdims=True)</text>
</svg>
