<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-batchnorm">
  <title id="t-nn-batchnorm">BatchNorm по одному нейрону на батче из четырёх гостей</title>
  <defs><marker id="ah-nn-batchnorm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="60" y="26" text-anchor="middle">выход нейрона x</text>
  <rect class="box" x="14" y="38" width="92" height="28" rx="5"/>
  <text class="ink sm" x="60" y="57" text-anchor="middle">2</text>
  <rect class="box" x="14" y="72" width="92" height="28" rx="5"/>
  <text class="ink sm" x="60" y="91" text-anchor="middle">4</text>
  <rect class="box" x="14" y="106" width="92" height="28" rx="5"/>
  <text class="ink sm" x="60" y="125" text-anchor="middle">6</text>
  <rect class="box" x="14" y="140" width="92" height="28" rx="5"/>
  <text class="ink sm" x="60" y="159" text-anchor="middle">8</text>
  <text class="ink sm b" x="290" y="26" text-anchor="middle">x̂ = (x − μ) / σ</text>
  <rect class="box-acc" x="244" y="38" width="92" height="28" rx="5"/>
  <text class="ink sm" x="290" y="57" text-anchor="middle">-1.342</text>
  <rect class="box-acc" x="244" y="72" width="92" height="28" rx="5"/>
  <text class="ink sm" x="290" y="91" text-anchor="middle">-0.447</text>
  <rect class="box-acc" x="244" y="106" width="92" height="28" rx="5"/>
  <text class="ink sm" x="290" y="125" text-anchor="middle">0.447</text>
  <rect class="box-acc" x="244" y="140" width="92" height="28" rx="5"/>
  <text class="ink sm" x="290" y="159" text-anchor="middle">1.342</text>
  <text class="ink sm b" x="530" y="26" text-anchor="middle">y = γ·x̂ + β</text>
  <rect class="box-ok" x="484" y="38" width="92" height="28" rx="5"/>
  <text class="ink sm" x="530" y="57" text-anchor="middle">-1.683</text>
  <rect class="box-ok" x="484" y="72" width="92" height="28" rx="5"/>
  <text class="ink sm" x="530" y="91" text-anchor="middle">0.106</text>
  <rect class="box-ok" x="484" y="106" width="92" height="28" rx="5"/>
  <text class="ink sm" x="530" y="125" text-anchor="middle">1.894</text>
  <rect class="box-ok" x="484" y="140" width="92" height="28" rx="5"/>
  <text class="ink sm" x="530" y="159" text-anchor="middle">3.683</text>
  <path class="ln" d="M110,100 L238,100" marker-end="url(#ah-nn-batchnorm)"/>
  <text class="ink2 sm b" x="174" y="86" text-anchor="middle">μ = 5</text>
  <text class="ink2 sm" x="174" y="120" text-anchor="middle">σ = √5 ≈ 2.236</text>
  <path class="ln" d="M340,100 L478,100" marker-end="url(#ah-nn-batchnorm)"/>
  <text class="ink2 sm b" x="409" y="86" text-anchor="middle">γ = 2, β = 1</text>
  <text class="ink2 sm" x="409" y="120" text-anchor="middle">обучаемые</text>
  <text class="mut sm" x="290" y="186" text-anchor="middle">среднее 0, отклонение 1</text>
  <text class="mut sm" x="530" y="186" text-anchor="middle">масштаб выбирает сеть</text>
  <text class="mut sm" x="60" y="186" text-anchor="middle">один столбец батча</text>
  <rect class="box-acc" x="20" y="206" width="320" height="82" rx="8"/>
  <text class="ink sm b" x="180" y="228" text-anchor="middle">model.train()</text>
  <text class="ink2 sm" x="180" y="248" text-anchor="middle">μ и σ — по текущему батчу</text>
  <text class="ink2 sm" x="180" y="268" text-anchor="middle">running = 0.9·running + 0.1·батч</text>
  <rect class="box-ok" x="360" y="206" width="320" height="82" rx="8"/>
  <text class="ink sm b" x="520" y="228" text-anchor="middle">model.eval()</text>
  <text class="ink2 sm" x="520" y="248" text-anchor="middle">μ и σ — накопленные running_mean/var</text>
  <text class="ink2 sm" x="520" y="268" text-anchor="middle">один гость нормируется как в любом батче</text>
  <path class="ln" d="M342,247 L358,247" marker-end="url(#ah-nn-batchnorm)"/>
</svg>
