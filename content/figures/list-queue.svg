<svg viewBox="0 0 700 272" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-list-queue">
  <title id="t-list-queue">Очередь у бара: insert, pop и extend меняют список</title>
  <defs><marker id="ah-list-queue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="100" y="22" text-anchor="middle">действие</text>
  <text class="mut sm" x="390" y="22" text-anchor="middle">список после действия (позиции 0, 1, 2…)</text>
  <text class="mut sm" x="632" y="22" text-anchor="middle">вернул</text>
  <text class="ink2 sm" x="12" y="53" text-anchor="start">исходная очередь</text>
  <rect class="box" x="206" y="32" width="70" height="32" rx="3"/>
  <text class="ink sm" x="241.0" y="53.0" text-anchor="middle">Латте</text>
  <rect class="box" x="280" y="32" width="70" height="32" rx="3"/>
  <text class="ink sm" x="315.0" y="53.0" text-anchor="middle">Раф</text>
  <rect class="box" x="354" y="32" width="70" height="32" rx="3"/>
  <text class="ink sm" x="389.0" y="53.0" text-anchor="middle">Чай</text>
  <text class="mut sm" x="638" y="53" text-anchor="middle">—</text>
  <text class="ink2 sm b" x="12" y="97" text-anchor="start">insert(0, "Американо")</text>
  <rect class="box-ok" x="206" y="76" width="70" height="32" rx="3"/>
  <text class="ink sm" x="241.0" y="97.0" text-anchor="middle">Американо</text>
  <rect class="box" x="280" y="76" width="70" height="32" rx="3"/>
  <text class="ink sm" x="315.0" y="97.0" text-anchor="middle">Латте</text>
  <rect class="box" x="354" y="76" width="70" height="32" rx="3"/>
  <text class="ink sm" x="389.0" y="97.0" text-anchor="middle">Раф</text>
  <rect class="box" x="428" y="76" width="70" height="32" rx="3"/>
  <text class="ink sm" x="463.0" y="97.0" text-anchor="middle">Чай</text>
  <text class="mut sm" x="638" y="97" text-anchor="middle">None</text>
  <text class="ink2 sm b" x="12" y="141" text-anchor="start">pop(0)</text>
  <rect class="box" x="206" y="120" width="70" height="32" rx="3"/>
  <text class="ink sm" x="241.0" y="141.0" text-anchor="middle">Латте</text>
  <rect class="box" x="280" y="120" width="70" height="32" rx="3"/>
  <text class="ink sm" x="315.0" y="141.0" text-anchor="middle">Раф</text>
  <rect class="box" x="354" y="120" width="70" height="32" rx="3"/>
  <text class="ink sm" x="389.0" y="141.0" text-anchor="middle">Чай</text>
  <rect class="box-acc" x="586" y="120" width="104" height="32" rx="4"/>
  <text class="ink sm b" x="638" y="141" text-anchor="middle">Американо</text>
  <text class="ink2 sm b" x="12" y="185" text-anchor="start">extend(["Мокко", "Какао"])</text>
  <rect class="box" x="206" y="164" width="70" height="32" rx="3"/>
  <text class="ink sm" x="241.0" y="185.0" text-anchor="middle">Латте</text>
  <rect class="box" x="280" y="164" width="70" height="32" rx="3"/>
  <text class="ink sm" x="315.0" y="185.0" text-anchor="middle">Раф</text>
  <rect class="box" x="354" y="164" width="70" height="32" rx="3"/>
  <text class="ink sm" x="389.0" y="185.0" text-anchor="middle">Чай</text>
  <rect class="box-ok" x="428" y="164" width="70" height="32" rx="3"/>
  <text class="ink sm" x="463.0" y="185.0" text-anchor="middle">Мокко</text>
  <rect class="box-ok" x="502" y="164" width="70" height="32" rx="3"/>
  <text class="ink sm" x="537.0" y="185.0" text-anchor="middle">Какао</text>
  <text class="mut sm" x="638" y="185" text-anchor="middle">None</text>
  <text class="ink2 sm b" x="12" y="229" text-anchor="start">pop()</text>
  <rect class="box" x="206" y="208" width="70" height="32" rx="3"/>
  <text class="ink sm" x="241.0" y="229.0" text-anchor="middle">Латте</text>
  <rect class="box" x="280" y="208" width="70" height="32" rx="3"/>
  <text class="ink sm" x="315.0" y="229.0" text-anchor="middle">Раф</text>
  <rect class="box" x="354" y="208" width="70" height="32" rx="3"/>
  <text class="ink sm" x="389.0" y="229.0" text-anchor="middle">Чай</text>
  <rect class="box" x="428" y="208" width="70" height="32" rx="3"/>
  <text class="ink sm" x="463.0" y="229.0" text-anchor="middle">Мокко</text>
  <rect class="box-acc" x="586" y="208" width="104" height="32" rx="4"/>
  <text class="ink sm b" x="638" y="229" text-anchor="middle">Какао</text>
  <text class="ink2 sm" x="350" y="264" text-anchor="middle">зелёным — добавленные элементы; значение отдаёт только pop — удалённый элемент</text>
</svg>
