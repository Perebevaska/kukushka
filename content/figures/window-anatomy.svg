<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-window-anatomy">
  <title id="t-window-anatomy">Из чего состоит оконная функция</title>
  <defs><marker id="ah-window-anatomy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="10" y="14" width="230" height="50" rx="5"/>
  <text class="ink b" x="20" y="44" text-anchor="start">AVG(revenue) OVER (</text>
  <path class="ln-mut" d="M242,39 H262" marker-end="url(#ah-window-anatomy)"/>
  <text class="ink sm b" x="268" y="29" text-anchor="start">что считать</text>
  <text class="ink2 sm" x="268" y="45" text-anchor="start">агрегат SUM, AVG, COUNT · номер ROW_NUMBER, RANK, NTILE</text>
  <text class="mut sm" x="268" y="60" text-anchor="start">сосед LAG, LEAD · край FIRST_VALUE, LAST_VALUE</text>
  <rect class="box-ok" x="30" y="72" width="210" height="50" rx="5"/>
  <text class="ink sm b" x="40" y="102" text-anchor="start">PARTITION BY shop_id</text>
  <path class="ln-mut" d="M242,97 H262" marker-end="url(#ah-window-anatomy)"/>
  <text class="ink sm b" x="268" y="87" text-anchor="start">на какие группы резать</text>
  <text class="ink2 sm" x="268" y="103" text-anchor="start">у каждой кофейни своё окно; строки не сворачиваются</text>
  <text class="mut sm" x="268" y="118" text-anchor="start">нет PARTITION BY — вся таблица одна группа</text>
  <rect class="box" x="30" y="130" width="210" height="50" rx="5"/>
  <text class="ink sm b" x="40" y="160" text-anchor="start">ORDER BY day</text>
  <path class="ln-mut" d="M242,155 H262" marker-end="url(#ah-window-anatomy)"/>
  <text class="ink sm b" x="268" y="145" text-anchor="start">в каком порядке внутри группы</text>
  <text class="ink2 sm" x="268" y="161" text-anchor="start">нужен рангам, LAG/LEAD, накопительным итогам</text>
  <text class="mut sm" x="268" y="176" text-anchor="start">не путать с ORDER BY в конце запроса</text>
  <rect class="box-warn" x="30" y="188" width="210" height="50" rx="5"/>
  <text class="ink sm b" x="40" y="210" text-anchor="start">ROWS BETWEEN 6 PRECEDING</text>
  <text class="ink sm b" x="40" y="228" text-anchor="start">  AND CURRENT ROW</text>
  <path class="ln-mut" d="M242,213 H262" marker-end="url(#ah-window-anatomy)"/>
  <text class="ink sm b" x="268" y="203" text-anchor="start">какую часть группы видит строка</text>
  <text class="ink2 sm" x="268" y="219" text-anchor="start">рамка: здесь — текущая строка и 6 до неё</text>
  <text class="mut sm" x="268" y="234" text-anchor="start">нет рамки при ORDER BY — от начала до текущей</text>
  <text class="ink b" x="20" y="262" text-anchor="start">)</text>
  <text class="ink2 sm" x="20" y="286" text-anchor="start">обязательны только функция и OVER ( ); пустые скобки OVER () — окно на всю таблицу</text>
</svg>
