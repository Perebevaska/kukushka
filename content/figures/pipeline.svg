<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-pipeline">
  <title id="t-pipeline">Pipeline: подготовка и модель как один объект</title>
  <defs><marker id="ah-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="70" width="96" height="70" rx="6"/>
  <text class="ink sm b" x="62" y="98" text-anchor="middle">сырые</text>
  <text class="ink2 sm" x="62" y="116" text-anchor="middle">X_train</text>
  <rect class="box-acc" x="140" y="16" width="330" height="178" rx="10"/>
  <text class="acc b" x="305" y="36" text-anchor="middle">ColumnTransformer</text>
  <rect class="box" x="156" y="48" width="145" height="64" rx="6"/>
  <text class="ink sm b" x="228" y="68" text-anchor="middle">числа</text>
  <text class="ink2 sm" x="228" y="86" text-anchor="middle">SimpleImputer(0)</text>
  <text class="ink2 sm" x="228" y="102" text-anchor="middle">→ StandardScaler</text>
  <rect class="box" x="311" y="48" width="145" height="64" rx="6"/>
  <text class="ink sm b" x="383" y="68" text-anchor="middle">категории</text>
  <text class="ink2 sm" x="383" y="86" text-anchor="middle">OneHotEncoder</text>
  <text class="ink2 sm" x="383" y="102" text-anchor="middle">новая категория → нули</text>
  <rect class="box" x="156" y="122" width="300" height="56" rx="6"/>
  <text class="ink2 sm" x="305" y="144" text-anchor="middle">fit запоминает средние и разбросы для масштаба</text>
  <text class="ink2 sm" x="305" y="162" text-anchor="middle">и список категорий — только по train</text>
  <path class="ln" d="M112,105 L136,105" marker-end="url(#ah-pipeline)"/>
  <path class="ln" d="M474,105 L500,105" marker-end="url(#ah-pipeline)"/>
  <rect class="box-ok" x="504" y="70" width="100" height="70" rx="8"/>
  <text class="ink b" x="554" y="100" text-anchor="middle">модель</text>
  <text class="ink2 sm" x="554" y="120" text-anchor="middle">лес / LR</text>
  <path class="ln" d="M606,105 L628,105" marker-end="url(#ah-pipeline)"/>
  <rect class="box-warn" x="632" y="82" width="58" height="46" rx="6"/>
  <text class="ink sm b" x="661" y="110" text-anchor="middle">proba</text>
  <text class="ink2 sm" x="350" y="222" text-anchor="middle">pipe.fit(X_train, y_train) обучает всё сразу; pipe.predict(X_new) повторяет ту же подготовку</text>
  <text class="mut sm" x="350" y="240" text-anchor="middle">в cross_val_score конвейер учит подготовку заново на каждом фолде — без утечки</text>
</svg>
