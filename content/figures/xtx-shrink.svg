<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-xtx-shrink">
  <title id="t-xtx-shrink">Нормальное уравнение сжимает 1841 строку в систему 4 × 4</title>
  <defs><marker id="ah-xtx-shrink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="120" y="26" text-anchor="middle">X1ᵀ</text>
  <rect class="box-acc" x="30" y="36" width="180" height="44" rx="4"/>
  <text class="ink sm" x="120" y="63" text-anchor="middle">4 × 1841</text>
  <text class="ink b" x="232" y="64" text-anchor="middle">@</text>
  <text class="ink b" x="275" y="26" text-anchor="middle">X1</text>
  <rect class="box-acc" x="252" y="36" width="46" height="180" rx="4"/>
  <text class="ink sm" x="275" y="120" text-anchor="middle">1841</text>
  <text class="ink sm" x="275" y="136" text-anchor="middle">×</text>
  <text class="ink sm" x="275" y="152" text-anchor="middle">4</text>
  <text class="ink b" x="322" y="64" text-anchor="middle">=</text>
  <text class="ink b" x="380" y="26" text-anchor="middle">X1ᵀX1</text>
  <rect class="box-ok" x="344" y="36" width="72" height="72" rx="4"/>
  <text class="ink sm b" x="380" y="77" text-anchor="middle">4 × 4</text>
  <text class="ok sm" x="380" y="128" text-anchor="middle">и X1ᵀy — 4 числа</text>
  <text class="ink sm b" x="460" y="40" text-anchor="start">на игрушке (x = 1…4 км):</text>
  <rect class="box-ok" x="460" y="52" width="66" height="36" rx="3"/>
  <text class="ink sm b" x="493" y="68" text-anchor="middle">4</text>
  <text class="mut sm" x="493" y="82" text-anchor="middle">n</text>
  <rect class="box-ok" x="530" y="52" width="66" height="36" rx="3"/>
  <text class="ink sm b" x="563" y="68" text-anchor="middle">10</text>
  <text class="mut sm" x="563" y="82" text-anchor="middle">Σx</text>
  <rect class="box-ok" x="460" y="92" width="66" height="36" rx="3"/>
  <text class="ink sm b" x="493" y="108" text-anchor="middle">10</text>
  <text class="mut sm" x="493" y="122" text-anchor="middle">Σx</text>
  <rect class="box-ok" x="530" y="92" width="66" height="36" rx="3"/>
  <text class="ink sm b" x="563" y="108" text-anchor="middle">30</text>
  <text class="mut sm" x="563" y="122" text-anchor="middle">Σx²</text>
  <text class="ink sm" x="610" y="76" text-anchor="start">X1ᵀy:</text>
  <text class="ink sm" x="610" y="96" text-anchor="start">Σy = 24</text>
  <text class="ink sm" x="610" y="116" text-anchor="start">Σxy = 71</text>
  <path class="ln-acc" d="M380,150 L380,178" marker-end="url(#ah-xtx-shrink)"/>
  <rect class="box-warn" x="316" y="182" width="128" height="34" rx="6"/>
  <text class="ink sm b" x="380.0" y="203.5" text-anchor="middle">solve → 4 веса</text>
  <text class="ink2 sm" x="350" y="250" text-anchor="middle">каждый элемент X1ᵀX1 и X1ᵀy — сумма по всем строкам: строки «спрятаны» в суммах</text>
  <text class="mut sm" x="350" y="270" text-anchor="middle">размер системы задаёт число столбцов (весов), а не число доставок</text>
</svg>
