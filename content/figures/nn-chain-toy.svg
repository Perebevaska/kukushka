<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-chain-toy">
  <title id="t-nn-chain-toy">Сеть из одного скрытого нейрона: значения вперёд и градиенты назад</title>
  <defs><marker id="ah-nn-chain-toy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="6" y="86" width="68" height="48" rx="8"/>
  <text class="ink b" x="40" y="106" text-anchor="middle">x</text>
  <text class="acc sm b" x="40" y="125" text-anchor="middle">1</text>
  <rect class="box" x="126" y="86" width="68" height="48" rx="8"/>
  <text class="ink b" x="160" y="106" text-anchor="middle">z₁</text>
  <text class="acc sm b" x="160" y="125" text-anchor="middle">0.5</text>
  <rect class="box" x="246" y="86" width="68" height="48" rx="8"/>
  <text class="ink b" x="280" y="106" text-anchor="middle">h</text>
  <text class="acc sm b" x="280" y="125" text-anchor="middle">0.5</text>
  <rect class="box" x="366" y="86" width="68" height="48" rx="8"/>
  <text class="ink b" x="400" y="106" text-anchor="middle">z₂</text>
  <text class="acc sm b" x="400" y="125" text-anchor="middle">1.0</text>
  <rect class="box" x="486" y="86" width="68" height="48" rx="8"/>
  <text class="ink b" x="520" y="106" text-anchor="middle">p</text>
  <text class="acc sm b" x="520" y="125" text-anchor="middle">0.731</text>
  <rect class="box-ok" x="606" y="86" width="68" height="48" rx="8"/>
  <text class="ink b" x="640" y="106" text-anchor="middle">L</text>
  <text class="acc sm b" x="640" y="125" text-anchor="middle">0.313</text>
  <path class="ln-acc" d="M74,102 L126,102" marker-end="url(#ah-nn-chain-toy)"/>
  <text class="ink2 sm" x="100.0" y="76" text-anchor="middle">× w₁ = 0.5</text>
  <path class="ln-acc" d="M194,102 L246,102" marker-end="url(#ah-nn-chain-toy)"/>
  <text class="ink2 sm" x="220.0" y="76" text-anchor="middle">ReLU</text>
  <path class="ln-acc" d="M314,102 L366,102" marker-end="url(#ah-nn-chain-toy)"/>
  <text class="ink2 sm" x="340.0" y="76" text-anchor="middle">× w₂ = 2</text>
  <path class="ln-acc" d="M434,102 L486,102" marker-end="url(#ah-nn-chain-toy)"/>
  <text class="ink2 sm" x="460.0" y="76" text-anchor="middle">сигмоида</text>
  <path class="ln-acc" d="M554,102 L606,102" marker-end="url(#ah-nn-chain-toy)"/>
  <text class="ink2 sm" x="580.0" y="76" text-anchor="middle">−log p, y = 1</text>
  <text class="acc sm b" x="20" y="40" text-anchor="start">вперёд: считаем значения узлов</text>
  <path class="ln-err dash" d="M640,134 L640,174 L40,174" marker-end="url(#ah-nn-chain-toy)"/>
  <text class="err sm b" x="634" y="168" text-anchor="end">назад: от потери к входу</text>
  <rect class="box-err" x="455" y="188" width="210" height="50" rx="6"/>
  <text class="ink sm" x="560" y="206" text-anchor="middle">∂L/∂z₂ = p − y = −0.269</text>
  <text class="ink sm b" x="560" y="226" text-anchor="middle">∂L/∂w₂ = −0.269 · h = −0.134</text>
  <rect class="box-err" x="235" y="188" width="210" height="50" rx="6"/>
  <text class="ink sm" x="340" y="206" text-anchor="middle">∂L/∂h = −0.269 · w₂ = −0.538</text>
  <text class="ink2 sm" x="340" y="226" text-anchor="middle">ReLU: z₁ = 0.5 &gt; 0 — пропускает</text>
  <rect class="box-err" x="15" y="188" width="210" height="50" rx="6"/>
  <text class="ink sm" x="120" y="206" text-anchor="middle">∂L/∂z₁ = −0.538</text>
  <text class="ink sm b" x="120" y="226" text-anchor="middle">∂L/∂w₁ = −0.538 · x = −0.538</text>
  <text class="mut sm" x="350" y="258" text-anchor="middle">оба градиента отрицательные: шаг w ← w − lr · градиент увеличит w₁ и w₂, и p приблизится к 1</text>
</svg>
