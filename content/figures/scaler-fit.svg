<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-scaler-fit">
  <title id="t-scaler-fit">StandardScaler: fit только на train, transform — везде</title>
  <defs><marker id="ah-scaler-fit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="20" y="30" width="140" height="44" rx="6"/>
  <text class="ink sm b" x="90.0" y="48.0" text-anchor="middle">X_train</text>
  <text class="ink2 sm" x="90.0" y="65.0" text-anchor="middle">1 800 гостей</text>
  <path class="ln" d="M162,52 L218,52" marker-end="url(#ah-scaler-fit)"/>
  <text class="acc sm b" x="190" y="44" text-anchor="middle">fit</text>
  <rect class="box" x="222" y="22" width="220" height="62" rx="6"/>
  <text class="ink sm b" x="332.0" y="40.5" text-anchor="middle">scaler запомнил:</text>
  <text class="ink2 sm" x="332.0" y="57.5" text-anchor="middle">mean_: давность 20.44 дня</text>
  <text class="ink2 sm" x="332.0" y="74.5" text-anchor="middle">scale_: давность 35.36 дня</text>
  <path class="ln" d="M442,70 L476,130" marker-end="url(#ah-scaler-fit)"/>
  <rect class="box-ok" x="480" y="108" width="200" height="44" rx="6"/>
  <text class="ink sm b" x="580.0" y="126.0" text-anchor="middle">transform(X_train)</text>
  <text class="ink2 sm" x="580.0" y="143.0" text-anchor="middle">среднее ровно 0</text>
  <path class="ln" d="M442,70 L476,182" marker-end="url(#ah-scaler-fit)"/>
  <rect class="box-ok" x="480" y="160" width="200" height="44" rx="6"/>
  <text class="ink sm b" x="580.0" y="178.0" text-anchor="middle">transform(X_test)</text>
  <text class="ink2 sm" x="580.0" y="195.0" text-anchor="middle">среднее около 0, не ровно</text>
  <path class="ln" d="M442,70 L476,234" marker-end="url(#ah-scaler-fit)"/>
  <rect class="box-ok" x="480" y="212" width="200" height="44" rx="6"/>
  <text class="ink sm b" x="580.0" y="230.0" text-anchor="middle">transform(новые)</text>
  <text class="ink2 sm" x="580.0" y="247.0" text-anchor="middle">те же mean_ и scale_</text>
  <rect class="box-err" x="20" y="120" width="330" height="74" rx="6"/>
  <text class="ink sm b" x="185.0" y="144.5" text-anchor="middle">✗ StandardScaler().fit(X) до разбиения</text>
  <text class="ink sm b" x="185.0" y="161.5" text-anchor="middle">✗ отдельный fit на X_test</text>
  <text class="ink2 sm" x="185.0" y="178.5" text-anchor="middle">средние и разбросы «подсмотрели» тест — утечка</text>
  <text class="ink2 sm" x="350" y="280" text-anchor="middle">z = (x − mean_) / scale_; гость с давностью 113 дней → (113 − 20.44) / 35.36 ≈ 2.62</text>
</svg>
