<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-count-size">
  <title id="t-count-size">size, count и nunique на одной группе</title>
  <defs><marker id="ah-count-size" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="110" y="26" text-anchor="middle">заказы PRM-1 (условно)</text>
  <rect class="box-acc" x="40" y="36" width="140" height="28" rx="4"/>
  <text class="ink sm" x="110" y="55" text-anchor="middle">client_id = 101</text>
  <rect class="box-err" x="40" y="68" width="140" height="28" rx="4"/>
  <text class="err sm b" x="110" y="87" text-anchor="middle">client_id = NaN</text>
  <rect class="box-acc" x="40" y="100" width="140" height="28" rx="4"/>
  <text class="ink sm" x="110" y="119" text-anchor="middle">client_id = 101</text>
  <rect class="box-ok" x="40" y="132" width="140" height="28" rx="4"/>
  <text class="ink sm" x="110" y="151" text-anchor="middle">client_id = 205</text>
  <text class="ink b" x="260" y="60" text-anchor="start">size()</text>
  <rect class="box-ok" x="360" y="40" width="50" height="30" rx="4"/>
  <text class="ink b" x="385" y="61" text-anchor="middle">4</text>
  <text class="ink2 sm" x="426" y="54" text-anchor="start">все строки группы</text>
  <text class="mut sm" x="426" y="70" text-anchor="start">считает и пустые</text>
  <text class="ink b" x="260" y="104" text-anchor="start">count()</text>
  <rect class="box-ok" x="360" y="84" width="50" height="30" rx="4"/>
  <text class="ink b" x="385" y="105" text-anchor="middle">3</text>
  <text class="ink2 sm" x="426" y="98" text-anchor="start">непустые значения</text>
  <text class="mut sm" x="426" y="114" text-anchor="start">NaN пропущен</text>
  <text class="ink b" x="260" y="148" text-anchor="start">nunique()</text>
  <rect class="box-ok" x="360" y="128" width="50" height="30" rx="4"/>
  <text class="ink b" x="385" y="149" text-anchor="middle">2</text>
  <text class="ink2 sm" x="426" y="142" text-anchor="start">разные непустые</text>
  <text class="mut sm" x="426" y="158" text-anchor="start">101 — один раз</text>
  <text class="ink2 sm" x="350" y="196" text-anchor="middle">size — число заказов, count — заказов с картой, nunique — число разных гостей (COUNT DISTINCT).</text>
</svg>
