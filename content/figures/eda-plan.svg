<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-eda-plan">
  <title id="t-eda-plan">План EDA: шесть шагов от вопроса к выводу</title>
  <defs><marker id="ah-eda-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20" y="30" width="200" height="56" rx="8"/>
  <text class="ink b" x="120" y="54" text-anchor="middle">1. Вопрос и метрика</text>
  <text class="ink2 sm" x="120" y="74" text-anchor="middle">доля опозданий</text>
  <rect class="box" x="250" y="30" width="200" height="56" rx="8"/>
  <text class="ink b" x="350" y="54" text-anchor="middle">2. Осмотр и очистка</text>
  <text class="ink2 sm" x="350" y="74" text-anchor="middle">глава 3, журнал</text>
  <rect class="box-acc" x="480" y="30" width="200" height="56" rx="8"/>
  <text class="ink b" x="580" y="54" text-anchor="middle">3. Каждый признак</text>
  <text class="ink2 sm" x="580" y="74" text-anchor="middle">гистограмма, ящик</text>
  <rect class="box-acc" x="480" y="150" width="200" height="56" rx="8"/>
  <text class="ink b" x="580" y="174" text-anchor="middle">4. Метрика по признакам</text>
  <text class="ink2 sm" x="580" y="194" text-anchor="middle">срезы, динамика, связи</text>
  <rect class="box-acc" x="250" y="150" width="200" height="56" rx="8"/>
  <text class="ink b" x="350" y="174" text-anchor="middle">5. Проверка смешения</text>
  <text class="ink2 sm" x="350" y="194" text-anchor="middle">срез по двум признакам</text>
  <rect class="box-ok" x="20" y="150" width="200" height="56" rx="8"/>
  <text class="ink b" x="120" y="174" text-anchor="middle">6. Выводы</text>
  <text class="ink2 sm" x="120" y="194" text-anchor="middle">цифра + n + ограничение</text>
  <path class="ln" d="M222,58 L246,58" marker-end="url(#ah-eda-plan)"/>
  <path class="ln" d="M452,58 L476,58" marker-end="url(#ah-eda-plan)"/>
  <path class="ln" d="M580,88 L580,146" marker-end="url(#ah-eda-plan)"/>
  <path class="ln" d="M478,178 L454,178" marker-end="url(#ah-eda-plan)"/>
  <path class="ln" d="M248,178 L224,178" marker-end="url(#ah-eda-plan)"/>
  <rect class="box-warn" x="236" y="98" width="228" height="40" rx="6"/>
  <text class="ink sm b" x="350" y="114" text-anchor="middle">список гипотез</text>
  <text class="ink2 sm" x="350" y="130" text-anchor="middle">шаги 3–5 повторяются по кругу</text>
  <text class="ink2 sm" x="350" y="236" text-anchor="middle">Каждую гипотезу закрывают: подтвердилась · не подтвердилась · данных не хватает</text>
  <text class="mut sm" x="350" y="258" text-anchor="middle">«снег», «одна кофейня», «часы пик» — проверяются по очереди, а не сотней случайных графиков</text>
</svg>
