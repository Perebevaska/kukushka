<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-dummies-reindex">
  <title id="t-dummies-reindex">reindex выравнивает флаги новых заказов по столбцам обучения</title>
  <defs><marker id="ah-dummies-reindex" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="130" y="22" text-anchor="middle">get_dummies(new)</text>
  <text class="ink sm b" x="550" y="22" text-anchor="middle">столбцы обучения X.columns</text>
  <rect class="box" x="40" y="34" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="130.0" y="51.5" text-anchor="middle">distance_km</text>
  <rect class="box" x="40" y="64" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="130.0" y="81.5" text-anchor="middle">courier_авто</text>
  <rect class="box" x="40" y="94" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="130.0" y="111.5" text-anchor="middle">courier_пеший</text>
  <rect class="box" x="40" y="124" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="130.0" y="141.5" text-anchor="middle">weather_снег</text>
  <rect class="box-err" x="40" y="154" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="130.0" y="171.5" text-anchor="middle">weather_туман</text>
  <rect class="box-ok" x="460" y="34" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="550.0" y="51.5" text-anchor="middle">distance_km</text>
  <path class="ln-mut" d="M222,47 L458,47" marker-end="url(#ah-dummies-reindex)"/>
  <rect class="box-ok" x="460" y="64" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="550.0" y="81.5" text-anchor="middle">courier_авто</text>
  <path class="ln-mut" d="M222,77 L458,77" marker-end="url(#ah-dummies-reindex)"/>
  <rect class="box-warn" x="460" y="94" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="550.0" y="111.5" text-anchor="middle">courier_вело</text>
  <rect class="box-ok" x="460" y="124" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="550.0" y="141.5" text-anchor="middle">courier_пеший</text>
  <path class="ln-mut" d="M222,107 L458,137" marker-end="url(#ah-dummies-reindex)"/>
  <rect class="box-warn" x="460" y="154" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="550.0" y="171.5" text-anchor="middle">weather_дождь</text>
  <rect class="box-warn" x="460" y="184" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="550.0" y="201.5" text-anchor="middle">weather_облачно</text>
  <rect class="box-ok" x="460" y="214" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="550.0" y="231.5" text-anchor="middle">weather_снег</text>
  <path class="ln-mut" d="M222,137 L458,227" marker-end="url(#ah-dummies-reindex)"/>
  <rect class="box-warn" x="460" y="244" width="180" height="26" rx="6"/>
  <text class="ink2 sm" x="550.0" y="261.5" text-anchor="middle">weather_ясно</text>
  <rect class="box-err" x="20" y="284" width="200" height="40" rx="6"/>
  <text class="ink sm b" x="120.0" y="300.0" text-anchor="middle">weather_туман:</text>
  <text class="ink2 sm" x="120.0" y="317.0" text-anchor="middle">незнакомый → выброшен</text>
  <rect class="box-warn" x="240" y="284" width="200" height="40" rx="6"/>
  <text class="ink2 sm" x="340.0" y="300.0" text-anchor="middle">жёлтые: не было в new</text>
  <text class="ink2 sm" x="340.0" y="317.0" text-anchor="middle">→ добавлены нулями</text>
  <rect class="box-ok" x="460" y="284" width="220" height="40" rx="6"/>
  <text class="ink2 sm" x="570.0" y="300.0" text-anchor="middle">порядок — как при обучении</text>
  <text class="ink sm b" x="570.0" y="317.0" text-anchor="middle">reindex(columns=X.columns)</text>
  <text class="mut sm" x="350" y="350" text-anchor="middle">fill_value=0: туман для модели — «ни одна из известных погод»</text>
</svg>
