<svg viewBox="0 0 700 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-city-chain">
  <title id="t-city-chain">Цепочка методов .str: как пять написаний города приходят к одному виду</title>
  <defs><marker id="ah-city-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="73.0" y="22" text-anchor="middle">исходное</text>
  <text class="acc sm b" x="204.0" y="22" text-anchor="middle">strip().lower()</text>
  <path class="ln" d="M128,30 L140,30" marker-end="url(#ah-city-chain)"/>
  <text class="acc sm b" x="345.0" y="22" text-anchor="middle">removeprefix("г.")</text>
  <text class="acc sm b" x="345.0" y="38" text-anchor="middle">.strip()</text>
  <path class="ln" d="M262,30 L274,30" marker-end="url(#ah-city-chain)"/>
  <text class="acc sm b" x="495.0" y="22" text-anchor="middle">replace({"екб": …})</text>
  <path class="ln" d="M410,30 L422,30" marker-end="url(#ah-city-chain)"/>
  <text class="acc sm b" x="631.0" y="22" text-anchor="middle">capitalize()</text>
  <path class="ln" d="M562,30 L574,30" marker-end="url(#ah-city-chain)"/>
  <rect class="box" x="9" y="50" width="682" height="26" rx="3"/>
