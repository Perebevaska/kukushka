<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-anti-join">
  <title id="t-anti-join">Антисоединение: LEFT JOIN и IS NULL</title>
  <defs><marker id="ah-anti-join" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="111.0" y="42" text-anchor="middle">menu (3 из 15 позиций)</text>
  <rect class="box" x="20" y="50" width="182" height="24" rx="3"/>
  <text class="ink2 sm b" x="46.0" y="66.5" text-anchor="middle">item_id</text>
  <text class="ink2 sm b" x="137.0" y="66.5" text-anchor="middle">name</text>
  <rect class="box" x="20" y="76" width="182" height="24" rx="3"/>
  <text class="ink sm" x="46.0" y="92.5" text-anchor="middle">M03</text>
  <text class="ink sm" x="137.0" y="92.5" text-anchor="middle">Капучино</text>
  <rect class="box" x="20" y="102" width="182" height="24" rx="3"/>
  <text class="ink sm" x="46.0" y="118.5" text-anchor="middle">M10</text>
  <text class="ink sm" x="137.0" y="118.5" text-anchor="middle">Лимонад</text>
  <rect class="box-warn" x="20" y="128" width="182" height="24" rx="3"/>
  <text class="ink sm" x="46.0" y="144.5" text-anchor="middle">M15</text>
  <text class="ink sm" x="137.0" y="144.5" text-anchor="middle">Тыквенный латте</text>
  <path class="ln" d="M206,100 L246,100" marker-end="url(#ah-anti-join)"/>
  <text class="ink2 sm b" x="226" y="88" text-anchor="middle">LEFT</text>
  <text class="ink2 sm b" x="226" y="128" text-anchor="middle">JOIN</text>
  <text class="ink2 sm b" x="226" y="144" text-anchor="middle">items</text>
  <text class="mut sm" x="387.0" y="42" text-anchor="middle">результат LEFT JOIN</text>
  <rect class="box" x="250" y="50" width="274" height="24" rx="3"/>
  <text class="ink2 sm b" x="276.0" y="66.5" text-anchor="middle">item_id</text>
  <text class="ink2 sm b" x="367.0" y="66.5" text-anchor="middle">name</text>
  <text class="ink2 sm b" x="478.0" y="66.5" text-anchor="middle">i.item_id</text>
  <rect class="box" x="250" y="76" width="274" height="24" rx="3"/>
  <text class="ink sm" x="276.0" y="92.5" text-anchor="middle">M03</text>
  <text class="ink sm" x="367.0" y="92.5" text-anchor="middle">Капучино</text>
  <text class="ink sm" x="478.0" y="92.5" text-anchor="middle">3 509 строк</text>
  <rect class="box" x="250" y="102" width="274" height="24" rx="3"/>
  <text class="ink sm" x="276.0" y="118.5" text-anchor="middle">M10</text>
  <text class="ink sm" x="367.0" y="118.5" text-anchor="middle">Лимонад</text>
  <text class="ink sm" x="478.0" y="118.5" text-anchor="middle">1 224 строки</text>
  <rect class="box-warn" x="250" y="128" width="274" height="24" rx="3"/>
  <text class="ink sm" x="276.0" y="144.5" text-anchor="middle">M15</text>
  <text class="ink sm" x="367.0" y="144.5" text-anchor="middle">Тыквенный латте</text>
  <text class="err sm b" x="478.0" y="144.5" text-anchor="middle">NULL</text>
  <text class="mut sm" x="387" y="172" text-anchor="middle">у проданных позиций — по строке на каждую продажу</text>
  <rect class="box-ok" x="20" y="204" width="320" height="72" rx="6"/>
  <text class="ok b" x="180.0" y="226.5" text-anchor="middle">WHERE i.item_id IS NULL</text>
  <text class="ink2 sm" x="180.0" y="244.5" text-anchor="middle">остаются строки без пары справа:</text>
  <text class="ink sm b" x="180.0" y="262.5" text-anchor="middle">Тыквенный латте — ни одной продажи</text>
  <rect class="box-err" x="360" y="204" width="320" height="72" rx="6"/>
  <text class="err b" x="520.0" y="226.5" text-anchor="middle">WHERE i.qty &gt; 0</text>
  <text class="ink2 sm" x="520.0" y="244.5" text-anchor="middle">qty &gt; 0 для NULL — «неизвестно»:</text>
  <text class="ink sm b" x="520.0" y="262.5" text-anchor="middle">строка без пары отброшена, список пуст</text>
  <path class="ln" d="M360,180 L220,202" marker-end="url(#ah-anti-join)"/>
  <path class="ln" d="M414,180 L500,202" marker-end="url(#ah-anti-join)"/>
  <text class="ink2 sm" x="350" y="302" text-anchor="middle">условие на правую таблицу в WHERE превращает LEFT JOIN во внутренний;</text>
  <text class="ink2 sm" x="350" y="320" text-anchor="middle">фильтр для правой таблицы ставят в ON, а «чего нет» ищут через IS NULL</text>
</svg>
