<svg viewBox="0 0 700 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-pd-steps">
  <title id="t-pd-steps">Частичная зависимость: одна точка кривой — средний прогноз при подменённом признаке</title>
  <defs><marker id="ah-pd-steps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink2 sm b" x="102" y="30" text-anchor="middle">гости как есть</text>
  <rect class="box" x="14" y="40" width="176" height="24" rx="3"/>
  <text class="ink2 sm b" x="42.0" y="56" text-anchor="middle">гость</text>
  <text class="ink2 sm b" x="98.0" y="56" text-anchor="middle">дней</text>
  <text class="ink2 sm b" x="158.0" y="56" text-anchor="middle">прогноз</text>
  <rect class="box" x="14" y="66" width="176" height="24" rx="3"/>
  <text class="ink sm" x="42.0" y="82" text-anchor="middle">1</text>
  <text class="ink sm" x="98.0" y="82" text-anchor="middle">2</text>
  <text class="ink sm" x="158.0" y="82" text-anchor="middle">0.02</text>
  <rect class="box" x="14" y="92" width="176" height="24" rx="3"/>
  <text class="ink sm" x="42.0" y="108" text-anchor="middle">2</text>
  <text class="ink sm" x="98.0" y="108" text-anchor="middle">6</text>
  <text class="ink sm" x="158.0" y="108" text-anchor="middle">0.07</text>
  <rect class="box" x="14" y="118" width="176" height="24" rx="3"/>
  <text class="ink sm" x="42.0" y="134" text-anchor="middle">3</text>
  <text class="ink sm" x="98.0" y="134" text-anchor="middle">1</text>
  <text class="ink sm" x="158.0" y="134" text-anchor="middle">0.05</text>
  <text class="acc sm b" x="320" y="30" text-anchor="middle">копия: всем 30 дней</text>
  <rect class="box" x="232" y="40" width="176" height="24" rx="3"/>
  <text class="ink2 sm b" x="260.0" y="56" text-anchor="middle">гость</text>
  <text class="ink2 sm b" x="316.0" y="56" text-anchor="middle">дней</text>
  <text class="ink2 sm b" x="376.0" y="56" text-anchor="middle">прогноз</text>
  <rect class="box" x="232" y="66" width="176" height="24" rx="3"/>
  <text class="ink sm" x="260.0" y="82" text-anchor="middle">1</text>
  <text class="acc sm b" x="316.0" y="82" text-anchor="middle">30</text>
  <text class="ink sm" x="376.0" y="82" text-anchor="middle">0.22</text>
  <rect class="box" x="232" y="92" width="176" height="24" rx="3"/>
  <text class="ink sm" x="260.0" y="108" text-anchor="middle">2</text>
  <text class="acc sm b" x="316.0" y="108" text-anchor="middle">30</text>
  <text class="ink sm" x="376.0" y="108" text-anchor="middle">0.42</text>
  <rect class="box" x="232" y="118" width="176" height="24" rx="3"/>
  <text class="ink sm" x="260.0" y="134" text-anchor="middle">3</text>
  <text class="acc sm b" x="316.0" y="134" text-anchor="middle">30</text>
  <text class="ink sm" x="376.0" y="134" text-anchor="middle">0.25</text>
  <path class="ln" d="M194,104 L228,104" marker-end="url(#ah-pd-steps)"/>
  <text class="ink2 sm" x="320" y="168" text-anchor="middle">средний прогноз:</text>
  <text class="ink sm b" x="320" y="186" text-anchor="middle">(0.22 + 0.42 + 0.25) / 3 ≈ 0.30</text>
  <text class="mut sm" x="102" y="170" text-anchor="middle">остальные признаки — свои</text>
  <path class="ln" d="M476,210 L676,210"/>
  <path class="ln" d="M476,210 L476,60"/>
  <text class="mut sm" x="470" y="214.0" text-anchor="end">0</text>
  <text class="mut sm" x="470" y="164.0" text-anchor="end">0.2</text>
  <text class="mut sm" x="470" y="113.99999999999999" text-anchor="end">0.4</text>
  <text class="mut sm" x="470" y="64.0" text-anchor="end">0.6</text>
  <text class="mut sm" x="476.0" y="226" text-anchor="middle">0</text>
  <text class="mut sm" x="509.3333333333333" y="226" text-anchor="middle">30</text>
  <text class="mut sm" x="576.0" y="226" text-anchor="middle">90</text>
  <text class="mut sm" x="676.0" y="226" text-anchor="middle">180</text>
  <text class="mut sm" x="576.0" y="244" text-anchor="middle">дней без визита (всем гостям)</text>
  <text class="ink2 sm b" x="576.0" y="30" text-anchor="middle">кривая на 600 гостях теста</text>
  <path class="ln-acc" d="M476.0,174.75 L483.77777777777777,169.0 L491.55555555555554,164.75 L509.3333333333333,114.99999999999999 L526.0,105.25 L542.6666666666666,93.49999999999999 L576.0,89.5 L609.3333333333333,85.49999999999999 L676.0,83.24999999999999"/>
  <circle class="box-acc" cx="476.0" cy="174.75" r="3.5"/>
  <circle class="box-acc" cx="483.77777777777777" cy="169.0" r="3.5"/>
  <circle class="box-acc" cx="491.55555555555554" cy="164.75" r="3.5"/>
  <circle class="box-warn" cx="509.3333333333333" cy="114.99999999999999" r="6"/>
  <circle class="box-acc" cx="526.0" cy="105.25" r="3.5"/>
  <circle class="box-acc" cx="542.6666666666666" cy="93.49999999999999" r="3.5"/>
  <circle class="box-acc" cx="576.0" cy="89.5" r="3.5"/>
  <circle class="box-acc" cx="609.3333333333333" cy="85.49999999999999" r="3.5"/>
  <circle class="box-acc" cx="676.0" cy="83.24999999999999" r="3.5"/>
  <text class="ink sm b" x="521.3333333333333" y="135.0" text-anchor="start">30 дней → 0.38</text>
  <path class="ln" d="M412,180 Q450,170 500.3333333333333,117.99999999999999" marker-end="url(#ah-pd-steps)"/>
  <text class="ink2 sm" x="320" y="222" text-anchor="middle">одна подмена = одна точка;</text>
  <text class="ink2 sm" x="320" y="240" text-anchor="middle">повторяем для 0, 7, 14 … 180 дней</text>
  <text class="mut sm" x="350" y="280" text-anchor="middle">на трёх гостях среднее 0.30, на всех 600 — 0.38: тот же расчёт, больше гостей</text>
  <text class="mut sm" x="350" y="302" text-anchor="middle">кривая — про модель, а не про мир: «если гость вернётся, риск упадёт» — гипотеза для эксперимента</text>
</svg>
