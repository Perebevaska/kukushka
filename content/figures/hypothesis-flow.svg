<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-hypothesis-flow">
  <title id="t-hypothesis-flow">Гипотеза с правилом решения: порог назначают до расчёта</title>
  <defs><marker id="ah-hypothesis-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="30" width="120" height="70" rx="8"/>
  <text class="ink sm b" x="74" y="52" text-anchor="middle">утверждение</text>
  <text class="ink2 sm" x="74" y="72" text-anchor="middle">с картой тратят</text>
  <text class="ink2 sm" x="74" y="88" text-anchor="middle">больше</text>
  <path class="ln" d="M136,65 L150,65" marker-end="url(#ah-hypothesis-flow)"/>
  <rect class="box" x="152" y="30" width="120" height="70" rx="8"/>
  <text class="ink sm b" x="212" y="52" text-anchor="middle">метрика</text>
  <text class="ink2 sm" x="212" y="72" text-anchor="middle">разница среднего</text>
  <text class="ink2 sm" x="212" y="88" text-anchor="middle">чека, %</text>
  <path class="ln" d="M274,65 L288,65" marker-end="url(#ah-hypothesis-flow)"/>
  <rect class="box-warn" x="290" y="30" width="120" height="70" rx="8"/>
  <text class="ink sm b" x="350" y="52" text-anchor="middle">порог</text>
  <text class="ink2 sm" x="350" y="72" text-anchor="middle">не меньше 5 %</text>
  <path class="ln" d="M412,65 L426,65" marker-end="url(#ah-hypothesis-flow)"/>
  <rect class="box" x="428" y="30" width="120" height="70" rx="8"/>
  <text class="ink sm b" x="488" y="52" text-anchor="middle">расчёт</text>
  <text class="ink2 sm" x="488" y="72" text-anchor="middle">по данным</text>
  <path class="ln" d="M550,65 L564,65" marker-end="url(#ah-hypothesis-flow)"/>
  <rect class="box" x="566" y="30" width="120" height="70" rx="8"/>
  <text class="ink sm b" x="626" y="52" text-anchor="middle">вердикт</text>
  <text class="ink2 sm" x="626" y="72" text-anchor="middle">да / нет</text>
  <path class="ln-acc" d="M14,112 L396,112"/>
  <text class="acc sm b" x="205" y="128" text-anchor="middle">записываем в блокнот ДО того, как увидели цифру</text>
  <rect class="box-ok" x="14" y="150" width="672" height="36" rx="6"/>
  <text class="ink sm" x="30" y="173" text-anchor="start">чек с картой 315 ₽, без карты 300 ₽</text>
  <text class="ink sm" x="330" y="173" text-anchor="start">(315 − 300) / 300 = 5.0 %</text>
  <text class="ok sm b" x="670" y="173" text-anchor="end">подтвердилась</text>
  <rect class="box-err" x="14" y="194" width="672" height="36" rx="6"/>
  <text class="ink sm" x="30" y="217" text-anchor="start">чек с картой 309 ₽, без карты 300 ₽</text>
  <text class="ink sm" x="330" y="217" text-anchor="start">(309 − 300) / 300 = 3.0 %</text>
  <text class="err sm b" x="670" y="217" text-anchor="end">не подтвердилась</text>
  <text class="mut sm" x="350" y="244" text-anchor="middle">игрушечный пример урока: 5.0 % — ровно на пороге, 3.0 % — ниже, хотя чек с картой выше</text>
</svg>
