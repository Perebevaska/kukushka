<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cut-bins">
  <title id="t-cut-bins">pd.cut раскладывает числа по интервалам; правая граница входит</title>
  <defs><marker id="ah-cut-bins" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <path class="ln" d="M40,90 L660,90" marker-end="url(#ah-cut-bins)"/>
  <path class="ln" d="M40.0,82 L40.0,98"/>
  <text class="mut sm" x="40.0" y="116" text-anchor="middle">0</text>
  <path class="ln" d="M226.0,82 L226.0,98"/>
  <text class="mut sm" x="226.0" y="116" text-anchor="middle">300</text>
  <path class="ln" d="M412.0,82 L412.0,98"/>
  <text class="mut sm" x="412.0" y="116" text-anchor="middle">600</text>
  <text class="mut sm" x="654" y="116" text-anchor="end">… 10 000</text>
  <rect class="box-acc" x="42.0" y="40" width="182.0" height="34" rx="4"/>
  <text class="ink sm b" x="133.0" y="56" text-anchor="middle">до 300</text>
  <text class="mut sm" x="133.0" y="70" text-anchor="middle">(0, 300]</text>
  <circle class="box-ok" cx="226.0" cy="90" r="5"/>
  <circle class="ok" cx="226.0" cy="90" r="3"/>
  <rect class="box-ok" x="228.0" y="40" width="182.0" height="34" rx="4"/>
  <text class="ink sm b" x="319.0" y="56" text-anchor="middle">300–600</text>
  <text class="mut sm" x="319.0" y="70" text-anchor="middle">(300, 600]</text>
  <circle class="box-ok" cx="412.0" cy="90" r="5"/>
  <circle class="ok" cx="412.0" cy="90" r="3"/>
  <rect class="box-warn" x="414.0" y="40" width="244.0" height="34" rx="4"/>
  <text class="ink sm b" x="536.0" y="56" text-anchor="middle">больше 600</text>
  <text class="mut sm" x="536.0" y="70" text-anchor="middle">(600, 10 000]</text>
  <rect class="box" x="40" y="140" width="100" height="44" rx="4"/>
  <text class="ink sm b" x="90" y="158" text-anchor="middle">120</text>
  <text class="ink2 sm" x="90" y="175" text-anchor="middle">→ до 300</text>
  <rect class="box" x="148" y="140" width="100" height="44" rx="4"/>
  <text class="ink sm b" x="198" y="158" text-anchor="middle">300</text>
  <text class="ink2 sm" x="198" y="175" text-anchor="middle">→ до 300</text>
  <rect class="box" x="256" y="140" width="100" height="44" rx="4"/>
  <text class="ink sm b" x="306" y="158" text-anchor="middle">301</text>
  <text class="ink2 sm" x="306" y="175" text-anchor="middle">→ 300–600</text>
  <rect class="box" x="364" y="140" width="100" height="44" rx="4"/>
  <text class="ink sm b" x="414" y="158" text-anchor="middle">600</text>
  <text class="ink2 sm" x="414" y="175" text-anchor="middle">→ 300–600</text>
  <rect class="box" x="472" y="140" width="100" height="44" rx="4"/>
  <text class="ink sm b" x="522" y="158" text-anchor="middle">601</text>
  <text class="ink2 sm" x="522" y="175" text-anchor="middle">→ больше 600</text>
  <rect class="box" x="580" y="140" width="100" height="44" rx="4"/>
  <text class="ink sm b" x="630" y="158" text-anchor="middle">950</text>
  <text class="ink2 sm" x="630" y="175" text-anchor="middle">→ больше 600</text>
  <text class="ink2 sm" x="350" y="212" text-anchor="middle">300 попадает в «до 300», 600 — в «300–600»: у интервала (a, b] левая граница не входит, правая входит.</text>
</svg>
