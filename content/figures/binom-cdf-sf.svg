  <text class="ok sm b" x="113.5" y="72.77287581699339" text-anchor="middle">cdf(3) = P(X ≤ 3)</text>
  <text class="ok sm b" x="113.5" y="88.77287581699339" text-anchor="middle">= 0.2569</text>
  <text class="acc sm b" x="257" y="48.0" text-anchor="middle">pmf(5) = 0.2012</text>
  <text class="err sm b" x="482.5" y="140.17845166933958" text-anchor="middle">sf(7) = P(X &gt; 7) = P(X ≥ 8)</text>
  <text class="err sm b" x="482.5" y="156.17845166933958" text-anchor="middle">= 0.0835</text>
  <text class="mut sm" x="350" y="246" text-anchor="middle">опозданий из 20 доставок смены, p = 0.24</text>
  <text class="ink2 sm" x="350" y="264" text-anchor="middle">sf(k) — строго больше k: «8 и больше» — это sf(7), а не sf(8)</text>
