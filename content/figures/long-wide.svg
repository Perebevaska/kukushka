<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-long-wide">
  <title id="t-long-wide">Длинный и широкий формат: pivot_table и melt</title>
  <defs><marker id="ah-long-wide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="119.0" y="42" text-anchor="middle">длинный: строка = наблюдение</text>
  <rect class="box" x="20" y="50" width="198" height="24" rx="3"/>
  <text class="ink2 sm b" x="56.0" y="66.5" text-anchor="middle">shop_id</text>
  <text class="ink2 sm b" x="120.0" y="66.5" text-anchor="middle">month</text>
  <text class="ink2 sm b" x="183.0" y="66.5" text-anchor="middle">revenue</text>
  <rect class="box-acc" x="20" y="76" width="198" height="24" rx="3"/>
  <text class="ink sm" x="56.0" y="92.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="120.0" y="92.5" text-anchor="middle">09</text>
  <text class="ink sm" x="183.0" y="92.5" text-anchor="middle">100</text>
  <rect class="box-ok" x="20" y="102" width="198" height="24" rx="3"/>
  <text class="ink sm" x="56.0" y="118.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="120.0" y="118.5" text-anchor="middle">10</text>
  <text class="ink sm" x="183.0" y="118.5" text-anchor="middle">120</text>
  <rect class="box-acc" x="20" y="128" width="198" height="24" rx="3"/>
  <text class="ink sm" x="56.0" y="144.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="120.0" y="144.5" text-anchor="middle">09</text>
  <text class="ink sm" x="183.0" y="144.5" text-anchor="middle">90</text>
  <rect class="box-ok" x="20" y="154" width="198" height="24" rx="3"/>
  <text class="ink sm" x="56.0" y="170.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="120.0" y="170.5" text-anchor="middle">10</text>
  <text class="ink sm" x="183.0" y="170.5" text-anchor="middle">80</text>
  <text class="mut sm" x="582.0" y="42" text-anchor="middle">широкий: месяцы — столбцы</text>
  <rect class="box" x="490" y="50" width="184" height="24" rx="3"/>
  <text class="ink2 sm b" x="526.0" y="66.5" text-anchor="middle">shop_id</text>
  <text class="ink2 sm b" x="590.0" y="66.5" text-anchor="middle">09</text>
  <text class="ink2 sm b" x="646.0" y="66.5" text-anchor="middle">10</text>
  <rect class="box" x="490" y="76" width="184" height="24" rx="3"/>
  <text class="ink sm" x="526.0" y="92.5" text-anchor="middle">KZN-1</text>
  <text class="ink sm" x="590.0" y="92.5" text-anchor="middle">90</text>
  <text class="ink sm" x="646.0" y="92.5" text-anchor="middle">80</text>
  <rect class="box" x="490" y="102" width="184" height="24" rx="3"/>
  <text class="ink sm" x="526.0" y="118.5" text-anchor="middle">PRM-1</text>
  <text class="ink sm" x="590.0" y="118.5" text-anchor="middle">100</text>
  <text class="ink sm" x="646.0" y="118.5" text-anchor="middle">120</text>
  <rect class="box-acc" x="565" y="78" width="50" height="20" rx="3"/>
  <text class="ink sm" x="590" y="92.5" text-anchor="middle">90</text>
  <rect class="box-ok" x="621" y="78" width="50" height="20" rx="3"/>
  <text class="ink sm" x="646" y="92.5" text-anchor="middle">80</text>
  <rect class="box-acc" x="565" y="104" width="50" height="20" rx="3"/>
  <text class="ink sm" x="590" y="118.5" text-anchor="middle">100</text>
  <rect class="box-ok" x="621" y="104" width="50" height="20" rx="3"/>
  <text class="ink sm" x="646" y="118.5" text-anchor="middle">120</text>
  <path class="ln-acc" d="M226,80 H482" marker-end="url(#ah-long-wide)"/>
  <text class="acc sm b" x="355" y="70" text-anchor="middle">pivot_table(index="shop_id",</text>
  <text class="acc sm" x="355" y="98" text-anchor="middle">columns="month", values="revenue")</text>
  <path class="ln" d="M482,150 H226" marker-end="url(#ah-long-wide)"/>
  <text class="ink2 sm b" x="355" y="140" text-anchor="middle">reset_index().melt(id_vars="shop_id")</text>
  <text class="ink2 sm" x="355" y="168" text-anchor="middle">каждый столбец-месяц → строки</text>
  <text class="mut sm" x="582" y="150" text-anchor="middle">2 × 2 ячейки</text>
  <text class="ink2 sm" x="350" y="222" text-anchor="middle">Значения month стали заголовками столбцов, revenue — ячейками; обратно 2 строки × 2 месяца = 4 строки.</text>
  <text class="mut sm" x="350" y="242" text-anchor="middle">Считать удобнее в длинном, смотреть — в широком.</text>
</svg>
