<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-jupyter-modes">
  <title id="t-jupyter-modes">Два режима Jupyter и переходы между ними</title>
  <defs><marker id="ah-jupyter-modes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="20" y="30" width="270" height="150" rx="10"/>
  <text class="acc b" x="155" y="54" text-anchor="middle">режим команд</text>
  <text class="ink2 sm" x="155" y="74" text-anchor="middle">синяя полоса слева, курсора нет</text>
  <text class="ink sm b" x="40" y="104" text-anchor="start">A / B</text>
  <text class="ink2 sm" x="120" y="104" text-anchor="start">ячейка выше / ниже</text>
  <text class="ink sm b" x="40" y="125" text-anchor="start">M / Y</text>
  <text class="ink2 sm" x="120" y="125" text-anchor="start">markdown / код</text>
  <text class="ink sm b" x="40" y="146" text-anchor="start">D D / Z</text>
  <text class="ink2 sm" x="120" y="146" text-anchor="start">удалить / вернуть</text>
  <text class="ink sm b" x="40" y="167" text-anchor="start">0 0</text>
  <text class="ink2 sm" x="120" y="167" text-anchor="start">перезапуск ядра</text>
  <rect class="box" x="410" y="30" width="270" height="150" rx="10"/>
  <text class="ink b" x="545" y="54" text-anchor="middle">режим правки</text>
  <text class="ink2 sm" x="545" y="74" text-anchor="middle">мигает курсор внутри ячейки</text>
  <text class="ink2 sm" x="545" y="108" text-anchor="middle">буквы печатают текст:</text>
  <text class="ink sm b" x="545" y="130" text-anchor="middle">B → в код попадёт «b»</text>
  <text class="mut sm" x="545" y="156" text-anchor="middle">Tab — подсказка, Shift+Tab — справка</text>
  <path class="ln-acc" d="M292,82 L406,82" marker-end="url(#ah-jupyter-modes)"/>
  <text class="acc sm b" x="349" y="74" text-anchor="middle">Enter</text>
  <path class="ln" d="M406,132 L294,132" marker-end="url(#ah-jupyter-modes)"/>
  <text class="ink sm b" x="349" y="124" text-anchor="middle">Esc</text>
  <text class="ink2 sm" x="350" y="206" text-anchor="middle">в обоих режимах: Shift+Enter — выполнить и вниз, Ctrl+Enter — выполнить и остаться</text>
  <text class="mut sm" x="350" y="226" text-anchor="middle">«клавиши не работают» почти всегда значит: вы в режиме правки — нажмите Esc</text>
</svg>
