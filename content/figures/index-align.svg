<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-index-align">
  <title id="t-index-align">Присваивание Series ищет пару по индексу, список ложится по позициям</title>
  <defs><marker id="ah-index-align" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="97.0" y="36" text-anchor="middle">t</text>
  <rect class="box" x="20" y="44" width="154" height="24" rx="3"/>
  <text class="ink2 sm b" x="52.0" y="60.5" text-anchor="middle">индекс</text>
  <text class="ink2 sm b" x="129.0" y="60.5" text-anchor="middle">drink</text>
  <rect class="box" x="20" y="70" width="154" height="24" rx="3"/>
  <text class="mut sm b" x="52.0" y="86.5" text-anchor="middle">0</text>
  <text class="ink sm" x="129.0" y="86.5" text-anchor="middle">Латте</text>
  <rect class="box" x="20" y="96" width="154" height="24" rx="3"/>
  <text class="mut sm b" x="52.0" y="112.5" text-anchor="middle">1</text>
  <text class="ink sm" x="129.0" y="112.5" text-anchor="middle">Раф</text>
  <rect class="box" x="20" y="122" width="154" height="24" rx="3"/>
  <text class="mut sm b" x="52.0" y="138.5" text-anchor="middle">2</text>
  <text class="ink sm" x="129.0" y="138.5" text-anchor="middle">Чай</text>
  <text class="mut sm b" x="250" y="36" text-anchor="middle">Series s</text>
  <rect class="box-warn" x="210" y="70" width="40" height="24" rx="3"/>
  <text class="mut sm b" x="230" y="86.5" text-anchor="middle">2</text>
  <rect class="box-warn" x="252" y="70" width="50" height="24" rx="3"/>
  <text class="ink sm" x="277" y="86.5" text-anchor="middle">10</text>
  <rect class="box-acc" x="210" y="96" width="40" height="24" rx="3"/>
  <text class="mut sm b" x="230" y="112.5" text-anchor="middle">0</text>
  <rect class="box-acc" x="252" y="96" width="50" height="24" rx="3"/>
  <text class="ink sm" x="277" y="112.5" text-anchor="middle">20</text>
  <rect class="box-ok" x="210" y="122" width="40" height="24" rx="3"/>
  <text class="mut sm b" x="230" y="138.5" text-anchor="middle">1</text>
  <rect class="box-ok" x="252" y="122" width="50" height="24" rx="3"/>
  <text class="ink sm" x="277" y="138.5" text-anchor="middle">30</text>
  <text class="mut sm" x="256" y="160" text-anchor="middle">индекс [2, 0, 1]</text>
  <text class="acc sm b" x="420" y="36" text-anchor="middle">t["by_index"] = s</text>
  <rect class="box-acc" x="380" y="70" width="80" height="24" rx="3"/>
  <text class="ink sm b" x="420" y="86.5" text-anchor="middle">20</text>
  <path class="ln-acc" d="M304,108 C340,108 344,82 376,82" marker-end="url(#ah-index-align)"/>
  <rect class="box-ok" x="380" y="96" width="80" height="24" rx="3"/>
  <text class="ink sm b" x="420" y="112.5" text-anchor="middle">30</text>
  <path class="ln-acc" d="M304,134 C340,134 344,108 376,108" marker-end="url(#ah-index-align)"/>
  <rect class="box-warn" x="380" y="122" width="80" height="24" rx="3"/>
  <text class="ink sm b" x="420" y="138.5" text-anchor="middle">10</text>
  <path class="ln-acc" d="M304,82 C340,82 344,134 376,134" marker-end="url(#ah-index-align)"/>
  <text class="ink2 sm b" x="600" y="36" text-anchor="middle">t["by_order"] = [10, 20, 30]</text>
  <rect class="box" x="560" y="70" width="80" height="24" rx="3"/>
  <text class="ink sm" x="600" y="86.5" text-anchor="middle">10</text>
  <rect class="box" x="560" y="96" width="80" height="24" rx="3"/>
  <text class="ink sm" x="600" y="112.5" text-anchor="middle">20</text>
  <rect class="box" x="560" y="122" width="80" height="24" rx="3"/>
  <text class="ink sm" x="600" y="138.5" text-anchor="middle">30</text>
  <text class="mut sm" x="600" y="160" text-anchor="middle">просто по порядку строк</text>
  <text class="acc sm" x="420" y="160" text-anchor="middle">каждой строке — значение</text>
  <text class="acc sm" x="420" y="176" text-anchor="middle">с тем же индексом</text>
  <text class="ink2 sm" x="350" y="214" text-anchor="middle">Индексы не пересекаются (коды кофеен против 0, 1, 2…) — весь столбец NaN. Лечится map или set_index.</text>
  <text class="warn sm b" x="350" y="234" text-anchor="middle">.tolist() «убирает» NaN, но кладёт значения по позициям — молча не туда.</text>
</svg>
