<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ml-scheme">
  <title id="t-ml-scheme">Схема обучения с учителем: fit и predict</title>
  <defs><marker id="ah-ml-scheme" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="110" y="22" text-anchor="middle">прошлые доставки</text>
  <rect class="box-acc" x="20" y="32" width="130" height="92" rx="6"/>
  <text class="ink sm b" x="85" y="54" text-anchor="middle">X — признаки</text>
  <text class="ink2 sm" x="85" y="74" text-anchor="middle">расстояние,</text>
  <text class="ink2 sm" x="85" y="90" text-anchor="middle">позиции, обещание,</text>
  <text class="ink2 sm" x="85" y="106" text-anchor="middle">час</text>
  <rect class="box-warn" x="156" y="32" width="74" height="92" rx="6"/>
  <text class="ink sm b" x="193" y="54" text-anchor="middle">y — ответ</text>
  <text class="ink2 sm" x="193" y="78" text-anchor="middle">опоздал?</text>
  <text class="ink2 sm" x="193" y="96" text-anchor="middle">да / нет</text>
  <path class="ln" d="M234,78 L286,78" marker-end="url(#ah-ml-scheme)"/>
  <text class="acc b" x="260" y="68" text-anchor="middle">fit</text>
  <rect class="box-ok" x="290" y="44" width="130" height="68" rx="10"/>
  <text class="ink b" x="355" y="72" text-anchor="middle">модель</text>
  <text class="ink2 sm" x="355" y="92" text-anchor="middle">нашла правило</text>
  <text class="mut sm" x="110" y="156" text-anchor="middle">новые доставки</text>
  <rect class="box-acc" x="20" y="166" width="130" height="58" rx="6"/>
  <text class="ink sm b" x="85" y="190" text-anchor="middle">X_new</text>
  <text class="ink2 sm" x="85" y="208" text-anchor="middle">те же признаки</text>
  <rect class="box" x="156" y="166" width="74" height="58" rx="6"/>
  <text class="mut b" x="193" y="200" text-anchor="middle">?</text>
  <path class="ln" d="M234,195 H355 V116" marker-end="url(#ah-ml-scheme)"/>
  <text class="acc b" x="300" y="186" text-anchor="middle">predict</text>
  <path class="ln" d="M424,78 L476,78" marker-end="url(#ah-ml-scheme)"/>
  <rect class="box-warn" x="480" y="44" width="200" height="68" rx="10"/>
  <text class="ink sm b" x="580" y="70" text-anchor="middle">прогноз для новых:</text>
  <text class="ink2 sm" x="580" y="92" text-anchor="middle">опоздает / успеет</text>
  <text class="ink2 sm" x="350" y="244" text-anchor="middle">model.fit(X, y) — учится на прошлом;  model.predict(X_new) — отвечает на новых</text>
</svg>
