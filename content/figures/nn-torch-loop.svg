<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-torch-loop">
  <title id="t-nn-torch-loop">Один шаг обучения в PyTorch и его аналог в numpy-коде обратного прохода</title>
  <defs><marker id="ah-nn-torch-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-warn" x="10" y="66" width="128" height="76" rx="10"/>
  <text class="ink2 sm" x="74.0" y="84" text-anchor="middle">optimizer.</text>
  <text class="ink sm b" x="74.0" y="102" text-anchor="middle">zero_grad()</text>
  <text class="ink2 sm" x="74.0" y="126" text-anchor="middle">обнулить .grad</text>
  <rect class="box-acc" x="148" y="66" width="128" height="76" rx="10"/>
  <text class="ink sm b" x="212.0" y="96" text-anchor="middle">model(xb)</text>
  <text class="ink2 sm" x="212.0" y="126" text-anchor="middle">прямой проход</text>
  <text class="mut sm" x="212.0" y="164" text-anchor="middle">Z1, H, z</text>
  <path class="ln" d="M139,104 L147,104" marker-end="url(#ah-nn-torch-loop)"/>
  <rect class="box-acc" x="286" y="66" width="128" height="76" rx="10"/>
  <text class="ink sm b" x="350.0" y="96" text-anchor="middle">loss_fn(logits, yb)</text>
  <text class="ink2 sm" x="350.0" y="126" text-anchor="middle">потеря</text>
  <text class="mut sm" x="350.0" y="164" text-anchor="middle">логистич. потеря</text>
  <path class="ln" d="M277,104 L285,104" marker-end="url(#ah-nn-torch-loop)"/>
  <rect class="box-err" x="424" y="66" width="128" height="76" rx="10"/>
  <text class="ink2 sm" x="488.0" y="84" text-anchor="middle">loss.</text>
  <text class="ink sm b" x="488.0" y="102" text-anchor="middle">backward()</text>
  <text class="ink2 sm" x="488.0" y="126" text-anchor="middle">градиенты → .grad</text>
  <text class="mut sm" x="488.0" y="164" text-anchor="middle">4 строки градиентов</text>
  <path class="ln" d="M415,104 L423,104" marker-end="url(#ah-nn-torch-loop)"/>
  <rect class="box-ok" x="562" y="66" width="128" height="76" rx="10"/>
  <text class="ink2 sm" x="626.0" y="84" text-anchor="middle">optimizer.</text>
  <text class="ink sm b" x="626.0" y="102" text-anchor="middle">step()</text>
  <text class="ink2 sm" x="626.0" y="126" text-anchor="middle">w ← w − lr·grad</text>
  <text class="mut sm" x="626.0" y="164" text-anchor="middle">W1 -= lr * g_W1 …</text>
  <path class="ln" d="M553,104 L561,104" marker-end="url(#ah-nn-torch-loop)"/>
  <text class="ink2 sm" x="350" y="26" text-anchor="middle">повторяется для каждого батча, каждой эпохи</text>
  <path class="ln-acc" d="M626.0,172 L626.0,196 L74.0,196 L74.0,144" marker-end="url(#ah-nn-torch-loop)"/>
  <text class="acc sm b" x="350" y="190" text-anchor="middle">следующий батч</text>
  <path class="ln-err dash" d="M557.0,56 L557.0,150"/>
  <text class="err sm" x="557.0" y="50" text-anchor="middle">здесь — clip_grad_norm_</text>
  <text class="mut sm" x="14" y="230" text-anchor="start">под блоками — то же в numpy, из обратного прохода</text>
  <text class="mut sm" x="14" y="252" text-anchor="start">без zero_grad градиенты складываются с прошлого шага (+= в графе вычислений)</text>
</svg>
