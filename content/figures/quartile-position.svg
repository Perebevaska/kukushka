<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-quartile-position">
  <title id="t-quartile-position">Квартили десяти доставок: номер места и линейная интерполяция</title>
  <defs><marker id="ah-quartile-position" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="18" y="24" text-anchor="start">место в ряду по возрастанию</text>
  <text class="mut sm" x="58" y="44" text-anchor="middle">1</text>
  <text class="mut sm" x="122" y="44" text-anchor="middle">2</text>
  <text class="mut sm" x="186" y="44" text-anchor="middle">3</text>
  <text class="mut sm" x="250" y="44" text-anchor="middle">4</text>
  <text class="mut sm" x="314" y="44" text-anchor="middle">5</text>
  <text class="mut sm" x="378" y="44" text-anchor="middle">6</text>
  <text class="mut sm" x="442" y="44" text-anchor="middle">7</text>
  <text class="mut sm" x="506" y="44" text-anchor="middle">8</text>
  <text class="mut sm" x="570" y="44" text-anchor="middle">9</text>
  <text class="mut sm" x="634" y="44" text-anchor="middle">10</text>
  <rect class="box" x="32" y="52" width="52" height="36" rx="4"/>
  <text class="ink b" x="58" y="75" text-anchor="middle">20</text>
  <rect class="box" x="96" y="52" width="52" height="36" rx="4"/>
  <text class="ink b" x="122" y="75" text-anchor="middle">24</text>
  <rect class="box-acc" x="160" y="52" width="52" height="36" rx="4"/>
  <text class="ink b" x="186" y="75" text-anchor="middle">26</text>
  <rect class="box-acc" x="224" y="52" width="52" height="36" rx="4"/>
  <text class="ink b" x="250" y="75" text-anchor="middle">28</text>
  <rect class="box-ok" x="288" y="52" width="52" height="36" rx="4"/>
  <text class="ink b" x="314" y="75" text-anchor="middle">30</text>
  <rect class="box-ok" x="352" y="52" width="52" height="36" rx="4"/>
  <text class="ink b" x="378" y="75" text-anchor="middle">31</text>
  <rect class="box-acc" x="416" y="52" width="52" height="36" rx="4"/>
  <text class="ink b" x="442" y="75" text-anchor="middle">33</text>
  <rect class="box-acc" x="480" y="52" width="52" height="36" rx="4"/>
  <text class="ink b" x="506" y="75" text-anchor="middle">35</text>
  <rect class="box" x="544" y="52" width="52" height="36" rx="4"/>
  <text class="ink b" x="570" y="75" text-anchor="middle">38</text>
  <rect class="box-err" x="608" y="52" width="52" height="36" rx="4"/>
  <text class="ink b" x="634" y="75" text-anchor="middle">75</text>
  <path class="ln" d="M58,104 L634,104"/>
  <path class="ln-acc" d="M202,96 L202,124" marker-end="url(#ah-quartile-position)"/>
  <path class="ln-ok" d="M346,96 L346,124" marker-end="url(#ah-quartile-position)"/>
  <path class="ln-acc" d="M490,96 L490,124" marker-end="url(#ah-quartile-position)"/>
  <text class="acc b" x="202" y="144" text-anchor="middle">Q1 · место 3.25</text>
  <text class="acc" x="202" y="162" text-anchor="middle">26 + 0.25 × 2 = 26.5</text>
  <text class="ok b" x="346" y="144" text-anchor="middle">медиана · место 5.5</text>
  <text class="ok" x="346" y="162" text-anchor="middle">30 + 0.5 × 1 = 30.5</text>
  <text class="acc b" x="490" y="144" text-anchor="middle">Q3 · место 7.75</text>
  <text class="acc" x="490" y="162" text-anchor="middle">33 + 0.75 × 2 = 34.5</text>
  <text class="err sm" x="634" y="144" text-anchor="middle">выброс</text>
  <text class="ink2 sm" x="18" y="196" text-anchor="start">место квантиля = 1 + доля × (n − 1): для Q1 это 1 + 0.25 × 9 = 3.25 — между 3-м и 4-м значениями</text>
  <text class="ink2 sm" x="18" y="216" text-anchor="start">дробная часть 0.25 — какую долю пути пройти от 3-го значения (26) к 4-му (28)</text>
  <text class="acc sm b" x="18" y="236" text-anchor="start">s.quantile(0.25) считает именно так (линейная интерполяция)</text>
</svg>
