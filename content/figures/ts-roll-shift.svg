<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ts-roll-shift">
  <title id="t-ts-roll-shift">Окно признака для строки 12:00: со сдвигом — только прошлое, без сдвига — захватывает ответ</title>
  <defs><marker id="ah-ts-roll-shift" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="150" y="50" width="100" height="36" rx="4"/>
  <text class="ink b" x="200.0" y="74" text-anchor="middle">5</text>
  <text class="ink2 sm" x="200.0" y="42" text-anchor="middle">09:00</text>
  <rect class="box" x="260" y="50" width="100" height="36" rx="4"/>
  <text class="ink b" x="310.0" y="74" text-anchor="middle">7</text>
  <text class="ink2 sm" x="310.0" y="42" text-anchor="middle">10:00</text>
  <rect class="box" x="370" y="50" width="100" height="36" rx="4"/>
  <text class="ink b" x="420.0" y="74" text-anchor="middle">9</text>
  <text class="ink2 sm" x="420.0" y="42" text-anchor="middle">11:00</text>
  <rect class="box-warn" x="480" y="50" width="100" height="36" rx="4"/>
  <text class="ink b" x="530.0" y="74" text-anchor="middle">11</text>
  <text class="warn sm b" x="530.0" y="42" text-anchor="middle">12:00</text>
  <text class="warn sm b" x="530.0" y="106" text-anchor="middle">ответ: предсказываем</text>
  <path class="ln dash" d="M475.0,26 L475.0,220"/>
  <text class="ink sm b" x="469.0" y="24" text-anchor="end">сейчас 11:59</text>
  <rect class="box-ok" x="262" y="134" width="206" height="34" rx="5"/>
  <text class="ink b" x="365.0" y="156" text-anchor="middle">(7 + 9) / 2 = 8</text>
  <text class="ok sm b" x="14" y="149" text-anchor="start">s.shift(1)</text>
  <text class="ok sm b" x="14" y="165" text-anchor="start">.rolling(2)</text>
  <text class="ok sm b" x="486" y="156" text-anchor="start">честно: только прошлое</text>
  <rect class="box-err" x="372" y="182" width="206" height="34" rx="5"/>
  <text class="ink b" x="475.0" y="204" text-anchor="middle">(9 + 11) / 2 = 10</text>
  <text class="err sm b" x="14" y="197" text-anchor="start">s.rolling(2)</text>
  <text class="err sm b" x="14" y="213" text-anchor="start">без сдвига</text>
  <text class="err sm b" x="252" y="204" text-anchor="end">утечка: в окне ответ</text>
  <text class="ink2 sm" x="350" y="250" text-anchor="middle">для строки «время t» признак может видеть только часы до t, не включая сам t</text>
  <text class="mut sm" x="350" y="272" text-anchor="middle">в уроке окно 24 часа: s.shift(1).rolling(24) — часы с t − 24 по t − 1</text>
</svg>
