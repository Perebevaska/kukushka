<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-reviews-project-flow">
  <title id="t-reviews-project-flow">Проект главы: модели на размеченных отзывах → разметка новых → сравнение до и после → причина и поправка</title>
  <defs><marker id="ah-reviews-project-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="14" y="30" width="190" height="66" rx="6"/>
  <text class="ink sm b" x="109.0" y="50.5" text-anchor="middle">reviews_text.csv</text>
  <text class="ink2 sm" x="109.0" y="67.5" text-anchor="middle">2 400 отзывов</text>
  <text class="ink2 sm" x="109.0" y="84.5" text-anchor="middle">с оценкой и темой</text>
  <rect class="box-ok" x="250" y="20" width="200" height="86" rx="6"/>
  <text class="ink sm b" x="350.0" y="42.0" text-anchor="middle">шаг 1: две модели</text>
  <text class="ink2 sm" x="350.0" y="59.0" text-anchor="middle">тональность и тема</text>
  <text class="ink2 sm" x="350.0" y="76.0" text-anchor="middle">оценка на отложенной ¼,</text>
  <text class="ink2 sm" x="350.0" y="93.0" text-anchor="middle">потом обучение на всех</text>
  <rect class="box-warn" x="496" y="30" width="190" height="66" rx="6"/>
  <text class="ink sm b" x="591.0" y="50.5" text-anchor="middle">reviews_new.csv</text>
  <text class="ink2 sm" x="591.0" y="67.5" text-anchor="middle">4 800 отзывов</text>
  <text class="ink2 sm" x="591.0" y="84.5" text-anchor="middle">только текст, дата, точка</text>
  <path class="ln" d="M206,63 L246,63" marker-end="url(#ah-reviews-project-flow)"/>
  <path class="ln" d="M591,98 L591,134" marker-end="url(#ah-reviews-project-flow)"/>
  <path class="ln" d="M350,108 L350,134" marker-end="url(#ah-reviews-project-flow)"/>
  <rect class="box" x="250" y="136" width="436" height="46" rx="6"/>
  <text class="ink sm b" x="468.0" y="155.0" text-anchor="middle">шаг 2: разметка новых отзывов обеими моделями</text>
  <text class="ink2 sm" x="468.0" y="172.0" text-anchor="middle">P(недоволен), флаг, тема, период до / после 5 октября</text>
  <rect class="box" x="14" y="200" width="210" height="70" rx="6"/>
  <text class="ink sm b" x="119.0" y="215.5" text-anchor="middle">шаг 3</text>
  <text class="ink2 sm" x="119.0" y="231.5" text-anchor="middle">доля недовольных</text>
  <text class="ink2 sm" x="119.0" y="247.5" text-anchor="middle">по точкам: уровень</text>
  <text class="ink2 sm" x="119.0" y="263.5" text-anchor="middle">и рост</text>
  <path class="ln" d="M226,235 L242,235" marker-end="url(#ah-reviews-project-flow)"/>
  <rect class="box" x="244" y="200" width="210" height="70" rx="6"/>
  <text class="ink sm b" x="349.0" y="215.5" text-anchor="middle">шаги 4–5</text>
  <text class="ink2 sm" x="349.0" y="231.5" text-anchor="middle">темы жалоб до/после,</text>
  <text class="ink2 sm" x="349.0" y="247.5" text-anchor="middle">цитаты, с какой</text>
  <text class="ink2 sm" x="349.0" y="263.5" text-anchor="middle">недели</text>
  <path class="ln" d="M456,235 L472,235" marker-end="url(#ah-reviews-project-flow)"/>
  <rect class="box" x="474" y="200" width="210" height="70" rx="6"/>
  <text class="ink sm b" x="579.0" y="215.5" text-anchor="middle">шаг 6</text>
  <text class="ink2 sm" x="579.0" y="231.5" text-anchor="middle">поправка доли</text>
  <text class="ink2 sm" x="579.0" y="247.5" text-anchor="middle">на ошибки модели</text>
  <text class="ink2 sm" x="579.0" y="263.5" text-anchor="middle">(TPR, FPR)</text>
  <path class="ln" d="M300,184 L119,198" marker-end="url(#ah-reviews-project-flow)"/>
</svg>
