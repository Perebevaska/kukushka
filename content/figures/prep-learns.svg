<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-prep-learns">
  <title id="t-prep-learns">У каждого шага подготовки есть fit и transform</title>
  <defs><marker id="ah-prep-learns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="130" y="24" text-anchor="middle">шаг</text>
  <text class="acc sm b" x="360" y="24" text-anchor="middle">fit(X_train) запоминает</text>
  <text class="ok sm b" x="590" y="24" text-anchor="middle">transform(любая таблица)</text>
  <rect class="box" x="20" y="36" width="220" height="36" rx="6"/>
  <text class="ink sm b" x="130.0" y="58.5" text-anchor="middle">SimpleImputer(median)</text>
  <rect class="box-acc" x="260" y="36" width="200" height="36" rx="6"/>
  <text class="ink sm" x="360.0" y="58.5" text-anchor="middle">медиану столбца</text>
  <rect class="box-ok" x="480" y="36" width="200" height="36" rx="6"/>
  <text class="ink sm" x="580.0" y="58.5" text-anchor="middle">подставляет её в пропуски</text>
  <path class="ln" d="M240,54 L258,54" marker-end="url(#ah-prep-learns)"/>
  <path class="ln" d="M460,54 L478,54" marker-end="url(#ah-prep-learns)"/>
  <rect class="box" x="20" y="80" width="220" height="36" rx="6"/>
  <text class="ink sm b" x="130.0" y="102.5" text-anchor="middle">StandardScaler</text>
  <rect class="box-acc" x="260" y="80" width="200" height="36" rx="6"/>
  <text class="ink sm" x="360.0" y="102.5" text-anchor="middle">среднее и разброс</text>
  <rect class="box-ok" x="480" y="80" width="200" height="36" rx="6"/>
  <text class="ink sm" x="580.0" y="102.5" text-anchor="middle">вычитает и делит</text>
  <path class="ln" d="M240,98 L258,98" marker-end="url(#ah-prep-learns)"/>
  <path class="ln" d="M460,98 L478,98" marker-end="url(#ah-prep-learns)"/>
  <rect class="box" x="20" y="124" width="220" height="36" rx="6"/>
  <text class="ink sm b" x="130.0" y="146.5" text-anchor="middle">OneHotEncoder</text>
  <rect class="box-acc" x="260" y="124" width="200" height="36" rx="6"/>
  <text class="ink sm" x="360.0" y="146.5" text-anchor="middle">список категорий</text>
  <rect class="box-ok" x="480" y="124" width="200" height="36" rx="6"/>
  <text class="ink sm" x="580.0" y="146.5" text-anchor="middle">флаги; новая категория → нули</text>
  <path class="ln" d="M240,142 L258,142" marker-end="url(#ah-prep-learns)"/>
  <path class="ln" d="M460,142 L478,142" marker-end="url(#ah-prep-learns)"/>
  <rect class="box" x="20" y="168" width="220" height="36" rx="6"/>
  <text class="ink sm b" x="130.0" y="190.5" text-anchor="middle">модель</text>
  <rect class="box-acc" x="260" y="168" width="200" height="36" rx="6"/>
  <text class="ink sm" x="360.0" y="190.5" text-anchor="middle">веса или деревья</text>
  <rect class="box-ok" x="480" y="168" width="200" height="36" rx="6"/>
  <text class="ink sm" x="580.0" y="190.5" text-anchor="middle">predict, predict_proba</text>
  <path class="ln" d="M240,186 L258,186" marker-end="url(#ah-prep-learns)"/>
  <path class="ln" d="M460,186 L478,186" marker-end="url(#ah-prep-learns)"/>
  <text class="ink2 sm" x="350" y="228" text-anchor="middle">fit — только на обучающей части; transform — к train, тесту и завтрашним гостям одинаково</text>
</svg>
