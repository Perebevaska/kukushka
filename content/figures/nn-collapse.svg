<svg viewBox="0 0 700 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-collapse">
  <title id="t-nn-collapse">Два линейных слоя без активации равны одному слою с весами W1 @ W2</title>
  <defs><marker id="ah-nn-collapse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="20" y="28" text-anchor="start">два слоя без активации</text>
  <rect class="box" x="30" y="50" width="16" height="16" rx="1"/>
  <rect class="box" x="46" y="50" width="16" height="16" rx="1"/>
  <rect class="box" x="62" y="50" width="16" height="16" rx="1"/>
  <rect class="box" x="30" y="66" width="16" height="16" rx="1"/>
  <rect class="box" x="46" y="66" width="16" height="16" rx="1"/>
  <rect class="box" x="62" y="66" width="16" height="16" rx="1"/>
  <text class="ink sm b" x="54.0" y="98" text-anchor="middle">X: 2 × 3</text>
  <text class="ink b" x="100" y="72" text-anchor="middle">@</text>
  <rect class="box-acc" x="120" y="50" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="136" y="50" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="152" y="50" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="168" y="50" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="120" y="66" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="136" y="66" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="152" y="66" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="168" y="66" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="120" y="82" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="136" y="82" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="152" y="82" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="168" y="82" width="16" height="16" rx="1"/>
  <text class="ink sm b" x="152.0" y="114" text-anchor="middle">W₁: 3 × 4</text>
  <text class="ink b" x="206" y="72" text-anchor="middle">=</text>
  <rect class="box" x="226" y="50" width="16" height="16" rx="1"/>
  <rect class="box" x="242" y="50" width="16" height="16" rx="1"/>
  <rect class="box" x="258" y="50" width="16" height="16" rx="1"/>
  <rect class="box" x="274" y="50" width="16" height="16" rx="1"/>
  <rect class="box" x="226" y="66" width="16" height="16" rx="1"/>
  <rect class="box" x="242" y="66" width="16" height="16" rx="1"/>
  <rect class="box" x="258" y="66" width="16" height="16" rx="1"/>
  <rect class="box" x="274" y="66" width="16" height="16" rx="1"/>
  <text class="ink sm b" x="258.0" y="98" text-anchor="middle">Z: 2 × 4</text>
  <text class="ink b" x="312" y="72" text-anchor="middle">@</text>
  <rect class="box-acc" x="332" y="50" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="332" y="66" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="332" y="82" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="332" y="98" width="16" height="16" rx="1"/>
  <text class="ink sm b" x="340.0" y="130" text-anchor="middle">W₂: 4 × 1</text>
  <text class="ink b" x="374" y="72" text-anchor="middle">=</text>
  <rect class="box-ok" x="394" y="50" width="16" height="16" rx="1"/>
  <rect class="box-ok" x="394" y="66" width="16" height="16" rx="1"/>
  <text class="ink sm b" x="402.0" y="98" text-anchor="middle">выход: 2 × 1</text>
  <text class="ink2 sm" x="480" y="60" text-anchor="start">скобки можно переставить:</text>
  <text class="ink sm b" x="480" y="78" text-anchor="start">(X @ W₁) @ W₂ = X @ (W₁ @ W₂)</text>
  <path class="ln-acc" d="M150,140 L150,166" marker-end="url(#ah-nn-collapse)"/>
  <text class="acc sm" x="162" y="158" text-anchor="start">сначала перемножим веса: W₁ @ W₂ — матрица 3 × 1</text>
  <text class="ink b" x="20" y="190" text-anchor="start">тот же результат — один слой</text>
  <rect class="box" x="30" y="204" width="16" height="16" rx="1"/>
  <rect class="box" x="46" y="204" width="16" height="16" rx="1"/>
  <rect class="box" x="62" y="204" width="16" height="16" rx="1"/>
  <rect class="box" x="30" y="220" width="16" height="16" rx="1"/>
  <rect class="box" x="46" y="220" width="16" height="16" rx="1"/>
  <rect class="box" x="62" y="220" width="16" height="16" rx="1"/>
  <text class="ink sm b" x="54.0" y="252" text-anchor="middle">X: 2 × 3</text>
  <text class="ink b" x="100" y="226" text-anchor="middle">@</text>
  <rect class="box-acc" x="120" y="204" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="120" y="220" width="16" height="16" rx="1"/>
  <rect class="box-acc" x="120" y="236" width="16" height="16" rx="1"/>
  <text class="ink sm b" x="128.0" y="268" text-anchor="middle">W₁ @ W₂: 3 × 1</text>
  <text class="ink b" x="162" y="226" text-anchor="middle">=</text>
  <rect class="box-ok" x="182" y="204" width="16" height="16" rx="1"/>
  <rect class="box-ok" x="182" y="220" width="16" height="16" rx="1"/>
  <text class="ink sm b" x="190.0" y="252" text-anchor="middle">выход: 2 × 1</text>
  <text class="ink2 sm" x="260" y="220" text-anchor="start">3 веса вместо 3 · 4 + 4 · 1 = 16: обычная линейная модель,</text>
  <text class="ink2 sm" x="260" y="238" text-anchor="start">граница — прямая, сколько бы слоёв ни было</text>
  <rect class="box-warn" x="20" y="284" width="660" height="44" rx="8"/>
  <text class="ink sm" x="350" y="302" text-anchor="middle">с ReLU между слоями: relu(X @ W₁) @ W₂ — скобки уже не переставить:</text>
  <text class="ink sm" x="350" y="320" text-anchor="middle">ReLU обнуляет разные клетки Z у разных гостей, и граница получает изгибы</text>
</svg>
