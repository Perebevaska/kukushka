<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-explain-plan">
  <title id="t-explain-plan">План EXPLAIN: читаем снизу вверх</title>
  <defs><marker id="ah-explain-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="170" y="254" width="250" height="50" rx="5"/>
  <text class="ink b" x="295.0" y="273" text-anchor="middle">PANDAS_SCAN</text>
  <text class="ink2 sm" x="295.0" y="291" text-anchor="middle">читает df: 3 столбца из 9 · ~2 089 строк</text>
  <text class="acc sm" x="460" y="284" text-anchor="start">FROM df</text>
  <path class="ln-mut dash" d="M424,279 H454"/>
  <path class="ln" d="M295.0,252 L295.0,232" marker-end="url(#ah-explain-plan)"/>
  <rect class="box" x="170" y="178" width="250" height="50" rx="5"/>
  <text class="ink b" x="295.0" y="197" text-anchor="middle">FILTER</text>
  <text class="ink2 sm" x="295.0" y="215" text-anchor="middle">channel = 'доставка' · ~417 строк</text>
  <text class="acc sm" x="460" y="208" text-anchor="start">WHERE channel = 'доставка'</text>
  <path class="ln-mut dash" d="M424,203 H454"/>
  <path class="ln" d="M295.0,176 L295.0,156" marker-end="url(#ah-explain-plan)"/>
  <rect class="box" x="170" y="102" width="250" height="50" rx="5"/>
  <text class="ink b" x="295.0" y="121" text-anchor="middle">HASH_GROUP_BY</text>
  <text class="ink2 sm" x="295.0" y="139" text-anchor="middle">группы shop_id, sum(amount)</text>
  <text class="acc sm" x="460" y="132" text-anchor="start">GROUP BY shop_id</text>
  <path class="ln-mut dash" d="M424,127 H454"/>
  <path class="ln" d="M295.0,100 L295.0,80" marker-end="url(#ah-explain-plan)"/>
  <rect class="box" x="170" y="26" width="250" height="50" rx="5"/>
  <text class="ink b" x="295.0" y="45" text-anchor="middle">ORDER_BY</text>
  <text class="ink2 sm" x="295.0" y="63" text-anchor="middle">sum(amount) DESC</text>
  <text class="acc sm" x="460" y="56" text-anchor="start">ORDER BY revenue DESC</text>
  <path class="ln-mut dash" d="M424,51 H454"/>
  <path class="ln-acc" d="M80,300 L80,34" marker-end="url(#ah-explain-plan)"/>
  <text class="acc sm b" x="60" y="170" text-anchor="end">читать</text>
  <text class="acc sm b" x="60" y="186" text-anchor="end">снизу</text>
  <text class="acc sm b" x="60" y="202" text-anchor="end">вверх</text>
  <text class="mut sm b" x="460" y="14" text-anchor="start">часть запроса</text>
  <text class="mut sm b" x="295.0" y="14" text-anchor="middle">узел плана</text>
  <text class="mut sm" x="295.0" y="322" text-anchor="middle">служебные узлы PROJECTION опущены; «~» — оценка, а не точное число</text>
</svg>
