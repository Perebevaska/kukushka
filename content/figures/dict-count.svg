<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-dict-count">
  <title id="t-dict-count">Одна строка подсчёта: прочитать, прибавить, записать</title>
  <defs><marker id="ah-dict-count" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="350" y="26" text-anchor="middle">counts[drink] = counts.get(drink, 0) + 1</text>
  <text class="mut sm" x="350" y="46" text-anchor="middle">шаг 3 из 5: drink = «Латте»</text>
  <rect class="box" x="20" y="64" width="190" height="64" rx="6"/>
  <text class="mut sm" x="115.0" y="92.0" text-anchor="middle">counts до шага</text>
  <text class="ink sm b" x="115.0" y="109.0" text-anchor="middle">Латте: 1, Раф: 1</text>
  <rect class="box-acc" x="250" y="64" width="130" height="64" rx="6"/>
  <text class="acc sm b" x="315.0" y="92.0" text-anchor="middle">1) прочитать</text>
  <text class="ink sm b" x="315.0" y="109.0" text-anchor="middle">get → 1</text>
  <rect class="box-acc" x="410" y="64" width="100" height="64" rx="6"/>
  <text class="acc sm b" x="460.0" y="92.0" text-anchor="middle">2) прибавить</text>
  <text class="ink sm b" x="460.0" y="109.0" text-anchor="middle">1 + 1 = 2</text>
  <rect class="box-ok" x="540" y="64" width="140" height="64" rx="6"/>
  <text class="ok sm b" x="610.0" y="92.0" text-anchor="middle">3) записать</text>
  <text class="ink sm b" x="610.0" y="109.0" text-anchor="middle">counts["Латте"] = 2</text>
  <path class="ln" d="M212,96 L246,96" marker-end="url(#ah-dict-count)"/>
  <path class="ln" d="M382,96 L406,96" marker-end="url(#ah-dict-count)"/>
  <path class="ln" d="M512,96 L536,96" marker-end="url(#ah-dict-count)"/>
  <text class="ink2 sm b" x="20" y="160" text-anchor="start">Все шаги:</text>
  <rect class="box-ok" x="20" y="170" width="128" height="44" rx="4"/>
  <text class="ink sm b" x="84.0" y="188" text-anchor="middle">1. Латте</text>
  <text class="ink sm" x="84.0" y="205" text-anchor="middle">новый ключ → 1</text>
  <rect class="box-ok" x="152" y="170" width="128" height="44" rx="4"/>
  <text class="ink sm b" x="216.0" y="188" text-anchor="middle">2. Раф</text>
  <text class="ink sm" x="216.0" y="205" text-anchor="middle">новый ключ → 1</text>
  <rect class="box-acc" x="284" y="170" width="128" height="44" rx="4"/>
  <text class="ink sm b" x="348.0" y="188" text-anchor="middle">3. Латте</text>
  <text class="ink sm" x="348.0" y="205" text-anchor="middle">1 → 2</text>
  <rect class="box-ok" x="416" y="170" width="128" height="44" rx="4"/>
  <text class="ink sm b" x="480.0" y="188" text-anchor="middle">4. Капучино</text>
  <text class="ink sm" x="480.0" y="205" text-anchor="middle">новый ключ → 1</text>
  <rect class="box-acc" x="548" y="170" width="128" height="44" rx="4"/>
  <text class="ink sm b" x="612.0" y="188" text-anchor="middle">5. Латте</text>
  <text class="ink sm" x="612.0" y="205" text-anchor="middle">2 → 3</text>
  <text class="ink2 sm" x="350" y="240" text-anchor="middle">Итог: Латте: 3, Раф: 1, Капучино: 1. Зелёный — ключа ещё не было, get вернул 0.</text>
</svg>
