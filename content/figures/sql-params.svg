<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sql-params">
  <title id="t-sql-params">Значение в запросе: f-строка против заполнителя</title>
  <defs><marker id="ah-sql-params" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="err sm b" x="20" y="24" text-anchor="start">f-строка: значение вклеивается в текст запроса</text>
  <rect class="box" x="20" y="36" width="150" height="44" rx="6"/>
  <text class="mut sm" x="95.0" y="54.0" text-anchor="middle">значение:</text>
  <text class="ink sm b" x="95.0" y="71.0" text-anchor="middle">Кофе д'Арт</text>
  <rect class="box" x="20" y="90" width="150" height="44" rx="6"/>
  <text class="mut sm" x="95.0" y="108.0" text-anchor="middle">значение:</text>
  <text class="ink sm b" x="95.0" y="125.0" text-anchor="middle">' OR 1=1 --</text>
  <path class="ln" d="M172,58 L214,58" marker-end="url(#ah-sql-params)"/>
  <path class="ln" d="M172,112 L214,112" marker-end="url(#ah-sql-params)"/>
  <rect class="box-err" x="216" y="42" width="256" height="32" rx="4"/>
  <text class="ink sm" x="344" y="63" text-anchor="middle">… WHERE title = 'Кофе д'Арт'</text>
  <rect class="box-err" x="216" y="96" width="256" height="32" rx="4"/>
  <text class="ink sm" x="344" y="117" text-anchor="middle">… WHERE city = '' OR 1=1 --'</text>
  <path class="ln" d="M474,58 L502,58" marker-end="url(#ah-sql-params)"/>
  <path class="ln" d="M474,112 L502,112" marker-end="url(#ah-sql-params)"/>
  <rect class="box-err" x="504" y="38" width="182" height="40" rx="6"/>
  <text class="ink2 sm" x="595.0" y="55.0" text-anchor="middle">кавычка закрыта рано:</text>
  <text class="err sm b" x="595.0" y="70.0" text-anchor="middle">ошибка синтаксиса</text>
  <rect class="box-err" x="504" y="92" width="182" height="40" rx="6"/>
  <text class="ink2 sm" x="595.0" y="109.0" text-anchor="middle">условие всегда истинно:</text>
  <text class="err sm b" x="595.0" y="124.0" text-anchor="middle">вся таблица</text>
  <text class="ok sm b" x="20" y="172" text-anchor="start">params=: текст запроса и значения едут к базе отдельно</text>
  <rect class="box" x="20" y="184" width="220" height="40" rx="6"/>
  <text class="mut sm" x="130.0" y="200.5" text-anchor="middle">текст запроса:</text>
  <text class="ink sm b" x="130.0" y="216.5" text-anchor="middle">WHERE city = ? AND seats &gt;= ?</text>
  <rect class="box" x="20" y="234" width="220" height="40" rx="6"/>
  <text class="mut sm" x="130.0" y="250.5" text-anchor="middle">params=</text>
  <text class="ink sm b" x="130.0" y="266.5" text-anchor="middle">("Казань", 20)</text>
  <path class="ln" d="M242,204 C290,204 290,229 330,229" marker-end="url(#ah-sql-params)"/>
  <path class="ln" d="M242,254 C290,254 290,229 330,229" marker-end="url(#ah-sql-params)"/>
  <rect class="box-acc" x="332" y="206" width="170" height="46" rx="6"/>
  <text class="ink sm b" x="417.0" y="225.5" text-anchor="middle">база (драйвер)</text>
  <text class="ink2 sm" x="417.0" y="241.5" text-anchor="middle">подставляет значения</text>
  <path class="ln" d="M504,229 L548,229" marker-end="url(#ah-sql-params)"/>
  <rect class="box-ok" x="550" y="206" width="136" height="46" rx="6"/>
  <text class="ok sm b" x="618.0" y="225.5" text-anchor="middle">значение — данные,</text>
  <text class="ink2 sm" x="618.0" y="241.5" text-anchor="middle">не часть кода</text>
  <text class="ink2 sm" x="350" y="294" text-anchor="middle">с заполнителем апостроф и «кусок SQL» — просто символы внутри значения</text>
</svg>
