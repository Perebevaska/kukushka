<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-pr-cm">
  <title id="t-pr-cm">Точность считают по столбцу, полноту — по строке</title>
  <defs><marker id="ah-pr-cm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="280.0" y="50" text-anchor="middle">прогноз: останется</text>
  <text class="mut sm" x="400.0" y="50" text-anchor="middle">прогноз: уйдёт</text>
  <text class="mut sm" x="210" y="90.0" text-anchor="end">факт: остался</text>
  <text class="mut sm" x="210" y="142.0" text-anchor="end">факт: ушёл</text>
  <rect class="box" x="220" y="60" width="118" height="50" rx="3"/>
  <text class="ink b" x="280.0" y="91.0" text-anchor="middle">TN = 443</text>
  <rect class="box-warn" x="340" y="60" width="118" height="50" rx="3"/>
  <text class="ink b" x="400.0" y="91.0" text-anchor="middle">FP = 23</text>
  <rect class="box-err" x="220" y="112" width="118" height="50" rx="3"/>
  <text class="ink b" x="280.0" y="143.0" text-anchor="middle">FN = 44</text>
  <rect class="box-acc" x="340" y="112" width="118" height="50" rx="3"/>
  <text class="ink b" x="400.0" y="143.0" text-anchor="middle">TP = 90</text>
  <rect class="ln-acc" x="335" y="34" width="128" height="136" rx="8"/>
  <rect class="ln-err dash" x="92" y="108" width="376" height="58" rx="8"/>
  <text class="acc sm b" x="480" y="78" text-anchor="start">точность (precision) — столбец:</text>
  <text class="ink sm" x="480" y="96" text-anchor="start">TP / (TP + FP) = 90/113 ≈ 0.80</text>
  <text class="ink2 sm" x="480" y="112" text-anchor="start">«бонусы ушли по адресу?»</text>
  <text class="err sm b" x="480" y="146" text-anchor="start">полнота (recall) — строка:</text>
  <text class="ink sm" x="480" y="164" text-anchor="start">TP / (TP + FN) = 90/134 ≈ 0.67</text>
  <text class="ink2 sm" x="480" y="180" text-anchor="start">«скольких уходящих нашли?»</text>
  <text class="ink2 sm" x="350" y="206" text-anchor="middle">TP входит в обе метрики; TN — ни в одну из них</text>
  <text class="mut sm" x="350" y="228" text-anchor="middle">accuracy = (TP + TN) / все = 0.89 — третья, отдельная метрика</text>
</svg>
