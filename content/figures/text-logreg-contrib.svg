<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-text-logreg-contrib">
  <title id="t-text-logreg-contrib">Как логистическая регрессия читает отзыв: вклад слова = вес TF-IDF × вес модели</title>
  <defs><marker id="ah-text-logreg-contrib" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="350" y="22" text-anchor="middle">«Курьер вежливый, но выпечка вчерашняя.»</text>
  <rect class="box" x="20" y="36" width="106" height="24" rx="3"/>
  <text class="ink2 sm b" x="73.0" y="53" text-anchor="middle">слово</text>
  <rect class="box" x="130" y="36" width="76" height="24" rx="3"/>
  <text class="ink2 sm b" x="168.0" y="53" text-anchor="middle">TF-IDF</text>
  <rect class="box" x="210" y="36" width="86" height="24" rx="3"/>
  <text class="ink2 sm b" x="253.0" y="53" text-anchor="middle">вес слова</text>
  <rect class="box" x="300" y="36" width="80" height="24" rx="3"/>
  <text class="ink2 sm b" x="340.0" y="53" text-anchor="middle">вклад</text>
  <text class="ok sm b" x="440" y="53" text-anchor="middle">← к «доволен»</text>
  <text class="err sm b" x="620" y="53" text-anchor="middle">к «недоволен» →</text>
  <rect class="box" x="20" y="66" width="106" height="26" rx="3"/>
  <text class="ink sm b" x="73.0" y="84" text-anchor="middle">курьер</text>
  <rect class="box" x="130" y="66" width="76" height="26" rx="3"/>
  <text class="ink sm" x="168.0" y="84" text-anchor="middle">0.40</text>
  <rect class="box" x="210" y="66" width="86" height="26" rx="3"/>
  <text class="ink sm" x="253.0" y="84" text-anchor="middle">−0.22</text>
  <rect class="box" x="300" y="66" width="80" height="26" rx="3"/>
  <text class="ink sm b" x="340.0" y="84" text-anchor="middle">−0.09</text>
  <rect class="box-ok" x="524.841932887392" y="70" width="5.158067112607995" height="18" rx="2"/>
  <rect class="box" x="20" y="96" width="106" height="26" rx="3"/>
  <text class="ink sm b" x="73.0" y="114" text-anchor="middle">вежливый</text>
  <rect class="box" x="130" y="96" width="76" height="26" rx="3"/>
  <text class="ink sm" x="168.0" y="114" text-anchor="middle">0.45</text>
  <rect class="box" x="210" y="96" width="86" height="26" rx="3"/>
  <text class="ink sm" x="253.0" y="114" text-anchor="middle">−1.54</text>
  <rect class="box" x="300" y="96" width="80" height="26" rx="3"/>
  <text class="ink sm b" x="340.0" y="114" text-anchor="middle">−0.69</text>
  <rect class="box-ok" x="488.3145666820317" y="100" width="41.685433317968325" height="18" rx="2"/>
  <rect class="box" x="20" y="126" width="106" height="26" rx="3"/>
  <text class="ink sm b" x="73.0" y="144" text-anchor="middle">но</text>
  <rect class="box" x="130" y="126" width="76" height="26" rx="3"/>
  <text class="ink sm" x="168.0" y="144" text-anchor="middle">0.31</text>
  <rect class="box" x="210" y="126" width="86" height="26" rx="3"/>
  <text class="ink sm" x="253.0" y="144" text-anchor="middle">+6.85</text>
  <rect class="box" x="300" y="126" width="80" height="26" rx="3"/>
  <text class="ink sm b" x="340.0" y="144" text-anchor="middle">+2.12</text>
  <rect class="box-err" x="530" y="130" width="127.20077303291563" height="18" rx="2"/>
  <rect class="box" x="20" y="156" width="106" height="26" rx="3"/>
  <text class="ink sm b" x="73.0" y="174" text-anchor="middle">выпечка</text>
  <rect class="box" x="130" y="156" width="76" height="26" rx="3"/>
  <text class="ink sm" x="168.0" y="174" text-anchor="middle">0.46</text>
  <rect class="box" x="210" y="156" width="86" height="26" rx="3"/>
  <text class="ink sm" x="253.0" y="174" text-anchor="middle">−0.05</text>
  <rect class="box" x="300" y="156" width="80" height="26" rx="3"/>
  <text class="ink sm b" x="340.0" y="174" text-anchor="middle">−0.02</text>
  <rect class="box-ok" x="528.5334825010463" y="160" width="1.466517498953696" height="18" rx="2"/>
  <rect class="box" x="20" y="186" width="106" height="26" rx="3"/>
  <text class="ink sm b" x="73.0" y="204" text-anchor="middle">вчерашняя</text>
  <rect class="box" x="130" y="186" width="76" height="26" rx="3"/>
  <text class="ink sm" x="168.0" y="204" text-anchor="middle">0.57</text>
  <rect class="box" x="210" y="186" width="86" height="26" rx="3"/>
  <text class="ink sm" x="253.0" y="204" text-anchor="middle">+1.05</text>
  <rect class="box" x="300" y="186" width="80" height="26" rx="3"/>
  <text class="ink sm b" x="340.0" y="204" text-anchor="middle">+0.60</text>
  <rect class="box-err" x="530" y="190" width="36.04812907935448" height="18" rx="2"/>
  <rect class="box" x="20" y="216" width="276" height="26" rx="3"/>
  <text class="ink2 sm" x="28" y="234" text-anchor="start">свободный член (intercept)</text>
  <rect class="box" x="300" y="216" width="80" height="26" rx="3"/>
  <text class="ink sm b" x="340.0" y="234" text-anchor="middle">−0.15</text>
  <path class="ln" d="M530,62 L530,242"/>
  <rect class="box-acc" x="20" y="252" width="360" height="30" rx="4"/>
  <text class="ink sm b" x="28" y="272" text-anchor="start">сумма z = 1.76 → σ(z) = 1 / (1 + e^(−z)) = 0.85</text>
  <text class="err b" x="530" y="272" text-anchor="middle">P(недоволен) = 0.85</text>
  <text class="ink2 sm" x="350" y="308" text-anchor="middle">«курьер» и «вежливый» тянут к «доволен», «но» и «вчерашняя» перевешивают</text>
</svg>
