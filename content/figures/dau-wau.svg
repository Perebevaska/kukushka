  <text class="ink2 sm" x="350" y="220" text-anchor="middle">Сумма DAU (9) ≠ WAU (4): гость A посчитан в сумме 5 раз, а в WAU — один</text>
  <text class="mut sm" x="350" y="240" text-anchor="middle">Так же месяц: MAU — разные гости за месяц, sticky = средний DAU / MAU</text>
