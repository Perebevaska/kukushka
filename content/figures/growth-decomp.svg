<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-growth-decomp">
  <title id="t-growth-decomp">Выручка как площадь: заказы × средний чек</title>
  <defs><marker id="ah-growth-decomp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="104" y="86" width="290" height="170" rx="0"/>
  <rect class="box-acc" x="394" y="86" width="50" height="170" rx="0"/>
  <rect class="box-ok" x="104" y="50" width="290" height="36" rx="0"/>
  <rect class="box-warn" x="394" y="50" width="50" height="36" rx="0"/>
  <text class="ink b" x="249.0" y="163.0" text-anchor="middle">октябрь</text>
  <text class="ink2 sm" x="249.0" y="185.0" text-anchor="middle">700 × 333.9 = 233 756 ₽</text>
  <text class="ink sm" x="249.0" y="73" text-anchor="middle">дороже чек</text>
  <text class="acc sm b" x="419.0" y="175.0" text-anchor="middle">+38</text>
  <text class="mut sm" x="96" y="167.0" text-anchor="end">высота —</text>
  <text class="mut sm" x="96" y="183.0" text-anchor="end">средний чек</text>
  <text class="mut sm" x="274.0" y="276" text-anchor="middle">ширина — число заказов: 700 → 738</text>
  <text class="ok sm b" x="96" y="73" text-anchor="end">+13.2 ₽</text>
  <text class="ink sm b" x="476" y="40" text-anchor="start">прирост выручки ноября</text>
  <rect class="box-acc" x="476" y="58" width="16" height="16" rx="2"/>
  <text class="ink sm b" x="500" y="71" text-anchor="start">больше заказов</text>
  <text class="ink2 sm" x="500" y="89" text-anchor="start">38 × 333.9 = 12 690 ₽</text>
  <rect class="box-ok" x="476" y="104" width="16" height="16" rx="2"/>
  <text class="ink sm b" x="500" y="117" text-anchor="start">дороже чек</text>
  <text class="ink2 sm" x="500" y="135" text-anchor="start">700 × 13.2 = 9 250 ₽</text>
  <rect class="box-warn" x="476" y="150" width="16" height="16" rx="2"/>
  <text class="ink sm b" x="500" y="163" text-anchor="start">оба сразу</text>
  <text class="ink2 sm" x="500" y="181" text-anchor="start">38 × 13.2 = 502 ₽</text>
  <text class="ink b" x="476" y="210" text-anchor="start">итого +22 442 ₽</text>
  <text class="ink2 sm" x="476" y="230" text-anchor="start">256 198 − 233 756</text>
  <text class="mut sm" x="350" y="302" text-anchor="middle">ноябрь — весь прямоугольник: 738 заказов × 347.2 ₽; ширина полос условная, не в масштабе</text>
  <text class="mut sm" x="350" y="322" text-anchor="middle">полосы показывают, сколько рублей роста дал каждый множитель</text>
</svg>
