<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-nn-comp-graph">
  <title id="t-nn-comp-graph">Граф вычислений: значения вперёд и градиенты назад</title>
  <defs><marker id="ah-nn-comp-graph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="16" y="38" width="88" height="44" rx="8"/>
  <text class="acc sm b" x="60" y="56" text-anchor="middle">w = 3</text>
  <text class="err sm" x="60" y="74" text-anchor="middle">∂L/∂w = −12</text>
  <rect class="box" x="16" y="118" width="88" height="44" rx="8"/>
  <text class="acc sm b" x="60" y="136" text-anchor="middle">x = 2</text>
  <text class="err sm" x="60" y="154" text-anchor="middle">∂L/∂x = −18</text>
  <circle class="box-acc" cx="190" cy="100" r="20"/>
  <text class="ink b" x="190" y="105" text-anchor="middle">×</text>
  <text class="acc sm b" x="190" y="70" text-anchor="middle">u = 6</text>
  <text class="err sm" x="190" y="138" text-anchor="middle">∂L/∂u = −6</text>
  <text class="mut sm" x="190" y="154" text-anchor="middle">локально: x и w</text>
  <path class="ln" d="M106,66 L168,92" marker-end="url(#ah-nn-comp-graph)"/>
  <path class="ln" d="M106,134 L168,108" marker-end="url(#ah-nn-comp-graph)"/>
  <rect class="box" x="146" y="198" width="88" height="44" rx="8"/>
  <text class="acc sm b" x="190" y="216" text-anchor="middle">b = 1</text>
  <text class="err sm" x="190" y="234" text-anchor="middle">∂L/∂b = −6</text>
  <circle class="box-acc" cx="320" cy="160" r="20"/>
  <text class="ink b" x="320" y="165" text-anchor="middle">+</text>
  <text class="acc sm b" x="320" y="130" text-anchor="middle">z = 7</text>
  <text class="err sm" x="318" y="198" text-anchor="start">∂L/∂z = −6</text>
  <text class="mut sm" x="318" y="214" text-anchor="start">локально: 1 и 1</text>
  <path class="ln" d="M212,112 L300,150" marker-end="url(#ah-nn-comp-graph)"/>
  <path class="ln" d="M236,210 L300,172" marker-end="url(#ah-nn-comp-graph)"/>
  <rect class="box" x="406" y="228" width="88" height="44" rx="8"/>
  <text class="acc sm b" x="450" y="246" text-anchor="middle">y = 10</text>
  <text class="err sm" x="450" y="264" text-anchor="middle">∂L/∂y = +6</text>
  <circle class="box-acc" cx="450" cy="160" r="20"/>
  <text class="ink b" x="450" y="165" text-anchor="middle">−</text>
  <text class="acc sm b" x="450" y="130" text-anchor="middle">e = −3</text>
  <text class="err sm" x="450" y="94" text-anchor="middle">∂L/∂e = −6</text>
  <text class="mut sm" x="450" y="110" text-anchor="middle">локально: 1 и −1</text>
  <path class="ln" d="M342,160 L428,160" marker-end="url(#ah-nn-comp-graph)"/>
  <path class="ln" d="M450,228 L450,182" marker-end="url(#ah-nn-comp-graph)"/>
  <circle class="box-err" cx="625" cy="160" r="22"/>
  <text class="ink b" x="625" y="165" text-anchor="middle">e²</text>
  <text class="acc sm b" x="625" y="124" text-anchor="middle">L = 9</text>
  <text class="err sm" x="625" y="204" text-anchor="middle">старт: ∂L/∂L = 1</text>
  <text class="mut sm" x="625" y="220" text-anchor="middle">локально: 2e = −6</text>
  <path class="ln" d="M472,160 L601,160" marker-end="url(#ah-nn-comp-graph)"/>
  <text class="acc sm b" x="560" y="26" text-anchor="middle">синее — значения вперёд</text>
  <text class="err sm b" x="560" y="44" text-anchor="middle">красное — градиенты назад</text>
  <text class="ink2 sm" x="560" y="62" text-anchor="middle">градиент = пришедший сверху × локальный</text>
</svg>
