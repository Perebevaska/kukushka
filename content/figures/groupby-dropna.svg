<svg viewBox="0 0 700 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-groupby-dropna">
  <title id="t-groupby-dropna">groupby выбрасывает строки с пропуском в ключе</title>
  <defs><marker id="ah-groupby-dropna" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="105.0" y="36" text-anchor="middle">4 анкеты</text>
  <rect class="box" x="20" y="44" width="170" height="24" rx="3"/>
  <text class="ink2 sm b" x="65.0" y="60.5" text-anchor="middle">city</text>
  <text class="ink2 sm b" x="150.0" y="60.5" text-anchor="middle">bonus</text>
  <rect class="box-acc" x="20" y="70" width="170" height="24" rx="3"/>
  <text class="ink sm" x="65.0" y="86.5" text-anchor="middle">Пермь</text>
  <text class="ink sm" x="150.0" y="86.5" text-anchor="middle">100</text>
  <rect class="box-warn" x="20" y="96" width="170" height="24" rx="3"/>
  <text class="err sm b" x="65.0" y="112.5" text-anchor="middle">NaN</text>
  <text class="ink sm" x="150.0" y="112.5" text-anchor="middle">50</text>
  <rect class="box-ok" x="20" y="122" width="170" height="24" rx="3"/>
  <text class="ink sm" x="65.0" y="138.5" text-anchor="middle">Казань</text>
  <text class="ink sm" x="150.0" y="138.5" text-anchor="middle">200</text>
  <rect class="box-acc" x="20" y="148" width="170" height="24" rx="3"/>
  <text class="ink sm" x="65.0" y="164.5" text-anchor="middle">Пермь</text>
  <text class="ink sm" x="150.0" y="164.5" text-anchor="middle">30</text>
  <text class="ink b" x="105" y="200" text-anchor="middle">всего: 380</text>
  <text class="acc sm b" x="300" y="62" text-anchor="start">groupby("city")</text>
  <rect class="box" x="450" y="44" width="180" height="24" rx="3"/>
  <text class="ink2 sm b" x="500.0" y="60.5" text-anchor="middle">city</text>
  <text class="ink2 sm b" x="590.0" y="60.5" text-anchor="middle">sum</text>
  <rect class="box-ok" x="450" y="70" width="180" height="24" rx="3"/>
  <text class="ink sm" x="500.0" y="86.5" text-anchor="middle">Казань</text>
  <text class="ink sm" x="590.0" y="86.5" text-anchor="middle">200</text>
  <rect class="box-acc" x="450" y="96" width="180" height="24" rx="3"/>
  <text class="ink sm" x="500.0" y="112.5" text-anchor="middle">Пермь</text>
  <text class="ink sm" x="590.0" y="112.5" text-anchor="middle">130</text>
  <text class="err b" x="640" y="88" text-anchor="start">= 330</text>
  <text class="err sm" x="540" y="136" text-anchor="middle">анкета с NaN и её 50 бонусов исчезли</text>
  <text class="acc sm b" x="300" y="172" text-anchor="start">groupby("city",</text>
  <text class="acc sm b" x="300" y="188" text-anchor="start">dropna=False)</text>
  <rect class="box-ok" x="450" y="158" width="180" height="24" rx="3"/>
  <text class="ink sm" x="500.0" y="174.5" text-anchor="middle">Казань</text>
  <text class="ink sm" x="590.0" y="174.5" text-anchor="middle">200</text>
  <rect class="box-acc" x="450" y="184" width="180" height="24" rx="3"/>
  <text class="ink sm" x="500.0" y="200.5" text-anchor="middle">Пермь</text>
  <text class="ink sm" x="590.0" y="200.5" text-anchor="middle">130</text>
  <rect class="box-warn" x="450" y="210" width="180" height="24" rx="3"/>
  <text class="err sm b" x="500.0" y="226.5" text-anchor="middle">NaN</text>
  <text class="ink sm" x="590.0" y="226.5" text-anchor="middle">50</text>
  <text class="ok b" x="640" y="200" text-anchor="start">= 380</text>
  <path class="ln-mut" d="M196,120 C240,120 250,58 292,58" marker-end="url(#ah-groupby-dropna)"/>
  <path class="ln-mut" d="M196,120 C240,120 250,180 292,180" marker-end="url(#ah-groupby-dropna)"/>
  <text class="mut sm" x="350" y="260" text-anchor="middle">сверка: сумма по группам должна совпасть с общей суммой</text>
</svg>
