<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ci-decision">
  <title id="t-ci-decision">Решение по интервалу разницы: где он лежит относительно нуля и MDE</title>
  <defs><marker id="ah-ci-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink sm b" x="20" y="59" text-anchor="start">пуш, урок 7</text>
  <rect class="box-acc" x="253.4" y="44" width="136.7" height="22" rx="11"/>
  <circle class="ink" cx="321.8" cy="55.0" r="3.5"/>
  <text class="mut sm" x="86.0" y="59" text-anchor="middle"></text>
  <text class="ink2 sm" x="445" y="59" text-anchor="start">эффект есть, но может быть &lt; MDE</text>
  <text class="mut sm" x="20" y="105" text-anchor="start">условно</text>
  <rect class="box-ok" x="338.0" y="90" width="90.0" height="22" rx="11"/>
  <circle class="ink" cx="383.0" cy="101.0" r="3.5"/>
  <text class="mut sm" x="86.0" y="105" text-anchor="middle"></text>
  <text class="ink2 sm" x="445" y="105" text-anchor="start">весь ДИ выше MDE — внедрять</text>
  <text class="mut sm" x="20" y="151" text-anchor="start">условно</text>
  <rect class="box-warn" x="194.0" y="136" width="153.0" height="22" rx="11"/>
  <circle class="ink" cx="270.5" cy="147.0" r="3.5"/>
  <text class="mut sm" x="86.0" y="151" text-anchor="middle"></text>
  <text class="ink2 sm" x="445" y="151" text-anchor="start">захватывает 0 — не доказан</text>
  <text class="mut sm" x="20" y="197" text-anchor="start">условно</text>
  <rect class="box-err" x="113.0" y="182" width="90.0" height="22" rx="11"/>
  <circle class="ink" cx="158.0" cy="193.0" r="3.5"/>
  <text class="mut sm" x="86.0" y="197" text-anchor="middle"></text>
  <text class="ink2 sm" x="445" y="197" text-anchor="start">целиком ниже 0 — вредит</text>
  <text class="acc sm b" x="253.4" y="36" text-anchor="middle">0.5</text>
  <text class="acc sm b" x="390.1" y="36" text-anchor="middle">3.6</text>
  <path class="ln dash" d="M230,30 L230,230"/>
  <text class="ink sm b" x="230" y="246" text-anchor="middle">0</text>
  <path class="ln-acc dash" d="M320,30 L320,230"/>
  <text class="acc sm b" x="320" y="246" text-anchor="middle">MDE 2 п.п.</text>
  <text class="mut sm" x="350" y="270" text-anchor="middle">по оси — разница B − A в процентных пунктах; три нижние строки — условные примеры</text>
</svg>
