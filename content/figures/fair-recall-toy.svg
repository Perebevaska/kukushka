<svg viewBox="0 0 700 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-fair-recall-toy">
  <title id="t-fair-recall-toy">Полнота по группам: какая доля уходящих получила бонус</title>
  <defs><marker id="ah-fair-recall-toy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <circle class="box-ok" cx="160" cy="20" r="9"/>
  <text class="ink2 sm" x="176" y="24" text-anchor="start">уходящий, получил бонус</text>
  <circle class="box-err" cx="370" cy="20" r="9"/>
  <text class="ink2 sm" x="386" y="24" text-anchor="start">уходящий, бонуса нет</text>
  <text class="ink b" x="150" y="71" text-anchor="end">младше 50</text>
  <text class="mut sm" x="150" y="88" text-anchor="end">6 уходящих</text>
  <circle class="box-ok" cx="186" cy="66" r="14"/>
  <circle class="box-ok" cx="226" cy="66" r="14"/>
  <circle class="box-ok" cx="266" cy="66" r="14"/>
  <circle class="box-ok" cx="306" cy="66" r="14"/>
  <circle class="box-ok" cx="346" cy="66" r="14"/>
  <circle class="box-err" cx="386" cy="66" r="14"/>
  <text class="ink" x="440" y="71" text-anchor="start"><tspan class="ink2">полнота = </tspan><tspan class="b">5 / 6</tspan> = <tspan class="ok b">0.83</tspan></text>
  <text class="ink b" x="150" y="127" text-anchor="end">50 и старше</text>
  <text class="mut sm" x="150" y="144" text-anchor="end">4 уходящих</text>
  <circle class="box-ok" cx="186" cy="122" r="14"/>
  <circle class="box-ok" cx="226" cy="122" r="14"/>
  <circle class="box-err" cx="266" cy="122" r="14"/>
  <circle class="box-err" cx="306" cy="122" r="14"/>
  <text class="ink" x="440" y="127" text-anchor="start"><tspan class="ink2">полнота = </tspan><tspan class="b">2 / 4</tspan> = <tspan class="err b">0.50</tspan></text>
  <text class="ink2 sm" x="350" y="180" text-anchor="middle">знаменатель — только уходящие гости группы: сколько из тех, кому бонус нужен, его получили</text>
  <text class="mut sm" x="350" y="202" text-anchor="middle">доля получивших бонус среди всех гостей группы может совпадать — а полнота при этом разная</text>
</svg>
