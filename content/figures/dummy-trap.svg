<svg viewBox="0 0 700 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-dummy-trap">
  <title id="t-dummy-trap">Все флаги get_dummies плюс столбец единиц: один столбец лишний</title>
  <defs><marker id="ah-dummy-trap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="250.0" y="32" text-anchor="middle">первые строки X2 (5 столбцов)</text>
  <rect class="box" x="30" y="40" width="440" height="28" rx="3"/>
  <text class="ink2 sm b" x="55.0" y="58.5" text-anchor="middle">1</text>
  <text class="ink2 sm b" x="110.0" y="58.5" text-anchor="middle">км</text>
  <text class="ink2 sm b" x="170.0" y="58.5" text-anchor="middle">авто</text>
  <text class="ink2 sm b" x="230.0" y="58.5" text-anchor="middle">вело</text>
  <text class="ink2 sm b" x="290.0" y="58.5" text-anchor="middle">пеший</text>
  <text class="ink2 sm b" x="395.0" y="58.5" text-anchor="middle">авто+вело+пеший</text>
  <rect class="box" x="30" y="70" width="440" height="28" rx="3"/>
  <text class="ink sm" x="55.0" y="88.5" text-anchor="middle">1</text>
  <text class="ink sm" x="110.0" y="88.5" text-anchor="middle">1.1</text>
  <text class="ink sm" x="170.0" y="88.5" text-anchor="middle">0</text>
  <text class="ink sm" x="230.0" y="88.5" text-anchor="middle">0</text>
  <text class="ink sm" x="290.0" y="88.5" text-anchor="middle">1</text>
  <text class="ink sm" x="395.0" y="88.5" text-anchor="middle">1</text>
  <rect class="box" x="30" y="100" width="440" height="28" rx="3"/>
  <text class="ink sm" x="55.0" y="118.5" text-anchor="middle">1</text>
  <text class="ink sm" x="110.0" y="118.5" text-anchor="middle">4.2</text>
  <text class="ink sm" x="170.0" y="118.5" text-anchor="middle">1</text>
  <text class="ink sm" x="230.0" y="118.5" text-anchor="middle">0</text>
  <text class="ink sm" x="290.0" y="118.5" text-anchor="middle">0</text>
  <text class="ink sm" x="395.0" y="118.5" text-anchor="middle">1</text>
  <rect class="box" x="30" y="130" width="440" height="28" rx="3"/>
  <text class="ink sm" x="55.0" y="148.5" text-anchor="middle">1</text>
  <text class="ink sm" x="110.0" y="148.5" text-anchor="middle">4.6</text>
  <text class="ink sm" x="170.0" y="148.5" text-anchor="middle">0</text>
  <text class="ink sm" x="230.0" y="148.5" text-anchor="middle">1</text>
  <text class="ink sm" x="290.0" y="148.5" text-anchor="middle">0</text>
  <text class="ink sm" x="395.0" y="148.5" text-anchor="middle">1</text>
  <rect class="box" x="30" y="160" width="440" height="28" rx="3"/>
  <text class="ink sm" x="55.0" y="178.5" text-anchor="middle">1</text>
  <text class="ink sm" x="110.0" y="178.5" text-anchor="middle">2.4</text>
  <text class="ink sm" x="170.0" y="178.5" text-anchor="middle">1</text>
  <text class="ink sm" x="230.0" y="178.5" text-anchor="middle">0</text>
  <text class="ink sm" x="290.0" y="178.5" text-anchor="middle">0</text>
  <text class="ink sm" x="395.0" y="178.5" text-anchor="middle">1</text>
  <text class="acc sm b" x="30" y="210" text-anchor="start">в каждой строке сумма флагов = 1 = столбец единиц</text>
  <text class="err sm b" x="30" y="230" text-anchor="start">столбцов 5, независимых (ранг) — 4</text>
  <text class="ink sm b" x="595" y="40" text-anchor="middle">одинаковые прогнозы</text>
  <rect class="box" x="500" y="54" width="190" height="54" rx="6"/>
  <text class="ink sm" x="595.0" y="77.0" text-anchor="middle">b = 15.1</text>
  <text class="ink sm" x="595.0" y="94.0" text-anchor="middle">авто 0, вело 5.6, пеший 17.9</text>
  <text class="mut sm" x="595" y="128" text-anchor="middle">+10 к b, −10 к каждому флагу</text>
  <path class="ln" d="M595,134 L595,152" marker-end="url(#ah-dummy-trap)"/>
  <rect class="box" x="500" y="156" width="190" height="54" rx="6"/>
  <text class="ink sm" x="595.0" y="179.0" text-anchor="middle">b = 25.1</text>
  <text class="ink sm" x="595.0" y="196.0" text-anchor="middle">авто −10, вело −4.4, пеший 7.9</text>
  <text class="err sm b" x="595" y="230" text-anchor="middle">весов бесконечно много —</text>
  <text class="err sm b" x="595" y="248" text-anchor="middle">XᵀX вырождена</text>
  <text class="ink2 sm" x="350" y="288" text-anchor="middle">лечение: drop_first=True — один флаг уходит, и ранг снова равен числу столбцов</text>
</svg>
