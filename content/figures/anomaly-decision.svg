<svg viewBox="0 0 700 318" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-anomaly-decision">
  <title id="t-anomaly-decision">Что делать с аномалией: удалить, заменить на NaN, ограничить или пометить</title>
  <defs><marker id="ah-anomaly-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="50" y="6" width="220" height="30" rx="6"/>
  <text class="ink sm b" x="160.0" y="25.5" text-anchor="middle">нашли подозрительное значение</text>
  <path class="ln" d="M160,37 L160,50" marker-end="url(#ah-anomaly-decision)"/>
  <rect class="box-acc" x="20" y="52" width="280" height="40" rx="6"/>
  <text class="ink sm b" x="160.0" y="76.5" text-anchor="middle">может ли значение быть правдой?</text>
  <path class="ln" d="M302,72 L386,72" marker-end="url(#ah-anomaly-decision)"/>
  <text class="ink2 sm" x="344" y="64" text-anchor="middle">да / не знаем</text>
  <rect class="box-ok" x="390" y="52" width="290" height="40" rx="6"/>
  <text class="ink sm b" x="535.0" y="68.5" text-anchor="middle">оставить и пометить флагом</text>
  <text class="mut sm" x="535.0" y="84.5" text-anchor="middle">qty = 40: кофе на совещание?</text>
  <path class="ln" d="M160,94 L160,118" marker-end="url(#ah-anomaly-decision)"/>
  <text class="ink2 sm" x="170" y="110" text-anchor="start">нет</text>
  <rect class="box-acc" x="20" y="122" width="280" height="40" rx="6"/>
  <text class="ink sm b" x="160.0" y="146.5" text-anchor="middle">неверна вся строка?</text>
  <path class="ln" d="M302,142 L386,142" marker-end="url(#ah-anomaly-decision)"/>
  <text class="ink2 sm" x="344" y="134" text-anchor="middle">да</text>
  <rect class="box-err" x="390" y="122" width="290" height="40" rx="6"/>
  <text class="ink sm b" x="535.0" y="138.5" text-anchor="middle">удалить строку</text>
  <text class="mut sm" x="535.0" y="154.5" text-anchor="middle">тестовый заказ, заголовок посреди файла</text>
  <path class="ln" d="M160,164 L160,188" marker-end="url(#ah-anomaly-decision)"/>
  <text class="ink2 sm" x="170" y="180" text-anchor="start">нет</text>
  <rect class="box-acc" x="20" y="192" width="280" height="40" rx="6"/>
  <text class="ink sm b" x="160.0" y="216.5" text-anchor="middle">понятно, в какую сторону исправить?</text>
  <path class="ln" d="M302,212 L386,212" marker-end="url(#ah-anomaly-decision)"/>
  <text class="ink2 sm" x="344" y="204" text-anchor="middle">да</text>
  <rect class="box-warn" x="390" y="192" width="290" height="40" rx="6"/>
  <text class="ink sm b" x="535.0" y="208.5" text-anchor="middle">clip: ограничить</text>
  <text class="mut sm" x="535.0" y="224.5" text-anchor="middle">отрицательный баланс → 0</text>
  <path class="ln" d="M160,234 L160,258" marker-end="url(#ah-anomaly-decision)"/>
  <text class="ink2 sm" x="170" y="250" text-anchor="start">нет</text>
  <rect class="box-warn" x="20" y="262" width="280" height="40" rx="6"/>
  <text class="ink sm b" x="160.0" y="278.5" text-anchor="middle">mask: заменить на NaN</text>
  <text class="mut sm" x="160.0" y="294.5" text-anchor="middle">99 999 в бонусах; имя и город остаются</text>
  <text class="mut sm" x="530" y="280" text-anchor="middle">каждое решение — строка в журнале:</text>
  <text class="mut sm" x="530" y="296" text-anchor="middle">что нашли, сколько строк, что сделали</text>
</svg>
