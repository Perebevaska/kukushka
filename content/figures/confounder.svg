<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-confounder">
  <title id="t-confounder">Конфаундер: число позиций стоит и за суммой, и за временем</title>
  <defs><marker id="ah-confounder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-warn" x="270" y="20" width="160" height="52" rx="8"/>
  <text class="ink b" x="350" y="42" text-anchor="middle">позиций в заказе</text>
  <text class="mut sm" x="350" y="60" text-anchor="middle">items</text>
  <rect class="box" x="60" y="150" width="170" height="52" rx="8"/>
  <text class="ink b" x="145" y="172" text-anchor="middle">сумма заказа</text>
  <text class="mut sm" x="145" y="190" text-anchor="middle">amount</text>
  <rect class="box" x="470" y="150" width="170" height="52" rx="8"/>
  <text class="ink b" x="555" y="172" text-anchor="middle">время доставки</text>
  <text class="mut sm" x="555" y="190" text-anchor="middle">actual_min</text>
  <path class="ln-acc" d="M300,74 L175,146" marker-end="url(#ah-confounder)"/>
  <path class="ln-acc" d="M400,74 L525,146" marker-end="url(#ah-confounder)"/>
  <text class="acc b" x="196" y="100" text-anchor="end">r = 0.95</text>
  <text class="ink2 sm" x="214" y="118" text-anchor="end">больше позиций — больше сумма</text>
  <text class="acc b" x="504" y="100" text-anchor="start">r = 0.23</text>
  <text class="ink2 sm" x="486" y="118" text-anchor="start">и дольше сборка</text>
  <path class="ln-err dash" d="M234,176 L466,176"/>
  <text class="err b" x="350" y="168" text-anchor="middle">r ≈ 0.2</text>
  <text class="err sm" x="350" y="194" text-anchor="middle">связаны, но сумма</text>
  <text class="err sm" x="350" y="210" text-anchor="middle">не «тормозит» доставку</text>
  <text class="mut sm" x="350" y="234" text-anchor="middle">Проверка — корреляция суммы и времени внутри заказов с одинаковым числом позиций</text>
</svg>
