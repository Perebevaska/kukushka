<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-plt-anatomy">
  <title id="t-plt-anatomy">Полотно fig и область графика ax: что рисует каждый метод</title>
  <defs><marker id="ah-plt-anatomy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20" y="14" width="400" height="240" rx="8"/>
  <text class="ink2 sm b" x="32" y="34" text-anchor="start">fig — полотно, figsize=(7, 3)</text>
  <rect class="box-acc" x="78" y="62" width="320" height="140" rx="4"/>
  <text class="ink b" x="238" y="56" text-anchor="middle">Первый график</text>
  <path class="ln" d="M98,186 L388,186"/>
  <path class="ln" d="M98,186 L98,76"/>
  <path class="ln-acc" d="M118.0,176.0 L201.3,116.0 L284.7,146.0 L368.0,86.0"/>
  <circle class="box-acc" cx="118.0" cy="176.0" r="3.5"/>
  <text class="mut sm" x="118.0" y="200" text-anchor="middle">1</text>
  <circle class="box-acc" cx="201.33333333333331" cy="116.0" r="3.5"/>
  <text class="mut sm" x="201.33333333333331" y="200" text-anchor="middle">2</text>
  <circle class="box-acc" cx="284.66666666666663" cy="146.0" r="3.5"/>
  <text class="mut sm" x="284.66666666666663" y="200" text-anchor="middle">3</text>
  <circle class="box-acc" cx="368.0" cy="86.0" r="3.5"/>
  <text class="mut sm" x="368.0" y="200" text-anchor="middle">4</text>
  <text class="mut sm" x="92" y="180.0" text-anchor="end">10</text>
  <text class="mut sm" x="92" y="150.0" text-anchor="end">20</text>
  <text class="mut sm" x="92" y="120.0" text-anchor="end">30</text>
  <text class="mut sm" x="92" y="90.0" text-anchor="end">40</text>
  <text class="ink2 sm" x="238" y="232" text-anchor="middle">подпись оси X</text>
  <text class="ink2 sm" x="44" y="132" text-anchor="middle" transform="rotate(-90 44 132)">подпись оси Y</text>
  <text class="acc sm b" x="440" y="34" text-anchor="start">fig, ax = plt.subplots(figsize=(7, 3))</text>
  <text class="ink2 sm" x="440" y="50" text-anchor="start">одно полотно и одна область на нём</text>
  <text class="acc sm b" x="440" y="82" text-anchor="start">ax.set_title("…")</text>
  <text class="ink2 sm" x="440" y="98" text-anchor="start">заголовок над областью</text>
  <path class="ln-mut dash" d="M436,78 L300,52"/>
  <text class="acc sm b" x="440" y="130" text-anchor="start">ax.plot(x, y)</text>
  <text class="ink2 sm" x="440" y="146" text-anchor="start">точки (1, 10), (2, 30)… и линия</text>
  <path class="ln-mut dash" d="M436,126 L290.66666666666663,146.0"/>
  <text class="acc sm b" x="440" y="178" text-anchor="start">ax.set_xlabel / ax.set_ylabel</text>
  <text class="ink2 sm" x="440" y="194" text-anchor="start">подписи осей</text>
  <path class="ln-mut dash" d="M436,174 L300,228"/>
  <text class="acc sm b" x="440" y="226" text-anchor="start">ax — всё внутри рамки</text>
  <text class="ink2 sm" x="440" y="242" text-anchor="start">почти всё рисование — методы ax</text>
  <path class="ln-mut dash" d="M436,222 L398,190"/>
</svg>
