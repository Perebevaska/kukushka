<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-elif-flow">
  <title id="t-elif-flow">if / elif / else: выполняется первая подходящая ветка</title>
  <defs><marker id="ah-elif-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="20" y="40" width="120" height="40" rx="6"/>
  <text class="ink sm b" x="80.0" y="64.5" text-anchor="middle">avg_check = 420</text>
  <rect class="box" x="180" y="40" width="150" height="40" rx="6"/>
  <text class="ink sm b" x="255.0" y="64.5" text-anchor="middle">avg_check &lt; 300 ?</text>
  <rect class="box-acc" x="380" y="40" width="150" height="40" rx="6"/>
  <text class="ink sm b" x="455.0" y="64.5" text-anchor="middle">avg_check &lt; 600 ?</text>
  <rect class="box" x="570" y="40" width="110" height="40" rx="6"/>
  <text class="mut sm" x="625.0" y="64.5" text-anchor="middle">«высокий»</text>
  <rect class="box" x="180" y="140" width="150" height="40" rx="6"/>
  <text class="mut sm" x="255.0" y="164.5" text-anchor="middle">«низкий»</text>
  <rect class="box-ok" x="380" y="140" width="150" height="40" rx="6"/>
  <text class="ink b" x="455.0" y="164.5" text-anchor="middle">«средний»</text>
  <path class="ln-acc" d="M142,60 L176,60" marker-end="url(#ah-elif-flow)"/>
  <path class="ln-acc" d="M332,60 L376,60" marker-end="url(#ah-elif-flow)"/>
  <text class="acc sm b" x="354" y="52" text-anchor="middle">нет</text>
  <path class="ln-mut" d="M532,60 L566,60" marker-end="url(#ah-elif-flow)"/>
  <text class="mut sm" x="549" y="52" text-anchor="middle">нет</text>
  <path class="ln-mut" d="M255,82 L255,136" marker-end="url(#ah-elif-flow)"/>
  <text class="mut sm" x="262" y="114" text-anchor="start">да</text>
  <path class="ln-acc" d="M455,82 L455,136" marker-end="url(#ah-elif-flow)"/>
  <text class="acc sm b" x="462" y="114" text-anchor="start">да</text>
  <text class="acc sm" x="354" y="30" text-anchor="middle">420 &lt; 300 — ложь</text>
  <text class="acc sm" x="446" y="114" text-anchor="end">420 &lt; 600 — истина</text>
  <text class="mut sm" x="625" y="100" text-anchor="middle">не проверяется:</text>
  <text class="mut sm" x="625" y="116" text-anchor="middle">ветка уже найдена</text>
  <text class="ink2 sm" x="350" y="212" text-anchor="middle">Путь для 420 выделен: первая проверка ложна, вторая истинна → «средний». Узкие условия ставят выше широких.</text>
</svg>
