<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-shell-pipe">
  <title id="t-shell-pipe">Конвейер команд: вывод первой команды идёт на вход второй</title>
  <defs><marker id="ah-shell-pipe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="14" y="40" width="120" height="60" rx="8"/>
  <text class="ink sm b" x="74.0" y="64" text-anchor="middle">orders_3m.csv</text>
  <text class="ink2 sm" x="74.0" y="84" text-anchor="middle">2 090 строк</text>
  <rect class="box-acc" x="186" y="40" width="150" height="60" rx="8"/>
  <text class="ink sm b" x="261.0" y="64" text-anchor="middle">grep "Сезонный"</text>
  <text class="ink2 sm" x="261.0" y="84" text-anchor="middle">оставляет строки</text>
  <rect class="box" x="388" y="40" width="100" height="60" rx="8"/>
  <text class="ink sm b" x="438.0" y="64" text-anchor="middle">82 строки</text>
  <text class="ink2 sm" x="438.0" y="84" text-anchor="middle">с «Сезонный»</text>
  <rect class="box-acc" x="540" y="40" width="146" height="60" rx="8"/>
  <text class="ink sm b" x="613.0" y="64" text-anchor="middle">grep -c "доставка"</text>
  <text class="ink2 sm" x="613.0" y="84" text-anchor="middle">считает строки</text>
  <path class="ln" d="M136,70 L182,70" marker-end="url(#ah-shell-pipe)"/>
  <path class="ln" d="M338,70 L384,70" marker-end="url(#ah-shell-pipe)"/>
  <text class="acc b" x="512" y="64" text-anchor="middle">|</text>
  <path class="ln" d="M490,70 L536,70" marker-end="url(#ah-shell-pipe)"/>
  <rect class="box-ok" x="570" y="122" width="86" height="40" rx="8"/>
  <text class="ok b" x="613" y="148" text-anchor="middle">11</text>
  <path class="ln" d="M613,102 L613,118" marker-end="url(#ah-shell-pipe)"/>
  <text class="ink2 sm" x="14" y="26" text-anchor="start">$ grep "Сезонный" data/orders_3m.csv | grep -c "доставка"</text>
  <text class="ink2 sm" x="280" y="134" text-anchor="middle">из 2 090 строк файла (заголовок + заказы)</text>
  <text class="ink2 sm" x="280" y="154" text-anchor="middle">82 — с сезонным напитком, из них 11 — доставка</text>
  <text class="mut sm" x="280" y="184" text-anchor="middle">каждая команда делает одно дело; | соединяет их в цепочку</text>
</svg>
