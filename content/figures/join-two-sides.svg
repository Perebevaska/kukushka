<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-join-two-sides">
  <title id="t-join-two-sides">Соединение анкет и заказов проверяют с обеих сторон</title>
  <defs><marker id="ah-join-two-sides" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="95" y="22" text-anchor="middle">анкеты</text>
  <text class="mut sm b" x="550" y="22" text-anchor="middle">заказы: №, карта, сумма</text>
  <rect class="box-acc" x="40" y="34" width="110" height="30" rx="3"/>
  <text class="ink sm" x="95.0" y="53.5" text-anchor="middle">C1</text>
  <rect class="box" x="40" y="78" width="110" height="30" rx="3"/>
  <text class="ink sm" x="95.0" y="97.5" text-anchor="middle">C2</text>
  <rect class="box" x="40" y="122" width="110" height="30" rx="3"/>
  <text class="ink sm" x="95.0" y="141.5" text-anchor="middle">C3</text>
  <rect class="box-acc" x="440" y="34" width="220" height="30" rx="3"/>
  <text class="ink sm" x="470.0" y="53.5" text-anchor="middle">1</text>
  <text class="ink sm" x="545.0" y="53.5" text-anchor="middle">C1</text>
  <text class="ink sm" x="625.0" y="53.5" text-anchor="middle">300</text>
  <rect class="box-acc" x="440" y="78" width="220" height="30" rx="3"/>
  <text class="ink sm" x="470.0" y="97.5" text-anchor="middle">2</text>
  <text class="ink sm" x="545.0" y="97.5" text-anchor="middle">C1</text>
  <text class="ink sm" x="625.0" y="97.5" text-anchor="middle">250</text>
  <rect class="box-err" x="440" y="122" width="220" height="30" rx="3"/>
  <text class="ink sm" x="470.0" y="141.5" text-anchor="middle">3</text>
  <text class="ink sm" x="545.0" y="141.5" text-anchor="middle">C4</text>
  <text class="ink sm" x="625.0" y="141.5" text-anchor="middle">400</text>
  <rect class="box-warn" x="440" y="166" width="220" height="30" rx="3"/>
  <text class="ink sm" x="470.0" y="185.5" text-anchor="middle">4</text>
  <text class="ink sm" x="545.0" y="185.5" text-anchor="middle">—</text>
  <text class="ink sm" x="625.0" y="185.5" text-anchor="middle">200</text>
  <path class="ln-acc" d="M438,49 C340,49 250,49 152,49" marker-end="url(#ah-join-two-sides)"/>
  <path class="ln-acc" d="M438,93 C340,93 250,49 152,49" marker-end="url(#ah-join-two-sides)"/>
  <text class="acc sm b" x="160" y="30" text-anchor="start">2 заказа на 550 ₽</text>
  <text class="ok sm b" x="158" y="98" text-anchor="start">0 заказов</text>
  <text class="ok sm b" x="158" y="142" text-anchor="start">0 заказов</text>
  <path class="ln-err dash" d="M438,137 H416" marker-end="url(#ah-join-two-sides)"/>
  <rect class="box-err" x="300" y="124" width="112" height="26" rx="6"/>
  <text class="err sm b" x="356.0" y="141.5" text-anchor="middle">C4: нет анкеты</text>
  <text class="err sm" x="356" y="168" text-anchor="middle">повод искать ошибку:</text>
  <text class="err sm" x="356" y="184" text-anchor="middle">опечатка в номере, потеря</text>
  <text class="err sm" x="356" y="200" text-anchor="middle">при выгрузке или очистке</text>
  <text class="warn sm" x="660" y="212" text-anchor="end">без карты — не ошибка: в выручку</text>
  <text class="warn sm" x="660" y="228" text-anchor="end">сети входит, в анализ гостей — нет</text>
  <text class="ok sm" x="20" y="196" text-anchor="start">C2, C3 без заказов — нормально:</text>
  <text class="ok sm" x="20" y="212" text-anchor="start">завели карту и не пришли осенью</text>
  <text class="ink sm" x="350" y="290" text-anchor="middle">выручка гостей с анкетой: 550 из 1 150 ₽ — inner join молча потерял бы обе «сироты»</text>
</svg>
