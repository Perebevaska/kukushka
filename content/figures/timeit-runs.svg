<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-timeit-runs">
  <title id="t-timeit-runs">Что измеряет %timeit: серии запусков, время одного запуска, среднее и разброс (условные числа)</title>
  <defs><marker id="ah-timeit-runs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="350" y="22" text-anchor="middle">%timeit df.apply(…): что происходит внутри (условные числа)</text>
  <text class="acc b" x="20" y="52" text-anchor="start">1</text>
  <text class="ink2 sm" x="36" y="52" text-anchor="start">подбирает число запусков в серии: 1, 10, 100… пока серия не займёт ≥ 0.2 с</text>
  <rect class="box" x="36" y="62" width="176" height="26" rx="4"/>
  <text class="ink sm" x="124.0" y="80" text-anchor="middle">1 × 13.2 мс = 0.0132 с</text>
  <path class="ln" d="M216,75 L234,75" marker-end="url(#ah-timeit-runs)"/>
  <rect class="box" x="238" y="62" width="176" height="26" rx="4"/>
  <text class="ink sm" x="326.0" y="80" text-anchor="middle">10 × 13.2 мс = 0.132 с</text>
  <path class="ln" d="M418,75 L436,75" marker-end="url(#ah-timeit-runs)"/>
  <rect class="box-ok" x="440" y="62" width="176" height="26" rx="4"/>
  <text class="ok sm b" x="528.0" y="80" text-anchor="middle">100 × 13.2 мс = 1.32 с ✓</text>
  <text class="acc b" x="20" y="120" text-anchor="start">2</text>
  <text class="ink2 sm" x="36" y="120" text-anchor="start">повторяет 7 серий по 100 запусков и делит время серии на 100</text>
  <rect class="box" x="36" y="130" width="86" height="62" rx="4"/>
  <text class="mut sm" x="79.0" y="147" text-anchor="middle">серия 1</text>
  <text class="ink2 sm" x="79.0" y="164" text-anchor="middle">1.25 с / 100</text>
  <text class="ink sm b" x="79.0" y="183" text-anchor="middle">= 12.5 мс</text>
  <rect class="box" x="128" y="130" width="86" height="62" rx="4"/>
  <text class="mut sm" x="171.0" y="147" text-anchor="middle">серия 2</text>
  <text class="ink2 sm" x="171.0" y="164" text-anchor="middle">1.30 с / 100</text>
  <text class="ink sm b" x="171.0" y="183" text-anchor="middle">= 13.0 мс</text>
  <rect class="box" x="220" y="130" width="86" height="62" rx="4"/>
  <text class="mut sm" x="263.0" y="147" text-anchor="middle">серия 3</text>
  <text class="ink2 sm" x="263.0" y="164" text-anchor="middle">1.46 с / 100</text>
  <text class="ink sm b" x="263.0" y="183" text-anchor="middle">= 14.6 мс</text>
  <rect class="box" x="312" y="130" width="86" height="62" rx="4"/>
  <text class="mut sm" x="355.0" y="147" text-anchor="middle">серия 4</text>
  <text class="ink2 sm" x="355.0" y="164" text-anchor="middle">1.25 с / 100</text>
  <text class="ink sm b" x="355.0" y="183" text-anchor="middle">= 12.5 мс</text>
  <rect class="box" x="404" y="130" width="86" height="62" rx="4"/>
  <text class="mut sm" x="447.0" y="147" text-anchor="middle">серия 5</text>
  <text class="ink2 sm" x="447.0" y="164" text-anchor="middle">1.33 с / 100</text>
  <text class="ink sm b" x="447.0" y="183" text-anchor="middle">= 13.3 мс</text>
  <rect class="box" x="496" y="130" width="86" height="62" rx="4"/>
  <text class="mut sm" x="539.0" y="147" text-anchor="middle">серия 6</text>
  <text class="ink2 sm" x="539.0" y="164" text-anchor="middle">1.23 с / 100</text>
  <text class="ink sm b" x="539.0" y="183" text-anchor="middle">= 12.3 мс</text>
  <rect class="box" x="588" y="130" width="86" height="62" rx="4"/>
  <text class="mut sm" x="631.0" y="147" text-anchor="middle">серия 7</text>
  <text class="ink2 sm" x="631.0" y="164" text-anchor="middle">1.42 с / 100</text>
  <text class="ink sm b" x="631.0" y="183" text-anchor="middle">= 14.2 мс</text>
  <text class="acc b" x="20" y="220" text-anchor="start">3</text>
  <text class="ink2 sm" x="36" y="220" text-anchor="start">среднее 7 чисел — время одного запуска, стандартное отклонение — разброс между сериями</text>
  <rect class="box-acc" x="179.50741260626813" y="256" width="264.9851747874641" height="24" rx="3"/>
  <path class="ln" d="M120,282 L600,282"/>
  <path class="ln" d="M120.0,279 L120.0,285"/>
  <text class="mut sm" x="120.0" y="298" text-anchor="middle">12</text>
  <path class="ln" d="M200.0,279 L200.0,285"/>
  <text class="mut sm" x="200.0" y="298" text-anchor="middle">12.5</text>
  <path class="ln" d="M280.0,279 L280.0,285"/>
  <text class="mut sm" x="280.0" y="298" text-anchor="middle">13</text>
  <path class="ln" d="M360.0,279 L360.0,285"/>
  <text class="mut sm" x="360.0" y="298" text-anchor="middle">13.5</text>
  <path class="ln" d="M440.0,279 L440.0,285"/>
  <text class="mut sm" x="440.0" y="298" text-anchor="middle">14</text>
  <path class="ln" d="M520.0,279 L520.0,285"/>
  <text class="mut sm" x="520.0" y="298" text-anchor="middle">14.5</text>
  <path class="ln" d="M600.0,279 L600.0,285"/>
  <text class="mut sm" x="600.0" y="298" text-anchor="middle">15</text>
  <text class="mut sm" x="608" y="286" text-anchor="start">мс</text>
  <path class="ln-acc" d="M312.00000000000017,252 L312.00000000000017,282"/>
  <circle class="box-warn" cx="168.0000000000001" cy="273" r="4.5"/>
  <circle class="box-warn" cx="200.0" cy="273" r="4.5"/>
  <circle class="box-warn" cx="200.0" cy="263" r="4.5"/>
  <circle class="box-warn" cx="280.0" cy="273" r="4.5"/>
  <circle class="box-warn" cx="328.0000000000001" cy="273" r="4.5"/>
  <circle class="box-warn" cx="471.9999999999999" cy="273" r="4.5"/>
  <circle class="box-warn" cx="536.0" cy="273" r="4.5"/>
  <text class="acc sm b" x="307.00000000000017" y="248" text-anchor="end">среднее 13.2 мс</text>
  <text class="ink2 sm" x="317.00000000000017" y="248" text-anchor="start">разброс ± 0.83 мс</text>
  <rect class="box-ok" x="36" y="308" width="628" height="30" rx="4"/>
  <text class="ink sm b" x="350" y="328" text-anchor="middle">13.2 ms ± 828 μs per loop (mean ± std. dev. of 7 runs, 100 loops each)</text>
</svg>
