<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-tuple-key">
  <title id="t-tuple-key">Кортеж (город, месяц) как ключ словаря</title>
  <defs><marker id="ah-tuple-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm" x="140" y="26" text-anchor="middle">orders</text>
  <rect class="box-acc" x="20" y="36" width="240" height="26" rx="4"/>
  <text class="ink sm" x="110" y="54" text-anchor="middle">("Пермь", "сентябрь")</text>
  <text class="ink sm b" x="232" y="54" text-anchor="middle">450</text>
  <rect class="box-ok" x="20" y="68" width="240" height="26" rx="4"/>
  <text class="ink sm" x="110" y="86" text-anchor="middle">("Пермь", "октябрь")</text>
  <text class="ink sm b" x="232" y="86" text-anchor="middle">610</text>
  <rect class="box-warn" x="20" y="100" width="240" height="26" rx="4"/>
  <text class="ink sm" x="110" y="118" text-anchor="middle">("Казань", "сентябрь")</text>
  <text class="ink sm b" x="232" y="118" text-anchor="middle">320</text>
  <rect class="box-acc" x="20" y="132" width="240" height="26" rx="4"/>
  <text class="ink sm" x="110" y="150" text-anchor="middle">("Пермь", "сентябрь")</text>
  <text class="ink sm b" x="232" y="150" text-anchor="middle">390</text>
  <text class="mut sm" x="470" y="26" text-anchor="middle">sales — словарь</text>
  <rect class="box-acc" x="360" y="52" width="220" height="30" rx="4"/>
  <text class="ink sm" x="450" y="72" text-anchor="middle">("Пермь", "сентябрь")</text>
  <text class="ink b" x="620" y="72" text-anchor="middle">→ 840</text>
  <rect class="box-ok" x="360" y="92" width="220" height="30" rx="4"/>
  <text class="ink sm" x="450" y="112" text-anchor="middle">("Пермь", "октябрь")</text>
  <text class="ink b" x="620" y="112" text-anchor="middle">→ 610</text>
  <rect class="box-warn" x="360" y="132" width="220" height="30" rx="4"/>
  <text class="ink sm" x="450" y="152" text-anchor="middle">("Казань", "сентябрь")</text>
  <text class="ink b" x="620" y="152" text-anchor="middle">→ 320</text>
  <path class="ln-mut" d="M262,49 C310,49 310,67 356,67" marker-end="url(#ah-tuple-key)"/>
  <path class="ln-mut" d="M262,81 C310,81 310,107 356,107" marker-end="url(#ah-tuple-key)"/>
  <path class="ln-mut" d="M262,113 C310,113 310,147 356,147" marker-end="url(#ah-tuple-key)"/>
  <path class="ln-mut" d="M262,145 C310,145 310,67 356,67" marker-end="url(#ah-tuple-key)"/>
  <text class="ink2 sm" x="350" y="200" text-anchor="middle">Две строки «Пермь, сентябрь» попали в один ключ: 450 + 390 = 840.</text>
  <text class="mut sm" x="350" y="220" text-anchor="middle">Это GROUP BY city, month. Список ключом быть не может — он изменяемый.</text>
</svg>
