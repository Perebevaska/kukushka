<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-git-branch">
  <title id="t-git-branch">Ветка loyalty и её слияние в main</title>
  <defs><marker id="ah-git-branch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <circle class="box-acc" cx="40" cy="80" r="10"/>
  <text class="ink2 sm" x="40" y="44" text-anchor="middle">структура</text>
  <text class="ink sm b" x="40" y="62" text-anchor="middle">8c3c173</text>
  <path class="ln-acc" d="M51,80 L129,80" marker-end="url(#ah-git-branch)"/>
  <circle class="box-acc" cx="140" cy="80" r="10"/>
  <text class="ink2 sm" x="140" y="44" text-anchor="middle">загрузка</text>
  <text class="ink sm b" x="140" y="62" text-anchor="middle">375c1e4</text>
  <path class="ln-acc" d="M151,80 L229,80" marker-end="url(#ah-git-branch)"/>
  <circle class="box-acc" cx="240" cy="80" r="10"/>
  <text class="ink2 sm" x="240" y="44" text-anchor="middle">фильтр</text>
  <text class="ink sm b" x="240" y="62" text-anchor="middle">3efd677</text>
  <path class="ln-acc" d="M251,80 L329,80" marker-end="url(#ah-git-branch)"/>
  <circle class="box-acc" cx="340" cy="80" r="10"/>
  <text class="ink2 sm" x="340" y="44" text-anchor="middle">по месяцам</text>
  <text class="ink sm b" x="340" y="62" text-anchor="middle">5ae82cb</text>
  <path class="ln-acc" d="M351,80 L509,80" marker-end="url(#ah-git-branch)"/>
  <circle class="box-acc" cx="520" cy="80" r="10"/>
  <text class="ink2 sm" x="520" y="44" text-anchor="middle">слияние</text>
  <text class="ink sm b" x="520" y="62" text-anchor="middle">a74c250</text>
  <path class="ln-acc" d="M531,80 L609,80" marker-end="url(#ah-git-branch)"/>
  <circle class="box-acc" cx="620" cy="80" r="10"/>
  <text class="ink2 sm" x="620" y="44" text-anchor="middle">README</text>
  <text class="ink sm b" x="620" y="62" text-anchor="middle">f0dd728</text>
  <path class="ln" d="M348,88 L421,151" marker-end="url(#ah-git-branch)"/>
  <circle class="box-ok" cx="430" cy="160" r="10"/>
  <text class="ink2 sm" x="430" y="188" text-anchor="middle">3e746ee гипотеза о картах</text>
  <path class="ln" d="M438,152 L511,89" marker-end="url(#ah-git-branch)"/>
  <text class="acc b" x="642" y="85" text-anchor="start">main</text>
  <text class="ok b" x="410" y="165" text-anchor="end">loyalty</text>
  <text class="mut sm" x="368" y="130" text-anchor="end">git switch -c loyalty</text>
  <text class="mut sm" x="492" y="130" text-anchor="start">git merge loyalty</text>
  <text class="mut sm" x="350" y="222" text-anchor="middle">пока ветка не слита, main не меняется; не подтвердилась гипотеза — ветку просто не сливают</text>
