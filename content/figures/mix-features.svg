<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-mix-features">
  <title id="t-mix-features">X @ P: каждый новый признак — смесь старых с весами из столбца P</title>
  <defs><marker id="ah-mix-features" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="110" y="24" text-anchor="middle">строка X (1-я доставка)</text>
  <text class="mut sm" x="76" y="44" text-anchor="middle">км</text>
  <rect class="box-acc" x="50" y="52" width="52" height="30" rx="3"/>
  <text class="ink sm b" x="76" y="72" text-anchor="middle">1</text>
  <text class="mut sm" x="132" y="44" text-anchor="middle">позиции</text>
  <rect class="box-acc" x="106" y="52" width="52" height="30" rx="3"/>
  <text class="ink sm b" x="132" y="72" text-anchor="middle">2</text>
  <text class="mut sm" x="188" y="44" text-anchor="middle">пеший</text>
  <rect class="box-acc" x="162" y="52" width="52" height="30" rx="3"/>
  <text class="ink sm b" x="188" y="72" text-anchor="middle">1</text>
  <text class="ink b" x="240" y="72" text-anchor="middle">@</text>
  <text class="mut sm b" x="340" y="24" text-anchor="middle">P (3 × 3): столбец = рецепт смеси</text>
  <rect class="box" x="270" y="52" width="52" height="28" rx="3"/>
  <text class="ink sm" x="296" y="71" text-anchor="middle">1</text>
  <rect class="box-warn" x="326" y="52" width="52" height="28" rx="3"/>
  <text class="ink sm b" x="352" y="71" text-anchor="middle">0</text>
  <rect class="box" x="382" y="52" width="52" height="28" rx="3"/>
  <text class="ink sm" x="408" y="71" text-anchor="middle">0.5</text>
  <rect class="box" x="270" y="84" width="52" height="28" rx="3"/>
  <text class="ink sm" x="296" y="103" text-anchor="middle">0</text>
  <rect class="box-warn" x="326" y="84" width="52" height="28" rx="3"/>
  <text class="ink sm b" x="352" y="103" text-anchor="middle">1</text>
  <rect class="box" x="382" y="84" width="52" height="28" rx="3"/>
  <text class="ink sm" x="408" y="103" text-anchor="middle">0</text>
  <rect class="box" x="270" y="116" width="52" height="28" rx="3"/>
  <text class="ink sm" x="296" y="135" text-anchor="middle">0</text>
  <rect class="box-warn" x="326" y="116" width="52" height="28" rx="3"/>
  <text class="ink sm b" x="352" y="135" text-anchor="middle">0.5</text>
  <rect class="box" x="382" y="116" width="52" height="28" rx="3"/>
  <text class="ink sm" x="408" y="135" text-anchor="middle">2</text>
  <text class="mut sm b" x="296" y="160" text-anchor="middle">f1</text>
  <text class="mut sm b" x="352" y="160" text-anchor="middle">f2</text>
  <text class="mut sm b" x="408" y="160" text-anchor="middle">f3</text>
  <text class="ink b" x="460" y="72" text-anchor="middle">=</text>
  <text class="mut sm b" x="570" y="24" text-anchor="middle">новая строка</text>
  <text class="mut sm" x="516" y="44" text-anchor="middle">f1</text>
  <rect class="box" x="490" y="52" width="52" height="30" rx="3"/>
  <text class="ink sm b" x="516" y="72" text-anchor="middle">1</text>
  <text class="mut sm" x="572" y="44" text-anchor="middle">f2</text>
  <rect class="box-ok" x="546" y="52" width="52" height="30" rx="3"/>
  <text class="ink sm b" x="572" y="72" text-anchor="middle">2.5</text>
  <text class="mut sm" x="628" y="44" text-anchor="middle">f3</text>
  <rect class="box" x="602" y="52" width="52" height="30" rx="3"/>
  <text class="ink sm b" x="628" y="72" text-anchor="middle">2.5</text>
  <text class="ink sm" x="350" y="194" text-anchor="middle">f2 = 1·0 + 2·1 + 1·0.5 = 2.5   («позиции + половина флага пешего»)</text>
  <text class="ink2 sm" x="350" y="216" text-anchor="middle">f1 = 1·1 + 2·0 + 1·0 = 1 — просто км;   f3 = 1·0.5 + 2·0 + 1·2 = 2.5</text>
  <text class="mut sm" x="350" y="248" text-anchor="middle">вторая строка [4, 1, 0] → [4, 1, 2]</text>
  <text class="mut sm" x="350" y="272" text-anchor="middle">форма: (n × 3) @ (3 × 3) → (n × 3): сколько столбцов у P — столько новых признаков</text>
</svg>
