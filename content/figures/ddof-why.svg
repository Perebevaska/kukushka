<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ddof-why">
  <title id="t-ddof-why">Почему по выборке делят на n − 1: от своего среднего разброс выходит меньше</title>
  <defs><marker id="ah-ddof-why" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="175" y="24" text-anchor="middle">Одна выборка: 4 чашки — 2, 4, 4, 6 мин</text>
  <path class="ln" d="M40,120 L312,120"/>
  <path class="ln" d="M40,117 L40,123"/>
  <text class="mut sm" x="40" y="138" text-anchor="middle">1</text>
  <path class="ln" d="M74,117 L74,123"/>
  <text class="mut sm" x="74" y="138" text-anchor="middle">2</text>
  <path class="ln" d="M108,117 L108,123"/>
  <text class="mut sm" x="108" y="138" text-anchor="middle">3</text>
  <path class="ln" d="M142,117 L142,123"/>
  <text class="mut sm" x="142" y="138" text-anchor="middle">4</text>
  <path class="ln" d="M176,117 L176,123"/>
  <text class="mut sm" x="176" y="138" text-anchor="middle">5</text>
  <path class="ln" d="M210,117 L210,123"/>
  <text class="mut sm" x="210" y="138" text-anchor="middle">6</text>
  <path class="ln" d="M244,117 L244,123"/>
  <text class="mut sm" x="244" y="138" text-anchor="middle">7</text>
  <path class="ln" d="M278,117 L278,123"/>
  <text class="mut sm" x="278" y="138" text-anchor="middle">8</text>
  <path class="ln" d="M312,117 L312,123"/>
  <text class="mut sm" x="312" y="138" text-anchor="middle">9</text>
  <path class="ln-acc dash" d="M142.0,48 L142.0,120"/>
  <text class="acc sm b" x="138.0" y="60" text-anchor="end">своё среднее 4</text>
  <path class="ln-mut dash" d="M176.0,48 L176.0,120"/>
  <text class="mut sm b" x="180.0" y="60" text-anchor="start">истинное 5</text>
  <circle class="box-warn" cx="74" cy="110" r="5"/>
  <circle class="box-warn" cx="142" cy="110" r="5"/>
  <circle class="box-warn" cx="142" cy="96" r="5"/>
  <circle class="box-warn" cx="210" cy="110" r="5"/>
  <rect class="box-acc" x="20" y="150" width="310" height="50" rx="5"/>
  <text class="ink2 sm b" x="175" y="170" text-anchor="middle">от своего среднего 4:</text>
  <text class="ink sm" x="175" y="189" text-anchor="middle">(−2)² + 0² + 0² + 2² = 8</text>
  <rect class="box" x="20" y="208" width="310" height="50" rx="5"/>
  <text class="ink2 sm b" x="175" y="228" text-anchor="middle">от истинного среднего 5:</text>
  <text class="ink sm" x="175" y="247" text-anchor="middle">(−3)² + (−1)² + (−1)² + 1² = 12</text>
  <text class="ink2 sm" x="175" y="280" text-anchor="middle">своё среднее подстроено под эти 4 чашки:</text>
  <text class="ink2 sm" x="175" y="297" text-anchor="middle">сумма квадратов от него меньше, чем от истинного</text>
  <path class="ln-mut" d="M352,16 L352,306"/>
  <text class="ink b" x="530" y="24" text-anchor="middle">Все 256 вариантов 4 чашек</text>
  <text class="mut sm" x="530" y="42" text-anchor="middle">бариста варит за 2, 4, 6 или 8 мин одинаково часто</text>
  <path class="ln" d="M380,250 L690,250"/>
  <text class="mut sm" x="374" y="254.0" text-anchor="end">0</text>
  <text class="mut sm" x="374" y="225.66666666666666" text-anchor="end">1</text>
  <path class="ln-mut" d="M380,221.66666666666666 L386,221.66666666666666"/>
  <text class="mut sm" x="374" y="197.33333333333334" text-anchor="end">2</text>
  <path class="ln-mut" d="M380,193.33333333333334 L386,193.33333333333334"/>
  <text class="mut sm" x="374" y="169.0" text-anchor="end">3</text>
  <path class="ln-mut" d="M380,165.0 L386,165.0"/>
  <text class="mut sm" x="374" y="140.66666666666669" text-anchor="end">4</text>
  <path class="ln-mut" d="M380,136.66666666666669 L386,136.66666666666669"/>
  <text class="mut sm" x="374" y="112.33333333333334" text-anchor="end">5</text>
  <path class="ln-mut" d="M380,108.33333333333334 L386,108.33333333333334"/>
  <text class="mut sm" x="374" y="84.0" text-anchor="end">6</text>
  <path class="ln-mut" d="M380,80.0 L386,80.0"/>
  <rect class="box-err" x="425" y="143.75" width="80" height="106.25" rx="3"/>
  <text class="err b" x="465" y="165.75" text-anchor="middle">3.75</text>
  <text class="ink sm b" x="465" y="268" text-anchor="middle">ddof=0</text>
  <text class="mut sm" x="465" y="284" text-anchor="middle">делим на n = 4</text>
  <rect class="box-ok" x="565" y="108.33333333333334" width="80" height="141.66666666666666" rx="3"/>
  <text class="ok b" x="605" y="130.33333333333334" text-anchor="middle">5.00</text>
  <text class="ink sm b" x="605" y="268" text-anchor="middle">ddof=1</text>
  <text class="mut sm" x="605" y="284" text-anchor="middle">делим на n − 1 = 3</text>
  <path class="ln-acc dash" d="M388,108.33333333333334 L690,108.33333333333334"/>
  <text class="acc sm b" x="390" y="100.33333333333334" text-anchor="start">истинная дисперсия 5</text>
  <text class="ink2 sm" x="527" y="316" text-anchor="middle">с n − 1 средняя дисперсия выборки равна истинной</text>
</svg>
