<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-avg-of-avg">
  <title id="t-avg-of-avg">Среднее средних против настоящего среднего</title>
  <defs><marker id="ah-avg-of-avg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="err sm b" x="50" y="30" text-anchor="start">среднее средних: каждая кофейня весит одинаково → (300 + 600) / 2 = 450 ₽</text>
  <rect class="box-acc" x="50" y="40" width="297.0" height="40" rx="3"/>
  <text class="ink sm" x="200.0" y="65" text-anchor="middle">A: средний чек 300</text>
  <rect class="box-warn" x="350.0" y="40" width="297.0" height="40" rx="3"/>
  <text class="ink sm" x="500.0" y="65" text-anchor="middle">B: средний чек 600</text>
  <text class="ok sm b" x="50" y="116" text-anchor="start">средний чек сети: вес = число заказов → (100·300 + 10·600) / 110 = 327.27 ₽</text>
  <rect class="box-acc" x="50" y="126" width="542.4545454545455" height="40" rx="3"/>
  <text class="ink sm" x="322.72727272727275" y="151" text-anchor="middle">A: 100 заказов по 300</text>
  <rect class="box-warn" x="595.4545454545455" y="126" width="51.545454545454504" height="40" rx="3"/>
  <text class="ink sm" x="622.7272727272727" y="151" text-anchor="middle">B: 10</text>
  <text class="ink2 sm" x="350" y="198" text-anchor="middle">Маленькая кофейня с 10 заказами тянет «среднее средних» вверх до 450 ₽, хотя средний чек сети — 327.27 ₽.</text>
  <text class="mut sm" x="350" y="220" text-anchor="middle">Ширина полосы — вес в среднем. Правило: средние по группам не усредняют, считают сумма / количество.</text>
</svg>
