<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ts-staffing">
  <title id="t-ts-staffing">Прогноз в людях: бариста = max(1, ceil(заказы / 6)); прогноз «по середине» чаще оставляет без рук</title>
  <defs><marker id="ah-ts-staffing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
