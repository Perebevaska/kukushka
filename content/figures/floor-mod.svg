<svg viewBox="0 0 700 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-floor-mod">
  <title id="t-floor-mod">157 стаканов по упаковкам из 50: целая часть и остаток</title>
  <defs><marker id="ah-floor-mod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="ink b" x="30" y="28" text-anchor="start">157 стаканов</text>
  <rect class="box-acc" x="30" y="42" width="196" height="40" rx="4"/>
  <text class="ink sm" x="128.0" y="67" text-anchor="middle">упаковка 1: 50</text>
  <rect class="box-acc" x="230" y="42" width="196" height="40" rx="4"/>
  <text class="ink sm" x="328.0" y="67" text-anchor="middle">упаковка 2: 50</text>
  <rect class="box-acc" x="430" y="42" width="196" height="40" rx="4"/>
  <text class="ink sm" x="528.0" y="67" text-anchor="middle">упаковка 3: 50</text>
  <rect class="box-warn" x="630" y="42" width="28" height="40" rx="4"/>
  <text class="ink sm b" x="644.0" y="67" text-anchor="middle">7</text>
  <path class="ln-acc" d="M30,94 v8 H626 v-8"/>
  <text class="acc b" x="328.0" y="124" text-anchor="middle">157 // 50 = 3  — полных упаковок</text>
  <path class="ln" d="M644.0,94 v24"/>
  <text class="warn b" x="644.0" y="140" text-anchor="middle">157 % 50 = 7</text>
  <text class="mut sm" x="644.0" y="156" text-anchor="middle">остаток</text>
  <text class="ink2 sm" x="30" y="178" text-anchor="start">А обычное деление 157 / 50 = 3.14 — «сколько упаковок примерно», дробь.</text>
</svg>
