<svg viewBox="0 0 700 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-coerce-check">
  <title id="t-coerce-check">errors="coerce" молча превращает непонятное в NaN — потери ищут маской</title>
  <defs><marker id="ah-coerce-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="mut sm b" x="64" y="24" text-anchor="middle">исходный текст</text>
  <text class="mut sm b" x="238" y="24" text-anchor="middle">сразу to_numeric</text>
  <text class="mut sm b" x="488" y="24" text-anchor="middle">сначала убрать пробелы</text>
  <rect class="box" x="10" y="36" width="608" height="28" rx="3"/>
  <text class="ink2 sm b" x="64.0" y="54.5" text-anchor="middle">s</text>
  <text class="ink2 sm b" x="188.0" y="54.5" text-anchor="middle">num</text>
  <text class="ink2 sm b" x="308.0" y="54.5" text-anchor="middle">потеря?</text>
  <text class="ink2 sm b" x="438.0" y="54.5" text-anchor="middle">num после чистки</text>
  <text class="ink2 sm b" x="568.0" y="54.5" text-anchor="middle">потеря?</text>
  <rect class="box" x="10" y="66" width="608" height="28" rx="3"/>
  <text class="ink sm" x="64.0" y="84.5" text-anchor="middle">«320»</text>
  <text class="ink sm" x="188.0" y="84.5" text-anchor="middle">320</text>
  <text class="ink sm" x="308.0" y="84.5" text-anchor="middle">—</text>
  <text class="ink sm" x="438.0" y="84.5" text-anchor="middle">320</text>
  <text class="ink sm" x="568.0" y="84.5" text-anchor="middle">—</text>
  <rect class="box-err" x="10" y="96" width="608" height="28" rx="3"/>
  <text class="ink sm" x="64.0" y="114.5" text-anchor="middle">«1 250»</text>
  <text class="err sm b" x="188.0" y="114.5" text-anchor="middle">NaN</text>
  <text class="err sm b" x="308.0" y="114.5" text-anchor="middle">потеря</text>
  <text class="ink sm" x="438.0" y="114.5" text-anchor="middle">1250</text>
  <text class="ink sm" x="568.0" y="114.5" text-anchor="middle">—</text>
  <rect class="box-warn" x="10" y="126" width="608" height="28" rx="3"/>
  <text class="ink sm" x="64.0" y="144.5" text-anchor="middle">«—»</text>
  <text class="mut sm" x="188.0" y="144.5" text-anchor="middle">NaN</text>
  <text class="warn sm b" x="308.0" y="144.5" text-anchor="middle">потеря</text>
  <text class="mut sm" x="438.0" y="144.5" text-anchor="middle">NaN</text>
  <text class="warn sm b" x="568.0" y="144.5" text-anchor="middle">потеря</text>
  <rect class="box" x="10" y="156" width="608" height="28" rx="3"/>
  <text class="ink sm" x="64.0" y="174.5" text-anchor="middle">None</text>
  <text class="mut sm" x="188.0" y="174.5" text-anchor="middle">NaN</text>
  <text class="ink sm" x="308.0" y="174.5" text-anchor="middle">—</text>
  <text class="mut sm" x="438.0" y="174.5" text-anchor="middle">NaN</text>
  <text class="ink sm" x="568.0" y="174.5" text-anchor="middle">—</text>
  <text class="ink2 sm" x="350" y="204" text-anchor="middle">потеря = num.isna() &amp; s.notna(): значение было, а числом не стало</text>
  <text class="err sm" x="350" y="226" text-anchor="middle">«1 250» — настоящий баланс: его потеря — ошибка, чистим пробелы до to_numeric</text>
  <text class="warn sm" x="350" y="246" text-anchor="middle">«—» — замаскированный пропуск: эта «потеря» правильная</text>
  <text class="mut sm" x="350" y="266" text-anchor="middle">None был пропуском и до преобразования — это не потеря</text>
  <text class="acc b" x="350" y="294" text-anchor="middle">порядок: очистить → преобразовать → проверить потери</text>
</svg>
