# Программа курса. Порядок глав и шаг сложности — по общепринятой программе DS
# (сверялись с последовательностью тем Практикума 2022 — только темы, без текстов,
# примеров, задач и данных). Колонка skeleton — для авторов, на сайте не показывается.
#
# status: ready — урок написан и проверен; draft — пишется; planned — в плане.
# core: true — урок основного пути (≈ 48 ч: Python, pandas, очистка, EDA, статистика и A/B, первые модели,
#   метрики, деньги). Остальные уроки — углубление: на сайте помечены и скрываются фильтром «Только основной путь».

title: Data Science для аналитиков
subtitle: Для тех, кто знает SQL и Excel. От Python до моделей — понятно и с практикой в браузере.
story: >
  Сквозная история курса — сеть кофеен «Зерно». Вы аналитик: считаете выручку,
  разбираете заказы, ищете ошибки в данных, а потом строите модели.

chapters:
  - id: ch01
    title: Python для аналитика
    skeleton: "ч. 1 «Базовый Python», разделы 01–08 + темы, которых там нет"
    goal: Писать небольшие программы на Python, читать ошибки и не бояться их.
    lessons:
      - {id: 01-start,       title: Первая программа и ошибки,              minutes: 25, status: ready,   skeleton: "01 вывод данных", core: true}
      - {id: 02-numbers,     title: Переменные и числа,                     minutes: 35, status: ready,   skeleton: "01 переменные, типы, арифметика", core: true}
      - {id: 03-strings,     title: Строки и f-строки,                      minutes: 35, status: ready,   skeleton: "02 строки", core: true}
      - {id: 04-lists,       title: Списки,                                 minutes: 40, status: ready  , skeleton: "03 списки", core: true}
      - {id: 05-for,         title: Цикл for,                               minutes: 35, status: ready  , skeleton: "04 цикл for", core: true}
      - {id: 06-if,          title: Условия и цикл while,                   minutes: 45, status: ready  , skeleton: "06 условия, while", core: true}
      - {id: 07-tables,      title: Таблица из списков,                     minutes: 55, status: ready  , skeleton: "05 вложенные списки", core: true}
      - {id: 08-dicts,       title: Словари — GROUP BY своими руками,       minutes: 40, status: ready  , skeleton: "08 словари", core: true}
      - {id: 09-functions,   title: Функции,                                minutes: 45, status: ready  , skeleton: "07 функции", core: true}
      - {id: 09b-style, title: "Стиль кода: PEP 8", minutes: 30, status: ready  , skeleton: "выделено из 09-functions", core: true}
      - {id: 10-tuples-sets, title: Кортежи и множества,                    minutes: 35, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 11-comprehensions, title: "Генераторы списков, zip, sorted",   minutes: 30, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 12-errors,      title: Исключения — как не падать на грязных данных, minutes: 50, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 13-files,       title: "Файлы, CSV и модули",                    minutes: 45, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 14-project,     title: "Мини-проект: отчёт по заказам",        minutes: 60, status: ready  , skeleton: "13 проект (своя тема)", core: true}
    exams:
      - {id: exam-1, title: "Контрольная точка: уроки 1–9", after: 09-functions, minutes: 60}

  - id: ch02
    title: pandas — таблицы как в SQL
    skeleton: "ч. 1 разделы 09–13"
    goal: Читать, фильтровать, группировать и соединять таблицы в pandas, думая на SQL.
    display: true
    lessons:
      - {id: 01-dataframe, title: DataFrame — таблица в Python,          minutes: 45, status: ready  , skeleton: "09 pandas", core: true}
      - {id: 02-select,    title: "Выбор столбцов и строк: SELECT и WHERE", minutes: 35, status: ready  , skeleton: "09–10", core: true}
      - {id: 03-columns,   title: "Сортировка и новые столбцы: ORDER BY, CASE", minutes: 30, status: ready  , skeleton: "10–11", core: true}
      - {id: 04-groupby,   title: "Группировки: GROUP BY и HAVING",       minutes: 30, status: ready  , skeleton: "11 анализ данных", core: true}
      - {id: 04a-guest-metrics, title: "Метрики на гостя: повторные и конверсия", minutes: 30, status: ready  , skeleton: "выделено из 04-groupby", core: true}
      - {id: 04b-pivot,    title: "Сводные таблицы: широкий и длинный формат", minutes: 40, status: ready  , skeleton: "11 анализ данных: сводные таблицы", core: true}
      - {id: 05-merge,     title: "Соединения: JOIN и ловушка дублей",             minutes: 30, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 05b-join-index, title: "Соединения по индексу, anti join и UNION", minutes: 35, status: ready  , skeleton: "выделено из 05-merge", core: true}
      - {id: 06-dates,     title: Даты и время,                         minutes: 40, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 06b-timezones, title: "Часовые пояса и unix-время", minutes: 25, status: ready  , skeleton: "выделено из 06-dates", core: true}
      - {id: 07-duckdb,    title: SQL прямо по датафрейму — DuckDB,     minutes: 25, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 07s-subqueries-cte, title: "Подзапросы, CTE и порядок выполнения SQL", minutes: 55, status: ready  , skeleton: "выделено из 07-duckdb"}
      - {id: 07a-sql-python, title: "SQL из Python к базе: параметры и подключения", minutes: 35, status: ready  , skeleton: "выделено из 07-duckdb", core: true}
      - {id: 07b-sql-windows, title: "Оконные функции SQL: ранги, доли, соседние строки", minutes: 65, status: ready  , skeleton: "ч. 12 оконные функции"}
      - {id: 07c-sql-frames, title: "Рамки окна SQL: накопительные итоги и скользящие средние", minutes: 65, status: ready  , skeleton: "выделено из 07b-sql-windows"}
      - {id: 08-jupyter,   title: Своё рабочее место — uv и Jupyter,    minutes: 50, status: ready  , skeleton: "12 Jupyter", core: true}
      - {id: 08a-nb-report, title: "Блокнот-отчёт: структура, выводы, привычки", minutes: 40, status: ready  , skeleton: "12 Jupyter: оформление отчёта", core: true}
      - {id: 08b-jupyter-keys, title: "Jupyter: руки на клавиатуре", minutes: 45, status: ready  , skeleton: "ч. 1 Jupyter, magic-команды", core: true}
      - {id: 08c-terminal-memory, title: "Терминал и память: заглянуть в файл, не открывая его", minutes: 30, status: ready  , skeleton: "выделено из 08b-jupyter-keys"}
      - {id: 09-project,   title: "Проект: три месяца продаж",          minutes: 85, status: ready  , skeleton: "13 проект (своя тема)", core: true}
      - {id: 10-git, title: "Git: коммиты, история, ветки и .gitignore", minutes: 60, status: ready  , skeleton: "ч. 1, ч. 8 Git/GitHub", core: true}
      - {id: 10b-git-github, title: "Блокнот в git и портфолио на GitHub", minutes: 45, status: ready  , skeleton: "выделено из 10-git", core: true}
      - {id: 11-sql-project, title: "Проект: база данных сети на SQL", minutes: 110, status: ready  , skeleton: "ч. 8, ч. 12 SQL-проект (своя тема)"}

  - id: ch03
    title: Предобработка данных
    skeleton: "ч. 2"
    goal: Находить и исправлять грязь в данных — пропуски, типы, дубликаты, разные написания, аномалии — и делать очистку воспроизводимой.
    display: true
    lessons:
      - {id: 01-inspect,    title: "Первый осмотр: что не так с данными",  minutes: 40, status: ready  , skeleton: "ч. 2 введение", core: true}
      - {id: 02-missing,    title: Пропуски,                              minutes: 55, status: ready  , skeleton: "ч. 2 пропуски", core: true}
      - {id: 03-types,      title: "Типы: из текста в числа и даты",       minutes: 35, status: ready  , skeleton: "ч. 2 типы данных", core: true}
      - {id: 03b-excel, title: "Книга Excel: листы, шапка, итоги", minutes: 35, status: ready  , skeleton: "выделено из 03-types", core: true}
      - {id: 04-duplicates, title: Дубликаты — явные и неявные,          minutes: 45, status: ready  , skeleton: "ч. 2 дубликаты", core: true}
      - {id: 05-strings,    title: "Строки: чистим и ищем по тексту",      minutes: 35, status: ready  , skeleton: "ч. 2 лемматизация → своя тема", core: true}
      - {id: 06-categories, title: "Категоризация: CASE WHEN в pandas",    minutes: 45, status: ready  , skeleton: "ч. 2 категоризация", core: true}
      - {id: 07-anomalies,  title: Аномалии и проверка на здравый смысл,  minutes: 50, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 08-pipeline,   title: "Очистка целиком: функция и проверки",  minutes: 60, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 09-project,    title: "Проект: кто наши гости",              minutes: 75, status: ready  , skeleton: "ч. 2 проект (своя тема)", core: true}
  - id: ch04
    title: Исследовательский анализ и графики
    skeleton: "ч. 3"
    goal: Смотреть на данные глазами — распределения, сравнения групп, динамику и связи — и превращать увиденное в выводы с цифрами.
    display: true
    lessons:
      - {id: 01-plots,       title: "Первый график: matplotlib и pandas",   minutes: 50, status: ready  , skeleton: "ч. 3 графики", core: true}
      - {id: 02-histograms,  title: Распределения и гистограммы,           minutes: 50, status: ready  , skeleton: "ч. 3 гистограммы", core: true}
      - {id: 02b-shape, title: "Какую форму ожидать: Пуассон и ровные минуты", minutes: 45, status: ready  , skeleton: "выделено из 02-histograms", core: true}
      - {id: 03-boxplots,    title: Ящик с усами и выбросы,                 minutes: 45, status: ready  , skeleton: "ч. 3 выбросы", core: true}
      - {id: 03b-sigma, title: "Стандартное отклонение: разброс одним числом", minutes: 40, status: ready  , skeleton: "выделено из 03-boxplots", core: true}
      - {id: 04-slices,      title: "Срезы: сравниваем группы",              minutes: 75, status: ready  , skeleton: "ч. 3 срезы", core: true}
      - {id: 05-time,        title: Динамика во времени,                    minutes: 55, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 05b-cohorts, title: "Когорты и удержание", minutes: 60, status: ready  , skeleton: "ч. 12 когортный анализ"}
      - {id: 05c-dau-mau, title: "Когорты в SQL и DAU/MAU: проверка и частота", minutes: 55, status: ready  , skeleton: "выделено из 05b-cohorts"}
      - {id: 06-correlation, title: "Связи: рассеяние и корреляция",         minutes: 75, status: ready  , skeleton: "ч. 3 корреляция", core: true}
      - {id: 07-readable,    title: Понятный график,                        minutes: 60, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 07c-metrics, title: "Метрики: чьё среднее и воронка", minutes: 40, status: ready  , skeleton: "выделено из 08-eda", core: true}
      - {id: 08-eda,         title: "EDA по плану: от вопроса к выводу",     minutes: 65, status: ready  , skeleton: "ч. 3 исследование", core: true}
      - {id: 09-project,     title: "Проект: почему доставка опаздывает",    minutes: 90, status: ready  , skeleton: "ч. 3 проект (своя тема)", core: true}
  - id: ch05
    title: Статистика и проверка гипотез
    skeleton: "ч. 4"
    goal: Отличать закономерность от случайности — вероятности, распределения, доверительные интервалы, статистические тесты и A/B-эксперименты.
    display: true
    lessons:
      - {id: 01-probability,   title: "Вероятность: частота и симуляция",     minutes: 50, status: ready  , skeleton: "ч. 4 теория вероятностей", core: true}
      - {id: 02-distributions, title: "Распределения: мат. ожидание, биномиальное, Пуассона", minutes: 55, status: ready  , skeleton: "ч. 4 распределения", core: true}
      - {id: 02b-normal, title: "Нормальное распределение, приближение и z-оценка", minutes: 40, status: ready  , skeleton: "выделено из 02-distributions", core: true}
      - {id: 03-sampling,      title: Выборки и центральная предельная теорема, minutes: 65, status: ready  , skeleton: "ч. 4 выборки", core: true}
      - {id: 04-confidence,    title: Доверительные интервалы,              minutes: 55, status: ready  , skeleton: "ч. 4 оценки", core: true}
      - {id: 05-hypotheses,    title: "Проверка гипотез: логика и p-value",  minutes: 65, status: ready  , skeleton: "ч. 4 гипотезы", core: true}
      - {id: 06-tests,         title: "Статистические тесты: какой выбрать", minutes: 70, status: ready  , skeleton: "ч. 4 t-тест", core: true}
      - {id: 07-ab,            title: "A/B-тест: от дизайна до решения",     minutes: 55, status: ready  , skeleton: "ч. 4 A/B (своя тема)", core: true}
      - {id: 08-pitfalls,      title: Ловушки статистики,                   minutes: 60, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 09-project,       title: "Проект: новое обещание доставки",    minutes: 85, status: ready  , skeleton: "ч. 4 проект (своя тема)", core: true}
  - id: ch06
    title: Первые модели машинного обучения
    skeleton: "ч. 5"
    goal: Обучать и честно сравнивать первые модели — дерево, лес, логистическую и линейную регрессию — и понимать, когда модель лучше простого правила.
    display: true
    lessons:
