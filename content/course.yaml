      - {id: 03b-money-threshold, title: "Порог по деньгам", minutes: 25, status: ready  , skeleton: "выделено из 03-threshold", core: true}
      - {id: 04-imbalance,  title: Дисбаланс классов,                       minutes: 75, status: ready  , skeleton: "ч. 6 дисбаланс", core: true}
      - {id: 05-scaling,    title: "Масштабирование и ближайшие соседи",    minutes: 60, status: ready  , skeleton: "ч. 6 масштабирование; модуль 1", core: true}
      - {id: 05b-regularization, title: "Регуляризация: штраф за большие веса", minutes: 35, status: ready  , skeleton: "выделено из 05-scaling", core: true}
      - {id: 06-features,   title: Новые признаки,                          minutes: 40, status: ready  , skeleton: "модуль 1 feature engineering", core: true}
      - {id: 06b-feature-check, title: "Форма связи и важность признаков", minutes: 60, status: ready  , skeleton: "выделено из 06-features", core: true}
      - {id: 07-pipeline,   title: "Pipeline: предобработка и модель вместе", minutes: 60, status: ready  , skeleton: "модуль 1 Pipeline", core: true}
      - {id: 07b-own-steps, title: "Свои шаги конвейера: порядок категорий, функции и свой класс", minutes: 70, status: ready  , skeleton: "выделено из 07-pipeline"}
