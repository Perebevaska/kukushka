# Программа курса. Порядок глав и шаг сложности — по общепринятой программе DS.
# split_from — урок, из которого выделен этот урок (нужно для переноса прогресса).
#
# status: ready — урок написан и проверен; draft — пишется; planned — в плане.
# core: true — урок основного пути (≈ 48 ч: Python, pandas, очистка, EDA, статистика и A/B, первые модели,
#   метрики, деньги). Остальные уроки — углубление: на сайте помечены и скрываются фильтром «Только основной путь».

title: Data Science для аналитиков
subtitle: Для тех, кто знает SQL и Excel. От Python до моделей — понятно и с практикой в браузере.
story: >
  Сквозная история курса — сеть кофеен «Зерно». Вы аналитик: считаете выручку,
  разбираете заказы, ищете ошибки в данных, а потом строите модели.

chapters:
  - id: ch01
    title: Python для аналитика
    goal: Писать небольшие программы на Python, читать ошибки и не бояться их.
    lessons:
      - {id: 01-start,       title: Первая программа и ошибки,              minutes: 25, status: ready, core: true}
      - {id: 02-numbers,     title: Переменные и числа,                     minutes: 35, status: ready, core: true}
      - {id: 03-strings,     title: Строки и f-строки,                      minutes: 35, status: ready, core: true}
      - {id: 04-lists,       title: Списки,                                 minutes: 40, status: ready  , core: true}
      - {id: 05-for,         title: Цикл for,                               minutes: 35, status: ready  , core: true}
      - {id: 06-if,          title: Условия и цикл while,                   minutes: 45, status: ready  , core: true}
      - {id: 07-tables,      title: Таблица из списков,                     minutes: 55, status: ready  , core: true}
      - {id: 08-dicts,       title: Словари — GROUP BY своими руками,       minutes: 40, status: ready  , core: true}
      - {id: 09-functions,   title: Функции,                                minutes: 60, status: ready  , core: true}
      - {id: 10-tuples-sets, title: Кортежи и множества,                    minutes: 35, status: ready  , core: true}
      - {id: 11-comprehensions, title: "Генераторы списков, zip, sorted",   minutes: 30, status: ready  , core: true}
      - {id: 12-errors,      title: Исключения — как не падать на грязных данных, minutes: 45, status: ready  , core: true}
      - {id: 13-files,       title: "Файлы, CSV и модули",                    minutes: 40, status: ready  , core: true}
      - {id: 14-project,     title: "Мини-проект: отчёт по заказам",        minutes: 60, status: ready  , core: true}
    exams:
      - {id: exam-1, title: "Контрольная точка: уроки 1–9", after: 09-functions, minutes: 60}

  - id: ch02
    title: pandas — таблицы как в SQL
    goal: Читать, фильтровать, группировать и соединять таблицы в pandas, думая на SQL.
    display: true
    lessons:
      - {id: 01-dataframe, title: DataFrame — таблица в Python,          minutes: 60, status: ready  , core: true}
      - {id: 02-select,    title: "Выбор столбцов и строк: SELECT и WHERE", minutes: 45, status: ready  , core: true}
      - {id: 03-columns,   title: "Сортировка и новые столбцы: ORDER BY, CASE", minutes: 35, status: ready  , core: true}
      - {id: 04-groupby,   title: "Группировки: GROUP BY и HAVING",       minutes: 35, status: ready  , core: true}
      - {id: 04a-guest-metrics, title: "Метрики на гостя: повторные и конверсия", minutes: 25, status: ready  , split_from: 04-groupby, core: true}
      - {id: 04b-pivot,    title: "Сводные таблицы: широкий и длинный формат", minutes: 45, status: ready  , core: true}
      - {id: 05-merge,     title: "Соединения: JOIN и UNION",             minutes: 35, status: ready  , core: true}
      - {id: 05b-join-index, title: "Соединения по индексу, anti join и UNION", minutes: 40, status: ready  , split_from: 05-merge, core: true}
      - {id: 06-dates,     title: Даты и время,                         minutes: 50, status: ready  , core: true}
      - {id: 06b-timezones, title: "Часовые пояса и unix-время", minutes: 20, status: ready  , split_from: 06-dates, core: true}
      - {id: 07-duckdb,    title: SQL прямо по датафрейму — DuckDB,     minutes: 95, status: ready  , core: true}
      - {id: 07a-sql-python, title: "SQL из Python к базе: параметры и подключения", minutes: 35, status: ready  , split_from: 07-duckdb, core: true}
      - {id: 07b-sql-windows, title: "Оконные функции SQL: ранги, доли, соседние строки", minutes: 85, status: ready  }
      - {id: 07c-sql-frames, title: "Рамки окна SQL: накопительные итоги и скользящие средние", minutes: 70, status: ready  , split_from: 07b-sql-windows}
      - {id: 08-jupyter,   title: Своё рабочее место — uv и Jupyter,    minutes: 55, status: ready  , core: true}
      - {id: 08a-nb-report, title: "Блокнот-отчёт: структура, выводы, привычки", minutes: 50, status: ready  , core: true}
      - {id: 08b-jupyter-keys, title: "Jupyter: руки на клавиатуре", minutes: 60, status: ready  , core: true}
      - {id: 08c-terminal-memory, title: "Терминал и память: заглянуть в файл, не открывая его", minutes: 30, status: ready  , split_from: 08b-jupyter-keys}
      - {id: 09-project,   title: "Проект: три месяца продаж",          minutes: 110, status: ready  , core: true}
      - {id: 10-git, title: "Git: коммиты, история, ветки и .gitignore", minutes: 75, status: ready  , core: true}
      - {id: 10b-git-github, title: "Блокнот в git и портфолио на GitHub", minutes: 55, status: ready  , split_from: 10-git, core: true}
      - {id: 11-sql-project, title: "Проект: база данных сети на SQL", minutes: 140, status: ready  }

  - id: ch03
    title: Предобработка данных
    goal: Находить и исправлять грязь в данных — пропуски, типы, дубликаты, разные написания, аномалии — и делать очистку воспроизводимой.
    display: true
    lessons:
      - {id: 01-inspect,    title: "Первый осмотр: что не так с данными",  minutes: 50, status: ready  , core: true}
      - {id: 02-missing,    title: Пропуски,                              minutes: 60, status: ready  , core: true}
      - {id: 03-types,      title: "Типы: из текста в числа и даты",       minutes: 40, status: ready  , core: true}
      - {id: 03b-excel, title: "Книга Excel: листы, шапка, итоги", minutes: 35, status: ready  , split_from: 03-types, core: true}
      - {id: 04-duplicates, title: Дубликаты — явные и неявные,          minutes: 55, status: ready  , core: true}
      - {id: 05-strings,    title: "Строки: чистим и ищем по тексту",      minutes: 40, status: ready  , core: true}
      - {id: 06-categories, title: "Категоризация: CASE WHEN в pandas",    minutes: 55, status: ready  , core: true}
      - {id: 07-anomalies,  title: Аномалии и проверка на здравый смысл,  minutes: 60, status: ready  , core: true}
      - {id: 08-pipeline,   title: "Очистка целиком: функция и проверки",  minutes: 75, status: ready  , core: true}
      - {id: 09-project,    title: "Проект: кто наши гости",              minutes: 90, status: ready  , core: true}
  - id: ch04
    title: Исследовательский анализ и графики
    goal: Смотреть на данные глазами — распределения, сравнения групп, динамику и связи — и превращать увиденное в выводы с цифрами.
    display: true
    lessons:
      - {id: 01-plots,       title: "Первый график: matplotlib и pandas",   minutes: 50, status: ready  , core: true}
      - {id: 02-histograms,  title: Распределения и гистограммы,           minutes: 75, status: ready  , core: true}
      - {id: 03-boxplots,    title: Ящик с усами и выбросы,                 minutes: 45, status: ready  , core: true}
      - {id: 03b-sigma, title: "Стандартное отклонение: разброс одним числом", minutes: 25, status: ready  , split_from: 03-boxplots, core: true}
      - {id: 04-slices,      title: "Срезы: сравниваем группы",              minutes: 70, status: ready  , core: true}
      - {id: 05-time,        title: Динамика во времени,                    minutes: 50, status: ready  , core: true}
      - {id: 05b-cohorts, title: "Когорты и удержание", minutes: 60, status: ready  }
      - {id: 05c-dau-mau, title: "Когорты в SQL и DAU/MAU: проверка и частота", minutes: 45, status: ready  , split_from: 05b-cohorts}
      - {id: 06-correlation, title: "Связи: рассеяние и корреляция",         minutes: 75, status: ready  , core: true}
      - {id: 07-readable,    title: Понятный график,                        minutes: 60, status: ready  , core: true}
      - {id: 07c-metrics, title: "Метрики: чьё среднее и воронка", minutes: 25, status: ready  , split_from: 08-eda, core: true}
      - {id: 08-eda,         title: "EDA по плану: от вопроса к выводу",     minutes: 65, status: ready  , core: true}
      - {id: 09-project,     title: "Проект: почему доставка опаздывает",    minutes: 90, status: ready  , core: true}
  - id: ch05
    title: Статистика и проверка гипотез
    goal: Отличать закономерность от случайности — вероятности, распределения, доверительные интервалы, статистические тесты и A/B-эксперименты.
    display: true
    lessons:
      - {id: 01-probability,   title: "Вероятность: частота и симуляция",     minutes: 55, status: ready  , core: true}
      - {id: 02-distributions, title: "Распределения: мат. ожидание, биномиальное, Пуассона", minutes: 55, status: ready  , core: true}
      - {id: 02b-normal, title: "Нормальное распределение, приближение и z-оценка", minutes: 45, status: ready  , split_from: 02-distributions, core: true}
      - {id: 03-sampling,      title: Выборки и центральная предельная теорема, minutes: 70, status: ready  , core: true}
      - {id: 04-confidence,    title: Доверительные интервалы,              minutes: 60, status: ready  , core: true}
      - {id: 05-hypotheses,    title: "Проверка гипотез: логика и p-value",  minutes: 70, status: ready  , core: true}
      - {id: 06-tests,         title: "Статистические тесты: какой выбрать", minutes: 75, status: ready  , core: true}
      - {id: 07-ab,            title: "A/B-тест: от дизайна до решения",     minutes: 60, status: ready  , core: true}
      - {id: 08-pitfalls,      title: Ловушки статистики,                   minutes: 60, status: ready  , core: true}
      - {id: 09-project,       title: "Проект: новое обещание доставки",    minutes: 90, status: ready  , core: true}
  - id: ch06
    title: Первые модели машинного обучения
    goal: Обучать и честно сравнивать первые модели — дерево, лес, логистическую и линейную регрессию — и понимать, когда модель лучше простого правила.
    display: true
    lessons:
      - {id: 01-what-is-ml,   title: Что такое машинное обучение,            minutes: 65, status: ready  , core: true}
      - {id: 02-split,        title: "Обучающая и тестовая выборки",          minutes: 80, status: ready  , core: true}
      - {id: 03-tree,         title: Решающее дерево изнутри,                minutes: 80, status: ready  , core: true}
      - {id: 04-categorical,  title: "Категориальные признаки и утечки",      minutes: 70, status: ready  , core: true}
      - {id: 05-forest,       title: Случайный лес,                          minutes: 85, status: ready  , core: true}
      - {id: 06-logistic,     title: "Логистическая регрессия и вероятности", minutes: 60, status: ready  , core: true}
      - {id: 06b-probabilities, title: "Что делать с вероятностями: ранжирование и калибровка", minutes: 25, status: ready  , split_from: 06-logistic, core: true}
      - {id: 07-regression,   title: "Регрессия: сколько минут",             minutes: 85, status: ready  , core: true}
      - {id: 08-validation,   title: Честное сравнение моделей,              minutes: 80, status: ready  , core: true}
      - {id: 08b-groups-speed, title: "Групповое разбиение и цена модели", minutes: 50, status: ready  , split_from: 08-validation, core: true}
      - {id: 09-project,      title: "Проект: кто из гостей уйдёт",          minutes: 90, status: ready  , core: true}
  - id: ch07
    title: "Признаки, метрики и Pipeline"
    goal: Оценивать модели метриками, которые важны бизнесу, справляться с дисбалансом классов, строить признаки и собирать всё в воспроизводимый конвейер с подбором гиперпараметров.
    display: true
    lessons:
      - {id: 01-confusion,  title: Матрица ошибок,                          minutes: 75, status: ready  , core: true}
      - {id: 02-precision-recall, title: "Precision, recall и F1",          minutes: 85, status: ready  , core: true}
      - {id: 03-threshold,  title: "Порог, PR- и ROC-кривые",               minutes: 75, status: ready  , core: true}
      - {id: 03b-money-threshold, title: "Порог по деньгам", minutes: 25, status: ready  , split_from: 03-threshold, core: true}
      - {id: 04-imbalance,  title: Дисбаланс классов,                       minutes: 90, status: ready  , core: true}
      - {id: 05-scaling,    title: "Масштабирование и ближайшие соседи",    minutes: 70, status: ready  , core: true}
      - {id: 05b-regularization, title: "Регуляризация: штраф за большие веса", minutes: 30, status: ready  , split_from: 05-scaling, core: true}
      - {id: 06-features,   title: Новые признаки,                          minutes: 35, status: ready  , core: true}
      - {id: 06b-feature-check, title: "Форма связи и важность признаков", minutes: 70, status: ready  , split_from: 06-features, core: true}
      - {id: 07-pipeline,   title: "Pipeline: предобработка и модель вместе", minutes: 70, status: ready  , core: true}
      - {id: 07b-own-steps, title: "Свои шаги конвейера: порядок категорий, функции и свой класс", minutes: 70, status: ready  , split_from: 07-pipeline}
      - {id: 08-tuning,     title: Подбор гиперпараметров,                  minutes: 85, status: ready  , core: true}
      - {id: 09-project,    title: "Проект: какие заявки довести до договора", minutes: 90, status: ready  , core: true}
  - id: ch08
    title: ML для бизнес-решений
    goal: Превращать прогнозы в решения с деньгами и риском — порог по прибыли, бюджет, бутстрэп убытков, мониторинг модели после запуска и понятные объяснения для бизнеса.
    display: true
    lessons:
      - {id: 01-value,      title: "Из прогноза — в деньги",            minutes: 80, status: ready  , core: true}
      - {id: 01a-pilot, title: "Пилот и P&L: что обещала модель и что вышло", minutes: 25, status: ready  , split_from: 01b-metric-tree, core: true}
      - {id: 01b-metric-tree, title: "Дерево метрик: откуда взялось изменение выручки", minutes: 30, status: ready  }
      - {id: 02-budget,     title: Когда бюджет ограничен,             minutes: 75, status: ready  , core: true}
      - {id: 03-risk,       title: "Риск: сколько можно потерять",      minutes: 85, status: ready  }
      - {id: 04-monitoring, title: "Модель в работе: мониторинг",       minutes: 65, status: ready  }
      - {id: 04b-segments, title: "Качество по сегментам и отчёт о метрике", minutes: 50, status: ready  , split_from: 04-monitoring}
      - {id: 05-explain,    title: Объяснить модель бизнесу,           minutes: 75, status: ready  , core: true}
      - {id: 05b-fairness, title: "Этика данных и справедливость модели", minutes: 30, status: ready  , split_from: 05-explain, core: true}
      - {id: 06-project,    title: "Проект: где поставить кофейные автоматы", minutes: 90, status: ready  , core: true}
      - {id: 07-final-project, title: "Итоговый проект: от базы данных до рекомендаций", minutes: 240, status: ready  , core: true}
  - id: ch09
    title: Линейная алгебра для ML
    goal: Видеть за моделями векторы и матрицы — скалярное произведение, умножение матриц, обратную матрицу и нормальное уравнение — и понимать, что они дают на практике.
    display: true
    lessons:
      - {id: 01-vectors,         title: Векторы,                                 minutes: 65, status: ready  }
      - {id: 02-matrices,        title: Матрицы,                                 minutes: 60, status: ready  }
      - {id: 02b-vectorize, title: "Без циклов: векторизация и замер времени", minutes: 40, status: ready  , split_from: 02-matrices}
      - {id: 03-normal-equation, title: Как обучается линейная регрессия,        minutes: 70, status: ready  }
      - {id: 03b-own-model, title: "Своя модель: класс с fit и predict", minutes: 40, status: ready  , split_from: 03-normal-equation}
      - {id: 04-transform,       title: Преобразовать признаки матрицей,         minutes: 65, status: ready  }
      - {id: 05-project,         title: "Проект: спрятать анкеты и не потерять модель", minutes: 80, status: ready  }
  - id: ch10
    title: Градиентный спуск и бустинг
    goal: Понимать, как модели учатся шагами по градиенту, собрать градиентный бустинг своими руками и уметь настраивать его так, чтобы он не переобучался.
    display: true
    lessons:
      - {id: 01-gradient,  title: "Градиентный спуск: шаг за шагом к минимуму", minutes: 65, status: ready  }
      - {id: 01b-numeric, title: "Численные методы: цена формулы и деление пополам", minutes: 55, status: ready  , split_from: 01-gradient}
      - {id: 02-gd-many,   title: Спуск для многих признаков,              minutes: 80, status: ready  }
      - {id: 02b-optimizers, title: "Оптимизаторы: инерция, Adam и затухание весов", minutes: 60, status: ready  , split_from: 02-gd-many}
      - {id: 03-boosting,  title: "Бустинг: каждое дерево исправляет ошибки предыдущих", minutes: 70, status: ready  }
      - {id: 04-tuning,    title: Настройка бустинга,                      minutes: 70, status: ready  }
      - {id: 05-project,   title: "Проект: прогноз дневной выручки",       minutes: 100, status: ready  }
      - {id: 06-libraries, title: "CatBoost и LightGBM в своём Jupyter", minutes: 40, status: ready  , split_from: 04-tuning}
  - id: ch11
    title: Нейросети
    goal: Понимать, как устроена и учится нейросеть, — от нейрона и обратного распространения ошибки на numpy до MLP в sklearn и кода на PyTorch.
    display: true
    lessons:
      - {id: 01-neuron,   title: Нейрон и слои,                                minutes: 70, status: ready  }
      - {id: 02-backprop, title: "Обучение сети: обратное распространение ошибки", minutes: 80, status: ready  }
      - {id: 02b-graph, title: "Граф вычислений, инициализация и обрезка градиента", minutes: 85, status: ready  , split_from: 02-backprop}
      - {id: 03-mlp,      title: "Нейросеть в sklearn: MLP",                   minutes: 75, status: ready  }
      - {id: 04-pytorch,  title: "PyTorch: то же самое, но в промышленном масштабе", minutes: 55, status: ready  }
      - {id: 04b-softmax, title: "Softmax, выход под задачу и мини-батчи", minutes: 80, status: ready  , split_from: 04-pytorch}
      - {id: 04c-debug, title: "Dropout, BatchNorm и smoke-test", minutes: 55, status: ready  , split_from: 04-pytorch}
      - {id: 05-project,  title: "Проект: распознать цифры в бумажных анкетах", minutes: 75, status: ready  }
  - id: ch12
    title: Временные ряды
    goal: Работать с рядами во времени — частоты, скользящие окна, тренд и сезонность, признаки без утечек, честная проверка по времени — и строить прогноз, полезный для решения.
    display: true
    lessons:
      - {id: 01-resample,  title: "Временной ряд: индекс-дата, resample и скользящие окна", minutes: 60, status: ready  }
      - {id: 02-decompose, title: "Тренд, сезонность и остаток",           minutes: 65, status: ready  }
      - {id: 03-features,  title: Признаки для прогноза ряда,             minutes: 60, status: ready  }
      - {id: 03b-time-split, title: "Проверка по времени: хвост ряда и TimeSeriesSplit", minutes: 30, status: ready  , split_from: 03-features}
      - {id: 04-forecast,  title: "Прогноз: ориентиры, горизонт и метрики", minutes: 60, status: ready  }
      - {id: 05-project,   title: "Проект: сколько бариста поставить на смену", minutes: 90, status: ready  }
  - id: ch13
    title: "Тексты: от TF-IDF до LLM"
    goal: Превращать тексты в признаки — токены, мешок слов, TF-IDF, эмбеддинги, — обучать классификаторы отзывов, размечать тексты языковой моделью и проверять её, а затем отвечать на бизнес-вопрос по тысячам неразмеченных отзывов.
