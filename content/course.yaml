      - {id: 02-split,        title: "Обучающая и тестовая выборки",          minutes: 75, status: ready  , skeleton: "ч. 5 выборки, переобучение", core: true}
      - {id: 03-tree,         title: Решающее дерево изнутри,                minutes: 75, status: ready  , skeleton: "ч. 5 решающее дерево", core: true}
      - {id: 04-categorical,  title: "Категориальные признаки и утечки",      minutes: 70, status: ready  , skeleton: "нет в скелете", core: true}
      - {id: 05-forest,       title: Случайный лес,                          minutes: 80, status: ready  , skeleton: "ч. 5 случайный лес", core: true}
      - {id: 06-logistic,     title: "Логистическая регрессия и вероятности", minutes: 55, status: ready  , skeleton: "ч. 5 логистическая регрессия", core: true}
      - {id: 06b-probabilities, title: "Что делать с вероятностями: ранжирование и калибровка", minutes: 45, status: ready  , skeleton: "выделено из 06-logistic", core: true}
      - {id: 07-regression,   title: "Регрессия: сколько минут",             minutes: 80, status: ready  , skeleton: "ч. 5 регрессия", core: true}
      - {id: 08-validation,   title: Честное сравнение моделей,              minutes: 80, status: ready  , skeleton: "ч. 5 валидация, гиперпараметры", core: true}
      - {id: 08b-groups-speed, title: "Групповое разбиение и цена модели", minutes: 60, status: ready  , skeleton: "выделено из 08-validation", core: true}
      - {id: 09-project,      title: "Проект: кто из гостей уйдёт",          minutes: 85, status: ready  , skeleton: "ч. 5 проект (своя тема)", core: true}
