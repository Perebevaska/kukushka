  - id: ch08
    title: ML для бизнес-решений
    skeleton: "ч. 7"
    goal: Превращать прогнозы в решения с деньгами и риском — порог по прибыли, бюджет, бутстрэп убытков, мониторинг модели после запуска и понятные объяснения для бизнеса.
